le">evidence</text><text x="1190" y="410" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#071D43" text-anchor="middle">grounding gate</text><text x="1190" y="470" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#506584" text-anchor="middle">source + version + raw ROI</text><path d="M1335 405 L1460 330" fill="none" stroke="#159A63" stroke-width="6" stroke-linecap="round" marker-end="url(#a-159A63)"/><path d="M1335 405 L1460 555" fill="none" stroke="#D9485F" stroke-width="6" stroke-linecap="round" marker-end="url(#a-D9485F)"/><rect x="1480" y="235" width="135" height="185" rx="26" fill="#EAF8EF" stroke="#159A63" stroke-width="3"/><text x="1548" y="296" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0A6644" text-anchor="middle">named</text><text x="1548" y="325" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0A6644" text-anchor="middle">detector /</text><text x="1548" y="354" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0A6644" text-anchor="middle">specialist</text><text x="1548" y="383" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0A6644" text-anchor="middle">review</text><rect x="1480" y="495" width="135" height="140" rx="26" fill="#FFF0F2" stroke="#D9485F" stroke-width="3"/><text x="1548" y="543" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9485F" text-anchor="middle">evidence</text><text x="1548" y="568" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9485F" text-anchor="middle">missing</text><text x="1548" y="593" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9485F" text-anchor="middle">→ abstain / HOLD</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">重點：schema 可規範回答格式；只有可追溯的來源、raw evidence 與具名 owner 才能支撐下一步。</text></svg>