<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><marker id="a-1769E0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1769E0"/></marker><marker id="a-00A9C7" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#00A9C7"/></marker><marker id="a-F38B00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#F38B00"/></marker><marker id="a-D9485F" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#D9485F"/></marker><marker id="a-159A63" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#159A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#082554"/><rect x="1282" y="33" width="346" height="50" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1455" y="66" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">LLAVA · REPLAY COUNTERFACTUAL</text><text x="40" y="108" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="39" font-weight="900" fill="#071D43" text-anchor="start">第三步：同一張 AOI、同一問題，換 context 或來源版本，claim 也可能改變</text><text x="40" y="153" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="550" fill="#506584" text-anchor="start">這不是模型『看懂更多』的證據，而是一個需要保存 prompt、RAG、ACL、tool policy 與版本的反事實。</text><clipPath id="clip-55-245"><rect x="55" y="245" width="380" height="470" rx="26"/></clipPath><g clip-path="url(#clip-55-245)"><image href="llava-industrial-question-contract-anchor_v02.png" x="55" y="245" width="380" height="470" preserveAspectRatio="xMidYMid slice"/></g><rect x="55" y="245" width="380" height="470" rx="26" fill="none" stroke="#1769E0" stroke-width="3"/><text x="245" y="285" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#071D43" text-anchor="middle">same pixels + same question</text><path d="M470 460 L565 360" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><path d="M470 460 L565 590" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><rect x="600" y="235" width="400" height="240" rx="28" fill="#E9FBFF" stroke="#00A9C7" stroke-width="3"/><text x="800" y="292" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">A · locked, approved context</text><rect x="650" y="345" width="300" height="49" rx="16" fill="#FFFFFF" stroke="#00A9C7" stroke-width="2"/><text x="800.0" y="377" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#071D43" text-anchor="middle">versioned SOP + ACL + schema</text><text x="800" y="435" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="850" fill="#0A6375" text-anchor="middle">replayable answer + cited source</text><rect x="600" y="535" width="400" height="240" rx="28" fill="#FFF0F2" stroke="#D9485F" stroke-width="3"/><text x="800" y="592" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#D9485F" text-anchor="middle">B · changed / unsafe context</text><rect x="650" y="645" width="300" height="49" rx="16" fill="#FFFFFF" stroke="#D9485F" stroke-width="2"/><text x="800.0" y="677" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#071D43" text-anchor="middle">stale RAG · injection · tool change</text><text x="800" y="735" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="850" fill="#D9485F" text-anchor="middle">same pixels can yield another claim</text><path d="M1035 355 L1150 355" fill="none" stroke="#159A63" stroke-width="6" stroke-linecap="round" marker-end="url(#a-159A63)"/><path d="M1035 655 L1150 655" fill="none" stroke="#D9485F" stroke-width="6" stroke-linecap="round" marker-end="url(#a-D9485F)"/><rect x="1180" y="215" width="430" height="290" rx="30" fill="#EAF8EF" stroke="#159A63" stroke-width="3"/><text x="1395" y="282" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#0A6644" text-anchor="middle">save request / response hash</text><text x="1395" y="330" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#0A6644" text-anchor="middle">source version + ACL</text><text x="1395" y="378" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#0A6644" text-anchor="middle">specialist can replay</text><rect x="1180" y="555" width="430" height="220" rx="30" fill="#FFF0F2" stroke="#D9485F" stroke-width="3"/><text x="1395" y="620" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#D9485F" text-anchor="middle">do not trust the wording</text><text x="1395" y="665" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#D9485F" text-anchor="middle">block tool action</text><text x="1395" y="710" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#D9485F" text-anchor="middle">HOLD + security / source audit</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">重點：同一影像不等於同一決策；context、來源與權限是產生 claim 的一部分，改了就要重新 qualification。</text></svg>