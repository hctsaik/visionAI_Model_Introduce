e UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506584" text-anchor="start">can own position</text><circle cx="1080" cy="414" r="18" fill="#00A9C7"/><text x="1120" y="422" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#071D43" text-anchor="start">detector / AD</text><text x="1120" y="449" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506584" text-anchor="start">can own candidate score</text><circle cx="1080" cy="501" r="18" fill="#F38B00"/><text x="1120" y="509" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#071D43" text-anchor="start">metrology</text><text x="1120" y="536" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506584" text-anchor="start">can own measurement</text><circle cx="1080" cy="588" r="18" fill="#159A63"/><text x="1120" y="596" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#071D43" text-anchor="start">specialist / reviewer</text><text x="1120" y="623" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506584" text-anchor="start">can own final action</text><rect x="1055" y="676" width="480" height="42" rx="16" fill="#FFF0F2" stroke="#D9485F" stroke-width="2"/><text x="1295" y="704" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D9485F" text-anchor="middle">missing owner, source, grounding or abstention → HOLD</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">重點：LLaVA 不能取代定位、量測、缺陷認證或 production release；它的價值是把可追溯問題交給正確的人與工具。</text></svg>