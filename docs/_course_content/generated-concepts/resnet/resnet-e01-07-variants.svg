<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12Z" fill="#0754b8"/></marker></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#fff" stroke="none" stroke-width="2"/><text x="50" y="78" font-size="47" fill="#173650" font-weight="800" text-anchor="start">加深之前，先看哪個候選能過需求</text><text x="50" y="127" font-size="26" fill="#087f85" font-weight="500" text-anchor="start">假設驗收紀錄 · A/B/C不是實際效能排名</text><rect x="40" y="839" width="1592" height="80" rx="12" fill="#fff3d5" stroke="#e9c878" stroke-width="2"/><text x="65" y="872" font-size="31" fill="#173650" font-weight="700" text-anchor="start">同一留出集與硬體，先篩掉漏檢或超時候選，再比較覆核量；不要只按深度選模型。</text><text x="70" y="172" font-size="29" fill="#173650" font-weight="500" text-anchor="start">示例需求：同一 100 件測試品漏檢 ≤2 件，P95 ≤20ms。</text><text x="70" y="219" font-size="31" fill="#173650" font-weight="700" text-anchor="start">候選</text><text x="387" y="219" font-size="31" fill="#173650" font-weight="700" text-anchor="start">漏檢 /100</text><text x="725" y="219" font-size="31" fill="#173650" font-weight="700" text-anchor="start">P95</text><text x="1000" y="219" font-size="31" fill="#173650" font-weight="700" text-anchor="start">覆核 /100</text><text x="1309" y="219" font-size="31" fill="#173650" font-weight="700" text-anchor="start">判斷</text><rect x="50" y="259" width="1560" height="128" rx="12" fill="#f3f6fa" stroke="none" stroke-width="2"/><text x="70" y="320" font-size="38" fill="#173650" font-weight="700" text-anchor="start">A /18</text><text x="387" y="320" font-size="38" fill="#173650" font-weight="700" text-anchor="start">4</text><text x="725" y="320" font-size="38" fill="#173650" font-weight="700" text-anchor="start">12ms</text><text x="1000" y="320" font-size="38" fill="#173650" font-weight="700" text-anchor="start">10</text><text x="1309" y="320" font-size="38" fill="#173650" font-weight="700" text-anchor="start">漏檢</text><rect x="387" y="342" width="22" height="24" rx="3" fill="#bc3543" stroke="none" stroke-width="2"/><rect x="417" y="342" width="22" height="24" rx="3" fill="#bc3543" stroke="none" stroke-width="2"/><rect x="447" y="342" width="22" height="24" rx="3" fill="#bc3543" stroke="none" stroke-width="2"/><rect x="477" y="342" width="22" height="24" rx="3" fill="#bc3543" stroke="none" stroke-width="2"/><rect x="725" y="345" width="88.0" height="15" rx="2" fill="#0754b8" stroke="none" stroke-width="2"/><path d="M871.6666666666666,333 L871.6666666666666,371" fill="none" stroke="#bc3543" stroke-width="2"/><rect x="50" y="436" width="1560" height="128" rx="12" fill="#edf7f4" stroke="none" stroke-width="2"/><text x="70" y="497" font-size="38" fill="#087f85" font-weight="700" text-anchor="start">B /50</text><text x="387" y="497" font-size="38" fill="#087f85" font-weight="700" text-anchor="start">1</text><text x="725" y="497" font-size="38" fill="#087f85" font-weight="700" text-anchor="start">18ms</text><text x="1000" y="497" font-size="38" fill="#087f85" font-weight="700" text-anchor="start">25</text><text x="1309" y="497" font-size="38" fill="#087f85" font-weight="700" text-anchor="start">可選</text><rect x="387" y="519" width="22" height="24" rx="3" fill="#bc3543" stroke="none" stroke-width="2"/><rect x="725" y="522" width="132.0" height="15" rx="2" fill="#0754b8" stroke="none" stroke-width="2"/><path d="M871.6666666666666,510 L871.6666666666666,548" fill="none" stroke="#bc3543" stroke-width="2"/><rect x="50" y="613" width="1560" height="128" rx="12" fill="#f3f6fa" stroke="none" stroke-width="2"/><text x="70" y="674" font-size="38" fill="#173650" font-weight="700" text-anchor="start">C /101</text><text x="387" y="674" font-size="38" fill="#173650" font-weight="700" text-anchor="start">1</text><text x="725" y="674" font-size="38" fill="#173650" font-weight="700" text-anchor="start">30ms</text><text x="1000" y="674" font-size="38" fill="#173650" font-weight="700" text-anchor="start">20</text><text x="1309" y="674" font-size="38" fill="#173650" font-weight="700" text-anchor="start">超時</text><rect x="387" y="696" width="22" height="24" rx="3" fill="#bc3543" stroke="none" stroke-width="2"/><rect x="725" y="699" width="220.0" height="15" rx="2" fill="#b85a00" stroke="none" stroke-width="2"/><path d="M871.6666666666666,687 L871.6666666666666,725" fill="none" stroke="#bc3543" stroke-width="2"/><text x="70" y="803" font-size="31" fill="#173650" font-weight="500" text-anchor="start">紅塊：漏掉的缺陷件；紅線：20ms 上限。</text></svg>