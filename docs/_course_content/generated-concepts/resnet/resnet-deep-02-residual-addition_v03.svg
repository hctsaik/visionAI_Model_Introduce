<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs>
      <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
        <path d="M0,0 L12,6 L0,12 Z" fill="#0B57C7"/>
      </marker>
      <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
        <path d="M0,0 L12,6 L0,12 Z" fill="#F59E0B"/>
      </marker>
    </defs><rect width="1672" height="941" fill="#F4F8FF"/><rect width="1672" height="8" fill="#173A5E"/><rect x="1320" y="34" width="312" height="42" rx="21" fill="#FFFFFF" stroke="#0B57C7" stroke-width="2"/><text x="1476.0" y="62.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="850" fill="#0B57C7" text-anchor="middle">C · ENGINEER + AI STORY</text><text x="42" y="91.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="39" font-weight="900" fill="#101820" text-anchor="start">殘差塊不是『找殘差』：它學的是 F(x)，再與 x 相加</text><text x="42" y="139.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="650" fill="#5B6675" text-anchor="start">shortcut 建立直接的訊號與梯度路徑；只有 shape 相容時，兩條路才能逐元素相加。</text><rect x="46" y="184" width="246" height="42" rx="21" fill="#FFFFFF" stroke="#0B57C7" stroke-width="2"/><text x="169.0" y="212.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="850" fill="#0B57C7" text-anchor="middle">主故事 · identity</text><rect x="48" y="244" width="1060" height="520" rx="28" fill="#FFFFFF" stroke="#9FC2F2" stroke-width="2"/><rect x="92" y="402" width="166" height="112" rx="20" fill="#ECF4FF" stroke="#0B57C7" stroke-width="2"/><text x="175" y="452.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="28" font-weight="900" fill="#0B57C7" text-anchor="middle">輸入 x</text><text x="175" y="489.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="19" font-weight="700" fill="#5B6675" text-anchor="middle">H × W × C</text><path d="M274 458 L370 458" fill="none" stroke="#0B57C7" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="390" y="315" width="318" height="216" rx="24" fill="#F7F4FF" stroke="#7C3FB2" stroke-width="2"/><text x="549" y="368.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="27" font-weight="900" fill="#7C3FB2" text-anchor="middle">學習分支 F(x)</text><rect x="438" y="404" width="222" height="48" rx="14" fill="#FFFFFF" stroke="#7C3FB2" stroke-width="2"/><text x="549" y="435.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#173A5E" text-anchor="middle">Conv → BN → ReLU</text><rect x="438" y="468" width="222" height="48" rx="14" fill="#FFFFFF" stroke="#7C3FB2" stroke-width="2"/><text x="549" y="499.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#173A5E" text-anchor="middle">Conv → BN</text><path d="M722 422 L842 422" fill="none" stroke="#7C3FB2" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M258 512 C430 678, 700 678, 844 520" fill="none" stroke="#0B57C7" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/><text x="548" y="690.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="22" font-weight="850" fill="#0B57C7" text-anchor="middle">identity shortcut：x 原樣繞過學習分支</text><rect x="854" y="402" width="78" height="78" rx="39" fill="#EBF8F0" stroke="#1F9D55" stroke-width="3"/><text x="893" y="451.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="38" font-weight="900" fill="#1F9D55" text-anchor="middle">+</text><path d="M944 442 L1018 442" fill="none" stroke="#1F9D55" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1024" y="425.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="900" fill="#173A5E" text-anchor="end">y = F(x) + x</text><text x="1024" y="470.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="19" font-weight="700" fill="#5B6675" text-anchor="end">再經 activation</text><rect x="1162" y="184" width="298" height="42" rx="21" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/><text x="1311.0" y="212.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="850" fill="#F59E0B" text-anchor="middle">SIDE RAIL · shape 改變</text><rect x="1162" y="244" width="468" height="520" rx="28" fill="#FFF9EC" stroke="#F59E0B" stroke-width="2"/><text x="1198" y="306.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="900" fill="#F59E0B" text-anchor="start">何時不能直接加？</text><text x="1198" y="352.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="750" fill="#173A5E" text-anchor="start">• stride 讓 H、W 改變</text><text x="1198" y="394.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="750" fill="#173A5E" text-anchor="start">• stage 切換讓 channels 改變</text><path d="M1396 430 L1396 494" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-orange)"/><rect x="1230" y="512" width="332" height="96" rx="18" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/><text x="1396" y="550.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="22" font-weight="900" fill="#F59E0B" text-anchor="middle">projection shortcut</text><text x="1396" y="583.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="19" font-weight="750" fill="#173A5E" text-anchor="middle">1×1 Conv（必要時 stride）</text><path d="M1396 620 L1396 676" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-orange)"/><text x="1396" y="713.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="22" font-weight="900" fill="#1F9D55" text-anchor="middle">對齊 shape 後再相加</text><rect x="42" y="850" width="1588" height="53" rx="18" fill="#FFF4CC" stroke="#E8B52A" stroke-width="2"/><text x="72" y="884.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#6A4800" text-anchor="start">💡 工程 takeaway</text><text x="270" y="884.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="750" fill="#6A4800" text-anchor="start">shortcut 解決深層網路的最佳化路徑，不代表微小缺陷一定會被保留下來。</text></svg>