<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs>
      <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1769E0"/></marker>
      <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#F38B00"/></marker>
    </defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#0A2455"/><rect x="1310" y="32" width="320" height="48" rx="24" fill="#FFFFFF" stroke="#A7C9FF" stroke-width="2"/><text x="1470" y="63.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">KNOWN-CLASS BASELINE</text><text x="40" y="106.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="40" font-weight="900" fill="#0A2455" text-anchor="start">ResNet 的關鍵不是「方塊很多」，而是每層都保留原訊號</text><text x="40" y="148.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="550" fill="#52647F" text-anchor="start">每個 residual block 讓主路徑學 F(x)，同時讓 shortcut 把 x 帶到相加點。</text><rect x="52" y="220" width="710" height="510" rx="28" fill="#FFFFFF" stroke="#A7C9FF" stroke-width="2"/><text x="88" y="275.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="28" font-weight="900" fill="#0A2455" text-anchor="start">同一張固定 ROI，先走主路徑</text><clipPath id="crop-residual-input"><rect x="90" y="308" width="226" height="300" rx="24"/></clipPath><g clip-path="url(#crop-residual-input)"><image href="resnet-beginner-01-known-class-case_v01.png" x="90" y="308" width="226" height="300" preserveAspectRatio="xMidYMid slice"/></g><rect x="90" y="308" width="226" height="300" rx="24" fill="none" stroke="#1769E0" stroke-width="2"/><text x="203" y="644.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="800" fill="#0A2455" text-anchor="middle">固定 ROI</text><rect x="387" y="338" width="250" height="110" rx="20" fill="#EEF6FF" stroke="#10A9C8" stroke-width="2"/><text x="512" y="382.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="24" font-weight="850" fill="#0A2455" text-anchor="middle">卷積主路徑 F(x)</text><text x="512" y="417.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="650" fill="#52647F" text-anchor="middle">抽取並修正 feature</text><path d="M319 427 L381 394" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="674" y="440" width="62" height="62" rx="31" fill="#E8F8F0" stroke="#149A61" stroke-width="2"/><text x="705" y="480.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="37" font-weight="900" fill="#149A61" text-anchor="middle">+</text><path d="M639 393 L668 464" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M317 472 C472 650, 612 650, 674 502" fill="none" stroke="#1769E0" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><text x="502" y="695.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="850" fill="#1769E0" text-anchor="middle">shortcut：把原來的 x 一起帶到相加點</text><text x="705" y="545.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#0A2455" text-anchor="middle">F(x) + x</text><rect x="845" y="220" width="775" height="510" rx="28" fill="#FFFFFF" stroke="#A7C9FF" stroke-width="2"/><text x="885" y="274.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="28" font-weight="900" fill="#0A2455" text-anchor="start">把這件事重複成 hierarchy</text><rect x="900" y="365" width="155" height="170" rx="14" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><line x1="900" y1="407.5" x2="1055" y2="407.5" stroke="#78A9F4" stroke-width="2"/><line x1="900" y1="450.0" x2="1055" y2="450.0" stroke="#78A9F4" stroke-width="2"/><line x1="900" y1="492.5" x2="1055" y2="492.5" stroke="#78A9F4" stroke-width="2"/><line x1="938.75" y1="365" x2="938.75" y2="535" stroke="#78A9F4" stroke-width="2"/><line x1="977.5" y1="365" x2="977.5" y2="535" stroke="#78A9F4" stroke-width="2"/><line x1="1016.25" y1="365" x2="1016.25" y2="535" stroke="#78A9F4" stroke-width="2"/><text x="977.5" y="578.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="800" fill="#0A2455" text-anchor="middle">stage 1</text><path d="M1067 450.0 L1093 450.0" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1105" y="350" width="120" height="132" rx="14" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><line x1="1105" y1="383.0" x2="1225" y2="383.0" stroke="#78A9F4" stroke-width="2"/><line x1="1105" y1="416.0" x2="1225" y2="416.0" stroke="#78A9F4" stroke-width="2"/><line x1="1105" y1="449.0" x2="1225" y2="449.0" stroke="#78A9F4" stroke-width="2"/><line x1="1135.0" y1="350" x2="1135.0" y2="482" stroke="#78A9F4" stroke-width="2"/><line x1="1165.0" y1="350" x2="1165.0" y2="482" stroke="#78A9F4" stroke-width="2"/><line x1="1195.0" y1="350" x2="1195.0" y2="482" stroke="#78A9F4" stroke-width="2"/><text x="1165.0" y="525.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="800" fill="#0A2455" text-anchor="middle">stage 2</text><path d="M1237 416.0 L1298 416.0" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1310" y="335" width="92" height="100" rx="14" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><line x1="1310" y1="360.0" x2="1402" y2="360.0" stroke="#78A9F4" stroke-width="2"/><line x1="1310" y1="385.0" x2="1402" y2="385.0" stroke="#78A9F4" stroke-width="2"/><line x1="1310" y1="410.0" x2="1402" y2="410.0" stroke="#78A9F4" stroke-width="2"/><line x1="1333.0" y1="335" x2="1333.0" y2="435" stroke="#78A9F4" stroke-width="2"/><line x1="1356.0" y1="335" x2="1356.0" y2="435" stroke="#78A9F4" stroke-width="2"/><line x1="1379.0" y1="335" x2="1379.0" y2="435" stroke="#78A9F4" stroke-width="2"/><text x="1356.0" y="478.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="800" fill="#0A2455" text-anchor="middle">stage 3</text><text x="1230" y="596.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="25" font-weight="700" fill="#52647F" text-anchor="middle">逐步把空間紋理整理成</text><text x="1230" y="628.5" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="25" font-weight="700" fill="#52647F" text-anchor="middle">更抽象的 feature</text><rect x="40" y="850" width="1592" height="52" rx="20" fill="#FFF4CC" stroke="#F0B52B" stroke-width="2"/><text x="75" y="883.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="start">重點：shortcut 不是 defect residual；它讓深層 CNN 學「修正」，而不是每層重新抄一次輸入。</text></svg>