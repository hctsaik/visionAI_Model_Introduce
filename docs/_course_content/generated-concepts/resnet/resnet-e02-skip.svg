<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12Z" fill="#0754b8"/></marker></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#fff" stroke="none" stroke-width="2"/><text x="50" y="78" font-size="47" fill="#173650" font-weight="800" text-anchor="start">Skip connection：多一條直接路徑</text><text x="50" y="127" font-size="26" fill="#087f85" font-weight="500" text-anchor="start">基本殘差塊示意 · 設定特徵值，非模型推論</text><rect x="40" y="839" width="1592" height="80" rx="12" fill="#fff3d5" stroke="#e9c878" stroke-width="2"/><text x="65" y="872" font-size="31" fill="#173650" font-weight="700" text-anchor="start">Skip connection（跳接）跨過若干層，把輸入直接送到相加點；主路徑仍學習修正。</text><text x="40" y="171" font-size="28" fill="#173650" font-weight="800" text-anchor="start">普通塊：一條路</text><text x="358" y="171" font-size="28" fill="#173650" font-weight="800" text-anchor="start">殘差塊：兩條路</text><rect x="42" y="195" width="236" height="58" rx="12" fill="#eef5fc" stroke="#c3d5e5" stroke-width="2"/><text x="160.0" y="234" font-size="25" fill="#173650" font-weight="700" text-anchor="middle">特徵 x = [2,1,3]</text><path d="M160,255 L160,303" fill="none" stroke="#0754b8" stroke-width="4" marker-end="url(#arrow)"/><rect x="42" y="308" width="236" height="58" rx="12" fill="#eef5fc" stroke="#c3d5e5" stroke-width="2"/><text x="160.0" y="347" font-size="27" fill="#173650" font-weight="700" text-anchor="middle">卷積 → ReLU</text><path d="M160,368 L160,413" fill="none" stroke="#0754b8" stroke-width="4" marker-end="url(#arrow)"/><rect x="42" y="418" width="236" height="58" rx="12" fill="#eef5fc" stroke="#c3d5e5" stroke-width="2"/><text x="160.0" y="457" font-size="28" fill="#173650" font-weight="700" text-anchor="middle">卷積</text><rect x="360" y="195" width="236" height="58" rx="12" fi