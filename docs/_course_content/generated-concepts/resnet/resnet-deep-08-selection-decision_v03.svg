        <path d="M0,0 L12,6 L0,12 Z" fill="#0B57C7"/>
      </marker>
      <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
        <path d="M0,0 L12,6 L0,12 Z" fill="#F59E0B"/>
      </marker>
    </defs><rect width="1672" height="941" fill="#F4F8FF"/><rect width="1672" height="8" fill="#173A5E"/><rect x="1320" y="34" width="312" height="42" rx="21" fill="#FFFFFF" stroke="#0B57C7" stroke-width="2"/><text x="1476.0" y="62.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="850" fill="#0B57C7" text-anchor="middle">D · FAIR COMPARISON</text><text x="42" y="91.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="39" font-weight="900" fill="#101820" text-anchor="start">同一個已知類別任務：先公平比較，再決定 backbone</text><text x="42" y="139.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="650" fill="#5B6675" text-anchor="start">ResNet、ConvNeXt、ViT 都能輸出 logits；選型差異來自表徵、資料條件與量產證據，不是名稱排名。</text><clipPath id="photo-selection"><rect x="48" y="222" width="310" height="472" rx="24"/></clipPath><image href="resnet-industrial-known-class-anchor_v03.png" x="48" y="222" width="310" height="472" preserveAspectRatio="xMidYMid slice" clip-path="url(#photo-selection)"/><rect x="48" y="222" width="310" height="472" rx="24" fill="none" stroke="#9FC2F2" stroke-width="3"/><text x="203" y="732.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="850" fill="#173A5E" text-anchor="middle">同一 ROI / labels / split</text><path d="M374 458 L448 458" fill="none" stroke="#0B57C7" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="464" y="238" width="328" height="342" rx="24" fill="#FFFFFF" stroke="#0B57C7" stroke-width="3"/><text x="628" y="294.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="27" font-weight="900" fill="#0B57C7" text-anchor="middle">ResNet</text><rect x="520" y="326" width="216" height="42" rx="21" fill="#FFFFFF" stroke="#0B57C7" stroke-width="2"/><text x="628.0" y="354.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="850" fill="#0B57C7" text-anchor="middle">residual CNN</text><text x="628" y="420.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="750" fill="#173A5E" text-anchor="middle">成熟 baseline</text><text x="628" y="445.6" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="750" fill="#173A5E" text-anchor="middle">工具鏈完整</text><text x="628" y="528.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="850" fill="#0B57C7" text-anchor="middle">→ known-class logits</text><rect x="832" y="238" width="328" height="342" rx="24" fill="#FFFFFF" stroke="#0F9DB5" stroke-width="3"/><text x="996" y="294.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="27" font-weight="900" fill="#0F9DB5" text-anchor="middle">ConvNeXt</text><rect x="888" y="326" width="216" height="42" rx="21" fill="#FFFFFF" stroke="#0F9DB5" stroke-width="2"/><text x="996.0" y="354.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="850" fill="#0F9DB5" text-anchor="middle">modern ConvNet</text><text x="996" y="420.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="750" fill="#173A5E" text-anchor="middle">large-kernel</text><text x="996" y="445.6" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="750" fill="#173A5E" text-anchor="middle">channel mixing</text><text x="996" y="528.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="850" fill="#0F9DB5" text-anchor="middle">→ known-class logits</text><rect x="1200" y="238" width="328" height="342" rx="24" fill="#FFFFFF" stroke="#7C3FB2" stroke-width="3"/><text x="1364" y="294.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="27" font-weight="900" fill="#7C3FB2" text-anchor="middle">ViT</text><rect x="1256" y="326" width="216" height="42" rx="21" fill="#FFFFFF" stroke="#7C3FB2" stroke-width="2"/><text x="1364.0" y="354.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="850" fill="#7C3FB2" text-anchor="middle">patch tokens</text><text x="1364" y="420.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="750" fill="#173A5E" text-anchor="middle">self-attention</text><text x="1364" y="445.6" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="750" fill="#173A5E" text-anchor="middle">依賴資料與預訓練</text><text x="1364" y="528.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="850" fill="#7C3FB2" text-anchor="middle">→ known-class logits</text><rect x="464" y="612" width="1064" height="118" rx="22" fill="#F1FBF7" stroke="#1F9D55" stroke-width="2"/><text x="996" y="654.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#1F9D55" text-anchor="middle">選 ResNet 當起點：固定 ROI、已知 labels、需要快速可稽核 baseline</text><text x="996" y="696.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="19" font-weight="800" fill="#173A5E" text-anchor="middle">公平 gate：critical recall · calibration · OOD · P95 · review load</text><rect x="464" y="748" width="1064" height="62" rx="18" fill="#FFF4F5" stroke="#E53935" stroke-width="2"/><text x="996" y="787.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#E53935" text-anchor="middle">HOLD：需要位置、輪廓、尺寸、未知異常，或 tiny signal 根本不可觀測</text><rect x="42" y="850" width="1588" height="53" rx="18" fill="#FFF4CC" stroke="#E8B52A" stroke-width="2"/><text x="72" y="884.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#6A4800" text-anchor="start">💡 工程 takeaway</text><text x="270" y="884.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="750" fill="#6A4800" text-anchor="start">先確認輸出責任與可觀測性；換 backbone 不能補回缺失的 pixels、labels 或定位監督。</text></svg>