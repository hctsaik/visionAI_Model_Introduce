 font-size="34" fill="#087f85" font-weight="800" text-anchor="middle">x</text><text x="646" y="365" font-size="25" fill="#087f85" font-weight="500" text-anchor="middle">不</text><text x="646" y="400" font-size="25" fill="#087f85" font-weight="500" text-anchor="middle">變</text><text x="365" y="521" font-size="25" fill="#b85a00" font-weight="500" text-anchor="start">F(x) = [0,2,-1]</text><path d="M478,628 L478,669" fill="none" stroke="#0754b8" stroke-width="4" marker-end="url(#arrow)"/><rect x="360" y="674" width="236" height="58" rx="12" fill="#eef5fc" stroke="#c3d5e5" stroke-width="2"/><text x="478.0" y="713" font-size="24" fill="#173650" font-weight="700" text-anchor="middle">[2,3,2] → ReLU</text><path d="M160,632 L160,669" fill="none" stroke="#0754b8" stroke-width="4" marker-end="url(#arrow)"/><rect x="42" y="674" width="236" height="58" rx="12" fill="#eef5fc" stroke="#c3d5e5" stroke-width="2"/><text x="160.0" y="713" font-size="25" fill="#173650" font-weight="700" text-anchor="middle">再經 ReLU</text><text x="35" y="783" font-size="27" fill="#173650" font-weight="700" text-anchor="start">若修正 F(x)=0：殘差路徑保留 [2,1,3]。</text></svg>