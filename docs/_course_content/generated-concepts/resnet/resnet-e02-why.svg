<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12Z" fill="#0754b8"/></marker></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#fff" stroke="none" stroke-width="2"/><text x="50" y="78" font-size="47" fill="#173650" font-weight="800" text-anchor="start">為何需要 ResNet？加深不一定學得好</text><text x="50" y="127" font-size="26" fill="#087f85" font-weight="500" text-anchor="start">依原論文 Fig.1 的現象作質性示意 · 非實測曲線</text><rect x="40" y="839" width="1592" height="80" rx="12" fill="#fff3d5" stroke="#e9c878" stroke-width="2"/><text x="65" y="872" font-size="31" fill="#173650" font-weight="700" text-anchor="start">ResNet針對深層網路的最佳化困難：保留直接路徑，讓新增層學修正；不是保證越深越準。</text><text x="38" y="173" font-size="29" fill="#173650" font-weight="700" text-anchor="start">想用更多層組合邊緣、紋理與形狀，</text><text x="38" y="216" font-size="29" fill="#173650" font-weight="700" text-anchor="start">卻可能連訓練資料都學得更差。</text><text x="40" y="293" font-size="26" fill="#173650" font-weight="700" text-anchor="start">訓練錯誤 ↑</text><path d="M90,688 L90,325" fill="none" stroke="#0754b8" stroke-width="4" marker-end="url(#arrow)"/><path d="M90,688 L655,688" fill="none" stroke="#0754b8" stroke-width="4" marker-end="url(#arrow)"/><path d="M105 345 C155 430 175 502 240 518 S420 531 620 533" stroke="#bc3543" stroke-width="7" fill="none"/><path d="M105 385 C150 520 195 592 255 610 S440 633 620 635" stroke="#0754b8" stroke-width="7" fill="none"/><text x="300" y="490" font-size="29" fill="#bc3543" font-weight="700" text-anchor="start">較深的普通網路</text><text x="325" y="601" font-size="29" fill="#0754b8" font-weight="700" text-anchor="start">較淺的普通網路</text><text x="334" y="733" font-size="26" fill="#173650" font-weight="500" text-anchor="start">訓練持續進行 →</text><text x="38" y="790" font-size="25" fill="#087f85" font-weight="500" text-anchor="start">同資料與訓練設定；示意未跳接的比較。</text><text x="815" y="185" font-size="35" fill="#173650" font-weight="800" text-anchor="start">為什麼這很反直覺？</text><text x="815" y="248" font-size="30" fill="#173650" font-weight="500" text-anchor="start">若新增層只傳回原值，理論上可以保留原能力。</text><text x="815" y="299" font-size="30" fill="#173650" font-weight="500" text-anchor="start">但「存在這個解」不等於訓練容易找到它。</text><rect x="815" y="370" width="290" height="58" rx="12" fill="#eef5fc" stroke="#c3d5e5" stroke-width="2"/><text x="960.0" y="409" font-size="28" fill="#173650" font-weight="700" text-anchor="middle">普通塊：學出 x</text><path d="M1120,399 L1220,399" fill="none" stroke="#0754b8" stroke-width="4" marker-end="url(#arrow)"/><rect x="1245" y="370" width="350" height="58" rx="12" fill="#eef5fc" stroke="#c3d5e5" stroke-width="2"/><text x="1420.0" y="409" font-size="28" fill="#173650" font-weight="700" text-anchor="middle">卷積串聯須學會傳回</text><rect x="815" y="490" width="290" height="58" rx="12" fill="#e5f4f0" stroke="#c3d5e5" stroke-width="2"/><text x="960.0" y="529" font-size="28" fill="#173650" font-weight="700" text-anchor="middle">殘差塊：x + 0</text><path d="M1120,519 L1220,519" fill="none" stroke="#0754b8" stroke-width="4" marker-end="url(#arrow)"/><rect x="1245" y="490" width="350" height="58" rx="12" fill="#e5f4f0" stroke="#c3d5e5" stroke-width="2"/><text x="1420.0" y="529" font-size="28" fill="#173650" font-weight="700" text-anchor="middle">直接路徑已保留 x</text><text x="815" y="630" font-size="30" fill="#173650" font-weight="500" text-anchor="start">改學修正，可以降低找到有用深層解的困難。</text><text x="815" y="687" font-size="30" fill="#173650" font-weight="500" text-anchor="start">訓練更順仍須檢查驗證集、延遲與漏檢；</text><text x="815" y="744" font-size="30" fill="#173650" font-weight="500" text-anchor="start">本站工件是否受益，需用同資料比較。</text></svg>