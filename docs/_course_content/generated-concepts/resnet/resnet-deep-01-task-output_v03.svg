ei, sans-serif" font-size="18" font-weight="700" fill="#5B6675" text-anchor="middle">示意分數 · 非校正結果</text><path d="M1028 472 L1084 472" fill="none" stroke="#0B57C7" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1100" y="246" width="530" height="230" rx="26" fill="#FFF9EC" stroke="#F59E0B" stroke-width="2"/><text x="1134" y="302.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="900" fill="#173A5E" text-anchor="start">允許的系統動作</text><text x="1134" y="350.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="800" fill="#1F9D55" text-anchor="start">已知類別 + 已驗證門檻 → PASS / FAIL</text><text x="1134" y="394.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="800" fill="#F59E0B" text-anchor="start">低信心、類別衝突、分布偏移 → REVIEW</text><rect x="1100" y="506" width="530" height="220" rx="26" fill="#FFF3F4" stroke="#E53935" stroke-width="2"/><text x="1134" y="562.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="900" fill="#E53935" text-anchor="start">不要從 logits 多推一步</text><text x="1134" y="610.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="800" fill="#173A5E" text-anchor="start">× 缺陷框　× 精確 mask　× 尺寸</text><text x="1134" y="652.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="800" fill="#173A5E" text-anchor="start">× 未知缺陷安全保證　× 根因</text><rect x="42" y="850" width="1588" height="53" rx="18" fill="#FFF4CC" stroke="#E8B52A" stroke-width="2"/><text x="72" y="884.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#6A4800" text-anchor="start">💡 工程 takeaway</text><text x="270" y="884.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="750" fill="#6A4800" text-anchor="start">先寫清楚分類器原生輸出，再為 reject、review 與定位需求建立獨立證據。</text></svg>