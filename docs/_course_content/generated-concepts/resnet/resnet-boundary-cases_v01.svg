<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">ResNet 的反事實與 HOLD 說明圖</title>
  <desc id="desc">三個模型專屬反事實卡片，分別呈現條件被破壞時的可觀察結果和安全的 HOLD 或重驗下一步。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0B3068" flood-opacity=".12"/></filter>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker>
    <marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker>
    <style>text { dominant-baseline: alphabetic; } .fine { fill:#536A91; font-size:18px; }</style>
  </defs>
  <rect width="1672" height="941" fill="#F5F8FE"/>
  <rect x="40" y="32" width="150" height="32" rx="16" fill="#E6F0FF"/><text x="58" y="54.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="16" font-weight="800" fill="#1769E0">反事實與安全邊界</text><text x="40" y="116" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="43" font-weight="900" fill="#071A3B">同一條因果鏈，會在哪裡被破壞？</text><text x="40" y="182" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="500" fill="#50698F">不是多背三個風險名詞；要能預測畫面可能怎麼變，並選擇安全的下一步。</text><text x="1630" y="57.0" text-anchor="end" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#5C7395">ResNet</text><rect x="77" y="260" width="478" height="516" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><circle cx="121" cy="306" r="25" fill="#D84A4A"/><text x="121" y="314.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">1</text><text x="159" y="313" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">tiny defect 在 optics、resize 或</text><text x="159" y="342" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">global pooling 前後被稀釋</text><g data-visual-cue="tiny_signal_dilution" data-renderer-art="classifier_or_mask" data-primitive="declared_tiny_signal_dilution" data-semantic-scene="declared_tiny_signal_dilution" data-semantic-entities="declared_input|declared_operation|candidate_or_gate" data-specialist-coverage="declared_input|declared_operation|candidate_or_gate" data-semantic-relation="show the authored operation before action" data-must-show="微小缺陷從原 ROI 經 resize | feature map | global pool 逐步淡化" data-not-claim="更深的 ResNet 不會自動恢復不存在的有效像素。"><title>微小訊號被 resize/pooling 稀釋</title><rect x="105" y="390" width="422" height="98" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="204.48999999999998" y1="440.26" x2="295.21" y2="440.26" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="336.79" y1="440.26" x2="423.72999999999996" y2="440.26" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="declared_input" data-entity-label-full="input"><path d="M183.7 428.55039999999997L194.03199999999998 434.7496L194.03199999999998 445.7704L183.7 451.9696L173.368 445.7704L173.368 434.7496z" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><text data-label-line="true" x="183.7" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">input</text></g><g data-entity="declared_operation" data-entity-label-full="operation"><rect x="303.6016" y="431.65" width="8.61" height="17.22" rx="5" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="3"/><rect x="319.444" y="431.65" width="8.61" height="17.22" rx="5" fill="#E8FAFF" stroke="#0AA6D8" stroke-width="3"/><line x1="314.278" y1="440.26" x2="318.4108" y2="440.26" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><text data-label-line="true" x="316.0" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">operation</text></g><g data-entity="candidate_or_gate" data-entity-label-full="candidate"><path d="M444.52 427.8616L456.2296 440.26L444.52 452.6584L432.81039999999996 440.26z" fill="#FFF4CC" stroke="#F38B00" stroke-width="3"/><circle cx="444.52" cy="440.26" r="3.0995999999999997" fill="#F38B00"/><text data-label-line="true" x="444.52" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">candidate</text></g><g data-relation="show the authored operation before action"><rect x="138.34" y="472.24" width="192" height="10.66" rx="4.92" fill="#EAF3FF" stroke="#9FC4FF" stroke-width="2"/><text data-label-line="true" x="234.34" y="473.78999999999996" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">declared</text><text data-label-line="true" x="234.34" y="489.12999999999994" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">tiny si</text></g></g><text x="105" y="520.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#F38B00">可能看到</text><text x="105" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">整圖 feature 可能仍偏向 normal，分</text><text x="105" y="570" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">類器沒有足夠局部訊號可用。</text><line x1="105" y1="646" x2="527" y2="646" stroke="#D6E7FF" stroke-width="2"/><text x="105" y="675.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#1769E0">正確下一步</text><text x="105" y="703" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">需要位置或極小區域時改評估</text><text x="105" y="725" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">detector/segmentation 或調整取像與</text><text x="105" y="747" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">ROI。</text><rect x="597" y="260" width="478" height="516" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><circle cx="641" cy="306" r="25" fill="#F38B00"/><text x="641" y="314.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">2</text><text x="679" y="313" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">背景、治具、lot、recipe 或設備狀態</text><text x="679" y="342" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">與 label 偶然相關</text><g data-visual-cue="shortcut_correlation" data-renderer-art="classifier_or_mask" data-primitive="declared_shortcut_correlation" data-semantic-scene="declared_shortcut_correlation" data-semantic-entities="declared_input|declared_operation|candidate_or_gate" data-specialist-coverage="declared_input|declared_operation|candidate_or_gate" data-semantic-relation="show the authored operation before action" data-must-show="label 同時和治具背景 | lot/recipe 標籤連線 | 模型把背景當線索" data-not-claim="高 validation accuracy 不排除資料捷徑。"><title>背景或 recipe 捷徑</title><rect x="625" y="390" width="422" height="98" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="724.49" y1="440.26" x2="815.21" y2="440.26" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="856.79" y1="440.26" x2="943.73" y2="440.26" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="declared_input" data-entity-label-full="input"><path d="M703.7 428.55039999999997L714.032 434.7496L714.032 445.7704L703.7 451.9696L693.368 445.7704L693.368 434.7496z" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><text data-label-line="true" x="703.7" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">input</text></g><g data-entity="declared_operation" data-entity-label-full="operation"><rect x="823.6016" y="431.65" width="8.61" height="17.22" rx="5" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="3"/><rect x="839.444" y="431.65" width="8.61" height="17.22" rx="5" fill="#E8FAFF" stroke="#0AA6D8" stroke-width="3"/><line x1="834.278" y1="440.26" x2="838.4108" y2="440.26" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><text data-label-line="true" x="836.0" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">operation</text></g><g data-entity="candidate_or_gate" data-entity-label-full="candidate"><path d="M964.52 427.8616L976.2296 440.26L964.52 452.6584L952.8104 440.26z" fill="#FFF4CC" stroke="#F38B00" stroke-width="3"/><circle cx="964.52" cy="440.26" r="3.0995999999999997" fill="#F38B00"/><text data-label-line="true" x="964.52" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">candidate</text></g><g data-relation="show the authored operation before action"><rect x="658.34" y="472.24" width="192" height="10.66" rx="4.92" fill="#EAF3FF" stroke="#9FC4FF" stroke-width="2"/><text data-label-line="true" x="754.34" y="473.78999999999996" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">declared</text><text data-label-line="true" x="754.34" y="489.12999999999994" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">shortcu</text></g></g><text x="625" y="520.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#F38B00">可能看到</text><text x="625" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">模型可能學到 shortcut，離開原資料</text><text x="625" y="570" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">分布後仍高信心地錯分類。</text><line x1="625" y1="646" x2="1047" y2="646" stroke="#D6E7FF" stroke-width="2"/><text x="625" y="675.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#1769E0">正確下一步</text><text x="625" y="703" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">用 lot/recipe/equipment split、</text><text x="625" y="725" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">failure images、per-class critical</text><text x="625" y="747" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">recall、calibration 和 OOD reject</text><text x="625" y="769" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">驗證，不只看平均 top-1。</text><rect x="1117" y="260" width="478" height="516" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><circle cx="1161" cy="306" r="25" fill="#1769E0"/><text x="1161" y="314.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">3</text><text x="1199" y="313" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">出現未知 defect、label ontology 改</text><text x="1199" y="342" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">變或 OOD image</text><g data-visual-cue="closed_set_ood_hold" data-renderer-art="drift_hold" data-primitive="declared_closed_set_ood_hold" data-semantic-scene="declared_closed_set_ood_hold" data-semantic-entities="declared_input|declared_operation|candidate_or_gate" data-specialist-coverage="declared_input|declared_operation|candidate_or_gate" data-semantic-relation="show the authored operation before action" data-must-show="未知符號進入只有舊 labels 的分類 head | 出口連向 HOLD/REVIEW | 未知缺陷或 OOD 影像仍會被 closed-set head 套入舊類別" data-not-claim="top-1 不可被反推為未知不存在。"><title>未知輸入不能直接 PASS</title><rect x="1145" y="390" width="422" height="98" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="1244.49" y1="440.26" x2="1335.21" y2="440.26" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="1376.79" y1="440.26" x2="1463.73" y2="440.26" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="declared_input" data-entity-label-full="input"><path d="M1223.7 428.55039999999997L1234.0320000000002 434.7496L1234.0320000000002 445.7704L1223.7 451.9696L1213.368 445.7704L1213.368 434.7496z" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><text data-label-line="true" x="1223.7" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">input</text></g><g data-entity="declared_operation" data-entity-label-full="operation"><rect x="1343.6016" y="431.65" width="8.61" height="17.22" rx="5" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="3"/><rect x="1359.444" y="431.65" width="8.61" height="17.22" rx="5" fill="#E8FAFF" stroke="#0AA6D8" stroke-width="3"/><line x1="1354.278" y1="440.26" x2="1358.4108" y2="440.26" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><text data-label-line="true" x="1356.0" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">operation</text></g><g data-entity="candidate_or_gate" data-entity-label-full="candidate"><path d="M1484.52 427.8616L1496.2296 440.26L1484.52 452.6584L1472.8104 440.26z" fill="#FFF4CC" stroke="#F38B00" stroke-width="3"/><circle cx="1484.52" cy="440.26" r="3.0995999999999997" fill="#F38B00"/><text data-label-line="true" x="1484.52" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">candidate</text></g><g data-relation="show the authored operation before action"><rect x="1178.34" y="472.24" width="192" height="10.66" rx="4.92" fill="#EAF3FF" stroke="#9FC4FF" stroke-width="2"/><text data-label-line="true" x="1274.34" y="473.78999999999996" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">declared</text><text data-label-line="true" x="1274.34" y="489.12999999999994" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">closed</text></g></g><text x="1145" y="520.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#F38B00">可能看到</text><text x="1145" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">closed-set head 仍必須在舊 labels</text><text x="1145" y="570" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">中輸出一個 logit，不能保證認出未知。</text><line x1="1145" y1="646" x2="1567" y2="646" stroke="#D6E7FF" stroke-width="2"/><text x="1145" y="675.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#1769E0">正確下一步</text><text x="1145" y="703" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">低 confidence 或 OOD gate 未通過時</text><text x="1145" y="725" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">轉 REVIEW；不要由 top-1 反推出未知</text><text x="1145" y="747" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">不存在或直接 PASS/FAIL。</text><rect x="77" y="816" width="1518" height="63" rx="20" fill="#FFF4CC" stroke="#F1B828"/><text x="836" y="855.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="800" fill="#674500">任一條件超出 qualification envelope：先停在 HOLD／REVIEW，保存 raw evidence 與版本，再決定怎麼重驗。</text>
</svg>