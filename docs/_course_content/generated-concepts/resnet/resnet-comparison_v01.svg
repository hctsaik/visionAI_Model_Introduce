  <rect x="40" y="32" width="150" height="32" rx="16" fill="#E6F0FF"/><text x="58" y="54.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="16" font-weight="800" fill="#1769E0">相鄰方法比較</text><text x="40" y="116" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="43" font-weight="900" fill="#071A3B">比輸入表示與候選輸出</text><text x="40" y="182" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="500" fill="#50698F">分類、分割與姿態方法可能讀同一張影像，卻把它轉成不同層級的 class、mask 或座標候選。</text><text x="1630" y="57.0" text-anchor="end" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#5C7395">ResNet</text><rect x="77" y="260" width="478" height="500" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><rect x="77" y="260" width="478" height="68" rx="24" fill="#1769E0"/><rect x="77" y="304" width="478" height="24" fill="#1769E0"/><text x="105" y="304.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">ResNet</text><g data-visual-cue="resnet_residual_block" data-renderer-art="classifier_or_mask" data-primitive="residual_block_add" data-semantic-scene="residual_block_add" data-semantic-entities="input_feature|f_x|shortcut_add" data-specialist-coverage="input_feature|f_x|shortcut_add" data-semantic-relation="add the shortcut to transformed features" data-must-show="ResNet：依據：固定 ROI 上版本化的 known-class labels 與 residual CNN feature | candidate output: 可用輸出：經 calibration/OOD policy 解讀的 image-level known-class logits | Same input, ROI, preprocess, truth, and evidence gate; do not switch the comparison contract." data-not-claim="ResNet output is a candidate, not verified field truth; still use the evidence gate."><title>ResNet：依據：固定 ROI 上版本化的 known-class labels 與 residual CNN feature</title><rect x="105" y="346" width="422" height="112" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="resnet-identity-plus-fx"><rect x="149.68" y="390.52" width="7.84" height="7.84" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="159.52" y="390.52" width="7.84" height="7.84" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="149.68" y="400.35999999999996" width="7.84" height="7.84" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="159.52" y="400.35999999999996" width="7.84" height="7.84" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><line x1="206.38" y1="398.72" x2="285.76" y2="385.6" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="293.32" y="377.4" width="60.480000000000004" height="16.400000000000002" rx="6" fill="#E8FAFF" stroke="#0AA6D8" stroke-width="3"/><line x1="361.36" y1="385.6" x2="425.62" y2="395.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><path d="M195.04000000000002 408.56C240.39999999999998 424.96, 387.82 424.96, 425.62 402.82" fill="none" stroke="#1769E0" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/><circle cx="452.08" cy="399.54" r="6.5600000000000005" fill="#F7FBFF" stroke="#F38B00" stroke-width="3"/><path d="M449.21 399.54h5.74 M452.08 396.67v5.74" stroke="#F38B00" stroke-width="3"/><text data-label-line="true" x="172.36" y="433.98" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">x</text><text data-label-line="true" x="323.56" y="374.12" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">F(x)</text><text data-label-line="true" x="452.08" y="433.98" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Aria