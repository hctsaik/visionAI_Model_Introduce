="true" x="754.34" y="445.12999999999994" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">channe</text></g></g><text x="625" y="493.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="900" fill="#1769E0">它如何表示輸入</text><text x="625" y="525" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17.5" font-weight="650" fill="#0B2858">依據：同樣的 known classes，加上</text><text x="625" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17.5" font-weight="650" fill="#0B2858">hierarchical large-kernel ConvNet</text><text x="625" y="571" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17.5" font-weight="650" fill="#0B2858">feature</text><line x1="625" y1="628" x2="1047" y2="628" stroke="#D6E7FF" stroke-width="2"/><text x="625" y="659.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="900" fill="#F38B00">會交出什麼候選</text><text x="625" y="690" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17.5" font-weight="650" fill="#0B2858">可用輸出：pooled closed-set logits；</text><text x="625" y="713" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17.5" font-weight="650" fill="#0B2858">不是 tiny defect 定位或 mask</text><rect x="1117" y="260" width="478" height="500" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><rect x="1117" y="260" width="478" height="68" rx="24" fill="#F38B00"/><rect x="1117" y="304" width="478" height="24" fill="#F38B00"/><text x="1145" y="304.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">ViT</text><g data-visual-cue="vit_patch_tokens" data-renderer-art="patch_features" data-primitive="patch_feature_extraction" data-semantic-scene="patch_feature_extraction" data-semantic-entities="roi|patch_grid|feature_vectors" data-specialist-coverage="roi|patch_grid|feature_vectors" data-semantic-relation="convert patches into reusable feature vectors" data-must-show="ViT：依據：固定 patch/token、pretraining 與 known-class label contract | candidate output: 可用輸出：class token/pooling 的 closed-set logits；attention map 不是 box/mask | Same input, ROI, preprocess, truth, and evidence gate; do not switch the comparison contract." data-not-claim="ViT output is a candidate, not verified field truth; still use the evidence gate."><title>ViT：依據：固定 patch/token、pretraining 與 known-class label contract</title><rect x="1145" y="346" width="422" height="112" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="patch-to-feature-vectors"><rect x="1204.8" y="381.5" width="9.48" height="9.48" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="1216.28" y="381.5" width="9.48" height="9.48" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="1227.76" y="381.5" width="9.48" height="9.48" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="1204.8" y="392.98" width="9.48" height="9.48" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="1216.28" y="392.98" width="9.48" height="9.48" rx="2" fill="#F38B00" stroke="#1769E0" stroke-width="1"/><rect x="1227.76" y="392.98" width="9.48" height="9.48" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="1204.8" y="404.46" width="9.48" height="9.48" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="1216.28" y="404.46" width="9.48" height="9.48" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="1227.76" y="404.46" width="9.48" height="9.48" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><line x1="1280.3999999999999" y1="398.72" x2="1374.8999999999999" y2="398.72" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="1405.1399999999999" y="384.78" width="9.828" height="26.240000000000002" rx="3" fill="#1769E0"/><rect x="1422.1499999999999" y="390.52" width="9.828" height="22.14" rx="3" fill="#0AA6D8"/><rect x="1439.1599999999999" y="396.26" width="9.828" height="18.04" rx="3" fill="#F38B00"/><text data-label-line="true" x="1235.04" y="433.98" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">patches</text><text data-label-line="true" x="1431.6" y="433.98" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">feature vec.</text></g></g><text x="1145" y="493.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="900" fill="#1769E0">它如何表示輸入</text><text x="1145" y="525" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17.5" font-weight="650" fill="#0B2858">依據：固定 patch/token、</text><text x="1145" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17.5" font-weight="650" fill="#0B2858">pretraining 與 known-class label</text><text x="1145" y="571" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17.5" font-weight="650" fill="#0B2858">contract</text><line x1="1145" y1="628" x2="1567" y2="628" stroke="#D6E7FF" stroke-width="2"/><text x="1145" y="659.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="900" fill="#F38B00">會交出什麼候選</text><text x="1145" y="690" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17.5" font-weight="650" fill="#0B2858">可用輸出：class token/pooling 的</text><text x="1145" y="713" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17.5" font-weight="650" fill="#0B2858">closed-set logits；attention map</text><text x="1145" y="736" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17.5" font-weight="650" fill="#0B2858">不是 box/mask</text><rect x="77" y="800" width="1518" height="100" rx="22" fill="#FFF4CC" stroke="#F1B828"/><text x="112" y="836.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="900" fill="#674500">共同邊界：</text><text x="112" y="865" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="600" fill="#674500">ResNet 交付固定 label contract 下的 image-level known-class logits/probability 與 top-k；不是未知缺陷偵測、box、mask、缺陷尺</text><text x="112" y="889" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="600" fill="#674500">寸或自動 PASS/FAIL。低 confidence 或 OOD 要交 REVIEW。</text>
