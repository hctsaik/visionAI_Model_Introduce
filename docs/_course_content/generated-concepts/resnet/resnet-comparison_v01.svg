0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">ConvNeXt</text><g data-visual-cue="convnext_depthwise_block" data-renderer-art="classifier_or_mask" data-primitive="depthwise_channel_mix" data-semantic-scene="depthwise_channel_mix" data-semantic-entities="spatial_kernel|channels|mixed_features" data-specialist-coverage="spatial_kernel|channels|mixed_features" data-semantic-relation="filter locally then mix channels" data-must-show="ConvNeXt：依據：同樣的 known classes，加上 hierarchical large-kernel ConvNet feature | candidate output: 可用輸出：pooled closed-set logits；不是 tiny defect 定位或 mask | Same input, ROI, preprocess, truth, and evidence gate; do not switch the comparison contract." data-not-claim="ConvNeXt output is a candidate, not verified field truth; still use the evidence gate."><title>ConvNeXt：依據：同樣的 known classes，加上 hierarchical large-kernel ConvNet feature</title><rect x="625" y="346" width="422" height="112" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="724.49" y1="396.26" x2="815.21" y2="396.26" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="856.79" y1="396.26" x2="943.73" y2="396.26" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="spatial_kernel" data-entity-label-full="spatial"><path d="M703.7 384.55039999999997L714.032 390.7496L714.032 401.7704L703.7 407.9696L693.368 401.7704L693.368 390.7496z" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><text data-label-line="true" x="703.7" y="417.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">spatial</text></g><g data-entity="channels" data-entity-label-full="channels"><path d="M836.0 384.55039999999997L846.332 390.7496L846.332 401.7704L836.0 407.9696L825.668 401.7704L825.668 390.7496z" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="