E0B" text-anchor="middle">global average</text><rect x="1056" y="440" width="20" height="86" rx="6" fill="#0F9DB5" stroke="#0F9DB5" stroke-width="0"/><rect x="1088" y="404" width="20" height="122" rx="6" fill="#0F9DB5" stroke="#0F9DB5" stroke-width="0"/><rect x="1120" y="460" width="20" height="66" rx="6" fill="#0F9DB5" stroke="#0F9DB5" stroke-width="0"/><rect x="1152" y="424" width="20" height="102" rx="6" fill="#0F9DB5" stroke="#0F9DB5" stroke-width="0"/><rect x="1184" y="450" width="20" height="76" rx="6" fill="#0F9DB5" stroke="#0F9DB5" stroke-width="0"/><rect x="1216" y="432" width="20" height="94" rx="6" fill="#0F9DB5" stroke="#0F9DB5" stroke-width="0"/><text x="1141" y="566.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="19" font-weight="800" fill="#173A5E" text-anchor="middle">每個 channel → 1 個值</text><text x="1141" y="616.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="22" font-weight="900" fill="#E53935" text-anchor="middle">空間位置被彙整</text><path d="M1296 474 L1368 474" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-orange)"/><rect x="1386" y="222" width="244" height="506" rx="24" fill="#F1FBF7" stroke="#1F9D55" stroke-width="2"/><text x="1508" y="278.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="24" font-weight="900" fill="#1F9D55" text-anchor="middle">工程補救</text><text x="1420" y="338.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="800" fill="#173A5E" text-anchor="start">1  檢查 optics</text><text x="1420" y="386.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="800" fill="#173A5E" text-anchor="start">2  計算有效 pixels</text><text x="1420" y="434.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="800" fill="#173A5E" text-anchor="start">3  縮小 ROI / crop</text><text x="1420" y="482.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="800" fill="#173A5E" text-anchor="start">4  比較 detector</text><text x="1420" y="524.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="800" fill="#173A5E" text-anchor="start">    或 segmentation</text><rect x="1418" y="584" width="180" height="80" rx="16" fill="#FFFFFF" stroke="#1F9D55" stroke-width="2"/><text x="1508" y="617.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="19" font-weight="900" fill="#1F9D55" text-anchor="middle">CAM 僅做</text><text x="1508" y="646.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="19" font-weight="750" fill="#173A5E" text-anchor="middle">事後解釋</text><rect x="42" y="850" width="1588" height="53" rx="18" fill="#FFF4CC" stroke="#E8B52A" stroke-width="2"/><text x="72" y="884.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#6A4800" text-anchor="start">💡 工程 takeaway</text><text x="270" y="884.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="750" fill="#6A4800" text-anchor="start">若輸出需求是位置、輪廓或尺寸，先改任務契約；不要把分類熱圖當成量測 mask。</text></svg>