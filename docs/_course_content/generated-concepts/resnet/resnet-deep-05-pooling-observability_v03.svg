    </defs><rect width="1672" height="941" fill="#F4F8FF"/><rect width="1672" height="8" fill="#173A5E"/><rect x="1320" y="34" width="312" height="42" rx="21" fill="#FFFFFF" stroke="#0B57C7" stroke-width="2"/><text x="1476.0" y="62.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="850" fill="#0B57C7" text-anchor="middle">D · BEFORE &amp; AFTER</text><text x="42" y="91.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="39" font-weight="900" fill="#101820" text-anchor="start">Global average pooling 很穩定，但會把局部訊號稀釋</text><text x="42" y="139.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="650" fill="#5B6675" text-anchor="start">分類器回答整張 ROI 屬於哪一類；若缺陷只佔少量 pixels，位置訊號可能在 resize 與 pooling 後消失。</text><clipPath id="photo-pooling"><rect x="48" y="222" width="388" height="506" rx="24"/></clipPath><image href="resnet-industrial-known-class-anchor_v03.png" x="48" y="222" width="388" height="506" preserveAspectRatio="xMidYMid slice" clip-path="url(#photo-pooling)"/><rect x="48" y="222" width="388" height="506" rx="24" fill="none" stroke="#9FC2F2" stroke-width="3"/><text x="242" y="765.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="850" fill="#173A5E" text-anchor="middle">原始 ROI · 局部訊號很小</text><path d="M450 474 L522 474" fill="none" stroke="#0B57C7" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="540" y="248" width="356" height="430" rx="24" fill="#FFFFFF" stroke="#9FC2F2" stroke-width="2"/><text x="718" y="302.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="24" font-weight="900" fill="#0B57C7" text-anchor="middle">spatial feature map</text><rect x="602" y="350" width="30" height="30" rx="6" fill="#D9E8FA" stroke="#D9E8FA" stroke-width="0"/><rect x="642" y="350" width="30" height="30" rx="6" fill="#D9E8FA" stroke="#D9E8FA" stroke-width="0"/><rect x="682"