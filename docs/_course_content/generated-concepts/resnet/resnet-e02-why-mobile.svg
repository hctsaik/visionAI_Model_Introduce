<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12Z" fill="#0754b8"/></marker></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#fff" stroke="none" stroke-width="2"/><text x="30" y="60" font-size="34" fill="#173650" font-weight="800" text-anchor="start">為何需要 ResNet？加深不一定學得好</text><text x="30" y="108" font-size="23" fill="#087f85" font-weight="500" text-anchor="start">依原論文 Fig.1 的現象作質性示意 · 非實測曲線</text><rect x="24" y="839" width="672" height="80" rx="12" fill="#fff3d5" stroke="#e9c878" stroke-width="2"/><text x="40" y="872" font-size="27" fill="#173650" font-weight="700" text-anchor="start">先分清「訓練學不好」與「測試變差」。</text><text x="40" y="905" font-size="27" fill="#173650" font-weight="700" text-anchor="start">ResNet 讓深層網路改學修正。</text><text x="38" y="173" font-size="29" fill="#173650" font-weight="700" text-anchor="start">想用更多層組合邊緣、紋理與形狀，</text><text x="38" y="216" font-size="29" fill="#173650" font-weight="700" text-anchor="start">卻可能連訓練資料都學得更差。</text><text x="40" y="293" font-size="26" fill="#173650" font-weight="700" text-anchor="start">訓練錯誤 ↑</text><path d="M90,558 L90,325" fill="none" stroke="#0754b8" stroke-width="4" marker-end="url(#arrow)"/><path d="M90,558 L655,558" fill="none" stroke="#0754b8" stroke-width="4" marker-end="url(#arrow)"/><path d="M105 337 C155 390 175 430 240 447 S420 461 620 463" stroke="#bc3543" stroke-width="7" fill="none"/><path d="M105 355 C150 430 195 490 255 511 S440 533 620 535" stroke="#0754b8" stroke-width="7" fill="none"/><text x="300" y="425" font-size="29" fill="#bc3543" font-weight="700" text-anchor="start">較深的普通網路</text><text x="325" y="508" font-size="29" fill="#0754b8" font-weight="700" text-anchor="start">較淺的普通網路</text><text x="334" y="596" font-size="26" fill="#173650" font-weight=