<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs>
      <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1769E0"/></marker>
      <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#F38B00"/></marker>
    </defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#0A2455"/><rect x="1310" y="32" width="320" height="48" rx="24" fill="#FFFFFF" stroke="#A7C9FF" stroke-width="2"/><text x="1470" y="63.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">REVIEW BOUNDARY</text><text x="40" y="106.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="40" font-weight="900" fill="#0A2455" text-anchor="start">最高 normal logit，為什麼仍不能證明沒有新缺陷？</text><text x="40" y="148.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="550" fill="#52647F" text-anchor="start">closed-set head 必須在既有 labels 選答案；未知 tiny change 可能仍被塞進 normal。</text><clipPath id="crop-unknown-test"><rect x="52" y="214" width="730" height="548" rx="24"/></clipPath><g clip-path="url(#crop-unknown-test)"><image href="resnet-beginner-01-known-class-case_v01.png" x="52" y="214" width="730" height="548" preserveAspectRatio="xMidYMid slice"/></g><rect x="52" y="214" width="730" height="548" rx="24" fill="none" stroke="#F38B00" stroke-width="2"/><rect x="604" y="640" width="98" height="68" rx="12" fill="none" stroke="#F38B00" stroke-width="6"/><text x="652" y="736.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="850" fill="#F38B00" text-anchor="middle">未標過的小變化</text><rect x="834" y="220" width="730" height="230" rx="26" fill="#FFFFFF" stroke="#A7C9FF" stroke-width="2"/><text x="874" y="276.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="28" font-weight="900" fill="#0A2455" text-anchor="start">模型只能選已知 labels</text><text x="880" y="330.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="750" fill="#0A2455" text-anchor="start">normal</text><rect x="1025" y="312" width="390" height="24" rx="12" fill="#E8F0FA"/><rect x="1025" y="312" width="350" height="24" rx="12" fill="#1769E0"/><text x="880" y="372.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="750" fill="#0A2455" text-anchor="start">scratch</text><rect x="1025" y="354" width="390" height="24" rx="12" fill="#E8F0FA"/><rect x="1025" y="354" width="95" height="24" rx="12" fill="#9CBCEB"/><text x="880" y="414.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="750" fill="#0A2455" text-anchor="start">contamination</text><rect x="1025" y="396" width="390" height="24" rx="12" fill="#E8F0FA"/><rect x="1025" y="396" width="45" height="24" rx="12" fill="#D4E0F3"/><text x="1456" y="354.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="850" fill="#1769E0" text-anchor="start">top-1</text><path d="M1196 477 L1196 557" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="836" y="574" width="728" height="188" rx="26" fill="#FFF7EC" stroke="#F38B00" stroke-width="2"/><text x="1200" y="630.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="27" font-weight="900" fill="#875000" text-anchor="middle">正確下一步：calibration + OOD/reject + REVIEW</text><text x="1200" y="679.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="650" fill="#0A2455" text-anchor="middle">核對有效 pixel、critical recall、lot/recipe shift 與 raw ROI</text><text x="1200" y="724.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="850" fill="#D9485F" text-anchor="middle">不是由最高分直接推到 PASS／FAIL</text><rect x="40" y="850" width="1592" height="52" rx="20" fill="#FFF4CC" stroke="#F0B52B" stroke-width="2"/><text x="75" y="883.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="start">重點：classification 的安全輸出是已知類別候選加上 reject／review；它不保證未知缺陷不存在。</text></svg>