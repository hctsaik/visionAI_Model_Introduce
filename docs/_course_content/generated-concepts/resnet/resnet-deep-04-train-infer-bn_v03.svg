    </defs><rect width="1672" height="941" fill="#F4F8FF"/><rect width="1672" height="8" fill="#173A5E"/><rect x="1320" y="34" width="312" height="42" rx="21" fill="#FFFFFF" stroke="#0B57C7" stroke-width="2"/><text x="1476.0" y="62.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="850" fill="#0B57C7" text-anchor="middle">D · BEFORE &amp; AFTER</text><text x="42" y="91.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="39" font-weight="900" fill="#101820" text-anchor="start">訓練與推論的關鍵差異：BatchNorm 狀態必須被鎖定</text><text x="42" y="139.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="650" fill="#5B6675" text-anchor="start">同一組權重若 model mode 不同，BatchNorm 使用的統計量也不同；量產服務必須使用 evaluation mode。</text><rect x="48" y="206" width="754" height="570" rx="28" fill="#FFF4F5" stroke="#E53935" stroke-width="2"/><rect x="870" y="206" width="754" height="570" rx="28" fill="#F1FBF7" stroke="#1F9D55" stroke-width="2"/><rect x="82" y="238" width="264" height="42" rx="21" fill="#FFFFFF" stroke="#E53935" stroke-width="2"/><text x="214.0" y="266.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="850" fill="#E53935" text-anchor="middle">TRAIN · 更新參數</text><rect x="904" y="238" width="286" height="42" rx="21" fill="#FFFFFF" stroke="#1F9D55" stroke-width="2"/><text x="1047.0" y="266.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="850" fill="#1F9D55" text-anchor="middle">INFERENCE · 固定狀態</text><circle cx="107" cy="354" r="23" fill="#E53935"/><text x="107" y="361.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text><rect x="144" y="318" width="644" height="72" rx="17" fill="#FFFFFF" stroke="#E53935" stroke-width="2"/><text x="172" y="348.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#E53935" text-anchor="start">影像 + label</text><text x="352" y="348.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="750" fill="#173A5E" text-anchor="start">augmentation / sampling</text><path d="M466 392 L466 416" fill="none" stroke="#E53935" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="107" cy="458" r="23" fill="#E53935"/><text x="107" y="465.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text><rect x="144" y="422" width="644" height="72" rx="17" fill="#FFFFFF" stroke="#E53935" stroke-width="2"/><text x="172" y="452.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#E53935" text-anchor="start">forward</text><text x="352" y="452.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="750" fill="#173A5E" text-anchor="start">BatchNorm 用 mini-batch 統計</text><path d="M466 496 L466 520" fill="none" stroke="#E53935" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="107" cy="562" r="23" fill="#E53935"/><text x="107" y="569.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text><rect x="144" y="526" width="644" height="72" rx="17" fill="#FFFFFF" stroke="#E53935" stroke-width="2"/><text x="172" y="556.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#E53935" text-anchor="start">cross-entropy</text><text x="352" y="556.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="750" fill="#173A5E" text-anchor="start">計算 loss</text><path d="M466 600 L466 624" fill="none" stroke="#E53935" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="107" cy="666" r="23" fill="#E53935"/><text x="107" y="673.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">4</text><rect x="144" y="630" width="644" height="72" rx="17" fill="#FFFFFF" stroke="#E53935" stroke-width="2"/><text x="172" y="660.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#E53935" text-anchor="start">backward</text><text x="352" y="660.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="750" fill="#173A5E" text-anchor="start">更新 weights 與 running stats</text><circle cx="929" cy="354" r="23" fill="#1F9D55"/><text x="929" y="361.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text><rect x="966" y="318" width="644" height="72" rx="17" fill="#FFFFFF" stroke="#1F9D55" stroke-width="2"/><text x="994" y="348.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#1F9D55" text-anchor="start">raw ROI</text><text x="1174" y="348.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="750" fill="#173A5E" text-anchor="start">固定 resize / normalize</text><path d="M1288 392 L1288 416" fill="none" stroke="#1F9D55" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="929" cy="458" r="23" fill="#1F9D55"/><text x="929" y="465.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text><rect x="966" y="422" width="644" height="72" rx="17" fill="#FFFFFF" stroke="#1F9D55" stroke-width="2"/><text x="994" y="452.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#1F9D55" text-anchor="start">model.eval()</text><text x="1174" y="452.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="750" fill="#173A5E" text-anchor="start">BatchNorm 用保存的 running stats</text><path d="M1288 496 L1288 520" fill="none" stroke="#1F9D55" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="929" cy="562" r="23" fill="#1F9D55"/><text x="929" y="569.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text><rect x="966" y="526" width="644" height="72" rx="17" fill="#FFFFFF" stroke="#1F9D55" stroke-width="2"/><text x="994" y="556.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#1F9D55" text-anchor="start">forward</text><text x="1174" y="556.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="750" fill="#173A5E" text-anchor="start">輸出 logits</text><path d="M1288 600 L1288 624" fill="none" stroke="#1F9D55" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="929" cy="666" r="23" fill="#1F9D55"/><text x="929" y="673.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">4</text><rect x="966" y="630" width="644" height="72" rx="17" fill="#FFFFFF" stroke="#1F9D55" stroke-width="2"/><text x="994" y="660.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#1F9D55" text-anchor="start">policy gate</text><text x="1174" y="660.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="750" fill="#173A5E" text-anchor="start">PASS / FAIL / REVIEW</text><path d="M806 487 L862 487" fill="none" stroke="#0B57C7" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/><text x="834" y="455.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#0B57C7" text-anchor="middle">部署</text><rect x="300" y="792" width="1072" height="42" rx="16" fill="#FFF4CC" stroke="#E8B52A" stroke-width="2"/><text x="836" y="819.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="850" fill="#6A4800" text-anchor="middle">錯把推論留在 training mode，輸出可能隨 batch 組成改變。</text><rect x="42" y="850" width="1588" height="53" rx="18" fill="#FFF4CC" stroke="#E8B52A" stroke-width="2"/><text x="72" y="884.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#6A4800" text-anchor="start">💡 工程 takeaway</text><text x="270" y="884.0" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20" font-weight="750" fill="#6A4800" text-anchor="start">權重 checksum 之外，也要記錄 preprocess、model mode、BatchNorm 狀態、runtime 與框架版本。</text></svg>