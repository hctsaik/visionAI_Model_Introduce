<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">DiffusionAD restoration as a normal-like reference rather than truth</title><desc id="desc">test x經固定one-step recipe形成x-hat。x-hat可能保留defect、抹掉正常微結構或製造artefact，因此input/restoration/map三聯需用real holdout驗證。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7352DA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7352DA"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9475F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9475F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#08275A"/><rect x="40" y="30" width="188" height="44" rx="22" fill="#F2EEFF" stroke="#7352DA" stroke-width="2"/><text x="134" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">STEP 3 / 5</text><rect x="1298" y="30" width="334" height="44" rx="22" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="2"/><text x="1465" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#7352DA" text-anchor="middle">DiffusionAD · one-step</text><text x="40" y="123.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="38" font-weight="900" fill="#0A1A37" text-anchor="start">one-step restoration 是 normal-like reference，不是 product truth</text><text x="40" y="166.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="650" fill="#52698D" text-anchor="start">同一張 x 經 fixed one-step recipe 得到 x-hat；任何『修得漂亮』的畫面都仍要檢查 defect persistence、normal-detail loss 與 artefact</text><g data-entity="diffad_ceramic_sensor_cap_aoi"><clipPath id="photo-restoration-58-272"><rect x="58" y="272" width="312" height="327" rx="23"/></clipPath><g clip-path="url(#photo-restoration-58-272)"><image href="diffad-industrial-ceramic-cap-anchor_v02.png" x="58" y="272" width="312" height="327" preserveAspectRatio="xMidYMid slice"/></g><rect x="58" y="272" width="312" height="327" rx="23" fill="none" stroke="#1769E0" stroke-width="3"/><rect x="257.68" y="458.39" width="49.92" height="45.78" rx="7" fill="none" stroke="#F38B00" stroke-width="4"/><text x="282.64" y="447.39" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">review cue</text><text x="214.0" y="628.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="middle">test ROI x</text></g><path d="M395 434 L463 434" fill="none" stroke="#7352DA" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-7352DA)"/><g data-entity="diffad_norm_guided_one_step_denoiser"><rect x="487" y="287" width="303" height="312" rx="25" fill="#E6FBFD" stroke="#00A8C6" stroke-width="3"/><text x="638.5" y="321.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#0A1A37" text-anchor="middle">norm-guided denoiser</text><text x="638.5" y="347.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#00A8C6" text-anchor="middle">one denoiser forward</text><rect x="512" y="376" width="253" height="57" rx="16" fill="#FFFFFF" stroke="#7352DA" stroke-width="2"/><text x="638.5" y="410.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#7352DA" text-anchor="middle">fixed timestep + norm guidance</text><path d="M638.5 447 L638.5 488" fill="none" stroke="#7352DA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-7352DA)"/><rect x="529" y="501" width="219" height="58" rx="16" fill="#D8F4F8" stroke="#00A8C6" stroke-width="2"/><text x="638.5" y="535.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#0A1A37" text-anchor="middle">normal-like restoration</text><text x="638.5" y="583.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">not multi-step sampler</text></g><path d="M814 434 L881 434" fill="none" stroke="#7352DA" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-7352DA)"/><g data-entity="diffad_normal_like_restoration"><rect x="906" y="292" width="303" height="266" rx="23" fill="#F2EEFF" stroke="#7352DA" stroke-width="3"/><text x="1057.5" y="326.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#0A1A37" text-anchor="middle">restoration x-hat</text><text x="1057.5" y="352.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#7352DA" text-anchor="middle">normal-like reference</text><rect x="930" y="374" width="255" height="137" rx="13" fill="#C9D5E4" stroke="#7D9DBB" stroke-width="2"/><rect x="941.0" y="387.0" width="43.8" height="30.0" rx="4" fill="#BCCBD9" stroke="none" stroke-width="0"/><rect x="987.6" y="387.0" width="43.8" height="30.0" rx="4" fill="#DDE7F1" stroke="none" stroke-width="0"/><rect x="1034.2" y="387.0" width="43.8" height="30.0" rx="4" fill="#BCCBD9" stroke="none" stroke-width="0"/><rect x="1080.8" y="387.0" width="43.8" height="30.0" rx="4" fill="#DDE7F1" stroke="none" stroke-width="0"/><rect x="1127.4" y="387.0" width="43.8" height="30.0" rx="4" fill="#BCCBD9" stroke="none" stroke-width="0"/><rect x="941.0" y="422.3333333333333" width="43.8" height="30.0" rx="4" fill="#DDE7F1" stroke="none" stroke-width="0"/><rect x="987.6" y="422.3333333333333" width="43.8" height="30.0" rx="4" fill="#BCCBD9" stroke="none" stroke-width="0"/><rect x="1034.2" y="422.3333333333333" width="43.8" height="30.0" rx="4" fill="#DDE7F1" stroke="none" stroke-width="0"/><rect x="1080.8" y="422.3333333333333" width="43.8" height="30.0" rx="4" fill="#BCCBD9" stroke="none" stroke-width="0"/><rect x="1127.4" y="422.3333333333333" width="43.8" height="30.0" rx="4" fill="#DDE7F1" stroke="none" stroke-width="0"/><rect x="941.0" y="457.6666666666667" width="43.8" height="30.0" rx="4" fill="#BCCBD9" stroke="none" stroke-width="0"/><rect x="987.6" y="457.6666666666667" width="43.8" height="30.0" rx="4" fill="#DDE7F1" stroke="none" stroke-width="0"/><rect x="1034.2" y="457.6666666666667" width="43.8" height="30.0" rx="4" fill="#BCCBD9" stroke="none" stroke-width="0"/><rect x="1080.8" y="457.6666666666667" width="43.8" height="30.0" rx="4" fill="#DDE7F1" stroke="none" stroke-width="0"/><rect x="1127.4" y="457.6666666666667" width="43.8" height="30.0" rx="4" fill="#BCCBD9" stroke="none" stroke-width="0"/><text x="1057.5" y="543.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">not ground truth</text></g><rect x="1242" y="254" width="344" height="384" rx="26" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="3"/><text x="1414" y="300.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#0A1A37" text-anchor="middle">What x-hat can do wrong</text><circle cx="1283" cy="358" r="12" fill="#D9475F"/><text x="1308" y="365.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#D9475F" text-anchor="start">preserve a defect</text><text x="1308" y="391.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="760" fill="#52698D" text-anchor="start">escape can remain</text><circle cx="1283" cy="443" r="12" fill="#F38B00"/><text x="1308" y="450.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#F38B00" text-anchor="start">erase normal micro-detail</text><text x="1308" y="476.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="760" fill="#52698D" text-anchor="start">false reject can grow</text><circle cx="1283" cy="528" r="12" fill="#7352DA"/><text x="1308" y="535.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#7352DA" text-anchor="start">introduce texture artefact</text><text x="1308" y="561.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="760" fill="#52698D" text-anchor="start">segmentation may learn shortcut</text><rect x="58" y="689" width="1528" height="114" rx="22" fill="#FFF0F3" stroke="#D9475F" stroke-width="2"/><text x="88" y="728.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#D9475F" text-anchor="start">Required evidence triplet</text><text x="88" y="760.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#0A1A37" text-anchor="start">raw x + restoration x-hat + segmentation map; check real holdout, defect erasure / persistence, false reject and drift—not visual beauty.</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF5D4" stroke="#E5AB22" stroke-width="2"/><circle cx="79" cy="875" r="12" fill="#FFE29A" stroke="#C98700" stroke-width="2"/><text x="79" y="882.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#805300" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#674700" text-anchor="start">A smooth restoration has no authority to release product. DiffusionAD validates the restoration itself against real failures before using it as reference for segmentation。</text></svg>