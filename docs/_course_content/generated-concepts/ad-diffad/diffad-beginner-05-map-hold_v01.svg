"1503" y="461.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">owner review</text><rect x="340" y="633" width="1243" height="170" rx="24" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="2"/><text x="372" y="674.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#0A1A37" text-anchor="start">HOLD when a prerequisite breaks</text><circle cx="378" cy="708" r="9" fill="#D9475F"/><text x="400" y="715.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="start">restoration preserves defect / makes artefact</text><text x="836" y="715.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="760" fill="#0A1A37" text-anchor="start">inspect x + x-hat + real escape / false reject</text><circle cx="378" cy="744" r="9" fill="#7352DA"/><text x="400" y="751.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="start">segmentation learns synthetic shortcut</text><text x="836" y="751.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="760" fill="#0A1A37" text-anchor="start">check real morphology and holdout error taxonomy</text><circle cx="378" cy="780" r="9" fill="#F38B00"/><text x="400" y="787.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="start">tiny signal or global logic exceeds local path</text><text x="836" y="787.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="760" fill="#0A1A37" text-anchor="start">measure effective pixels; use rule / ID / process