-anchor="start">post / aggregate</text><circle cx="1126" cy="689" r="10" fill="#149A62"/><text x="1146" y="696.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="start">handoff</text><circle cx="1322" cy="689" r="10" fill="#D9475F"/><text x="1342" y="696.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="start">complete P95 / P99</text><text x="88" y="752.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D9475F" text-anchor="start">Do not substitute a conventional multi-step sampler&#x27;s quality or latency. One forward alone also does not replace acquisition-to-handoff P95.</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF5D4" stroke="#E5AB22" stroke-width="2"/><circle cx="79" cy="875" r="12" fill="#FFE29A" stroke="#C98700" stroke-width="2"/><text x="79" y="882.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#805300" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#674700" text-anchor="start">One-step / norm-guidance is DiffusionAD&#x27;s deployment state; compare DDAD only with matched ROI, support, decision unit, hardware and complete P95。</text></svg>