<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">求解後回投影</title><desc id="desc">相機姿態和內外參將標定板角點回投影到影像，與觀測角點比較。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="camera_pose" data-renderer-art="markers" data-primitive="camera_pose_reprojection" data-semantic-scene="camera_pose_reprojection" data-semantic-entities="camera_rays|pose|reprojected_points" data-specialist-coverage="camera_rays|pose|reprojected_points" data-semantic-relation="solve pose then reproject to inspect error" data-must-show="相機 | 標定板 | 投射光線與預測角點覆蓋在觀測角點上" data-not-claim="這不是每日產品影像 registration 的流程。"><title>求解後回投影</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="charuco-camera-rays-reprojection"><rect x="82.8" y="101.24000000000001" width="24.64" height="20.8" fill="#FFFFFF" stroke="#1769E0" stroke-width="1"/><rect x="110.52" y="101.24000000000001" width="24.64" height="20.8" fill="#1769E0" stroke="#1769E0" stroke-width="1"/><rect x="138.24" y="101.24000000000001" width="24.64" height="20.8" fill="#FFFFFF" stroke="#1769E0" stroke-width="1"/><rect x="82.8" y="126.2" width="24.64" height="20.8" fill="#1769E0" stroke="#1769E0" stroke-width="1"/><rect x="110.52" y="126.2" width="24.64" height="20.8" fill="#FFFFFF" stroke="#1769E0" stroke-width="1"/><rect x="138.24" y="126.2" width="24.64" height="20.8" f