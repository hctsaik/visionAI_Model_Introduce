<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">以覆蓋與殘差放行</title><desc id="desc">全視野和多姿態的標定資料以 P95 重投影殘差 gate 決定是否採用。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="calibration_coverage_residual" data-renderer-art="markers" data-primitive="calibration_coverage_gate" data-semantic-scene="calibration_coverage_gate" data-semantic-entities="view_coverage|residual_distribution|qualification_gate" data-specialist-coverage="view_coverage|residual_distribution|qualification_gate" data-semantic-relation="release only after coverage and residual checks" data-must-show="FOV 九宮格的角點覆蓋 | 不同板姿態 | 以及 P50/P95 residual gate" data-not-claim="單一低平均 residual 不代表所有畫面位置皆可信。"><title>以覆蓋與殘差放行</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="178.27999999999997" y1="132.44" x2="326.12" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="393.88" y1="132.44" x2="535.56" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><path d="M569.4399999999999 53.39999999999999L584.0 67.96L569.4399999999999 82.52L554.8799999999999 67.96z" fill="#FFF4CC" stroke="#C88400" stroke-width="2"/><g data-entity="view_coverage" data-entity-label-full="view coverage"><path d="M144.39999999999998 108.3664367816092L165.6413793103448 121.11126436781609L165.641379310