<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">大比例遮罩 token</title><desc id="desc">影片 token 格大部分被橘色遮罩，只有少數藍色 token 可見</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="tubelet_mask" data-renderer-art="masked_prediction" data-primitive="tubelet_mask" data-semantic-scene="tubelet_mask" data-semantic-entities="clip|tubelets|masked_cells" data-specialist-coverage="clip|tubelets|masked_cells" data-semantic-relation="hide declared tubelets in a video clip" data-must-show="少數藍色 visible tokens 留下 | 大部分橘色 tubelets 以 mask ratio／seed 覆蓋 | 邊界提示：被遮罩不代表畫面中沒有事件。" data-not-claim="被遮罩不代表畫面中沒有事件。"><title>大比例遮罩 token</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="178.27999999999997" y1="132.44" x2="326.12" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="393.88" y1="132.44" x2="535.56" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="clip" data-entity-label-full="clip"><rect x="114.66206896551722" y="116.86298850574713" width="14.160919540229887" height="26.905747126436786" rx="4" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><rect x="134.48735632183906" y="116.86298850574713" width="14.160919540229887" height="26.905747126436786" rx="4" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><rect x="154.31264