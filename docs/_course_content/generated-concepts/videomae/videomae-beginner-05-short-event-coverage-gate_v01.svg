<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><marker id="a-1769E0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1769E0"/></marker><marker id="a-00A9C7" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#00A9C7"/></marker><marker id="a-F38B00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#F38B00"/></marker><marker id="a-D9485F" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#D9485F"/></marker><marker id="a-159A63" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#159A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#082554"/><rect x="1250" y="33" width="378" height="50" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1439" y="66" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">VIDEOMAE · COVERAGE GATE</text><text x="40" y="108" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="38" font-weight="900" fill="#071D43" text-anchor="start">同一個兩幀事件：密集取樣有機會覆蓋，稀疏 sampling 或長 tubelet 可能從頭就沒看見</text><text x="40" y="153" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="550" fill="#506584" text-anchor="start">這是一個時間反事實，不是模型好壞的宣言；先用 sequence-isolated target truth 檢查 coverage、short-event miss 與 latency。</text><rect x="55" y="225" width="680" height="505" rx="30" fill="#EAFBFD" stroke="#00A9C7" stroke-width="3"/><text x="395" y="295" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#071D43" text-anchor="middle">A. qualified dense clip coverage</text><rect x="105.0" y="360" width="85.0" height="154" rx="16" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><rect x="123.0" y="398" width="49.0" height="56" rx="8" fill="#D7E8FF"/><circle cx="147.5" cy="426" r="13" fill="#00A9C7"/><text x="147.5" y="490" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#071D43" text-anchor="middle">t0</text><rect x="204.0" y="360" width="85.0" height="154" rx="16" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><rect x="222.0" y="398" width="49.0" height="56" rx="8" fill="#D7E8FF"/><circle cx="246.5" cy="426" r="13" fill="#00A9C7"/><text x="246.5" y="490" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#071D43" text-anchor="middle">t1</text><rect x="303.0" y="360" width="85.0" height="154" rx="16" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><rect x="321.0" y="398" width="49.0" height="56" rx="8" fill="#D7E8FF"/><circle cx="345.5" cy="426" r="13" fill="#00A9C7"/><text x="345.5" y="490" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#071D43" text-anchor="middle">t2</text><rect x="402.0" y="360" width="85.0" height="154" rx="16" fill="#FFF7EC" stroke="#F38B00" stroke-width="3"/><rect x="420.0" y="398" width="49.0" height="56" rx="8" fill="#D7E8FF"/><circle cx="444.5" cy="426" r="13" fill="#F38B00"/><text x="444.5" y="490" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#071D43" text-anchor="middle">t3</text><rect x="501.0" y="360" width="85.0" height="154" rx="16" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><rect x="519.0" y="398" width="49.0" height="56" rx="8" fill="#D7E8FF"/><circle cx="543.5" cy="426" r="13" fill="#00A9C7"/><text x="543.5" y="490" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#071D43" text-anchor="middle">t4</text><rect x="600.0" y="360" width="85.0" height="154" rx="16" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><rect x="618.0" y="398" width="49.0" height="56" rx="8" fill="#D7E8FF"/><circle cx="642.5" cy="426" r="13" fill="#00A9C7"/><text x="642.5" y="490" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#071D43" text-anchor="middle">t5</text><text x="395" y="580" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#159A63" text-anchor="middle">event appears in sampled tokens</text><text x="395" y="635" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="800" fill="#506584" text-anchor="middle">then test downstream event head</text><rect x="935" y="225" width="680" height="505" rx="30" fill="#FFF0F2" stroke="#D9485F" stroke-width="3"/><text x="1275" y="295" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#071D43" text-anchor="middle">B. sparse sampling / long tubelet</text><rect x="985.0" y="360" width="184.0" height="154" rx="16" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><rect x="1003.0" y="398" width="148.0" height="56" rx="8" fill="#D7E8FF"/><circle cx="1077.0" cy="426" r="13" fill="#00A9C7"/><text x="1077.0" y="490" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#071D43" text-anchor="middle">t0</text><rect x="1183.0" y="360" width="184.0" height="154" rx="16" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><rect x="1201.0" y="398" width="148.0" height="56" rx="8" fill="#D7E8FF"/><circle cx="1275.0" cy="426" r="13" fill="#00A9C7"/><text x="1275.0" y="490" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#071D43" text-anchor="middle">t1</text><rect x="1381.0" y="360" width="184.0" height="154" rx="16" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><rect x="1399.0" y="398" width="148.0" height="56" rx="8" fill="#D7E8FF"/><circle cx="1473.0" cy="426" r="13" fill="#00A9C7"/><text x="1473.0" y="490" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#071D43" text-anchor="middle">t2</text><text x="1275" y="580" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#D9485F" text-anchor="middle">the two-frame event can fall between samples</text><text x="1275" y="635" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="800" fill="#506584" text-anchor="middle">low loss cannot recover unobserved time</text><rect x="290" y="770" width="1090" height="48" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="835" y="802" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#674500" text-anchor="middle">sequence / lot split · adjacent-clip isolation · event recall / delay · frame-drop · token / VRAM · full P95</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">帶走：短事件 coverage、相鄰 clip 隔離與 end-to-end latency 必須先過關；沒有它們，重建或 encoder throughput 都不能是 production evidence。</text></svg>