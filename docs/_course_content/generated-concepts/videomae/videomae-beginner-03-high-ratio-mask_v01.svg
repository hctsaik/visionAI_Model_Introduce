 y="458" width="38" height="38" rx="7" fill="#F38B00" opacity="0.72"/><rect x="870" y="458" width="38" height="38" rx="7" fill="#F38B00" opacity="0.72"/><rect x="924" y="458" width="38" height="38" rx="7" fill="#00A9C7" opacity="1"/><rect x="600" y="512" width="38" height="38" rx="7" fill="#F38B00" opacity="0.72"/><rect x="654" y="512" width="38" height="38" rx="7" fill="#F38B00" opacity="0.72"/><rect x="708" y="512" width="38" height="38" rx="7" fill="#F38B00" opacity="0.72"/><rect x="762" y="512" width="38" height="38" rx="7" fill="#00A9C7" opacity="1"/><rect x="816" y="512" width="38" height="38" rx="7" fill="#F38B00" opacity="0.72"/><rect x="870" y="512" width="38" height="38" rx="7" fill="#F38B00" opacity="0.72"/><rect x="924" y="512" width="38" height="38" rx="7" fill="#F38B00" opacity="0.72"/><text x="780" y="615" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#F38B00" text-anchor="middle">orange: masked target</text><text x="780" y="652" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#00A9C7" text-anchor="middle">cyan: visible token</text><path d="M1060 450 L1150 450" fill="none" stroke="#00A9C7" stroke-width="6" stroke-linecap="round" marker-end="url(#a-00A9C7)"/><rect x="1180" y="225" width="390" height="495" rx="30" fill="#FFF7EC" stroke="#F38B00" stroke-width="3"/><text x="1375" y="325" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#071D43" text-anchor="middle">declare mask</text><text x="1375" y="380" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#071D43" text-anchor="middle">ratio / shape</text><text x="1375" y="435" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#071D43" text-anchor="middle">seed / policy</text><text x="1375" y="490" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#071D43" text-anchor="middle">visible / masked</text><text x="1375" y="545" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#071D43" text-anchor="middle">token summary</text><text x="1375" y="650" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D9485F" text-anchor="middle">policy change = new training state</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">帶走：可見與被遮的 token 都是 versioned training contract；改 mask policy 時，不能沿用舊表徵或成本結論。</text></svg>