<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">高低分分流</title><desc id="desc">偵測框依分數被切為高分和低分兩個集合。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="score_partition" data-renderer-art="tracks" data-primitive="track_high_low_lanes" data-semantic-scene="track_high_low_lanes" data-semantic-entities="detections|high_score_lane|low_score_lane" data-specialist-coverage="detections|high_score_lane|low_score_lane" data-semantic-relation="keep high and low confidence detections in separate lanes" data-must-show="同一批 boxes 依已宣告門檻分成藍色 high 與灰橘 low detections | 「高低分分流」需以專屬物件與箭頭表達，不得使用通用 family motif。 | 邊界提示：低分 box 不是新的可靠物件。" data-not-claim="低分 box 不是新的可靠物件。"><title>高低分分流</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><rect x="88.95999999999998" y="113.72" width="86.24000000000001" height="52.0" rx="6" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><line x1="187.51999999999998" y1="138.68" x2="286.08000000000004" y2="101.24000000000001" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="187.51999999999998" y1="138.68" x2="286.08000000000004" y2="180.28" stroke="#F38B00" stroke-width="4" marker-end="url(#arrow-orange)"/><rect x="304.55999999999995" y="80.44" width="172.48000000000002" height="37.44" rx="7" fill="#E8FAFF" stroke="#1769E0" stroke-width="3"/><rect x="304.5