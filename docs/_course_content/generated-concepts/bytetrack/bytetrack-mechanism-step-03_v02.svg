<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">兩階段關聯</title><desc id="desc">預測的 track box 先與高分偵測框配對，再以低分框恢復既有軌跡。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="track_association" data-renderer-art="tracks" data-primitive="track_two_pass_association" data-semantic-scene="track_two_pass_association" data-semantic-entities="track_state|high_match|low_recovery" data-specialist-coverage="track_state|high_match|low_recovery" data-semantic-relation="associate high scores first then recover with low scores" data-must-show="Kalman predicted box 先配 high score | 再讓 low score 嘗試 recovery；並畫出 IoU/cost gate | 邊界提示：關聯成功不證明物理身分已被驗證。" data-not-claim="關聯成功不證明物理身分已被驗證。"><title>兩階段關聯</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><circle cx="138.24" cy="140.76" r="22.88" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><line x1="206.0" y1="140.76" x2="310.71999999999997" y2="103.32" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="206.0" y1="140.76" x2="310.71999999999997" y2="178.20000000000002" stroke="#F38B00" stroke-width="4" marker-end="url(#arrow-orange)"/><rect x="329.2" y="80.44" width="104.72000000000001" height="39.52" rx="6" fill="#E8FAFF" stroke="#1769E0" stroke-width="3"/><rect x="329.2" y="159.48000000000002" width="104.72000000000001" height="39.52" rx="6" fill="#FFF7E8" stroke="#F38B00" stroke-width="3" stroke-dasharray="5 3"/><line x1="452.40000000000003" y1="101.24000000000001" x2="544.8" y2="140.76" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="452.40000000000003" y1="180.28" x2="544.8" y2="140.76" stroke="#F38B00" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arrow-orange)"/><circle cx="587.92" cy="140.76" r="20.8" fill="#E8FAFF" stroke="#0AA6D8" stroke-width="3"/><text data-label-line="true" x="138.24" y="226.04" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">track</text><text data-label-line="true" x="378.48" y="74.2" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">high match</text><text data-label-line="true" x="378.48" y="226.04" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">low recover</text><text data-label-line="true" x="587.92" y="226.04" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">update</text></g><text x="42" y="311.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#0B2858">讀圖：兩階段關聯</text><text x="42" y="339.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="700" fill="#8A5600">候選先交 REVIEW／HOLD；完整邊界見圖下說明。</text></svg>