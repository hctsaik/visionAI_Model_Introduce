<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">detector coverage、timebase、occlusion 或 camera drift 失效時，先 HOLD</title>
  <desc id="desc">ByteTrack detector/occlusion/FPS/camera boundary enters a declared detector-to-track gate, branches to candidate review or HOLD, and compares the output responsibility with Frame Difference, LK and RAFT.</desc>
  <defs>
    <marker id="arrow-5f63d8" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#5f63d8"/></marker>
    <marker id="arrow-00a98f" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#00a98f"/></marker>
    <marker id="arrow-f48112" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f48112"/></marker>
    <marker id="arrow-e04c62" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e04c62"/></marker>
  </defs>
  <rect width="1672" height="941" fill="#f7fbff"/><rect width="1672" height="10" fill="#172c5e"/><rect x="40" y="33" width="439" height="39" rx="19" fill="#5f63d8" opacity=".12"/><text x="60" y="58" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#5f63d8">tracker boundary → HOLD</text><text x="40" y="126" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="39" font-weight="850" fill="#0b285b">detector coverage、timebase、occlusion 或 camera drift 失效時，先 HOLD</text><text x="40" y="168" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="600" fill="#4d6e9d">ByteTrack 的弱點首先是上游 detector 與採樣：detector miss、crossing、FPS/drop、ROI drift 都能改寫 association 與 lifecycle。</text><rect x="1412" y="35" width="220" height="48" rx="24" fill="#ffffff" stroke="#a9a9f0" stroke-width="2"/><text x="1522" y="67" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="850" fill="#5f63d8">BYTETRACK</text><rect x="46" y="226" width="514" height="395" rx="24" fill="#fff7f8" stroke="#e04c62" stroke-width="3"/><text x="303" y="274" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="27" font-weight="850" fill="#a92b42">what can break association?</text><rect x="83" y="317" width="435" height="216" rx="18" fill="#f3f8ff" stroke="#98b9e9" stroke-width="2"/><rect x="99" y="343" width="403" height="161" rx="10" fill="#263b54"/><path d="M 105 372 H 496 M 105 485 H 496" stroke="#c6d4e2" stroke-width="5"/><path d="M 374.45000000000005 348 L 444.04999999999995 483" stroke="#f0f2f5" stroke-width="6" opacity=".85"/><rect x="237" y="407.72" width="72" height="44" rx="7" fill="#2776d6" stroke="#ffffff" stroke-width="2"/><path d="M 251 420.68 V 459.56 H 284" fill="none" stroke="#ffffff" stroke-width="6"/><rect x="265.7" y="351" width="82.65" height="140" rx="8" fill="#909baa" opacity=".92"/><rect x="133" y="386" width="104" height="65" rx="7" fill="none" stroke="#e04c62" stroke-width="4" stroke-dasharray="9 7"/><text x="185" y="425" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#e04c62">miss</text><text x="303" y="559" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#a92b42">detector miss / score shift / NMS loss</text><text x="303" y="591" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="750" fill="#a92b42">occlusion / crossing · FPS drop / timestamp gap · camera drift</text><path d="M 585 422 L 650 422" fill="none" stroke="#e04c62" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-e04c62)"/><rect x="672" y="220" width="500" height="406" rx="26" fill="#fffaf2" stroke="#f48112" stroke-width="3"/><text x="922" y="270" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="27" font-weight="850" fill="#a85b09">declared detector-to-track gate</text><text x="922" y="305" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="700" fill="#a85b09">track score is not detector recall</text><path d="M 744 349 H 1100" stroke="#f0a348" stroke-width="4" stroke-linecap="round"/><text x="922" y="385" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="800" fill="#a85b09"><tspan x="922" dy="0">detector coverage / class / NMS</tspan><tspan x="922" dy="38">high + low thresholds</tspan><tspan x="922" dy="38">Kalman / IoU / motion / cost gate</tspan><tspan x="922" dy="38">frame sampling / buffer / lifecycle</tspan></text><path d="M 744 565 H 1100" stroke="#f0a348" stroke-width="4" stroke-linecap="round"/><path d="M 1196 342 L 1252 342" fill="none" stroke="#00a98f" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-00a98f)"/><path d="M 1196 512 L 1252 512" fill="none" stroke="#e04c62" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-e04c62)"/><rect x="1274" y="247" width="330" height="175" rx="22" fill="#effbf7" stroke="#00a98f" stroke-width="3"/><text x="1439" y="300" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="850" fill="#008e7a">versioned track evidence</text><text x="1439" y="340" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="750" fill="#008e7a">event aggregation</text><text x="1439" y="381" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="850" fill="#008e7a">candidate → REVIEW</text><rect x="1274" y="459" width="330" height="146" rx="22" fill="#fff7f8" stroke="#e04c62" stroke-width="3"/><text x="1439" y="510" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="850" fill="#a92b42">missing / unstable evidence</text><text x="1439" y="551" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="850" fill="#a92b42">HOLD → audit / re-capture</text><text x="58" y="691" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="26" font-weight="850" fill="#163a70">Choose the output you actually need</text><path d="M 82 744 H 1590" stroke="#b7cfef" stroke-width="5" stroke-linecap="round"/><circle cx="238" cy="744" r="13" fill="#f48112"/><text x="238" y="792" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#42638e">changed pixels → Frame Difference</text><circle cx="626" cy="744" r="13" fill="#2b7ae8"/><text x="626" y="792" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#42638e">local vectors → Lucas–Kanade</text><circle cx="1008" cy="744" r="13" fill="#00a98f"/><text x="1008" y="792" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#42638e">dense flow → RAFT</text><circle cx="1408" cy="744" r="13" fill="#5f63d8"/><text x="1408" y="792" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#42638e">box + ID history → ByteTrack</text><rect x="40" y="855" width="1592" height="55" rx="26" fill="#fff3cf" stroke="#f0ad25" stroke-width="2"/><path d="M 76 878 q 12 -20 24 0 q -2 20 -12 20 q -10 0 -12 -20 M 88 866 v-14 M 63 878 h-13 M 113 878 h13" fill="none" stroke="#d18a00" stroke-width="3" stroke-linecap="round"/><text x="124" y="889" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="800" fill="#885c00">ByteTrack links detector boxes into lifecycle evidence; it does not create optical flow, detector recall, verified identity or a release decision.</text>
</svg>
