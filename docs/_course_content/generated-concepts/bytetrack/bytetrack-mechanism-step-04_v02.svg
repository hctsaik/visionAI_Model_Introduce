<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">生命週期後才成事件</title><desc id="desc">追蹤框在 matched、new、lost、removed 狀態間轉換，最後才由軌跡規則送事件候選。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="track_lifecycle" data-renderer-art="tracks" data-primitive="track_lifecycle_state_machine" data-semantic-scene="track_lifecycle_state_machine" data-semantic-entities="new_track|active_track|lost_track|event_gate" data-specialist-coverage="new_track|active_track|lost_track|event_gate" data-semantic-relation="turn track states into an event only at the declared lifecycle point" data-must-show="matched、new、lost、removed 狀態連到 dwell／trajectory event queue | 「生命週期後才成事件」需以專屬物件與箭頭表達，不得使用通用 family motif。 | 邊界提示：track ID 不是最終身分或動作結論。" data-not-claim="track ID 不是最終身分或動作結論。"><title>生命週期後才成事件</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><circle cx="144.39999999999998" cy="138.68" r="21.84" fill="#F7FBFF" stroke="#1769E0" stroke-width="3"/><text data-label-line="true" x="144.39999999999998" y="147.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">new</text><circle cx="298.4" cy="138.68" r="21.84" fill="#F7FBFF" stroke="#0AA6D8" stroke-width="3"/><text data-label-line="true" x="298.4" y="147.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">active</text><line x1="167.27999999999997" y1="138.68" x2="275.52" y2="138.68" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><circle cx="452.40000000000003" cy="138.68" r="21.84" fill="#F7FBFF" stroke="#F38B00" stroke-width="3"/><text data-label-line="true" x="452.40000000000003" y="147.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">lost</text><line x1="321.28" y1="138.68" x2="429.52000000000004" y2="138.68" stroke="#F38B00" stroke-width="4" marker-end="url(#arrow-orange)"/><circle cx="594.08" cy="138.68" r="21.84" fill="#F7FBFF" stroke="#D84A4A" stroke-width="3"/><text data-label-line="true" x="594.08" y="147.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#D84A4A">event</text><line x1="475.28000000000003" y1="138.68" x2="571.2" y2="138.68" stroke="#D84A4A" stroke-width="4" marker-end="url(#arrow-blue)"/><path d="M452.40000000000003 105.4c49.28-52.0 -135.52-56.160000000000004 -166.32000000000002-4.16" fill="none" stroke="#F38B00" stroke-width="3" stroke-dasharray="5 3" marker-end="url(#arrow-orange)"/><text data-label-line="true" x="360.0" y="219.79999999999998" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">lifecycle →</text><text data-label-line="true" x="360.0" y="235.14" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">event gate</text></g><text x="42" y="311.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#0B2858">讀圖：生命週期後才成事件</text><text x="42" y="339.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="700" fill="#8A5600">候選先交 REVIEW／HOLD；完整邊界見圖下說明。</text></svg>