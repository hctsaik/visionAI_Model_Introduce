<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">先用 high-score boxes 關聯，再讓相容的 low-score box 回補既有 track</title>
  <desc id="desc">ByteTrack 先用 high-score detector box 連上 Kalman prediction，再用 low-score box 對尚未匹配的既有 track 進行 recovery，並明示低分 box 不自動是真實或新 ID。</desc>
  <defs>
    <marker id="arrow-5f63d8" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#5f63d8"/></marker>
    <marker id="arrow-00a98f" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#00a98f"/></marker>
    <marker id="arrow-f48112" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f48112"/></marker>
    <marker id="arrow-e04c62" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e04c62"/></marker>
  </defs>
  <rect width="1672" height="941" fill="#f7fbff"/><rect width="1672" height="10" fill="#172c5e"/><rect x="40" y="33" width="473" height="39" rx="19" fill="#5f63d8" opacity=".12"/><text x="60" y="58" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#5f63d8">high first → low recovery</text><text x="40" y="126" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="39" font-weight="850" fill="#0b285b">先用 high-score boxes 關聯，再讓相容的 low-score box 回補既有 track</text><text x="40" y="168" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="600" fill="#4d6e9d">兩個分數集合與 association gate 都必須版本化：低分不是自動雜訊，也不是自動真實或新身分。</text><rect x="1412" y="35" width="220" height="48" rx="24" fill="#ffffff" stroke="#a9a9f0" stroke-width="2"/><text x="1522" y="67" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="850" fill="#5f63d8">BYTETRACK</text><text x="50" y="227" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="26" font-weight="850" fill="#5f63d8">existing Kalman track prediction</text><rect x="50" y="250" width="375" height="204" rx="18" fill="#f3f8ff" stroke="#98b9e9" stroke-width="2"/><rect x="66" y="276" width="343" height="149" rx="10" fill="#263b54"/><path d="M 72 305 H 403 M 72 406 H 403" stroke="#c6d4e2" stroke-width="5"/><path d="M 301.25 281 L 361.25 404" stroke="#f0f2f5" stroke-width="6" opacity=".85"/><rect x="185" y="335.68" width="72" height="44" rx="7" fill="#2776d6" stroke="#ffffff" stroke-width="2"/><path d="M 199 347.92 V 384.64 H 232" fill="none" stroke="#ffffff" stroke-width="6"/><rect x="178" y="329" width="84" height="51" rx="8" fill="none" stroke="#5f63d8" stroke-width="4" stroke-dasharray="10 7"/><rect x="186" y="289" width="220" height="36" rx="18" fill="#5f63d8"/><text x="198" y="313" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#ffffff">track T-07 predict</text><path d="M 451 352 L 532 352" fill="none" stroke="#5f63d8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-5f63d8)"/><rect x="554" y="228" width="635" height="228" rx="24" fill="#effbf7" stroke="#00a98f" stroke-width="3"/><text x="871" y="275" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="27" font-weight="850" fill="#008e7a">stage 1 · high-score association</text><rect x="586" y="304" width="190" height="108" rx="18" fill="#f3f8ff" stroke="#98b9e9" stroke-width="2"/><rect x="602" y="330" width="158" height="53" rx="10" fill="#263b54"/><path d="M 608 359 H 754 M 608 364 H 754" stroke="#c6d4e2" stroke-width="5"/><path d="M 713.3 335 L 743.7 362" stroke="#f0f2f5" stroke-width="6" opacity=".85"/><rect x="657" y="349.36" width="72" height="44" rx="7" fill="#2776d6" stroke="#ffffff" stroke-width="2"/><path d="M 671 355.84 V 375.28 H 704" fill="none" stroke="#ffffff" stroke-width="6"/><rect x="654" y="352" width="62" height="39" rx="8" fill="none" stroke="#00a98f" stroke-width="4"/><rect x="662" y="312" width="122" height="36" rx="18" fill="#00a98f"/><text x="674" y="336" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#ffffff">box 0.91</text><path d="M 804 352 L 866 352" fill="none" stroke="#00a98f" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-00a98f)"/><text x="935" y="334" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="750" fill="#008e7a"><tspan x="935" dy="0">IoU / motion /</tspan><tspan x="935" dy="28">declared cost gate</tspan></text><text x="1045" y="405" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="850" fill="#008e7a">match T-07</text><path d="M 91 497 H 1564" stroke="#c9d7ec" stroke-width="4" stroke-linecap="round"/><text x="50" y="521" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="850" fill="#5f63d8">after high-score matches: remaining predicted track</text><rect x="50" y="584" width="375" height="180" rx="18" fill="#f3f8ff" stroke="#98b9e9" stroke-width="2"/><rect x="66" y="610" width="343" height="125" rx="10" fill="#263b54"/><path d="M 72 639 H 403 M 72 716 H 403" stroke="#c6d4e2" stroke-width="5"/><path d="M 301.25 615 L 361.25 714" stroke="#f0f2f5" stroke-width="6" opacity=".85"/><rect x="222" y="659.6" width="72" height="44" rx="7" fill="#2776d6" stroke="#ffffff" stroke-width="2"/><path d="M 236 670.4 V 702.8 H 269" fill="none" stroke="#ffffff" stroke-width="6"/><rect x="214" y="650" width="84" height="51" rx="8" fill="none" stroke="#5f63d8" stroke-width="4" stroke-dasharray="10 7"/><rect x="222" y="610" width="220" height="36" rx="18" fill="#5f63d8"/><text x="234" y="634" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#ffffff">track T-07 predict</text><path d="M 451 674 L 532 674" fill="none" stroke="#5f63d8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-5f63d8)"/><rect x="554" y="555" width="635" height="246" rx="24" fill="#fffaf2" stroke="#f48112" stroke-width="3"/><text x="871" y="601" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="27" font-weight="850" fill="#a85b09">stage 2 · low-score recovery</text><rect x="586" y="641" width="190" height="112" rx="18" fill="#f3f8ff" stroke="#98b9e9" stroke-width="2"/><rect x="602" y="667" width="158" height="57" rx="10" fill="#263b54"/><path d="M 608 696 H 754 M 608 705 H 754" stroke="#c6d4e2" stroke-width="5"/><path d="M 713.3 672 L 743.7 703" stroke="#f0f2f5" stroke-width="6" opacity=".85"/><rect x="668" y="688.04" width="72" height="44" rx="7" fill="#2776d6" stroke="#ffffff" stroke-width="2"/><path d="M 682 694.76 V 714.92 H 715" fill="none" stroke="#ffffff" stroke-width="6"/><rect x="660" y="685" width="62" height="39" rx="8" fill="none" stroke="#f48112" stroke-width="4"/><rect x="668" y="645" width="166" height="36" rx="18" fill="#f48112"/><text x="680" y="669" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#ffffff">low box 0.28</text><path d="M 804 696 L 866 696" fill="none" stroke="#f48112" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-f48112)"/><text x="1038" y="675" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="750" fill="#a85b09">compatible with</text><text x="1038" y="706" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="750" fill="#a85b09">IoU / motion gate?</text><text x="1038" y="753" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="850" fill="#008e7a">yes → recover T-07</text><rect x="1220" y="554" width="370" height="247" rx="22" fill="#fff7f8" stroke="#e04c62" stroke-width="3"/><text x="1405" y="599" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="25" font-weight="850" fill="#a92b42">low score is not a verdict</text><text x="1405" y="650" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="700" fill="#a92b42"><tspan x="1405" dy="0">not noise by default</tspan><tspan x="1405" dy="35">not truth by default</tspan><tspan x="1405" dy="35">not a new ID</tspan></text><text x="1405" y="773" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="750" fill="#a92b42">preserve cost + unmatched evidence</text><rect x="40" y="855" width="1592" height="55" rx="26" fill="#fff3cf" stroke="#f0ad25" stroke-width="2"/><path d="M 76 878 q 12 -20 24 0 q -2 20 -12 20 q -10 0 -12 -20 M 88 866 v-14 M 63 878 h-13 M 113 878 h13" fill="none" stroke="#d18a00" stroke-width="3" stroke-linecap="round"/><text x="124" y="889" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="800" fill="#885c00">Low-score recovery only links a compatible existing prediction; it cannot recover an object without a detector candidate.</text>
</svg>
