<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">track lifecycle、box history 與 ID 都要保存；ID 是 bookkeeping，不是實體身分</title>
  <desc id="desc">一條 T-07 軌跡由 new, tracked, low-score recovery, unmatched/lost, buffer/removed 等 state 構成；下游另以 dwell/trajectory aggregation 形成 review candidate。</desc>
  <defs>
    <marker id="arrow-5f63d8" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#5f63d8"/></marker>
    <marker id="arrow-00a98f" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#00a98f"/></marker>
    <marker id="arrow-f48112" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f48112"/></marker>
    <marker id="arrow-e04c62" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e04c62"/></marker>
  </defs>
  <rect width="1672" height="941" fill="#f7fbff"/><rect width="1672" height="10" fill="#172c5e"/><rect x="40" y="33" width="507" height="39" rx="19" fill="#5f63d8" opacity=".12"/><text x="60" y="58" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#5f63d8">matches → lifecycle → event</text><text x="40" y="126" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="39" font-weight="850" fill="#0b285b">track lifecycle、box history 與 ID 都要保存；ID 是 bookkeeping，不是實體身分</text><text x="40" y="168" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="600" fill="#4d6e9d">每次 match / unmatched 都會改寫 track state；dwell 或 trajectory event 必須另有版本化 aggregation 和 review action。</text><rect x="1412" y="35" width="220" height="48" rx="24" fill="#ffffff" stroke="#a9a9f0" stroke-width="2"/><text x="1522" y="67" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="850" fill="#5f63d8">BYTETRACK</text><text x="55" y="242" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="28" font-weight="850" fill="#163a70">one declared track state over time</text><path d="M 114 410 H 1278" stroke="#c5d7ef" stroke-width="7" stroke-linecap="round"/><circle cx="168" cy="410" r="30" fill="#5f63d8" stroke="#ffffff" stroke-width="5"/><text x="168" y="360" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="800" fill="#42638e">t0</text><text x="168" y="470" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="850" fill="#5f63d8">new</text><circle cx="415" cy="410" r="30" fill="#00a98f" stroke="#ffffff" stroke-width="5"/><text x="415" y="360" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="800" fill="#42638e">t1</text><text x="415" y="470" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="850" fill="#00a98f">tracked</text><circle cx="662" cy="410" r="30" fill="#f48112" stroke="#ffffff" stroke-width="5"/><text x="662" y="360" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="800" fill="#42638e">t2</text><text x="662" y="470" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="850" fill="#f48112">low recovery</text><circle cx="909" cy="410" r="30" fill="#e04c62" stroke="#ffffff" stroke-width="5"/><text x="909" y="360" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="800" fill="#42638e">t3</text><text x="909" y="470" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="850" fill="#e04c62">unmatched → lost</text><circle cx="1156" cy="410" r="30" fill="#8c99a8" stroke="#ffffff" stroke-width="5"/><text x="1156" y="360" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="800" fill="#42638e">buffer</text><text x="1156" y="470" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="850" fill="#8c99a8">removed</text><rect x="123" y="303" width="90" height="58" rx="8" fill="none" stroke="#00a98f" stroke-width="4"/><rect x="131" y="263" width="122" height="36" rx="18" fill="#00a98f"/><text x="143" y="287" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#ffffff">box 0.94</text><rect x="370" y="303" width="90" height="58" rx="8" fill="none" stroke="#00a98f" stroke-width="4"/><rect x="378" y="263" width="122" height="36" rx="18" fill="#00a98f"/><text x="390" y="287" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#ffffff">box 0.92</text><rect x="617" y="303" width="90" height="58" rx="8" fill="none" stroke="#f48112" stroke-width="4"/><rect x="625" y="263" width="122" height="36" rx="18" fill="#f48112"/><text x="637" y="287" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#ffffff">low 0.27</text><rect x="861" y="303" width="96" height="58" rx="8" fill="none" stroke="#e04c62" stroke-width="4" stroke-dasharray="10 7"/><text x="909" y="339" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#e04c62">no box</text><rect x="1107" y="303" width="98" height="58" rx="8" fill="none" stroke="#8c99a8" stroke-width="4" stroke-dasharray="8 7"/><text x="1156" y="339" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#7a8798">timeout</text><rect x="76" y="533" width="1120" height="171" rx="24" fill="#f4f4ff" stroke="#5f63d8" stroke-width="3"/><text x="636" y="578" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="28" font-weight="850" fill="#474bbc">track record T-07</text><text x="152" y="618" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="700" fill="#42638e"><tspan x="152" dy="0">box history + detector scores</tspan><tspan x="152" dy="27">Kalman state / prediction residual</tspan><tspan x="152" dy="27">association cost / match / unmatched</tspan><tspan x="152" dy="27">lifecycle transition + ID switch / fragment</tspan></text><text x="895" y="628" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="800" fill="#474bbc">T-07 is an ID under this detector + association contract.</text><text x="895" y="665" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="750" fill="#a92b42">It is not proof of physical identity, class, cause or detector recall.</text><path d="M 1222 619 L 1300 619" fill="none" stroke="#00a98f" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-00a98f)"/><rect x="1322" y="543" width="288" height="160" rx="22" fill="#effbf7" stroke="#00a98f" stroke-width="3"/><text x="1466" y="590" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="850" fill="#008e7a">track-to-event rule</text><text x="1466" y="629" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="750" fill="#008e7a">dwell / trajectory</text><text x="1466" y="668" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="850" fill="#008e7a">candidate → REVIEW</text><rect x="183" y="750" width="1306" height="52" rx="20" fill="#f2f7fd" stroke="#9db8df" stroke-width="2"/><text x="836" y="784" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="750" fill="#163a70">Track aggregation, event window, dedup, queue and owner action are separate versioned rules—not IDF1 or detector score.</text><rect x="40" y="855" width="1592" height="55" rx="26" fill="#fff3cf" stroke="#f0ad25" stroke-width="2"/><path d="M 76 878 q 12 -20 24 0 q -2 20 -12 20 q -10 0 -12 -20 M 88 866 v-14 M 63 878 h-13 M 113 878 h13" fill="none" stroke="#d18a00" stroke-width="3" stroke-linecap="round"/><text x="124" y="889" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="800" fill="#885c00">A ByteTrack ID records association history and lifecycle; only a separate track-to-event contract can create a reviewable candidate.</text>
</svg>
