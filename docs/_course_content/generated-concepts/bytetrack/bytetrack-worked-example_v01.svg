<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">ByteTrack 的同一工作例說明圖</title>
  <desc id="desc">四個連續面板呈現固定工作例、預測、模型輸出與人類應如何安全解讀。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0B3068" flood-opacity=".12"/></filter>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker>
    <marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker>
    <style>text { dominant-baseline: alphabetic; } .fine { fill:#536A91; font-size:18px; }</style>
  </defs>
  <rect width="1672" height="941" fill="#F5F8FE"/>
  <rect x="40" y="32" width="150" height="32" rx="16" fill="#E6F0FF"/><text x="58" y="54.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="16" font-weight="800" fill="#1769E0">同一個工作例</text><text x="40" y="116" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="43" font-weight="900" fill="#071A3B">先預測，再看模型如何回答</text><text x="40" y="182" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="500" fill="#50698F">把同一個現場情境走一次：模型的輸出幫人決定下一個該回看的地方，而不是替人宣告真相。</text><text x="1630" y="57.0" text-anchor="end" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#5C7395">ByteTrack</text><rect x="40" y="266" width="372" height="518" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><g data-visual-cue="detector_boxes" data-renderer-art="tracks" data-primitive="track_detection_boxes" data-semantic-scene="track_detection_boxes" data-semantic-entities="frame|detection_boxes|scores" data-specialist-coverage="frame|detection_boxes|scores" data-semantic-relation="detector produces scored boxes before tracking" data-must-show="timestamped frame 經已具名 detector 後才出現 boxes、class 與 scores | 「偵測器先交 boxes」需以專屬物件與箭頭表達，不得使用通用 family motif。 | 邊界提示：ByteTrack 不會自行補出 detector 沒有給的量測。" data-not-claim="ByteTrack 不會自行補出 detector 沒有給的量測。"><title>偵測器先交 boxes</title><rect x="64" y="294" width="324" height="122" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><rect x="108.4" y="329.24" width="64.4" height="41.4" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M114.84 359.462 L129.65200000000002 348.698 L141.888 355.736 L161.208 339.59000000000003" fill="none" stroke="#93B8E8" stroke-width="3"/><rect x="231.6" y="329.24" width="64.4" height="41.4" rx="8" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="3"/><path d="M238.04 359.462 L252.852 348.698 L265.088 355.736 L284.408 339.59000000000003" fill="none" stroke="#93B8E8" stroke-width="3"/><rect x="128.0" y="340.28" width="25.2" height="15.64" fill="none" stroke="#F38B00" stroke-width="3"/><rect x="259.6" y="335.68" width="25.2" height="15.64" fill="none" stroke="#F38B00" stroke-width="3"/><line x1="161.60000000000002" y1="348.56" x2="223.2" y2="343.96" stroke="#F38B00" stroke-width="4" marker-end="url(#arrow-orange)"/><rect x="310.0" y="332.92" width="28.0" height="31.28" rx="5" fill="#E8FAFF" stroke="#0AA6D8" stroke-width="3"/><line x1="318.4" y1="342.12" x2="332.4" y2="342.12" stroke="#F38B00" stroke-width="4"/><text data-label-line="true" x="139.20000000000002" y="389.96" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">frame t</text><text data-label-line="true" x="262.4" y="389.96" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">boxes</text><text data-label-line="true" x="324.0" y="389.96" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">scores</text></g><circle cx="360" cy="332" r="25" fill="#1769E0"/><text x="360" y="340.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">1</text><text x="68" y="448" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="25" font-weight="900" fill="#0B2858">固定工作例</text><text x="68" y="520" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">一個工件被短暫遮擋；下一幀</text><text x="68" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">detector 給出低分但位置相容</text><text x="68" y="576" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">的 box。</text><rect x="445" y="266" width="372" height="518" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><g data-visual-cue="score_partition" data-renderer-art="tracks" data-primitive="track_high_low_lanes" data-semantic-scene="track_high_low_lanes" data-semantic-entities="detections|high_score_lane|low_score_lane" data-specialist-coverage="detections|high_score_lane|low_score_lane" data-semantic-relation="keep high and low confidence detections in separate lanes" data-must-show="同一批 boxes 依已宣告門檻分成藍色 high 與灰橘 low detections | 「高低分分流」需以專屬物件與箭頭表達，不得使用通用 family motif。 | 邊界提示：低分 box 不是新的可靠物件。" data-not-claim="低分 box 不是新的可靠物件。"><title>高低分分流</title><rect x="469" y="294" width="324" height="122" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><rect x="507.79999999999995" y="340.28" width="39.2" height="23.0" rx="6" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><line x1="552.6" y1="351.32" x2="597.4" y2="334.76" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="552.6" y1="351.32" x2="597.4" y2="369.72" stroke="#F38B00" stroke-width="4" marker-end="url(#arrow-orange)"/><rect x="605.8" y="325.56" width="78.4" height="16.56" rx="7" fill="#E8FAFF" stroke="#1769E0" stroke-width="3"/><rect x="605.8" y="361.44" width="78.4" height="16.56" rx="7" fill="#FFF7E8" stroke="#F38B00" stroke-width="3"/><circle cx="703.8" cy="333.84000000000003" r="6.44" fill="#1769E0"/><circle cx="703.8" cy="369.72" r="6.44" fill="#F38B00"/><text data-label-line="true" x="527.4" y="389.96" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">detections</text><text data-label-line="true" x="645.0" y="322.8" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">high</text><text data-label-line="true" x="645.0" y="389.04" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">low</text></g><circle cx="765" cy="332" r="25" fill="#0AA6D8"/><text x="765" y="340.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">2</text><text x="473" y="448" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="25" font-weight="900" fill="#0B2858">先做預測</text><text x="473" y="520" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">把低分 box 接回既有 track，</text><text x="473" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">是否表示 detector 變得更準</text><text x="473" y="576" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">或工件身分已被證明？</text><rect x="850" y="266" width="372" height="518" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><g data-visual-cue="track_association" data-renderer-art="tracks" data-primitive="track_two_pass_association" data-semantic-scene="track_two_pass_association" data-semantic-entities="track_state|high_match|low_recovery" data-specialist-coverage="track_state|high_match|low_recovery" data-semantic-relation="associate high scores first then recover with low scores" data-must-show="Kalman predicted box 先配 high score | 再讓 low score 嘗試 recovery；並畫出 IoU/cost gate | 邊界提示：關聯成功不證明物理身分已被驗證。" data-not-claim="關聯成功不證明物理身分已被驗證。"><title>兩階段關聯</title><rect x="874" y="294" width="324" height="122" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><circle cx="935.2" cy="352.24" r="10.12" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><line x1="966.0" y1="352.24" x2="1013.6" y2="335.68" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="966.0" y1="352.24" x2="1013.6" y2="368.8" stroke="#F38B00" stroke-width="4" marker-end="url(#arrow-orange)"/><rect x="1022.0" y="325.56" width="47.6" height="17.48" rx="6" fill="#E8FAFF" stroke="#1769E0" stroke-width="3"/><rect x="1022.0" y="360.52" width="47.6" height="17.48" rx="6" fill="#FFF7E8" stroke="#F38B00" stroke-width="3" stroke-dasharray="5 3"/><line x1="1078.0" y1="334.76" x2="1120.0" y2="352.24" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="1078.0" y1="369.72" x2="1120.0" y2="352.24" stroke="#F38B00" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arrow-orange)"/><circle cx="1139.6" cy="352.24" r="9.200000000000001" fill="#E8FAFF" stroke="#0AA6D8" stroke-width="3"/><text data-label-line="true" x="935.2" y="389.96" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">track</text><text data-label-line="true" x="1044.4" y="322.8" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">high match</text><text data-label-line="true" x="1044.4" y="389.96" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">low recover</text><text data-label-line="true" x="1139.6" y="389.96" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">update</text></g><circle cx="1170" cy="332" r="25" fill="#F38B00"/><text x="1170" y="340.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">3</text><text x="878" y="448" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="25" font-weight="900" fill="#0B2858">模型看到什麼</text><text x="878" y="520" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">不是。它只是在既定 IoU／</text><text x="878" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">motion gate 下維持軌跡連續；</text><text x="878" y="576" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">保存 high/low partition、</text><text x="878" y="604" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">prediction、association</text><text x="878" y="632" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">cost、match 與 lifecycle。</text><rect x="1255" y="266" width="372" height="518" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><g data-visual-cue="track_lifecycle" data-renderer-art="tracks" data-primitive="track_lifecycle_state_machine" data-semantic-scene="track_lifecycle_state_machine" data-semantic-entities="new_track|active_track|lost_track|event_gate" data-specialist-coverage="new_track|active_track|lost_track|event_gate" data-semantic-relation="turn track states into an event only at the declared lifecycle point" data-must-show="matched、new、lost、removed 狀態連到 dwell／trajectory event queue | 「生命週期後才成事件」需以專屬物件與箭頭表達，不得使用通用 family motif。 | 邊界提示：track ID 不是最終身分或動作結論。" data-not-claim="track ID 不是最終身分或動作結論。"><title>生命週期後才成事件</title><rect x="1279" y="294" width="324" height="122" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><circle cx="1343.0" cy="351.32" r="9.66" fill="#F7FBFF" stroke="#1769E0" stroke-width="3"/><text data-label-line="true" x="1343.0" y="355.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">new</text><circle cx="1413.0" cy="351.32" r="9.66" fill="#F7FBFF" stroke="#0AA6D8" stroke-width="3"/><text data-label-line="true" x="1413.0" y="355.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">active</text><line x1="1353.12" y1="351.32" x2="1402.88" y2="351.32" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><circle cx="1483.0" cy="351.32" r="9.66" fill="#F7FBFF" stroke="#F38B00" stroke-width="3"/><text data-label-line="true" x="1483.0" y="355.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">lost</text><line x1="1423.12" y1="351.32" x2="1472.88" y2="351.32" stroke="#F38B00" stroke-width="4" marker-end="url(#arrow-orange)"/><circle cx="1547.4" cy="351.32" r="9.66" fill="#F7FBFF" stroke="#D84A4A" stroke-width="3"/><text data-label-line="true" x="1547.4" y="355.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#D84A4A">event</text><line x1="1493.12" y1="351.32" x2="1537.2800000000002" y2="351.32" stroke="#D84A4A" stroke-width="4" marker-end="url(#arrow-blue)"/><path d="M1483.0 336.6c22.400000000000002-23.0 -61.6-24.840000000000003 -75.60000000000001-1.84" fill="none" stroke="#F38B00" stroke-width="3" stroke-dasharray="5 3" marker-end="url(#arrow-orange)"/><text data-label-line="true" x="1441.0" y="383.71999999999997" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">lifecycle →</text><text data-label-line="true" x="1441.0" y="399.05999999999995" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">event gate</text></g><circle cx="1575" cy="332" r="25" fill="#C88400"/><text x="1575" y="340.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">4</text><text x="1283" y="448" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="25" font-weight="900" fill="#0B2858">人應如何解讀</text><text x="1283" y="520" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">輸出是版本化 track ID、box</text><text x="1283" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">history、association</text><text x="1283" y="576" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">evidence 與 lifecycle，不會</text><text x="1283" y="604" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">提升 detector recall 或驗證</text><text x="1283" y="632" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">物理身分。</text><line x1="416" y1="525" x2="433" y2="525" stroke="#1769E0" stroke-width="5" marker-end="url(#arrow-blue)"/><line x1="821" y1="525" x2="838" y2="525" stroke="#1769E0" stroke-width="5" marker-end="url(#arrow-blue)"/><line x1="1226" y1="525" x2="1243" y2="525" stroke="#1769E0" stroke-width="5" marker-end="url(#arrow-blue)"/><rect x="40" y="810" width="1592" height="100" rx="20" fill="#FFF4CC" stroke="#F1B828"/><text x="68" y="842.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="900" fill="#674500">這張圖要帶走：</text><text x="68" y="871" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="600" fill="#674500">低分回補不是憑空造出量測。detector 沒有給可用 box 時，ByteTrack 無法復原該物；track ID 是 bookkeeping，不是被驗證的真實身分。</text>
</svg>