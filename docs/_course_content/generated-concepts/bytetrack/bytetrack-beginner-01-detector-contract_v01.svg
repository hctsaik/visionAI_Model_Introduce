    <marker id="arrow-f48112" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f48112"/></marker>
    <marker id="arrow-e04c62" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e04c62"/></marker>
  </defs>
  <rect width="1672" height="941" fill="#f7fbff"/><rect width="1672" height="10" fill="#172c5e"/><rect x="40" y="33" width="473" height="39" rx="19" fill="#5f63d8" opacity=".12"/><text x="60" y="58" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#5f63d8">frame → detector contract</text><text x="40" y="126" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="39" font-weight="850" fill="#0b285b">每一幀先有 detector boxes、scores 與 timebase；追蹤只能關聯它看見的候選</text><text x="40" y="168" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="600" fill="#4d6e9d">ByteTrack 的輸入不是像素 motion：它依賴既定 detector、class policy、NMS 與每一幀已存的 boxes / scores。</text><rect x="1412" y="35" width="220" height="48" rx="24" fill="#ffffff" stroke="#a9a9f0" stroke-width="2"/><text x="1522" y="67" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="850" fill="#5f63d8">BYTETRACK</text><clipPath id="sequence-clip"><rect x="42" y="224" width="1020" height="574" rx="22"/></clipPath><g clip-path="url(#sequence-clip)"><svg x="42" y="224" width="1020" height="574" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid slice"><image href="bytetrack-aoi-conveyor-three-frames_v01.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/></svg></g><rect x="42" y="224" width="1020" height="574" rx="22" fill="none" stroke="#5f63d8" stroke-width="3"/><text x="154" y="267" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="850" fill="#5f63d8">t0 · timestamp saved</text><text x="492" y="267" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="850" fill="#5f63d8">t1 · timestamp saved</text><text x="832" y="267" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="850" fill="#5f63d8">t2 · timestamp saved</text><rect x="142" y="457" width="125" height="90" rx="8" fill="none" stroke="#00a98f" stroke-width="4"/><rect x="150" y="417" width="125" height="36" rx="18" fill="#00a98f"/><text x="162" y="441" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#ffffff">box 0.93</text><rect x="493" y="457" width="125" height="90" rx="8" fill="none" stroke="#00a98f" stroke-width="4"/><rect x="501" y="417" width="125" height="36" rx="18" fill="#00a98f"/><text x="513" y="441" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#ffffff">box 0.88</text><rect x="877" y="457" width="125" height="90" rx="8" fill="none" stroke="#00a98f" stroke-width="4"/><rect x="885" y="417" width="125" height="36" rx="18" fill="#00a98f"/><text x="897" y="441" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#ffffff">box 0.91</text><text x="550" y="755" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="800" fill="#163a70">same ROI · detector revision · classes · decode / NMS · score calibration</text><path d="M 1088 470 L 1150 470" fill="none" stroke="#5f63d8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-5f63d8)"/><rect x="1172" y="226" width="432" height="495" rx="24" fill="#ffffff" stroke="#5f63d8" stroke-width="3"/><text x="1388" y="274" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="28" font-weight="850" fill="#163a70">upstream detector contract</text><text x="1224" y="332" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="700" fill="#42638e"><tspan x="1224" dy="0">frame + timestamp / drops</tspan><tspan x="1224" dy="42">fixed ROI / preprocess</tspan><tspan x="1224" dy="42">detector weights + classes</tspan><tspan x="1224" dy="42">boxes + scores + NMS</tspan></text><path d="M 1226 524 H 1550" stroke="#c7d3f2" stroke-width="3" stroke-dasharray="8 7"/><text x="1388" y="568" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="24" font-weight="850" fill="#e04c62">no usable detector box</text><text x="1388" y="604" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="750" fill="#e04c62">→ no measurement to associate</text><text x="1388" y="658" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="750" fill="#a92b42">a tracker cannot restore detector recall</text><rect x="40" y="855" width="1592" height="55" rx="26" fill="#fff3cf" stroke="#f0ad25" stroke-width="2"/><path d="M 76 878 q 12 -20 24 0 q -2 20 -12 20 q -10 0 -12 -20 M 88 866 v-14 M 63 878 h-13 M 113 878 h13" fill="none" stroke="#d18a00" stroke-width="3" stroke-linecap="round"/><text x="124" y="889" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="800" fill="#885c00">ByteTrack consumes detector candidates; a box / score is upstream evidence, not an automatically verified entity or event.</text>
