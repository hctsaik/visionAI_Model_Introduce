<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><marker id="a-1769E0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1769E0"/></marker><marker id="a-00A9C7" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#00A9C7"/></marker><marker id="a-F38B00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#F38B00"/></marker><marker id="a-D9485F" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#D9485F"/></marker><marker id="a-159A63" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#159A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#082554"/><rect x="1285" y="33" width="343" height="50" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1456" y="66" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">CONTROLNET · REVIEW GATE</text><text x="40" y="108" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="40" font-weight="900" fill="#071D43" text-anchor="start">最後交付的不是一張圖，而是一份可追溯的協助結果</text><text x="40" y="153" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="550" fill="#506584" text-anchor="start">只有 source、condition、model recipe、output 與 review 被一起保存，生成結果才可作為受限的訓練／編修候選。</text><rect x="60" y="238" width="710" height="510" rx="32" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="415" y="300" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="31" font-weight="900" fill="#071D43" text-anchor="middle">可重播的 evidence bundle</text><circle cx="140" cy="366" r="25" fill="#1769E0"/><text x="140" y="374" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text><text x="190" y="374" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="800" fill="#071D43" text-anchor="start">raw ROI + hash</text><circle cx="140" cy="444" r="25" fill="#00A9C7"/><text x="140" y="452" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text><text x="190" y="452" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="800" fill="#071D43" text-anchor="start">condition + extractor version</text><circle cx="140" cy="522" r="25" fill="#F38B00"/><text x="140" y="530" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text><text x="190" y="530" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="800" fill="#071D43" text-anchor="start">base / ControlNet / prompt / sampling</text><circle cx="140" cy="600" r="25" fill="#D9485F"/><text x="140" y="608" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">4</text><text x="190" y="608" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="800" fill="#071D43" text-anchor="start">synthetic output + edit manifest</text><path d="M805 490 L925 490" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><rect x="955" y="245" width="610" height="490" rx="32" fill="#FFF7EC" stroke="#F38B00" stroke-width="3"/><text x="1260" y="310" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="31" font-weight="900" fill="#774C00" text-anchor="middle">specialist review gate</text><circle cx="1050" cy="382" r="13" fill="#1769E0"/><text x="1085" y="390" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="800" fill="#071D43" text-anchor="start">condition adherence</text><circle cx="1050" cy="447" r="13" fill="#D9485F"/><text x="1085" y="455" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="800" fill="#071D43" text-anchor="start">hallucinated detail</text><circle cx="1050" cy="512" r="13" fill="#F38B00"/><text x="1085" y="520" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="800" fill="#071D43" text-anchor="start">raw / synthetic separation</text><circle cx="1050" cy="577" r="13" fill="#00A9C7"/><text x="1085" y="585" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="800" fill="#071D43" text-anchor="start">P95 / cost / data policy</text><rect x="1050" y="650" width="420" height="48" rx="16" fill="#FFF0F2" stroke="#D9485F" stroke-width="2"/><text x="1260" y="682" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#D9485F" text-anchor="middle">candidate → human handoff / HOLD</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">帶走：受控生成可協助編修或訓練；它不能替代 defect detector、量測、物理模擬或 production decision。</text></svg>