<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><marker id="a-1769E0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1769E0"/></marker><marker id="a-00A9C7" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#00A9C7"/></marker><marker id="a-F38B00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#F38B00"/></marker><marker id="a-D9485F" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#D9485F"/></marker><marker id="a-159A63" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#159A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#082554"/><rect x="1285" y="33" width="343" height="50" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1456" y="66" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">CONTROLNET · COUNTERFACTUAL</text><text x="40" y="108" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="40" font-weight="900" fill="#071D43" text-anchor="start">生成圖看起來對，不代表細節真的被保留</text><text x="40" y="153" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="550" fill="#506584" text-anchor="start">同一個 raw ROI，只要 condition 的細小結構遺失或 recipe 漂移，仍可能生成一張很像樣、卻不可靠的圖。</text><clipPath id="clip-45-230"><rect x="45" y="230" width="405" height="480" rx="26"/></clipPath><g clip-path="url(#clip-45-230)"><image href="controlnet-beginner-01-raw-condition-workpiece_v01.png" x="45" y="230" width="405" height="480" preserveAspectRatio="xMinYMid slice"/></g><rect x="45" y="230" width="405" height="480" rx="26" fill="none" stroke="#1769E0" stroke-width="3"/><rect x="82" y="245" width="330" height="54" rx="16" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="247" y="282" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#071D43" text-anchor="middle">同一張 raw ROI</text><rect x="72" y="646" width="355" height="47" rx="14" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="247" y="678" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#071D43" text-anchor="middle">原圖中的細微刻線是核對基準</text><path d="M480 470 L570 470" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><rect x="600" y="225" width="430" height="500" rx="28" fill="#E9FBFF" stroke="#00A9C7" stroke-width="2"/><text x="815" y="282" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">A · 完整的 condition</text><clipPath id="clip-665-326"><rect x="665" y="326" width="300" height="205" rx="26"/></clipPath><g clip-path="url(#clip-665-326)"><image href="controlnet-beginner-01-raw-condition-workpiece_v01.png" x="665" y="326" width="300" height="205" preserveAspectRatio="xMaxYMid slice"/></g><rect x="665" y="326" width="300" height="205" rx="26" fill="none" stroke="#1769E0" stroke-width="3"/><text x="815" y="610" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="800" fill="#071D43" text-anchor="middle">結構約束完整</text><text x="815" y="646" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="800" fill="#071D43" text-anchor="middle">仍要比較 raw / condition / output</text><path d="M1055 470 L1145 470" fill="none" stroke="#00A9C7" stroke-width="6" stroke-linecap="round" marker-end="url(#a-00A9C7)"/><rect x="1175" y="225" width="430" height="500" rx="28" fill="#FFF7EC" stroke="#F38B00" stroke-width="2"/><text x="1390" y="282" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#774C00" text-anchor="middle">B · 遺失細節的 condition</text><clipPath id="clip-1240-326"><rect x="1240" y="326" width="300" height="205" rx="26"/></clipPath><g clip-path="url(#clip-1240-326)"><image href="controlnet-beginner-01-raw-condition-workpiece_v01.png" x="1240" y="326" width="300" height="205" preserveAspectRatio="xMaxYMid slice"/></g><rect x="1240" y="326" width="300" height="205" rx="26" fill="none" stroke="#1769E0" stroke-width="3"/><rect x="1365" y="405" width="110" height="54" rx="8" fill="#FFFFFF" stroke="#D9485F" stroke-width="5"/><text x="1420" y="440" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#D9485F" text-anchor="middle">missing</text><text x="1390" y="610" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#D9485F" text-anchor="middle">output 仍可能很像樣</text><text x="1390" y="646" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#D9485F" text-anchor="middle">不能證明缺失細節不存在</text><rect x="110" y="766" width="1455" height="55" rx="18" fill="#FFF0F2" stroke="#D9485F" stroke-width="2"/><text x="838" y="802" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#D9485F" text-anchor="middle">正確動作：保留 raw、condition、recipe 與 output 的對照；發現失配就 HOLD / review，不讓美觀畫面通過。</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">帶走：ControlNet 約束生成的位置，不驗證 condition 是否正確，更不證明尺寸、缺陷或製程事實。</text></svg>