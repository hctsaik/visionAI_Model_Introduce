<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><marker id="a-1769E0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1769E0"/></marker><marker id="a-00A9C7" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#00A9C7"/></marker><marker id="a-F38B00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#F38B00"/></marker><marker id="a-D9485F" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#D9485F"/></marker><marker id="a-159A63" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#159A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#082554"/><rect x="1285" y="33" width="343" height="50" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1456" y="66" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">CONTROLNET · SYNTHETIC OUTPUT</text><text x="40" y="108" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="40" font-weight="900" fill="#071D43" text-anchor="start">受控 denoising 產生的是 synthetic/edit candidate</text><text x="40" y="153" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="550" fill="#506584" text-anchor="start">control residual 在每次去噪時影響影像走向；它可以帶來空間一致的畫面，但不是量測或 defect 證據。</text><rect x="60" y="235" width="350" height="490" rx="30" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="235" y="295" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#071D43" text-anchor="middle">保留的 inputs</text><circle cx="135" cy="372" r="14" fill="#1769E0"/><text x="172" y="380" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="800" fill="#071D43" text-anchor="start">raw ROI</text><circle cx="135" cy="464" r="14" fill="#00A9C7"/><text x="172" y="472" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="800" fill="#071D43" text-anchor="start">condition map</text><circle cx="135" cy="556" r="14" fill="#F38B00"/><text x="172" y="564" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="800" fill="#071D43" text-anchor="start">prompt</text><path d="M435 480 L540 480" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><rect x="570" y="220" width="585" height="525" rx="30" fill="#F9FCFF" stroke="#A8C9FF" stroke-width="2"/><text x="862" y="282" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="30" font-weight="900" fill="#071D43" text-anchor="middle">conditional denoising</text><circle cx="650" cy="472" r="54" fill="#EAF4FF" stroke="#1769E0" stroke-width="4"/><text x="650" y="546" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#071D43" text-anchor="middle">noise</text><circle cx="780" cy="472" r="54" fill="#EAF4FF" stroke="#1769E0" stroke-width="4"/><text x="780" y="546" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#071D43" text-anchor="middle">less noise</text><circle cx="910" cy="472" r="54" fill="#EAF4FF" stroke="#1769E0" stroke-width="4"/><text x="910" y="546" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#071D43" text-anchor="middle">guided latent</text><circle cx="1040" cy="472" r="54" fill="#EAF4FF" stroke="#1769E0" stroke-width="4"/><text x="1040" y="546" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#071D43" text-anchor="middle">output</text><path d="M704 472 L726 472" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#a-1769E0)"/><path d="M834 472 L856 472" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#a-1769E0)"/><path d="M964 472 L986 472" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#a-1769E0)"/><path d="M650 368 Q760 310 850 368 T1040 368" fill="none" stroke="#00A9C7" stroke-width="7" stroke-linecap="round" marker-end="url(#a-00A9C7)"/><text x="845" y="318" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="850" fill="#00A9C7" text-anchor="middle">ControlNet residual guides the path</text><text x="862" y="650" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="750" fill="#506584" text-anchor="middle">sampler / steps / guidance / seed / tile 都留在 trace</text><path d="M1180 480 L1270 480" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#a-F38B00)"/><rect x="1300" y="235" width="315" height="490" rx="30" fill="#FFF7EC" stroke="#F38B00" stroke-width="3"/><text x="1457" y="315" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#774C00" text-anchor="middle">generated /</text><text x="1457" y="353" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#774C00" text-anchor="middle">edited image</text><rect x="1350" y="410" width="215" height="130" rx="18" fill="#FFFFFF" stroke="#F38B00" stroke-width="2"/><text x="1457" y="460" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#D9485F" text-anchor="middle">synthetic</text><text x="1457" y="494" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#D9485F" text-anchor="middle">candidate</text><text x="1457" y="620" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="800" fill="#071D43" text-anchor="middle">+ manifest</text><text x="1457" y="654" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="800" fill="#071D43" text-anchor="middle">+ reviewer</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">帶走：spatially plausible 不等於 physical truth；synthetic pixels 不能回寫 raw evidence，也不能自動放行。</text></svg>