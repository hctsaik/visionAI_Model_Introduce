sans-serif" font-size="20" font-weight="650" fill="#526B8D" text-anchor="start">輸出要能回溯同一 AOI、prompt revision、window layout、optional references 與 decision unit，而不是把高分直接當 PASS。</text><line x1="48" y1="209" x2="1624" y2="209" stroke="#AFC9F5" stroke-width="2"/><clipPath id="winclip-photo-review-54"><rect x="54" y="264" width="230" height="274" rx="20"/></clipPath><image data-entity="winclip_ceramic_contact_plate_aoi" href="winclip-industrial-ceramic-contact-anchor_v02.png" x="54" y="264" width="230" height="274" preserveAspectRatio="xMidYMid slice" clip-path="url(#winclip-photo-review-54)"/><rect x="54" y="264" width="230" height="274" rx="20" fill="none" stroke="#AFC9F5" stroke-width="2"/><rect x="69" y="279" width="160" height="37" rx="18" fill="#EAF3FF" stroke="#1769E0" stroke-width="1.5"/><text x="149.0" y="304" font-family="Arial, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">same raw AOI</text><circle cx="219.6" cy="464.02" r="13" fill="none" stroke="#F38B00" stroke-width="4"/><line x1="195.6" y1="488.02" x2="245.6" y2="438.02" stroke="#F38B00" stroke-width="3"/><line x1="305" y1="399" x2="363" y2="399" stroke="#1769E0" stroke-width="6" marker-end="url(#arrow-1769E0)"/><rect x="388" y="262" width="290" height="263" rx="22" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><text x="533.0" y="300" font-family="Arial, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#11325E" text-anchor="middle">margin candidate map</text><rect x="418" y="326" width="230" height="145" rx="10" fill="#FFFFFF" stroke="#1769E0" stroke-width="1.5"/><rect x="421.0" y="329.0" width="32.333333333333336" height="30.25" rx="3" fill="#EAF3FF" stroke="#1769E0" stroke-width="0.7"/><rect x="421.0" y="365.25" width="32.333333333333336" height="30.25" rx="3" fill="#EAF3FF" stroke="#1769E0" stroke-width="0.7"/><rect x="421.0" y="401.5" width="32.333333333333336" height="30.25" rx="3" fill="#EAF3FF" stroke="#1769E0" stroke-width="0.7"/>