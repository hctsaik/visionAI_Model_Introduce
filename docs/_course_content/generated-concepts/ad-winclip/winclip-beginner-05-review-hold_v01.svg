ke="#1769E0" stroke-width="0.7"/><rect x="574.3333333333334" y="401.5" width="32.333333333333336" height="30.25" rx="3" fill="#FFF2DC" stroke="#1769E0" stroke-width="0.7"/><rect x="574.3333333333334" y="437.75" width="32.333333333333336" height="30.25" rx="3" fill="#FFF2DC" stroke="#1769E0" stroke-width="0.7"/><rect x="612.6666666666666" y="329.0" width="32.333333333333336" height="30.25" rx="3" fill="#EAF3FF" stroke="#1769E0" stroke-width="0.7"/><rect x="612.6666666666666" y="365.25" width="32.333333333333336" height="30.25" rx="3" fill="#EAF3FF" stroke="#1769E0" stroke-width="0.7"/><rect x="612.6666666666666" y="401.5" width="32.333333333333336" height="30.25" rx="3" fill="#FFD397" stroke="#1769E0" stroke-width="0.7"/><rect x="612.6666666666666" y="437.75" width="32.333333333333336" height="30.25" rx="3" fill="#EAF3FF" stroke="#1769E0" stroke-width="0.7"/><text x="533.0" y="503" font-family="Arial, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#526B8D" text-anchor="middle">localize a candidate, not a pixel mask</text><line x1="701" y1="399" x2="760" y2="399" stroke="#F38B00" stroke-width="6" marker-end="url(#arrow-F38B00)"/><rect x="785" y="262" width="302" height="263" rx="24" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><text x="936" y="303" font-family="Arial, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#11325E" text-anchor="middle">local calibration + abstain</text><circle cx="830" cy="347" r="8" fill="#1769E0"/><text x="854" y="354" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#11325E" text-anchor="start">decision unit</text><circle cx="830" cy="387" r="8" fill="#F38B00"/><text x="854" y="394" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#11325E" text-anchor="start">threshold revision</text><circle cx="830" cy="427" r="8" fill="#D9475F"/><text x="854" y="434" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#11325E" text-anchor="start">review / abstain rule</text><circle cx="830" cy="467" r="8" fill="#149A62"/><text x="854" y="474" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#11325E" text-anchor="start">low-FPR evidence</text><line x1="1110" y1="399" x2="1168" y2="399" stroke="#F38B00" stroke-width="6" marker-end="url(#arrow-F38B00)"/><rect x="1192" y="319" width="215" height="150" rx="22" fill="#FFF2DC" stroke="#F38B00" stroke-width="3"/><text x="1299.5" y="364" font-family="Arial, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#11325E" text-anchor="middle">candidate</text><text x="1299.5" y="399" font-family="Arial, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#F38B00" text-anchor="middle">review evidence</text><text x="1299.5" y="431" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D9475F" text-anchor="middle">not auto PASS</text><line x1="1431" y1="399" x2="1482" y2="399" stroke="#F38B00" stroke-width="6" marker-end="url(#arrow-F38B00)"/><rect x="1503" y="262" width="98" height="263" rx="21" fill="#FFF2DC" stroke="#F38B00" stroke-width="3"/><text x="1552" y="306" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#11325E" text-anchor="middle">trace</text><text x="1552" y="344" font-family="Arial, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">ROI</text><text x="1552" y="377" font-family="Arial, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#7352DA" text-anchor="middle">prompt</text><text x="1552" y="410" font-family="Arial, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#00A8C6" text-anchor="middle">layout</text><text x="1552" y="443" font-family="Arial, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#149A62" text-anchor="middle">refs</text><text x="1552" y="476" font-family="Arial, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D9475F" text-anchor="middle">owner</text><rect x="54" y="604" width="1547" height="198" rx="24" fill="#FFFFFF" stroke="#AFC9F5" stroke-width="2"/><text x="84" y="646" font-family="Arial, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#11325E" text-anchor="start">HOLD when the meaning or observability of the margin breaks</text><circle cx="104" cy="679" r="8" fill="#D9475F"/><text x="128" y="686" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D9475F" text-anchor="start">class name / prompt language / image domain shifts</text><text x="878" y="686" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="760" fill="#11325E" text-anchor="start">validate prompt sensitivity and target transfer first</text><circle cx="104" cy="717" r="8" fill="#F38B00"/><text x="128" y="724" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#F38B00" text-anchor="start">critical signal is smaller than a declared window or patch</text><text x="878" y="724" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="760" fill="#11325E" text-anchor="start">measure effective pixels; add specialist evidence</text><circle cx="104" cy="755" r="8" fill="#7352DA"/><text x="128" y="762" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#7352DA" text-anchor="start">WinCLIP+ references lack split or contamination governance</text><text x="878" y="762" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="760" fill="#11325E" text-anchor="start">do not claim few-normal benefit; audit or abstain</text><circle cx="104" cy="793" r="8" fill="#1769E0"/><text x="128" y="800" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#1769E0" text-anchor="start">the decision depends on global logic or causal explanation</text><text x="878" y="800" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="760" fill="#11325E" text-anchor="start">a local CLIP margin is not sufficient evidence</text><rect x="48" y="842" width="1576" height="58" rx="20" fill="#FFF2DC" stroke="#F38B00" stroke-width="2"/><circle cx="82" cy="871" r="11" fill="#F38B00"/><text x="108" y="878" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#11325E" text-anchor="start">WinCLIP hands off a traceable candidate for review. It never turns an unverified prompt margin into a production PASS.</text></svg>