<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">WinCLIP declared frozen prompt ensemble</title><desc id="desc">WinCLIP combines locked class names, normal and anomaly state words, templates, ensemble weights, tokenizer and normalization through frozen CLIP text features. Prompt changes are model-input revisions.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7352DA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7352DA"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9475F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9475F"/></marker></defs><rect width="1672" height="941" fill="#F7FAFF"/><rect x="48" y="42" width="180" height="48" rx="24" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><text x="138" y="74" font-family="Arial, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#1769E0" text-anchor="middle">STEP 2 / 5</text><text x="48" y="141" font-family="Arial, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#11325E" text-anchor="start">先鎖住 prompt ensemble：它不是臨場問一句文字問題</text><text x="48" y="181" font-family="Arial, Noto Sans TC, sans-serif" font-size="20" font-weight="650" fill="#526B8D" text-anchor="start">class name、normal / anomaly state words、templates、weights、tokenizer 與 normalization 一起形成可版本化的文字端輸入。</text><line x1="48" y1="209" x2="1624" y2="209" stroke="#AFC9F5" stroke-width="2"/><clipPath id="winclip-photo-prompt-58"><rect x="58" y="280" width="235" height="278" rx="20"/></clipPath><image data-entity="winclip_ceramic_contact_plate_aoi" href="winclip-industrial-ceramic-contact-anchor_v02.png" x="58" y="280" width="235" height="278" preserveAspectRatio="xMidYMid slice" clip-path="url(#winclip-photo-prompt-58)"/><rect x="58" y="280" width="235" height="278" rx="20" fill="none" stroke="#AFC9F5" stroke-width="2"/><rect x="73" y="295" width="124" height="37" rx="18" fill="#EAF3FF" stroke="#1769E0" stroke-width="1.5"/><text x="135.0" y="320" font-family="Arial, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">same AOI</text><circle cx="227.2" cy="482.94" r="13" fill="none" stroke="#F38B00" stroke-width="4"/><line x1="203.2" y1="506.94" x2="253.2" y2="456.94" stroke="#F38B00" stroke-width="3"/><line x1="319" y1="419" x2="380" y2="419" stroke="#1769E0" stroke-width="6" marker-end="url(#arrow-1769E0)"/><rect x="405" y="254" width="338" height="337" rx="24" fill="#FFFFFF" stroke="#1769E0" stroke-width="3"/><text x="574" y="296" font-family="Arial, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#11325E" text-anchor="middle">declared language ingredients</text><circle cx="444" cy="339" r="9" fill="#1769E0"/><text x="468" y="347" font-family="Arial, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#11325E" text-anchor="start">class: ceramic contact plate</text><circle cx="444" cy="392" r="9" fill="#149A62"/><text x="468" y="400" font-family="Arial, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#11325E" text-anchor="start">normal: intact · clean · good</text><circle cx="444" cy="445" r="9" fill="#D9475F"/><text x="468" y="453" font-family="Arial, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#11325E" text-anchor="start">anomaly: scratch · damage · mark</text><circle cx="444" cy="498" r="9" fill="#7352DA"/><text x="468" y="506" font-family="Arial, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#11325E" text-anchor="start">templates + ensemble weights</text><text x="574" y="560" font-family="Arial, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#526B8D" text-anchor="middle">spell and lock the vocabulary</text><line x1="767" y1="419" x2="826" y2="419" stroke="#1769E0" stroke-width="6" marker-end="url(#arrow-1769E0)"/><rect x="850" y="259" width="260" height="324" rx="22" fill="#F0ECFF" stroke="#7352DA" stroke-width="3"/><text x="980.0" y="305" font-family="Arial, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#11325E" text-anchor="middle">frozen CLIP text encoder</text><rect x="888" y="336" width="28" height="84" rx="7" fill="#FFFFFF" stroke="#7352DA" stroke-width="2"/><rect x="932" y="336" width="28" height="75" rx="7" fill="#FFFFFF" stroke="#7352DA" stroke-width="2"/><rect x="976" y="336" width="28" height="66" rx="7" fill="#FFFFFF" stroke="#7352DA" stroke-width="2"/><rect x="1020" y="336" width="28" height="57" rx="7" fill="#FFFFFF" stroke="#7352DA" stroke-width="2"/><text x="980.0" y="543" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#7352DA" text-anchor="middle">text embeddings</text><text x="980.0" y="568" font-family="Arial, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#526B8D" text-anchor="middle">checkpoint locked</text><line x1="1133" y1="419" x2="1192" y2="419" stroke="#7352DA" stroke-width="6" marker-end="url(#arrow-7352DA)"/><rect x="1217" y="252" width="375" height="342" rx="24" fill="#F0ECFF" stroke="#7352DA" stroke-width="3"/><text x="1404" y="294" font-family="Arial, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#11325E" text-anchor="middle">normal + anomaly text sets</text><rect x="1254" y="327" width="301" height="74" rx="14" fill="#EAF8F0" stroke="#149A62" stroke-width="2"/><text x="1404" y="357" font-family="Arial, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#149A62" text-anchor="middle">normal text embeddings</text><text x="1404" y="384" font-family="Arial, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#11325E" text-anchor="middle">from declared combinations</text><rect x="1254" y="426" width="301" height="74" rx="14" fill="#FDEDF0" stroke="#D9475F" stroke-width="2"/><text x="1404" y="456" font-family="Arial, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#D9475F" text-anchor="middle">anomaly text embeddings</text><text x="1404" y="483" font-family="Arial, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#11325E" text-anchor="middle">from declared combinations</text><text x="1404" y="550" font-family="Arial, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D9475F" text-anchor="middle">frozen: no learned target tokens</text><rect x="58" y="663" width="1534" height="136" rx="24" fill="#FFFFFF" stroke="#AFC9F5" stroke-width="2"/><text x="88" y="705" font-family="Arial, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#11325E" text-anchor="start">Version the prompt state as an input artifact</text><circle cx="107" cy="735" r="8" fill="#1769E0"/><text x="128" y="742" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#1769E0" text-anchor="start">checkpoint + tokenizer + preprocessing</text><text x="640" y="742" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="760" fill="#11325E" text-anchor="start">changes the text embedding geometry</text><circle cx="107" cy="763" r="8" fill="#7352DA"/><text x="128" y="770" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#7352DA" text-anchor="start">names + state words + templates + weights</text><text x="640" y="770" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="760" fill="#11325E" text-anchor="start">can move the normal–anomaly margin</text><circle cx="107" cy="791" r="8" fill="#F38B00"/><text x="128" y="798" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#F38B00" text-anchor="start">embedding cache revision + normalization</text><text x="640" y="798" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="760" fill="#11325E" text-anchor="start">must travel with calibration evidence</text><rect x="48" y="842" width="1576" height="58" rx="20" fill="#FFF2DC" stroke="#F38B00" stroke-width="2"/><circle cx="82" cy="871" r="11" fill="#F38B00"/><text x="108" y="878" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#11325E" text-anchor="start">Frozen does not mean harmless: a wording, naming, tokenizer or weighting revision can change the score distribution.</text></svg>