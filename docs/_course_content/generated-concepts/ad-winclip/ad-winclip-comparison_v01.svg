/anomaly prompt tokens | candidate output: CLIP patch/global similarity margin高 | Same input, ROI, preprocess, truth, and evidence gate; do not switch the comparison contract." data-not-claim="AnomalyCLIP output is a candidate, not verified field truth; still use the evidence gate."><title>AnomalyCLIP：auxiliary-learned normal/anomaly prompt tokens</title><rect x="625" y="346" width="422" height="112" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="single-text-prompt-embedding"><path d="M662.12 384.78h75.60000000000001v16.400000000000002h-75.60000000000001z" fill="#E8FAFF" stroke="#1769E0" stroke-width="3"/><line x1="745.28" y1="393.8" x2="801.98" y2="393.8" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="805.76" y="381.5" width="52.92" height="24.599999999999998" rx="6" fill="#F7FBFF" stroke="#0AA6D8" stroke-width="3"/><line x1="866.24" y1="393.8" x2="930.5000000000001" y2="393.8" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="930.5000000000001" y1="384.78" x2="975.86" y2="384.78" stroke="#F38B00" stroke-width="4"/><line x1="930.5000000000001" y1="392.98" x2="975.86" y2="392.98" stroke="#F38B00" stroke-width="4"/><line x1="930.5000000000001" y1="401.18" x2="975.86" y2="401.18" stroke="#F38B00" stroke-width="4"/><text data-label-line="true" x="699.92" y="433.98" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">prompt</text><text data-label-line="true" x="832.22" y="433.98" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">text encoder</text><text data-label-line="true" x="953.1800000000001" y="433.98" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">vector</text></g></g><text x="625" y="49