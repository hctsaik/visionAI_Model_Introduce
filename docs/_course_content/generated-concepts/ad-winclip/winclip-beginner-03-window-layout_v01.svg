<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">WinCLIP fixed multi-scale window and patch layout</title><desc id="desc">The same AOI is represented as full image, overlapping windows and patches under declared scales, strides and feature levels. This layout determines what local evidence can be observed.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7352DA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7352DA"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9475F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9475F"/></marker></defs><rect width="1672" height="941" fill="#F7FAFF"/><rect x="48" y="42" width="180" height="48" rx="24" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><text x="138" y="74" font-family="Arial, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#1769E0" text-anchor="middle">STEP 3 / 5</text><text x="48" y="141" font-family="Arial, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#11325E" text-anchor="start">固定 window layout 把「整張像不像」拆成多個局部比較單位</text><text x="48" y="181" font-family="Arial, Noto Sans TC, sans-serif" font-size="20" font-weight="650" fill="#526B8D" text-anchor="start">同一張 ROI 依宣告的 scale、size、stride、overlap 與 patch layer 取特徵；window 的大小就是可觀測性的邊界。</text><line x1="48" y1="209" x2="1624" y2="209" stroke="#AFC9F5" stroke-width="2"/><clipPath id="winclip-photo-windows-51"><rect x="51" y="266" width="310" height="358" rx="20"/></clipPath><image data-entity="winclip_ceramic_contact_plate_aoi" href="winclip-industrial-ceramic-contact-anchor_v02.png" x="51" y="266" width="310" height="358" preserveAspectRatio="xMidYMid slice" clip-path="url(#winclip-photo-windows-51)"/><rect x="51" y="266" width="310" height="358" rx="20" fill="none" stroke="#AFC9F5" stroke-width="2"/><rect x="66" y="281" width="193" height="37" rx="18" fill="#EAF3FF" stroke="#1769E0" stroke-width="1.5"/><text x="162.5" y="306" font-family="Arial, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">same ROI + grid</text><circle cx="274.2" cy="527.3399999999999" r="17.05" fill="none" stroke="#F38B00" stroke-width="4"/><line x1="250.2" y1="551.3399999999999" x2="300.2" y2="501.3399999999999" stroke="#F38B00" stroke-width="3"/><line x1="145.0" y1="342" x2="145.0" y2="546" stroke="#00A8C6" stroke-width="2"/><line x1="206.0" y1="342" x2="206.0" y2="546" stroke="#00A8C6" stroke-width="2"/><line x1="267.0" y1="342" x2="267.0" y2="546" stroke="#00A8C6" stroke-width="2"/><line x1="84" y1="410.0" x2="328" y2="410.0" stroke="#00A8C6" stroke-width="2"/><line x1="84" y1="478.0" x2="328" y2="478.0" stroke="#00A8C6" stroke-width="2"/><rect x="210.0" y="414.0" width="53.0" height="60.0" rx="5" fill="none" stroke="#F38B00" stroke-width="3"/><line x1="387" y1="444" x2="450" y2="444" stroke="#1769E0" stroke-width="6" marker-end="url(#arrow-1769E0)"/><rect x="475" y="258" width="349" height="348" rx="24" fill="#FFFFFF" stroke="#1769E0" stroke-width="3"/><text x="650" y="300" font-family="Arial, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#11325E" text-anchor="middle">fixed window schedule</text><text x="510" y="342" font-family="Arial, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#00A8C6" text-anchor="start">full image</text><rect x="678" y="317" width="45" height="36" rx="6" fill="#EAF3FF" stroke="#00A8C6" stroke-width="1.5"/><text x="510" y="369" font-family="Arial, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#526B8D" text-anchor="start">same crop + scale / stride</text><text x="510" y="414" font-family="Arial, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#1769E0" text-anchor="start">large windows</text><rect x="678" y="389" width="45" height="36" rx="6" fill="#EAF3FF" stroke="#1769E0" stroke-width="1.5"/><rect x="753" y="389" width="45" height="36" rx="6" fill="#EAF3FF" stroke="#1769E0" stroke-width="1.5"/><text x="510" y="441" font-family="Arial, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#526B8D" text-anchor="start">same crop + scale / stride</text><text x="510" y="486" font-family="Arial, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#7352DA" text-anchor="start">fine windows</text><rect x="678" y="461" width="45" height="36" rx="6" fill="#F0ECFF" stroke="#7352DA" stroke-width="1.5"/><rect x="728" y="461" width="45" height="36" rx="6" fill="#F0ECFF" stroke="#7352DA" stroke-width="1.5"/><rect x="778" y="461" width="45" height="36" rx="6" fill="#F0ECFF" stroke="#7352DA" stroke-width="1.5"/><text x="510" y="513" font-family="Arial, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#526B8D" text-anchor="start">same crop + patch layer declared</text><text x="650" y="572" font-family="Arial, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D9475F" text-anchor="middle">layout revision = new evidence contract</text><line x1="850" y1="444" x2="910" y2="444" stroke="#1769E0" stroke-width="6" marker-end="url(#arrow-1769E0)"/><rect x="935" y="282" width="266" height="290" rx="22" fill="#E7FAFC" stroke="#00A8C6" stroke-width="3"/><text x="1068.0" y="328" font-family="Arial, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#11325E" text-anchor="middle">frozen CLIP image encoder</text><rect x="973" y="359" width="28" height="84" rx="7" fill="#FFFFFF" stroke="#00A8C6" stroke-width="2"/><rect x="1017" y="359" width="28" height="75" rx="7" fill="#FFFFFF" stroke="#00A8C6" stroke-width="2"/><rect x="1061" y="359" width="28" height="66" rx="7" fill="#FFFFFF" stroke="#00A8C6" stroke-width="2"/><rect x="1105" y="359" width="28" height="57" rx="7" fill="#FFFFFF" stroke="#00A8C6" stroke-width="2"/><text x="1068.0" y="532" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#00A8C6" text-anchor="middle">visual embeddings</text><text x="1068.0" y="557" font-family="Arial, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#526B8D" text-anchor="middle">checkpoint locked</text><line x1="1225" y1="444" x2="1284" y2="444" stroke="#00A8C6" stroke-width="6" marker-end="url(#arrow-00A8C6)"/><rect x="1309" y="279" width="286" height="286" rx="20" fill="#E7FAFC" stroke="#00A8C6" stroke-width="2.5"/><text x="1452.0" y="313" font-family="Arial, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#11325E" text-anchor="middle">window + patch features</text><rect x="1334" y="336" width="236" height="186" rx="9" fill="#FFFFFF" stroke="#00A8C6" stroke-width="1.5"/><line x1="1393.0" y1="336" x2="1393.0" y2="522" stroke="#00A8C6" stroke-width="1.2"/><line x1="1452.0" y1="336" x2="1452.0" y2="522" stroke="#00A8C6" stroke-width="1.2"/><line x1="1511.0" y1="336" x2="1511.0" y2="522" stroke="#00A8C6" stroke-width="1.2"/><line x1="1334" y1="398.0" x2="1570" y2="398.0" stroke="#00A8C6" stroke-width="1.2"/><line x1="1334" y1="460.0" x2="1570" y2="460.0" stroke="#00A8C6" stroke-width="1.2"/><rect x="1452.0" y="399.24" width="59.0" height="62.0" rx="4" fill="#FFF2DC" stroke="#F38B00" stroke-width="2"/><text x="1452.0" y="543" font-family="Arial, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#526B8D" text-anchor="middle">declared feature level</text><rect x="51" y="665" width="1544" height="137" rx="24" fill="#FDEDF0" stroke="#D9475F" stroke-width="2"/><text x="82" y="705" font-family="Arial, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#D9475F" text-anchor="start">Read the layout as an observability contract</text><text x="82" y="741" font-family="Arial, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#11325E" text-anchor="start">A tiny scratch below the smallest effective window can be diluted; a global relationship can be outside every local tile.</text><text x="82" y="772" font-family="Arial, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#D9475F" text-anchor="start">Do not call a heatmap pixel-perfect: it is evidence from fixed, finite image / window / patch feature fields.</text><rect x="48" y="842" width="1576" height="58" rx="20" fill="#FFF2DC" stroke="#F38B00" stroke-width="2"/><circle cx="82" cy="871" r="11" fill="#F38B00"/><text x="108" y="878" font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#11325E" text-anchor="start">Keep ROI, registration, resize, padding, scales, strides, overlap and selected feature levels with every candidate trace.</text></svg>