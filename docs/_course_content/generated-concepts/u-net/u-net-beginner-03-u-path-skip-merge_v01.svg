04" rx="8" fill="none" stroke="#D9485F" stroke-width="4" stroke-dasharray=""/><text x="1413" y="645" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="800" fill="#0B2858" text-anchor="middle">segmentation head 的輸出：</text><text x="1413" y="671" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="800" fill="#0B2858" text-anchor="middle">每個 pixel 的 semantic logits / mask</text><rect x="62" y="758" width="1502" height="58" rx="20" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="813" y="794.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="800" fill="#0B2858" text-anchor="middle">深層 bottleneck 不是唯一資訊來源；decoder 用同尺度 skip 合併 context 與局部位置，才形成高解析的語意候選。</text><rect x="40" y="849" width="1592" height="52" rx="22" fill="#FFF8DE" stroke="#F1B828" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="800" fill="#674500" text-anchor="middle">U-Net 的 skip 不是另一份預測；它是 decoder 還原定位時，接回 encoder 同尺度 feature 的資訊路徑。</text></svg>