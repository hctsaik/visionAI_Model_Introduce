<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">U-Net 的 encoder context、decoder upsample 與 same-scale skip merge</title><desc id="desc">同一 PCB ROI 經 encoder 下採樣取得較大 context，經 bottleneck 與 decoder 上採樣；對應尺度 skip feature 在 decoder merge，以輸出 pixel logits。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D9485F"/></marker><marker id="arrow-7966C7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7966C7"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0B2858"/><text x="40" y="113.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="38" font-weight="900" fill="#081A38" text-anchor="start">先縮小看 context，再接回同尺度細節：這才是 U-Net 的 U 形路徑</text><text x="40" y="161.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="500" fill="#536A91" text-anchor="start">encoder 下採樣擴大可見脈絡；decoder 上採樣時，將對應尺度的 skip feature 接回來，才能兼顧語意與位置。</text><rect x="1356" y="36" width="276" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1494" y="68.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="800" fill="#1769E0" text-anchor="middle">U-Net</text><text x="62" y="244.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="24" font-weight="900" fill="#0B2858" text-anchor="start">同一 PCB ROI</text><clipPath id="crop-u-input-62-276-480-80"><rect x="62" y="276" width="304" height="340" rx="20"/></clipPath><g clip-path="url(#crop-u-input-62-276-480-80)"><svg x="62" y="276" width="304" height="340" viewBox="480 80 1100 760" preserveAspectRatio="xMidYMid slice"><image href="u-net-beginner-01-pcb-label-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="62" y="276" width="304" height="340" rx="20" fill="none" stroke="#1769E0" stroke-width="2"/><text x="214" y="648.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="middle">薄線／焊墊／via 都在同一畫面</text><path d="M378 445 L452 445" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><text x="545" y="243.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="23" font-weight="900" fill="#0B2858" text-anchor="middle">encoder：downsample → 較大 context</text><text x="1128" y="243.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="23" font-weight="900" fill="#0B2858" text-anchor="middle">decoder：upsample + same-scale skip merge</text><rect x="458" y="304" width="208" height="84" rx="14" fill="#F8FBFF" stroke="#1769E0" stroke-width="2"/><rect x="470.0" y="314.0" width="36.5" height="21.5" rx="4" fill="#93BDFF" fill-opacity="0.76" stroke="#93BDFF" stroke-width="0"/><rect x="513.5" y="314.0" width="36.5" height="21.5" rx="4" fill="#93BDFF" fill-opacity="0.76" stroke="#93BDFF" stroke-width="0"/><rect x="557.0" y="314.0" width="36.5" height="21.5" rx="4" fill="#93BDFF" fill-opacity="0.76" stroke="#93BDFF" stroke-width="0"/><rect x="600.5" y="314.0" width="36.5" height="21.5" rx="4" fill="#93BDFF" fill-opacity="0.76" stroke="#93BDFF" stroke-width="0