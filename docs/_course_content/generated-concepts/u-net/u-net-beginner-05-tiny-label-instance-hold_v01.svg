<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">U-Net 的 tiny feature、label ambiguity 與 instance HOLD 邊界</title><desc id="desc">同一 PCB 內 tiny trace、不同 boundary label policy、相碰同類焊墊分別需要有效像素、label revision、模型外 instance split 或 instance segmentation 的驗證；不能只調 threshold。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D9485F"/></marker><marker id="arrow-7966C7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7966C7"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0B2858"/><text x="40" y="113.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="38" font-weight="900" fill="#081A38" text-anchor="start">小而細、邊界不清或需要 instance：先 HOLD，不要硬信 mask</text><text x="40" y="161.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="500" fill="#536A91" text-anchor="start">三個問題都回到同一塊 PCB，但它們破壞的是不同前提：有效像素、標註語意，或輸出單位。</text><rect x="1356" y="36" width="276" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1494" y="68.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="800" fill="#1769E0" text-anchor="middle">U-Net</text><text x="70" y="239.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="25" font-weight="900" fill="#0B2858" text-anchor="start">A．tiny / thin trace</text><clipPath id="crop-tiny-70-272-900-370"><rect x="70" y="272" width="370" height="236" rx="20"/></clipPath><g clip-path="url(#crop-tiny-70-272-900-370)"><svg x="70" y="272" width="370" height="236" viewBox="900 370 520 420" preserveAspectRatio="xMidYMid slice"><image href="u-net-beginner-01-pcb-label-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="70" y="272" width="370" height="236" rx="20" fill="none" stroke="#F38B00" stroke-width="2"/><rect x="252" y="395" width="68" height="46" rx="8" fill="none" stroke="#F38B00" stroke-width="4"/><path d="M450 390 L514 390" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="528" y="324" width="232" height="126" rx="16" fill="#F8FBFF" stroke="#1769E0" stroke-width="2"/><rect x="544" y="341" width="29" height="25" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="583" y="341" width="29" height="25" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="622" y="341" width="29" height="25" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="661" y="341" width="29" height="25" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="700" y="341" width="29" height="25" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="544" y="376" width="29" height="25" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="583" y="376" width="29" height="25" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="622" y="376" width="29" height="25" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="661" y="376" width="29" height="25" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="700" y="376" width="29" height="25" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="544" y="411" width="29" height="25" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="583" y="411" width="29" height="25" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="622" y="411" width="29" height="25" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="661" y="411" width="29" height="25" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="700" y="411" width="29" height="25" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><text x="644" y="486" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#D9485F" text-anchor="middle">downsample 後可能淡掉</text><text x="644" y="511" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#D9485F" text-anchor="middle">先驗 effective pixels / output stride</text><rect x="70" y="548" width="690" height="86" rx="18" fill="#FFF6F7" stroke="#D9485F" stroke-width="2"/><text x="415" y="583.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#D9485F" text-anchor="middle">critical thin feature 未被 challenge set 證明</text><text x="415" y="614.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#0B2858" text-anchor="middle">→ HOLD；回看 raw ROI、stride、loss、tile recipe</text><text x="838" y="239.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="25" font-weight="900" fill="#0B2858" text-anchor="start">B．boundary label ambiguous</text><clipPath id="crop-boundary-838-272-830-160"><rect x="838" y="272" width="300" height="236" rx="20"/></clipPath><g clip-path="url(#crop-boundary-838-272-830-160)"><svg x="838" y="272" width="300" height="236" viewBox="830 160 620 500" preserveAspectRatio="xMidYMid slice"><image href="u-net-beginner-01-pcb-label-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="838" y="272" width="300" height="236" rx="20" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="1174" y="272" width="182" height="154" rx="22" fill="#103D41" stroke="#0E6570" stroke-width="2"/><path d="M1197.66 295.1 L1315.96 401.36" stroke="#F3B53C" stroke-width="15" stroke-linecap="round"/><rect x="1288.66" y="302.8" width="19.11" height="18.48" rx="8" fill="#1BAD8F" stroke="#B9FFF1" stroke-width="2"/><rect x="1317.78" y="302.8" width="19.11" height="18.48" rx="8" fill="#1BAD8F" stroke="#B9FFF1" stroke-width="2"/><rect x="1288.66" y="333.6" width="19.11" height="18.48" rx="8" fill="#1BAD8F" stroke="#B9FFF1" stroke-width="2"/><rect x="1317.78" y="333.6" width="19.11" height="18.48" rx="8" fill="#1BAD8F" stroke="#B9FFF1" stroke-width="2"/><circle cx="1210.4" cy="382.88" r="15" fill="#4B8FF0" stroke="#B9DAFF" stroke-width="3"/><rect x="1285.02" y="364.4" width="29.12" height="21.560000000000002" rx="8" fill="none" stroke="#D9485F" stroke-width="4" stroke-dasharray=""/><rect x="1380" y="272" width="182" height="154" rx="22" fill="#103D41" stroke="#0E6570" stroke-width="2"/><path d="M1403.66 295.1 L1521.96 401.36" stroke="#F3B53C" stroke-width="15" stroke-linecap="round"/><rect x="1494.66" y="302.8" width="19.11" height="18.48" rx="8" fill="#1BAD8F" stroke="#B9FFF1" stroke-width="2"/><rect x="1523.78" y="302.8" width="19.11" height="18.48" rx="8" fill="#1BAD8F" stroke="#B9FFF1" stroke-width="2"/><rect x="1494.66" y="333.6" width="19.11" height="18.48" rx="8" fill="#1BAD8F" stroke="#B9FFF1" stroke-width="2"/><rect x="1523.78" y="333.6" width="19.11" height="18.48" rx="8" fill="#1BAD8F" stroke="#B9FFF1" stroke-width="2"/><circle cx="1416.4" cy="382.88" r="15" fill="#4B8FF0" stroke="#B9DAFF" stroke-width="3"/><rect x="1491.02" y="364.4" width="29.12" height="21.560000000000002" rx="8" fill="none" stroke="#D9485F" stroke-width="4" stroke-dasharray="8 7"/><text x="1265" y="456.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">policy A</text><text x="1471" y="456.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#D9485F" text-anchor="middle">policy B / ignore</text><text x="1200" y="499.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#D9485F" text-anchor="middle">不同 boundary policy → 不同 target；不是先放寬 threshold。</text><rect x="838" y="548" width="724" height="86" rx="18" fill="#FFF6F7" stroke="#D9485F" stroke-width="2"/><text x="1200" y="583.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#D9485F" text-anchor="middle">label／ignore／boundary definition 不能重播</text><text x="1200" y="614.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#0B2858" text-anchor="middle">→ HOLD；修正 label revision 後重新 qualification</text><rect x="70" y="670" width="1492" height="146" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="106" y="715.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="24" font-weight="900" fill="#0B2858" text-anchor="start">C．兩個相碰同類焊墊：semantic mask 可能連成一片</text><rect x="107" y="738" width="154" height="48" rx="12" fill="#103D41" stroke="#0E6570" stroke-width="2"/><rect x="142" y="746" width="45" height="32" rx="6" fill="#1BAD8F" stroke="#B9FFF1" stroke-width="2"/><rect x="182" y="746" width="45" height="32" rx="6" fill="#1BAD8F" stroke="#B9FFF1" stroke-width="2"/><path d="M280 762 L344 762" fill="none" stroke="#F38B00" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><rect x="366" y="734" width="164" height="56" rx="14" fill="#E1F9F4" stroke="#1BAD8F" stroke-width="2"/><text x="448" y="769.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#1BAD8F" text-anchor="middle">one region</text><path d="M548 762 L602 762" fill="none" stroke="#D9485F" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-D9485F)"/><text x="628" y="756.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#0B2858" text-anchor="start">若需要 object identity / count：</text><text x="628" y="787.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#D9485F" text-anchor="start">HOLD → 驗證模型外 split，或選 instance segmentation。</text><text x="1245" y="756.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="900" fill="#0B2858" text-anchor="start">不要由 semantic IoU 推出</text><text x="1245" y="787.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#D9485F" text-anchor="start">instance separation 或物理量測能力。</text><rect x="40" y="849" width="1592" height="52" rx="22" fill="#FFF8DE" stroke="#F1B828" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="800" fill="#674500" text-anchor="middle">HOLD 是把不成立的前提留在 evidence chain 內：小特徵、標註語意與 instance 任務各需要不同的驗證／替代路徑。</text></svg>