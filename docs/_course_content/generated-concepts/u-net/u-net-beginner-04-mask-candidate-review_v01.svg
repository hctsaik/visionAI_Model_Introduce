<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">U-Net 的 logits、semantic mask candidate 與 review boundary</title><desc id="desc">同一 PCB test ROI 先形成 pixel logits，經 threshold/argmax、tile blend/stitch、inverse map 與 postprocess 才形成 semantic mask candidate，必須回看 raw ROI review 或 HOLD。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D9485F"/></marker><marker id="arrow-7966C7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7966C7"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0B2858"/><text x="40" y="113.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="38" font-weight="900" fill="#081A38" text-anchor="start">logits 變成 semantic mask，仍只是一份可 review 的候選</text><text x="40" y="161.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="500" fill="#536A91" text-anchor="start">threshold/argmax、tile blend/stitch、inverse mapping 與 postprocess 都會改變邊界；instance 與量測是明確的模型外責任。</text><rect x="1356" y="36" width="276" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1494" y="68.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="800" fill="#1769E0" text-anchor="middle">U-Net</text><text x="60" y="238.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="23" font-weight="900" fill="#0B2858" text-anchor="start">同一 test PCB</text><clipPath id="crop-candidate-raw-60-270-480-85"><rect x="60" y="270" width="312" height="324" rx="20"/></clipPath><g clip-path="url(#crop-candidate-raw-60-270-480-85)"><svg x="60" y="270" width="312" height="324" viewBox="480 85 1090 760" preserveAspectRatio="xMidYMid slice"><image href="u-net-beginner-01-pcb-label-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="60" y="270" width="312" height="324" rx="20" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="264" y="476" width="57" height="48" rx="8" fill="none" stroke="#F38B00" stroke-width="4"/><text x="216" y="626.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="middle">raw ROI 保留供回看</text><path d="M384 430 L456 430" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="470" y="334" width="250" height="190" rx="20" fill="#F8FBFF" stroke="#7966C7" stroke-width="2"/><text x="595" y="372.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="24" font-weight="900" fill="#0B2858" text-anchor="middle">pixel logits</text><text x="498" y="417.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="start">trace</text><rect x="569" y="400" width="104" height="21" rx="7" fill="#F3B53C" fill-opacity="0.82" stroke="#F3B53C" stroke-width="0"/><text x="498" y="452.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="start">pad</text><rect x="569" y="435" width="76" height="21" rx="7" fill="#1BAD8F" fill-opacity="0.82" stroke="#1BAD8F" stroke-width="0"/><text x="498" y="487.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="start">via</text><rect x="569" y="470" width="46" height="21" rx="7" fill="#4B8FF0" fill-opacity="0.82" stroke="#4B8FF0" stroke-width="0"/><text x="595" y="506.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="middle">未校正的類別分數</text><path d="M734 430 L800 430" fill="none" stroke="#7966C7" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-7966C7)"/><rect x="814" y="327" width="224" height="206" rx="22" fill="#F8FBFF" stroke="#1769E0" stroke-width="2"/><text x="926" y="367.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="900" fill="#0B2858" text-anchor="middle">模型外輸出規則</text><text x="926" y="407.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="800" fill="#1769E0" text-anchor="middle">threshold / argmax</text><text x="926" y="440.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="800" fill="#1769E0" text-anchor="middle">tile blend / stitch</text><text x="926" y="473.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">inverse map / postprocess</text><text x="926" y="507.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="middle">全部需要 versioned</text><path d="M1052 430 L1114 430" fill="none" stroke="#F38B00" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><text x="1261" y="238.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="23" font-weight="900" fill="#0B2858" text-anchor="middle">semantic mask candidate</text><rect x="1118" y="270" width="286" height="324" rx="22" fill="#103D41" stroke="#0E6570" stroke-width="2"/><path d="M1155.18 318.6 L1341.08 542.16" stroke="#F3B53C" stroke-width="15" stroke-linecap="round"/><rect x="1298.18" y="334.8" width="30.029999999999998" height="38.879999999999995" rx="8" fill="#1BAD8F" stroke="#B9FFF1" stroke-width="2"/><rect x="1343.94" y="334.8" width="30.029999999999998" height="38.879999999999995" rx="8" fill="#1BAD8F" stroke="#B9FFF1" stroke-width="2"/><rect x="1298.18" y="399.6" width="30.029999999999998" height="38.879999999999995" rx="8" fill="#1BAD8F" stroke="#B9FFF1" stroke-width="2"/><rect x="1343.94" y="399.6" width="30.029999999999998" height="38.879999999999995" rx="8" fill="#1BAD8F" stroke="#B9FFF1" stroke-width="2"/><circle cx="1175.2" cy="503.28" r="15.73" fill="#4B8FF0" stroke="#B9DAFF" stroke-width="3"/><rect x="1292.46" y="464.4" width="45.76" height="45.36000000000001" rx="8" fill="none" stroke="#D9485F" stroke-width="4" stroke-dasharray=""/><text x="1261" y="626.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#D9485F" text-anchor="middle">不保證 instance ID／物理尺寸</text><path d="M1417 430 L1460 430" fill="none" stroke="#F38B00" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><rect x="1410" y="318" width="230" height="224" rx="24" fill="#FFFFFF" stroke="#F38B00" stroke-width="2"/><text x="1525" y="361.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="23" font-weight="900" fill="#F38B00" text-anchor="middle">semantic</text><text x="1525" y="390.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#0B2858" text-anchor="middle">candidate mask</text><rect x="1444" y="412" width="162" height="62" rx="14" fill="#FFF8E8" stroke="#F38B00" stroke-width="2"/><text x="1525" y="441.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#9C6200" text-anchor="middle">REVIEW</text><text x="1525" y="465.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#D9485F" text-anchor="middle">or HOLD</text><text x="1525" y="519.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="middle">不是自動 PASS / FAIL</text><rect x="60" y="702" width="1532" height="114" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="96" y="745.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="23" font-weight="900" fill="#0B2858" text-anchor="start">需要每一個物件？</text><text x="96" y="779.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="start">接 connected-components / instance split 並驗證，或改用 instance segmentation。</text><text x="833" y="745.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="23" font-weight="900" fill="#0B2858" text-anchor="start">需要面積、CD 或不確定性？</text><text x="833" y="779.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="start">另接 calibration / repeatability / uncertainty gate；raw mask 不能直接宣稱量測真值。</text><rect x="40" y="849" width="1592" height="52" rx="22" fill="#FFF8DE" stroke="#F1B828" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="800" fill="#674500" text-anchor="middle">模型輸出的是 pixel-class evidence；mask 邊界、tile seam、instance split、量測與產品決策都要被清楚治理。</text></svg>