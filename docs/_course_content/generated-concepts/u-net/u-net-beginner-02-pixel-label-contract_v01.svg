<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">U-Net 的 pixel label、ignore 與 boundary contract</title><desc id="desc">同一個 PCB AOI 由原始畫面轉成 trace、pad、via、ignore／boundary policy 的語意訓練標籤；這是契約，不是物理量測真值或 instance ID。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D9485F"/></marker><marker id="arrow-7966C7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7966C7"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0B2858"/><text x="40" y="113.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="38" font-weight="900" fill="#081A38" text-anchor="start">先決定標註在說什麼：同一張 PCB，mask 是語意契約</text><text x="40" y="161.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="500" fill="#536A91" text-anchor="start">模型不會從顏色自動知道任務；class、ignore/void、boundary policy、tile 座標共同定義它能學什麼。</text><rect x="1356" y="36" width="276" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1494" y="68.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="800" fill="#1769E0" text-anchor="middle">U-Net</text><text x="70" y="231.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="25" font-weight="900" fill="#0B2858" text-anchor="start">raw AOI PCB</text><clipPath id="crop-label-raw-70-264-470-55"><rect x="70" y="264" width="510" height="402" rx="20"/></clipPath><g clip-path="url(#crop-label-raw-70-264-470-55)"><svg x="70" y="264" width="510" height="402" viewBox="470 55 1140 820" preserveAspectRatio="xMidYMid slice"><image href="u-net-beginner-01-pcb-label-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="70" y="264" width="510" height="402" rx="20" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="425" y="526" width="78" height="68" rx="9" fill="none" stroke="#F38B00" stroke-width="4"/><text x="325" y="704.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="middle">同一片 PCB；細線斷點只是一個待確認區</text><path d="M594 459 L706 459" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><text x="839" y="231.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="25" font-weight="900" fill="#0B2858" text-anchor="middle">human-authored pixel label</text><rect x="686" y="264" width="422" height="402" rx="22" fill="#103D41" stroke="#0E6570" stroke-width="2"/><path d="M740.86 324.3 L1015.1600000000001 601.6800000000001" stroke="#F3B53C" stroke-width="18.99" stroke-linecap="round"/><rect x="951.86" y="344.4" width="44.309999999999995" height="48.239999999999995" rx="8" fill="#1BAD8F" stroke="#B9FFF1" stroke-width="2"/><rect x="1019.38" y="344.4" width="44.309999999999995" height="48.239999999999995" rx="8" fill="#1BAD8F" stroke="#B9FFF1" stroke-width="2"/><rect x="951.86" y="424.8" width="44.309999999999995" height="48.239999999999995" rx="8" fill="#1BAD8F" stroke="#B9FFF1" stroke-width="2"/><rect x="1019.38" y="424.8" width="44.309999999999995" height="48.239999999999995" rx="8" fill="#1BAD8F" stroke="#B9FFF1" stroke-width="2"/><circle cx="770.4" cy="553.44" r="23.21" fill="#4B8FF0" stroke="#B9DAFF" stroke-width="3"/><rect x="943.4200000000001" y="505.2" width="67.52" height="56.28000000000001" rx="8" fill="none" stroke="#D9485F" stroke-width="4" stroke-dasharray="8 7"/><text x="897" y="704.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="800" fill="#D9485F" text-anchor="middle">這是訓練 target，不是工件的物理真值</text><rect x="1148" y="264" width="442" height="402" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1182" y="315.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="27" font-weight="900" fill="#0B2858" text-anchor="start">這份契約要明講</text><rect x="1182" y="344" width="364" height="64" rx="16" fill="#FFF9EE" stroke="#F38B00" stroke-width="2"/><text x="1206" y="382.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#F38B00" text-anchor="start">trace / pad / via classes</text><rect x="1182" y="430" width="364" height="70" rx="16" fill="#FFF6F7" stroke="#D9485F" stroke-width="2"/><text x="1206" y="462.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#D9485F" text-anchor="start">ignore / void + boundary policy</text><text x="1206" y="488.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="start">不確定像素怎麼標、怎麼評</text><rect x="1182" y="522" width="364" height="70" rx="16" fill="#F3FBF8" stroke="#11A863" stroke-width="2"/><text x="1206" y="554.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="900" fill="#11A863" text-anchor="start">tile / overlap / coordinate recipe</text><text x="1206" y="580.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="start">train 與 inference 要能重播</text><text x="1369" y="641.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#0B2858" text-anchor="middle">語意類別 ≠ instance ID ≠ 尺寸量測</text><rect x="70" y="758" width="1520" height="58" rx="20" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="830" y="794.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="800" fill="#0B2858" text-anchor="middle">先問：每個 pixel 的顏色代表什麼？沒有寫進 label contract 的 instance 與量測責任，不能在輸出端假定存在。</text><rect x="40" y="849" width="1592" height="52" rx="22" fill="#FFF8DE" stroke="#F1B828" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="800" fill="#674500" text-anchor="middle">U-Net 的第一個前提不是 U 形網路，而是可重播的 pixel-label／ignore／boundary／tile contract。</text></svg>