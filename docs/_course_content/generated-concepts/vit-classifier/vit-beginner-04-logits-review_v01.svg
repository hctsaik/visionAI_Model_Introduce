ont-size="25" font-weight="900" fill="#D9485F" text-anchor="middle">candidate</text><text x="1520" y="620.5" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#D9485F" text-anchor="middle">→ REVIEW</text><rect x="72" y="752" width="1543" height="60" rx="20" fill="#FFF0F2" stroke="#D9485F" stroke-width="2"/><text x="843" y="790" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#D9485F" text-anchor="middle">attention map ≠ defect box / mask；高 logit ≠ 未知缺陷證明或 PASS。</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#674500" text-anchor="middle">重點：模型只給候選類別訊號；現場責任由校正、拒答與 review gate 完成。</text></svg>