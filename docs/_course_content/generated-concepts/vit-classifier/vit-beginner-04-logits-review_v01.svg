, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">[CLS]</text><path d="M570 480 L670 480" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><rect x="695" y="305" width="250" height="340" rx="25" fill="#EAF4FF" stroke="#00A9C7" stroke-width="2"/><text x="820" y="367.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#071D43" text-anchor="middle">class token</text><text x="820" y="404.7" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#071D43" text-anchor="middle">或 pooling</text><text x="820" y="526.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="700" fill="#506584" text-anchor="middle">把整組 token</text><text x="820" y="554.6" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="700" fill="#506584" text-anchor="middle">彙整成一個向量</text><path d="M970 480 L1070 480" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><rect x="1095" y="245" width="250" height="470" rx="28" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1220" y="304" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#071D43" text-anchor="middle">linear head</text><text x="1132" y="395" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="750" fill="#071D43" text-anchor="start">known class A</text><rect x="1132" y="410" width="170" height="22" rx="11" fill="#E7EEF8"/><rect x="1132" y="410" width="155" height="22" rx="11" fill="#1769E0"/><text x="1132" y="487" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="750" fill="#071D4