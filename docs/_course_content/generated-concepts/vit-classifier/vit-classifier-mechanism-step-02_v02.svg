<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">patch 變成帶位置 token</title><desc id="desc">ViT 將每個影像 patch 轉成 embedding，加入位置資訊和可選 class token。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="positional_tokens" data-renderer-art="patch_features" data-primitive="vit_position_added" data-semantic-scene="vit_position_added" data-semantic-entities="patch_tokens|position_codes|positioned_tokens" data-specialist-coverage="patch_tokens|position_codes|positioned_tokens" data-semantic-relation="add position before token interaction" data-must-show="每個 patch flatten 成向量並加上位置標記 | 另有可選 class token | ViT 將每個影像 patch 轉成 embedding" data-not-claim="token 化前消失的微小訊號不會被位置編碼補回。"><title>patch 變成帶位置 token</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="178.27999999999997" y1="132.44" x2="326.12" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="393.88" y1="132.44" x2="535.56" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="patch_tokens" data-entity-label-full="token"><rect x="108.99770114942527" y="106.9503448275862" width="70.80459770114943" height="48.14712643678162" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M116.07816091954021 142.0977471264368 L132.36321839080458 129.57949425287356 L145