="13" fill="#F38B00"/><text x="742" y="380" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="800" fill="#071D43" text-anchor="start">optics / effective pixels</text><circle cx="713" cy="437" r="13" fill="#F38B00"/><text x="742" y="445" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="800" fill="#071D43" text-anchor="start">ROI / resolution / patch size</text><circle cx="713" cy="502" r="13" fill="#F38B00"/><text x="742" y="510" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="800" fill="#071D43" text-anchor="start">tile border / aggregation</text><circle cx="713" cy="567" r="13" fill="#F38B00"/><text x="742" y="575" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="800" fill="#071D43" text-anchor="start">pretraining / label ontology</text><text x="850" y="650" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#D9485F" text-anchor="middle">其中一項未鎖定 → HOLD</text><path d="M1078 466 L1170 466" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><rect x="1195" y="245" width="420" height="460" rx="28" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1405" y="305" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#071D43" text-anchor="middle">合格後才比較 backbone</text><text x="1405" y="397" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#F38B00" text-anchor="middle">ViT：patch tokens + attention</text><text x="1405" y="462" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#00A9C7" text-anchor="middle">ConvNeXt：hierarchical CNN</text><text x="1405" y="527" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#1769E0" text-anchor="middle">ResNet：residual CNN baseline</text><text x="1405" y="625.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="750" fill="#506584" text-anchor="middle">共同量：critical recall · calibration</text><text x="1405" y="652.3" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="750" fill="#506584" text-anchor="middle">OOD reject · VRAM · P95 · review load</text><rect x="65" y="758" width="1550" height="54" rx="18" fill="#EAF4FF" stroke="#1769E0" stroke-width="2"/><text x="840" y="793" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#071D43" text-anchor="middle">不要因為都叫 224×224 就當作 sampling 公平；固定 pixels、patch、pretraining、tile 與 reject contract。</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#674500" text-anchor="middle">重點：ViT 適合已知類別與跨區域關係；不是微小缺陷、未知類別或局部量測的自動解答。</text></svg>