<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">優先修取像，再限 assist</title><desc id="desc">當 PSF 不符或假邊緣高時，流程優先回到曝光、穩定化和對焦修正</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="capture_fix" data-renderer-art="image_text_or_diffusion" data-primitive="capture_fix_before_assist" data-semantic-scene="capture_fix_before_assist" data-semantic-entities="blurred_raw|capture_check|assist_candidate|review_gate" data-specialist-coverage="blurred_raw|capture_check|assist_candidate|review_gate" data-semantic-relation="repair capture evidence before relying on deblurring assistance" data-must-show="PSF mismatch／false edge 高時回 exposure、stabilization、focus | 非關鍵才交 human assist | 邊界提示：deblur 不可替代關鍵量測或 defect 判定。" data-not-claim="deblur 不可替代關鍵量測或 defect 判定。"><title>優先修取像，再限 assist</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="147.48" y1="132.44" x2="246.03999999999996" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="313.79999999999995" y1="132.44" x2="412.36" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="480.12" y1="132.44" x2="572.52" y2="132.44" stroke="#F38B00" stroke-width="4" marker-end="url(#arrow-orange)"/><g data-entity="blurred_raw" data-entity-label-full="blurred raw"><rect x="87.04827586206896" y="113.322