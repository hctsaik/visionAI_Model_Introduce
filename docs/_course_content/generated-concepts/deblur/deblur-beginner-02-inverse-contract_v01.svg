<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><marker id="a-1769E0" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1769E0"/></marker><marker id="a-00A8C6" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#00A8C6"/></marker><marker id="a-129B86" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#129B86"/></marker><marker id="a-F28B00" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#F28B00"/></marker><marker id="a-D94B62" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#D94B62"/></marker><marker id="a-F5B835" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#F5B835"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092754"/><text x="42" y="99.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#092754" text-anchor="start">第一步：同一張 blurred raw y 先附上 blur 假設，才能走 inverse route</text><text x="42" y="147.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">Deblur 的工作不是把影像變漂亮；它是在可回查的 capture 與 blur 假設下產生 conditional estimate x-hat。</text><rect x="1182" y="34" width="450" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1407" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">DEBLUR · RAW → ESTIMATE</text><clipPath id="photo-48-240"><rect x="48" y="240" width="386" height="420" rx="22"/></clipPath><g clip-path="url(#photo-48-240)"><image href="deblur-beginner-01-motion-blur-aoi_v01.png" x="48" y="240" width="386" height="420" preserveAspectRatio="xMidYMid slice"/></g><rect x="48" y="240" width="386" height="420" rx="22" fill="none" stroke="#1769E0" stroke-width="3"/><rect x="60" y="252" width="188" height="36" rx="18" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="154.0" y="278.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">blurred raw y</text><text x="241" y="705.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">sensor observation remains evidence</text><path d="M454 446 L514 446" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><rect x="540" y="224" width="444" height="462" rx="28" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="3"/><text x="762" y="273.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#12346C" text-anchor="middle">declared blur contract</text><text x="762" y="307.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="700" fill="#52688D" text-anchor="middle">describe the inverse assumption first</text><rect x="570" y="348" width="194" height="36" rx="18" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="667.0" y="374.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">motion / defocus</text><rect x="790" y="348" width="160" height="36" rx="18" fill="#00A8C6" stroke="#00A8C6" stroke-width="0"/><text x="870.0" y="374.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">PSF / kernel</text><rect x="655" y="411" width="214" height="36" rx="18" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="762.0" y="437.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">capture metadata</text><path d="M590 500 L934 500" fill="none" stroke="#D4E5FB" stroke-width="2" stroke-linecap="round"/><text x="762" y="550.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="850" fill="#12346C" text-anchor="middle">checkpoint · inverse method · resolution</text><text x="762" y="586.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D94B62" text-anchor="middle">not a promise that lost detail is known</text><path d="M1004 446 L1064 446" fill="none" stroke="#F28B00" stroke-width="6" stroke-linecap="round" marker-end="url(#a-F28B00)"/><rect x="1087" y="240" width="500" height="420" rx="22" fill="#EFFAF4" stroke="#129B86" stroke-width="3"/><rect x="1099" y="252" width="190" height="36" rx="18" fill="#129B86" stroke="#129B86" stroke-width="0"/><text x="1194.0" y="278.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">x-hat estimate</text><circle cx="1337.0" cy="471.0" r="105.0" fill="#D9F5EF" stroke="#129B86" stroke-width="4"/><path d="M1337.0 471.0 L1433.6 471.0" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M1337.0 471.0 L1420.6580540055768 519.3" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M1337.0 471.0 L1385.3 554.6580540055768" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M1337.0 471.0 L1337.0 567.6" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M1337.0 471.0 L1288.7 554.6580540055768" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M1337.0 471.0 L1253.3419459944232 519.3" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M1337.0 471.0 L1240.4 471.0" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M1337.0 471.0 L1253.3419459944232 422.7" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M1337.0 471.0 L1288.7 387.3419459944232" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M1337.0 471.0 L1337.0 374.4" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M1337.0 471.0 L1385.3 387.3419459944232" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M1337.0 471.0 L1420.6580540055768 422.69999999999993" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><text x="1337.0" y="634.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D94B62" text-anchor="middle">conditional estimate — not truth</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">重點：x-hat 是在 declared blur / route 下的 estimate；raw y 與 capture contract 不能被它取代。</text></svg>