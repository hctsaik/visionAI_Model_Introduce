<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Inpainting：implementation、condition 與 sampling 組成可重播的 synthetic fill recipe</title><desc id="desc">original、mask 與 context 進入具版本的 inpainting route，然後在遮罩內 guided denoising 與 blend，產生 filled image 和 edit manifest。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#00A8C6"/></marker><marker id="arrow-129B86" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#129B86"/></marker><marker id="arrow-7657C8" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#D94B62"/></marker><marker id="arrow-149A62" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#149A62"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092754"/><text x="42" y="99.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#092754" text-anchor="start">inpaint recipe 會改變 fill，不是背景設定</text><text x="42" y="147.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">改 checkpoint、prompt/condition、resolution、tile/blend、sampler、steps、guidance 或 seed，都可能改變同一 mask 內的 plausible expression；必須留在 trace。</text><rect x="1148" y="34" width="484" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1390" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">INPAINTING · SYNTHETIC FILL</text><text x="50" y="210.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#12346C" text-anchor="start">versioned inputs</text><g data-entity="inpainting_physical_aoi" data-contract="original captured AOI remains evidence"><clipPath id="crop-recipe-original-50-242"><rect x="50" y="242" width="278" height="186" rx="24"/></clipPath><g clip-path="url(#crop-recipe-original-50-242)"><image href="../../../roadmap-model-selection/diffusion-restoration/inpainting/images/source/INPAINTING-01-engineer-mask-story_v01.png" x="50" y="242" width="278" height="186" preserveAspectRatio="xMaxYMin slice"/></g><rect x="50" y="242" width="278" height="186" rx="24" fill="none" stroke="#1769E0" stroke-width="3"/></g><g data-entity="raw_observed_detail"><rect x="184" y="333" width="37" height="37" rx="5" fill="none" stroke="#D94B62" stroke-width="3"/><text x="202.5" y="321.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">raw detail</text></g><text x="189" y="456.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#1769E0" text-anchor="middle">original AOI + hash</text><g data-entity="inpainting_physical_aoi" data-contract="original captured AOI remains evidence"><clipPath id="crop-recipe-mask-50-500"><rect x="50" y="500" width="278" height="186" rx="24"/></clipPath><g clip-path="url(#crop-recipe-mask-50-500)"><image href="../../../roadmap-model-selection/diffusion-restoration/inpainting/images/source/INPAINTING-01-engineer-mask-story_v01.png" x="50" y="500" width="278" height="186" preserveAspectRatio="xMaxYMin slice"/></g><rect x="50" y="500" width="278" height="186" rx="24" fill="none" stroke="#F28B00" stroke-width="3"/></g><g data-entity="inpainting_edit_mask" data-contract="edit permission only"><path d="M112.12 555.42 C154.28 527.68, 251.0 533.52, 273.32 567.1 C295.64 612.36, 231.16 644.48, 156.76 631.34 C92.28 616.74, 82.36 578.78, 112.12 555.42Z" fill="#F28B00" fill-opacity=".18" stroke="#F28B00" stroke-width="5" stroke-dasharray="10 7"/><rect x="73" y="525" width="190" height="36" rx="17" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="168.0" y="552.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">mask + exterior context</text></g><text x="189" y="715.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#F28B00" text-anchor="middle">mask boundary + context</text><path d="M351 348 L421 348" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><path d="M351 594 L421 594" fill="none" stroke="#F28B00" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><rect x="443" y="224" width="615" height="499" rx="30" fill="#F4F0FF" stroke="#7657C8" stroke-width="4"/><text x="750" y="272.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#12346C" text-anchor="middle">named inpainting route</text><text x="750" y="307.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#7657C8" text-anchor="middle">freeze the recipe before comparing fills</text><rect x="486" y="351" width="244" height="81" rx="17" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><rect x="496" y="363" width="224" height="8" rx="4" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="608.0" y="398.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#12346C" text-anchor="middle">implementation</text><text x="608.0" y="422.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">latent / pixel route</text><rect x="768" y="351" width="244" height="81" rx="17" fill="#FFFFFF" stroke="#7657C8" stroke-width="2"/><rect x="778" y="363" width="224" height="8" rx="4" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><text x="890.0" y="398.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#12346C" text-anchor="middle">base checkpoint</text><text x="890.0" y="422.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#7657C8" text-anchor="middle">license + hash</text><rect x="486" y="469" width="244" height="81" rx="17" fill="#FFFFFF" stroke="#F28B00" stroke-width="2"/><rect x="496" y="481" width="224" height="8" rx="4" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="608.0" y="516.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#12346C" text-anchor="middle">condition</text><text x="608.0" y="540.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#F28B00" text-anchor="middle">prompt / context version</text><rect x="768" y="469" width="244" height="81" rx="17" fill="#FFFFFF" stroke="#129B86" stroke-width="2"/><rect x="778" y="481" width="224" height="8" rx="4" fill="#129B86" stroke="#129B86" stroke-width="0"/><text x="890.0" y="516.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#12346C" text-anchor="middle">sampling</text><text x="890.0" y="540.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#129B86" text-anchor="middle">sampler / steps / seed</text><text x="750" y="613.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D94B62" text-anchor="middle">resolution · tile · blend · GPU/VRAM · full P95</text><text x="750" y="652.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="middle">any recipe change = a different synthetic candidate</text><path d="M1080 473 L1143 473" fill="none" stroke="#7657C8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="1161" y="224" width="454" height="499" rx="30" fill="#FFF7EB" stroke="#F28B00" stroke-width="4"/><text x="1388" y="273.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#12346C" text-anchor="middle">guided denoising + blend</text><g data-entity="inpainting_physical_aoi" data-contract="original captured AOI remains evidence"><clipPath id="crop-recipe-output-1201-316"><rect x="1201" y="316" width="184" height="172" rx="15"/></clipPath><g clip-path="url(#crop-recipe-output-1201-316)"><image href="../../../roadmap-model-selection/diffusion-restoration/inpainting/images/source/INPAINTING-01-engineer-mask-story_v01.png" x="1201" y="316" width="184" height="172" preserveAspectRatio="xMaxYMin slice"/></g><rect x="1201" y="316" width="184" height="172" rx="15" fill="none" stroke="#1769E0" stroke-width="3"/></g><g data-entity="inpainting_edit_mask" data-contract="edit permission only"><path d="M1242.78 368.99 C1270.32 342.96, 1333.5 348.44, 1348.08 379.95 C1362.66 422.42, 1320.54 452.56, 1271.94 440.23 C1229.82 426.53, 1223.34 390.90999999999997, 1242.78 368.99Z" fill="#F28B00" fill-opacity=".18" stroke="#F28B00" stroke-width="5" stroke-dasharray="10 7"/><rect x="1220" y="341" width="106" height="36" rx="17" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="1273.0" y="368.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">fill path</text></g><g data-entity="synthetic_filled_region"><path d="M1241.3 422.0 C1260.15 376.0, 1303.65 437.0, 1342.8 375.0" fill="none" stroke="#129B86" stroke-width="13" stroke-linecap="round"/><path d="M1245.65 422.0 C1264.5 382.0, 1308.0 432.0, 1338.45 378.0" fill="none" stroke="#00A8C6" stroke-width="4" stroke-linecap="round"/></g><text x="1491" y="367.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#12346C" text-anchor="middle">outside mask</text><text x="1491" y="398.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#149A62" text-anchor="middle">original context</text><text x="1491" y="456.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#12346C" text-anchor="middle">inside mask</text><text x="1491" y="487.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D94B62" text-anchor="middle">synthetic fill</text><rect x="1201" y="549" width="367" height="102" rx="20" fill="#FFFFFF" stroke="#F28B00" stroke-width="2"/><text x="1385" y="585.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#F28B00" text-anchor="middle">output: filled image + edit manifest</text><text x="1385" y="618.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D94B62" text-anchor="middle">not a score, measurement, or defect truth</text><rect x="50" y="759" width="1565" height="54" rx="18" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="833" y="794.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">The recipe makes a repeatable edit path—not a repeatable observation of what was physically inside the mask.</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">保存 recipe 是為了能重播並找出 failure；不能用同一 seed 的漂亮 fill 略過 raw、mask、context 或 human review。</text></svg>