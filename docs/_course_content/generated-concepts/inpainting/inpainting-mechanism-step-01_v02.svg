<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">original 與 mask 固定</title><desc id="desc">原始影像和有明確邊界政策的二元或軟遮罩被分開保存。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="raw_mask" data-renderer-art="input_roi" data-primitive="inpainting_raw_mask_contract" data-semantic-scene="inpainting_raw_mask_contract" data-semantic-entities="raw_image|declared_mask|masked_region" data-specialist-coverage="raw_image|declared_mask|masked_region" data-semantic-relation="freeze original image and edit mask separately" data-must-show="original image／ROI hash、binary／soft mask、boundary policy 分開畫出 | 「original 與 mask 固定」需以專屬物件與箭頭表達，不得使用通用 family motif。 | 邊界提示：mask 不是被相機量到的真實結構。" data-not-claim="mask 不是被相機量到的真實結構。"><title>original 與 mask 固定</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="178.27999999999997" y1="132.44" x2="326.12" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="393.88" y1="132.44" x2="535.56" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><path d="M569.4399999999999 53.39999999999999L584.0 67.96L569.4399999999999 82.52L554.8799999999999 67.96z" fill="#FFF4CC" stroke="#C88400" stroke-width="2"/><g data-entity="raw_image" data-entity-label-full="raw"><rect x="108.99770114942527" y="106.9503448275862" width="70.8045