<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Inpainting：original、mask、filled candidate 與 edit manifest 一起交 human review</title><desc id="desc">三聯關係和 recipe trace 被保存，review 按 mask strata、context mismatch、failure gallery、P95/cost 和 safe fallback 判斷候選用途。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#00A8C6"/></marker><marker id="arrow-129B86" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#129B86"/></marker><marker id="arrow-7657C8" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#D94B62"/></marker><marker id="arrow-149A62" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#149A62"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092754"/><text x="42" y="99.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#092754" text-anchor="start">輸出要以三聯關係交接：original、mask、filled candidate 永遠並列</text><text x="42" y="147.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">review 不是只看填得好不好看；它要能回查 edit manifest、mask strata、context mismatch、failure gallery 與完整成本，才能知道候選的範圍。</text><rect x="1148" y="34" width="484" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1390" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">INPAINTING · SYNTHETIC FILL</text><text x="50" y="210.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#12346C" text-anchor="start">one auditable edit bundle</text><rect x="50" y="240" width="678" height="420" rx="29" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="3"/><text x="389" y="286.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#12346C" text-anchor="middle">keep the original / mask / output relation</text><rect x="83" y="324" width="177" height="222" rx="18" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><g data-entity="inpainting_physical_aoi" data-contract="original captured AOI remains evidence"><clipPath id="crop-bundle-original-99-348"><rect x="99" y="348" width="145" height="126" rx="12"/></clipPath><g clip-path="url(#crop-bundle-original-99-348)"><image href="../../../roadmap-model-selection/diffusion-restoration/inpainting/images/source/INPAINTING-01-engineer-mask-story_v01.png" x="99" y="348" width="145" height="126" preserveAspectRatio="xMaxYMin slice"/></g><rect x="99" y="348" width="145" height="126" rx="12" fill="none" stroke="#1769E0" stroke-width="3"/></g><g data-entity="raw_observed_detail"><rect x="162" y="412" width="24" height="24" rx="5" fill="none" stroke="#D94B62" stroke-width="3"/><text x="174.0" y="400.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">raw detail</text></g><text x="171" y="513.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="middle">ORIGINAL</text><rect x="294" y="324" width="177" height="222" rx="18" fill="#FFF7EB" stroke="#F28B00" stroke-width="3"/><g data-entity="inpainting_physical_aoi" data-contract="original captured AOI remains evidence"><clipPath id="crop-bundle-mask-310-348"><rect x="310" y="348" width="145" height="126" rx="12"/></clipPath><g clip-path="url(#crop-bundle-mask-310-348)"><image href="../../../roadmap-model-selection/diffusion-restoration/inpainting/images/source/INPAINTING-01-engineer-mask-story_v01.png" x="310" y="348" width="145" height="126" preserveAspectRatio="xMaxYMin slice"/></g><rect x="310" y="348" width="145" height="126" rx="12" fill="none" stroke="#F28B00" stroke-width="3"/></g><g data-entity="inpainting_edit_mask" data-contract="edit permission only"><path d="M343.13 391.92 C364.72 373.68, 414.25 377.52, 425.68 399.6 C437.11 429.36, 404.09000000000003 450.48, 365.99 441.84000000000003 C332.97 432.24, 327.89 407.28, 343.13 391.92Z" fill="#F28B00" fill-opacity=".18" stroke="#F28B00" stroke-width="5" stroke-dasharray="10 7"/><rect x="327" y="375" width="74" height="36" rx="17" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="364.0" y="402.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">mask</text></g><text x="382" y="513.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F28B00" text-anchor="middle">MASK</text><rect x="505" y="324" width="177" height="222" rx="18" fill="#EAFBFC" stroke="#129B86" stroke-width="3"/><g data-entity="inpainting_physical_aoi" data-contract="original captured AOI remains evidence"><clipPath id="crop-bundle-filled candidate-521-348"><rect x="521" y="348" width="145" height="126" rx="12"/></clipPath><g clip-path="url(#crop-bundle-filled candidate-521-348)"><image href="../../../roadmap-model-selection/diffusion-restoration/inpainting/images/source/INPAINTING-01-engineer-mask-story_v01.png" x="521" y="348" width="145" height="126" preserveAspectRatio="xMaxYMin slice"/></g><rect x="521" y="348" width="145" height="126" rx="12" fill="none" stroke="#129B86" stroke-width="3"/></g><g data-entity="inpainting_edit_mask" data-contract="edit permission only"><path d="M554.13 391.92 C575.72 373.68, 625.25 377.52, 636.68 399.6 C648.11 429.36, 615.09 450.48, 576.99 441.84000000000003 C543.97 432.24, 538.89 407.28, 554.13 391.92Z" fill="#129B86" fill-opacity=".18" stroke="#129B86" stroke-width="5" stroke-dasharray="10 7"/><rect x="538" y="375" width="78" height="36" rx="17" fill="#129B86" stroke="#129B86" stroke-width="0"/><text x="577.0" y="402.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">filled</text></g><g data-entity="synthetic_filled_region"><path d="M554.54 429.9 C568.97 399.08, 602.27 439.95, 632.24 398.41" fill="none" stroke="#129B86" stroke-width="13" stroke-linecap="round"/><path d="M557.87 429.9 C572.3 403.1, 605.6 436.6, 628.91 400.42" fill="none" stroke="#00A8C6" stroke-width="4" stroke-linecap="round"/></g><text x="593" y="513.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#129B86" text-anchor="middle">FILLED CANDIDATE</text><text x="389" y="605.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="middle">same record; never replace original evidence</text><path d="M751 450 L814 450" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="835" y="226" width="360" height="454" rx="29" fill="#F4F0FF" stroke="#7657C8" stroke-width="3"/><text x="1015" y="273.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#7657C8" text-anchor="middle">edit manifest</text><circle cx="879" cy="321" r="10" fill="#1769E0" stroke="none" stroke-width="0"/><text x="906" y="328.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="start">original + ROI hash</text><path d="M871 343 L1158 343" fill="none" stroke="#D7E5F8" stroke-width="2" stroke-linecap="round"/><circle cx="879" cy="368" r="10" fill="#F28B00" stroke="none" stroke-width="0"/><text x="906" y="375.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="start">mask generator / boundary</text><path d="M871 390 L1158 390" fill="none" stroke="#D7E5F8" stroke-width="2" stroke-linecap="round"/><circle cx="879" cy="415" r="10" fill="#00A8C6" stroke="none" stroke-width="0"/><text x="906" y="422.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="start">context + condition</text><path d="M871 437 L1158 437" fill="none" stroke="#D7E5F8" stroke-width="2" stroke-linecap="round"/><circle cx="879" cy="462" r="10" fill="#7657C8" stroke="none" stroke-width="0"/><text x="906" y="469.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="start">checkpoint + recipe</text><path d="M871 484 L1158 484" fill="none" stroke="#D7E5F8" stroke-width="2" stroke-linecap="round"/><circle cx="879" cy="509" r="10" fill="#129B86" stroke="none" stroke-width="0"/><text x="906" y="516.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="start">seed / sampler / blend</text><path d="M871 531 L1158 531" fill="none" stroke="#D7E5F8" stroke-width="2" stroke-linecap="round"/><circle cx="879" cy="556" r="10" fill="#D94B62" stroke="none" stroke-width="0"/><text x="906" y="563.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="start">synthetic label + reviewer</text><text x="1015" y="642.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="middle">missing trace → HOLD</text><path d="M1218 450 L1272 450" fill="none" stroke="#149A62" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-149A62)"/><rect x="1289" y="226" width="327" height="454" rx="29" fill="#EFFAF4" stroke="#149A62" stroke-width="3"/><text x="1452" y="271.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#149A62" text-anchor="middle">human review</text><text x="1452" y="319.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#12346C" text-anchor="middle">check by mask strata</text><circle cx="1341" cy="365" r="9" fill="#149A62" stroke="none" stroke-width="0"/><text x="1367" y="372.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="start">size / location / boundary</text><circle cx="1341" cy="410" r="9" fill="#149A62" stroke="none" stroke-width="0"/><text x="1367" y="417.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="start">context mismatch</text><circle cx="1341" cy="455" r="9" fill="#149A62" stroke="none" stroke-width="0"/><text x="1367" y="462.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="start">failure gallery</text><circle cx="1341" cy="500" r="9" fill="#149A62" stroke="none" stroke-width="0"/><text x="1367" y="507.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="start">full P95 / VRAM / cost</text><circle cx="1341" cy="545" r="9" fill="#149A62" stroke="none" stroke-width="0"/><text x="1367" y="552.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="start">safe fallback</text><g data-entity="human_review_or_hold_gate"><rect x="1314" y="575" width="274" height="88" rx="22" fill="#FFF1F3" stroke="#D94B62" stroke-width="3"/><text x="1338" y="610.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#D94B62" text-anchor="start">REVIEW / HOLD</text><text x="1338" y="640.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="start">not measurement or release</text></g><rect x="50" y="718" width="1566" height="96" rx="23" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="833" y="757.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#12346C" text-anchor="middle">A fill can be a useful augmentation or visual-edit candidate only when the original/mask/output relationship and recipe trace remain inspectable.</text><text x="833" y="791.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D94B62" text-anchor="middle">The review question is not “does it look normal?” but “what was edited, under which conditions, and what may it safely be used for?”</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">不把 filled candidate 帶回 raw evidence；任何涉及 defect existence、size、measurement 或 PASS 的決策，都回到 capture 與具名 specialist。</text></svg>