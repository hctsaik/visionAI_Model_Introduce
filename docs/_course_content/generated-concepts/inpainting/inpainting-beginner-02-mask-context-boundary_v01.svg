<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Inpainting：mask 是 edit permission，surrounding context 只是生成條件</title><desc id="desc">同一原始 AOI 被分成保留 evidence 的 raw、限定可改區域的 mask 和外部 context；三者共同產生 synthetic fill，但不恢復真實觀測。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#00A8C6"/></marker><marker id="arrow-129B86" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#129B86"/></marker><marker id="arrow-7657C8" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#D94B62"/></marker><marker id="arrow-149A62" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#149A62"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092754"/><text x="42" y="99.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#092754" text-anchor="start">先分清兩個輸入：mask 決定可改哪裡，surrounding context 決定如何猜</text><text x="42" y="147.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">同一張 original AOI 必須保留。mask 是 edit permission，不是 defect label；mask 外的 context 是生成條件，不會把填補結果變成觀測事實。</text><rect x="1148" y="34" width="484" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1390" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">INPAINTING · SYNTHETIC FILL</text><text x="50" y="211.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#12346C" text-anchor="start">original captured AOI</text><g data-entity="inpainting_physical_aoi" data-contract="original captured AOI remains evidence"><clipPath id="crop-mask-context-raw-50-244"><rect x="50" y="244" width="382" height="397" rx="24"/></clipPath><g clip-path="url(#crop-mask-context-raw-50-244)"><image href="../../../roadmap-model-selection/diffusion-restoration/inpainting/images/source/INPAINTING-01-engineer-mask-story_v01.png" x="50" y="244" width="382" height="397" preserveAspectRatio="xMaxYMin slice"/></g><rect x="50" y="244" width="382" height="397" rx="24" fill="none" stroke="#1769E0" stroke-width="3"/></g><rect x="74" y="267" width="205" height="36" rx="17" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="176.5" y="294.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">raw evidence stays</text><g data-entity="raw_observed_detail"><rect x="274" y="486" width="48" height="48" rx="5" fill="none" stroke="#D94B62" stroke-width="3"/><text x="298.0" y="474.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">raw detail</text></g><text x="241" y="681.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="middle">observed pixels are not overwritten</text><path d="M454 440 L518 440" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="540" y="220" width="513" height="433" rx="29" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="3"/><text x="796" y="265.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#12346C" text-anchor="middle">one original; two different roles</text><g data-entity="inpainting_physical_aoi" data-contract="original captured AOI remains evidence"><clipPath id="crop-mask-role-574-302"><rect x="574" y="302" width="195" height="173" rx="16"/></clipPath><g clip-path="url(#crop-mask-role-574-302)"><image href="../../../roadmap-model-selection/diffusion-restoration/inpainting/images/source/INPAINTING-01-engineer-mask-story_v01.png" x="574" y="302" width="195" height="173" preserveAspectRatio="xMaxYMin slice"/></g><rect x="574" y="302" width="195" height="173" rx="16" fill="none" stroke="#F28B00" stroke-width="3"/></g><g data-entity="inpainting_edit_mask" data-contract="edit permission only"><path d="M620.35 356.91 C648.4 331.64, 712.75 336.96, 727.6 367.55 C742.45 408.78, 699.55 438.04, 650.05 426.07 C607.15 412.77, 600.55 378.19, 620.35 356.91Z" fill="#F28B00" fill-opacity=".18" stroke="#F28B00" stroke-width="5" stroke-dasharray="10 7"/><rect x="597" y="330" width="142" height="36" rx="17" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="668.0" y="357.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">edit permission</text></g><text x="890" y="351.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#F28B00" text-anchor="middle">mask</text><text x="890" y="385.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="middle">where the model may fill</text><text x="890" y="416.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">not a defect label</text><path d="M570 504 L1022 504" fill="none" stroke="#D4E5FB" stroke-width="2" stroke-linecap="round"/><g data-entity="inpainting_physical_aoi" data-contract="original captured AOI remains evidence"><clipPath id="crop-context-role-574-533"><rect x="574" y="533" width="195" height="86" rx="16"/></clipPath><g clip-path="url(#crop-context-role-574-533)"><image href="../../../roadmap-model-selection/diffusion-restoration/inpainting/images/source/INPAINTING-01-engineer-mask-story_v01.png" x="574" y="533" width="195" height="86" preserveAspectRatio="xMaxYMin slice"/></g><rect x="574" y="533" width="195" height="86" rx="16" fill="none" stroke="#00A8C6" stroke-width="3"/></g><text x="890" y="564.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#00A8C6" text-anchor="middle">surrounding context</text><text x="890" y="596.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="middle">texture / layout / illumination cue</text><text x="890" y="625.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">condition, not recovered truth</text><path d="M1075 440 L1133 440" fill="none" stroke="#129B86" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-129B86)"/><rect x="1150" y="220" width="466" height="433" rx="29" fill="#EAFBFC" stroke="#129B86" stroke-width="3"/><text x="1383" y="265.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#129B86" text-anchor="middle">mask-limited synthetic fill</text><g data-entity="inpainting_physical_aoi" data-contract="original captured AOI remains evidence"><clipPath id="crop-context-output-1191-313"><rect x="1191" y="313" width="230" height="209" rx="18"/></clipPath><g clip-path="url(#crop-context-output-1191-313)"><image href="../../../roadmap-model-selection/diffusion-restoration/inpainting/images/source/INPAINTING-01-engineer-mask-story_v01.png" x="1191" y="313" width="230" height="209" preserveAspectRatio="xMaxYMin slice"/></g><rect x="1191" y="313" width="230" height="209" rx="18" fill="none" stroke="#129B86" stroke-width="3"/></g><g data-entity="inpainting_edit_mask" data-contract="edit permission only"><path d="M1243.38 377.55 C1277.72 346.2, 1356.5 352.8, 1374.68 390.75 C1392.8600000000001 441.9, 1340.34 478.2, 1279.74 463.35 C1227.22 446.85, 1219.14 403.95, 1243.38 377.55Z" fill="#129B86" fill-opacity=".18" stroke="#129B86" stroke-width="5" stroke-dasharray="10 7"/><rect x="1213" y="342" width="144" height="36" rx="17" fill="#129B86" stroke="#129B86" stroke-width="0"/><text x="1285.0" y="369.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">filled only here</text></g><g data-entity="synthetic_filled_region"><path d="M1239.76 441.3 C1263.68 386.56, 1318.88 459.15, 1368.56 385.37" fill="none" stroke="#129B86" stroke-width="13" stroke-linecap="round"/><path d="M1245.28 441.3 C1269.2 393.7, 1324.4 453.2, 1363.04 388.94" fill="none" stroke="#00A8C6" stroke-width="4" stroke-linecap="round"/></g><rect x="1289" y="545" width="188" height="37" rx="17" fill="#D94B62" stroke="#D94B62" stroke-width="0"/><text x="1383.0" y="572.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">SYNTHETIC FILL</text><text x="1383" y="612.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">plausible candidate; not evidence recovery</text><rect x="50" y="714" width="1566" height="100" rx="23" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="833" y="754.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#12346C" text-anchor="middle">read the relation, not just the nice-looking fill: original remains raw; mask says editable area; context guides a synthetic proposal</text><text x="833" y="790.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D94B62" text-anchor="middle">if mask boundary or context is wrong, the fill can look plausible and still be invalid for evidence, size, or defect existence</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">先保存 original / mask / context 關係；一張被填平的畫面只能表示「模型猜了什麼」，不能表示「現場原本是什麼」。</text></svg>