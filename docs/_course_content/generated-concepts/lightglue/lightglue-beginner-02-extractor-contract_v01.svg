<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">LightGlue external extractor contract</title><desc id="desc">The same workpiece views are converted by a specified external extractor into keypoints and descriptor tokens before LightGlue can compare them.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0C9B91" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C9B91"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-139A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#139A63"/></marker><marker id="arrow-52688D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52688D"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0A2450"/><text x="42" y="101.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#0A2450" text-anchor="start">先鎖上游：LightGlue 接收特徵 tokens，不是原圖直接變 transform</text><text x="42" y="148.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">同一 workpiece 的 A/B 視角先由指定 external extractor 產生 keypoints + descriptors。</text><rect x="1350" y="34" width="282" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1491" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#1769E0" text-anchor="middle">LightGlue · correspondence</text><g data-entity="lightglue_mobile_causal_flow"><rect x="30" y="178" width="510" height="112" rx="18" fill="#EFF7FF" stroke="#1769E0" stroke-width="2"/><text x="42" y="222.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#1769E0" text-anchor="start">external extractor</text><text x="42" y="266.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#102E62" text-anchor="start">→ keypoints + descriptors</text></g><clipPath id="crop-view-a-62-62-350-350-0"><rect x="62" y="350" width="300" height="236" rx="22"/></clipPath><g clip-path="url(#crop-view-a-62-62-350-350-0)"><svg x="62" y="350" width="300" height="236" viewBox="350 0 1250 941" preserveAspectRatio="xMidYMid slice"><image href="../yolo-seg/yolo-seg-beginner-01-pcb-instance-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="62" y="350" width="300" height="236" rx="22" fill="none" stroke="#1769E0" stroke-width="2"/><clipPath id="crop-view-b-62-420-350-410-15"><rect x="420" y="350" width="300" height="236" rx="22"/></clipPath><g clip-path="url(#crop-view-b-62-420-350-410-15)"><svg x="420" y="350" width="300" height="236" viewBox="410 15 1170 900" preserveAspectRatio="xMidYMid slice"><image href="../yolo-s