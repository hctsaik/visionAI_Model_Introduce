inecap="round" marker-end="url(#arrow-7657C8)" stroke-dasharray="8 8"/><path d="M730 467 L802 467" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="825" y="320" width="360" height="302" rx="24" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><text x="1005" y="363.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#102E62" text-anchor="middle">extractor output</text><text x="874" y="394.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#1769E0" text-anchor="start">A tokens</text><rect x="874" y="411" width="28" height="42" rx="7" fill="#1769E0" fill-opacity="0.86" stroke="#1769E0" stroke-width="0"/><rect x="912" y="411" width="28" height="42" rx="7" fill="#D8E6FB" fill-opacity="1.0" stroke="#D8E6FB" stroke-width="0"/><rect x="950" y="411" width="28" height="42" rx="7" fill="#D8E6FB" fill-opacity="1.0" stroke="#D8E6FB" stroke-width="0"/><rect x="988" y="411" width="28" height="42" rx="7" fill="#D8E6FB" fill-opacity="1.0" stroke="#D8E6FB" stroke-width="0"/><rect x="1026" y="411" width="28" height="42" rx="7" fill="#1769E0" fill-opacity="0.86" stroke="#1769E0" stroke-width="0"/><rect x="1064" y="411" width="28" height="42" rx="7" fill="#D8E6FB" fill-opacity="1.0" stroke="#D8E6FB" stroke-width="0"/><text x="874" y="494.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#00A8C6" text-anchor="start">B tokens</text><rect x="874" y="511" width="28" height="42" rx="7" fill="#00A8C6" fill-opacity="0.86" stroke="#00A8C6" stroke-width="0"/><rect x="912" y="511" width="28" height="42" rx="7" fill="#D8E6FB" fill-opacity="1.0" stroke="#D8E6FB" stroke-width="0"/><rect x="950" y="511" width="28" height="42" rx="7" fill="#D8E6FB" fill-opacity="1.0" stroke="#D8E6FB" stroke-width="0"/><rect x="988" y="511" width="28" height="42" rx="7" fill="#D8E6FB" fill-opacity="1.0" stroke="#D8E6FB" stroke-width="0"/><rect x="1026" y="511" width="28" height="42" rx="7" fill="#00A8C6" fill-opacity="0.86" stroke="#00A8C6" stroke-width="0"/><rect x="1064" y="511" width="28" height="42" rx="7" fill="#D8E6FB" fill-opacity="1.0" stroke="#D8E6FB" stroke-width="0"/><text x="1005" y="590.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="700" fill="#52688D" text-anchor="middle">每個 token 有位置 + descriptor</text><path d="M1209 467 L1292 467" fill="none" stroke="#7657C8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="1310" y="330" width="298" height="280" rx="24" fill="#F7F3FF" stroke="#7657C8" stroke-width="2"/><text x="1459" y="374.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#7657C8" text-anchor="middle">LightGlue</text><text x="1459" y="421.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="800" fill="#102E62" text-anchor="middle">比較 token</text><text x="1459" y="458.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#D94B62" text-anchor="middle">不是 detector</text><text x="1459" y="489.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#D94B62" text-anchor="middle">不是 transform solver</text><rect x="62" y="680" width="1546" height="126" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="92" y="721.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#102E62" text-anchor="start">要一起鎖的 input contract</text><rect x="398" y="698" width="178" height="56" rx="16" fill="#EFF7FF" stroke="#1769E0" stroke-width="2"/><text x="520" y="734.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#1769E0" text-anchor="middle">extractor</text><rect x="646" y="698" width="178" height="56" rx="16" fill="#EFF7FF" stroke="#1769E0" stroke-width="2"/><text x="768" y="734.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#1769E0" text-anchor="middle">weights</text><rect x="858" y="698" width="178" height="56" rx="16" fill="#EFF7FF" stroke="#1769E0" stroke-width="2"/><text x="980" y="734.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#1769E0" text-anchor="middle">resize</text><rect x="1051" y="698" width="244" height="56" rx="16" fill="#EFF7FF" stroke="#1769E0" stroke-width="2"/><text x="1173" y="734.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#1769E0" text-anchor="middle">keypoint budget</text><rect x="1334" y="698" width="178" height="56" rx="16" fill="#EFF7FF" stroke="#1769E0" stroke-width="2"/><text x="1456" y="734.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#1769E0" text-anchor="middle">ROI / crop</text><text x="92" y="781.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#D94B62" text-anchor="start">任何一項改變，都會改變 token、matching 行為、recall、latency 與舊結果能否比較。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">先固定 extractor contract；LightGlue 只從它交出的 tokens 開始工作。</text></svg>