<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">交 solver 驗共同幾何</title><desc id="desc">LightGlue matches 必須交給幾何 solver，以 inliers、coverage 和 residual 驗證。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="solver_verify" data-renderer-art="transform" data-primitive="geometry_solver_verify" data-semantic-scene="geometry_solver_verify" data-semantic-entities="matched_pairs|geometry_solver|residual_check|review_gate" data-specialist-coverage="matched_pairs|geometry_solver|residual_check|review_gate" data-semantic-relation="verify correspondences with a declared geometry solver" data-must-show="matches 流入 RANSAC/pose/warp solver | 輸出 inlier coverage | residual gate" data-not-claim="matcher 的責任止於 correspondence。"><title>交 solver 驗共同幾何</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="147.48" y1="132.44" x2="246.03999999999996" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="313.79999999999995" y1="132.44" x2="412.36" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="480.12" y1="132.44" x2="572.52" y2="132.44" stroke="#F38B00" stroke-width="4" marker-end="url(#arrow-orange)"/><g data-entity="matched_pairs" data-entity-label-full="matched pairs"><path d="M113.6 114.3848275862069L129.53103448275863 123.94344827