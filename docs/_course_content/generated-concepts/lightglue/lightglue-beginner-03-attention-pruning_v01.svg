<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">LightGlue token attention and pruning</title><desc id="desc">Self and cross attention compare two token sets; adaptive pruning and early stopping retain correspondence candidates but do not provide a geometric transform.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0C9B91" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C9B91"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-139A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#139A63"/></marker><marker id="arrow-52688D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52688D"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0A2450"/><text x="42" y="101.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#0A2450" text-anchor="start">tokens 互相參考，再只留下值得送進幾何驗證的 matches</text><text x="42" y="148.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">self/cross attention 幫助選擇 candidate correspondence；adaptive pruning / early stop 控制計算，不提供幾何保證。</text><rect x="1350" y="34" width="282" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1491" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#1769E0" text-anchor="middle">LightGlue · correspondence</text><g data-entity="lightglue_attention_mobile_flow"><rect x="30" y="178" width="510" height="112" rx="18" fill="#F7F3FF" stroke="#7657C8" stroke-width="2"/><text x="42" y="222.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#7657C8" text-anchor="start">A/B tokens attend</text><text x="42" y="266.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#102E62" text-anchor="start">→ confident matches</text></g><clipPath id="crop-view-a-62-62-350-350-0"><rect x="62" y="350" width="270" height="212" rx="22"/></clipPath><g clip-path="url(#crop-view-a-62-62-350-350-0)"><svg x="62" y="350" width="270" height="212" viewBox="350 0 1250 941" preserveAspectRatio="xMidYMid slice"><image href="../yolo-seg/yolo-seg-beginner-01-pcb-instance-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="62" y="350" width="270" height="212" rx="22" fill="none" stroke="#1769E0" stroke-width="2"/><clipPath id="crop-view-b-62-390-350-410-15"><rect x="390" y="350" width="270" height="212" rx="22"/></clipPath><g clip-path="url(#crop-view-b-62-390-350-410-15)"><svg x="390" y="350" width="270" height="212" viewBox="410 15 1170 900" preserveAspectRatio="xMidYMid slice"><image href="../yolo-seg/yolo-seg-beginner-01-pcb-instance-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="390" y="350" width="270" height="212" rx="22" fill="none" stroke="#00A8C6" stroke-width="2"/><text x="197.0" y="334.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#102E62" text-anchor="middle">raw view A</text><text x="525.0" y="334.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#102E62" text-anchor="middle">raw view B</text><circle cx="260" cy="428" r="10" fill="#FFFFFF" stroke="#F28B00" stroke-width="4"/><circle cx="260" cy="428" r="3" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><circle cx="574" cy="434" r="10" fill="#FFFFFF" stroke="#F28B00" stroke-width="4"/><circle cx="574" cy="434" r="3" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><path d="M260 428 C330 406, 504 456, 574 434" fill="none" stroke="#F28B00" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-F28B00)" stroke-dasharray="8 8"/><circle cx="304" cy="452" r="10" fill="#FFFFFF" stroke="#00A8C6" stroke-width="4"/><circle cx="304" cy="452" r="3" fill="#00A8C6" stroke="#00A8C6" stroke-width="0"/><circle cx="614" cy="459" r="10" fill="#FFFFFF" stroke="#00A8C6" stroke-width="4"/><circle cx="614" cy="459" r="3" fill="#00A8C6" stroke="#00A8C6" stroke-width="0"/><path d="M304 452 C374 430, 544 481, 614 459" fill="none" stroke="#00A8C6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-00A8C6)" stroke-dasharray="8 8"/><circle cx="213" cy="525" r="10" fill="#FFFFFF" stroke="#7657C8" stroke-width="4"/><circle cx="213" cy="525" r="3" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><circle cx="535" cy="527" r="10" fill="#FFFFFF" stroke="#7657C8" stroke-width="4"/><circle cx="535" cy="527" r="3" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><path d="M213 525 C283 503, 465 549, 535 527" fill="none" stroke="#7657C8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-7657C8)" stroke-dasharray="8 8"/><rect x="790" y="302" width="360" height="336" rx="24" fill="#FFFFFF" stroke="#7657C8" stroke-width="2"/><text x="970" y="346.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#7657C8" text-anchor="middle">self / cross attention</text><circle cx="853" cy="397" r="10" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><circle cx="1090" cy="409" r="10" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><path d="M866 397 C925 369, 1014 431, 1077 409" fill="none" stroke="#1769E0" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><circle cx="853" cy="446" r="10" fill="#00A8C6" stroke="#00A8C6" stroke-width="0"/><circle cx="1090" cy="458" r="10" fill="#00A8C6" stroke="#00A8C6" stroke-width="0"/><path d="M866 446 C925 418, 1014 480, 1077 458" fill="none" stroke="#00A8C6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><circle cx="853" cy="495" r="10" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><circle cx="1090" cy="507" r="10" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><path d="M866 495 C925 467, 1014 529, 1077 507" fill="none" stroke="#7657C8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><circle cx="853" cy="544" r="10" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><circle cx="1090" cy="556" r="10" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><path d="M866 544 C925 516, 1014 578, 1077 556" fill="none" stroke="#F28B00" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><text x="970" y="600.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="700" fill="#52688D" text-anchor="middle">relations, not a transform</text><path d="M1170 470 L1240 470" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="1262" y="302" width="346" height="336" rx="24" fill="#FFFFFF" stroke="#F28B00" stroke-width="2"/><text x="1435" y="346.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#F28B00" text-anchor="middle">adaptive pruning</text><path d="M1300 402 C1375 376, 1450 428, 1530 402" fill="none" stroke="#139A63" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-139A63)"/><text x="1554" y="409.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#139A63" text-anchor="start">keep</text><path d="M1300 452 C1375 426, 1450 478, 1530 452" fill="none" stroke="#D94B62" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-D94B62)" stroke-dasharray="8 9"/><text x="1554" y="459.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="start">prune</text><path d="M1300 502 C1375 476, 1450 528, 1530 502" fill="none" stroke="#139A63" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-139A63)"/><text x="1554" y="509.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#139A63" text-anchor="start">keep</text><path d="M1300 552 C1375 526, 1450 578, 1530 552" fill="none" stroke="#D94B62" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-D94B62)" stroke-dasharray="8 9"/><text x="1554" y="559.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="start">prune</text><text x="1435" y="601.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="700" fill="#52688D" text-anchor="middle">early stop when sufficient</text><rect x="62" y="692" width="1546" height="114" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="92" y="731.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#102E62" text-anchor="start">保留的 confidence 是 matcher 訊號</text><text x="92" y="766.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="700" fill="#52688D" text-anchor="start">keypoint budget / prune threshold / early stop 是 operating knobs：更快可能同時降低 recall；高 confidence 也可能在重複格紋上一起錯。</text><rect x="1240" y="718" width="318" height="58" rx="16" fill="#FFF0F1" stroke="#D94B62" stroke-width="2"/><text x="1399" y="754.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#D94B62" text-anchor="middle">candidate matches ≠ transform</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">LightGlue 的結果是 correspondence candidate；下一張才檢查它們能否支持同一個幾何。</text></svg>