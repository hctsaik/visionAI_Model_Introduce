<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">LightGlue geometry validation gate</title><desc id="desc">RANSAC, pose, or warp solvers use matches to test inlier coverage and residual before a transform candidate may be considered; insufficient evidence holds.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0C9B91" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C9B91"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-139A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#139A63"/></marker><marker id="arrow-52688D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52688D"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0A2450"/><text x="42" y="101.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#0A2450" text-anchor="start">高 confidence 的線，仍要由 RANSAC / pose / warp 驗證幾何</text><text x="42" y="148.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">solver 檢查哪些 matches 支持同一個 transform，以及 inlier coverage 和 residual 是否足夠。</text><rect x="1350" y="34" width="282" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1491" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#1769E0" text-anchor="middle">LightGlue · correspondence</text><g data-entity="lightglue_geometry_mobile_flow"><rect x="30" y="178" width="510" height="148" rx="18" fill="#EFFBF4" stroke="#139A63" stroke-width="2"/><text x="42" y="218.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#139A63" text-anchor="start">matches → geometry gate</text><text x="42" y="258.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#102E62" text-anchor="start">coverage + residual</text><text x="42" y="298.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#102E62" text-anchor="start">→ candidate / HOLD</text></g><clipPath id="crop-geometry-a-62-350-350-0"><rect x="62" y="350" width="326" height="260" rx="22"/></clipPath><g clip-path="url(#crop-geometry-a-62-350-350-0)"><svg x="62" y="350" width="326" height="260" viewBox="350 0 1250 941" preserveAspectRatio="xMidYMid slice"><image href="../yolo-seg/yolo-seg-beginner-01-pcb-instance-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="62" y="350" width="326" height="260" rx="22" fill="none" stroke="#1769E0" stroke-width="2"/><clipPath id="crop-geometry-b-530-350-410-15"><rect x="530" y="350" width="326" height="260" rx="22"/></clipPath><g clip-path="url(#crop-geometry-b-530-350-410-15)"><svg x="530" y="350" width="326" height="260" viewBox="410 15 1170 900" preserveAspectRatio="xMidYMid slice"><image href="../yolo-seg/yolo-seg-beginner-01-pcb-instance-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="530" y="350" width="326" height="260" rx="22" fill="none" stroke="#00A8C6" stroke-width="2"/><text x="225" y="332.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#102E62" text-anchor="middle">A: retained keypoints</text><text x="693" y="332.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#102E62" text-anchor="middle">B: retained keypoints</text><circle cx="214" cy="431" r="10" fill="#FFFFFF" stroke="#139A63" stroke-width="4"/><circle cx="214" cy="431" r="3" fill="#139A63" stroke="#139A63" stroke-width="0"/><circle cx="685" cy="442" r="10" fill="#FFFFFF" stroke="#139A63" stroke-width="4"/><circle cx="685" cy="442" r="3" fill="#139A63" stroke="#139A63" stroke-width="0"/><path d="M214 431 C395 395, 470 478, 685 442" fill="none" stroke="#139A63" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-139A63)"/><circle cx="267" cy="463" r="10" fill="#FFFFFF" stroke="#139A63" stroke-width="4"/><circle cx="267" cy="463" r="3" fill="#139A63" stroke="#139A63" stroke-width="0"/><circle cx="735" cy="472" r="10" fill="#FFFFFF" stroke="#139A63" stroke-width="4"/><circle cx="735" cy="472" r="3" fill="#139A63" stroke="#139A63" stroke-width="0"/><path d="M267 463 C395 427, 470 508, 735 472" fill="none" stroke="#139A63" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-139A63)"/><circle cx="180" cy="526" r="10" fill="#FFFFFF" stroke="#139A63" stroke-width="4"/><circle cx="180" cy="526" r="3" fill="#139A63" stroke="#139A63" stroke-width="0"/><circle cx="651" cy="531" r="10" fill="#FFFFFF" stroke="#139A63" stroke-width="4"/><circle cx="651" cy="531" r="3" fill="#139A63" stroke="#139A63" stroke-width="0"/><path d="M180 526 C395 490, 470 567, 651 531" fill="none" stroke="#139A63" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-139A63)"/><circle cx="305" cy="410" r="10" fill="#FFFFFF" stroke="#D94B62" stroke-width="4"/><circle cx="305" cy="410" r="3" fill="#D94B62" stroke="#D94B62" stroke-width="0"/><circle cx="583" cy="552" r="10" fill="#FFFFFF" stroke="#D94B62" stroke-width="4"/><circle cx="583" cy="552" r="3" fill="#D94B62" stroke="#D94B62" stroke-width="0"/><path d="M305 410 C395 374, 470 588, 583 552" fill="none" stroke="#D94B62" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-D94B62)" stroke-dasharray="9 8"/><circle cx="157" cy="570" r="10" fill="#FFFFFF" stroke="#D94B62" stroke-width="4"/><circle cx="157" cy="570" r="3" fill="#D94B62" stroke="#D94B62" stroke-width="0"/><circle cx="792" cy="395" r="10" fill="#FFFFFF" stroke="#D94B62" stroke-width="4"/><circle cx="792" cy="395" r="3" fill="#D94B62" stroke="#D94B62" stroke-width="0"/><path d="M157 570 C395 534, 470 431, 792 395" fill="none" stroke="#D94B62" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-D94B62)" stroke-dasharray="9 8"/><path d="M882 480 L953 480" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="977" y="325" width="300" height="310" rx="24" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><text x="1127" y="371.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#1769E0" text-anchor="middle">RANSAC / pose / warp</text><circle cx="1051" cy="453" r="38" fill="#EFF7FF" stroke="#1769E0" stroke-width="3"/><text x="1051" y="463.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#1769E0" text-anchor="middle">fit</text><path d="M1095 453 L1174 453" fill="none" stroke="#139A63" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-139A63)"/><text x="1127" y="542.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#102E62" text-anchor="middle">same-transform inliers</text><text x="1127" y="582.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#D94B62" text-anchor="middle">not matcher confidence alone</text><path d="M1304 480 L1361 480" fill="none" stroke="#139A63" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-139A63)"/><rect x="1380" y="325" width="228" height="310" rx="24" fill="#EFFBF4" stroke="#139A63" stroke-width="2"/><text x="1494" y="369.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#139A63" text-anchor="middle">geometry evidence</text><text x="1494" y="430.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#102E62" text-anchor="middle">inlier coverage</text><text x="1494" y="474.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#102E62" text-anchor="middle">residual</text><rect x="1410" y="514" width="168" height="56" rx="16" fill="#FFF0F1" stroke="#D94B62" stroke-width="2"/><text x="1494" y="549.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">insufficient → HOLD</text><rect x="62" y="692" width="1546" height="114" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="92" y="731.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#D94B62" text-anchor="start">常見錯誤：漂亮 lines 只集中在一小塊重複格紋</text><text x="92" y="766.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="700" fill="#52688D" text-anchor="start">coverage 不足、residual 過大、非剛性變化、反光或 domain shift 時，不湊 warp；保存 pair、extractor contract、matches、inliers、residual 與 reject evidence。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">transform 只能在 solver 的 coverage / residual gate 後成為 candidate；否則正確答案是 HOLD。</text></svg>