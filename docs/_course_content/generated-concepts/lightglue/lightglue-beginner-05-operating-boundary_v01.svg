<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">LightGlue operating boundary versus SIFT</title><desc id="desc">LightGlue and SIFT are separate matching routes. Both need the same downstream geometry gate and neither should be mistaken for a transform solver.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0C9B91" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C9B91"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-139A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#139A63"/></marker><marker id="arrow-52688D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52688D"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0A2450"/><text x="42" y="101.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#0A2450" text-anchor="start">選 LightGlue 前，先分清 extractor、matcher、SIFT 與 geometry solver 的責任</text><text x="42" y="148.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">LightGlue 是 learned correspondence matcher；SIFT 是另一條 classic keypoint/descriptor route，兩者都仍需相同的 geometry gate。</text><rect x="1350" y="34" width="282" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1491" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#1769E0" text-anchor="middle">LightGlue · correspondence</text><g data-entity="lightglue_boundary_mobile_flow"><rect x="30" y="178" width="510" height="148" rx="18" fill="#FFF7EB" stroke="#F28B00" stroke-width="2"/><text x="42" y="218.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#F28B00" text-anchor="start">matcher output = candidate</text><text x="42" y="258.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#102E62" text-anchor="start">no geometry evidence</text><text x="42" y="298.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#D94B62" text-anchor="start">→ HOLD</text></g><clipPath id="crop-boundary-raw-62-342-340-0"><rect x="62" y="342" width="322" height="260" rx="22"/></clipPath><g clip-path="url(#crop-boundary-raw-62-342-340-0)"><svg x="62" y="342" width="322" height="260" viewBox="340 0 1250 941" preserveAspectRatio="xMidYMid slice"><image href="../yolo-seg/yolo-seg-beginner-01-pcb-instance-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="62" y="342" width="322" height="260" rx="22" fill="none" stroke="#1769E0" stroke-width="2"/><text x="223" y="326.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#102E62" text-anchor="middle">same workpiece pair</text><path d="M410 470 L488 470" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="515" y="326" width="432" height="132" rx="22" fill="#EFF7FF" stroke="#1769E0" stroke-width="2"/><text x="731" y="367.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#1769E0" text-anchor="middle">LightGlue route</text><text x="731" y="406.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#102E62" text-anchor="middle">external learned extractor tokens</text><text x="731" y="435.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#102E62" text-anchor="middle">attention + pruning → matches</text><rect x="515" y="500" width="432" height="132" rx="22" fill="#FFFFFF" stroke="#52688D" stroke-width="2"/><text x="731" y="541.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#52688D" text-anchor="middle">SIFT is a separate route</text><text x="731" y="580.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#102E62" text-anchor="middle">scale/orientation keypoints</text><text x="731" y="609.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#102E62" text-anchor="middle">+ gradient descriptors → matches</text><path d="M972 392 L1050 446" fill="none" stroke="#7657C8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><path d="M972 568 L1050 498" fill="none" stroke="#52688D" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-52688D)"/><rect x="1075" y="354" width="295" height="258" rx="24" fill="#F7F3FF" stroke="#7657C8" stroke-width="2"/><text x="1222" y="400.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#7657C8" text-anchor="middle">same geometry gate</text><text x="1222" y="449.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#102E62" text-anchor="middle">RANSAC / pose / warp</text><text x="1222" y="484.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#102E62" text-anchor="middle">coverage + residual</text><text x="1222" y="539.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#D94B62" text-anchor="middle">not owned by matcher</text><path d="M1397 482 L1443 482" fill="none" stroke="#139A63" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-139A63)"/><rect x="1460" y="354" width="148" height="258" rx="22" fill="#EFFBF4" stroke="#139A63" stroke-width="2"/><text x="1534" y="406.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#139A63" text-anchor="middle">candidate</text><text x="1534" y="447.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="700" fill="#52688D" text-anchor="middle">or</text><rect x="1480" y="477" width="108" height="52" rx="14" fill="#FFF0F1" stroke="#D94B62" stroke-width="2"/><text x="1534" y="510.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#D94B62" text-anchor="middle">HOLD</text><text x="1534" y="564.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#102E62" text-anchor="middle">review evidence</text><rect x="62" y="692" width="1546" height="114" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="92" y="731.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#102E62" text-anchor="start">何時才值得驗證 LightGlue？</text><text x="92" y="760.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="700" fill="#52688D" text-anchor="start">當 traditional descriptor 在真實 surface 不穩、但你可鎖 extractor / weights / scale / keypoint budget，</text><text x="92" y="784.7" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="700" fill="#52688D" text-anchor="start">並能用 local pairs 量 inlier coverage、reject rate、registration tail 與 end-to-end P95。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">不要把 SIFT 當 LightGlue 的內部元件，也不要把任何 matcher 當 geometry solver。</text></svg>