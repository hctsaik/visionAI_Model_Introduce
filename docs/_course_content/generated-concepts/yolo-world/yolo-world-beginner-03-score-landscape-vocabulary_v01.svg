<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">YOLO-World: changed words change the scoring landscape</title><desc id="desc">The same raw AOI pixels can yield different prompt-conditioned dense score maps when vocabulary, negative phrase, normalization or cache changes. A score is not a calibrated defect probability.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7759C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7759C8"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-139B63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#139B63"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D9485F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092957"/><rect x="1168" y="18" width="464" height="38" rx="19" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1400" y="45.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">YOLO-WORLD · WORDS CHANGE SCORES</text><text x="40" y="122.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="39" font-weight="900" fill="#071C3D" text-anchor="start">同一組 pixels，只改詞彙或 negative phrase，score landscape 就可能改變</text><text x="40" y="166.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="570" fill="#506887" text-anchor="start">把詞彙當成可比較的實驗條件：保留 prompt bundle、cache、normalization 與 candidate recall；不要把較高分誤讀成較真的缺陷。</text><g data-entity="same_aoi_workpiece" data-contract="same raw AOI image"><clipPath id="same-aoi-42-215"><rect x="42" y="215" width="372" height="415" rx="28"/></clipPath><g clip-path="url(#same-aoi-42-215)"><image href="../../../roadmap-model-selection/detector/yolo-world/images/source/YOLOWORLD-01-engineer-story_v01.png" x="42" y="215" width="372" height="415" preserveAspectRatio="xMidYMid slice"/></g><rect x="42" y="215" width="372" height="415" rx="28" fill="none" stroke="#1769E0" stroke-width="3"/></g><rect x="72" y="241" width="184" height="36" rx="18" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="164.0" y="266.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">same raw AOI</text><g data-entity="open_vocabulary_candidate_box"><rect x="173" y="406" width="115" height="83" rx="8" fill="none" stroke="#F38B00" stroke-width="6"/><rect x="173" y="372" width="115" height="36" rx="18" fill="#F38B00" stroke="#F38B00" stroke-width="0"/><text x="230.5" y="397.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">same ROI</text></g><text x="228" y="669.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#092957" text-anchor="middle">raw pixels do not change</text><path d="M435 421 L515 421" fill="none" stroke="#1769E0" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="540" y="214" width="486" height="414" rx="30" fill="#FFFFFF" stroke="#7759C8" stroke-width="4"/><text x="783" y="257.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#7759C8" text-anchor="middle">bundle A</text><text x="783" y="286.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#092957" text-anchor="middle">surface scratch</text><g data-entity="declared_vocabulary_term"><rect x="581" y="315" width="404" height="72" rx="18" fill="#F2EDFF" stroke="#7759C8" stroke-width="3"/><text x="603" y="345.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#7759C8" text-anchor="start">positive: surface scratch</text><text x="603" y="370.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506887" text-anchor="start">template / cache A</text></g><g data-entity="dense_image_grid"><rect x="581" y="408" width="404" height="170" rx="26" fill="#EDF9FC" stroke="#00A8C6" stroke-width="4"/><text x="783.0" y="441.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#092957" text-anchor="middle">score landscape A</text><rect x="621.0" y="469.0" width="33.5" height="24.666666666666668" rx="7" fill="#B8ECF4" stroke="#00A8C6" stroke-width="1"/><rect x="662.5" y="469.0" width="33.5" height="24.666666666666668" rx="7" fill="#67CBE0" stroke="#00A8C6" stroke-width="1"/><rect x="704.0" y="469.0" width="33.5" height="24.666666666666668" rx="7" fill="#67CBE0" stroke="#00A8C6" stroke-width="1"/><rect x="745.5" y="469.0" width="33.5" height="24.666666666666668" rx="7" fill="#B8ECF4" stroke="#00A8C6" stroke-width="1"/><rect x="787.0" y="469.0" width="33.5" height="24.666666666666668" rx="7" fill="#67CBE0" stroke="#00A8C