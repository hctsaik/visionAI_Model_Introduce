#FFF6D8" stroke="#E4AF2B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#6E4A00" text-anchor="middle">學習邊界：詞彙、negative phrase、normalization 或 cache 一改，就要重新 qualification；zero-shot score 不是 calibrated defect probability。</text></svg>