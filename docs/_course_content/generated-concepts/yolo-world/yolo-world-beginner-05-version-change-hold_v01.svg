<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">YOLO-World: changing vocabulary, cache or runtime requires HOLD and requalification</title><desc id="desc">Ontology, negative phrases, cache, normalization, threshold, NMS, export, hardware and end-to-end P95 form one versioned operating recipe. Changes invalidate old comparisons until requalified.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7759C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7759C8"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-139B63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#139B63"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D9485F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092957"/><rect x="1168" y="18" width="464" height="38" rx="19" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1400" y="45.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">YOLO-WORLD · VERSION CHANGE → HOLD</text><text x="40" y="122.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="39" font-weight="900" fill="#071C3D" text-anchor="start">條件一改：YOLO-World 先 HOLD，再重新 qualification</text><text x="40" y="166.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="570" fill="#506887" text-anchor="start">YOLO-World 的快取與 dense path 可幫助探索，但模型版本、詞彙、後處理和部署環境仍是一整條可追溯的 qualification 契約。</text><rect x="44" y="222" width="1582" height="168" rx="30" fill="#FFFFFF" stroke="#1769E0" stroke-width="4"/><text x="84" y="265.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#092957" text-anchor="start">one versioned operating recipe</text><rect x="70" y="295" width="360" height="62" rx="17" fill="#F8FBFF" stroke="#7759C8" stroke-width="2"/><text x="250.0" y="322.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7759C8" text-anchor="middle">ontology / prompt bundle</text><text x="250.0" y="346.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506887" text-anchor="middle">terms + synonyms + negative phrases</text><path d="M438 326 L459 326" fill="none" stroke="#7759C8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-7759C8)"/><rect x="460" y="295" width="360" height="62" rx="17" fill="#F8FBFF" stroke="#7759C8" stroke-width="2"/><text x="640.0" y="322.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7759C8" text-anchor="middle">text encoder / cache version</text><text x="640.0" y="346.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506887" text-anchor="middle">normalization + cached embeddings</text><path d="M828 326 L849 326" fill="none" stroke="#7759C8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-7759C8)"/><rect x="850" y="295" width="360" height="62" rx="17" fill="#F8FBFF" stroke="#F38B00" stroke-width="2"/><text x="1030.0" y="322.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">dense score + threshold / NMS</text><text x="1030.0" y="346.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506887" text-anchor="middle">candidate policy + inverse map</text><path d="M1218 326 L1239 326" fill="none" stroke="#F38B00" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><rect x="1240" y="295" width="360" height="62" rx="17" fill="#F8FBFF" stroke="#1769E0" stroke-width="2"/><text x="1420.0" y="322.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="middle">export / hardware / P95</text><text x="1420.0" y="346.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506887" text-anchor="middle">end-to-end latency + review load</text><g data-entity="same_aoi_workpiece" data-contract="same raw AOI image"><clipPath id="same-aoi-49-445"><rect x="49" y="445" width="428" height="248" rx="28"/></clipPath><g clip-path="url(#same-aoi-49-445)"><image href="../../../roadmap-model-selection/detector/yolo-world/images/source/YOLOWORLD-01-engineer-story_v01.png" x="49" y="445" width="428" height="248" preserveAspectRatio="xMidYMid slice"/></g><rect x="49" y="445" width="428" height="248" rx="28" fill="none" stroke="#1769E0" stroke-width="3"/></g><rect x="78" y="470" width="172" height="36" rx="18" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="164.0" y="495.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">same raw AOI</text><g data-entity="open_vocabulary_candidate_box"><rect x="204" y="549" width="118" height="83" rx="8" fill="none" stroke="#F38B00" stroke-width="6"/><rect x="204" y="515" width="118" height="36" rx="18" fill="#F38B00" stroke="#F38B00" stroke-width="0"/><text x="263.0" y="540.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">old ROI</text></g><text x="263" y="727.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#092957" text-anchor="middle">old candidate measurement</text><path d="M500 566 L582 566" fill="none" stroke="#D9485F" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-D9485F)"/><rect x="610" y="426" width="446" height="294" rx="30" fill="#FFF9F0" stroke="#F38B00" stroke-width="4"/><text x="833" y="474.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#092957" text-anchor="middle">what changed?</text><rect x="654" y="500" width="358" height="30" rx="10" fill="#FFF4E1" stroke="#F38B00" stroke-width="1"/><text x="676" y="521.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#092957" text-anchor="start">new negative phrase / ontology</text><rect x="654" y="539" width="358" height="30" rx="10" fill="#FFF4E1" stroke="#F38B00" stroke-width="1"/><text x="676" y="560.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#092957" text-anchor="start">new cache or normalization</text><rect x="654" y="578" width="358" height="30" rx="10" fill="#FFF4E1" stroke="#F38B00" stroke-width="1"/><text x="676" y="599.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#092957" text-anchor="start">new threshold / NMS / export</text><rect x="654" y="617" width="358" height="30" rx="10" fill="#FFF4E1" stroke="#D9485F" stroke-width="1"/><text x="676" y="638.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#092957" text-anchor="start">new hardware or P95</text><path d="M1084 566 L1152 566" fill="none" stroke="#D9485F" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-D9485F)"/><g data-entity="hold_review_gate"><rect x="1174" y="478" width="417" height="106" rx="22" fill="#FFF2F3" stroke="#D9485F" stroke-width="3"/><text x="1200" y="511.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#D9485F" text-anchor="start">HOLD: old boxes / scores stale</text><text x="1200" y="539" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506887" text-anchor="start">save changed bundle; re-qualify</text><text x="1200" y="561" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506887" text-anchor="start">recall, stability, OOD and P95</text></g><rect x="610" y="752" width="981" height="54" rx="20" fill="#EEF8FB" stroke="#00A8C6" stroke-width="2"/><text x="1100" y="786.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#092957" text-anchor="middle">re-qualify: seen/unseen candidate recall · prompt stability · calibration · end-to-end P95 · specialist confirmation</text><rect x="40" y="850" width="1592" height="52" rx="20" fill="#FFF6D8" stroke="#E4AF2B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#6E4A00" text-anchor="middle">學習邊界：沒有通過新契約的 evidence，不延用舊 threshold 或 old ROI；先 HOLD，再以完整新 bundle 重新驗證。</text></svg>