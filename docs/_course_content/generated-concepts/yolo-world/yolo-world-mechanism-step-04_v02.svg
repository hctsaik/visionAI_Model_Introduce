<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">NMS 後交 candidate specialist</title><desc id="desc">YOLO-World 的候選 boxes 經 NMS 和回映後，只能交 specialist confirmation 並量 prompt stability/P95。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="open_vocab_specialist_gate" data-renderer-art="image_text_or_diffusion" data-primitive="open_vocab_specialist_handoff" data-semantic-scene="open_vocab_specialist_handoff" data-semantic-entities="nms_boxes|raw_image|specialist_review" data-specialist-coverage="nms_boxes|raw_image|specialist_review" data-semantic-relation="send open-vocabulary candidates to a specialist" data-must-show="dense scores 經 calibration/decode/NMS/inverse ROI | 連到 specialist confirmation | P95 指標" data-not-claim="零樣本 score 不能直接 PASS/FAIL。"><title>NMS 後交 candidate specialist</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="yoloworld-nms-specialist-handoff"><rect x="101.28" y="99.16" width="98.56" height="62.4" fill="none" stroke="#F38B00" stroke-width="3"/><rect x="125.92" y="115.8" width="98.56" height="62.4" fill="none" stroke="#F38B00" stroke-width="3"/><line x1="236.8" y1="140.76" x2="279.91999999999996" y2="140.76" stroke="#F38B00" stroke-width="4" marker-end="url(#arrow-orange)"/><rect x="298.4" y="95.0" width="110.88" height="81.12" rx="8" fill="#EAF3FF"