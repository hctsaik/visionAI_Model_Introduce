<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">text embeddings 對齊每個位置</title><desc id="desc">YOLO-World 將 text embeddings 與每個 dense image feature 對齊，產生 prompt-conditioned open-vocabulary scores。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="text_dense_alignment" data-renderer-art="image_text_or_diffusion" data-primitive="open_vocab_text_dense_match" data-semantic-scene="open_vocab_text_dense_match" data-semantic-entities="text_embedding|dense_features|candidate_boxes" data-specialist-coverage="text_embedding|dense_features|candidate_boxes" data-semantic-relation="align the phrase to dense image locations" data-must-show="文字 embedding 向量 | dense grid feature 相乘/融合 | 格點染上不同 phrase score" data-not-claim="score 是 prompt-conditioned 語意候選，不是固定 defect probability。"><title>text embeddings 對齊每個位置</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="yoloworld-text-dense-score"><path d="M95.12 105.4h92.39999999999999v45.76h-92.39999999999999z" fill="#E8FAFF" stroke="#1769E0" stroke-width="3"/><rect x="279.91999999999996" y="92.92" width="29.2" height="29.2" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><rect x="311.11999999999995" y="92.92" width="29.2" height="29.2" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><rect x="342.31999999999994" y="92.92" w