F" text-anchor="end">suppress</text><text x="1371.0" y="816.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D9485F" text-anchor="middle">prompt score ≠ defect probability</text></g><g data-entity="same_aoi_workpiece" data-contract="same raw AOI image"><clipPath id="same-aoi-611-684"><rect x="611" y="684" width="263" height="92" rx="28"/></clipPath><g clip-path="url(#same-aoi-611-684)"><image href="../../../roadmap-model-selection/detector/yolo-world/images/source/YOLOWORLD-01-engineer-story_v01.png" x="611" y="684" width="263" height="92" preserveAspectRatio="xMidYMid slice"/></g><rect x="611" y="684" width="263" height="92" rx="28" fill="none" stroke="#1769E0" stroke-width="3"/></g><g data-entity="open_vocabulary_candidate_box"><rect x="690" y="704" width="61" height="38" rx="8" fill="none" stroke="#F38B00" stroke-width="6"/><rect x="690" y="670" width="61" height="36" rx="18" fill="#F38B00" stroke="#F38B00" stroke-width="0"/><text x="720.5" y="695.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">ROI</text></g><text x="742" y="802.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">same raw AOI</text><rect x="40" y="850" width="1592" height="52" rx="20" fill="#FFF6D8" stroke="#E4AF2B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#6E4A00" text-anchor="middle">學習邊界：open vocabulary 的關鍵不是多一個標籤欄，而是詞彙/cache 改變每一個 dense score 的語意參照。</text></svg>