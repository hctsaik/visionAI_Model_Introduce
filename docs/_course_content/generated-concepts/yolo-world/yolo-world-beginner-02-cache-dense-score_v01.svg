red word</text><text x="825" y="544.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#F38B00" text-anchor="middle">a word-conditioned score</text><text x="825" y="582.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D9485F" text-anchor="middle">not a fixed closed-set class score</text><path d="M1061 465 L1131 465" fill="none" stroke="#00A8C6" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><g data-entity="dense_image_grid"><rect x="1152" y="212" width="438" height="368" rx="26" fill="#EDF9FC" stroke="#00A8C6" stroke-width="4"/><text x="1371.0" y="250.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#092957" text-anchor="middle">dense image grid</text><text x="1371.0" y="278.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506887" text-anchor="middle">same image · fixed pixel recipe</text><rect x="1192.0" y="305.0" width="37.75" height="42.8" rx="7" fill="#B8ECF4" stroke="#00A8C6" stroke-width="1"/><rect x="1237.75" y="305.0" width="37.75" height="42.8" rx="7" fill="#67CBE0" stroke="#00A8C6" stroke-width="1"/><rect x="1283.5" y="305.0" width="37.75" height="42.8" rx="7" fill="#67CBE0" stroke="#00A8C6" stroke-width="1"/><rect x="1329.25" y="305.0" width="37.75" height="42.8" rx="7" fill="#B8ECF4" stroke="#00A8C6" stroke-width="1"/><rect x="1375.0" y="305.0" width="37.75" height="42.8" rx="7" fill="#67CBE0" stroke="#00A8C6" stroke-width="1"/><rect x="1420.75" y="305.0" width="37.75" height="42.8" rx="7" fill="#67CBE0" stroke="#00A8C6" stroke-width="1"/><rect x="1466.5" y="305.0" width="37.75" height="42.8" rx="7" fill="#B8ECF4" stroke="#00A8C6" stroke-width="1"/><rect x="1512.25" y="305.0" width="37.75" height="42.8" rx="7" fill="#67CBE0" stroke="#