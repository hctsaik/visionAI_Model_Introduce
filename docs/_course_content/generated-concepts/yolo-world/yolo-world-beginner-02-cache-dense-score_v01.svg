<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">YOLO-World: cached text embeddings are compared to every dense image location</title><desc id="desc">Declared words and negative phrases become normalized cached text embeddings. Same-image dense features compare each location against each word to produce open-vocabulary scores.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7759C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7759C8"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-139B63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#139B63"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D9485F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092957"/><rect x="1168" y="18" width="464" height="38" rx="19" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1400" y="45.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">YOLO-WORLD · CACHE × DENSE GRID</text><text x="40" y="122.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="39" font-weight="900" fill="#071C3D" text-anchor="start">YOLO-World 的特徵不是只『看見』物件，而是逐位置對照已宣告的文字尺度</text><text x="40" y="166.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="570" fill="#506887" text-anchor="start">文字端先產生 versioned embeddings/cache；影像端保留多尺度 dense locations；每個 location 對每個已宣告詞彙取得不同 score。</text><rect x="44" y="210" width="450" height="580" rx="30" fill="#F8F5FF" stroke="#7759C8" stroke-width="4"/><text x="269" y="256.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="30" font-weight="900" fill="#7759C8" text-anchor="middle">text side</text><g data-entity="declared_vocabulary_term"><rect x="82" y="286" width="374" height="72" rx="18" fill="#F2EDFF" stroke="#7759C8" stroke-width="3"/><text x="104" y="316.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#7759C8" text-anchor="start">edge chip</text><text x="104" y="341.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506887" text-anchor="start">declared term</text></g><g data-entity="declared_vocabulary_term"><rect x="82" y="370" width="374" height="72" rx="18" fill="#F2EDFF" stroke="#7759C8" stroke-width="3"/><text x="104" y="400.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#7759C8" text-anchor="start">surface scratch</text><text x="104" y="425.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506887" text-anchor="start">declared term</text></g><g data-entity="declared_vocabulary_term"><rect x="82" y="454" width="374" height="72" rx="18" fill="#FFF7EC" stroke="#F38B00" stroke-width="3"/><text x="104" y="484.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#F38B00" text-anchor="start">negative: process mark</text><text x="104" y="509.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506887" text-anchor="start">negative phrase</text></g><path d="M269 548 L269 594" fill="none" stroke="#7759C8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-7759C8)"/><g data-entity="text_encoder_embedding_cache"><rect x="83" y="611" width="372" height="165" rx="28" fill="#F8F5FF" stroke="#7759C8" stroke-width="4"/><text x="269.0" y="645.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#7759C8" text-anchor="middle">text encoder</text><text x="269.0" y="673.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#506887" text-anchor="middle">normalize → cached text embeddings</text><rect x="117" y="693" width="304" height="21" rx="12" fill="#FFFFFF" stroke="#B8A7EF" stroke-width="2"/><rect x="139" y="697" width="16" height="13" rx="4" fill="#7759C8" stroke="#7759C8" stroke-width="0"/><rect x="166" y="697" width="16" height="13" rx="4" fill="#CFC3F5" stroke="#CFC3F5" stroke-width="0"/><rect x="193" y="697" width="16" height="13" rx="4" fill="#CFC3F5" stroke="#CFC3F5" stroke-width="0"/><rect x="220" y="697" width="16" height="13" rx="4" fill="#7759C8" stroke="#7759C8" stroke-width="0"/><rect x="247" y="697" width="16" height="13" rx="4" fill="#CFC3F5" stroke="#CFC3F5" stroke-width="0"/><rect x="274" y="697" width="16" height="13" rx="4" fill="#CFC3F5" stroke="#CFC3F5" stroke-width="0"/><rect x="301" y="697" width="16" height="13" rx="4" fill="#7759C8" stroke="#7759C8" stroke-width="0"/><rect x="328" y="697" width="16" height="13" rx="4" fill="#CFC3F5" stroke="#CFC3F5" stroke-width="0"/><rect x="117" y="723" width="304" height="21" rx="1