<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">YOLO-World: candidate boxes must retain their vocabulary and raw evidence before review</title><desc id="desc">Dense prompt-conditioned scores pass through versioned threshold, decode, NMS and inverse mapping before a candidate ROI and evidence bundle reach specialist review.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7759C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7759C8"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-139B63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#139B63"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D9485F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092957"/><rect x="1168" y="18" width="464" height="38" rx="19" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1400" y="45.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">YOLO-WORLD · CANDIDATE → EVIDENCE</text><text x="40" y="122.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="39" font-weight="900" fill="#071C3D" text-anchor="start">dense score 先成為文字條件下的候選框，再回到原始 AOI 交給專業證據確認</text><text x="40" y="166.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="570" fill="#506887" text-anchor="start">decode、threshold、NMS 與 inverse map 是候選處理契約；它們決定哪個 prompt-conditioned ROI 被保留，不會自動證明 defect。</text><g data-entity="same_aoi_workpiece" data-contract="same raw AOI image"><clipPath id="same-aoi-42-222"><rect x="42" y="222" width="463" height="454" rx="28"/></clipPath><g clip-path="url(#same-aoi-42-222)"><image href="../../../roadmap-model-selection/detector/yolo-world/images/source/YOLOWORLD-01-engineer-story_v01.png" x="42" y="222" width="463" height="454" preserveAspectRatio="xMidYMid slice"/></g><rect x="42" y="222" width="463" height="454" rx="28" fill="none" stroke="#1769E0" stroke-width="3"/></g><rect x="72" y="248" width="202" height="36" rx="18" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="173.0" y="273.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">same raw AOI image</text><g data-entity="open_vocabulary_candidate_box"><rect x="163" y="380" width="136" height="103" rx="8" fill="none" stroke="#F38B00" stroke-width="6"/><rect x="163" y="346" width="136" height="36" rx="18" fill="#F38B00" stroke="#F38B00" stroke-width="0"/><text x="231.0" y="371.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">edge chip</text></g><g data-entity="open_vocabulary_candidate_box"><rect x="285" y="486" width="111" height="83" rx="8" fill="none" stroke="#1769E0" stroke-width="6"/><rect x="285" y="452" width="111" height="36" rx="18" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="340.5" y="477.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">scratch</text></g><text x="273" y="715.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#092957" text-anchor="middle">overlapping prompt-conditioned candidates</text><path d="M530 450 L605 450" fill="none" stroke="#F38B00" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><g data-entity="prompt_conditioned_open_vocabulary_scores"><rect x="630" y="319" width="362" height="232" rx="26" fill="#FFFFFF" stroke="#F38B00" stroke-width="4"/><text x="811.0" y="358.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#092957" text-anchor="middle">dense scores</text><text x="811.0" y="386.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506887" text-anchor="middle">same location × each declared word</text><rect x="654" y="411" width="314" height="31" rx="10" fill="#F8FBFF" stroke="#F38B00" stroke-width="2"/><text x="669" y="433.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#F38B00" text-anchor="start">edge chip</text><text x="953" y="433.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="end">candidate</text><rect x="654" y="450" width="314" height="31" rx="10" fill="#F8FBFF" stroke="#1769E0" stroke-width="2"/><text x="669" y="472.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="start">surface scratch</text><text x="953" y="472.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="end">candidate</text><rect x="654" y="489" width="314" height="31" rx="10" fill="#F8FBFF" stroke="#D9485F" stroke-width="2"/><text x="669" y="511.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D9485F" text-anchor="start">negative: mark</text><text x="953" y="511.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9485F" text-anchor="end">suppress</text><text x="811.0" y="535.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D9485F" text-anchor="middle">prompt score ≠ defect probability</text></g><path d="M1015 450 L1086 450" fill="none" stroke="#F38B00" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><rect x="1110" y="286" width="276" height="324" rx="30" fill="#FFF9F0" stroke="#F38B00" stroke-width="4"/><text x="1248" y="334.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#092957" text-anchor="middle">decode / NMS</text><text x="1248" y="376.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="750" fill="#506887" text-anchor="middle">versioned threshold</text><text x="1248" y="414.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#F38B00" text-anchor="middle">keep / suppress</text><path d="M1158 453 L1338 453" fill="none" stroke="#F6D48A" stroke-width="3" stroke-linecap="round"/><text x="1248" y="496.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#139B63" text-anchor="middle">inverse map</text><text x="1248" y="532.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#506887" text-anchor="middle">back to raw coordinates</text><text x="1248" y="572.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9485F" text-anchor="middle">candidate only</text><path d="M1408 450 L1440 450" fill="none" stroke="#139B63" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-139B63)"/><rect x="1438" y="285" width="186" height="324" rx="26" fill="#F2FBF6" stroke="#139B63" stroke-width="4"/><text x="1531" y="333.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#139B63" text-anchor="middle">REVIEW</text><text x="1531" y="377.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#092957" text-anchor="middle">specialist</text><text x="1531" y="421.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#506887" text-anchor="middle">raw ROI</text><text x="1531" y="454.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#506887" text-anchor="middle">+ evidence</text><text x="1531" y="530.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9485F" text-anchor="middle">not PASS</text><g data-entity="candidate_evidence_bundle"><rect x="119" y="734" width="1426" height="104" rx="23" fill="#FFFFFF" stroke="#139B63" stroke-width="3"/><rect x="127.0" y="751" width="340.5" height="11" rx="5" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="297.25" y="799.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#092957" text-anchor="middle">raw AOI</text><path d="M460.5 816 L489.5 816" fill="none" stroke="#1769E0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="483.5" y="751" width="340.5" height="11" rx="5" fill="#7759C8" stroke="#7759C8" stroke-width="0"/><text x="653.75" y="799.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#092957" text-anchor="middle">vocabulary + negatives</text><path d="M817.0 816 L846.0 816" fill="none" stroke="#7759C8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-7759C8)"/><rect x="840.0" y="751" width="340.5" height="11" rx="5" fill="#F38B00" stroke="#F38B00" stroke-width="0"/><text x="1010.25" y="799.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#092957" text-anchor="middle">cache / score / NMS</text><path d="M1173.5 816 L1202.5 816" fill="none" stroke="#F38B00" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><rect x="1196.5" y="751" width="340.5" height="11" rx="5" fill="#139B63" stroke="#139B63" stroke-width="0"/><text x="1366.75" y="799.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#092957" text-anchor="middle">review evidence</text></g><rect x="40" y="850" width="1592" height="52" rx="20" fill="#FFF6D8" stroke="#E4AF2B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#6E4A00" text-anchor="middle">學習邊界：候選框帶著 raw AOI、vocabulary/negatives、cache、score、NMS 與座標回映去 review；最終決策由 evidence owner 作出。</text></svg>