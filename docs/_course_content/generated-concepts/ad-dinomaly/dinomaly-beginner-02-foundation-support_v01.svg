37" text-anchor="start">Lock checkpoint, frozen/adapted state, selected layers, feature normalization, ROI, stride and normal category roster.</text><text x="84" y="779.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D9475F" text-anchor="start">A frozen Foundation Transformer only fixes the front end; Dinomaly still fits its noisy-bottleneck / decoder path.</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF5D4" stroke="#E5AB22" stroke-width="2"/><circle cx="79" cy="875" r="12" fill="#FFE29A" stroke="#C98700" stroke-width="2"/><text x="79" y="882.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#805300" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#674700" text-anchor="start">If rare classes, illumination or normal modes are under-covered, familiar product variation can become a residual tail; pooled score cannot clear a category。</text></svg>