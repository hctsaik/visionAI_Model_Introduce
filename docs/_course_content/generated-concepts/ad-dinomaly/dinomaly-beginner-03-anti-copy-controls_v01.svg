gHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#7352DA" text-anchor="middle">Dinomaly · anti-copy tokens</text><text x="40" y="123.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="37" font-weight="900" fill="#0A1A37" text-anchor="start">先阻止 identity copy：noise、Linear Attention、Loose Reconstruction 共同限制抄寫</text><text x="40" y="166.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="650" fill="#52698D" text-anchor="start">目標是重建 normal feature regularity；不是把輸入 token、異常或 raw image 原樣複製到輸出</text><g data-entity="dinomaly_port_array_aoi"><clipPath id="photo-controls-58-276"><rect x="58" y="276" width="252" height="292" rx="23"/></clipPath><g clip-path="url(#photo-controls-58-276)"><image href="dinomaly-industrial-port-array-anchor_v02.png" x="58" y="276" width="252" height="292" preserveAspectRatio="xMidYMid slice"/></g><rect x="58" y="276" width="252" height="292" rx="23" fill="none" stroke="#1769E0" stroke-width="3"/><rect x="219.28" y="451.2" width="42.84" height="40.88" rx="7" fill="none" stroke="#F38B00" stroke-width="4"/><text x="240.7" y="440.2" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">review cue</text><text x="184.0" y="597.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="middle">same test ROI</text></g><path d="M331 420 L387 420" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><g data-entity="dinomaly_feature_tokens"><rect x="410" y="282" width="242" height="252" rx="21" fill="#EAF4FF" stroke="#1769E0" stroke-width="3"/><text x="531.0" y="314.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#