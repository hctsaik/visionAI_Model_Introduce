 reverse decoder 對</text><text x="1145" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17.5" font-weight="650" fill="#0B2858">teacher features 的重建</text><line x1="1145" y1="628" x2="1567" y2="628" stroke="#D6E7FF" stroke-width="2"/><text x="1145" y="659.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="900" fill="#F38B00">新輸入何時值得回看</text><text x="1145" y="690" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17.5" font-weight="650" fill="#0B2858">teacher/reconstructed feature</text><text x="1145" y="713" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17.5" font-weight="650" fill="#0B2858">discrepancy 大</text><rect x="77" y="800" width="1518" height="100" rx="22" fill="#FFF4CC" stroke="#F1B828"/><text x="112" y="836.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="900" fill="#674500">共同邊界：</text><text x="112" y="865" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="600" fill="#674500">經 anti-copy decoder 重建後的 token residual、layer fusion map 與 per-class candidate evidence；不是 training-free 保證、缺</text><text x="112" y="889" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="600" fill="#674500">陷類別、defect probability 或 PASS／FAIL。</text>
