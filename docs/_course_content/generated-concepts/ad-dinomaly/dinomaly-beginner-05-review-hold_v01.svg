431.5" width="37.6" height="25.25" rx="5" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.2"/><rect x="429.8" y="431.5" width="37.6" height="25.25" rx="5" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.2"/><rect x="470.2" y="431.5" width="37.6" height="25.25" rx="5" fill="#F38B00" fill-opacity="0.7" stroke="#F38B00" stroke-width="1.2"/><rect x="510.6" y="431.5" width="37.6" height="25.25" rx="5" fill="#F38B00" fill-opacity="0.7" stroke="#F38B00" stroke-width="1.2"/><text x="450.0" y="490.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">not pixel error</text></g><path d="M597 384 L661 384" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><rect x="690" y="249" width="370" height="271" rx="26" fill="#EAF4FF" stroke="#1769E0" stroke-width="3"/><text x="875" y="295.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#0A1A37" text-anchor="middle">versioned map rule</text><circle cx="744" cy="343" r="9" fill="#00A8C6"/><text x="768" y="350.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#0A1A37" text-anchor="start">resize / fusion / mask</text><circle cx="744" cy="392" r="9" fill="#F38B00"/><text x="768" y="399.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#0A1A37" text-anchor="start">aggregate + calibrate</text><circle cx="744" cy="441" r="9" fill="#D9475F"/><text x="768" y="448.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#0A1A37" text-anchor="start">threshold + decision unit</text><path d="M1084 384 L1145 384" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><g data-entity="dinomaly_candidate_review"><rect x="1169" y="307" width="255" height="153" rx="21" fill="#FFF4E4" stroke="#F38B00" stroke-width="3"/><circle cx="1296.5" cy="335" r="18" fill="#F38B00"/><text x="1296.5" y="342.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#FFFFFF" text-anchor="middle">?</text><text x="1296.5" y="379.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0A1A37" text-anchor="middle">candidate</text><text x="1296.5" y="405.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="middle">category + raw ROI review</text><text x="1296.5" y="445.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">not auto PASS</text></g><rect x="1455" y="262" width="137" height="242" rx="22" fill="#FFF4E4" stroke="#F38B00" stroke-width="3"/><text x="1524" y="302.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0A1A37" text-anchor="middle">record</text><text x="1524" y="337.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#149A62" text-anchor="middle">class</text><text x="1524" y="368.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">ROI</text><text x="1524" y="399.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#7352DA" text-anchor="middle">tokens</text><text x="1524" y="430.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#F38B00" text-anchor="middle">rule</text><text x="1524" y="472.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D9475F" text-anchor="middle">review</text><rect x="325" y="637" width="1267" height="166" rx="24" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="2"/><text x="357" y="678.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#0A1A37" text-anchor="start">HOLD when the anti-copy or observability contract breaks</text><circle cx="364" cy="710" r="9" fill="#D9475F"/><text x="386" y="717.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="start">dropout / Linear Attention / loose loss is unpinned</text><text x="934" y="717.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="760" fill="#0A1A37" text-anchor="start">rerun ablation + real escape review</text><circle cx="364" cy="745" r="9" fill="#7352DA"/><text x="386" y="752.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="start">rare class support, contamination or drift is uncertain</text><text x="934" y="752.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="760" fill="#0A1A37" text-anchor="start">check per-class low-FPR + future split</text><circle cx="364" cy="780" r="9" fill="#F38B00"/><text x="386" y="787.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="start">tiny defect below stride or global logic is outside tokens</text><text x="934" y="787.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="760" fill="#0A1A37" text-anchor="start">measure effective pixels; use structure / process evidence</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF5D4" stroke="#E5AB22" stroke-width="2"/><circle cx="79" cy="875" r="12" fill="#FFE29A" stroke="#C98700" stroke-width="2"/><text x="79" y="882.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#805300" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#674700" text-anchor="start">Candidate is an operating signal, not root cause or automatic PASS. Preserve raw ROI, reconstructed features, residual layers, category, rule and owner for REVIEW / HOLD。</text></svg>