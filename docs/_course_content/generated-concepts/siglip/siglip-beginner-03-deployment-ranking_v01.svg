ngFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="850" fill="#071D43" text-anchor="middle">→ normalized t</text><rect x="995" y="450" width="270" height="92" rx="18" fill="#EAFBFD" stroke="#00A9C7" stroke-width="2"/><text x="1130" y="508" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="850" fill="#071D43" text-anchor="middle">similarity / rank</text><text x="1130" y="605" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="750" fill="#506584" text-anchor="middle">policy: aggregation</text><text x="1130" y="641" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="750" fill="#506584" text-anchor="middle">threshold / calibration</text><path d="M1345 505 L1430 505" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#a-F38B00)"/><rect x="1460" y="275" width="145" height="460" rx="28" fill="#FFF7EC" stroke="#F38B00" stroke-width="3"/><text x="1532" y="375" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#774C00" text-anchor="middle">top-k</text><text x="1532" y="433" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#774C00" text-anchor="middle">semantic</text><text x="1532" y="491" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#774C00" text-anchor="middle">candidate</text><text x="1532" y="549" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#774C00" text-anchor="middle">rank</text><text x="1532" y="655" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D9485F" text-anchor="middle">not probability</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">帶走：v、t 和 similarity 只是在同一版本化 policy 下排序；請把 absolute score 當本地候選訊號，而不是 defect truth。</text></svg>