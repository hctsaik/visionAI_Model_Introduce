<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><marker id="a-1769E0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1769E0"/></marker><marker id="a-00A9C7" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#00A9C7"/></marker><marker id="a-F38B00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#F38B00"/></marker><marker id="a-D9485F" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#D9485F"/></marker><marker id="a-159A63" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#159A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#082554"/><rect x="1265" y="33" width="363" height="50" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1446" y="66" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">SIGLIP · FAIR COMPARISON</text><text x="40" y="108" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="40" font-weight="900" fill="#071D43" text-anchor="start">要選 SigLIP 或 CLIP，先固定同一份 evidence contract，再看本地結果</text><text x="40" y="153" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="550" fill="#506584" text-anchor="start">兩者都是 image–text dual encoder；objective 差異不是選型結論。公平比較要讓影像、文字、真值、cache、hardware 與 P95 一起受控。</text><clipPath id="clip-55-245"><rect x="55" y="245" width="330" height="420" rx="26"/></clipPath><g clip-path="url(#clip-55-245)"><image href="siglip-industrial-ceramic-workpiece-anchor_v02.png" x="55" y="245" width="330" height="420" preserveAspectRatio="xMidYMid slice"/></g><rect x="55" y="245" width="330" height="420" rx="26" fill="none" stroke="#1769E0" stroke-width="3"/><text x="220" y="700" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#071D43" text-anchor="middle">fixed AOI + prompt pool</text><path d="M420 450 L520 450" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><rect x="550" y="220" width="365" height="500" rx="30" fill="#EAFBFD" stroke="#00A9C7" stroke-width="3"/><text x="732" y="292" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#071D43" text-anchor="middle">SigLIP</text><text x="732" y="370" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="800" fill="#071D43" text-anchor="middle">dual embeddings</text><text x="732" y="422" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="800" fill="#071D43" text-anchor="middle">pairwise sigmoid</text><text x="732" y="474" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="800" fill="#071D43" text-anchor="middle">training objective</text><text x="732" y="526" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="800" fill="#071D43" text-anchor="middle">candidate rank</text><path d="M950 450 L1040 450" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#a-F38B00)"/><rect x="1070" y="220" width="365" height="500" rx="30" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><text x="1252" y="292" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#071D43" text-anchor="middle">CLIP</text><text x="1252" y="370" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="800" fill="#071D43" text-anchor="middle">dual embeddings</text><text x="1252" y="422" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="800" fill="#071D43" text-anchor="middle">batch contrastive</text><text x="1252" y="474" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="800" fill="#071D43" text-anchor="middle">training objective</text><text x="1252" y="526" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="800" fill="#071D43" text-anchor="middle">candidate rank</text><rect x="500" y="770" width="985" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="992" y="803" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#674500" text-anchor="middle">same ROI · preprocess · prompt ontology · candidate truth · cache · hardware · full P95</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">帶走：選哪個 dual encoder 要看同一契約下的 retrieval/grounding truth、prompt robustness、abstain 與 P95，不是看 objective 名稱。</text></svg>