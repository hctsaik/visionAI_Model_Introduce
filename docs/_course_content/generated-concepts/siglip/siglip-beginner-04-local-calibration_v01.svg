<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><marker id="a-1769E0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1769E0"/></marker><marker id="a-00A9C7" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#00A9C7"/></marker><marker id="a-F38B00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#F38B00"/></marker><marker id="a-D9485F" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#D9485F"/></marker><marker id="a-159A63" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#159A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#082554"/><rect x="1265" y="33" width="363" height="50" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1446" y="66" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">SIGLIP · LOCAL CALIBRATION</text><text x="40" y="108" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="40" font-weight="900" fill="#071D43" text-anchor="start">同一 AOI、同一 prompt，換 checkpoint 後分數尺度仍可能不能互比</text><text x="40" y="153" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="550" fill="#506584" text-anchor="start">不要用較高的 absolute similarity 選模型；先把同一目標真值、prompt pool、abstain 與完整 P95 放在同一個比較契約。</text><clipPath id="clip-55-235"><rect x="55" y="235" width="355" height="480" rx="26"/></clipPath><g clip-path="url(#clip-55-235)"><image href="siglip-industrial-ceramic-workpiece-anchor_v02.png" x="55" y="235" width="355" height="480" preserveAspectRatio="xMidYMid slice"/></g><rect x="55" y="235" width="355" height="480" rx="26" fill="none" stroke="#1769E0" stroke-width="3"/><text x="232" y="280" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">same image + prompt</text><path d="M450 455 L545 355" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><path d="M450 510 L545 610" fill="none" stroke="#00A9C7" stroke-width="6" stroke-linecap="round" marker-end="url(#a-00A9C7)"/><rect x="575" y="245" width="390" height="190" rx="28" fill="#FFFFFF" stroke="#1769E0" stroke-width="3"/><text x="770" y="305" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#071D43" text-anchor="middle">checkpoint A</text><text x="770" y="357" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="31" font-weight="900" fill="#1769E0" text-anchor="middle">similarity 0.72</text><text x="770" y="400" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#D9485F" text-anchor="middle">not directly comparable</text><rect x="575" y="500" width="390" height="190" rx="28" fill="#FFFFFF" stroke="#00A9C7" stroke-width="3"/><text x="770" y="560" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#071D43" text-anchor="middle">checkpoint B</text><text x="770" y="612" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="31" font-weight="900" fill="#00A9C7" text-anchor="middle">similarity 0.84</text><text x="770" y="655" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#D9485F" text-anchor="middle">not directly comparable</text><path d="M995 340 L1110 430" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#a-F38B00)"/><path d="M995 595 L1110 510" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#a-F38B00)"/><rect x="1140" y="235" width="460" height="500" rx="30" fill="#FFF7EC" stroke="#F38B00" stroke-width="3"/><text x="1370" y="305" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#774C00" text-anchor="middle">same local evidence contract</text><circle cx="1210" cy="382" r="11" fill="#F38B00"/><text x="1242" y="390" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#071D43" text-anchor="start">target retrieval / grounding truth</text><circle cx="1210" cy="454" r="11" fill="#F38B00"/><text x="1242" y="462" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#071D43" text-anchor="start">prompt variance + abstain</text><circle cx="1210" cy="526" r="11" fill="#F38B00"/><text x="1242" y="534" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#071D43" text-anchor="start">OOD / drift + queue + P95</text><circle cx="1210" cy="598" r="11" fill="#F38B00"/><text x="1242" y="606" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#071D43" text-anchor="start">local calibration + specialist review</text><text x="1370" y="680" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#D9485F" text-anchor="middle">otherwise → HOLD</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">帶走：pairwise sigmoid 不是跨 checkpoint 的共同分數尺度；改 checkpoint、prompt 或 score policy 時，重新做本地 calibration。</text></svg>