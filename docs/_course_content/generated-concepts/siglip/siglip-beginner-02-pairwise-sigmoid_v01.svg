 mark」</text><text x="1025" y="577" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#00A9C7" text-anchor="start">pair 3</text><text x="850" y="665" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#506584" text-anchor="middle">pairwise sigmoid alignment objective</text><path d="M1100 465 L1215 465" fill="none" stroke="#00A9C7" stroke-width="6" stroke-linecap="round" marker-end="url(#a-00A9C7)"/><rect x="1245" y="220" width="355" height="510" rx="30" fill="#EAFBFD" stroke="#00A9C7" stroke-width="3"/><text x="1422" y="330" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#071D43" text-anchor="middle">pretraining</text><text x="1422" y="385" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#071D43" text-anchor="middle">alignment</text><text x="1422" y="440" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#071D43" text-anchor="middle">≠ local score</text><text x="1422" y="495" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#071D43" text-anchor="middle">calibration</text><text x="1422" y="610" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="750" fill="#506584" text-anchor="middle">deployment still needs</text><text x="1422" y="648" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#D9485F" text-anchor="middle">locked contract</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">帶走：pairwise sigmoid 說明訓練時如何對齊 pair；它不保證任何 AOI score 已校準、穩定或可放行。</text></svg>