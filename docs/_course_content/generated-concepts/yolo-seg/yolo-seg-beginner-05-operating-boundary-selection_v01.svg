<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">YOLO-Seg operating boundaries and selection</title><desc id="desc">Operating points change instance output; compare semantic masks with instance output and hold for tiny, overlap, boundary, export, latency, metrology, or uncertainty needs.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0C9B91" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C9B91"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-139A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#139A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0A2450"/><text x="42" y="101.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#0A2450" text-anchor="start">同一張 AOI，operating knobs 改了，留下的 instance 與輪廓也會改</text><text x="42" y="148.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">threshold／NMS、prototype／mask resolution、crop／export 與端到端 P95 都是交付的一部分；tiny、overlap、tile border 需明確進 HOLD。</text><rect x="1366" y="34" width="266" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1499" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#1769E0" text-anchor="middle">YOLO-Seg · instance</text><text x="62" y="229.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#102E62" text-anchor="start">同一對接近的 contact instances</text><clipPath id="crop-operate-raw-62-260-1010-220"><rect x="62" y="260" width="430" height="388" rx="22"/></clipPath><g clip-path="url(#crop-operate-raw-62-260-1010-220)"><svg x="62" y="260" width="430" height="388" viewBox="1010 220 460 405" preserveAspectRatio="xMidYMid slice"><image href="yolo-seg-industrial-pcb-detail-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="62" y="260" width="430" height="388" rx="22" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="204" y="333" width="92" height="154" rx="8" fill="none" stroke="#1769E0" stroke-width="4"/><rect x="212" y="303" width="66" height="25" rx="10" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="224" y="322.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="start">A</text><rect x="310" y="333" width="92" height="154" rx="8" fill="none" stroke="#00A8C6" stroke-width="4"/><rect x="318" y="303" width="66" height="25" rx="10" fill="#00A8C6" stroke="#00A8C6" stroke-width="0"/><text x="330" y="322.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="start">B</text><rect x="264" y="514" width="66" height="55" rx="7" fill="none" stroke="#F28B00" stroke-width="4"/><text x="297" y="600.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F28B00" text-anchor="middle">tiny C</text><path d="M510 347 L564 347" fill="none" stroke="#D94B62" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-D94B62)"/><text x="588" y="321.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#102E62" text-anchor="start">1 · confidence / NMS</text><rect x="586" y="358" width="78" height="121" rx="7" fill="none" stroke="#1769E0" stroke-width="4"/><text x="625.0" y="347.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="middle">A</text><text x="625.0" y="501.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">0.84</text><rect x="678" y="358" width="78" height="121" rx="7" fill="none" stroke="#00A8C6" stroke-width="4"/><text x="717.0" y="347.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#00A8C6" text-anchor="middle">B</text><text x="717.0" y="501.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">0.82</text><rect x="628" y="372" width="78" height="121" rx="7" fill="none" stroke="#D94B62" stroke-width="4" stroke-dasharray="9 7"/><text x="667.0" y="361.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">dup</text><text x="667.0" y="515.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">0.79</text><text x="626" y="525" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#D94B62" text-anchor="middle">過度壓制：可能移除真的 B</text><text x="626" y="549" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#D94B62" text-anchor="middle">+過度寬鬆：可能保留 duplicate</text><path d="M813 410 L864 410" fill="none" stroke="#7657C8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><text x="1060" y="321.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#102E62" text-anchor="middle">2 · mask contour knobs</text><rect x="873" y="352" width="100" height="124" rx="16" fill="#123E4A" stroke="#1769E0" stroke-width="2"/><path d="M900 373 L947 368 L956 452 L898 460Z" fill="#1769E0" fill-opacity=".92"/><text x="923.0" y="500.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="middle">mask A</text><rect x="1000" y="352" width="100" height="124" rx="16" fill="#123E4A" stroke="#00A8C6" stroke-width="2"/><path d="M1027 373 L1074 368 L1083 452 L1025 460Z" fill="#00A8C6" fill-opacity=".92"/><text x="1050.0" y="500.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#00A8C6" text-anchor="middle">mask B</text><rect x="1130" y="352" width="115" height="124" rx="15" fill="#F8FBFF" stroke="#F28B00" stroke-width="2"/><path d="M1153 374 L1222 391 L1208 448 L1152 441Z" fill="#F28B00" fill-opacity=".75"/><text x="1065" y="548.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#D94B62" text-anchor="middle">resolution + threshold</text><text x="1065" y="572.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#D94B62" text-anchor="middle">會改變 contour</text><rect x="1264" y="260" width="328" height="388" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1428" y="301.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#102E62" text-anchor="middle">3 · export + operating evidence</text><text x="1288" y="346.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#0C9B91" text-anchor="start">inverse map / tile merge / export</text><text x="1288" y="377.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="start">回到原始 ROI 與版本紀錄</text><text x="1288" y="432.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#102E62" text-anchor="start">端到端 latency，不只 model</text><line x1="1294" y1="479" x2="1554" y2="479" stroke="#9FC4FF" stroke-width="10" stroke-linecap="round"/><line x1="1294" y1="479" x2="1335.6" y2="479" stroke="#1769E0" stroke-width="10" stroke-linecap="round"/><line x1="1335.6" y1="479" x2="1413.6" y2="479" stroke="#00A8C6" stroke-width="10" stroke-linecap="round"/><line x1="1413.6" y1="479" x2="1470.8" y2="479" stroke="#7657C8" stroke-width="10" stroke-linecap="round"/><line x1="1470.8" y1="479" x2="1554.0" y2="479" stroke="#F28B00" stroke-width="10" stroke-linecap="round"/><line x1="1533.2" y1="459" x2="1533.2" y2="499" stroke="#D94B62" stroke-width="4"/><text x="1533.2" y="450.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">P95</text><text x="1288" y="550.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="start">P95 要包含 preprocess、decode、NMS、</text><text x="1288" y="575.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="start">compose、inverse map 與 export。</text><rect x="1282" y="601" width="292" height="31" rx="12" fill="#FFF6F7" stroke="#D94B62" stroke-width="1"/><text x="1428" y="623.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#D94B62" text-anchor="middle">不是只報一個 model latency</text><rect x="62" y="674" width="1530" height="140" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="91" y="708.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#102E62" text-anchor="start">選型也看 decision unit</text><rect x="90" y="727" width="143" height="66" rx="18" fill="#123E4A" stroke="#0C9B91" stroke-width="2"/><path d="M115.74 750.1 C134.32999999999998 734.92, 190.1 736.9, 210.12 754.72 C211.55 773.86, 181.51999999999998 782.44, 142.91 779.14 C114.31 771.22, 105.73 760.0, 115.74 750.1Z" fill="#0C9B91" fill-opacity=".93"/><text x="252" y="749.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#0C9B91" text-anchor="start">U-Net / SegFormer</text><text x="252" y="779.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="start">要的是 pixel class / semantic region</text><path d="M538 759 L590 759" fill="none" stroke="#F28B00" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><rect x="604" y="721" width="72" height="74" rx="12" fill="#123E4A" stroke="#1769E0" stroke-width="2"/><rect x="620" y="735" width="21" height="43" rx="4" fill="#1769E0" stroke="#BBD7FF" stroke-width="1"/><rect x="646" y="735" width="20" height="43" rx="4" fill="#00A8C6" stroke="#B9FCF4" stroke-width="1"/><text x="696" y="749.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F28B00" text-anchor="start">YOLO-Seg</text><text x="696" y="779.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="start">要的是 known instance 的 box / class / mask</text><path d="M1120 759 L1170 759" fill="none" stroke="#D94B62" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-D94B62)"/><rect x="1184" y="704" width="378" height="91" rx="18" fill="#FFF6F7" stroke="#D94B62" stroke-width="2"/><text x="1373" y="737.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">HOLD：tiny、overlap、tile border、</text><text x="1373" y="764.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#102E62" text-anchor="middle">標註歧義、metrology / uncertainty 需求</text><text x="1373" y="787.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">保留 raw ROI、NMS、export 與 failure evidence</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">操作點不是 UI 調參：它們改變保留的 instance、輪廓、匯出與 P95；選型與 failure cases 都要一起驗證。</text></svg>