<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">先 decode/filter/NMS 留下 instances</title><desc id="desc">YOLO-Seg 先將 dense candidates 經 decode、篩選與 NMS 變成有限的 instance boxes。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="instance_nms_selection" data-renderer-art="detector_or_pose" data-primitive="instance_nms_selection" data-semantic-scene="instance_nms_selection" data-semantic-entities="raw_boxes|overlap_group|selected_instance" data-specialist-coverage="raw_boxes|overlap_group|selected_instance" data-semantic-relation="suppress overlapping instances before mask composition" data-must-show="許多候選框經 decode | confidence filter | NMS | 留下兩個不同顏色 instance boxes" data-not-claim="被 NMS 壓掉的候選不能再由 mask head 自動救回。"><title>先 decode/filter/NMS 留下 instances</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="178.27999999999997" y1="132.44" x2="326.12" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="393.88" y1="132.44" x2="535.56" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="raw_boxes" data-entity-label-full="raw boxes"><rect x="108.99770114942527" y="106.9503448275862" width="70.80459770114943" height="48.14712643678162" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M116.07816091954