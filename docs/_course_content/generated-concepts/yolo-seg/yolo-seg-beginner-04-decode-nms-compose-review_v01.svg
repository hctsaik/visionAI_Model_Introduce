<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">YOLO-Seg decode NMS prototype compose and review</title><desc id="desc">Dense candidates pass decode, filtering, and NMS; selected coefficients compose shared prototypes before crop, threshold, rescale, and review create per-instance candidates.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0C9B91" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C9B91"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-139A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#139A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0A2450"/><text x="42" y="101.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#0A2450" text-anchor="start">decode → NMS → prototype compose：留下每個 instance 的候選 mask</text><text x="42" y="148.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">同一 AOI 先產生重疊 dense candidates；decode／filter／NMS 選出物件，再用係數組合 prototypes，crop／threshold／rescale 後回到原始座標。</text><rect x="1366" y="34" width="266" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1499" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#1769E0" text-anchor="middle">YOLO-Seg · instance</text><text x="62" y="229.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#102E62" text-anchor="start">同一 PCB AOI 的 dense candidates</text><clipPath id="crop-decode-raw-62-260-920-180"><rect x="62" y="260" width="322" height="332" rx="22"/></clipPath><g clip-path="url(#crop-decode-raw-62-260-920-180)"><svg x="62" y="260" width="322" height="332" viewBox="920 180 600 570" preserveAspectRatio="xMidYMid slice"><image href="yolo-seg-industrial-pcb-detail-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="62" y="260" width="322" height="332" rx="22" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="166" y="335" width="62" height="92" rx="7" fill="none" stroke="#1769E0" stroke-width="4"/><text x="197.0" y="324.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="middle">A</text><text x="197.0" y="449.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">0.84</text><rect x="238" y="332" width="62" height="96" rx="7" fill="none" stroke="#00A8C6" stroke-width="4"/><text x="269.0" y="321.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#00A8C6" text-anchor="middle">B</text><text x="269.0" y="450.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">0.82</text><rect x="159" y="343" width="67" height="98" rx="7" fill="none" stroke="#D94B62" stroke-width="4" stroke-dasharray="9 7"/><text x="192.5" y="332.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">dup</text><text x="192.5" y="463.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">0.79</text><rect x="207" y="502" width="46" height="50" rx="7" fill="none" stroke="#F28B00" stroke-width="4"/><text x="230.0" y="491.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F28B00" text-anchor="middle">tiny</text><text x="230.0" y="574.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">0.38</text><text x="223" y="626.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#D94B62" text-anchor="middle">候選重疊、重複與 tiny score 都要留下證據</text><path d="M398 424 L456 424" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="470" y="282" width="238" height="282" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="589" y="323.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#102E62" text-anchor="middle">decode / filter / NMS</text><rect x="505" y="360" width="55" height="76" rx="7" fill="none" stroke="#1769E0" stroke-width="4"/><text x="532.5" y="349.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="middle">A</text><text x="532.5" y="458.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">kept</text><rect x="578" y="360" width="55" height="76" rx="7" fill="none" stroke="#00A8C6" stroke-width="4"/><text x="605.5" y="349.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#00A8C6" text-anchor="middle">B</text><text x="605.5" y="458.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">kept</text><rect x="649" y="363" width="42" height="72" rx="7" fill="none" stroke="#D94B62" stroke-width="4" stroke-dasharray="9 7"/><text x="670.0" y="352.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">dup</text><text x="670.0" y="457.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">remove</text><text x="589" y="481" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#D94B62" text-anchor="middle">IoU / class policy / output cap</text><text x="589" y="506" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#D94B62" text-anchor="middle">+會改變誰被留下</text><path d="M722 424 L775 424" fill="none" stroke="#7657C8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="788" y="260" width="288" height="300" rx="20" fill="#F7F3FF" stroke="#7657C8" stroke-width="2"/><text x="932.0" y="292.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#102E62" text-anchor="middle">shared prototype mask basis</text><ellipse cx="885.92" cy="425.0" rx="48.96" ry="66.0" fill="#1769E0" fill-opacity=".42"/><path d="M943.52 350.0 L1024.16 380.0 L975.2 494.0 L911.84 443.0Z" fill="#00A8C6" fill-opacity=".44"/><path d="M851.36 488.0 C926.24 401.0, 940.64 533.0, 1015.52 446.0" fill="none" stroke="#F5B835" stroke-width="15" stroke-linecap="round"/><circle cx="1001.12" cy="347.0" r="23.04" fill="#F28B00" fill-opacity=".72"/><text x="932.0" y="543.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#7657C8" text-anchor="middle">同一組 basis，供多個 instance 組合</text><text x="932" y="596" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#7657C8" text-anchor="middle">A coefficients ⊗ shared prototypes</text><text x="932" y="621" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#7657C8" text-anchor="middle">+B coefficients ⊗ shared prototypes</text><path d="M1089 424 L1140 424" fill="none" stroke="#7657C8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><text x="1255" y="232.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#102E62" text-anchor="middle">per-instance reconstruction</text><rect x="1154" y="282" width="100" height="124" rx="16" fill="#123E4A" stroke="#1769E0" stroke-width="2"/><path d="M1181 303 L1228 298 L1237 382 L1179 390Z" fill="#1769E0" fill-opacity=".92"/><text x="1204.0" y="430.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="middle">A mask</text><rect x="1280" y="282" width="100" height="124" rx="16" fill="#123E4A" stroke="#00A8C6" stroke-width="2"/><path d="M1307 303 L1354 298 L1363 382 L1305 390Z" fill="#00A8C6" fill-opacity=".92"/><text x="1330.0" y="430.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#00A8C6" text-anchor="middle">B mask</text><rect x="1406" y="310" width="70" height="70" rx="16" fill="#123E4A" stroke="#F28B00" stroke-width="2"/><ellipse cx="1442" cy="344" rx="18" ry="22" fill="#F28B00" fill-opacity=".9"/><text x="1441.0" y="404.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F28B00" text-anchor="middle">tiny?</text><text x="1275" y="451" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#102E62" text-anchor="middle">box crop → mask threshold</text><text x="1275" y="476" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#102E62" text-anchor="middle">+inverse rescale / tile merge</text><path d="M1275 498 L1275 560" fill="none" stroke="#F28B00" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><rect x="1105" y="589" width="416" height="88" rx="20" fill="#FFF9EC" stroke="#F28B00" stroke-width="2"/><text x="1313.0" y="623.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#814E00" text-anchor="middle">instance candidate → REVIEW / HOLD</text><text x="1313.0" y="652.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#D94B62" text-anchor="middle">不是自動 PASS，也不是量測真值</text><rect x="62" y="711" width="1518" height="103" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="91" y="751.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#102E62" text-anchor="start">為什麼需要 review？</text><text x="91" y="783.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="start">NMS、mask threshold、prototype resolution、crop／rescale 與 tile merge 都是版本化的推論步驟；它們會影響 duplicate、漏檢、contour 與匯出的 instance 結果。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">YOLO-Seg 的輸出是每一個 instance 的 box／class／mask candidate；decode 與後處理設定要和 raw AOI 一起被回查。</text></svg>