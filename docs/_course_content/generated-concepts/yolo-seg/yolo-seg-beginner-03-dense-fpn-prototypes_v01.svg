<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">YOLO-Seg dense multi-scale predictions and prototypes</title><desc id="desc">Backbone, FPN, and PAN feed dense box/class predictions and per-instance coefficients, while a shared prototype branch provides mask basis functions.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0C9B91" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C9B91"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-139A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#139A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0A2450"/><text x="42" y="101.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#0A2450" text-anchor="start">YOLO-Seg 先產生大量候選，再為每個 instance 準備 mask ingredients</text><text x="42" y="148.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">backbone／FPN／PAN 保留多尺度特徵；dense head 預測 box、class、score 與 per-instance coefficients，prototype branch 提供共享 mask basis。</text><rect x="1366" y="34" width="266" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1499" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#1769E0" text-anchor="middle">YOLO-Seg · instance</text><g data-entity="yoloseg_first_screen_causal_claim"><rect x="58" y="158" width="640" height="42" rx="16" fill="#FFF7EB" stroke="#F28B00" stroke-width="2"/><text x="78" y="187.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#102E62" text-anchor="start">one instance = candidate + coefficients × shared prototypes → mask</text></g><text x="60" y="334.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#102E62" text-anchor="start">同一 PCB ROI</text><clipPath id="crop-architecture-raw-60-340-920-185"><rect x="60" y="340" width="230" height="300" rx="22"/></clipPath><g clip-path="url(#crop-architecture-raw-60-340-920-185)"><svg x="60" y="340" width="230" height="300" viewBox="920 185 600 570" preserveAspectRatio="xMidYMid slice"><image href="yolo-seg-industrial-pcb-detail-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="60" y="340" width="230" height="300" rx="22" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="122" y="411" width="55" height="72" rx="8" fill="none" stroke="#F28B00" stroke-width="4"/><rect x="130" y="381" width="66" height="25" rx="10" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="142" y="400.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="start">A</text><r