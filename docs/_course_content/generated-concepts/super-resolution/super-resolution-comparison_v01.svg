<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Super-resolution 的相鄰方法比較圖</title>
  <desc id="desc">三種相關方法並排，比較它們的它依賴什麼 condition與會交出什麼 synthetic candidate；底部標示共同的人工 review 邊界。</desc>
