<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><marker id="a-1769E0" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1769E0"/></marker><marker id="a-00A8C6" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#00A8C6"/></marker><marker id="a-129B86" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#129B86"/></marker><marker id="a-F28B00" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#F28B00"/></marker><marker id="a-D94B62" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#D94B62"/></marker><marker id="a-F5B835" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#F5B835"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092754"/><text x="42" y="99.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#092754" text-anchor="start">第四步：Super-resolution 改善可讀性；critical detail 仍回到 optics、raw 與量測流程</text><text x="42" y="147.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">選型關鍵不是『看起來更清楚』，而是是否有對應的 HR evidence、可回查 route 和合格的使用範圍。</text><rect x="1182" y="34" width="450" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1407" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">SUPER-RESOLUTION · EVIDENCE GATE</text><clipPath id="photo-48-246"><rect x="48" y="246" width="340" height="375" rx="22"/></clipPath><g clip-path="url(#photo-48-246)"><image href="super-resolution-beginner-01-low-res-bracket_v01.png" x="48" y="246" width="340" height="375" preserveAspectRatio="xMidYMid slice"/></g><rect x="48" y="246" width="340" height="375" rx="22" fill="none" stroke="#1769E0" stroke-width="3"/><rect x="60" y="258" width="210" height="36" rx="18" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="165.0" y="284.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">low-resolution y</text><path d="M414 433 L487 433" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><rect x="516" y="228" width="428" height="410" rx="28" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="3"/><text x="730" y="278.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#12346C" text-anchor="middle">before using x-hat</text><text x="553" y="333.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#12346C" text-anchor="start">1  preserve LR raw + scale</text><text x="553" y="383.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#12346C" text-anchor="start">2  lock degradation / route</text><text x="553" y="433.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#12346C" text-anchor="start">3  test against known HR</text><text x="553" y="483.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#12346C" text-anchor="start">4  check alias + full P95</text><text x="730" y="555.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#D94B62" text-anchor="middle">any gap → HOLD / re-capture</text><path d="M970 433 L1044 433" fill="none" stroke="#F28B00" stroke-width="6" stroke-linecap="round" marker-end="url(#a-F28B00)"/><rect x="1074" y="230" width="508" height="408" rx="28" fill="#FFF7EB" stroke="#F28B00" stroke-width="3"/><text x="1328" y="281.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#7A4B00" text-anchor="middle">qualified visual assist</text><text x="1328" y="341.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#12346C" text-anchor="middle">x-hat + raw comparison</text><text x="1328" y="386.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#12346C" text-anchor="middle">known-target / alias evidence</text><text x="1328" y="431.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#12346C" text-anchor="middle">specialist REVIEW</text><path d="M1116 478 L1541 478" fill="none" stroke="#F7CD8B" stroke-width="2" stroke-linecap="round"/><text x="1328" y="526.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#D94B62" text-anchor="middle">never: new metrology or defect truth</text><text x="1328" y="563.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#D94B62" text-anchor="middle">never: automatic PASS / release</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">缺少有效像素時，優先提高 optics / sensor / capture；不要用 estimate 假裝補回量測資訊。</text></svg>