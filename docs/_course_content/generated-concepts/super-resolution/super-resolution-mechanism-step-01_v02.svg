<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">LR raw 與 scale 固定</title><desc id="desc">低解析原圖以明顯像素格表示，並標示放大倍率和退化／校準參考。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="lowres_grid" data-renderer-art="image_text_or_diffusion" data-primitive="sr_lowres_grid_contract" data-semantic-scene="sr_lowres_grid_contract" data-semantic-entities="lowres_grid|scale_lock|lr_tile" data-specialist-coverage="lowres_grid|scale_lock|lr_tile" data-semantic-relation="lock low-resolution sampling and scale before super-resolution" data-must-show="低解析 raw y 的大 pixel grid 旁標 scale factor、resize kernel、degradation、paired reference | 「LR raw 與 scale 固定」需以專屬物件與箭頭表達，不得使用通用 family motif。 | 邊界提示：低解析格中未觀測到的微細節不可被當成存在。" data-not-claim="低解析格中未觀測到的微細節不可被當成存在。"><title>LR raw 與 scale 固定</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="178.27999999999997" y1="132.44" x2="326.12" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="393.88" y1="132.44" x2="535.56" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><path d="M569.4399999999999 53.39999999999999L584.0 67.96L569.4399999999999 82.52L554.8799999999999 67.96z" fill="#FFF4CC" stroke="#C88400" stroke-width="2"/><g data-entity="lowres_grid" data-entity-label-full="LR grid"><rect x="124.57471264