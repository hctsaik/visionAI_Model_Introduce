<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">釘選 SR prior／tile 契約</title><desc id="desc">具名超解析先驗和切圖契約從低解析像素格產生高解析估計。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="scale_upsample" data-renderer-art="correspondence" data-primitive="sr_scale_upsample" data-semantic-scene="sr_scale_upsample" data-semantic-entities="lowres_grid|upsample_operator|highres_grid" data-specialist-coverage="lowres_grid|upsample_operator|highres_grid" data-semantic-relation="apply the declared upsampling prior from LR to HR grid" data-must-show="具名 CNN／transformer／diffusion prior、checkpoint、tile overlap、seed／steps 接收 LR grid | 「釘選 SR prior／tile 契約」需以專屬物件與箭頭表達，不得使用通用 family motif。 | 邊界提示：upscale path 不等於量測裝置。" data-not-claim="upscale path 不等於量測裝置。"><title>釘選 SR prior／tile 契約</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="178.27999999999997" y1="132.44" x2="326.12" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="393.88" y1="132.44" x2="535.56" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="lowres_grid" data-entity-label-full="LR grid"><rect x="124.57471264367814" y="112.61471264367816" width="17.825287356321844" height="17.825287356321844" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="144.399