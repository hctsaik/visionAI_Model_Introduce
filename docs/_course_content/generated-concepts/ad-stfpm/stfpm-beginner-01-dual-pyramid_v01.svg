="19" rx="3" fill="#00a98f" opacity=".82"/><rect x="827.6" y="600" width="15" height="19" rx="3" fill="#00a98f" opacity=".82"/><rect x="873.2" y="600" width="15" height="19" rx="3" fill="#00a98f" opacity=".82"/><rect x="918.8" y="600" width="15" height="19" rx="3" fill="#00a98f" opacity=".82"/><rect x="964.4" y="600" width="15" height="19" rx="3" fill="#00a98f" opacity=".82"/><rect x="1010.0" y="600" width="15" height="19" rx="3" fill="#00a98f" opacity=".82"/><text x="1025" y="617" text-anchor="end" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#00a98f" class="">L1</text><rect x="787.0" y="645" width="224" height="39" rx="9" fill="#cdf6eb" stroke="#00a98f" stroke-width="2"/><rect x="805.0" y="655" width="15" height="19" rx="3" fill="#00a98f" opacity=".82"/><rect x="850.5" y="655" width="15" height="19" rx="3" fill="#00a98f" opacity=".82"/><rect x="896.0" y="655" width="15" height="19" rx="3" fill="#00a98f" opacity=".82"/><rect x="941.5" y="655" width="15" height="19" rx="3" fill="#00a98f" opacity=".82"/><rect x="987.0" y="655" width="15" height="19" rx="3" fill="#00a98f" opacity=".82"/><text x="1025" y="672" text-anchor="end" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#00a98f" class="">L2</text><rect x="810.0" y="700" width="178" height="39" rx="9" fill="#b2eddd" stroke="#00a98f" stroke-width="2"/><rect x="828.0" y="710" width="15" height="19" rx="3" fill="#00a98f" opacity=".82"/><rect x="873.3333333333334" y="710" width="15" height="19" rx="3" fill="#00a98f" opacity=".82"/><rect x="918.6666666666666" y="710" width="15" height="19" rx="3" fill="#00a98f" opacity=".82"/><rect x="964.0" y="710" width="15" height="19" rx="3" fill="#00a98f" opacity=".82"/><text x="1025" y="727" text-anchor="end" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#00a98f" class="">L3</text><text x="1094" y="283" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="800" fill="#1769e0" class="">teacher state is frozen</text><text x="1094" y="552" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="800" fill="#008d78" class="">student is trained on clean normal only</text><path d="M 1075 371 L 1170 443" fill="none" stroke="#1b6ee8" stroke-width="6" stroke-linecap="round"  marker-end="url(#arrow-1b6ee8)"/><path d="M 1075 642 L 1170 490" fill="none" stroke="#00a98f" stroke-width="6" stroke-linecap="round"  marker-end="url(#arrow-00a98f)"/><rect x="1185" y="315" width="405" height="318" rx="26" fill="#ffffff" stroke="#75cdbf" stroke-width="3"/><text x="1218" y="365" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="27" font-weight="850" fill="#173b70" class="">同一組 L1 / L2 / L3</text><text x="1218" y="405" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="650" fill="#42638e"><tspan x="1218" dy="0">不是比較 raw pixels</tspan><tspan x="1218" dy="38">不是 memory bank retrieval</tspan><tspan x="1218" dy="38">不是 defect-class training</tspan></text><text x="1218" y="544" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="800" fill="#008d78" class="">將來 test ROI 會再走兩條路</text><text x="1218" y="579" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="800" fill="#008d78" class="">才看每個位置的 feature discrepancy</text><rect x="40" y="855" width="1592" height="55" rx="26" fill="#fff3cf" stroke="#f0ad25" stroke-width="2"/><path d="M 76 878 q 12 -20 24 0 q -2 20 -12 20 q -10 0 -12 -20 M 88 866 v-14 M 63 878 h-13 M 113 878 h13" fill="none" stroke="#d18a00" stroke-width="3" stroke-linecap="round"/><text x="124" y="889" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="800" fill="#885c00" class="">STFPM 的 normality 是「student 能否模仿 frozen teacher 的正常 feature pyramid」；不是直接給產品 PASS / FAIL。</text>
