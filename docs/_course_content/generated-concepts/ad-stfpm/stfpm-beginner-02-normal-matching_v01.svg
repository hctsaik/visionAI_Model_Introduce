  <rect width="1672" height="941" fill="#f7fbff"/><rect width="1672" height="10" fill="#102c58"/><rect x="40" y="33" width="402" height="38" rx="19" fill="#1769e0" opacity=".12"/><text x="60" y="58" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#1769e0" class="">normal-only training</text><text x="40" y="126" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="39" font-weight="850" fill="#092d61" class="">只用 clean normal，讓 student 在每一層模仿 teacher</text><text x="40" y="168" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="600" fill="#4d6e9d" class="">訓練時沒有 defect mask：每張 support 都走同一 recipe，逐位置把 normalized feature 向量對齊。</text><rect x="1372" y="35" width="260" height="48" rx="24" fill="#ffffff" stroke="#98beff" stroke-width="2"/><text x="1502" y="67" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="850" fill="#1769e0" class="">STFPM</text><text x="52" y="225" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="800" fill="#173b70" class="">同一治具的 clean normal support（不同批次、亮度或紋理變化仍要在 qualification 範圍內）</text><clipPath id="support-a-clip"><rect x="58" y="254" width="295" height="250" rx="22"/></clipPath><g clip-path="url(#support-a-clip)"><svg x="58" y="254" width="295" height="250" viewBox="180 105 1250 700" preserveAspectRatio="xMidYMid slice"><image href="stfpm-industrial-aoi-anchor_v02.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/></svg></g><rect x="58" y="254" width="295" height="250" rx="22" fill="none" stroke="#1769e0" stroke-width="3"/><rect x="76" y="269" width="204" height="38" rx="19" fill="#1769e0" opacity=".12"/><text x="96" y="294" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#1769e0" class="">support A</text><clipPath id="support-b-clip"><rect x="378" y="254" width="295" height="250" rx="22"/></clipPath><g clip-path="url(#support-b-clip)"><svg x="378" y="254" width="295" height="250" viewBox="180 105 1250 700" preserveAspectRatio="xMidYMid slice"><image href="stfpm-industrial-aoi-anchor_v02.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/></svg></g><rect x="378" y="254" width="295" height="250" rx="22" fill="none" stroke="#1769e0" stroke-width="3"/><rect x="396" y="269" width="204" height="38" rx="19" fill="#1769e0" opacity=".12"/><text x="416" y="294" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#1769e0" class="">support B</text><clipPath id="support-c-clip"><rect x="698" y="254" width="295" height="250" rx="22"/></clipPath><g clip-path="url(#support-c-clip)"><svg x="698" y="254" width="295" height="250" viewBox="180 105 1250 700" preserveAspectRatio="xMidYMid slice"><image href="stfpm-industrial-aoi-anchor_v02.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/></svg></g><rect x="698" y="254" width="295" height="250" rx="22" fill="none" stroke="#1769e0" stroke-width="3"/><rect x="716" y="269" width="204" height="38" rx="19" fill="#1769e0" opacity=".12"/><text x="736" y="294" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#1769e0" class="">support C</text><text x="525" y="536" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="700" fill="#58729b" class="">clean normal IDs / split / augmentation are versioned</text><path d="M 1010 379 L 1072 379" fill="none" stroke="#1b6ee8" stroke-width="6" stroke-linecap="round"  marker-end="url(#arrow-1b6ee8)"/><rect x="1082" y="229" width="510" height="306" rx="28" fill="#ffffff" stroke="#8db9ff" stroke-width="3"/><text x="1122" y="280" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="26" font-weight="850" fill="#173b70" class="">同一張 normal ROI 的 layer-wise matching</text><text x="1122" y="321" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="650" fill="#42638e" class="">每一個位置先 L2 normalize feature vector</text><rect x="1126" y="355" width="184" height="92" rx="16" fill="#edf5ff" stroke="#1769e0" stroke-width="2"/><text x="1218" y="392" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="850" fill="#1769e0" class="">teacher Tℓ</text><text x="1218" y="421" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="700" fill="#1769e0" class="">frozen</text><rect x="1363" y="355" width="184" height="92" rx="16" fill="#effbf8" stroke="#00a98f" stroke-width="2"/><text x="1455" y="392" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="850" fill="#008d78" class="">student Sℓ</text><text x="1455" y="421" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="700" fill="#008d78" class="">trainable</text><path d="M 1316 401 L 1354 401" fill="none" stroke="#1b6ee8" stroke-width="6" stroke-linecap="round"  marker-end="url(#arrow-1b6ee8)"/><rect x="96" y="595" width="810" height="184" rx="26" fill="#ffffff" stroke="#77cbbb" stroke-width="3"/><text x="136" y="645" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="28" font-weight="850" fill="#173b70" class="">每一層的 normal matching loss</text><text x="136" y="687" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="31" font-weight="800" fill="#008d78" class="">Σℓ  || normalize(Tℓ) − normalize(Sℓ) ||²</text><text x="136" y="733" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="650" fill="#42638e" class="">loss / layer weights / optimizer / seed / checkpoint selection 都是 operating contract</text><path d="M 925 687 L 1050 687" fill="none" stroke="#00a98f" stroke-width="6" stroke-linecap="round"  marker-end="url(#arrow-00a98f)"/><rect x="1067" y="590" width="525" height="189" rx="26" fill="#fbfffe" stroke="#75cdbf" stroke-width="3"/><text x="1105" y="642" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="28" font-weight="850" fill="#008d78" class="">versioned student checkpoint</text><text x="1105" y="682" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="650" fill="#42638e"><tspan x="1105" dy="0">正常資料的 feature imitation 能力</tspan><tspan x="1105" dy="32">不是 defect segmentation label</tspan><tspan x="1105" dy="32">不是 raw image reconstruction</tspan></text><rect x="40" y="855" width="1592" height="55" rx="26" fill="#fff3cf" stroke="#f0ad25" stroke-width="2"/><path d="M 76 878 q 12 -20 24 0 q -2 20 -12 20 q -10 0 -12 -20 M 88 866 v-14 M 63 878 h-13 M 113 878 h13" fill="none" stroke="#d18a00" stroke-width="3" stroke-linecap="round"/><text x="124" y="889" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="800" fill="#885c00" class="">support contamination、coverage、teacher domain fit 或 student training instability 都會改寫「正常 matching」；不確定時先 HOLD。</text>
</svg>
