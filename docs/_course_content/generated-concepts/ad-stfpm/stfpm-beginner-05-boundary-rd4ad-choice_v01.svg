ont-size="18" font-weight="750" fill="#1769e0" class="">same physical positions</text><path d="M 565 391 L 653 391" fill="none" stroke="#1b6ee8" stroke-width="6" stroke-linecap="round"  marker-end="url(#arrow-1b6ee8)"/><clipPath id="drifted-clip"><rect x="671" y="250" width="500" height="286" rx="22"/></clipPath><g clip-path="url(#drifted-clip)"><svg x="671" y="250" width="500" height="286" viewBox="120 115 1430 680" preserveAspectRatio="xMidYMid slice"><image href="stfpm-industrial-aoi-anchor_v02.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/></svg></g><rect x="671" y="250" width="500" height="286" rx="22" fill="none" stroke="#e04c62" stroke-width="3"/><rect x="689" y="265" width="312" height="38" rx="19" fill="#e04c62" opacity=".12"/><text x="709" y="290" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#e04c62" class="">only ROI shifts</text><rect x="790" y="351" width="278" height="150" rx="14" fill="#e04c62" opacity=".13"/><rect x="822" y="372" width="44" height="44" rx="4" fill="rgba(255,255,255,.06)" stroke="#e04c62" stroke-width="2"/><rect x="870" y="372" width="44" height="44" rx="4" fill="rgba(255,255,255,.06)" stroke="#e04c62" stroke-width="2"/><rect x="918" y="372" width="44" height="44" rx="4" fill="rgba(255,255,255,.06)" stroke="#e04c62" stroke-width="2"/><rect x="966" y="372" width="44" height="44" rx="4" fill="rgba(255,255,255,.06)" stroke="#e04c62" stroke-width="2"/><rect x="1014" y="372" width="44" height="44" rx="4" fill="rgba(255,255,255,.06)" stroke="#e04c62" stroke-width="2"/><rect x="822" y="420" width="44" height="44" rx="4" fill="rgba(255,255,255,.06)" stroke="#e04c62" stroke-width="2"/><rect x="870" y="420" width="44" height="44" rx="4" fill="rgba(255,255,255,.06)" stroke="#e04c62" stroke-width="2"/><rect x="918" y="420" width="44" height="44" rx="4" fill="#fef0df" stroke="#f48112" stroke-width="3"/><rect x="966" y="420" width="44" height="44" rx="4" fill="rgba(255,255,255,.06)" stroke="#e04c62" stroke-width="2"/><rect x="1014" y="420" width="44" height="44" rx="4" fill="rgba(255,255,255,.06)" stroke="#e04c62" stroke-width="2"/><rect x="822" y="468" width="44" height="44" rx="4" fill="rgba(255,255,255,.06)" stroke="#e04c62" stroke-width="2"/><rect x="870" y="468" width="44" height="44" rx="4" fill="rgba(255,255,255,.06)" stroke="#e04c62" stroke-width="2"/><rect x="918" y="468" width="44" height="44" rx="4" fill="rgba(255,255,255,.06)" stroke="#e04c62" stroke-width="2"/><rect x="966" y="468" width="44" height="44" rx="4" fill="rgba(255,255,255,.06)" stroke="#e04c62" stroke-width="2"/><rect x="1014" y="468" width="44" height="44" rx="4" fill="rgba(255,255,255,.06)" stroke="#e04c62" stroke-width="2"/><text x="921" y="510" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="750" fill="#cf3851" class="">grid no longer names the same structure</text><path d="M 1186 391 L 1270 391" fill="none" stroke="#e04c62" stroke-width="6" stroke-linecap="round"  marker-end="url(#arrow-e04c62)"/><rect x="1284" y="271" width="322" height="240" rx="24" fill="#fff8f8" stroke="#e04c62" stroke-width="3"/><text x="1445" y="320" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="24" font-weight="850" fill="#cf3851" class="">large candidate area</text><text x="1445" y="361" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="700" fill="#cf3851"><tspan x="1445" dy="0">same product can look abnormal</tspan><tspan x="1445" dy="30">HOLD → re-register / audit capture</tspan><tspan x="1445" dy="30">do not loosen fusion or threshold</tspan></text><text x="50" y="608" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="850" fill="#173b70" class="">B. 前提已證明時，選的是 normality representation，不是誰「比較準」</text><rect x="52" y="640" width="744" height="168" rx="25" fill="#f8fbff" stroke="#1769e0" stroke-width="3"/><text x="87" y="683" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="28" font-weight="850" fill="#1769e0" class="">STFPM</text><text x="87" y="719" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="750" fill="#173b70" class="">frozen teacher  ║  normal-fit student</text><path d="M 438 712 L 512 712" fill="none" stroke="#1b6ee8" stroke-width="6" stroke-linecap="round"  marker-end="url(#arrow-1b6ee8)"/><text x="532" y="719" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#1769e0" class="">multi-scale discrepancy</text><text x="87" y="766" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="650" fill="#58729b" class="">直接比同層 teacher / student 的 normalized response</text><rect x="836" y="640" width="776" height="168" rx="25" fill="#f7fffd" stroke="#00a98f" stroke-width="3"/><text x="872" y="683" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="28" font-weight="850" fill="#008d78" class="">RD4AD</text><text x="872" y="719" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="750" fill="#173b70" class="">teacher feature → one-class bottleneck → reverse decoder</text><text x="872" y="758" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="800" fill="#008d78" class="">reconstructed-feature discrepancy</text><text x="872" y="786" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="650" fill="#58729b" class="">比較前仍固定 ROI / support / teacher / P95 / evidence review</text><rect x="40" y="855" width="1592" height="55" rx="26" fill="#fff3cf" stroke="#f0ad25" stroke-width="2"/><path d="M 76 878 q 12 -20 24 0 q -2 20 -12 20 q -10 0 -12 -20 M 88 866 v-14 M 63 878 h-13 M 113 878 h13" fill="none" stroke="#d18a00" stroke-width="3" stroke-linecap="round"/><text x="124" y="889" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="800" fill="#885c00" class="">若 normal support coverage、teacher domain fit、ROI / illumination 或 student stability 未被驗證，先 HOLD；不要用單一熱圖或 AUROC 選型。</text>
