  <title id="title">整片亮起時，先確認 input contract；再選 STFPM 或 RD4AD 的表示</title>
  <desc id="desc">同一清潔工作件只因 ROI 位移便引起廣泛 candidate，並比較 STFPM 的 feature matching 與 RD4AD 的 bottleneck reverse-decoder 路徑。</desc>
