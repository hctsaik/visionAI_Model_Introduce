<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">彙整 tile logits 再 review</title><desc id="desc">ConvNeXt 的 tile/image logits 必須經 tile aggregation、calibration 和 OOD policy 才能交付候選。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="tile_aggregation_review" data-renderer-art="classifier_or_mask" data-primitive="tile_logit_aggregation" data-semantic-scene="tile_logit_aggregation" data-semantic-entities="tile_logits|aggregate_score|review_gate" data-specialist-coverage="tile_logits|aggregate_score|review_gate" data-semantic-relation="aggregate tiles before a bounded review" data-must-show="多個 tile logits 經 aggregation 變成整圖候選 | 接 calibration/OOD gate | ConvNeXt 的 tile/image logits 必須經 tile aggregation" data-not-claim="單次 forward 不代表完整的量產決策。"><title>彙整 tile logits 再 review</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="178.27999999999997" y1="132.44" x2="326.12" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="393.88" y1="132.44" x2="535.56" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="tile_logits" data-entity-label-full="tile logits"><rect x="108.99770114942527" y="106.9503448275862" width="70.80459770114943" height="48.14712643678162" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><p