ill="#09A8C8" text-anchor="middle">large-kernel depthwise conv</text><text x="315" y="707.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="850" fill="#09A8C8" text-anchor="middle">在位置間混合</text><path d="M592 490 L677 490" fill="none" stroke="#1769E0" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="700" y="230" width="420" height="520" rx="28" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="910" y="288.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">2. 同一位置的 channel 組合</text><rect x="792" y="365" width="236" height="38" rx="12" fill="#1769E0"/><rect x="792" y="424" width="236" height="38" rx="12" fill="#09A8C8"/><rect x="792" y="483" width="236" height="38" rx="12" fill="#7AB0EF"/><rect x="792" y="542" width="236" height="38" rx="12" fill="#F38B00"/><text x="910" y="648.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="850" fill="#1769E0" text-anchor="middle">LayerNorm → 1×1 expansion</text><text x="910" y="680.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="850" fill="#1769E0" text-anchor="middle">GELU → 1×1 projection</text><path d="M1142 490 L1225 490" fill="none" stroke="#1769E0" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="1247" y="230" width="365" height="520" rx="28" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1429" y="288.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">3. residual merge</text><rect x="1310" y="380" width="116" height="83" rx="18" fill="#EAF4FF" stroke="#09A8C8" stroke-width="2"/><text x="1368" y="430.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">F(x)</text><path d="M1298 535 C1330 650, 1470 650, 1512 520" fill="none" stroke="#1769E0" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><circle cx="1518" cy="492" r="35" fill="#E8F8F0" stroke="#159A63" stroke-width="4"/><text x="1518" y="504.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="38" font-weight="900" fill="#159A63" text-anchor="middle">+</text><text x="1429" y="615.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="850" fill="#159A63" text-anchor="middle">F(x) + x</text><text x="1429" y="647.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="850" fill="#159A63" text-anchor="middle">讓訊息與梯度可保留</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#674500" text-anchor="middle">重點：ConvNeXt 的特徵路徑可被說清：spatial mixing → channel mixing → residual merge。</text></svg>