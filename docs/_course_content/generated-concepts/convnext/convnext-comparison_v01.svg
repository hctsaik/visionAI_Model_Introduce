-serif" font-size="17.5" font-weight="650" fill="#0B2858">未知檢出、box 或 mask</text><rect x="1117" y="260" width="478" height="500" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><rect x="1117" y="260" width="478" height="68" rx="24" fill="#F38B00"/><rect x="1117" y="304" width="478" height="24" fill="#F38B00"/><text x="1145" y="304.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">ViT</text><g data-visual-cue="vit_patch_tokens" data-renderer-art="patch_features" data-primitive="patch_feature_extraction" data-semantic-scene="patch_feature_extraction" data-semantic-entities="roi|patch_grid|feature_vectors" data-specialist-coverage="roi|patch_grid|feature_vectors" data-semantic-relation="convert patches into reusable feature vectors" data-must-show="ViT：依據：patch size、token position、pretraining 與 known-class label contract | candidate output: 可用輸出：class token/pooling logits；attention 不等於局部證據 | Same input, ROI, preprocess, truth, and evidence gate; do not switch the comparison contract." data-not-claim="ViT output is a candidate, not verified field truth; still use the evidence gate."><title>ViT：依據：patch size、token position、pretraining 與 known-class label contract</title><rect x="1145" y="346" width="422" height="112" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="patch-to-feature-vectors"><rect x="1204.8" y="381.5" width="9.48" height="9.48" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="1216.28" y="381.5" width="9.48" height="9.48" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="1227.76" y="381.5" width="9.48" height="9.48" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="1204.8" y="392.98" width="9.48" height="9.48" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="1216.28" y="392.98" width="9.48" height="9.48" rx="2" fill="#F38B00" stroke="#