  <rect x="40" y="32" width="150" height="32" rx="16" fill="#E6F0FF"/><text x="58" y="54.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="16" font-weight="800" fill="#1769E0">相鄰方法比較</text><text x="40" y="116" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="43" font-weight="900" fill="#071A3B">比輸入表示與候選輸出</text><text x="40" y="182" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="500" fill="#50698F">分類、分割與姿態方法可能讀同一張影像，卻把它轉成不同層級的 class、mask 或座標候選。</text><text x="1630" y="57.0" text-anchor="end" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#5C7395">ConvNeXt</text><rect x="77" y="260" width="478" height="500" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><rect x="77" y="260" width="478" height="68" rx="24" fill="#1769E0"/><rect x="77" y="304" width="478" height="24" fill="#1769E0"/><text x="105" y="304.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">ConvNeXt</text><g data-visual-cue="convnext_depthwise_block" data-renderer-art="classifier_or_mask" data-primitive="depthwise_channel_mix" data-semantic-scene="depthwise_channel_mix" data-semantic-entities="spatial_kernel|channels|mixed_features" data-specialist-coverage="spatial_kernel|channels|mixed_features" data-semantic-relation="filter locally then mix channels" data-must-show="ConvNeXt：依據：固定 ROI/labels 上的階層 ConvNet feature，含 large-kernel spatial 與 channel mixing | candidate output: 可用輸出：tile/image-level closed-set logits，經 aggregation/calibration/OOD policy 解讀 | Same input, ROI, preprocess, truth, and evidence gate; do not switch the comparison contract." data-not-claim="ConvNeXt output is a candidate, not verified field truth; still use the evidence gate."><title>ConvNeXt：依據：固定 ROI/labels 上的階層 ConvNet feature，含 large-kernel spatial 與 channel mixing</title><rect x="105" y="346" width="422" height="112" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="204.48999999999998" y1="396.26" x2="295.21" y2="396.26" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="336.79" y1="396.26" x2="423.72999999999996" y2="396.26" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="spatial_kernel" data-entity-label-full="spatial"><path d="M183.7 384.55039999999997L194.03199999999998 390.7496L194.03199999999998 401.7704L183.7 407.9696L173.368 401.7704L173.368 390.7496z" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><text data-label-line="true" x="183.7" y="417.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">spatial</text></g><g data-entity="channels" data-entity-label-full="channels"><path d="M316.0 384.55039999999997L326.332 390.7496L326.332 401.7704L316.0 407.9696L305.668 401.7704L305.668 390.7496z" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="3"/><text data-label-line="true" x="316.0" y="417.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">channels</text></g><g data-entity="mixed_features" data-entity-label-full="mix"><rect x="432.6382" y="384.3782" width="5.9212" height="5.9212" rx="2" fill="#DCEBFF" stroke="#F38B00" stroke-width="1"/><rect x="440.5594" y="384.3782" width="5.9212" height="5.9212" rx="2" fill="#DCEBFF" stroke="#F38B00" stroke-width="1"/><rect x="448.4806" y="384.3782" width="5.9212" height="5.9212" rx="2" fill="#DCEBFF" stroke="#F38B00" stroke-width="1"/><rect x="432.6382" y="392.2994" width="5.9212" height="5.9212" rx="2" fill="#DCEBFF" stroke="#F38B00" stroke-width="1"/><rect x="440.5594"