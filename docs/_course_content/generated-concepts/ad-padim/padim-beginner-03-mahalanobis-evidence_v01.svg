<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">PaDiM：covariance-aware Mahalanobis evidence</title><desc id="desc">Mahalanobis distance 考慮同一位置 normal feature cloud 的方向與寬度；位置分數再以版本化規則形成 map 與 image candidate score。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D9485F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0B2858"/><rect x="40" y="34" width="148" height="38" rx="19" fill="#E8F2FF" stroke="#E8F2FF" stroke-width="0"/><text x="114.0" y="59.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">距離與證據</text><text x="40" y="125.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="39" font-weight="900" fill="#081A38" text-anchor="start">Mahalanobis 不只量『離中心多遠』，還看『沿哪個正常方向離開』</text><text x="40" y="171.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="500" fill="#536A91" text-anchor="start">同一位置 p 的 covariance 會改變距離；之後才把位置分數回放成 map 與整圖 candidate score。</text><rect x="1320" y="36" width="312" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1476" y="68.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="800" fill="#1769E0" text-anchor="middle">PaDiM</text><text x="64" y="248.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="26" font-weight="900" fill="#0B2858" text-anchor="start">同一個位置 p 的 feature cloud</text><rect x="64" y="282" width="318" height="204" rx="20" fill="#F8FBFF" stroke="#D3E4FF" stroke-width="1"/><ellipse cx="222" cy="386" rx="94" ry="54" fill="#E7F1FF" stroke="#1769E0" stroke-width="3" transform="rotate(-20 222 386)"/><circle cx="140" cy="398" r="6" fill="#5A97EF"/><circle cx="161" cy="365" r="6" fill="#5A97EF"/><circle cx="175" cy="409" r="6" fill="#5A97EF"/><circle cx="194" cy="376" r="6" fill="#5A97EF"/><circle cx="210" cy="394" r="6" fill="#5A97EF"/><circle cx="231" cy="354" r="6" fill="#5A97EF"/><circle cx="242" cy="407" r="6" fill="#5A97EF"/><circle cx="260" cy="373" r="6" fill="#5A97EF"/><circle cx="280" cy="396" r="6" fill="#5A97EF"/><circle cx="296" cy="362" r="6" fill="#5A97EF"/><path d="M210 386 L234 386 M222 374 L222 398" stroke="#0B2858" stroke-width="3"/><text x="222" y="468.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#0B2858" text-anchor="middle">μₚ  +  Σₚ</text><circle cx="258" cy="334" r="10" fill="#1769E0"/><path d="M258 334 L216 366" stroke="#1769E0" stroke-width="4" stroke-dasharray="8 7"/><text x="228" y="524.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">沿寬方向：看似遠，</text><text x="228" y="547.04" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">仍可能是低距離</text><circle cx="394" cy="306" r="10" fill="#F38B00"/><path d="M394 306 L275 367" stroke="#F38B00" stroke-width="4" stroke-dasharray="8 7"/><text x="398" y="524.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#F38B00" text-anchor="middle">沿窄方向：看似近，</text><text x="398" y="547.04" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#F38B00" text-anchor="middle">仍可能是高距離</text><text x="222" y="580.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="middle">這是 feature space 的統計距離</text><text x="222" y="604.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="middle">不是影像上的幾何距離。</text><path d="M412 384 L610 384" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><text x="770" y="248.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="26" font-weight="900" fill="#0B2858" text-anchor="middle">同位置 Mahalanobis distance grid</text><clipPath id="crop-mahal-plate-566-286-884-92"><rect x="566" y="286" width="392" height="302" rx="22"/></clipPath><g clip-path="url(#crop-mahal-plate-566-286-884-92)"><svg x="566" y="286" width="392" height="302" viewBox="884 92 670 540" preserveAspectRatio="xMidYMid slice"><image href="padim-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="566" y="286" width="392" height="302" rx="22" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="612.0" y="414.0" width="67.5" height="60.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="682.5" y="414.0" width="67.5" height="60.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="753.0" y="414.0" width="67.5" height="60.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="823.5" y="414.0" width="67.5" height="60.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="612.0" y="477.0" width="67.5" height="60.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="682.5" y="477.0" width="67.5" height="60.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="753.0" y="477.0" width="67.5" height="60.0" rx="3" fill="#F38B00" fill-opacity="0.22" stroke="#F38B00" stroke-width="2"/><rect x="823.5" y="477.0" width="67.5" height="60.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><text x="762" y="625.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="800" fill="#0B2858" text-anchor="middle">每一格只對自己的 μₚ、Σₚ 計算 distance</text><path d="M968 388 L1080 324" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><path d="M968 478 L1080 644" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="1100" y="242" width="478" height="198" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1134" y="286.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="23" font-weight="900" fill="#0B2858" text-anchor="start">A．image candidate score</text><rect x="1160" y="380" width="25" height="30" rx="6" fill="#9FC4FF"/><rect x="1200" y="367" width="25" height="43" rx="6" fill="#9FC4FF"/><rect x="1240" y="354" width="25" height="56" rx="6" fill="#9FC4FF"/><rect x="1280" y="338" width="25" height="72" rx="6" fill="#9FC4FF"/><rect x="1320" y="315" width="25" height="95" rx="6" fill="#F38B00"/><rect x="1360" y="294" width="25" height="116" rx="6" fill="#F38B00"/><text x="1264" y="426.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">鎖定 aggregation</text><text x="1470" y="352.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="900" fill="#F38B00" text-anchor="middle">排序／門檻</text><text x="1470" y="383.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#D9485F" text-anchor="middle">不是 defect probability</text><rect x="1100" y="510" width="478" height="242" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1134" y="554.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="23" font-weight="900" fill="#0B2858" text-anchor="start">B．localization candidate map</text><clipPath id="crop-map-1140-586-884-260"><rect x="1140" y="586" width="206" height="112" rx="15"/></clipPath><g clip-path="url(#crop-map-1140-586-884-260)"><svg x="1140" y="586" width="206" height="112" viewBox="884 260 670 370" preserveAspectRatio="xMidYMid slice"><image href="padim-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="1140" y="586" width="206" height="112" rx="15" fill="none" stroke="#00A8C6" stroke-width="2"/><rect x="1164.0" y="612.0" width="36.5" height="28.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="1203.5" y="612.0" width="36.5" height="28.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="1243.0" y="612.0" width="36.5" height="28.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="1282.5" y="612.0" width="36.5" height="28.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="1164.0" y="643.0" width="36.5" height="28.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="1203.5" y="643.0" width="36.5" height="28.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="1243.0" y="643.0" width="36.5" height="28.0" rx="3" fill="#F38B00" fill-opacity="0.22" stroke="#F38B00" stroke-width="2"/><rect x="1282.5" y="643.0" width="36.5" height="28.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><path d="M1355 642 L1450 642" fill="none" stroke="#00A8C6" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><text x="1510" y="616" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#0079A8" text-anchor="middle">回看</text><text x="1510" y="642" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#0079A8" text-anchor="middle">raw ROI</text><text x="1510" y="688.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#F38B00" text-anchor="middle">map ≠ native-pixel truth</text><rect x="40" y="849" width="1592" height="52" rx="22" fill="#FFF4CC" stroke="#F1B828" stroke-width="2"/><circle cx="78" cy="873" r="10" fill="none" stroke="#C58A00" stroke-width="2"/><path d="M72 883 L75 890 L81 890 L84 883" fill="none" stroke="#C58A00" stroke-width="2" stroke-linecap="round"/><path d="M64 873 L58 873 M92 873 L98 873 M67 862 L62 857 M89 862 L94 857" fill="none" stroke="#C58A00" stroke-width="2" stroke-linecap="round"/><text x="108" y="883.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="start">Mahalanobis map 是位置條件化的 feature-grid evidence；score 與 map 都必須隨 covariance／aggregation recipe 一起版本化。</text></svg>