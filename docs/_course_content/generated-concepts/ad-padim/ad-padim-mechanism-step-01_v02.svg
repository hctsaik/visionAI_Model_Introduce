<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">每張圖先對齊同一格</title><desc id="desc">PaDiM 讓多張正常 ROI 對齊同一格點語言，每個固定位置才有可比較的 embedding。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="input_roi_padim_position_alignment" data-renderer-art="input_roi" data-primitive="padim_position_alignment" data-semantic-scene="padim_position_alignment" data-semantic-entities="registered_roi|same_position_patch|position_index" data-specialist-coverage="registered_roi|same_position_patch|position_index" data-semantic-relation="compare each patch only at the same registered position" data-must-show="多張 clean normal ROI | 固定孔洞等 landmark | 相同 grid position p | CNN/selected layers/feature concatenate 路徑" data-not-claim="PaDiM 可忽略 ROI、registration 或位置定義。"><title>每張圖先對齊同一格</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="165.95999999999998" y1="101.24000000000001" x2="532.4799999999999" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="381.56" y1="159.48000000000002" x2="532.4799999999999" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="registered_roi" data-entity-label-full="對齊 ROI"><rect x="108.99770114942527" y="75.75034482758622" width="70.80459770114943" height="48.14712643678162" rx="8" fill="#EAF3FF" stroke="#176