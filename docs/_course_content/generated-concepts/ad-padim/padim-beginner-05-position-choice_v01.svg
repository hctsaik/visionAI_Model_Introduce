<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">PaDiM：position Gaussian 的選型邊界</title><desc id="desc">PaDiM 的 same-position Gaussian normality 與 PatchCore 的 global exemplar memory 不同；位置漂移與多峰 normality 必須分流或重新 qualification。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D9485F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0B2858"/><rect x="40" y="34" width="148" height="38" rx="19" fill="#E8F2FF" stroke="#E8F2FF" stroke-width="0"/><text x="114.0" y="59.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">選型邊界</text><text x="40" y="125.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="39" font-weight="900" fill="#081A38" text-anchor="start">PaDiM 與 PatchCore 都產生 candidate，但 normality 的表示方式不同</text><text x="40" y="171.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="500" fill="#536A91" text-anchor="start">PaDiM 問『同一位置 p 是否仍在自己的分布內』；PatchCore 問『整個 retained bank 有沒有近鄰』。</text><rect x="1320" y="36" width="312" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1476" y="68.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="800" fill="#1769E0" text-anchor="middle">PaDiM</text><rect x="40" y="230" width="770" height="370" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><rect x="862" y="230" width="770" height="370" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="78" y="278.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="26" font-weight="900" fill="#0B2858" text-anchor="start">PaDiM：只與同一個對齊位置 p 的 μₚ、Σₚ 比</text><clipPath id="crop-choice-padim-84-318-884-92"><rect x="84" y="318" width="224" height="208" rx="18"/></clipPath><g clip-path="url(#crop-choice-padim-84-318-884-92)"><svg x="84" y="318" width="224" height="208" viewBox="884 92 670 540" preserveAspectRatio="xMidYMid slice"><image href="padim-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="84" y="318" width="224" height="208" rx="18" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="132.0" y="394.0" width="39.666666666666664" height="33.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="174.66666666666666" y="394.0" width="39.666666666666664" height="33.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="217.33333333333331" y="394.0" width="39.666666666666664" height="33.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="132.0" y="430.0" width="39.666666666666664" height="33.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="174.66666666666666" y="430.0" width="39.666666666666664" height="33.0" rx="3" fill="#F38B00" fill-opacity="0.22" stroke="#F38B00" stroke-width="2"/><rect x="217.33333333333331" y="430.0" width="39.666666666666664" height="33.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><path d="M320 422 L420 422" fill="none" stroke="#1769E0" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="444" y="321" width="318" height="204" rx="20" fill="#F8FBFF" stroke="#D3E4FF" stroke-width="1"/><ellipse cx="602" cy="425" rx="94" ry="54" fill="#E7F1FF" stroke="#1769E0" stroke-width="3" transform="rotate(-20 602 425)"/><circle cx="520" cy="437" r="6" fill="#5A97EF"/><circle cx="541" cy="404" r="6" fill="#5A97EF"/><circle cx="555" cy="448" r="6" fill="#5A97EF"/><circle cx="574" cy="415" r="6" fill="#5A97EF"/><circle cx="590" cy="433" r="6" fill="#5A97EF"/><circle cx="611" cy="393" r="6" fill="#5A97EF"/><circle cx="622" cy="446" r="6" fill="#5A97EF"/><circle cx="640" cy="412" r="6" fill="#5A97EF"/><circle cx="660" cy="435" r="6" fill="#5A97EF"/><circle cx="676" cy="401" r="6" fill="#5A97EF"/><path d="M590 425 L614 425 M602 413 L602 437" stroke="#0B2858" stroke-width="3"/><text x="602" y="507.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#0B2858" text-anchor="middle">μₚ  +  Σₚ</text><circle cx="710" cy="360" r="10" fill="#F38B00"/><path d="M710 360 L641 420" stroke="#F38B00" stroke-width="4" stroke-dasharray="8 7"/><text x="580" y="540.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">same-position Mahalanobis</text><text x="580" y="563.04" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">distance 大 → candidate</text><text x="422" y="590.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="start">位置漂移時，先修對齊；不要假裝它是同一個 p。</text><text x="900" y="278.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="26" font-weight="900" fill="#0B2858" text-anchor="start">PatchCore：整個 retained bank 裡有近鄰嗎？</text><clipPath id="crop-choice-patch-906-318-884-92"><rect x="906" y="318" width="180" height="208" rx="18"/></clipPath><g clip-path="url(#crop-choice-patch-906-318-884-92)"><svg x="906" y="318" width="180" height="208" viewBox="884 92 670 540" preserveAspectRatio="xMidYMid slice"><image href="padim-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="906" y="318" width="180" height="208" rx="18" fill="none" stroke="#F38B00" stroke-width="2"/><rect x="972" y="398" width="64" height="62" rx="8" fill="none" stroke="#F38B00" stroke-width="4"/><path d="M1098 422 L1194 422" fill="none" stroke="#F38B00" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-F38B00)" stroke-dasharray="9 8"/><rect x="1224" y="354" width="202" height="132" rx="16" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><clipPath id="crop-bank-1224-0-0-1240-386-80-92"><rect x="1240" y="386" width="49" height="36" rx="6"/></clipPath><g clip-path="url(#crop-bank-1224-0-0-1240-386-80-92)"><svg x="1240" y="386" width="49" height="36" viewBox="80 92 250 180" preserveAspectRatio="xMidYMid slice"><image href="padim-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="1240" y="386" width="49" height="36" rx="6" fill="none" stroke="#1769E0" stroke-width="2"/><clipPath id="crop-bank-1224-0-1-1300-386-80-92"><rect x="1300" y="386" width="49" height="36" rx="6"/></clipPath><g clip-path="url(#crop-bank-1224-0-1-1300-386-80-92)"><svg x="1300" y="386" width="49" height="36" viewBox="80 92 250 180" preserveAspectRatio="xMidYMid slice"><image href="padim-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="1300" y="386" width="49" height="36" rx="6" fill="none" stroke="#1769E0" stroke-width="2"/><clipPath id="crop-bank-1224-0-2-1360-386-80-92"><rect x="1360" y="386" width="49" height="36" rx="6"/></clipPath><g clip-path="url(#crop-bank-1224-0-2-1360-386-80-92)"><svg x="1360" y="386" width="49" height="36" viewBox="80 92 250 180" preserveAspectRatio="xMidYMid slice"><image href="padim-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="1360" y="386" width="49" height="36" rx="6" fill="none" stroke="#1769E0" stroke-width="2"/><clipPath id="crop-bank-1224-1-0-1240-431-80-182"><rect x="1240" y="431" width="49" height="36" rx="6"/></clipPath><g clip-path="url(#crop-bank-1224-1-0-1240-431-80-182)"><svg x="1240" y="431" width="49" height="36" viewBox="80 182 250 180" preserveAspectRatio="xMidYMid slice"><image href="padim-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="1240" y="431" width="49" height="36" rx="6" fill="none" stroke="#1769E0" stroke-width="2"/><clipPath id="crop-bank-1224-1-1-1300-431-80-182"><rect x="1300" y="431" width="49" height="36" rx="6"/></clipPath><g clip-path="url(#crop-bank-1224-1-1-1300-431-80-182)"><svg x="1300" y="431" width="49" height="36" viewBox="80 182 250 180" preserveAspectRatio="xMidYMid slice"><image href="padim-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="1300" y="431" width="49" height="36" rx="6" fill="none" stroke="#1769E0" stroke-width="2"/><clipPath id="crop-bank-1224-1-2-1360-431-80-182"><rect x="1360" y="431" width="49" height="36" rx="6"/></clipPath><g clip-path="url(#crop-bank-1224-1-2-1360-431-80-182)"><svg x="1360" y="431" width="49" height="36" viewBox="80 182 250 180" preserveAspectRatio="xMidYMid slice"><image href="padim-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="1360" y="431" width="49" height="36" rx="6" fill="none" stroke="#1769E0" stroke-width="2"/><text x="1325" y="540.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">nearest normal exemplar 的</text><text x="1325" y="563.04" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">feature distance 大 → candidate</text><text x="1175" y="590.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="start">exemplar 可跨物理位置；它不是每格一個 Gaussian。</text><text x="56" y="650.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="25" font-weight="900" fill="#0B2858" text-anchor="start">PaDiM 的前提不成立時，先 HOLD／分群／修量測，再談 candidate</text><rect x="40" y="684" width="760" height="126" rx="20" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><clipPath id="crop-noalign-68-704-80-92"><rect x="68" y="704" width="188" height="84" rx="14"/></clipPath><g clip-path="url(#crop-noalign-68-704-80-92)"><svg x="68" y="704" width="188" height="84" viewBox="80 92 670 540" preserveAspectRatio="xMidYMid slice"><image href="padim-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="68" y="704" width="188" height="84" rx="14" fill="none" stroke="#D9485F" stroke-width="2"/><rect x="105.9375" y="733.22" width="28.25" height="15.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="137.1875" y="733.22" width="28.25" height="15.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="168.4375" y="733.22" width="28.25" height="15.5" rx="3" fill="#D9485F" fill-opacity="0.22" stroke="#D9485F" stroke-width="2"/><rect x="199.6875" y="733.22" width="28.25" height="15.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="105.9375" y="751.72" width="28.25" height="15.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="137.1875" y="751.72" width="28.25" height="15.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="168.4375" y="751.72" width="28.25" height="15.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="199.6875" y="751.72" width="28.25" height="15.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><text x="286" y="722.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#D9485F" text-anchor="start">ROI／姿態不穩：p 不再代表同一個結構</text><text x="286" y="755.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="start">→ 先修 registration／mask／recipe，再重新 qualification</text><rect x="832" y="684" width="800" height="126" rx="20" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><g transform="translate(864 704) scale(0.48) translate(-864 -704)"><rect x="864" y="704" width="318" height="204" rx="20" fill="#F8FBFF" stroke="#D3E4FF" stroke-width="1"/><ellipse cx="958" cy="815" rx="62" ry="34" fill="#E7F1FF" stroke="#1769E0" stroke-width="3" transform="rotate(-20 958 815)"/><ellipse cx="1082" cy="782" rx="62" ry="34" fill="#E7F1FF" stroke="#1769E0" stroke-width="3" transform="rotate(-20 1082 782)"/><circle cx="923" cy="812" r="6" fill="#5A97EF"/><circle cx="944" cy="790" r="6" fill="#5A97EF"/><circle cx="962" cy="823" r="6" fill="#5A97EF"/><circle cx="981" cy="803" r="6" fill="#5A97EF"/><circle cx="994" cy="834" r="6" fill="#5A97EF"/><circle cx="1048" cy="790" r="6" fill="#5A97EF"/><circle cx="1067" cy="763" r="6" fill="#5A97EF"/><circle cx="1082" cy="798" r="6" fill="#5A97EF"/><circle cx="1102" cy="771" r="6" fill="#5A97EF"/><circle cx="1118" cy="803" r="6" fill="#5A97EF"/></g><text x="1216" y="722.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#F38B00" text-anchor="start">合法 normal 多峰：單一 Gaussian 可能不合適</text><text x="1216" y="755.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="start">→ 分 recipe／cluster 或比較 exemplar／非線性表示</text><rect x="40" y="849" width="1592" height="52" rx="22" fill="#FFF4CC" stroke="#F1B828" stroke-width="2"/><circle cx="78" cy="873" r="10" fill="none" stroke="#C58A00" stroke-width="2"/><path d="M72 883 L75 890 L81 890 L84 883" fill="none" stroke="#C58A00" stroke-width="2" stroke-linecap="round"/><path d="M64 873 L58 873 M92 873 L98 873 M67 862 L62 857 M89 862 L94 857" fill="none" stroke="#C58A00" stroke-width="2" stroke-linecap="round"/><text x="108" y="883.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="start">選 PaDiM 前先證明：ROI 對齊穩定，而且每個位置的正常變化可由可治理的局部 Gaussian 近似。</text></svg>