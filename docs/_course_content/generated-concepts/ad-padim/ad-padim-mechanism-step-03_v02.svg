<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">只和同一位置比較</title><desc id="desc">測試 feature z_p 只與同一位置的 Gaussian 比較，沿罕見方向離開雲團時 Mahalanobis distance 變大。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="gaussian_distance_padim_mahalanobis_same_position" data-renderer-art="anomaly" data-primitive="padim_mahalanobis_score" data-semantic-scene="padim_mahalanobis_score" data-semantic-entities="test_feature|same_position_gaussian|mahalanobis_score" data-specialist-coverage="test_feature|same_position_gaussian|mahalanobis_score" data-semantic-relation="score distance to the Gaussian at the matching position" data-must-show="test z_p | 同位置 μ_p/Σ_p 橢圓 | 沿罕見方向的距離箭頭 | Mahalanobis distance 標籤" data-not-claim="PaDiM 是把 test patch 和全圖平均距離比較。"><title>只和同一位置比較</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="178.27999999999997" y1="132.44" x2="326.12" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="393.88" y1="132.44" x2="535.56" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="test_feature" data-entity-label-full="test feature"><rect x="119.97241379310341" y="108.01241379310343" width="14.28505747126437" height="14.28505747126437" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="136.2574712