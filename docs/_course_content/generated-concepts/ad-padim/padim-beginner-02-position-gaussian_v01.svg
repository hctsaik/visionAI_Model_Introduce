<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">PaDiM：每個對齊位置的 Gaussian normal state</title><desc id="desc">同一物理結構對齊到同一 feature-grid 位置 p 後，PaDiM 以 clean support feature 建立該位置自己的 mu_p 與 Sigma_p。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D9485F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0B2858"/><rect x="40" y="34" width="148" height="38" rx="19" fill="#E8F2FF" stroke="#E8F2FF" stroke-width="0"/><text x="114.0" y="59.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">位置統計</text><text x="40" y="125.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="39" font-weight="900" fill="#081A38" text-anchor="start">每個對齊位置 p，都有自己的正常分布</text><text x="40" y="171.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="500" fill="#536A91" text-anchor="start">PaDiM 不把整張 ROI 混成一個標準：同一物理結構落到同一 feature-grid 位置，才可建立 μₚ、Σₚ。</text><rect x="1320" y="36" width="312" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1476" y="68.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="800" fill="#1769E0" text-anchor="middle">PaDiM</text><text x="64" y="246.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="26" font-weight="900" fill="#0B2858" text-anchor="start">固定工作例：同一個孔邊與斜槽位置</text><clipPath id="crop-support-plate-64-286-80-92"><rect x="64" y="286" width="348" height="358" rx="24"/></clipPath><g clip-path="url(#crop-support-plate-64-286-80-92)"><svg x="64" y="286" width="348" height="358" viewBox="80 92 670 540" preserveAspectRatio="xMidYMid slice"><image href="padim-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="64" y="286" width="348" height="358" rx="24" fill="none" stroke="#1769E0" stroke-width="2"/><clipPath id="crop-test-plate-444-286-884-92"><rect x="444" y="286" width="348" height="358" rx="24"/></clipPath><g clip-path="url(#crop-test-plate-444-286-884-92)"><svg x="444" y="286" width="348" height="358" viewBox="884 92 670 540" preserveAspectRatio="xMidYMid slice"><image href="padim-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="444" y="286" width="348" height="358" rx="24" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="255" y="438" width="70" height="70" rx="8" fill="none" stroke="#1769E0" stroke-width="5"/><rect x="635" y="438" width="70" height="70" rx="8" fill="none" stroke="#F38B00" stroke-width="5"/><path d="M325 473 L635 473" fill="none" stroke="#1769E0" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-1769E0)" stroke-dasharray="10 8"/><text x="428" y="452.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#1769E0" text-anchor="middle">同一個 p</text><text x="428" y="490.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="middle">不是任意找相像的位置</text><text x="238" y="684.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="800" fill="#1769E0" text-anchor="middle">clean support 的對齊位置 p</text><text x="618" y="684.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="800" fill="#F38B00" text-anchor="middle">test 的同一位置 p</text><path d="M800 474 L916 474" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><text x="1104" y="246.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="26" font-weight="900" fill="#0B2858" text-anchor="middle">收集所有 clean support 在 p 的 feature</text><rect x="946" y="292" width="318" height="204" rx="20" fill="#F8FBFF" stroke="#D3E4FF" stroke-width="1"/><ellipse cx="1104" cy="396" rx="94" ry="54" fill="#E7F1FF" stroke="#1769E0" stroke-width="3" transform="rotate(-20 1104 396)"/><circle cx="1022" cy="408" r="6" fill="#5A97EF"/><circle cx="1043" cy="375" r="6" fill="#5A97EF"/><circle cx="1057" cy="419" r="6" fill="#5A97EF"/><circle cx="1076" cy="386" r="6" fill="#5A97EF"/><circle cx="1092" cy="404" r="6" fill="#5A97EF"/><circle cx="1113" cy="364" r="6" fill="#5A97EF"/><circle cx="1124" cy="417" r="6" fill="#5A97EF"/><circle cx="1142" cy="383" r="6" fill="#5A97EF"/><circle cx="1162" cy="406" r="6" fill="#5A97EF"/><circle cx="1178" cy="372" r="6" fill="#5A97EF"/><path d="M1092 396 L1116 396 M1104 384 L1104 408" stroke="#0B2858" stroke-width="3"/><text x="1104" y="478.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#0B2858" text-anchor="middle">μₚ  +  Σₚ</text><text x="1105" y="531.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="700" fill="#536A91" text-anchor="middle">一團有方向、有寬度的 normal feature cloud</text><rect x="946" y="568" width="640" height="156" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1266" y="613.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="23" font-weight="900" fill="#1769E0" text-anchor="middle">μₚ：這個位置的正常中心</text><text x="1266" y="650.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="900" fill="#00A8C6" text-anchor="middle">Σₚ：不同方向容許的自然變化</text><text x="1266" y="687.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="middle">不是全圖一個 Gaussian，也不是 normal exemplar bank</text><rect x="64" y="748" width="728" height="54" rx="18" fill="#EAFBFF" stroke="#00A8C6" stroke-width="2"/><text x="428" y="782.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="800" fill="#0079A8" text-anchor="middle">先鎖 ROI／registration／feature alignment；不然 p 已不是同一件物理結構。</text><rect x="40" y="849" width="1592" height="52" rx="22" fill="#FFF4CC" stroke="#F1B828" stroke-width="2"/><circle cx="78" cy="873" r="10" fill="none" stroke="#C58A00" stroke-width="2"/><path d="M72 883 L75 890 L81 890 L84 883" fill="none" stroke="#C58A00" stroke-width="2" stroke-linecap="round"/><path d="M64 873 L58 873 M92 873 L98 873 M67 862 L62 857 M89 862 L94 857" fill="none" stroke="#C58A00" stroke-width="2" stroke-linecap="round"/><text x="108" y="883.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="start">PaDiM 的 normality 是每個固定 feature-grid 位置的 μₚ、Σₚ；位置一漂移，距離就可能失去原本的意義。</text></svg>