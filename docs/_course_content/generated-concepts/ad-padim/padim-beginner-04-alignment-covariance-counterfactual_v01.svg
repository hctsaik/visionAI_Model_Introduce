<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">PaDiM：alignment 與 covariance 的受控反事實</title><desc id="desc">同一正常工件若以錯位 ROI 比到錯誤位置，可能整片 false HOLD；支持資料與 covariance 不穩則須停止並診斷條件。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D9485F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0B2858"/><rect x="40" y="34" width="148" height="38" rx="19" fill="#E8F2FF" stroke="#E8F2FF" stroke-width="0"/><text x="114.0" y="59.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">受控反事實</text><text x="40" y="125.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="39" font-weight="900" fill="#081A38" text-anchor="start">先分清：是位置比較失效，還是正常分布估計不穩？</text><text x="40" y="171.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="500" fill="#536A91" text-anchor="start">alignment 與 covariance adequacy 是不同條件；任一條超出 qualification envelope，都不能靠直接擴大統計範圍處理。</text><rect x="1320" y="36" width="312" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1476" y="68.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="800" fill="#1769E0" text-anchor="middle">PaDiM</text><rect x="42" y="223" width="310" height="38" rx="19" fill="#E8F2FF" stroke="#E8F2FF" stroke-width="0"/><text x="197.0" y="248.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#D9485F" text-anchor="middle">實驗 A：只改 ROI / registration</text><text x="382" y="249.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" fill="#536A91" text-anchor="start">同一個已確認正常的工件</text><rect x="40" y="276" width="760" height="236" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><rect x="832" y="276" width="800" height="236" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><clipPath id="crop-aligned-76-314-80-92"><rect x="76" y="314" width="236" height="154" rx="16"/></clipPath><g clip-path="url(#crop-aligned-76-314-80-92)"><svg x="76" y="314" width="236" height="154" viewBox="80 92 670 540" preserveAspectRatio="xMidYMid slice"><image href="padim-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="76" y="314" width="236" height="154" rx="16" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="106.0" y="370.0" width="52.0" height="29.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="161.0" y="370.0" width="52.0" height="29.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="216.0" y="370.0" width="52.0" height="29.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="106.0" y="402.5" width="52.0" height="29.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="161.0" y="402.5" width="52.0" height="29.5" rx="3" fill="#1769E0" fill-opacity="0.22" stroke="#1769E0" stroke-width="2"/><rect x="216.0" y="402.5" width="52.0" height="29.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><text x="345" y="340.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="900" fill="#1769E0" text-anchor="start">對齊：孔邊／斜槽仍落在 p</text><path d="M420 392 L668 392" fill="none" stroke="#1769E0" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><text x="710" y="365.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#1769E0" text-anchor="middle">正常</text><text x="710" y="390.6" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#1769E0" text-anchor="middle">低距離</text><text x="710" y="432.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="middle">仍需 holdout 驗證</text><clipPath id="crop-misaligned-868-314-80-92"><rect x="868" y="314" width="236" height="154" rx="16"/></clipPath><g clip-path="url(#crop-misaligned-868-314-80-92)"><svg x="868" y="314" width="236" height="154" viewBox="80 92 670 540" preserveAspectRatio="xMidYMid slice"><image href="padim-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="868" y="314" width="236" height="154" rx="16" fill="none" stroke="#D9485F" stroke-width="2"/><rect x="908.45" y="373.9" width="52.0" height="29.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="963.45" y="373.9" width="52.0" height="29.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="1018.45" y="373.9" width="52.0" height="29.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="908.45" y="406.4" width="52.0" height="29.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="963.45" y="406.4" width="52.0" height="29.5" rx="3" fill="#D9485F" fill-opacity="0.22" stroke="#D9485F" stroke-width="2"/><rect x="1018.45" y="406.4" width="52.0" height="29.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><text x="1136" y="340.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="900" fill="#D9485F" text-anchor="start">只移 ROI grid：正常孔邊被送到錯的 p</text><path d="M1390 392 L1506 392" fill="none" stroke="#D9485F" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-D9485F)" stroke-dasharray="9 8"/><text x="1552" y="365.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#D9485F" text-anchor="middle">大片</text><text x="1552" y="390.6" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#D9485F" text-anchor="middle">false HOLD</text><text x="1320" y="428.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#D9485F" text-anchor="middle">先恢復 registration；</text><text x="1320" y="451.04" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#D9485F" text-anchor="middle">不是任意放寬 μₚ、Σₚ</text><rect x="42" y="544" width="346" height="38" rx="19" fill="#E8F2FF" stroke="#E8F2FF" stroke-width="0"/><text x="215.0" y="569.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#F38B00" text-anchor="middle">實驗 B：只改 covariance adequacy</text><text x="416" y="570.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" fill="#536A91" text-anchor="start">同一個對齊位置 p，support／dimension／regularization 改變</text><rect x="40" y="594" width="760" height="216" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><rect x="832" y="594" width="800" height="216" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="140" y="632.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#1769E0" text-anchor="start">足夠 clean support + 已檢查 conditioning</text><g transform="translate(110 650) scale(0.7) translate(-110 -650)"><rect x="110" y="650" width="318" height="204" rx="20" fill="#F8FBFF" stroke="#D3E4FF" stroke-width="1"/><ellipse cx="268" cy="754" rx="94" ry="54" fill="#E7F1FF" stroke="#1769E0" stroke-width="3" transform="rotate(-20 268 754)"/><circle cx="186" cy="766" r="6" fill="#5A97EF"/><circle cx="207" cy="733" r="6" fill="#5A97EF"/><circle cx="221" cy="777" r="6" fill="#5A97EF"/><circle cx="240" cy="744" r="6" fill="#5A97EF"/><circle cx="256" cy="762" r="6" fill="#5A97EF"/><circle cx="277" cy="722" r="6" fill="#5A97EF"/><circle cx="288" cy="775" r="6" fill="#5A97EF"/><circle cx="306" cy="741" r="6" fill="#5A97EF"/><circle cx="326" cy="764" r="6" fill="#5A97EF"/><circle cx="342" cy="730" r="6" fill="#5A97EF"/><path d="M256 754 L280 754 M268 742 L268 766" stroke="#0B2858" stroke-width="3"/><text x="268" y="836.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#0B2858" text-anchor="middle">μₚ  +  Σₚ</text></g><text x="458" y="701" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="900" fill="#1769E0" text-anchor="middle">穩定的 μₚ、Σₚ</text><text x="458" y="726" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="900" fill="#1769E0" text-anchor="middle">→ 用保留資料驗證</text><text x="932" y="632.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#F38B00" text-anchor="start">support 太少／高維或 ill-conditioned</text><g transform="translate(902 650) scale(0.7) translate(-902 -650)"><rect x="902" y="650" width="318" height="204" rx="20" fill="#F8FBFF" stroke="#D3E4FF" stroke-width="1"/><ellipse cx="1060" cy="754" rx="112" ry="28" fill="#E7F1FF" stroke="#D9485F" stroke-width="3" transform="rotate(-20 1060 754)"/><circle cx="978" cy="766" r="6" fill="#5A97EF"/><circle cx="999" cy="733" r="6" fill="#5A97EF"/><circle cx="1013" cy="777" r="6" fill="#5A97EF"/><circle cx="1032" cy="744" r="6" fill="#5A97EF"/><circle cx="1048" cy="762" r="6" fill="#5A97EF"/><circle cx="1069" cy="722" r="6" fill="#5A97EF"/><circle cx="1080" cy="775" r="6" fill="#5A97EF"/><circle cx="1098" cy="741" r="6" fill="#5A97EF"/><circle cx="1118" cy="764" r="6" fill="#5A97EF"/><circle cx="1134" cy="730" r="6" fill="#5A97EF"/><path d="M1048 754 L1072 754 M1060 742 L1060 766" stroke="#0B2858" stroke-width="3"/><text x="1060" y="836.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#0B2858" text-anchor="middle">μₚ  +  Σₚ</text></g><text x="1250" y="701" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#D9485F" text-anchor="middle">distance 對小改動敏感</text><text x="1250" y="726" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#D9485F" text-anchor="middle">→ HOLD，記錄 condition diagnostics</text><rect x="40" y="849" width="1592" height="52" rx="22" fill="#FFF4CC" stroke="#F1B828" stroke-width="2"/><circle cx="78" cy="873" r="10" fill="none" stroke="#C58A00" stroke-width="2"/><path d="M72 883 L75 890 L81 890 L84 883" fill="none" stroke="#C58A00" stroke-width="2" stroke-linecap="round"/><path d="M64 873 L58 873 M92 873 L98 873 M67 862 L62 857 M89 862 L94 857" fill="none" stroke="#C58A00" stroke-width="2" stroke-linecap="round"/><text x="108" y="883.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="start">正常品整片亮起時，先查 registration；分數不穩時，先查 covariance conditioning。兩者都不是先調 threshold。</text></svg>