<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">InvAD style translator、constant query 與 SSM feature decoder</title><desc id="desc">style translator 從對齊 input features 產生空間 style map；固定 constant query 經 spatial scale 與 shift 調制的 SSM decoder，得到 normal-like recovered features。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7352DA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7352DA"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9475F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9475F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#08275A"/><rect x="40" y="30" width="188" height="44" rx="22" fill="#F2EEFF" stroke="#7352DA" stroke-width="2"/><text x="134" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">STEP 3 / 5</text><rect x="1331" y="30" width="301" height="44" rx="22" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="2"/><text x="1482" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#7352DA" text-anchor="middle">InvAD · feature inversion</text><text x="40" y="123.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="38" font-weight="900" fill="#0A1A37" text-anchor="start">InvAD 的核心身分：style translator 以輸入相關的空間風格，調制一個固定 constant query</text><text x="40" y="166.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="650" fill="#52698D" text-anchor="start">不是拿每張 AOI 去最佳化 latent；是以 spatial style controls 驅動 stacked SSM feature decoder 的一次前向計算</text><g data-entity="invad_sensor_housing_aoi"><clipPath id="photo-style-52-281"><rect x="52" y="281" width="274" height="302" rx="23"/></clipPath><g clip-path="url(#photo-style-52-281)"><image href="invad-industrial-aoi-anchor_v02.png" x="52" y="281" width="274" height="302" preserveAspectRatio="xMidYMid slice"/></g><rect x="52" y="281" width="274" height="302" rx="23" fill="none" stroke="#1769E0" stroke-width="3"/><rect x="224.62" y="453.14" width="49.32" height="45.3" rx="7" fill="none" stroke="#F38B00" stroke-width="4"/><text x="249.28" y="442.14" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">review cue</text><text x="189.0" y="613.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="middle">same raw AOI</text></g><path d="M349 431 L402 431" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><g data-entity="invad_feature_tensor"><rect x="425" y="294" width="232" height="225" rx="20" fill="#EAF4FF" stroke="#1769E0" stroke-width="3"/><text x="541.0" y="326.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0A1A37" text-anchor="middle">aligned F</text><rect x="447.0" y="352.0"