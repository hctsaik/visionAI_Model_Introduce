 stroke-width="1.2"/><text x="1460.0" y="514.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#7352DA" text-anchor="middle">aligned feature state</text></g><rect x="60" y="668" width="1530" height="135" rx="24" fill="#EAF4FF" stroke="#1769E0" stroke-width="2"/><text x="91" y="710.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#0A1A37" text-anchor="start">What must stay together</text><circle cx="360" cy="703" r="11" fill="#1769E0"/><text x="383" y="710.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="start">fixed ROI / registration</text><circle cx="654" cy="703" r="11" fill="#00A8C6"/><text x="677" y="710.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="start">resize + color + normalization</text><circle cx="948" cy="703" r="11" fill="#7352DA"/><text x="971" y="710.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="start">encoder checkpoint / layers</text><circle cx="1242" cy="703" r="11" fill="#F38B00"/><text x="1265" y="710.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="start">rescale channels / operations</text><text x="91" y="766.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="750" fill="#52698D" text-anchor="start">這不是把 image 縮放好就結束：只要 layer 或 scale alignment 改變，後續 style state、decoder 和 residual rule 都必須一起重新驗證。</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF5D4" stroke="#E5AB22" stroke-width="2"/><circle cx="79" cy="875" r="12" fill="#FFE29A" s