<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">denoising 留在 training，輸出走 evidence gate</title><desc id="desc">DINO 的 noisy ground-truth denoising groups 只在訓練使用，推論 boxes 仍需 inverse mapping 和 evidence gate。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="training_inference_separation" data-renderer-art="detector_or_pose" data-primitive="dino_train_infer_split" data-semantic-scene="dino_train_infer_split" data-semantic-entities="training_branch|inference_branch|evidence_gate" data-specialist-coverage="training_branch|inference_branch|evidence_gate" data-semantic-relation="do not carry training-only signals into release evidence" data-must-show="noisy GT boxes 只連到 TRAIN 區 | INFERENCE 區只有 image | queries | boxes | calibration/review" data-not-claim="denoising group 不是 production anomaly 功能。"><title>denoising 留在 training，輸出走 evidence gate</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="dino-training-inference-separation"><rect x="119.76" y="86.68" width="135.52" height="45.76" rx="6" fill="#FFF7E8" stroke="#F38B00" stroke-width="3"/><circle cx="162.88" cy="109.56" r="4" fill="#F38B00"/><circle cx="212.16000000000003" cy="109.56" r="4" fill="#F38B00"/><rect x="119.76" y="159.48000000000002" width="135.52" height="37.44" rx="6" fill="#E8FAFF" stroke="#1769E0" stroke-width="3"/><path d="M366.16 80.44v120.63999999999999" stroke="#D84A4A" stroke-width="5" stroke-dasharray="6 4"/><path d="M341.52000000000004 107.48l49.28 16.64 M390.8 107.48l-49.28 16.64" stroke="#D84A4A" stroke-width="4"/><rect x="489.35999999999996" y="107.48" width="110.88" height="62.4" rx="7" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="3"/><text data-label-line="true" x="187.52" y="78.36" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">train only</text><text data-label-line="true" x="187.52" y="221.88" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">label</text><text data-label-line="true" x="187.52" y="237.22" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">/ denoise</text><text data-label-line="true" x="366.16" y="228.12" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#D84A4A">separate</text><text data-label-line="true" x="544.8" y="228.12" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">inference</text></g></g><text x="42" y="311.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#0B2858">讀圖：denoising 留在 training，輸出走 evidence gate</text><text x="42" y="339.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="700" fill="#8A5600">候選先交 REVIEW／HOLD；完整邊界見圖下說明。</text></svg>