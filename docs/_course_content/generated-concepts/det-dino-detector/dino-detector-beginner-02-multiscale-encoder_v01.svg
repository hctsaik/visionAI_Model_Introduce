<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">DINO detector：backbone multi-scale features 經 encoder 形成 object evidence</title><desc id="desc">同一 PCB 的大型 IC、connector 與小 capacitors 走不同尺度 features；encoder 組織成 encoded memory，尚未輸出 final boxes。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-11A863" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#11A863"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D9485F"/></marker></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#F5F9FF" stroke="none" stroke-width="0"/><rect x="0" y="0" width="1672" height="8" rx="0" fill="#0B2858" stroke="none" stroke-width="0"/><rect x="40" y="34" width="182" height="38" rx="19" fill="#E8F2FF" stroke="#E8F2FF" stroke-width="0"/><text x="131" y="59" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle"><tspan x="131" dy="0">模型因果</tspan></text><text x="40" y="125" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="40" font-weight="900" fill="#071A3B" text-anchor="start"><tspan x="40" dy="0">DINO 的 backbone 多尺度 features 經 encoder，準備 query 可讀的 object evidence</tspan></text><text x="40" y="171" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="500" fill="#536A91" text-anchor="start"><tspan x="40" dy="0">同一 PCB 的大 IC、connector 與小 capacitors 需要不同尺度；encoder 先組織 features，尚未交出 final boxes。</tspan></text><rect x="1300" y="36" width="332" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1466" y="68" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#1769E0" text-anchor="middle"><tspan x="1466" dy="0">DINO detector</tspan></text><g data-entity="pcb_conveyor_aoi" data-label="same fixed PCB AOI"><rect x="62" y="300" width="460" height="276" rx="16.984615384615385" fill="#0D5F71" stroke="#073F50" stroke-width="2.830769230769231"/><rect x="71.90769230769232" y="309.9076923076923" width="440.18461538461537" height="256.18461538461537" rx="11.323076923076924" fill="#1D8C84" stroke="#57D2C7" stroke-width="1.4153846153846155"/><path d="M98.80000000000001 363.48 L209.20000000000002 363.48 L255.2 407.64" fill="none" stroke="#AEEAD5" stroke-width="2.123076923076923" stroke-linecap="round"/><circle cx="98.80000000000001" cy="363.48" r="3.5384615384615388" fill="#E7D96A" stroke="#FFF7BE" stroke-width="0.7076923076923077"/><circle cx="255.2" cy="407.64" r="3.5384615384615388" fill="#E7D96A" stroke="#FFF7BE" stroke-width="0.7076923076923077"/><path d="M108.0 501.48 L218.4 501.48 L278.2 457.32" fill="none" stroke="#AEEAD5" stroke-width="2.123076923076923" stroke-linecap="round"/><circle cx="108.0" cy="501.48" r="3.5384615384615388" fill="#E7D96A" stroke="#FFF7BE" stroke-width="0.7076923076923077"/><circle cx="278.2" cy="457.32" r="3.5384615384615388" fill="#E7D96A" stroke="#FFF7BE" stroke-width="0.7076923076923077"/><path d="M287.4 349.68 L402.4 349.68 L448.4 385.56" fill="none" stroke="#AEEAD5" stroke-width="2.123076923076923" stroke-linecap="round"/><circle cx="