I, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#0B2858" text-anchor="middle"><tspan x="836" dy="0">encoder 的輸出是 multi-scale encoded features；它們準備 query selection，不能被當成每格直接產生 final box 的 dense grid。</tspan></text><rect x="40" y="853" width="1592" height="44" rx="18" fill="#FFF7DB" stroke="#F1B828" stroke-width="2"/><text x="836" y="882" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#674500" text-anchor="middle"><tspan x="836" dy="0">multi-scale encoder 只能整理仍存在的 evidence；optics/resize 欠採樣的 tiny signal，不會因 encoder 或 denoising 自動補回。</tspan></text></svg>