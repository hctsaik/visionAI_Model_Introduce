<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">鎖 supervised box 與 query-training 狀態</title><desc id="desc">DINO detector 的行為由 supervised labels、queries、denoising training state、schedule 和 runtime contract 共同決定。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="dino_training_contract" data-renderer-art="detector_or_pose" data-primitive="dino_train_contract" data-semantic-scene="dino_train_contract" data-semantic-entities="labelled_boxes|query_training|denoising_branch" data-specialist-coverage="labelled_boxes|query_training|denoising_branch" data-semantic-relation="keep training-only denoising separate from the inference contract" data-must-show="known boxes/classes | multi-scale levels | queries | matching/loss | denoising groups | schedule / export 的版本標籤" data-not-claim="DINO detector 不等於 DINOv2/DINOv3 encoder 或 anomaly model。"><title>鎖 supervised box 與 query-training 狀態</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="178.27999999999997" y1="132.44" x2="326.12" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="393.88" y1="132.44" x2="535.56" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><path d="M569.4399999999999 53.39999999999999L584.0 67.96L569.4399999999999 82.52L554.8799999999999 67.96z" fill="#FFF