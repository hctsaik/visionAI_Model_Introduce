<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">為什麼 YOLO 要看多個尺度？</title><desc id="desc">多個尺度共同提供大小元件的候選證據，不把細、中、粗尺度畫成固定物件類別的一對一分工。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-11A863" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#11A863"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D9485F"/></marker></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#F5F9FF" stroke="none" stroke-width="0"/><path d="M0 0 H310 L245 64 H0 Z" fill="#0B4D9D"/><path d="M0 0 H205 L151 54 H0 Z" fill="#1769E0"/><path d="M1672 941 H1435 L1490 887 H1672 Z" fill="#0B4D9D"/><path d="M1672 941 H1538 L1578 901 H1672 Z" fill="#1769E0"/><text x="836.0" y="91" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="48" font-weight="900" fill="#0B2858" text-anchor="middle"><tspan x="836.0" dy="0">為什麼 YOLO 要看多個尺度？</tspan></text><text x="836.0" y="145" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="700" fill="#536A91" text-anchor="middle"><tspan x="836.0" dy="0">大、小元件都由多個尺度共同提供訊號，沒有固定一對一分工</tspan></text><g data-entity="numbered_step" data-step="1"><rect x="34" y="198" width="366" height="548" rx="20" fill="#FFFFFF" stroke="#9EB7D6" stroke-width="2"/><rect x="56" y="216" width="48" height="48" rx="10" fill="#1769E0" stroke="#1769E0" stroke-width="1"/><text x="80" y="250" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle"><tspan x="80" dy="0">1</tspan></text><text x="116" y="247" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#0B2858" text-anchor="start"><tspan x="116" dy="0">同一張 PCB</tspan></text></g><g data-entity="numbered_step" data-step="2"><rect x="432" y="198" width="366" height="548" rx="20" fill="#FFFFFF" stroke="#9EB7D6" stroke-width="2"/><rect x="454" y="216" width="48" height="48" rx="10" fill="#1769E0" stroke="#1769E0" stroke-width="1"/><text x="478" y="250" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle"><tspan x="478" dy="0">2</tspan></text><text x="514" y="247" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#0B2858" text-anchor="start"><tspan x="514" dy="0">產生三種細緻度</tspan></text></g><g data-entity="numbered_step" data-step="3"><rect x="830" y="198" width="366" height="548" rx="20" fill="#FFFFFF" stroke="#9EB7D6" stroke-width="2"/><rect x="852" y="216" width="48" height="48" rx="10" fill="#1769E0" stroke="#1769E0" stroke-width="1"/><text x="876" y="250" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle"><tspan x="876" dy="0">3</tspan></text><text x="912" y="247" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#0B2858" text-anchor="start"><tspan x="912" dy="0">每個位置都檢查</tspan></text></g><g data-entity="number