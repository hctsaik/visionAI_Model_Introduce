<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">decode/NMS 後才交 ROI</title><desc id="desc">YOLO candidates 經 decode、NMS、回映和 tile merge 後，才成為可交 review 的 known-class boxes。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="decode_nms_inverse_roi" data-renderer-art="image_text_or_diffusion" data-primitive="decode_nms_inverse_roi" data-semantic-scene="decode_nms_inverse_roi" data-semantic-entities="raw_predictions|nms|inverse_mapping" data-specialist-coverage="raw_predictions|nms|inverse_mapping" data-semantic-relation="decode and map selected candidates back to ROI" data-must-show="dense candidates 經 decode/filter/NMS | inverse mapping | tile merge 成少量 box-to-ROI crops" data-not-claim="NMS 後 boxes 仍需 critical-size、overlap 和 P95 證據。"><title>decode/NMS 後才交 ROI</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="dense-decode-nms-inverse-roi"><rect x="82.8" y="101.24000000000001" width="20.88" height="20.88" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="105.67999999999999" y="101.24000000000001" width="20.88" height="20.88" rx="2" fill="#F38B00" stroke="#1769E0" stroke-width="1"/><rect x="128.56" y="101.24000000000001" width="20.88" height="20.88" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="82.8" y="124.12" width="20.88" height="20.8