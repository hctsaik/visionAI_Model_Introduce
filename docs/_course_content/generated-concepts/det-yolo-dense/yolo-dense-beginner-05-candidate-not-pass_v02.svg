<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">YOLO 畫出的框，可以直接讓產品 PASS 嗎？</title><desc id="desc">YOLO 只提出已知類別候選；小物、重疊、漂移、未知外觀與 P95 證據不足時必須人工覆核或 HOLD。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-11A863" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#11A863"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D9485F"/></marker></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#F5F9FF" stroke="none" stroke-width="0"/><path d="M0 0 H310 L245 64 H0 Z" fill="#0B4D9D"/><path d="M0 0 H205 L151 54 H0 Z" fill="#1769E0"/><path d="M1672 941 H1435 L1490 887 H1672 Z" fill="#0B4D9D"/><path d="M1672 941 H1538 L1578 901 H1672 Z" fill="#1769E0"/><text x="836.0" y="91" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="48" font-weight="900" fill="#0B2858" text-anchor="middle"><tspan x="836.0" dy="0">YOLO 畫出的框，可以直接讓產品 PASS 嗎？</tspan></text><text x="836.0" y="145" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="700" fill="#536A91" text-anchor="middle"><tspan x="836.0" dy="0">不可以；模型只指出已知類別候選，放行仍由後續證據與責任流程決定</tspan></text><g data-entity="numbered_step" data-st