<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">EfficientAD 的 calibration contract 與 HOLD 邊界</title><desc id="desc">EfficientAD 只有在正常支援集、penalty source、ROI、illumination、teacher/student/AE state 與 calibration 可重播時，才可將 candidate 導向 review；狀態變更時須 HOLD。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D9485F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0B2858"/><rect x="40" y="34" width="164" height="38" rx="19" fill="#E8F2FF" stroke="#E8F2FF" stroke-width="0"/><text x="122.0" y="60.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">邊界 05</text><text x="40" y="125.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="39" font-weight="900" fill="#081A38" text-anchor="start">校正、fusion 與 threshold 是合約；狀態變了，就先 HOLD 而不是美化熱圖</text><text x="40" y="171.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="500" fill="#536A91" text-anchor="start">同一個 candidate 只有在 support、penalty provenance、ROI、illumination 與 calibration state 都可重播時，才可回到 raw ROI review。</text><rect x="1334" y="36" width="298" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1483" y="68.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="800" fill="#1769E0" text-anchor="middle">EfficientAD</text><text x="72" y="246.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="25" font-weight="900" fill="#0B2858" text-anchor="start">qualified state：可比較的 evidence chain</text><clipPath id="crop-qualified-72-280-704-180"><rect x="72" y="280" width="322" height="230" rx="20"/></clipPath><g clip-path="url(#crop-qualified-72-280-704-180)"><svg x="72" y="280" width="322" height="230" viewBox="704 180 900 660" preserveAspectRatio="xMidYMid slice"><image href="efficientad-industrial-aoi-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="72" y="280" width="322" height="230" rx="20" fill="none" stroke="#1769E0" stroke-width="2"/><path d="M408 395 L476 395" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="486" y="326" width="210" height="122" rx="18" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><text x="591" y="357.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#0B2858" text-anchor="middle">local</text><rect x="520" y="392" width="18" height="28" rx="5" fill="#1769E0" fill-opacity=".75"/><rect x="549" y="378" width="18" height="42" rx="5" fill="#1769E0" fill-opacity=".75"/><rect x="578" y="364" width="18" height="56" rx="5" fill="#1769E0" fill-opacity=".75"/><rect x="607" y="380" width="18" height="40" rx="5" fill="#1769E0" fill-opacity=".75"/><rect x="636" y="397" width="18" height="23" rx="5" fill="#1769E0" fill-opacity=".75"/><text x="591" y="438.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="middle">normal-data calibration</text><rect x="486" y="448" width="210" height="122" rx="18" fill="#FFFFFF" stroke="#00A8C6" stroke-width="2"/><text x="591" y="479.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#0B2858" text-anchor="middle">global</text><rect x="520" y="514" width="18" height="28" rx="5" fill="#00A8C6" fill-opacity=".75"/><rect x="549" y="500" width="18" height="42" rx="5" fill="#00A8C6" fill-opacity=".75"/><rect x="578" y="486" width="18" height="56" rx="5" fill="#00A8C6" fill-opacity=".75"/><rect x="607" y="502" width="18" height="40" rx="5" fill="#00A8C6" fill-opacity=".75"/><rect x="636" y="519" width="18" height="23" rx="5" fill="#00A8C6" fill-opacity=".75"/><text x="591" y="560.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="middle">normal-data calibration</text><path d="M710 387 L787 430" fill="none" stroke="#F38B00" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><path d="M710 509 L787 462" fill="none" stroke="#F38B00" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><rect x="803" y="347" width="180" height="158" rx="22" fill="#FFF9EE" stroke="#F38B00" stroke-width="2"/><text x="893" y="408.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="23" font-weight="900" fill="#0B2858" text-anchor="middle">locked</text><text x="893" y="438.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#F38B00" text-anchor="middle">fusion +</text><text x="893" y="468.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#F38B00" text-anchor="middle">aggregation</text><text x="893" y="501.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#536A91" text-anchor="middle">candidate</text><path d="M997 426 L1070 426" fill="none" stroke="#F38B00" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><rect x="1086" y="317" width="236" height="218" rx="24" fill="#FFFFFF" stroke="#F38B00" stroke-width="2"/><text x="1204" y="360.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="25" font-weight="900" fill="#F38B00" text-anchor="middle">candidate</text><text x="1204" y="389.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#0B2858" text-anchor="middle">回到 raw ROI</text><rect x="1127" y="410" width="154" height="64" rx="12" fill="#FFF7EA" stroke="#F38B00" stroke-width="2"/><text x="1204" y="439.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#9C6200" text-anchor="middle">REVIEW</text><text x="1204" y="464.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#D9485F" text-anchor="middle">或 HOLD</text><text x="1204" y="511.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="middle">不是自動 PASS / FAIL</text><text x="734" y="584.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="middle">版本化：normal IDs / PDN state / AE / penalty source / transforms / calibration / fusion</text><rect x="72" y="653" width="590" height="142" rx="22" fill="#FFF6F7" stroke="#D9485F" stroke-width="2"/><text x="100" y="688.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#D9485F" text-anchor="start">同樣正常工件卻整片亮</text><text x="100" y="715.3" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#D9485F" text-anchor="start">先查 ROI／registration／illumination</text><text x="100" y="764.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#0B2858" text-anchor="start">保存 raw ROI / capture state，診斷後再 qualification。</text><rect x="530" y="696" width="96" height="56" rx="14" fill="#FFF0F1" stroke="#D9485F" stroke-width="2"/><text x="578" y="731.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#D9485F" text-anchor="middle">HOLD</text><rect x="694" y="653" width="590" height="142" rx="22" fill="#FFF6F7" stroke="#D9485F" stroke-width="2"/><text x="722" y="688.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#D9485F" text-anchor="start">support 或 penalty source 被換</text><text x="722" y="715.3" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#D9485F" text-anchor="start">舊 calibration 不可沿用</text><text x="722" y="764.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#0B2858" text-anchor="start">不要沿用舊 quantile / fusion / threshold；可追溯地 rebuild。</text><rect x="1152" y="696" width="96" height="56" rx="14" fill="#FFF0F1" stroke="#D9485F" stroke-width="2"/><text x="1200" y="731.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#D9485F" text-anchor="middle">HOLD</text><rect x="72" y="606" width="1260" height="32" rx="16" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="702" y="628.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#0B2858" text-anchor="middle">forward 很快 ≠ image-to-decision 很快：另外量 acquisition、ROI、pre/post、tile、handoff 的 P95 / P99。</text><rect x="40" y="849" width="1592" height="52" rx="22" fill="#FFF8DE" stroke="#F1B828" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="800" fill="#674500" text-anchor="middle">HOLD 不是失敗：它保留證據，阻止無法重播的 candidate 變成不安全的產品結論。</text></svg>