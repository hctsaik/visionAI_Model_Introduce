<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">EfficientAD 的 local/global 校正與 candidate fusion</title><desc id="desc">同一張帶微小刮痕的 test ROI 形成 local 及 global discrepancy；兩張 map 各自以正常資料校正、鎖定融合與 aggregation，再導向 raw ROI review 或 HOLD。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D9485F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0B2858"/><rect x="40" y="34" width="164" height="38" rx="19" fill="#E8F2FF" stroke="#E8F2FF" stroke-width="0"/><text x="122.0" y="60.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">證據 03</text><text x="40" y="125.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="39" font-weight="900" fill="#081A38" text-anchor="start">同一張 test ROI：兩種落差先各自校正，才可融合成 candidate</text><text x="40" y="171.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="500" fill="#536A91" text-anchor="start">local 與 global 的數值尺度不同；normal-data calibration、fusion、aggregation 與 threshold 都是版本化合約。</text><rect x="1334" y="36" width="298" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1483" y="68.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="800" fill="#1769E0" text-anchor="middle">EfficientAD</text><text x="70" y="244.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="23" font-weight="900" fill="#0B2858" text-anchor="start">test ROI：同一件金屬治具上的小刮痕</text><clipPath id="crop-test-scratch-70-276-704-208"><rect x="70" y="276" width="364" height="398" rx="20"/></clipPath><g clip-path="url(#crop-test-scratch-70-276-704-208)"><svg x="70" y="276" width="364" height="398" viewBox="704 208 880 604" preserveAspectRatio="xMidYMid slice"><image href="efficientad-industrial-aoi-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="70" y="276" width="364" height="398" rx="20" fill="none" stroke="#F38B00" stroke-width="2"/><rect x="288" y="524" width="82" height="82" rx="11" fill="none" stroke="#F38B00" stroke-width="5"/><text x="252" y="706.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#F38B00" text-anchor="middle">橘色框是要回看的 physical evidence</text><path d="M446 438 L540 346" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><path d="M446 515 L540 616" fill="none" stroke="#00A8C6" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><rect x="556" y="276" width="250" height="118" rx="16" fill="#F8FBFF" stroke="#1769E0" stroke-width="2"/><rect x="572.0" y="292.0" width="38.0" height="39.5" rx="5" fill="#7EB1FF" fill-opacity="0.66" stroke="#7EB1FF" stroke-width="0"/><rect x="617.0" y="292.0" width="38.0" height="39.5" rx="5" fill="#7EB1FF" fill-opacity="0.66" stroke="#7EB1FF" stroke-width="0"/><rect x="662.0" y="292.0" width="38.0" height="39.5" rx="5" fill="#7EB1FF" fill-opacity="0.66" stroke="#7EB1FF" stroke-width="0"/><rect x="707.0" y="292.0" width="38.0" height="39.5" rx="5" fill="#7EB1FF" fill-opacity="0.66" stroke="#7EB1FF" stroke-width="0"/><rect x="752.0" y="292.0" width="38.0" height="39.5" rx="5" fill="#7EB1FF" fill-opacity="0.66" stroke="#7EB1FF" stroke-width="0"/><rect x="572.0" y="338.5" width="38.0" height="39.5" rx="5" fill="#7EB1FF" fill-opacity="0.66" stroke="#7EB1FF" stroke-width="0"/><rect x="617.0" y="338.5" width="38.0" height="39.5" rx="5" fill="#7EB1FF" fill-opacity="0.66" stroke="#7EB1FF" stroke-width="0"/><rect x="662.0" y="338.5" width="38.0" height="39.5" rx="5" fill="#7EB1FF" fill-opacity="0.66" stroke="#7EB1FF" stroke-width="0"/><rect x="707.0" y="338.5" width="38.0" height="39.5" rx="5" fill="#F38B00" fill-opacity="0.95" stroke="#F38B00" stroke-width="0"/><rect x="752.0" y="338.5" width="38.0" height="39.5" rx="5" fill="#7EB1FF" fill-opacity="0.66" stroke="#7EB1FF" stroke-width="0"/><text x="681.0" y="422.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">local discrepancy map</text><rect x="556" y="548" width="245" height="142" rx="18" fill="#F8FBFF" stroke="#00A8C6" stroke-width="2"/><rect x="598" y="586" width="42" height="30" rx="6" fill="#DCEAFF" stroke="#00A8C6" stroke-width="2"/><rect x="661" y="586" width="42" height="30" rx="6" fill="#DCEAFF" stroke="#00A8C6" stroke-width="2"/><rect x="598" y="636" width="42" height="30" rx="6" fill="#DCEAFF" stroke="#00A8C6" stroke-width="2"/><rect x="699" y="618" width="42" height="30" rx="6" fill="#DCEAFF" stroke="#00A8C6" stroke-width="2"/><text x="746" y="670.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">位置不合</text><text x="678" y="725.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#00A8C6" text-anchor="middle">global AE ↔ student discrepancy</text><path d="M820 335 L890 335" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><path d="M820 619 L890 619" fill="none" stroke="#00A8C6" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><rect x="906" y="273" width="210" height="122" rx="18" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><text x="1011" y="304.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#0B2858" text-anchor="middle">local scale</text><rect x="940" y="339" width="18" height="28" rx="5" fill="#1769E0" fill-opacity=".75"/><rect x="969" y="325" width="18" height="42" rx="5" fill="#1769E0" fill-opacity=".75"/><rect x="998" y="311" width="18" height="56" rx="5" fill="#1769E0" fill-opacity=".75"/><rect x="1027" y="327" width="18" height="40" rx="5" fill="#1769E0" fill-opacity=".75"/><rect x="1056" y="344" width="18" height="23" rx="5" fill="#1769E0" fill-opacity=".75"/><text x="1011" y="385.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="middle">normal-data calibration</text><rect x="906" y="557" width="210" height="122" rx="18" fill="#FFFFFF" stroke="#00A8C6" stroke-width="2"/><text x="1011" y="588.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#0B2858" text-anchor="middle">global scale</text><rect x="940" y="623" width="18" height="28" rx="5" fill="#00A8C6" fill-opacity=".75"/><rect x="969" y="609" width="18" height="42" rx="5" fill="#00A8C6" fill-opacity=".75"/><rect x="998" y="595" width="18" height="56" rx="5" fill="#00A8C6" fill-opacity=".75"/><rect x="1027" y="611" width="18" height="40" rx="5" fill="#00A8C6" fill-opacity=".75"/><rect x="1056" y="628" width="18" height="23" rx="5" fill="#00A8C6" fill-opacity=".75"/><text x="1011" y="669.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="middle">normal-data calibration</text><path d="M1128 334 L1174 457" fill="none" stroke="#F38B00" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><path d="M1128 619 L1174 495" fill="none" stroke="#F38B00" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><rect x="1190" y="357" width="194" height="226" rx="24" fill="#FFF9EE" stroke="#F38B00" stroke-width="2"/><text x="1287" y="401.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="900" fill="#0B2858" text-anchor="middle">locked fusion</text><rect x="1212" y="426" width="150" height="77" rx="16" fill="#F8FBFF" stroke="#F38B00" stroke-width="2"/><rect x="1228.0" y="442.0" width="18.0" height="19.0" rx="5" fill="#82DEE7" fill-opacity="0.66" stroke="#82DEE7" stroke-width="0"/><rect x="1253.0" y="442.0" width="18.0" height="19.0" rx="5" fill="#82DEE7" fill-opacity="0.66" stroke="#82DEE7" stroke-width="0"/><rect x="1278.0" y="442.0" width="18.0" height="19.0" rx="5" fill="#82DEE7" fill-opacity="0.66" stroke="#82DEE7" stroke-width="0"/><rect x="1303.0" y="442.0" width="18.0" height="19.0" rx="5" fill="#82DEE7" fill-opacity="0.66" stroke="#82DEE7" stroke-width="0"/><rect x="1328.0" y="442.0" width="18.0" height="19.0" rx="5" fill="#82DEE7" fill-opacity="0.66" stroke="#82DEE7" stroke-width="0"/><rect x="1228.0" y="468.0" width="18.0" height="19.0" rx="5" fill="#82DEE7" fill-opacity="0.66" stroke="#82DEE7" stroke-width="0"/><rect x="1253.0" y="468.0" width="18.0" height="19.0" rx="5" fill="#82DEE7" fill-opacity="0.66" stroke="#82DEE7" stroke-width="0"/><rect x="1278.0" y="468.0" width="18.0" height="19.0" rx="5" fill="#82DEE7" fill-opacity="0.66" stroke="#82DEE7" stroke-width="0"/><rect x="1303.0" y="468.0" width="18.0" height="19.0" rx="5" fill="#F38B00" fill-opacity="0.95" stroke="#F38B00" stroke-width="0"/><rect x="1328.0" y="468.0" width="18.0" height="19.0" rx="5" fill="#82DEE7" fill-opacity="0.66" stroke="#82DEE7" stroke-width="0"/><text x="1287" y="538.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#F38B00" text-anchor="middle">map → aggregation</text><text x="1287" y="566.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#F38B00" text-anchor="middle">→ image candidate score</text><path d="M1398 471 L1410 471" fill="none" stroke="#F38B00" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><rect x="1396" y="328" width="236" height="218" rx="24" fill="#FFFFFF" stroke="#F38B00" stroke-width="2"/><text x="1514" y="371.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="25" font-weight="900" fill="#F38B00" text-anchor="middle">candidate</text><text x="1514" y="400.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#0B2858" text-anchor="middle">回到 raw ROI</text><rect x="1437" y="421" width="154" height="64" rx="12" fill="#FFF7EA" stroke="#F38B00" stroke-width="2"/><text x="1514" y="450.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#9C6200" text-anchor="middle">REVIEW</text><text x="1514" y="475.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#D9485F" text-anchor="middle">或 HOLD</text><text x="1514" y="522.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="middle">不是自動 PASS / FAIL</text><rect x="70" y="754" width="1514" height="62" rx="20" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="827" y="786.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="800" fill="#0B2858" text-anchor="middle">兩張亮圖不能因為顏色相似就直接相加；漂亮 heatmap 也不是 defect probability。</text><rect x="40" y="849" width="1592" height="52" rx="22" fill="#FFF8DE" stroke="#F1B828" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="800" fill="#674500" text-anchor="middle">EfficientAD 的輸出是可追溯 candidate evidence：保留原始 ROI、兩張已校正 map、fusion 與 decision revision。</text></svg>