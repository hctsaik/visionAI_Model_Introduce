l="#087F8C" font-weight="600">量實體尺寸時，再加校正與量測驗證</text><text x="56" y="791.0" font-size="21" fill="#526477" font-weight="600">不要只因模型名字熟悉就選它；輸出需求改變，資料準備與驗證方式也要跟著改。</text><rect x="48" y="819" width="1576" height="82" rx="16" fill="#FFF4CC" stroke="#E6C669" stroke-width="2"/><text x="70" y="871.0" font-size="27" fill="#614A14" font-weight="750">💡 能解釋自己的候選、準備工作與改選條件，才算把模型概念帶進工作。</text></svg>