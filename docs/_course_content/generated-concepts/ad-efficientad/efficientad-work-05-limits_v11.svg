<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><title>模型也得先看得見問題</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#173A5E"/></marker><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#F0F4F7"/><stop offset=".5" stop-color="#BACBD9"/><stop offset="1" stop-color="#E2EBF2"/></linearGradient></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#FCFCFA" stroke="#FCFCFA" stroke-width="2"/><text x="52" y="55.0" font-size="20" fill="#087F8C" font-weight="800">EFFICIENTAD  /  工作與選型</text><text x="52" y="114.0" font-size="44" fill="#173A5E" font-weight="850">模型也得先看得見問題</text><text x="52" y="159.0" font-size="25" fill="#526477" font-weight="600">工作案例導讀  ·  工件、熱區與輪廓均為教學示意</text><rect x="61" y="214" width="44" height="44" rx="14" fill="#2463C5" stroke="#2463C5" stroke-width="2"/><text x="74" y="245.0" font-size="25" fill="white" font-weight="800">1</text><text x="121" y="246.0" font-size="28" fill="#2463C5" font-weight="800">訊號看得見</text><g transform="translate(141 320) scale(1.0666666666666667)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7890A8" stroke-width="2"/><path d="M 18 26 L 44 26 M 26 18 L 26 44" stroke="#173A5E" stroke-width="5"/><circle cx="76" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="76" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><path d="M 116 176 L 137 204 M 121 175 L 142 203" stroke="#C84343" stroke-width="5"/><text x="16" y="224.0" font-size="18" fill="#173A5E" font-weight="800">A-01</text></g><rect x="608" y="214" width="44" height="44" rx="14" fill="#A96800" stroke="#A96800" stroke-width="2"/><text x="621" y="245.0" font-size="25" fill="white" font-weight="800">2</text><text x="668" y="246.0" font-size="28" fill="#A96800" font-weight="800">光照把訊號蓋住</text><g transform="translate(688 320) scale(1.0666666666666667)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7890A8" stroke-width="2"/><path d="M 18 26 L 44 26 M 26 18 L 26 44" stroke="#173A5E" stroke-width="5"/><circle cx="76" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="76" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><path d="M 116 176 L 137 204 M 121 175 L 142 203" stroke="#C84343" stroke-width="5"/><text x="16" y="224.0" font-size="18" fill="#173A5E" font-weight="800">A-01</text></g><rect x="1153" y="214" width="44" height="44" rx="14" fill="#A96800" stroke="#A96800" stroke-width="2"/><text x="1166" y="245.0" font-size="25" fill="white" font-weight="800">3</text><text x="1213" y="246.0" font-size="28" fill="#A96800" font-weight="800">縮圖後刮痕消失</text><g transform="translate(1233 320) scale(1.0666666666666667)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7890A8" stroke-width="2"/><path d="M 18 26 L 44 26 M 26 18 L 26 44" stroke="#173A5E" stroke-width="5"/><circle cx="76" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="76" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><text x="16" y="224.0" font-size="18" fill="#173A5E" font-weight="800">A-01</text></g><ellipse cx="816" cy="472" rx="122" ry="83" fill="white" opacity=".90"/><circle cx="1371" cy="521" r="31" fill="none" stroke="#A96800" stroke-width="3" stroke-dasharray="6 5"/><text x="1158" y="601.0" font-size="22" fill="#526477" font-weight="600">同一處：工件還在，刮痕訊號已丟失</text><text x="71" y="641.0" font-size="27" fill="#2463C5" font-weight="600">固定取像，再驗證熱區</text><text x="71" y="680.15" font-size="27" fill="#2463C5" font-weight="600">先確認模型真的有線索可用</text><text x="618" y="641.0" font-size="27" fill="#A96800" font-weight="600">先調燈光與曝光</text><text x="618" y="680.15" font-size="27" fill="#A96800" font-weight="600">不要只改分數門檻</text><text x="1164" y="641.0" font-size="26" fill="#A96800" font-weight="600">先改善解析度或量測方法</text><text x="1164" y="678.7" font-size="26" fill="#A96800" font-weight="600">模型無法補回遺失細節</text><text x="56" y="791.0" font-size="21" fill="#526477" font-weight="600">後兩例表示輸入風險，不是假裝實測到漏檢；調整取像後，仍需重新檢查漏檢與誤報。</text><rect x="48" y="819" width="1576" height="82" rx="16" fill="#FFF4CC" stroke="#E6C669" stroke-width="2"/><text x="70" y="871.0" font-size="27" fill="#614A14" font-weight="750">💡 取像、正常資料與模型一起決定效果；先辨識問題出在哪一段。</text></svg>