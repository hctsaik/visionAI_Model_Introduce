C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><path d="M 116 176 L 137 204 M 121 175 L 142 203" stroke="#C84343" stroke-width="5"/><text x="16" y="224.0" font-size="18" fill="#173A5E" font-weight="800">A-01</text></g><circle cx="1372.8333333333333" cy="501.85" r="42.28333333333333" fill="#C84343" opacity="0.13"/><circle cx="1372.8333333333333" cy="501.85" r="28.516666666666666" fill="#C84343" opacity="0.23"/><circle cx="1372.8333333333333" cy="501.85" r="16.716666666666665" fill="#C84343" opacity="0.4"/><text x="1177" y="607.0" font-size="28" fill="#173A5E" font-weight="600">把熱區和原圖交給覆核</text><text x="1177" y="647.6" font-size="28" fill="#173A5E" font-weight="600">減少逐張盲找的負擔</text><text x="57" y="742.0" font-size="26" fill="#2463C5" font-weight="800">效率來源：輕量 PDN 一次描述整張圖，前段降採樣減少後續運算。</text><text x="57" y="785.0" font-size="24" fill="#526477" font-weight="600">兩組 Student 共用前段運算；現場仍要一起量取像、推論與覆核時間。</text><rect x="48" y="819" width="1576" height="82" rx="16" fill="#FFF4CC" stroke="#E6C669" stroke-width="2"/><text x="70" y="871.0" font-size="27" fill="#614A14" font-weight="750">💡 先讓模型幫忙找值得看的位置，再用原圖與驗證結果決定工作處置。</text></svg>