<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><title>局部樣子與整體配置，分兩路補看</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#173A5E"/></marker><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#F0F4F7"/><stop offset=".5" stop-color="#BACBD9"/><stop offset="1" stop-color="#E2EBF2"/></linearGradient></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#FCFCFA" stroke="#FCFCFA" stroke-width="2"/><text x="52" y="55.0" font-size="20" fill="#087F8C" font-weight="800">EFFICIENTAD  /  工作與選型</text><text x="52" y="114.0" font-size="44" fill="#173A5E" font-weight="850">局部樣子與整體配置，分兩路補看</text><text x="52" y="159.0" font-size="25" fill="#526477" font-weight="600">工作案例導讀  ·  工件、熱區與輪廓均為教學示意</text><text x="59" y="222.0" font-size="29" fill="#2463C5" font-weight="800">同一個模型，同時補看「局部樣子」與「整體配置」</text><g transform="translate(77 285) scale(0.8208333333333333)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7890A8" stroke-width="2"/><path d="M 18 26 L 44 26 M 26 18 L 26 44" stroke="#173A5E" stroke-width="5"/><circle cx="76" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="76" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><path d="M 116 176 L 137 204 M 121 175 L 142 203" stroke="#C84343" stroke-width="5"/><text x="16" y="224.0" font-size="18" fill="#173A5E" font-weight="800">A-01</text></g><path d="M 296 380 L 376 380" stroke="#173A5E" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="404" y="285" width="641" height="198" rx="18" fill="#F5F8FC" stroke="#CDDAE7" stroke-width="2"/><text x="426" y="325.0" font-size="28" fill="#2463C5" font-weight="800">局部路：附近的外觀變了</text><text x="426" y="369.0" font-size="25" fill="#173A5E" font-weight="600">固定描述與學正常的描述不一致</text><text x="426" y="405.25" font-size="25" fill="#173A5E" font-weight="600">因此留下需要留意的位置</text><path d="M 1065 380 L 1145 380" stroke="#173A5E" stroke-width="5" fill="none" marker-end="url(#arrow)"/><g transform="translate(1192 285) scale(0.8208333333333333)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7890A8" stroke-width="2"/><path d="M 18 26 L 44 26 M 26 18 L 26 44" stroke="#173A5E" stroke-width="5"/><circle cx="76" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="76" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><path d="M 116 176 L 137 204 M 121 175 L 142 203" stroke="#C84343" stroke-width="5"/><text x="16" y="224.0" font-size="18" fill="#173A5E" font-weight="800">A-01</text></g><circle cx="1298.7083333333333" cy="440.1375" r="35.295833333333334" fill="#C84343" opacity="0.13"/><circle cx="1298.7083333333333" cy="440.1375" r="23.804166666666667" fill="#C84343" opacity="0.23"/><circle cx="1298.7083333333333" cy="440.1375" r="13.954166666666666" fill="#C84343" opacity="0.4"/><text x="1420" y="368.0" font-size="24" fill="#173A5E" font-weight="600">回到原圖</text><text x="1420" y="402.8" font-size="24" fill="#173A5E" font-weight="600">確認這個位置</text><g transform="translate(77 547) scale(0.8208333333333333)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7890A8" stroke-width="2"/><path d="M 18 26 L 44 26 M 26 18 L 26 44" stroke="#173A5E" stroke-width="5"/><circle cx="76" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="76" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><text x="16" y="224.0" font-size="18" fill="#173A5E" font-weight="800">A-01</text></g><path d="M 296 642 L 376 642" stroke="#173A5E" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="404" y="547" width="641" height="198" rx="18" fill="#F5F8FC" stroke="#CDDAE7" stroke-width="2"/><text x="426" y="587.0" font-size="28" fill="#087F8C" font-weight="800">整體路：零件組合變了</text><text x="426" y="631.0" font-size="25" fill="#173A5E" font-weight="600">看整體的重建與局部預測不一致</text><text x="426" y="667.25" font-size="25" fill="#173A5E" font-weight="600">因此留下需要留意的位置</text><path d="M 1065 642 L 1145 642" stroke="#173A5E" stroke-width="5" fill="none" marker-end="url(#arrow)"/><g transform="translate(1192 547) scale(0.8208333333333333)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7890A8" stroke-width="2"/><path d="M 18 26 L 44 26 M 26 18 L 26 44" stroke="#173A5E" stroke-width="5"/><circle cx="76" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="76" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><text x="16" y="224.0" font-size="18" fill="#173A5E" font-weight="800">A-01</text></g><circle cx="1326.6166666666668" cy="681.6166666666667" r="35.295833333333334" fill="#C84343" opacity="0.13"/><circle cx="1326.6166666666668" cy="681.6166666666667" r="23.804166666666667" fill="#C84343" opacity="0.23"/><circle cx="1326.6166666666668" cy="681.6166666666667" r="13.954166666666666" fill="#C84343" opacity="0.4"/><text x="1420" y="630.0" font-size="24" fill="#173A5E" font-weight="600">回到原圖</text><text x="1420" y="664.8" font-size="24" fill="#173A5E" font-weight="600">確認這個位置</text><text x="56" y="791.0" font-size="21" fill="#526477" font-weight="600">兩路互補是設計目的，實際是否抓到刮痕或缺件仍需測試；熱區不是模型量出的缺陷邊界。</text><rect x="48" y="819" width="1576" height="82" rx="16" fill="#FFF4CC" stroke="#E6C669" stroke-width="2"/><text x="70" y="871.0" font-size="27" fill="#614A14" font-weight="750">💡 用兩種觀察線索補看不同變化，最後仍要驗證你真正關心的異常。</text></svg>