<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><title>把「建立模型」和「使用模型」分開看</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#173A5E"/></marker><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#F0F4F7"/><stop offset=".5" stop-color="#BACBD9"/><stop offset="1" stop-color="#E2EBF2"/></linearGradient></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#FCFCFA" stroke="#FCFCFA" stroke-width="2"/><text x="52" y="55.0" font-size="20" fill="#087F8C" font-weight="800">EFFICIENTAD  /  機制與證據</text><text x="52" y="114.0" font-size="44" fill="#173A5E" font-weight="850">把「建立模型」和「使用模型」分開看</text><text x="52" y="159.0" font-size="25" fill="#526477" font-weight="600">閱讀主線：如何學正常  ·  原理依論文；工件與數值例為教學示意</text><text x="62" y="221.0" font-size="27" fill="#2463C5" font-weight="800">建立階段：三個網路讀正常圖；箭頭表示「提供學習目標」</text><g transform="translate(67 300) scale(0.8916666666666667)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7890A8" stroke-width="2"/><path d="M 18 26 L 44 26 M 26 18 L 26 44" stroke="#173A5E" stroke-width="5"/><circle cx="76" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="76" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><text x="16" y="224.0" font-size="18" fill="#173A5E" font-weight="800">A-01</text></g><text x="65" y="560.0" font-size="26" fill="#173A5E" font-weight="600">正常樣本</text><text x="65" y="597.7" font-size="26" fill="#173A5E" font-weight="600">A-01</text><rect x="363" y="266" width="364" height="131" rx="18" fill="#F5F8FC" stroke="#CDDAE7" stroke-width="2"/><text x="385" y="312.0" font-size="28" fill="#2463C5" font-weight="800">Teacher T：固定</text><text x="385" y="360.0" font-size="24" fill="#173A5E" font-weight="600">預先蒸餾的描述網路</text><rect x="802" y="266" width="364" height="131" rx="18" fill="#F5F8FC" stroke="#CDDAE7" stroke-width="2"/><text x="824" y="312.0" font-size="28" fill="#087F8C" font-weight="800">AE：學整圖重建</text><text x="824" y="360.0" font-size="24" fill="#173A5E" font-weight="600">目標是 T 的特徵</text><rect x="363" y="513" width="364" height="131" rx="18" fill="#F5F8FC" stroke="#CDDAE7" stroke-width="2"/><text x="385" y="559.0" font-size="28" fill="#2463C5" font-weight="800">Student S₁</text><text x="385" y="607.0" font-size="24" fill="#173A5E" font-weight="600">學 T 的正常描述</text><rect x="802" y="513" width="364" height="131" rx="18" fill="#F5F8FC" stroke="#CDDAE7" stroke-width="2"/><text x="824" y="559.0" font-size="28" fill="#087F8C" font-weight="800">Student S₂</text><text x="824" y="607.0" font-size="24" fill="#173A5E" font-weight="600">學 AE 的正常重建特性</text><path d="M 739 330 L 787 330" stroke="#173A5E" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M 544 404 L 544 505" stroke="#173A5E" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M 985 404 L 985 505" stroke="#173A5E" stroke-width="5" fill="none" marker-end="url(#arrow)"/><text x="566" y="462.0" font-size="24" fill="#2463C5" font-weight="600">T → S₁</text><text x="1005" y="462.0" font-size="24" fill="#087F8C" font-weight="600">A → S₂</text><text x="371" y="687.0" font-size="25" fill="#173A5E" font-weight="600">S₁ 與 S₂ 共享同一 Student；是兩組通道，不是兩個串接網路。</text><rect x="1206" y="267" width="405" height="377" rx="18" fill="#FBF2E6" stroke="#CDDAE7" stroke-width="2"/><text x="1229" y="308.0" font-size="26" fill="#A96800" font-weight="800">局部訓練的兩項設計</text><text x="1229" y="365.0" font-size="28" fill="#A96800" font-weight="800">Hard loss</text><text x="1229" y="404.0" font-size="24" fill="#173A5E" font-weight="600">優先修正最大誤差元素</text><text x="1229" y="438.8" font-size="24" fill="#173A5E" font-weight="600">分位門檻 q = 0.999</text><text x="1229" y="511.0" font-size="25" fill="#A96800" font-weight="800">預訓練影像 penalty</text><text x="1229" y="553.0" font-size="24" fill="#173A5E" font-weight="600">抑制 S₁ 對一般影像</text><text x="1229" y="587.8" font-size="24" fill="#173A5E" font-weight="600">也過度模仿 Teacher</text><text x="64" y="766.0" font-size="27" fill="#2463C5" font-weight="800">使用階段：固定權重與尺度 → 新影像 → 同時計算 T、S、AE → 兩路差異 → 融合</text><rect x="48" y="819" width="1576" height="82" rx="16" fill="#FFF4CC" stroke="#E6C669" stroke-width="2"/><text x="70" y="871.0" font-size="27" fill="#614A14" font-weight="750">💡 訓練學正常，驗證定尺度，推論固定參數；三個階段的資料責任要分清。</text></svg>