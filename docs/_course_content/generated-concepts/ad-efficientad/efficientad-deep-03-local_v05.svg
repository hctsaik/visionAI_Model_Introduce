<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><title>Teacher 與 Student，如何變成一張局部圖？</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#173A5E"/></marker><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#F0F4F7"/><stop offset=".5" stop-color="#BACBD9"/><stop offset="1" stop-color="#E2EBF2"/></linearGradient></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#FCFCFA" stroke="#FCFCFA" stroke-width="2"/><text x="52" y="55.0" font-size="20" fill="#087F8C" font-weight="800">EFFICIENTAD  /  機制與證據</text><text x="52" y="114.0" font-size="44" fill="#173A5E" font-weight="850">Teacher 與 Student，如何變成一張局部圖？</text><text x="52" y="159.0" font-size="25" fill="#526477" font-weight="600">閱讀主線：局部差異  ·  原理依論文；工件與數值例為教學示意</text><rect x="60" y="212" width="44" height="44" rx="14" fill="#2463C5" stroke="#2463C5" stroke-width="2"/><text x="73" y="243.0" font-size="25" fill="white" font-weight="800">1</text><text x="120" y="244.0" font-size="28" fill="#2463C5" font-weight="800">同一位置，兩份描述</text><g transform="translate(76 312) scale(0.9583333333333334)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7890A8" stroke-width="2"/><path d="M 18 26 L 44 26 M 26 18 L 26 44" stroke="#173A5E" stroke-width="5"/><circle cx="76" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="76" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><path d="M 116 176 L 137 204 M 121 175 L 142 203" stroke="#C84343" stroke-width="5"/><text x="16" y="224.0" font-size="18" fill="#173A5E" font-weight="800">A-01</text></g><text x="65" y="611.0" font-size="26" fill="#173A5E" font-weight="600">Teacher：固定參考 T</text><text x="65" y="648.7" font-size="26" fill="#173A5E" font-weight="600">Student：第一組輸出 S₁</text><path d="M 330 423 L 400 423" stroke="#173A5E" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="426" y="212" width="44" height="44" rx="14" fill="#2463C5" stroke="#2463C5" stroke-width="2"/><text x="439" y="243.0" font-size="25" fill="white" font-weight="800">2</text><text x="486" y="244.0" font-size="28" fill="#2463C5" font-weight="800">相減、平方、跨通道平均</text><rect x="421" y="310" width="648" height="326" rx="18" fill="#F5F8FC" stroke="#CDDAE7" stroke-width="2"/><text x="449" y="357.0" font-size="25" fill="#526477" font-weight="600">單一位置，簡化為 2 個通道</text><text x="451" y="417.0" font-size="34" fill="#2463C5" font-weight="800">T = [2, 4]      S₁ = [1, 2]</text><text x="451" y="480.0" font-size="32" fill="#173A5E" font-weight="800">平方差 = [1, 4]</text><text x="451" y="550.0" font-size="30" fill="#C84343" font-weight="800">局部分數 = (1 + 4) ÷ 2 = 2.5</text><text x="446" y="689.0" font-size="25" fill="#173A5E" font-weight="600">每個空間位置都計算一次</text><text x="446" y="725.25" font-size="25" fill="#173A5E" font-weight="600">M local = mean channels (T − S₁)²</text><path d="M 1091 423 L 1153 423" stroke="#173A5E" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="1177" y="212" width="44" height="44" rx="14" fill="#2463C5" stroke="#2463C5" stroke-width="2"/><text x="1190" y="243.0" font-size="25" fill="white" font-weight="800">3</text><text x="1237" y="244.0" font-size="28" fill="#2463C5" font-weight="800">差異保留在原位置</text><rect x="1204" y="345" width="95" height="95" rx="8" fill="#E4F3F3" stroke="white" stroke-width="2"/><text x="1212" y="405.0" font-size="22" fill="#087F8C" font-weight="750">.1</text><rect x="1304" y="345" width="95" height="95" rx="8" fill="#E4F3F3" stroke="white" stroke-width="2"/><text x="1312" y="405.0" font-size="22" fill="#087F8C" font-weight="750">.1</text><rect x="1404" y="345" width="95" height="95" rx="8" fill="#E4F3F3" stroke="white" stroke-width="2"/><text x="1412" y="405.0" font-size="22" fill="#087F8C" font-weight="750">.1</text><rect x="1204" y="445" width="95" height="95" rx="8" fill="#E4F3F3" stroke="white" stroke-width="2"/><text x="1212" y="505.0" font-size="22" fill="#087F8C" font-weight="750">.1</text><rect x="1304" y="445" width="95" height="95" rx="8" fill="#E4F3F3" stroke="white" stroke-width="2"/><text x="1312" y="505.0" font-size="22" fill="#087F8C" font-weight="750">.2</text><rect x="1404" y="445" width="95" height="95" rx="8" fill="#E4F3F3" stroke="white" stroke-width="2"/><text x="1412" y="505.0" font-size="22" fill="#087F8C" font-weight="750">.1</text><rect x="1204" y="545" width="95" height="95" rx="8" fill="#E4F3F3" stroke="white" stroke-width="2"/><text x="1212" y="605.0" font-size="22" fill="#087F8C" font-weight="750">.1</text><rect x="1304" y="545" width="95" height="95" rx="8" fill="#FDE5DC" stroke="white" stroke-width="2"/><text x="1312" y="605.0" font-size="22" fill="#C84343" font-weight="750">2.5</text><rect x="1404" y="545" width="95" height="95" rx="8" fill="#E4F3F3" stroke="white" stroke-width="2"/><text x="1412" y="605.0" font-size="22" fill="#087F8C" font-weight="750">.1</text><text x="1190" y="710.0" font-size="25" fill="#173A5E" font-weight="600">紅格：描述不一致</text><text x="1190" y="746.25" font-size="25" fill="#173A5E" font-weight="600">不是直接辨識「刮痕」類別</text><text x="61" y="776.0" font-size="23" fill="#526477" font-weight="600">所有向量與分數皆為教學示意；異常也可能被模仿得很好，因此需驗證漏檢。</text><rect x="48" y="819" width="1576" height="82" rx="16" fill="#FFF4CC" stroke="#E6C669" stroke-width="2"/><text x="70" y="871.0" font-size="27" fill="#614A14" font-weight="750">💡 局部圖將每個位置的描述差異留下來；高差異是線索，不是缺陷分類。</text></svg>