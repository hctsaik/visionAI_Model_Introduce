  <rect x="40" y="32" width="150" height="32" rx="16" fill="#E6F0FF"/><text x="58" y="54.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="16" font-weight="800" fill="#1769E0">最近鄰方法比較</text><text x="40" y="116" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="43" font-weight="900" fill="#071A3B">比它怎麼形成候選</text><text x="40" y="182" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="500" fill="#50698F">同樣的 AOI 問題，方法可能把正常表示成不同東西；先分清它在比較什麼，再比較結果。</text><text x="1630" y="57.0" text-anchor="end" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#5C7395">EfficientAD</text><rect x="77" y="260" width="478" height="500" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><rect x="77" y="260" width="478" height="68" rx="24" fill="#1769E0"/><rect x="77" y="304" width="478" height="24" fill="#1769E0"/><text x="105" y="304.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">EfficientAD</text><g data-visual-cue="efficientad_teacher_student" data-renderer-art="anomaly" data-primitive="teacher_student_paths" data-semantic-scene="teacher_student_paths" data-semantic-entities="roi|teacher|student" data-specialist-coverage="roi|teacher|student" data-semantic-relation="compare two declared feature paths" data-must-show="EfficientAD：PDN student＋global AE 在 frozen PDN teacher 下的已校正兩條路徑 | candidate output: fused local/global discrepancy 高 | Same input, ROI, preprocess, truth, and evidence gate; do not switch the comparison contract." data-not-claim="EfficientAD output is a candidate, not verified field truth; still use the evidence gate."><title>EfficientAD：PDN student＋global AE 在 frozen PDN teacher 下的已