lobal discrepancy map、版本化 fusion 後候選圖與 image score；不是缺陷類別、校準 defect</text><text x="112" y="889" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="600" fill="#674500">probability 或自動 release。</text>
