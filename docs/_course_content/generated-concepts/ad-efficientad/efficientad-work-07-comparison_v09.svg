<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><title>用同一個工作需求，對照三種起步方式</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#173A5E"/></marker><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#F0F4F7"/><stop offset=".5" stop-color="#BACBD9"/><stop offset="1" stop-color="#E2EBF2"/></linearGradient></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#FCFCFA" stroke="#FCFCFA" stroke-width="2"/><text x="52" y="55.0" font-size="20" fill="#087F8C" font-weight="800">EFFICIENTAD  /  工作與選型</text><text x="52" y="114.0" font-size="44" fill="#173A5E" font-weight="850">用同一個工作需求，對照三種起步方式</text><text x="52" y="159.0" font-size="25" fill="#526477" font-weight="600">工作案例導讀  ·  工件、熱區與輪廓均為教學示意</text><text x="61" y="225.0" font-size="28" fill="#2463C5" font-weight="800">先比資料與輸出，再安排同條件試跑；這裡沒有捏造實測排名</text><text x="70" y="285.0" font-size="30" fill="#2463C5" font-weight="800">EfficientAD</text><g transform="translate(174 313) scale(0.6666666666666666)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7890A8" stroke-width="2"/><path d="M 18 26 L 44 26 M 26 18 L 26 44" stroke="#173A5E" stroke-width="5"/><circle cx="76" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="76" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><path d="M 116 176 L 137 204 M 121 175 L 142 203" stroke="#C84343" stroke-width="5"/><text x="16" y="224.0" font-size="18" fill="#173A5E" font-weight="800">A-01</text></g><circle cx="260.66666666666663" cy="439.0" r="28.666666666666664" fill="#C84343" opacity="0.13"/><circle cx="260.66666666666663" cy="439.0" r="19.333333333333332" fill="#C84343" opacity="0.23"/><circle cx="260.66666666666663" cy="439.0" r="11.333333333333332" fill="#C84343" opacity="0.4"/><text x="610" y="285.0" font-size="30" fill="#2463C5" font-weight="800">PatchCore</text><g transform="translate(714 313) scale(0.6666666666666666)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7890A8" stroke-width="2"/><path d="M 18 26 L 44 26 M 26 18 L 26 44" stroke="#173A5E" stroke-width="5"/><circle cx="76" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="76" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><path d="M 116 176 L 137 204 M 121 175 L 142 203" stroke="#C84343" stroke-width="5"/><text x="16" y="224.0" font-size="18" fill="#173A5E" font-weight="800">A-01</text></g><circle cx="800.6666666666666" cy="439.0" r="28.666666666666664" fill="#C84343" opacity="0.13"/><circle cx="800.6666666666666" cy="439.0" r="19.333333333333332" fill="#C84343" opacity="0.23"/><circle cx="800.6666666666666" cy="439.0" r="11.333333333333332" fill="#C84343" opacity="0.4"/><text x="1150" y="285.0" font-size="30" fill="#087F8C" font-weight="800">監督式分割</text><g transform="translate(1254 313) scale(0.6666666666666666)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7890A8" stroke-width="2"/><path d="M 18 26 L 44 26 M 26 18 L 26 44" stroke="#173A5E" stroke-width="5"/><circle cx="76" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="76" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><path d="M 116 176 L 137 204 M 121 175 L 142 203" stroke="#C84343" stroke-width="5"/><text x="16" y="224.0" font-size="18" fill="#173A5E" font-weight="800">A-01</text></g><path d="M1329.3333333333333 429.0 L1336.6666666666667 427.0 L1350.6666666666667 449.0 L1344.0 453.0 Z" fill="#F5B944" fill-opacity=".65" stroke="#8E5500" stroke-width="3"/><text x="70" y="521.0" font-size="24" fill="#173A5E" font-weight="600">正常圖 → 訓練</text><text x="70" y="555.8" font-size="24" fill="#173A5E" font-weight="600">換產品：收新資料、評估重訓</text><text x="610" y="521.0" font-size="24" fill="#173A5E" font-weight="600">正常圖 → 建特徵庫</text><text x="610" y="555.8" font-size="24" fill="#173A5E" font-weight="600">換產品：調整參考庫並驗證</text><text x="1150" y="521.0" font-size="24" fill="#173A5E" font-weight="600">輪廓標註 → 訓練</text><text x="1150" y="555.8" font-size="24" fill="#173A5E" font-weight="600">換產品：補標註、評估重訓</text><rect x="56" y="600" width="1560" height="151" rx="18" fill="#F5F8FC" stroke="#CDDAE7" stroke-width="2"/><text x="77" y="638.0" font-size="27" fill="#2463C5" font-weight="800">共同試跑條件</text><text x="77" y="680.0" font-size="24" fill="#173A5E" font-weight="600">同批獨立測試圖、相同硬體與輸入範圍；記錄正常訓練張數、解析度、版本、批次大小</text><text x="77" y="722.0" font-size="24" fill="#173A5E" font-weight="600">再量：峰值記憶體／顯存、完整處理時間、關鍵漏檢、誤報與人工覆核量</text><text x="56" y="791.0" font-size="21" fill="#526477" font-weight="600">PatchCore 另記特徵庫保留比例與查詢設定；EfficientAD 另記 S／M 版本與訓練成本。缺共同測試，不判誰勝。</text><rect x="48" y="819" width="1576" height="82" rx="16" fill="#FFF4CC" stroke="#E6C669" stroke-width="2"/><text x="70" y="871.0" font-size="27" fill="#614A14" font-weight="750">💡 先選資料與輸出相符的方法，再比較現場成本；模型名稱不構成選擇理由。</text></svg>