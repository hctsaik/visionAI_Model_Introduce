<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">EfficientAD 的局部與全局 evidence 反事實</title><desc id="desc">微小刮痕與整體排列錯位各可能讓不同 branch 的 evidence 變強或變弱，需以 local-only、global-only、fused 的真實 holdout ablation 驗證。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D9485F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0B2858"/><rect x="40" y="34" width="164" height="38" rx="19" fill="#E8F2FF" stroke="#E8F2FF" stroke-width="0"/><text x="122.0" y="60.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">反事實 04</text><text x="40" y="125.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="39" font-weight="900" fill="#081A38" text-anchor="start">兩個受控反事實：局部刮痕與整體錯位，哪條訊號較可能淡？</text><text x="40" y="171.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="500" fill="#536A91" text-anchor="start">這是『可能的盲區』而非固定規則；權重只能用同一支援集與真實 holdout 的 local-only / global-only / fused ablation 決定。</text><rect x="1334" y="36" width="298" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1483" y="68.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="800" fill="#1769E0" text-anchor="middle">EfficientAD</text><rect x="40" y="230" width="758" height="578" rx="26" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="76" y="280.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="27" font-weight="900" fill="#0B2858" text-anchor="start">A．同一件工件：一條很小的表面刮痕</text><text x="76" y="313.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="600" fill="#536A91" text-anchor="start">局部分支較可能保留訊號；global 表示可能把它稀釋。</text><clipPath id="crop-scratch-78-349-704-200"><rect x="78" y="349" width="294" height="262" rx="20"/></clipPath><g clip-path="url(#crop-scratch-78-349-704-200)"><svg x="78" y="349" width="294" height="262" viewBox="704 200 900 650" preserveAspectRatio="xMidYMid slice"><image href="efficientad-industrial-aoi-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="78" y="349" width="294" height="262" rx="20" fill="none" stroke="#F38B00" stroke-width="2"/><rect x="260" y="515" width="72" height="72" rx="9" fill="none" stroke="#F38B00" stroke-width="5"/><path d="M390 480 L456 430" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><path d="M390 513 L456 604" fill="none" stroke="#00A8C6" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><text x="565" y="366.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="900" fill="#0B2858" text-anchor="middle">local evidence</text><rect x="456" y="390" width="216" height="128" rx="16" fill="#F8FBFF" stroke="#1769E0" stroke-width="2"/><rect x="476" y="411" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="513" y="411" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="550" y="411" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="587" y="411" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="624" y="411" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="476" y="456" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="513" y="456" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="550" y="456" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="587" y="456" width="28" height="32" rx="5" fill="#F38B00" fill-opacity="0.88" stroke="#F38B00" stroke-width="0"/><rect x="624" y="456" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><text x="564" y="505.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#F38B00" text-anchor="middle">strong</text><text x="565" y="552.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="900" fill="#0B2858" text-anchor="middle">global evidence</text><rect x="456" y="576" width="216" height="128" rx="16" fill="#F8FBFF" stroke="#00A8C6" stroke-width="2"/><rect x="476" y="597" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="513" y="597" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="550" y="597" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="587" y="597" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="624" y="597" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="476" y="642" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="513" y="642" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="550" y="642" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="587" y="642" width="28" height="32" rx="5" fill="#F3D8A2" fill-opacity="0.88" stroke="#F3D8A2" stroke-width="0"/><rect x="624" y="642" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><text x="564" y="691.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#536A91" text-anchor="middle">may be weak</text><text x="419" y="735.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">先確認 effective pixels、stride、crop 與 registration；不要從示意圖推門檻。</text><rect x="834" y="230" width="798" height="578" rx="26" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="870" y="280.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="27" font-weight="900" fill="#0B2858" text-anchor="start">B．相同治具：局部都像正常，但四格排列位置錯了</text><text x="870" y="313.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="600" fill="#536A91" text-anchor="start">global 表示可能提供訊號；單一局部 grid 不一定理解組裝關係。</text><clipPath id="crop-arrangement-872-349-690-100"><rect x="872" y="349" width="250" height="262" rx="20"/></clipPath><g clip-path="url(#crop-arrangement-872-349-690-100)"><svg x="872" y="349" width="250" height="262" viewBox="690 100 820 670" preserveAspectRatio="xMidYMid slice"><image href="efficientad-industrial-aoi-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="872" y="349" width="250" height="262" rx="20" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="926" y="396" width="54" height="39" rx="6" fill="#FFFFFF" stroke="#1769E0" stroke-width="3"/><rect x="992" y="396" width="54" height="39" rx="6" fill="#FFFFFF" stroke="#1769E0" stroke-width="3"/><rect x="926" y="445" width="54" height="39" rx="6" fill="#FFFFFF" stroke="#1769E0" stroke-width="3"/><rect x="1018" y="429" width="54" height="39" rx="6" fill="#FFF7EA" stroke="#F38B00" stroke-width="3"/><text x="997" y="649.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#F38B00" text-anchor="middle">橘色方格刻意位移</text><path d="M1140 480 L1204 430" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><path d="M1140 513 L1204 604" fill="none" stroke="#00A8C6" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><text x="1312" y="366.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="900" fill="#0B2858" text-anchor="middle">local evidence</text><rect x="1204" y="390" width="216" height="128" rx="16" fill="#F8FBFF" stroke="#1769E0" stroke-width="2"/><rect x="1224" y="411" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="1261" y="411" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="1298" y="411" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="1335" y="411" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="1372" y="411" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="1224" y="456" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="1261" y="456" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="1298" y="456" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="1335" y="456" width="28" height="32" rx="5" fill="#F3D8A2" fill-opacity="0.88" stroke="#F3D8A2" stroke-width="0"/><rect x="1372" y="456" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><text x="1312" y="505.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#536A91" text-anchor="middle">may be weak</text><text x="1312" y="552.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="900" fill="#0B2858" text-anchor="middle">global evidence</text><rect x="1204" y="576" width="216" height="128" rx="16" fill="#F8FBFF" stroke="#00A8C6" stroke-width="2"/><rect x="1224" y="597" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="1261" y="597" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="1298" y="597" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="1335" y="597" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="1372" y="597" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="1224" y="642" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="1261" y="642" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="1298" y="642" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><rect x="1335" y="642" width="28" height="32" rx="5" fill="#F38B00" fill-opacity="0.88" stroke="#F38B00" stroke-width="0"/><rect x="1372" y="642" width="28" height="32" rx="5" fill="#A8C9FF" fill-opacity="0.58" stroke="#A8C9FF" stroke-width="0"/><text x="1312" y="691.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#F38B00" text-anchor="middle">strong</text><text x="1233" y="735.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">若任務是缺件／定位規則，仍要驗證 detector、keypoint 或 rule evidence，而非假定熱圖懂邏輯。</text><rect x="40" y="849" width="1592" height="52" rx="22" fill="#FFF8DE" stroke="#F1B828" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="800" fill="#674500" text-anchor="middle">先把兩條 evidence 拆開驗，才知道 fusion 真正增加什麼；不要因一張融合圖好看就刪掉 ablation。</text></svg>