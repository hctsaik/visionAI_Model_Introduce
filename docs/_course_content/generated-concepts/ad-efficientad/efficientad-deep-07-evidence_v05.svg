<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><title>S 與 M 怎麼選：把準確度和成本一起看</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#173A5E"/></marker><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#F0F4F7"/><stop offset=".5" stop-color="#BACBD9"/><stop offset="1" stop-color="#E2EBF2"/></linearGradient></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#FCFCFA" stroke="#FCFCFA" stroke-width="2"/><text x="52" y="55.0" font-size="20" fill="#087F8C" font-weight="800">EFFICIENTAD  /  機制與證據</text><text x="52" y="114.0" font-size="44" fill="#173A5E" font-weight="850">S 與 M 怎麼選：把準確度和成本一起看</text><text x="52" y="159.0" font-size="25" fill="#526477" font-weight="600">資料依據：論文 Table 1  ·  RTX A6000  ·  論文實測均值</text><text x="63" y="236.0" font-size="31" fill="#2463C5" font-weight="800">論文 Table 1：同一測試平台的 S／M 取捨</text><text x="66" y="301.0" font-size="26" fill="#526477" font-weight="700">模型</text><text x="476" y="301.0" font-size="26" fill="#526477" font-weight="700">平均偵測 AU-ROC</text><text x="878" y="301.0" font-size="26" fill="#526477" font-weight="700">推論延遲</text><text x="1280" y="301.0" font-size="26" fill="#526477" font-weight="700">吞吐量</text><rect x="54" y="340" width="1560" height="95" rx="18" fill="#F5F8FC" stroke="#CDDAE7" stroke-width="2"/><text x="70" y="397.0" font-size="33" fill="#087F8C" font-weight="850">EfficientAD-S</text><text x="486" y="397.0" font-size="37" fill="#087F8C" font-weight="850">95.4%</text><text x="890" y="397.0" font-size="37" fill="#087F8C" font-weight="850">2.2 ms</text><text x="1287" y="397.0" font-size="32" fill="#087F8C" font-weight="850">614 張／秒</text><rect x="54" y="458" width="1560" height="95" rx="18" fill="#F5F8FC" stroke="#CDDAE7" stroke-width="2"/><text x="70" y="515.0" font-size="33" fill="#2463C5" font-weight="850">EfficientAD-M</text><text x="486" y="515.0" font-size="37" fill="#2463C5" font-weight="850">96.0%</text><text x="890" y="515.0" font-size="37" fill="#2463C5" font-weight="850">4.5 ms</text><text x="1287" y="515.0" font-size="32" fill="#2463C5" font-weight="850">269 張／秒</text><text x="70" y="617.0" font-size="26" fill="#173A5E" font-weight="600">AU-ROC 是三個資料集平均；延遲 batch = 1，吞吐量 batch = 16。</text><text x="70" y="661.0" font-size="26" fill="#173A5E" font-weight="600">硬體：RTX A6000；以上為論文測試均值，非本工件測量，也非產線 P95。</text><rect x="68" y="692" width="742" height="116" rx="18" fill="#F5F8FC" stroke="#CDDAE7" stroke-width="2"/><text x="88" y="727.0" font-size="24" fill="#2463C5" font-weight="800">M 增加容量</text><text x="88" y="766.0" font-size="23" fill="#526477" font-weight="600">隱藏通道加寬，加入 1 × 1 卷積；需付出運算成本</text><rect x="831" y="692" width="770" height="116" rx="18" fill="#F5F8FC" stroke="#CDDAE7" stroke-width="2"/><text x="851" y="727.0" font-size="24" fill="#087F8C" font-weight="800">現場要量完整流程</text><text x="851" y="766.0" font-size="23" fill="#526477" font-weight="600">P95 是延遲分布的第 95 百分位；取像與傳輸也要算</text><rect x="48" y="819" width="1576" height="82" rx="16" fill="#FFF4CC" stroke="#E6C669" stroke-width="2"/><text x="70" y="871.0" font-size="27" fill="#614A14" font-weight="750">💡 論文數據用來建立候選；真正選型需同時驗證關鍵漏檢、誤報與端到端延遲。</text></svg>