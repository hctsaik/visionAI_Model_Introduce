<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><title>熱區告訴你看哪裡，輪廓回答另一個問題</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#173A5E"/></marker><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#F0F4F7"/><stop offset=".5" stop-color="#BACBD9"/><stop offset="1" stop-color="#E2EBF2"/></linearGradient></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#FCFCFA" stroke="#FCFCFA" stroke-width="2"/><text x="52" y="55.0" font-size="20" fill="#087F8C" font-weight="800">EFFICIENTAD  /  工作與選型</text><text x="52" y="114.0" font-size="44" fill="#173A5E" font-weight="850">熱區告訴你看哪裡，輪廓回答另一個問題</text><text x="52" y="159.0" font-size="25" fill="#526477" font-weight="600">工作案例導讀  ·  工件、熱區與輪廓均為教學示意</text><rect x="64" y="208" width="44" height="44" rx="14" fill="#2463C5" stroke="#2463C5" stroke-width="2"/><text x="77" y="239.0" font-size="25" fill="white" font-weight="800">1</text><text x="124" y="240.0" font-size="28" fill="#2463C5" font-weight="800">一張待查工件</text><g transform="translate(100 325) scale(1.1583333333333334)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7890A8" stroke-width="2"/><path d="M 18 26 L 44 26 M 26 18 L 26 44" stroke="#173A5E" stroke-width="5"/><circle cx="76" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="76" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><path d="M 116 176 L 137 204 M 121 175 L 142 203" stroke="#C84343" stroke-width="5"/><text x="16" y="224.0" font-size="18" fill="#173A5E" font-weight="800">A-01</text></g><text x="67" y="668.0" font-size="28" fill="#173A5E" font-weight="600">你的下一步是找位置</text><text x="67" y="708.6" font-size="28" fill="#173A5E" font-weight="600">還是要量出輪廓？</text><path d="M 405 470 L 477 470" stroke="#173A5E" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="516" y="208" width="44" height="44" rx="14" fill="#2463C5" stroke="#2463C5" stroke-width="2"/><text x="529" y="239.0" font-size="25" fill="white" font-weight="800">2</text><text x="576" y="240.0" font-size="28" fill="#2463C5" font-weight="800">EfficientAD：可疑熱區</text><g transform="translate(594 319) scale(1.1625)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7890A8" stroke-width="2"/><path d="M 18 26 L 44 26 M 26 18 L 26 44" stroke="#173A5E" stroke-width="5"/><circle cx="76" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="76" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><path d="M 116 176 L 137 204 M 121 175 L 142 203" stroke="#C84343" stroke-width="5"/><text x="16" y="224.0" font-size="18" fill="#173A5E" font-weight="800">A-01</text></g><circle cx="745.125" cy="538.7125" r="49.987500000000004" fill="#C84343" opacity="0.13"/><circle cx="745.125" cy="538.7125" r="33.712500000000006" fill="#C84343" opacity="0.23"/><circle cx="745.125" cy="538.7125" r="19.762500000000003" fill="#C84343" opacity="0.4"/><text x="527" y="653.0" font-size="27" fill="#2463C5" font-weight="600">看哪裡比較不像正常</text><text x="527" y="692.15" font-size="27" fill="#2463C5" font-weight="600">適合先篩查，再對原圖覆核</text><rect x="1077" y="208" width="44" height="44" rx="14" fill="#2463C5" stroke="#2463C5" stroke-width="2"/><text x="1090" y="239.0" font-size="25" fill="white" font-weight="800">3</text><text x="1137" y="240.0" font-size="28" fill="#2463C5" font-weight="800">分割方法：預測輪廓</text><g transform="translate(1194 319) scale(1.1625)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7890A8" stroke-width="2"/><path d="M 18 26 L 44 26 M 26 18 L 26 44" stroke="#173A5E" stroke-width="5"/><circle cx="76" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="76" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><path d="M 116 176 L 137 204 M 121 175 L 142 203" stroke="#C84343" stroke-width="5"/><text x="16" y="224.0" font-size="18" fill="#173A5E" font-weight="800">A-01</text></g><path d="M1325.3625 521.275 L1338.15 517.7875 L1362.5625 556.15 L1350.9375 563.125 Z" fill="#F5B944" fill-opacity=".65" stroke="#8E5500" stroke-width="3"/><text x="1088" y="653.0" font-size="26" fill="#087F8C" font-weight="600">適合已定義的目標輪廓</text><text x="1088" y="690.7" font-size="26" fill="#087F8C" font-weight="600">像素面積仍需驗證，尺寸另需校正</text><text x="56" y="791.0" font-size="21" fill="#526477" font-weight="600">兩側是不同輸出目的的教學示意，不是同一實驗的優劣排名；本課不以熱圖當精密量測。</text><rect x="48" y="819" width="1576" height="82" rx="16" fill="#FFF4CC" stroke="#E6C669" stroke-width="2"/><text x="70" y="871.0" font-size="27" fill="#614A14" font-weight="750">💡 先決定要位置線索還是輪廓，才能準備對的資料、選對輸出方法。</text></svg>