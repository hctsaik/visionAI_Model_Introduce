-weight="800">3</text><text x="1196" y="243.0" font-size="28" fill="#087F8C" font-weight="800">少一個嵌件</text><g transform="translate(1222 307) scale(1.0291666666666666)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7890A8" stroke-width="2"/><path d="M 18 26 L 44 26 M 26 18 L 26 44" stroke="#173A5E" stroke-width="5"/><circle cx="76" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="76" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><text x="16" y="224.0" font-size="18" fill="#173A5E" font-weight="800">A-01</text></g><text x="1141" y="623.0" font-size="27" fill="#173A5E" font-weight="600">查整體圖能否補足</text><text x="1141" y="662.15" font-size="27" fill="#173A5E" font-weight="600">驗證數量／配置異常召回</text><rect x="62" y="714" width="1547" height="81" rx="18" fill="#F5F8FC" stroke="#CDDAE7" stroke-width="2"/><text x="82" y="764.0" font-size="27" fill="#173A5E" font-weight="600">新條件反例：換光照後全圖升分 → 先查輸入漂移與正常尺度，再決定是否調整模型。</text><rect x="48" y="819" width="1576" height="82" rx="16" fill="#FFF4CC" stroke="#E6C669" stroke-width="2"/><text x="70" y="871.0" font-size="27" fill="#614A14" font-weight="750">💡 以受控反例驗證兩路是否互補，再把可追溯的證據接到現場判定。</text></svg>