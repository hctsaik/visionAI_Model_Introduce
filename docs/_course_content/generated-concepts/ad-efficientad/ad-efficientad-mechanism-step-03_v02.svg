<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">全局分支補看整體</title><desc id="desc">global AE 分支從整體表示產生另一份 evidence，用來補局部格子各自正常但整體不尋常的情況。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="reconstruction_residual_efficientad_global_ae" data-renderer-art="anomaly" data-primitive="efficientad_global_ae_gap" data-semantic-scene="efficientad_global_ae_gap" data-semantic-entities="global_ae|global_reconstruction|global_gap" data-specialist-coverage="global_ae|global_reconstruction|global_gap" data-semantic-relation="add a global reconstruction branch to the local evidence" data-must-show="整張 ROI 的 global representation | AE path | global discrepancy evidence | 與 local map 分開的尺度標籤" data-not-claim="global discrepancy 必定是邏輯異常檢測器。"><title>全局分支補看整體</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="178.27999999999997" y1="132.44" x2="326.12" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="393.88" y1="132.44" x2="535.56" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="global_ae" data-entity-label-full="global AE"><rect x="118.91034482758619" y="114.73885057471264" width="17.70114942528736" height="35.40229885057472" rx="5" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><rect x="151.48045977011492" y="114.