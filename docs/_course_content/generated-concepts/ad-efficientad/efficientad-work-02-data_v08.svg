<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><title>不用先標齊缺陷，但正常資料要挑對</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#173A5E"/></marker><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#F0F4F7"/><stop offset=".5" stop-color="#BACBD9"/><stop offset="1" stop-color="#E2EBF2"/></linearGradient></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#FCFCFA" stroke="#FCFCFA" stroke-width="2"/><text x="52" y="55.0" font-size="20" fill="#087F8C" font-weight="800">EFFICIENTAD  /  工作與選型</text><text x="52" y="114.0" font-size="44" fill="#173A5E" font-weight="850">不用先標齊缺陷，但正常資料要挑對</text><text x="52" y="159.0" font-size="25" fill="#526477" font-weight="600">工作案例導讀  ·  工件、熱區與輪廓均為教學示意</text><rect x="57" y="208" width="44" height="44" rx="14" fill="#2463C5" stroke="#2463C5" stroke-width="2"/><text x="70" y="239.0" font-size="25" fill="white" font-weight="800">1</text><text x="117" y="240.0" font-size="28" fill="#2463C5" font-weight="800">收正常變動</text><g transform="translate(72 315) scale(0.5625)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7890A8" stroke-width="2"/><path d="M 18 26 L 44 26 M 26 18 L 26 44" stroke="#173A5E" stroke-width="5"/><circle cx="76" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="76" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="164" r="18" fill="#DCE