dth="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><text x="16" y="224.0" font-size="18" fill="#173A5E" font-weight="800">N-03</text></g></g><text x="72" y="654.0" font-size="18" fill="#526477" font-weight="600">位置微偏</text><g transform="translate(242 495) scale(0.5625)"><rect x="0" y="0" width="240" height="240" rx="24" fill="#ACBECE" stroke="#7890A8" stroke-width="2"/><path d="M 18 26 L 44 26 M 26 18 L 26 44" stroke="#173A5E" stroke-width="5"/><circle cx="76" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="76" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><text x="16" y="224.0" font-size="18" fill="#173A5E" font-weight="800">N-04</text></g><text x="242" y="654.0" font-size="18" fill="#526477" font-weight="600">另一批色澤</text><text x="65" y="704.0" font-size="26" fill="#173A5E" font-weight="600">批次、位置與可接受光照</text><text x="65" y="741.7" font-size="26" fill="#173A5E" font-weight="600">都要有代表影像</text><path d="M 412 444 L 480 444" stroke="#173A5E" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="507" y="208" width="44" height="44" rx="14" fill="#2463C5" stroke="#2463C5" stroke-width="2"/><text x="520" y="239.0" font-size="25" fill="white" font-weight="800">2</text><text x="567" y="240.0" font-size="28" fill="#2463C5" font-weight="800">先排除混入的異常</text><g transform="translate(559 319) scale(1.0208333333333333)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7890A8" stroke-width="2"/><path d="M 18 26 L 44 26 M 26 18 L 26 44" stroke="#173A5E" stroke-width="5"/><circle cx="76" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="76" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><path d="M 116 176 L 137 204 M 121 175 L 142 203" stroke="#C84343" stroke-width="5"/><text x="16" y="224.0" font-size="18" fill="#173A5E" font-weight="800">X-01</text></g><circle cx="693" cy="512" r="36" fill="none" stroke="#C84343" stroke-width="5"/><text x="522" y="652.0" font-size="27" fill="#C84343" font-weight="600">這張不要當正常教給模型</text><text x="522" y="691.15" font-size="27" fill="#C84343" font-weight="600">先由熟悉產品的人確認</text><path d="M 855 444 L 920 444" stroke="#173A5E" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="945" y="208" width="44" height="44" rx="14" fill="#2463C5" stroke="#2463C5" stroke-width="2"/><text x="958" y="239.0" font-size="25" fill="white" font-weight="800">3</text><text x="1005" y="240.0" font-size="28" fill="#2463C5" font-weight="800">保留不同用途的資料</text><rect x="967" y="293" width="624" height="132" rx="18" fill="#F5F8FC" stroke="#CDDAE7" stroke-width="2"/><text x="989" y="333.0" font-size="28" fill="#2463C5" font-weight="800">正常訓練圖</text><text x="989" y="377.0" font-size="25" fill="#173A5E" font-weight="600">用來建立「平常的樣子」</text><rect x="967" y="450" width="624" height="132" rx="18" fill="#F5F8FC" stroke="#CDDAE7" stroke-width="2"/><text x="989" y="490.0" font-size="28" fill="#087F8C" font-weight="800">另一批正常驗證圖</text><text x="989" y="534.0" font-size="25" fill="#173A5E" font-weight="600">決定正常波動與判定尺度</text><rect x="967" y="607" width="624" height="132" rx="18" fill="#F5F8FC" stroke="#CDDAE7" stroke-width="2"/><text x="989" y="647.0" font-size="28" fill="#A96800" font-weight="800">獨立測試：正常品＋實際異常</text><text x="989" y="691.0" font-size="25" fill="#173A5E" font-weight="600">確認漏檢、誤報與人工覆核量</text><text x="56" y="791.0" font-size="21" fill="#526477" font-weight="600">不必先逐類標註所有缺陷來訓練；仍要清理正常資料，並收集異常案例驗證效果。</text><rect x="48" y="819" width="1576" height="82" rx="16" fill="#FFF4CC" stroke="#E6C669" stroke-width="2"/><text x="70" y="871.0" font-size="27" fill="#614A14" font-weight="750">💡 省下逐類缺陷標註，不等於省掉正常資料確認與異常測試。</text></svg>