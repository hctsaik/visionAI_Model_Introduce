<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><title>兩張圖不能直接相加：先讓分數尺度對得上</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#173A5E"/></marker><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#F0F4F7"/><stop offset=".5" stop-color="#BACBD9"/><stop offset="1" stop-color="#E2EBF2"/></linearGradient></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#FCFCFA" stroke="#FCFCFA" stroke-width="2"/><text x="52" y="55.0" font-size="20" fill="#087F8C" font-weight="800">EFFICIENTAD  /  機制與證據</text><text x="52" y="114.0" font-size="44" fill="#173A5E" font-weight="850">兩張圖不能直接相加：先讓分數尺度對得上</text><text x="52" y="159.0" font-size="25" fill="#526477" font-weight="600">閱讀主線：分數推導  ·  原理依論文；工件與數值例為教學示意</text><rect x="60" y="211" width="44" height="44" rx="14" fill="#2463C5" stroke="#2463C5" stroke-width="2"/><text x="73" y="242.0" font-size="25" fill="white" font-weight="800">1</text><text x="120" y="243.0" font-size="28" fill="#2463C5" font-weight="800">用正常驗證集定尺度</text><text x="64" y="300.0" font-size="28" fill="#173A5E" font-weight="600">每一路分開求分位數</text><text x="64" y="340.6" font-size="28" fill="#173A5E" font-weight="600">qₐ：90% 分位</text><text x="64" y="381.2" font-size="28" fill="#173A5E" font-weight="600">qᵦ：99.5% 分位</text><text x="64" y="486.0" font-size="39" fill="#087F8C" font-weight="850">qₐ → 0</text><text x="64" y="542.55" font-size="39" fill="#087F8C" font-weight="850">qᵦ → 0.1</text><text x="64" y="651.0" font-size="24" fill="#173A5E" font-weight="600">參數在推論前固定</text><text x="64" y="685.8" font-size="24" fill="#173A5E" font-weight="600">分數可超過 0.1，也可為負</text><path d="M 397 422 L 462 422" stroke="#173A5E" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="486" y="211" width="44" height="44" rx="14" fill="#2463C5" stroke="#2463C5" stroke-width="2"/><text x="499" y="242.0" font-size="25" fill="white" font-weight="800">2</text><text x="546" y="243.0" font-size="28" fill="#2463C5" font-weight="800">同一位置的數值推導</text><rect x="482" y="283" width="644" height="202" rx="18" fill="#EDF3FB" stroke="#CDDAE7" stroke-width="2"/><text x="507" y="326.0" font-size="25" fill="#2463C5" font-weight="800">局部：m = 2.5，qₐ = 0.5，qᵦ = 1.5</text><text x="507" y="390.0" font-size="26" fill="#173A5E" font-weight="600">L = 0.1 × (2.5 − 0.5) ÷ (1.5 − 0.5)</text><text x="507" y="448.0" font-size="35" fill="#2463C5" font-weight="850">L = 0.20</text><rect x="482" y="509" width="644" height="202" rx="18" fill="#E7F4F1" stroke="#CDDAE7" stroke-width="2"/><text x="507" y="552.0" font-size="26" fill="#087F8C" font-weight="800">整體：m = 2，qₐ = 1，qᵦ = 6</text><text x="507" y="616.0" font-size="27" fill="#173A5E" font-weight="600">G = 0.1 × (2 − 1) ÷ (6 − 1)</text><text x="507" y="675.0" font-size="35" fill="#087F8C" font-weight="850">G = 0.02</text><path d="M 1141 422 L 1200 422" stroke="#173A5E" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="1211" y="211" width="44" height="44" rx="14" fill="#2463C5" stroke="#2463C5" stroke-width="2"/><text x="1224" y="242.0" font-size="25" fill="white" font-weight="800">3</text><text x="1271" y="243.0" font-size="28" fill="#2463C5" font-weight="800">融合後再判讀</text><text x="1220" y="336.0" font-size="25" fill="#173A5E" font-weight="600">此位置的融合分數</text><text x="1220" y="399.0" font-size="28" fill="#173A5E" font-weight="600">(0.20 + 0.02) ÷ 2</text><text x="1220" y="464.0" font-size="48" fill="#C84343" font-weight="850">= 0.11</text><text x="1220" y="562.0" font-size="24" fill="#173A5E" font-weight="600">整張圖逐位置計算</text><text x="1220" y="596.8" font-size="24" fill="#173A5E" font-weight="600">整圖分數 = 融合圖最大值</text><text x="1220" y="631.6" font-size="24" fill="#173A5E" font-weight="600">放大熱圖以對回原圖</text><text x="61" y="777.0" font-size="23" fill="#526477" font-weight="600">數字為教學示意；通式 N(m) = 0.1 × (m − qₐ) / (qᵦ − qₐ)，分母須有效且不為零。</text><rect x="48" y="819" width="1576" height="82" rx="16" fill="#FFF4CC" stroke="#E6C669" stroke-width="2"/><text x="70" y="871.0" font-size="27" fill="#614A14" font-weight="750">💡 先用正常驗證資料對齊尺度，再融合；分數大小與決策門檻是不同問題。</text></svg>