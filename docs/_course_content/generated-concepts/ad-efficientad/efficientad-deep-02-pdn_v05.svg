ze="22" fill="#087F8C" font-weight="750">i</text><text x="1090" y="692.0" font-size="25" fill="#173A5E" font-weight="600">每個位置是一個 C 維描述向量</text><text x="1090" y="728.25" font-size="25" fill="#173A5E" font-weight="600">S 版每個向量對應 33 × 33 像素區域</text><text x="64" y="776.0" font-size="23" fill="#526477" font-weight="600">PDN = Patch Description Network；網格與層尺寸為結構示意，非等比例張量圖。</text><rect x="48" y="819" width="1576" height="82" rx="16" fill="#FFF4CC" stroke="#E6C669" stroke-width="2"/><text x="70" y="871.0" font-size="27" fill="#614A14" font-weight="750">💡 速度來自輕量特徵與降採樣；能否看見小缺陷仍取決於輸入訊號。</text></svg>