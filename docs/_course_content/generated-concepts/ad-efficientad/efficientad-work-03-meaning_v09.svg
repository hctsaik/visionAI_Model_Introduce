<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><title>Teacher、Student、AE：三者分工，兩種差異</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#173A5E"/></marker><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#F0F4F7"/><stop offset=".5" stop-color="#BACBD9"/><stop offset="1" stop-color="#E2EBF2"/></linearGradient></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#FCFCFA" stroke="#FCFCFA" stroke-width="2"/><text x="52" y="55.0" font-size="20" fill="#087F8C" font-weight="800">EFFICIENTAD  /  工作與選型</text><text x="52" y="114.0" font-size="44" fill="#173A5E" font-weight="850">Teacher、Student、AE：三者分工，兩種差異</text><text x="52" y="159.0" font-size="25" fill="#526477" font-weight="600">工作案例導讀  ·  工件、熱區與輪廓均為教學示意</text><g transform="translate(63 237) scale(0.55)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7890A8" stroke-width="2"/><path d="M 18 26 L 44 26 M 26 18 L 26 44" stroke="#173A5E" stroke-width="5"/><circle cx="76" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="76" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><text x="16" y="224.0" font-size="18" fill="#173A5E" font-weight="800">正常例</text></g><text x="225" y="263.0" font-size="28" fill="#2463C5" font-weight="800">訓練：同一張正常工件交給三者</text><text x="225" y="306.0" font-size="23" fill="#526477" font-weight="600">箭頭表示學習目標；Teacher 已預訓練，在本產品訓練時固定</text><rect x="60" y="398" width="365" height="175" rx="18" fill="#F5F8FC" stroke="#CDDAE7" stroke-width="2"/><text x="82" y="438.0" font-size="28" fill="#2463C5" font-weight="800">Frozen Teacher</text><text x="82" y="482.0" font-size="25" fill="#173A5E" font-weight="600">固定的外觀描述 T</text><text x="82" y="518.25" font-size="25" fill="#173A5E" font-weight="600">提供學習參考</text><rect x="526" y="355" width="590" height="230" rx="18" fill="#F5F8FC" stroke="#CDDAE7" stroke-width="2"/><text x="546" y="389.0" font-size="28" fill="#2463C5" font-weight="800">同一個 Student，兩組輸出</text><text x="553" y="451.0" font-size="27" fill="#2463C5" font-weight="800">第一組 S₁</text><text x="553" y="493.0" font-size="24" fill="#173A5E" font-weight="600">學 Teacher</text><text x="553" y="532.0" font-size="23" fill="#173A5E" font-weight="600">正常局部描述</text><text x="838" y="451.0" font-size="27" fill="#087F8C" font-weight="800">第二組 S₂</text><text x="838" y="493.0" font-size="24" fill="#173A5E" font-weight="600">學 AE</text><text x="838" y="532.0" font-size="23" fill="#173A5E" font-weight="600">正常重建習慣</text><rect x="1215" y="398" width="399" height="175" rx="18" fill="#F5F8FC" stroke="#CDDAE7" stroke-width="2"/><text x="1237" y="438.0" font-size="28" fill="#087F8C" font-weight="800">Autoencoder（AE）</text><text x="1237" y="482.0" font-size="25" fill="#173A5E" font-weight="600">看整張，再重建特徵 A</text><text x="1237" y="518.25" font-size="25" fill="#173A5E" font-weight="600">學 Teacher 的正常描述</text><path d="M 434 474 L 516 474" stroke="#173A5E" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M 1205 474 L 1126 474" stroke="#173A5E" stroke-width="5" fill="none" marker-end="url(#arrow)"/><text x="62" y="627.0" font-size="28" fill="#2463C5" font-weight="800">檢查新工件：比較同一位置的描述差異</text><g transform="translate(64 651) scale(0.45)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7890A8" stroke-width="2"/><path d="M 18 26 L 44 26 M 26 18 L 26 44" stroke="#173A5E" stroke-width="5"/><circle cx="76" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="76" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><path d="M 116 176 L 137 204 M 121 175 L 142 203" stroke="#C84343" stroke-width="5"/><text x="16" y="224.0" font-size="18" fill="#173A5E" font-weight="800">A-01</text></g><circle cx="122.5" cy="736.05" r="19.35" fill="#C84343" opacity="0.13"/><circle cx="122.5" cy="736.05" r="13.05" fill="#C84343" opacity="0.23"/><circle cx="122.5" cy="736.05" r="7.65" fill="#C84343" opacity="0.4"/><text x="199" y="686.0" font-size="28" fill="#2463C5" font-weight="800">local：T 與 S₁ 的差異</text><text x="199" y="729.0" font-size="24" fill="#173A5E" font-weight="600">新外觀可能讓 Student 跟不上參考</text><g transform="translate(861 651) scale(0.45)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7890A8" stroke-width="2"/><path d="M 18 26 L 44 26 M 26 18 L 26 44" stroke="#173A5E" stroke-width="5"/><circle cx="76" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="76" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" 