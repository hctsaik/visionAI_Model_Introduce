<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><title>為什麼還需要一條看整體配置的路？</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#173A5E"/></marker><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#F0F4F7"/><stop offset=".5" stop-color="#BACBD9"/><stop offset="1" stop-color="#E2EBF2"/></linearGradient></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#FCFCFA" stroke="#FCFCFA" stroke-width="2"/><text x="52" y="55.0" font-size="20" fill="#087F8C" font-weight="800">EFFICIENTAD  /  機制與證據</text><text x="52" y="114.0" font-size="44" fill="#173A5E" font-weight="850">為什麼還需要一條看整體配置的路？</text><text x="52" y="159.0" font-size="25" fill="#526477" font-weight="600">閱讀主線：整體結構  ·  原理依論文；工件與數值例為教學示意</text><g transform="translate(66 362) scale(0.9666666666666667)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7890A8" stroke-width="2"/><path d="M 18 26 L 44 26 M 26 18 L 26 44" stroke="#173A5E" stroke-width="5"/><circle cx="76" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="76" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="164" cy="76" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="76" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><circle cx="76" cy="164" r="18" fill="#DCE7ED" stroke="#8BA5B8" stroke-width="3"/><circle cx="164" cy="164" r="29" fill="#51667B" stroke="#B7C5D4" stroke-width="7"/><text x="16" y="224.0" font-size="18" fill="#173A5E" font-weight="800">A-01</text></g><text x="61" y="661.0" font-size="25" fill="#173A5E" font-weight="600">A-01 少一個嵌件</text><text x="61" y="697.25" font-size="25" fill="#173A5E" font-weight="600">空槽局部可能仍像正常材質</text><path d="M 310 443 L 377 443" stroke="#173A5E" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="396" y="239" width="720" height="206" rx="18" fill="#E7F4F1" stroke="#CDDAE7" stroke-width="2"/><text x="425" y="283.0" font-size="30" fill="#087F8C" font-weight="800">Autoencoder（AE）：看整張配置</text><text x="425" y="339.0" font-size="27" fill="#173A5E" font-weight="600">整圖 → 壓縮瓶頸 → 重建 Teacher 特徵</text><text x="425" y="394.0" font-size="25" fill="#173A5E" font-weight="600">正常配置的共同規律，影響整張重建結果 A</text><rect x="396" y="511" width="720" height="206" rx="18" fill="#EDF2FB" stroke="#CDDAE7" stroke-width="2"/><text x="425" y="555.0" font-size="30" fill="#2463C5" font-weight="800">同一 Student 的第二組輸出 S₂</text><text x="425" y="611.0" font-size="27" fill="#173A5E" font-weight="600">局部描述 → 模仿 AE 在正常影像上的輸出</text><text x="425" y="667.0" font-size="25" fill="#173A5E" font-weight="600">學會正常的重建偏差，減少正常紋理誤報</text><path d="M 366 443 V 339 H 394 M 366 443 V 614 H 394" stroke="#173A5E" stroke-width="4" fill="none"/><path d="M 1123 343 L 1185 443" stroke="#173A5E" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M 1123 614 L 1185 507" stroke="#173A5E" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="1202" y="281" width="400" height="441" rx="18" fill="#F5F8FC" stroke="#CDDAE7" stroke-width="2"/><text x="1228" y="330.0" font-size="31" fill="#087F8C" font-weight="800">比較 A 與 S₂</text><text x="1228" y="383.0" font-size="24" fill="#526477" font-weight="600">某位置的 2 通道示意</text><text x="1228" y="437.0" font-size="29" fill="#087F8C" font-weight="800">A = [1, 1]</text><text x="1228" y="483.0" font-size="29" fill="#2463C5" font-weight="800">S₂ = [1, 3]</text><text x="1228" y="542.0" font-size="24" fill="#173A5E" font-weight="600">整體分數 = (0² + 2²) ÷ 2</text><text x="1228" y="594.0" font-size="40" fill="#C84343" font-weight="850">= 2</text><text x="1228" y="665.0" font-size="25" fill="#087F8C" font-weight="800">比較對象是 A 與 S₂</text><text x="62" y="776.0" font-size="23" fill="#526477" font-weight="600">兩條路徑同時讀取同一影像；AE 重建的是特徵，不是交付一張修好的 RGB 照片。</text><rect x="48" y="819" width="1576" height="82" rx="16" fill="#FFF4CC" stroke="#E6C669" stroke-width="2"/><text x="70" y="871.0" font-size="27" fill="#614A14" font-weight="750">💡 整體路比較 AE 與 Student 第二組輸出，補充局部描述不易辨識的配置變化。</text></svg>