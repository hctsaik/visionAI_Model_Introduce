<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">ECC：near 與 wrong initialization 的反事實</title><desc id="desc">同一 template 和 moving ROI，近的初始位置能接近正確 peak；遠或錯的初值可能表面收斂但對到錯誤結構。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D9485F"/></marker><marker id="arrow-11A863" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#11A863"/></marker><filter id="soft-shadow" x="-12%" y="-12%" width="124%" height="132%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0B3068" flood-opacity=".12"/></filter></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0B2858"/><rect x="40" y="34" width="182" height="38" rx="19" fill="#E8F2FF" stroke="#E8F2FF" stroke-width="0"/><text x="131.0" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">反事實</text><text x="40" y="125.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="40" font-weight="900" fill="#081A38" text-anchor="start">只改初始位置：近的初值可以爬向正確峰，遠的初值可能走向錯收斂</text><text x="40" y="171.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="500" fill="#536A91" text-anchor="start">兩側是同一 template / moving ROI；唯一改變是 initial transform 是否落在可收斂盆地。</text><rect x="1300" y="36" width="332" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1466" y="68.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#1769E0" text-anchor="middle">ECC</text><text x="424" y="247.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#11A863" text-anchor="middle">near initialization</text><g data-entity="small initial offset"><rect x="92" y="272" width="500" height="278" rx="20" fill="#EDF5FF" stroke="#11A863" stroke-width="3"/><rect x="120.0" y="300.0" width="70.83333333333333" height="52.0" rx="4" fill="#DFF3FF" stroke="#87B3ED" stroke-width="1"/><rect x="194.0" y="300.0" width="70.83333333333333" height="52.0" rx="4" fill="#BFD8FF" stroke="#87B3ED" stroke-width="1"/><rect x="268.0" y="300.0" width="70.83333333333333" height="52.0" rx="4" fill="#BFD8FF" stroke="#87B3ED" stroke-width="1"/><rect x="342.0" y="300.0" width="70.83333333333333" height="52.0" rx="4" fill="#DFF3FF" stroke="#87B3ED" stroke-width="1"/><rect x="416.0" y="300.0" width="70.83333333333333" height="52.0" rx="4" fill="#BFD8FF" stroke="#87B3ED" stroke-width="1"/><rect x="490.0" y="300.0" width="70.83333333333333" height="52.0" rx="4" fill="#BFD8FF" stroke="#87B3ED" stroke-width="1"/><rect x="120.0" y="355.5" width="70.83333333333333" height="52.0" rx="4" fill="#BFD8FF" stroke="#87B3ED" stroke-width="1"/><rect x="194.0" y="355.5" width="70.83333333333333" height="52.0" rx="4" fill="#BFD8FF" stroke="#87B3ED" stroke-width="1"/><rect x="268.0" y="355.5" width="70.83333333333333" height="52.0" rx="4" fill="#DFF3FF" stroke="#87B3ED" stroke-width="1"/><rect x="342.0" y="355.5" width="70.83333333333333" height="52.0