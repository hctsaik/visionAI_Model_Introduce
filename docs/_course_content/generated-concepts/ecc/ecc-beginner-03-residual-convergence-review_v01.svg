<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">ECC：aligned ROI 仍須由 residual 與 convergence gate 審核</title><desc id="desc">ECC 輸出是 aligned ROI、objective、iterations、residual、convergence flag 與 inverse transform；收斂不自動代表可採用。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D9485F"/></marker><marker id="arrow-11A863" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#11A863"/></marker><filter id="soft-shadow" x="-12%" y="-12%" width="124%" height="132%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0B3068" flood-opacity=".12"/></filter></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0B2858"/><rect x="40" y="34" width="182" height="38" rx="19" fill="#E8F2FF" stroke="#E8F2FF" stroke-width="0"/><text x="131.0" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">輸出與 gate</text><text x="40" y="125.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="40" font-weight="900" fill="#081A38" text-anchor="start">對齊後仍要回看 residual：收斂旗標不是自動可信的結論</text><text x="40" y="171.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="500" fill="#536A91" text-anchor="start">同一個 wafer ROI 先回映，再用 objective、iteration、residual 與 inverse transform 決定是否交給下游。</text><rect x="1300" y="36" width="332" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1466" y="68.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#1769E0" text-anchor="middle">ECC</text><text x="310" y="250.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#0B2858" text-anchor="middle">before warp</text><g data-entity="alignment_residual"><g data-entity="reference ROI"><rect x="72" y="290" width="476" height="310" rx="20" fill="#EDF5FF" stroke="#1769E0" stroke-width="3"/><rect x="100.0" y="318.0" width="66.83333333333333" height="60.0" rx="4" fill="#DFF3FF" stroke="#87B3ED" stroke-width="1"/><rect x="170.0" y="318.0" width="66.83333333333333" height="60.0" rx="4" fill="#BFD8FF" stroke="#87B3ED" stroke-width="1"/><rect x="240.0" y="318.0" width="66.83333333333333" height="60.0" rx="4" fill="#BFD8FF" stroke="#87B3ED" stroke-width="1"/><rect x="310.0" y="318.0" width="66.83333333333333" height="60.0" rx="4" fill="#DFF3FF" stroke="#87B3ED" stroke-width="1"/><rect x="380.0" y="318.0" width="66.83333333333333" height="60.0" rx="4" fill="#BFD8FF" stroke="#87B3ED" stroke-width="1"/><rect x="450.0" y="318.0" width="66.83333333333333" height="60.0" rx="4" fill="#BFD8FF" stroke="#87B3ED" stroke-width="1"/><rect x="100.0" y="381.5" width="66.83333333333333" height="60.0" rx="4" fill="#BFD8FF" stroke="#87B3ED" stroke-width="1"/><rect x="170.0" y="381.5" width="66.83333333333333" height="60.0" rx="4" fill="#BFD8FF" stroke="#87B3ED" stroke-width="1"/><rect x="240.0" y="381.5" width="66.83333333333333" height="60.0" rx="4" fill="#DFF3FF" stroke