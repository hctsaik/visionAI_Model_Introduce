alification_gate"><rect x="1343" y="576" width="62" height="52" rx="20" fill="#F38B00"/><text x="1374.0" y="610.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">HOLD</text><text x="1421" y="596.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#0B2858" text-anchor="start">drift / parallax</text><text x="1421" y="624.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="start">不合格 → HOLD</text></g><text x="836" y="758.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="800" fill="#0B2858" text-anchor="middle">aligned ROI 只是中間產物；下游 heatmap / measurement 必須能透過 inverse transform 回到 raw 座標。</text><rect x="40" y="853" width="1592" height="44" rx="18" fill="#FFF7DB" stroke="#F1B828" stroke-width="2"/><text x="836" y="882.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#674500" text-anchor="middle">收斂、低 residual、正確回映與受控輸入要一起成立；任一條失敗就停在 HOLD。</text></svg>