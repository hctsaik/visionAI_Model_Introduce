 PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="700" fill="#536A91" text-anchor="middle">看的是 objective / iteration / convergence / residual，不是只看一張『看起來對齊』的圖。</text><rect x="40" y="853" width="1592" height="44" rx="18" fill="#FFF7DB" stroke="#F1B828" stroke-width="2"/><text x="836" y="882.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#674500" text-anchor="middle">ECC 的運行 state 是 θ；每次更新都必須保留 warp family、pyramid、iteration 與停止條件。</text></svg>