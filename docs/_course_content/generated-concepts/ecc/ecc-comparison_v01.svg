x="597" y="304" width="478" height="24" fill="#0AA6D8"/><text x="625" y="304.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">SIFT</text><g data-visual-cue="sift_keypoint_correspondence" data-renderer-art="correspondence" data-primitive="detector_label_contract" data-semantic-scene="detector_label_contract" data-semantic-entities="roi|labels|letterbox|nms_policy" data-specialist-coverage="roi|labels|letterbox|nms_policy" data-semantic-relation="lock detector labels and postprocessing" data-must-show="SIFT：依據：image pair 有足夠穩定紋理可形成 local correspondence | candidate output: 可用輸出：coverage 與 RANSAC residual 合格的幾何初始化 | Same input, ROI, preprocess, truth, and evidence gate; do not switch the comparison contract." data-not-claim="SIFT output is a candidate, not verified field truth; still use the evidence gate."><title>SIFT：依據：image pair 有足夠穩定紋理可形成 local correspondence</title><rect x="625" y="346" width="422" height="112" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="705.5899999999999" y1="396.26" x2="766.07" y2="396.26" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="807.65" y1="396.26" x2="868.1300000000001" y2="396.26" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="909.71" y1="396.26" x2="966.4100000000001" y2="396.26" stroke="#F38B00" stroke-width="4" marker-end="url(#arrow-orange)"/><path d="M987.2 365.09999999999997L992.94 370.84L987.2 376.58L981.46 370.84z" fill="#FFF4CC" stroke="#C88400" stroke-width="2"/><g data-entity="roi" data-entity-label-full="ROI"><rect x="668.5068965517241" y="384.5289655172414" width="32.58620689655172" height="22.158620689655173" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M671.7655172413793 400.70475862068963 L679.2603448275862 394.9435172413793 L685.451724137931 398.7104827586207 L695.2275862068966 390.0686206896552" fill="none" stroke="#93B8