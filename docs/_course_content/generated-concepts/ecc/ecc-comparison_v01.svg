  <rect x="40" y="32" width="150" height="32" rx="16" fill="#E6F0FF"/><text x="58" y="54.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="16" font-weight="800" fill="#1769E0">相鄰方法比較</text><text x="40" y="116" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="43" font-weight="900" fill="#071A3B">比幾何依據與可用輸出</text><text x="40" y="182" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="500" fill="#50698F">幾何方法的差異在於它需要什麼已知依據，以及輸出能否交給下一個量測或對位步驟。</text><text x="1630" y="57.0" text-anchor="end" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#5C7395">ECC</text><rect x="77" y="260" width="478" height="500" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><rect x="77" y="260" width="478" height="68" rx="24" fill="#1769E0"/><rect x="77" y="304" width="478" height="24" fill="#1769E0"/><text x="105" y="304.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">ECC</text><g data-visual-cue="ecc_photometric_correlation" data-renderer-art="roi_alignment" data-primitive="alignment_initialization" data-semantic-scene="alignment_initialization" data-semantic-entities="template|moving_image|initial_theta" data-specialist-coverage="template|moving_image|initial_theta" data-semantic-relation="fix template and initialization before alignment" data-must-show="ECC：依據：template/moving ROI 的外觀穩定，且初始位姿已接近 | candidate output: 可用輸出：收斂且 residual 合格的局部 warp／inverse transform | Same input, ROI, preprocess, truth, and evidence gate; do not switch the comparison contract." data-not-claim="ECC output is a candidate, not verified field truth; still use the evidence gate."><title>ECC：依據：template/moving ROI 的外觀穩定，且初始位姿已接近</title><rect x="105" y="346" width="422" height="112" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="196.92999999999998" y1="383.96" x2="421.84" y2="396.26" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="329.23" y1="406.92" x2="421.84" y2="396.26" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="template" data-entity-label-full="template"><path d="M183.7 372.25039999999996L194.03199999999998 378.4496L194.03199999999998 389.4704L183.7 395.6696L173.368 389.4704L173.368 378.4496z" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><text data-label-line="true" x="183.7" y="405.6572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">template</text></g><g data-entity="moving_image" data-entity-label-full="moving"><rect x="298.78" y="394.52160000000003" width="34.44" height="23.4192" rx="8" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="3"/><path d="M302.224 411.61761600000006 L310.1452 405.52862400000004 L316.68879999999996 409.50988800000005 L327.02079999999995 400.37640000000005" fill="none" stroke="#93B8E8" stroke-width="3"/><text data-label-line="true" x="316.0" y="428.6172" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">moving</text></g><g data-entity="initial_theta" data-entity-label-full="initial theta"><path d="M444.52 384.55039999999997L454.852 390.7496L454.852 401.7704L444.52 407.9696L434.188 401.7704L434.188 390.7496z" fill="#EAF3FF" stroke="#F38B00" stroke-width="3"/><text data-label-line="true" x="444.52" y="417.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">initial theta</text></g><g data-relation="fix template and initialization before alignment"><rect x="138.34" y="4