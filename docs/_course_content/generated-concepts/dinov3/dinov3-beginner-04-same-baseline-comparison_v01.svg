ot</text><path d="M1010 340 L1110 435" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#a-F38B00)"/><path d="M1010 595 L1110 505" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#a-F38B00)"/><rect x="1140" y="230" width="460" height="500" rx="30" fill="#FFF7EC" stroke="#F38B00" stroke-width="3"/><text x="1370" y="300" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="31" font-weight="900" fill="#774C00" text-anchor="middle">same evidence gate</text><circle cx="1200" cy="382" r="11" fill="#F38B00"/><text x="1232" y="390" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#071D43" text-anchor="start">target local truth + patch dilution</text><circle cx="1200" cy="452" r="11" fill="#F38B00"/><text x="1232" y="460" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#071D43" text-anchor="start">drift / OOD + release / license</text><circle cx="1200" cy="522" r="11" fill="#F38B00"/><text x="1232" y="530" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#071D43" text-anchor="start">tokens / VRAM + full P95</text><circle cx="1200" cy="592" r="11" fill="#F38B00"/><text x="1232" y="600" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#071D43" text-anchor="start">specialist decision / rollback</text><text x="1370" y="680" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#D9485F" text-anchor="middle">missing evidence → HOLD</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">帶走：選 DINOv3 的唯一理由是同一 DINOv2 baseline 上可重現、可追溯的 local evidence—not a newer name or denser-looking feature。</text></svg>