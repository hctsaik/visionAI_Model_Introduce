<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><marker id="a-1769E0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1769E0"/></marker><marker id="a-00A9C7" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#00A9C7"/></marker><marker id="a-F38B00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#F38B00"/></marker><marker id="a-D9485F" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#D9485F"/></marker><marker id="a-159A63" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#159A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#082554"/><rect x="1255" y="33" width="373" height="50" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1442" y="66" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">DINOV3 · FEATURE CONTRACT</text><text x="40" y="108" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="40" font-weight="900" fill="#071D43" text-anchor="start">部署只交出版本化 global / patch features；postprocess 和下游 owner 必須被命名</text><text x="40" y="153" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="550" fill="#506584" text-anchor="start">resolution 或 text-alignment postprocess 會改 feature contract，不會把 DINOv3 變成 detector、VLM 或 defect mask。</text><clipPath id="clip-55-250"><rect x="55" y="250" width="320" height="410" rx="26"/></clipPath><g clip-path="url(#clip-55-250)"><image href="dinov3-industrial-ceramic-carrier-anchor_v02.png" x="55" y="250" width="320" height="410" preserveAspectRatio="xMidYMid slice"/></g><rect x="55" y="250" width="320" height="410" rx="26" fill="none" stroke="#1769E0" stroke-width="3"/><path d="M405 455 L495 455" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><rect x="525" y="245" width="290" height="430" rx="28" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><text x="670" y="340" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">self-supervised</text><text x="670" y="393" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">ViT</text><text x="670" y="446" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">global + dense</text><text x="670" y="499" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">patch features</text><path d="M845 455 L935 455" fill="none" stroke="#00A9C7" stroke-width="6" stroke-linecap="round" marker-end="url(#a-00A9C7)"/><rect x="965" y="220" width="330" height="500" rx="30" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1130" y="290" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#071D43" text-anchor="middle">versioned postprocess</text><text x="1130" y="375" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="800" fill="#506584" text-anchor="middle">resolution</text><text x="1130" y="422" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="800" fill="#506584" text-anchor="middle">or text-alignment</text><text x="1130" y="469" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="800" fill="#506584" text-anchor="middle">release / layer</text><text x="1130" y="516" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="800" fill="#506584" text-anchor="middle">feature shape</text><rect x="1000" y="590" width="260" height="72" rx="18" fill="#FFF7EC" stroke="#F38B00" stroke-width="2"/><text x="1130" y="635" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="850" fill="#774C00" text-anchor="middle">changes feature contract</text><path d="M1325 455 L1370 455" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#a-F38B00)"/><rect x="1400" y="235" width="200" height="470" rx="28" fill="#FFF7EC" stroke="#F38B00" stroke-width="3"/><text x="1500" y="335" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#774C00" text-anchor="middle">named</text><text x="1500" y="389" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#774C00" text-anchor="middle">NN / AD</text><text x="1500" y="443" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#774C00" text-anchor="middle">retrieval</text><text x="1500" y="497" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#774C00" text-anchor="middle">task head</text><text x="1500" y="610" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D9485F" text-anchor="middle">candidate owner</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">帶走：DINOv3 features 連同 release、patch、layer 和 postprocess 才可交給下游；feature 本身不是 box、mask、分數或 action。</text></svg>