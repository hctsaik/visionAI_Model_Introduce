49" y="447.324" width="10.530000000000001" height="7.290000000000001" rx="1.62" fill="#F3C94C" stroke="#9E7000" stroke-width="0.81"/><rect x="370.12899999999996" y="447.324" width="10.530000000000001" height="7.290000000000001" rx="1.62" fill="#F3C94C" stroke="#9E7000" stroke-width="0.81"/><rect x="384.709" y="447.324" width="10.530000000000001" height="7.290000000000001" rx="1.62" fill="#F3C94C" stroke="#9E7000" stroke-width="0.81"/><text x="371.74899999999997" y="472.83900000000006" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="6.075" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="371.74899999999997" dy="0">small capacitors</tspan></text><rect x="179.29" y="357.09000000000003" width="296.52" height="123.12000000000002" rx="6.48" fill="none" stroke="#11A863" stroke-width="2.0250000000000004"/><text x="327.54999999999995" y="500.46" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="7.695" font-weight="900" fill="#0B2858" text-anchor="middle"><tspan x="327.54999999999995" dy="0">fixed PCB AOI</tspan></text></g><g data-entity="inspection_camera"><rect x="95" y="238" width="104.39999999999999" height="99.36" rx="18.0" fill="#DDEBFF" stroke="#1769E0" stroke-width="2.88"/><rect x="109.4" y="255.28" width="75.6" height="30.24" rx="8.64" fill="#FFFFFF" stroke="#1769E0" stroke-width="1.44"/><circle cx="147.2" cy="307.12" r="24.48" fill="#1D365F" stroke="#071A3B" stroke-width="2.88"/><circle cx="147.2" cy="307.12" r="15.84" fill="#00A8C6" stroke="#D6F6FF" stroke-width="2.16"/><circle cx="147.2" cy="307.12" r="7.199999999999999" fill="#071A3B" stroke="none" stroke-width="0"/><path d="M116.6 328.72 L147.2 384.88 L177.79999999999998 328.72z" fill="#BFEFFF" fill-opacity=".36" stroke="#00A8C6" stroke-width="1.44"/><text x="147.2" y="407.2" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="13.68" font-weight="800" fill="#0B2858" text-anchor="middle"><tspan x="147.2" dy="0">fixed camera</tspan></text></g><text x="327.54999999999995" y="329.8" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#11A863" text-anchor="middle"><tspan x="327.54999999999995" dy="0">fixed raw ROI / same inspection recipe</tspan></text><text x="325.0" y="592" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#0B2858" text-anchor="middle"><tspan x="325.0" dy="0">same PCB capture</tspan></text></g><path d="M604 412 L686 412" fill="none" x1="604" y1="412" x2="686" y2="412" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="710" y="250" width="332" height="328" rx="28" fill="#EAF8F1" stroke="#11A863" stroke-width="3"/><text x="876" y="300" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#11A863" text-anchor="middle"><tspan x="876" dy="0">paper / forward slice</tspan></text><rect x="766" y="333" width="220" height="90" rx="18" fill="#FFFFFF" stroke="#11A863" stroke-width="3"/><text x="876" y="371" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0B2858" text-anchor="middle"><tspan x="876" dy="0">model forward</tspan></text><text x="876" y="402" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="30" font-weight="900" fill="#11A863" text-anchor="middle"><tspan x="876" dy="0">120 FPS</tspan></text><text x="876" y="493" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#D9485F" text-anchor="middle"><tspan x="876" dy="0">not camera-to-PLC</tspan><tspan x="876" dy="27">not small/overlap proof</tspan></text><path d="M1068 412 L1146 412" fill="none" x1="1068" y1="412" x2="1146" y2="412" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><rect x="1172" y="236" width="420" height="460" rx="30" fill="#FFFFFF" stroke="#BFD8FF" stroke-width="3"/><text x="1382" y="282" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#0B2858" text-anchor="middle"><tspan x="1382" dy="0">actual deployment path</tspan></text><rect x="1208" y="355" width="52" height="58" rx="12" fill="#00A8C6" stroke="#00A8C6" stroke-width="1"/><text x="1234.0" y="389" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle"><tspan x="1234.0" dy="0">capture</tspan></text><rect x="1264" y="355" width="68" height="58" rx="12" fill="#1769E0" stroke="#1769E0" stroke-width="1"/><text x="1298.0" y="389" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle"><tspan x="1298.0" dy="0">resize</tspan></text><rect x="1336" y="355" width="96" height="58" rx="12" fill="#F38B00" stroke="#F38B00" stroke-width="1"/><text x="1384.0" y="389" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle"><tspan x="1384.0" dy="0">model</tspan></text><rect x="1436" y="355" width="42" height="58" rx="12" fill="#00A8C6" stroke="#00A8C6" stroke-width="1"/><text x="1457.0" y="389" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle"><tspan x="1457.0" dy="0">post</tspan></text><rect x="1482" y="355" width="63" height="58" rx="12" fill="#D9485F" stroke="#D9485F" stroke-width="1"/><text x="1513.5" y="389" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle"><tspan x="1513.5" dy="0">map/PLC</tspan></text><path d="M1208 442 L1556 442" fill="none" x1="1208" y1="442" x2="1556" y2="442" stroke="#D3E4FF" stroke-width="2" stroke-linecap="round"/><text x="1382" y="486" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#D9485F" text-anchor="middle"><tspan x="1382" dy="0">camera-to-PLC P95 = 110 ms</tspan></text><text x="1382" y="521" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#0B2858" text-anchor="middle"><tspan x="1382" dy="0">local SLA ≤ 80 ms</tspan></text><g data-entity="runtime_gate"><circle cx="1263" cy="579" r="26" fill="#F38B00" stroke="none" stroke-width="0"/><text x="1263" y="587" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle"><tspan x="1263" dy="0">HOLD</tspan></text><text x="1307" y="574" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#0B2858" text-anchor="start"><tspan x="1307" dy="0">SLA breach</tspan></text><text x="1307" y="601" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="17" font-weight="700" fill="#536A91" text-anchor="start"><tspan x="1307" dy="0">HOLD / change operating point</tspan></text></g><text x="836" y="742" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0B2858" text-anchor="middle"><tspan x="836" dy="0">每個 decoder depth × export engine × precision × hardware 都要重測</tspan><tspan x="836" dy="28">critical-size recall、overlap miss、false HOLD、VRAM、review load 與 end-to-end P95。</tspan></text><rect x="40" y="853" width="1592" height="44" rx="18" fill="#FFF7DB" stroke="#F1B828" stroke-width="2"/><text x="836" y="882" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#674500" text-anchor="middle"><tspan x="836" dy="0">forward FPS 或 paper benchmark 不能替代現場 SLA；未量完整 path 或 small/overlap/OOD gate 時，正確輸出是 HOLD/REVIEW。</tspan></text></svg>