<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">RT-DETR：paper FPS 不等於 camera-to-PLC P95 SLA</title><desc id="desc">model forward FPS 只涵蓋部分路徑；capture、resize/pad、encoder/decoder、postprocess、inverse map 與 PLC handoff 必須一起量 P95，未達 SLA 則 HOLD。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-11A863" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#11A863"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D9485F"/></marker></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#F5F9FF" stroke="none" stroke-width="0"/><rect x="0" y="0" width="1672" height="8" rx="0" fill="#0B2858" stroke="none" stroke-width="0"/><rect x="40" y="34" width="182" height="38" rx="19" fill="#E8F2FF" stroke="#E8F2FF" stroke-width="0"/><text x="131" y="59" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle"><tspan x="131" dy="0">反事實 / HOLD</tspan></text><text x="40" y="125" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="40" font-weight="900" fill="#071A3B" text-anchor="start"><tspan x="40" dy="0">paper FPS 只量模型一段；camera-to-PLC P95 才是產線 SLA</tspan></text><text x="40" y="171" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="500" fill="#536A91" text-anchor="start"><tspan x="40" dy="0">同一 PCB、同一 decoder depth 也可能因 resize、export、postprocess、inverse map 與交接而得到不同端到端時間；不可外推。</tspan></text><rect x="1300" y="36" width="332" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1466" y="68" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#1769E0" text-anchor="middle"><tspan x="1466" dy="0">RT-DETR</tspan></text><g data-entity="conveyor_pcb_workcell"><rect x="70" y="306.96" width="510" height="220.32" rx="28" fill="#253E5D" stroke="#0B2858" stroke-width="4"/><rect x="90" y="346.74" width="470" height="140.76000000000002" rx="20" fill="#506D90" stroke="#A8C2DF" stroke-width="2"/><path d="M108.0 355.92 L108.0 478.32" fill="none" x1="108.0" y1="355.92" x2="108.0" y2="478.32" stroke="#7895B5" stroke-width="4" stroke-linecap="round"/><path d="M180.33333333333331 355.92 L180.33333333333331 478.32" fill="none" x1="180.33333333333331" y1="355.92" x2="180.33333333333331" y2="478.32" stroke="#7895B5" stroke-width="4" stroke-linecap="round"/><path d="M252.66666666666666 355.92 L252.66666666666666 478.32" fill="none" x1="252.66666666666666" y1="355.92" x2="252.66666666666666" y2="478.32" stroke="#7895B5" stroke-width="4" stroke-linecap="round"/><path d="M325.0 355.92 L325.0 478.32" fill="none" x1="325.0" y1="355.92" x2="325.0" y2="478.32" stroke="#7895B5" stroke-width="4" stroke-linecap="round"/><path d="M397.3333333333333 355.92 L397.3333333333333 478.32" fill="none" x1="397.3333333333333" y1="355.92" x2="397.3333333333333" y2="478.32" stroke="#7895B5" stroke-width="4" stroke-linecap="round"/><path d="M469.6666666666667 355.92 L469.6666666666667 478.32" fill="none" x1="469.6666666666667" y1="355.92" x2="469.6666666666667" y2="478.32" stroke="#7895B5" stroke-width="