 x1="821" y1="525" x2="838" y2="525" stroke="#1769E0" stroke-width="5" marker-end="url(#arrow-blue)"/><line x1="1226" y1="525" x2="1243" y2="525" stroke="#1769E0" stroke-width="5" marker-end="url(#arrow-blue)"/><rect x="40" y="810" width="1592" height="100" rx="20" fill="#FFF4CC" stroke="#F1B828"/><text x="68" y="842.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="900" fill="#674500">這張圖要帶走：</text><text x="68" y="871" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="600" fill="#674500">queries 不是每個 grid location 的 dense candidate；query count、selection、decoder depth、export operators 和 hardware 共同決定成本與</text><text x="68" y="895" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="600" fill="#674500">recall。NMS-light/end-to-end 也不代表不需要定義 postprocess/inverse map。</text>
