rt" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="25" font-weight="900" fill="#0B2858">先做預測</text><text x="473" y="520" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">先猜：能不能只拿模型輸出的</text><text x="473" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">FPS 宣稱前者符合產線 SLA？</text><text x="473" y="576" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">還必須固定和量哪些東西？</text><rect x="850" y="266" width="372" height="518" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><g data-visual-cue="query_selection_decoder_depth" data-renderer-art="query_decoder" data-primitive="selected_queries_decoder_depth" data-semantic-scene="selected_queries_decoder_depth" data-semantic-entities="selected_queries|decoder_layers|box_set" data-specialist-coverage="selected_queries|decoder_layers|box_set" data-semantic-relation="vary decoder depth after selecting a finite query set" data-must-show="很多 encoded locations 篩成有限 query/reference points | 穿過可變 1/3/6 層 decoder | RT-DETR 選出有限 object queries" data-not-claim="更淺 decoder 不必然同時更快且保有同一 recall。"><title>選有限 queries，再依 depth refine</title><rect x="874" y="294" width="324" height="122" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="selected_queries_decoder_depth" data-specialist-coverage="selected_queries|decoder_layers|box_set"><circle cx="937.44" cy="330.8" r="6" fill="#1769E0"/><circle cx="937.44" cy="348.4" r="6" fill="#1769E0"/><circle cx="937.44" cy="366.0" r="6" fill="#1769E0"/><line x1="952.84" y1="351.7" x2="999.04" y2="351.7" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="1014.44" y="328.6" width="13.86" height=