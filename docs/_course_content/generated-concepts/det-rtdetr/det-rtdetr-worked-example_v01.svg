  <rect x="40" y="32" width="150" height="32" rx="16" fill="#E6F0FF"/><text x="58" y="54.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="16" font-weight="800" fill="#1769E0">同一個工作例</text><text x="40" y="116" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="43" font-weight="900" fill="#071A3B">先預測，再看模型如何回答</text><text x="40" y="182" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="500" fill="#50698F">把同一個現場情境走一次：模型的輸出幫人決定下一個該回看的地方，而不是替人宣告真相。</text><text x="1630" y="57.0" text-anchor="end" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#5C7395">RT-DETR</text><rect x="40" y="266" width="372" height="518" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><g data-visual-cue="rtdetr_operating_contract" data-renderer-art="rtdetr_contract" data-primitive="detector_operating_contract" data-semantic-scene="detector_operating_contract" data-semantic-entities="roi|resize_policy|closed_set|runtime_contract" data-specialist-coverage="roi|resize_policy|closed_set|runtime_contract" data-semantic-relation="lock the detector operating point" data-must-show="backbone | input padding | query count | decoder layers | export/precision/batch | postprocess 和 decision policy 控制面板" data-not-claim="同一 checkpoint 的不同 decoder depth 是不同可直接沿用的 SLA。"><title>鎖 closed-set 與 operating point</title><rect x="64" y="294" width="324" height="122" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="detector_operating_contract" data-specialist-coverage="roi|resize_policy|closed_set|runtime_contract"><rect x="90.48" y="325.3" width="61.6" height="52.8" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M96.64 363.844 L110.808 350.116 L122.512 359.092 L140.9920000000000