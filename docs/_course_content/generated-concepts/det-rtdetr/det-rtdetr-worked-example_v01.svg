chor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">都要重新量 critical-size</text><text x="878" y="576" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">recall、false HOLD、VRAM 和</text><text x="878" y="604" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">review load。</text><rect x="1255" y="266" width="372" height="518" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><g data-visual-cue="camera_to_plc_p95" data-renderer-art="runtime_gate" data-primitive="camera_plc_p95_gate" data-semantic-scene="camera_plc_p95_gate" data-semantic-entities="camera|runtime_clock|plc_action|p95_gate" data-specialist-coverage="camera|runtime_clock|plc_action|p95_gate" data-semantic-relation="measure the complete camera-to-action path" data-must-show="camera→resize→encoder→decoder→postprocess→inverse map→PLC 的時間線 | 附 P95 | VRAM | recall" data-not-claim="模型 forward FPS 不是端到端 SLA。"><title>回映並量整條 SLA</title><rect x="1279" y="294" width="324" height="122" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="camera_plc_p95_gate" data-specialist-coverage="camera|runtime_clock|plc_action|p95_gate"><rect x="1305.48" y="328.6" width="52.36000000000001" height="44.0" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M1310.7160000000001 360.72 L1322.7588 349.28000000000003 L1332.7072 356.76000000000005 L1348.4152 339.6" fill="none" stroke="#93B8E8" stroke-width="3"/><line x1="1367.08" y1="351.7" x2="1407.12" y2="351.7" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><circle cx="1444.08" cy="351.7" r="17.6" fill="#E8FAFF" stroke="#0AA6D8" stroke-width="3"/><path d="M1444.08 351.7v-9.9 M1444.08 351.7l18.48 5.5" stroke="#0AA6D8" strok