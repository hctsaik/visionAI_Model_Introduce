er depth 上測試：淺一</text><text x="68" y="576" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">點的設定 forward 較短，但一</text><text x="68" y="604" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">批小物與重疊物件的召回變化</text><text x="68" y="632" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">尚未量過；另一個設定則使用</text><text x="68" y="660" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">不同 export engine。</text><rect x="445" y="266" width="372" height="518" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><g data-visual-cue="hybrid_encoder" data-renderer-art="hybrid_encoder" data-primitive="multiscale_hybrid_encoder" data-semantic-scene="multiscale_hybrid_encoder" data-semantic-entities="scale_maps|cross_scale_fusion|encoded_features" data-specialist-coverage="scale_maps|cross_scale_fusion|encoded_features" data-semantic-relation="fuse scales before query decoding" data-must-show="multi-scale features 分別經 intra-scale interaction | 經 cross-scale fusion | RT-DETR 的 efficient hybrid encoder 對多尺度 features 做同尺度互動" data-not-claim="encoder 輸出不是最終 boxes。"><title>hybrid encoder 整理多尺度資訊</title><rect x="469" y="294" width="324" height="122" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="multiscale_hybrid_encoder" data-specialist-coverage="scale_maps|cross_scale_fusion|encoded_features"><rect x="507.8" y="322.0" width="67.76" height="11.0" rx="4" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><rect x="507.8" y="340.7" width="56.98" height="11.0" rx="4" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><rect x="507.8" y="359.4" width="46.199999999