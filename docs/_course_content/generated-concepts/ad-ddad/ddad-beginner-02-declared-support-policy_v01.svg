<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">DDAD 的 normal support 與已宣告 defect synthetic generated-example policy</title><desc id="desc">normal support、declared defects、synthetic examples 與 near-identical generated examples 各有不同角色；不得意外混進 normal fit。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7352DA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7352DA"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9475F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9475F"/></marker><marker id="arrow-D95A44" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D95A44"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#08275A"/><rect x="40" y="30" width="188" height="44" rx="22" fill="#F2EEFF" stroke="#7352DA" stroke-width="2"/><text x="134" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">STEP 2 / 5</text><rect x="1331" y="30" width="301" height="44" rx="22" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="2"/><text x="1482" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#7352DA" text-anchor="middle">DDAD · conditioned diffusion</text><text x="40" y="123.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="38" font-weight="900" fill="#0A1A37" text-anchor="start">DDAD 的資料政策：normal fit 與 declared examples 的角色不能混用</text><text x="40" y="166.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="650" fill="#52698D" text-anchor="start">資料被怎麼放進 support、challenge、calibration 或 feature adaptation，會改變模型學到什麼與 real holdout 的可信度</text><g data-entity="ddad_valve_cover_aoi"><clipPath id="photo-policy-59-273"><rect x="59" y="273" width="280" height="304" rx="23"/></clipPath><g clip-path="url(#photo-policy-59-273)"><image href="ddad-industrial-aoi-anchor_v02.png" x="59" y="273" width="280" height="304" preserveAspectRatio="xMidYMid slice"/></g><rect x="59" y="273" width="280" height="304" rx="23" fill="none" stroke="#1769E0" stroke-width="3"/><rect x="241.0" y="425.0" width="44.800000000000004" height="48.64" rx="7" fill="none" stroke="#F38B00" stroke-width="4"/><text x="263.4" y="414.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">review cue</text><text x="199.0" y="606.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="middle">same raw valve-cover AOI</text></g><rect x="375" y="238" width="1210" height="450" rx="28" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="3"/><text x="409" y="284.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#0A1A37" text-anchor="start">Declared image protocol</text><path d="M409 314 L1549 314" fill="none" stroke="#D5E5FA" stroke-width="2" stroke-linecap="round"/><circle cx="437" cy="362" r="14" fill="#149A62"/><text x="466" y="369.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#149A62" text-anchor="start">normal support</text><text x="718" y="369.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="760" fill="#0A1A37" text-anchor="start">fit IDs + contamination audit</text><path d="M1074 362 L1135 362" fill="none" stroke="#149A62" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-149A62)"/><text x="1160" y="369.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="start">conditional denoiser normal-fit</text><text x="466" y="395.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="820" fill="#52698D" text-anchor="start">KEEP SEPARATE</text><circle cx="437" cy="439" r="14" fill="#D9475F"/><text x="466" y="446.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#D9475F" text-anchor="start">declared real defects</text><text x="718" y="446.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="760" fill="#0A1A37" text-anchor="start">taxonomy + real challenge split</text><path d="M1074 439 L1135 439" fill="none" stroke="#D9475F" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-D9475F)"/><text x="1160" y="446.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="start">test escape / calibration evidence</text><text x="466" y="472.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="820" fill="#52698D" text-anchor="start">NEVER SILENTLY NORMAL</text><circle cx="437" cy="516" r="14" fill="#F38B00"/><text x="466" y="523.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#F38B00" text-anchor="start">synthetic examples</text><text x="718" y="523.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="760" fill="#0A1A37" text-anchor="start">generator + morphology + seed</text><path d="M1074 516 L1135 516" fill="none" stroke="#F38B00" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><text x="1160" y="523.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="start">recorded protocol / qualification</text><text x="466" y="549.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="820" fill="#52698D" text-anchor="start">DECLARE ROLE</text><circle cx="437" cy="593" r="14" fill="#7352DA"/><text x="466" y="600.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#7352DA" text-anchor="start">near-identical examples</text><text x="718" y="600.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="760" fill="#0A1A37" text-anchor="start">recipe + similarity policy</text><path d="M1074 593 L1135 593" fill="none" stroke="#7352DA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-7352DA)"/><text x="1160" y="600.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="start">feature adaptation only if configured</text><text x="466" y="626.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="820" fill="#52698D" text-anchor="start">KEEP NO-ADAPTATION ABLATION</text><rect x="59" y="708" width="1526" height="96" rx="22" fill="#FFF0F3" stroke="#D9475F" stroke-width="2"/><text x="89" y="742.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#D9475F" text-anchor="start">Key question</text><text x="89" y="770.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#0A1A37" text-anchor="start">If feature extractor is domain-adapted: record generated recipe, epochs, loss and freeze policy.</text><text x="89" y="795.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#0A1A37" text-anchor="start">Keep a no-adaptation ablation; do not present it as a zero-cost frozen comparison.</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF5D4" stroke="#E5AB22" stroke-width="2"/><circle cx="79" cy="875" r="12" fill="#FFE29A" stroke="#C98700" stroke-width="2"/><text x="79" y="882.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#805300" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#674700" text-anchor="start">DDAD 可以有 normal-only configuration，但本課程的 evidence contract 必須聲明 defect / synthetic / generated-example 的角色，避免 support contamination 與 policy leakage。</text></svg>