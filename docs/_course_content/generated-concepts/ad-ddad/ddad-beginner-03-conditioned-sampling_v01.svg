<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">DDAD target-conditioned diffusion sampling contract</title><desc id="desc">test ROI x 同時作為 target condition；noisy source 經鎖定 schedule、sampler 和 step count 產生 defectless reconstruction x-hat，完整成本包含所有步驟。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7352DA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7352DA"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9475F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9475F"/></marker><marker id="arrow-D95A44" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D95A44"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#08275A"/><rect x="40" y="30" width="188" height="44" rx="22" fill="#F2EEFF" stroke="#7352DA" stroke-width="2"/><text x="134" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">STEP 3 / 5</text><rect x="1331" y="30" width="301" height="44" rx="22" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="2"/><text x="1482" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#7352DA" text-anchor="middle">DDAD · conditioned diffusion</text><text x="40" y="123.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="38" font-weight="900" fill="#0A1A37" text-anchor="start">DDAD sampling：x 作為 condition；schedule / sampler / steps 是 operating point</text><text x="40" y="166.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="650" fill="#52698D" text-anchor="start">noise start、schedule、sampler、steps、condition strength、precision 和 checkpoint 一變，x-hat、repeatability、latency 與 P95 都改變</text><g data-entity="ddad_valve_cover_aoi"><clipPath id="photo-sampling-52-282"><rect x="52" y="282" width="270" height="292" rx="23"/></clipPath><g clip-path="url(#photo-sampling-52-282)"><image href="ddad-industrial-aoi-anchor_v02.png" x="52" y="282" width="270" height="292" preserveAspectRatio="xMidYMid slice"/></g><rect x="52" y="282" width="270" height="292" rx="23" fill="none" stroke="#1769E0" stroke-width="3"/><rect x="227.5" y="428.0" width="43.2" height="46.72" rx="7" fill="none" stroke="#F38B00" stroke-width="4"/><text x="249.1" y="417.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">review cue</text><text x="187.0" y="603.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="middle">raw test ROI x</text></g><rect x="358" y="255" width="258" height="134" rx="22" fill="#EAF4FF" stroke="#1769E0" stroke-width="3"/><text x="487" y="291.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#0A1A37" text-anchor="middle">target condition</text><text x="487" y="319.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">x guides denoising</text><text x="487" y="348.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">condition strength locked</text><rect x="358" y="468" width="258" height="116" rx="22" fill="#F2EEFF" stroke="#7352DA" stroke-width="3"/><text x="487" y="503.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#0A1A37" text-anchor="middle">noisy source</text><text x="487" y="531.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#7352DA" text-anchor="middle">start noise / beta range</text><text x="487" y="558.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#7352DA" text-anchor="middle">state locked</text><path d="M633 322 L708 390" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><path d="M633 523 L708 438" fill="none" stroke="#7352DA" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-7352DA)"/><g data-entity="ddad_target_conditioned_diffusion_sampling"><rect x="738" y="272" width="392" height="335" rx="25" fill="#E6FBFD" stroke="#00A8C6" stroke-width="3"/><text x="934.0" y="306.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#0A1A37" text-anchor="middle">conditional denoiser</text><text x="934.0" y="332.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#00A8C6" text-anchor="middle">x is target condition</text><rect x="766.0" y="368" width="104.66666666666667" height="80" rx="15" fill="#FFFFFF" stroke="#00A8C6" stroke-width="2"/><text x="818.3333333333334" y="396" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#00A8C6" text-anchor="middle">noisy</text><text x="818.3333333333334" y="418" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#00A8C6" text-anchor="middle">source</text><path d="M878.6666666666666 408 L870.0 408" fill="none" stroke="#00A8C6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><rect x="878.0" y="368" width="104.66666666666667" height="80" rx="15" fill="#FFFFFF" stroke="#7352DA" stroke-width="2"/><text x="930.3333333333334" y="396" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">denoise</text><text x="930.3333333333334" y="418" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">step …</text><path d="M990.6666666666666 408 L982.0 408" fill="none" stroke="#7352DA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-7352DA)"/><rect x="990.0" y="368" width="104.66666666666667" height="80" rx="15" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><text x="1042.3333333333333" y="396" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="middle">locked</text><text x="1042.3333333333333" y="418" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="middle">sampler</text><path d="M766 472 L1102 472" fill="none" stroke="#BDE9EF" stroke-width="2" stroke-linecap="round"/><text x="934.0" y="506.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="middle">schedule · noise start · steps</text><text x="934.0" y="591.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">locked sampling contract</text></g><path d="M1151 438 L1215 438" fill="none" stroke="#7352DA" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-7352DA)"/><g data-entity="ddad_conditioned_reconstruction"><rect x="1238" y="294" width="328" height="270" rx="23" fill="#F2EEFF" stroke="#7352DA" stroke-width="3"/><text x="1402.0" y="328.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#0A1A37" text-anchor="middle">defectless reconstruction x-hat</text><text x="1402.0" y="354.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#7352DA" text-anchor="middle">normal-like comparison</text><rect x="1262" y="376" width="280" height="141" rx="13" fill="#C9D5E4" stroke="#7D9DBB" stroke-width="2"/><rect x="1273.0" y="389.0" width="48.8" height="31.333333333333332" rx="4" fill="#BCCBD9" stroke="none" stroke-width="0"/><rect x="1324.6" y="389.0" width="48.8" height="31.333333333333332" rx="4" fill="#DDE7F1" stroke="none" stroke-width="0"/><rect x="1376.2" y="389.0" width="48.8" height="31.333333333333332" rx="4" fill="#BCCBD9" stroke="none" stroke-width="0"/><rect x="1427.8" y="389.0" width="48.8" height="31.333333333333332" rx="4" fill="#DDE7F1" stroke="none" stroke-width="0"/><rect x="1479.4" y="389.0" width="48.8" height="31.333333333333332" rx="4" fill="#BCCBD9" stroke="none" stroke-width="0"/><rect x="1273.0" y="425.6666666666667" width="48.8" height="31.333333333333332" rx="4" fill="#DDE7F1" stroke="none" stroke-width="0"/><rect x="1324.6" y="425.6666666666667" width="48.8" height="31.333333333333332" rx="4" fill="#BCCBD9" stroke="none" stroke-width="0"/><rect x="1376.2" y="425.6666666666667" width="48.8" height="31.333333333333332" rx="4" fill="#DDE7F1" stroke="none" stroke-width="0"/><rect x="1427.8" y="425.6666666666667" width="48.8" height="31.333333333333332" rx="4" fill="#BCCBD9" stroke="none" stroke-width="0"/><rect x="1479.4" y="425.6666666666667" width="48.8" height="31.333333333333332" rx="4" fill="#DDE7F1" stroke="none" stroke-width="0"/><rect x="1273.0" y="462.3333333333333" width="48.8" height="31.333333333333332" rx="4" fill="#BCCBD9" stroke="none" stroke-width="0"/><rect x="1324.6" y="462.3333333333333" width="48.8" height="31.333333333333332" rx="4" fill="#DDE7F1" stroke="none" stroke-width="0"/><rect x="1376.2" y="462.3333333333333" width="48.8" height="31.333333333333332" rx="4" fill="#BCCBD9" stroke="none" stroke-width="0"/><rect x="1427.8" y="462.3333333333333" width="48.8" height="31.333333333333332" rx="4" fill="#DDE7F1" stroke="none" stroke-width="0"/><rect x="1479.4" y="462.3333333333333" width="48.8" height="31.333333333333332" rx="4" fill="#BCCBD9" stroke="none" stroke-width="0"/><text x="1402.0" y="549.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">not ground truth</text></g><rect x="52" y="683" width="1514" height="121" rx="23" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="2"/><text x="83" y="724.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#0A1A37" text-anchor="start">Sampling cost contract</text><circle cx="362" cy="717" r="10" fill="#00A8C6"/><text x="382" y="724.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="start">schedule / beta</text><circle cx="597" cy="717" r="10" fill="#7352DA"/><text x="617" y="724.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="start">sampler</text><circle cx="832" cy="717" r="10" fill="#1769E0"/><text x="852" y="724.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="start">step count</text><circle cx="1067" cy="717" r="10" fill="#F38B00"/><text x="1087" y="724.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="start">hardware / precision</text><circle cx="1302" cy="717" r="10" fill="#D9475F"/><text x="1322" y="724.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="start">complete P95 / P99</text><text x="83" y="774.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D9475F" text-anchor="start">A different sampler or step count is a different operating point. Do not report a single denoiser step as DDAD&#x27;s image-to-decision P95.</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF5D4" stroke="#E5AB22" stroke-width="2"/><circle cx="79" cy="875" r="12" fill="#FFE29A" stroke="#C98700" stroke-width="2"/><text x="79" y="882.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#805300" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#674700" text-anchor="start">DDAD uses x as target condition while denoising a noisy source; x-hat may preserve, erase or hallucinate a defect, so a smooth reconstruction is never acceptance evidence。</text></svg>