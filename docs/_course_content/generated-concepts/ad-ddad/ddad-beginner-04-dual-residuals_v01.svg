ill="#FFE29A" stroke="#C98700" stroke-width="2"/><text x="79" y="882.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#805300" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#674700" text-anchor="start">The full DDAD score is not a raw pixel residual: pixel and feature maps have separate normalization and evidence trails before their versioned fusion。</text></svg>