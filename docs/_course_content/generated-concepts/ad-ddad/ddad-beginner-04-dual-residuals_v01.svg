<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">DDAD pixel residual 與 feature residual 的分離證據</title><desc id="desc">input x 與 reconstruction x-hat 分別形成 pixel residual 與 feature residual；feature extractor 的 adaptation state 如有配置，須以 generated policy 和 real holdout 控制。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7352DA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7352DA"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9475F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9475F"/></marker><marker id="arrow-D95A44" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D95A44"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#08275A"/><rect x="40" y="30" width="188" height="44" rx="22" fill="#F2EEFF" stroke="#7352DA" stroke-width="2"/><text x="134" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">STEP 4 / 5</text><rect x="1331" y="30" width="301" height="44" rx="22" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="2"/><text x="1482" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#7352DA" text-anchor="middle">DDAD · conditioned diffusion</text><text x="40" y="123.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="38" font-weight="900" fill="#0A1A37" text-anchor="start">x 對 x-hat 的兩種不一致：pixel residual 與 feature residual 要分開保存、分開診斷</text><text x="40" y="166.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="650" fill="#52698D" text-anchor="start">pixel 看外觀位移；feature 看 extractor space。它們互補，但各自有盲區，不能先混成一個無來源分數</text><g data-entity="ddad_valve_cover_aoi"><clipPath id="photo-dual-input-55-276"><rect x="55" y="276" width="253" height="294" rx="23"/></clipPath><g clip-path="url(#photo-dual-input-55-276)"><image href="ddad-industrial-aoi-anchor_v02.png" x="55" y="276" width="253" height="294" preserveAspectRatio="xMidYMid slice"/></g><rect x="55" y="276" width="253" height="294" rx="23" fill="none" stroke="#1769E0" stroke-width="3"/><rect x="219.45000000000002" y="423.0" width="40.480000000000004" height="47.04" rx="7" fill="none" stroke="#F38B00" stroke-width="4"/><text x="239.69000000000003" y="412.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">review cue</text><text x="181.5" y="599.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="middle">input x</text></g><path d="M329 423 L381 423" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><g data-entity="ddad_conditioned_reconstruction"><rect x="404" y="286" width="240" height="234" rx="23" fill="#F2EEFF" stroke="#7352DA" stroke-width="3"/><text x="524.0" y="320.0" font-fami