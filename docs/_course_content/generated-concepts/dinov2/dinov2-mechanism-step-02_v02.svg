<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">ViT 交 global 與 patch features</title><desc id="desc">ViT 將 AOI patch 轉成一個全域 token 和一張空間 patch feature grid</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="feature_embedding" data-renderer-art="patch_features" data-primitive="global_patch_embedding" data-semantic-scene="global_patch_embedding" data-semantic-entities="patch_grid|global_vector|patch_vectors" data-specialist-coverage="patch_grid|global_vector|patch_vectors" data-semantic-relation="produce both global and local feature embeddings" data-must-show="patch grid 經 ViT blocks | 分出 CLS/global token 與 patch-token grid | 邊界提示：DINOv2 不會自己輸出 anomaly 或類別。" data-not-claim="DINOv2 不會自己輸出 anomaly 或類別。"><title>ViT 交 global 與 patch features</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="178.27999999999997" y1="132.44" x2="326.12" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="393.88" y1="132.44" x2="535.56" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="patch_grid" data-entity-label-full="patch"><rect x="119.97241379310341" y="108.01241379310343" width="14.28505747126437" height="14.28505747126437" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="136.25747126436778" y="108.01