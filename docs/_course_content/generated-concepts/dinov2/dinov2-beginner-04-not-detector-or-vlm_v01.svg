<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><marker id="a-1769E0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1769E0"/></marker><marker id="a-00A9C7" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#00A9C7"/></marker><marker id="a-F38B00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#F38B00"/></marker><marker id="a-D9485F" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#D9485F"/></marker><marker id="a-159A63" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#159A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#082554"/><rect x="1285" y="33" width="343" height="50" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1456" y="66" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">DINOV2 · MODEL BOUNDARY</text><text x="40" y="108" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="40" font-weight="900" fill="#071D43" text-anchor="start">不要把 DINOv2 混成 DINO detector 或 image-text VLM</text><text x="40" y="153" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="550" fill="#506584" text-anchor="start">三者都會看到同一張影像，但中間表示與輸出責任不同；先選對路徑，才有公平的後續比較。</text><clipPath id="clip-52-275"><rect x="52" y="275" width="300" height="350" rx="26"/></clipPath><g clip-path="url(#clip-52-275)"><image href="dinov2-industrial-ceramic-carrier-anchor_v02.png" x="52" y="275" width="300" height="350" preserveAspectRatio="xMidYMid slice"/></g><rect x="52" y="275" width="300" height="350" rx="26" fill="none" stroke="#1769E0" stroke-width="3"/><text x="202" y="665" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#071D43" text-anchor="middle">same fixed AOI image</text><path d="M390 450 L492 450" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><rect x="525" y="225" width="985" height="500" rx="32" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1018" y="285" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="31" font-weight="900" fill="#071D43" text-anchor="middle">three different responsibilities</text><rect x="585" y="340" width="260" height="290" rx="22" fill="#EAF4FF" stroke="#1769E0" stroke-width="3"/><text x="715" y="392" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="850" fill="#071D43" text-anchor="middle">DINOv2</text><text x="715" y="432" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="850" fill="#071D43" text-anchor="middle">visual ViT</text><text x="715" y="472" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="850" fill="#071D43" text-anchor="middle">global + patch</text><text x="715" y="512" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="850" fill="#071D43" text-anchor="middle">features only</text><rect x="890" y="340" width="260" height="290" rx="22" fill="#E9FBFF" stroke="#00A9C7" stroke-width="3"/><text x="1020" y="392" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#071D43" text-anchor="middle">DINO detector</text><text x="1020" y="432" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#071D43" text-anchor="middle">learned queries</text><text x="1020" y="472" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#071D43" text-anchor="middle">class + box</text><text x="1020" y="512" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#071D43" text-anchor="middle">detector output</text><rect x="1195" y="340" width="260" height="290" rx="22" fill="#FFF7EC" stroke="#F38B00" stroke-width="3"/><text x="1325" y="392" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#071D43" text-anchor="middle">CLIP / VLM</text><text x="1325" y="432" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#071D43" text-anchor="middle">text branch</text><text x="1325" y="472" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#071D43" text-anchor="middle">similarity</text><text x="1325" y="512" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#071D43" text-anchor="middle">semantic candidate</text><rect x="590" y="667" width="860" height="44" rx="16" fill="#FFF0F2" stroke="#D9485F" stroke-width="2"/><text x="1020" y="696" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#D9485F" text-anchor="middle">DINOv2 沒有 text encoder、box decoder 或 defect claim；需要下游 route 才能採取動作。</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">帶走：先分清 backbone、detector 與 VLM；模型名稱相似，並不表示輸出責任可以互換。</text></