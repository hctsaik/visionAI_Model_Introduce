e-optics</text><text x="1455" y="412" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="850" fill="#071D43" text-anchor="middle">separability</text><text x="1455" y="459" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="850" fill="#071D43" text-anchor="middle">downstream P95</text><text x="1455" y="506" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="850" fill="#071D43" text-anchor="middle">OOD / drift</text><text x="1455" y="553" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="850" fill="#071D43" text-anchor="middle">review action</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">帶走：先證明可觀測與下游 head 的 target truth；embedding 不是 defect proof，更不是 calibrated release probability。</text></svg>