1D43" text-anchor="middle">one fixed feature contract</text><rect x="615" y="368" width="230" height="72" rx="20" fill="#FFF0D4" stroke="#F38B00" stroke-width="3"/><text x="730" y="398" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#071D43" text-anchor="middle">global feature</text><text x="730" y="426" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#071D43" text-anchor="middle">or patch grid</text><text x="730" y="530" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="750" fill="#506584" text-anchor="middle">named layer</text><text x="730" y="566" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="750" fill="#506584" text-anchor="middle">pooling / aggregation</text><text x="730" y="602" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="750" fill="#506584" text-anchor="middle">checkpoint + preprocess</text><path d="M970 405 L1080 300" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><path d="M970 465 L1080 465" fill="none" stroke="#00A9C7" stroke-width="6" stroke-linecap="round" marker-end="url(#a-00A9C7)"/><path d="M970 525 L1080 630" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#a-F38B00)"/><rect x="1110" y="230" width="445" height="150" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1332" y="280" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#071D43" text-anchor="middle">retrieval / NN</text><text x="1332" y="326" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#071D43" text-anchor="middle">named support bank</text><text x="1332" y="356" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#071D43" text-anchor="middle">owns similarity candidate</text><rect x="1110" y="395" width="445" height="150" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1332" y="445" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#071D43" text-anchor="middle">AD / PCA head</text><text x="1332" y="491" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#071D43" text-anchor="middle">named distance or residual</text><text x="1332" y="521" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#071D43" text-anchor="middle">owns candidate map / score</text><rect x="1110" y="560" width="445" height="150" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1332" y="610" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#071D43" text-anchor="middle">classifier / detector head</text><text x="1332" y="656" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#071D43" text-anchor="middle">declared labels or boxes</text><text x="1332" y="686" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#071D43" text-anchor="middle">own output + calibration</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">帶走：feature 本身不做決策；NN、PCA、classifier、AD 或 detector head 才是 score、map、box 的責任 owner。</text></svg>