<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><marker id="a-1769E0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1769E0"/></marker><marker id="a-00A9C7" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#00A9C7"/></marker><marker id="a-F38B00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#F38B00"/></marker><marker id="a-D9485F" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#D9485F"/></marker><marker id="a-159A63" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#159A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#082554"/><rect x="1282" y="33" width="346" height="50" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1455" y="66" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">CONVLSTM · RESET / WARM-UP</text><text x="40" y="108" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="39" font-weight="900" fill="#071D43" text-anchor="start">第三步：state carry 只有在時間連續、camera regime 與 reset policy 都合格時才有意義</text><text x="40" y="153" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="550" fill="#506584" text-anchor="start">用同一輸送帶工作例比較可延續的序列與掉幀／變速率／camera change；不要讓 state 靜默穿越失效邊界。</text><clipPath id="clip-55-245"><rect x="55" y="245" width="370" height="470" rx="26"/></clipPath><g clip-path="url(#clip-55-245)"><image href="convlstm-beginner-01-conveyor-window_v01.png" x="55" y="245" width="370" height="470" preserveAspectRatio="xMidYMid slice"/></g><rect x="55" y="245" width="370" height="470" rx="26" fill="none" stroke="#1769E0" stroke-width="3"/><text x="240" y="283" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#071D43" text-anchor="middle">same conveyor context</text><path d="M460 470 L560 360" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><path d="M460 470 L560 610" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><rect x="590" y="225" width="405" height="250" rx="30" fill="#EAF8EF" stroke="#159A63" stroke-width="3"/><text x="792" y="285" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#0A6644" text-anchor="middle">A · continuous timestamps</text><text x="792" y="365" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#0A6644" text-anchor="middle">declared frame rate</text><text x="792" y="403" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#0A6644" text-anchor="middle">same camera regime</text><text x="792" y="441" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#0A6644" text-anchor="middle">carry state + warm-up</text><rect x="590" y="540" width="405" height="250" rx="30" fill="#FFF0F2" stroke="#D9485F" stroke-width="3"/><text x="792" y="600" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#D9485F" text-anchor="middle">B · missing / changed regime</text><text x="792" y="680" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#D9485F" text-anchor="middle">dropped frame · variable rate</text><text x="792" y="718" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#D9485F" text-anchor="middle">camera / ROI change</text><text x="792" y="756" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#D9485F" text-anchor="middle">reset state → warm-up / HOLD</text><path d="M1030 350 L1140 350" fill="none" stroke="#159A63" stroke-width="6" stroke-linecap="round" marker-end="url(#a-159A63)"/><path d="M1030 665 L1140 665" fill="none" stroke="#D9485F" stroke-width="6" stroke-linecap="round" marker-end="url(#a-D9485F)"/><rect x="1170" y="215" width="440" height="290" rx="30" fill="#EAF8EF" stroke="#159A63" stroke-width="3"/><text x="1390" y="280" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#0A6644" text-anchor="middle">valid sequence context</text><text x="1390" y="328" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#0A6644" text-anchor="middle">record carry / reset reason</text><text x="1390" y="376" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#0A6644" text-anchor="middle">then allow task head</text><rect x="1170" y="565" width="440" height="205" rx="30" fill="#FFF0F2" stroke="#D9485F" stroke-width="3"/><text x="1390" y="625" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#D9485F" text-anchor="middle">do not invent frames</text><text x="1390" y="668" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#D9485F" text-anchor="middle">reset and mark warm-up</text><text x="1390" y="711" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#D9485F" text-anchor="middle">HOLD if continuity is unknown</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">重點：state update 的時間語義由 timestamps、sampling、camera/ROI regime 與 reset policy 決定；失去連續性時，先 reset 或 HOLD。</text></svg>