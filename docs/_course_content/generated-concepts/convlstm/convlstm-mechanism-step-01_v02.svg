<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">固定窗口與時間戳</title><desc id="desc">四張帶時間戳的 ROI 影格被框成一個固定長度與 stride 的序列窗口。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="clip_window" data-renderer-art="frame_pair" data-primitive="timestamped_clip_window" data-semantic-scene="timestamped_clip_window" data-semantic-entities="frames|timestamps|clip_window" data-specialist-coverage="frames|timestamps|clip_window" data-semantic-relation="fix an ordered clip before temporal inference" data-must-show="四張 timestamped frames 在同一 ROI 以 sequence length、stride、overlap 成一個 clip | 「固定窗口與時間戳」需以專屬物件與箭頭表達，不得使用通用 family motif。 | 邊界提示：任意連續圖片都不自動具有相同時間語義。" data-not-claim="任意連續圖片都不自動具有相同時間語義。"><title>固定窗口與時間戳</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="178.27999999999997" y1="132.44" x2="326.12" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="393.88" y1="132.44" x2="535.56" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="frames" data-entity-label-full="影格"><rect x="108.99770114942527" y="106.9503448275862" width="70.80459770114943" height="48.14712643678162" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M116.07816091954021 142.0977471264368 L132.36321839080458 129.57949425287356 L145.81609195402297 137.76450574712644 L167.0574712643678 118.98712643678161" fill="none" stroke="#93B8E8" stroke-width="3"/><text data-label-line="true" x="144.39999999999998" y="177.04689655172413" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">影格</text></g><g data-entity="timestamps" data-entity-label-full="time"><rect x="330.26206896551724" y="116.86298850574713" width="14.160919540229887" height="26.905747126436786" rx="4" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="2"/><rect x="350.0873563218391" y="116.86298850574713" width="14.160919540229887" height="26.905747126436786" rx="4" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="2"/><rect x="369.9126436781609" y="116.86298850574713" width="14.160919540229887" height="26.905747126436786" rx="4" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="2"/><line x1="338.05057471264365" y1="132.44" x2="379.11724137931037" y2="125.35954022988506" stroke="#F38B00" stroke-width="3" marker-end="url(#arrow-orange)"/><text data-label-line="true" x="360.0" y="177.04689655172413" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">time</text></g><g data-entity="clip_window" data-entity-label-full="clip"><rect x="539.7020689655171" y="116.86298850574713" width="14.160919540229887" height="26.905747126436786" rx="4" fill="#EAF3FF" stroke="#F38B00" stroke-width="2"/><rect x="559.527356321839" y="116.86298850574713" width="14.160919540229887" height="26.905747126436786" rx="4" fill="#EAF3FF" stroke="#F38B00" stroke-width="2"/><rect x="579.3526436781608" y="116.86298850574713" width="14.160919540229887" height="26.905747126436786" rx="4" fill="#EAF3FF" stroke="#F38B00" stroke-width="2"/><line x1="547.4905747126436" y1="132.44" x2="588.5572413793103" y2="125.35954022988506" stroke="#F38B00" stroke-width="3" marker-end="url(#arrow-orange)"/><text data-label-line="true" x="569.4399999999999" y="177.04689655172413" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">clip</text></g><g data-relation="fix an ordered clip before temporal inference"><rect x="70.48" y="213.56" width="192" height="27.04" rx="12.48" fill="#EAF3FF" stroke="#9FC4FF" stroke-width="2"/><text data-label-line="true" x="166.48000000000002" y="227.07999999999998" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">timestamped</text><text data-label-line="true" x="166.48000000000002" y="242.42" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">clip</text></g></g><text x="42" y="311.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#0B2858">讀圖：固定窗口與時間戳</text><text x="42" y="339.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="700" fill="#8A5600">候選先交 REVIEW／HOLD；完整邊界見圖下說明。</text></svg>