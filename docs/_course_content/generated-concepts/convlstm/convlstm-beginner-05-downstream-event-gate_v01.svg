<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><marker id="a-1769E0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1769E0"/></marker><marker id="a-00A9C7" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#00A9C7"/></marker><marker id="a-F38B00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#F38B00"/></marker><marker id="a-D9485F" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#D9485F"/></marker><marker id="a-159A63" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#159A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#082554"/><rect x="1282" y="33" width="346" height="50" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1455" y="66" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">CONVLSTM · STATE → EVENT</text><text x="40" y="108" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="39" font-weight="900" fill="#071D43" text-anchor="start">第四步：state 經具名 task head 與時間聚合，才形成 event candidate</text><text x="40" y="153" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="550" fill="#506584" text-anchor="start">不要把 hidden norm、gate activity 或 recurrent loss 畫成 event release；head、aggregation、threshold、truth 與 action 都是另一份契約。</text><clipPath id="clip-55-255"><rect x="55" y="255" width="300" height="410" rx="26"/></clipPath><g clip-path="url(#clip-55-255)"><image href="convlstm-beginner-01-conveyor-window_v01.png" x="55" y="255" width="300" height="410" preserveAspectRatio="xMidYMid slice"/></g><rect x="55" y="255" width="300" height="410" rx="26" fill="none" stroke="#1769E0" stroke-width="3"/><path d="M390 460 L490 460" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><rect x="520" y="245" width="300" height="430" rx="30" fill="#EEF4FF" stroke="#1769E0" stroke-width="3"/><text x="670" y="315" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">hₜ / cₜ</text><text x="670" y="363" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">spatial state</text><text x="670" y="411" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">not an event score</text><text x="670" y="610" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#D9485F" text-anchor="middle">state evidence only</text><path d="M855 460 L955 460" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#a-F38B00)"/><rect x="985" y="220" width="600" height="530" rx="32" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1285" y="278" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="30" font-weight="900" fill="#071D43" text-anchor="middle">versioned downstream event route</text><text x="1285" y="360" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#071D43" text-anchor="middle">prediction / classification / anomaly head</text><text x="1285" y="408" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#071D43" text-anchor="middle">window aggregation + calibrated threshold</text><text x="1285" y="456" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#071D43" text-anchor="middle">event truth · sequence / lot split</text><text x="1285" y="504" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#071D43" text-anchor="middle">capture-to-action P95 · review owner</text><rect x="1085" y="605" width="400" height="48" rx="16" fill="#FFF7EC" stroke="#F38B00" stroke-width="2"/><text x="1285" y="636" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#774C00" text-anchor="middle">event candidate → REVIEW or HOLD, never automatic release</text><text x="1285" y="700" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#D9485F" text-anchor="middle">long dependency, leakage, drift or no truth → HOLD / simpler baseline</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">重點：ConvLSTM 只提供被治理的短中期 spatial state；事件責任屬於後續 head、時間真值、聚合、校正與具名 action owner。</text></svg>