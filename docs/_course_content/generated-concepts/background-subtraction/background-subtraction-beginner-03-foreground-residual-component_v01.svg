<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Background Subtraction foreground residual and component candidate</title><desc id="desc">The current frame is compared with M_t to create foreground likelihood, mask, morphology, component evidence, and a reviewable event candidate rather than defect truth or identity.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-079C88" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#079C88"/></marker><marker id="arrow-149B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#149B62"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F28B00"/></marker><marker id="arrow-F4B533" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F4B533"/></marker><marker id="arrow-D94860" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D94860"/></marker><marker id="arrow-785FC5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#785FC5"/></marker><marker id="arrow-FFFFFF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FFFFFF"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#091B3E"/><text x="42" y="96.0" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="37" font-weight="900" fill="#091B3E">目前影格對背景狀態的殘差，才開始形成 foreground candidate</text><text x="42" y="146.0" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="600" fill="#526B95">likelihood、threshold、shadow rule、morphology 與 temporal rule 都改變候選；它們不會把候選升格成缺陷真相。</text><rect x="1276" y="35" width="356" height="48" rx="24" fill="#FFFFFF" stroke="#A9C9FF" stroke-width="2"/><text x="1454" y="67.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#1769E0">BACKGROUND SUBTRACTION</text><clipPath id="crop-residual-input-54-233-0-0"><rect x="54" y="233" width="500" height="420" rx="22"/></clipPath><g clip-path="url(#crop-residual-input-54-233-0-0)"><svg x="54" y="233" width="500" height="420" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid slice"><image href="../frame-difference/frame-difference-aoi-conveyor-clean_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="54" y="233" width="500" height="420" rx="22" fill="none" stroke="#1769E0" stroke-width="3"/><ellipse cx="344.0" cy="521.0" rx="65.0" ry="23.1" fill="#07162B" opacity=".34"/><rect x="264.0" y="426.2" width="130.0" height="75.6" rx="16" fill="#2179D6" stroke="#BCE5FF" stroke-width="3"/><rect x="283.0" y="445.94" width="92.0" height="29.400000000000002" rx="8" fill="#50A7F0" stroke="none" stroke-width="0"/><path d="M291.5 471.56 L367.0 471.56" fill="none" stroke="#CDEEFF" stroke-width="2" stroke-linecap="round"/><text x="304" y="695.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="25" font-weight="900" fil