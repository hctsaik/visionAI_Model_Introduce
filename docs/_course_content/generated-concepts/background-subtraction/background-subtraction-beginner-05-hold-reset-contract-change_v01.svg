<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Background Subtraction HOLD and reset boundary</title><desc id="desc">Illumination, camera/registration, ROI, and recipe changes freeze the background update and route to HOLD, audit, reset, and requalification.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-079C88" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#079C88"/></marker><marker id="arrow-149B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#149B62"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F28B00"/></marker><marker id="arrow-F4B533" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F4B533"/></marker><marker id="arrow-D94860" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D94860"/></marker><marker id="arrow-785FC5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#785FC5"/></marker><marker id="arrow-FFFFFF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FFFFFF"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#091B3E"/><text x="42" y="96.0" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="37" font-weight="900" fill="#091B3E">場景或契約整體改變時，先凍結背景狀態：HOLD、稽核、reset</text><text x="42" y="146.0" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="600" fill="#526B95">全域亮度、鏡頭／registration、ROI 或 recipe 改變，都可能產生殘差；它們不是許多可相信的前景事件。</text><rect x="1276" y="35" width="356" height="48" rx="24" fill="#FFFFFF" stroke="#A9C9FF" stroke-width="2"/><text x="1454" y="67.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#1769E0">BACKGROUND SUBTRACTION</text><clipPath id="crop-hold-photo-52-224-0-0"><rect x="52" y="224" width="696" height="426" rx="22"/></clipPath><g clip-path="url(#crop-hold-photo-52-224-0-0)"><svg x="52" y="224" width="696" height="426" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid slice"><image href="../frame-difference/frame-difference-aoi-conveyor-clean_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="52" y="224" width="696" height="426" rx="22" fill="none" stroke="#A9C9FF" stroke-width="3"/><rect x="52" y="224" width="696" height="426" rx="22" fill="#F4C44F" opacity=".25"/><rect x="101" y="279" width="595" height="305" rx="22" fill="none" stroke="#FFEEC2" stroke-width="4" stroke-dasharray="13 8"/><text x="400" y="618.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="850" fill="#103263">broad illumination / shadow residual</text><text x="400" y="644.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#D94860">not a cluster of local defect events</text><text x="822" y="250.0" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="25" font-weight="900" fill="#103263">global or contract change</text><path d="M843 300 L1548 300" fill="none" stroke="#D8E5F8" stroke-width="3" stroke-linecap="round"/><circle cx="870" cy="360" r="47" fill="#F4B533" opacity=".15" stroke="#F4B533" stroke-width="4"/><text x="870" y="352" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#F4B533">illumination</text><text x="870" y="376" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#F4B533">/ shadow</text><path d="M 870 412 C 870 455, 1194 474, 1194 514" fill="none" stroke="#F4B533" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-F4B533)"/><circle cx="1115" cy="360" r="47" fill="#D94860" opacity=".15" stroke="#D94860" stroke-width="4"/><text x="1115" y="352" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#D94860">camera / registration</text><text x="1115" y="376" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#D94860">motion</text><path d="M 1115 412 C 1115 455, 1194 474, 1194 514" fill="none" stroke="#D94860" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-D94860)"/><circle cx="1402" cy="360" r="47" fill="#785FC5" opacity=".15" stroke="#785FC5" stroke-width="4"/><text x="1402" y="352" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#785FC5">ROI / recipe</text><text x="1402" y="376" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#785FC5">revision</text><path d="M 1402 412 C 1402 455, 1194 474, 1194 514" fill="none" stroke="#785FC5" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-785FC5)"/><rect x="896" y="525" width="596" height="165" rx="30" fill="#FFF4F6" stroke="#D94860" stroke-width="4"/><text x="1194" y="570.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="29" font-weight="900" fill="#D94860">freeze Mₜ update</text><text x="1194" y="610.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="850" fill="#103263">HOLD → audit camera / lighting / ROI / recipe</text><text x="1194" y="644.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="750" fill="#526B95">reset / reinitialize + requalification before reuse</text><path d="M 748 535 C 804 535, 834 567, 881 590" fill="none" stroke="#D94860" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-D94860)"/><rect x="86" y="724" width="1484" height="88" rx="22" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><text x="828" y="758.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="900" fill="#103263">Store the reason with the evidence: input frame · state snapshot · residual · capture/recipe revision · reset owner</text><text x="828" y="790.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="750" fill="#526B95">Only after a new background initialization and qualification may the foreground path resume.</text><rect x="40" y="849" width="1592" height="52" rx="21" fill="#FFF9E7" stroke="#F1B62D" stroke-width="2"/><text x="836" y="883.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="800" fill="#6C4800">HOLD 是可重播的正確輸出：未受控 illumination、camera motion 或 recipe change 時，不更新 state，也不假裝有可信 foreground event。</text></svg>