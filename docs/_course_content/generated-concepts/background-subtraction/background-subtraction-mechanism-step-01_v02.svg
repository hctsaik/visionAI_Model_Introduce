<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">版本化空場景</title><desc id="desc">多張空場景影格匯入一個標有版本與更新率的藍色背景狀態；尚未判定任何物件。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="background_state" data-renderer-art="background_state" data-primitive="background_state_update" data-semantic-scene="background_state_update" data-semantic-entities="empty_scene|background_memory|update_policy" data-specialist-coverage="empty_scene|background_memory|update_policy" data-semantic-relation="maintain a versioned background state" data-must-show="空輸送帶的多張影格累積成藍色 background state | 並標出更新規則 | 邊界提示：背景 state 不是一張永遠正確的背景照片。" data-not-claim="背景 state 不是一張永遠正確的背景照片。"><title>版本化空場景</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="178.27999999999997" y1="132.44" x2="326.12" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="393.88" y1="132.44" x2="535.56" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><path d="M569.4399999999999 97.08c36.96-56.160000000000004 -166.32000000000002-64.48 -209.44000000000003-10.4" fill="none" stroke="#0AA6D8" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow-cyan)"/><g data-entity="empty_scene" data-entity-label-full="empty scene"><path d="M144.39999999999998 108.3664367816092L165.6413793103448 121.111