<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Background Subtraction declared evolving state</title><desc id="desc">Accepted observations establish an evolving background state M_t with an explicit state algorithm and update eligibility, unlike a single Frame Difference reference frame.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-079C88" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#079C88"/></marker><marker id="arrow-149B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#149B62"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F28B00"/></marker><marker id="arrow-F4B533" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F4B533"/></marker><marker id="arrow-D94860" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D94860"/></marker><marker id="arrow-785FC5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#785FC5"/></marker><marker id="arrow-FFFFFF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FFFFFF"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#091B3E"/><text x="42" y="96.0" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="37" font-weight="900" fill="#091B3E">背景模型不是 I(t−k)：它是有初始化、狀態與更新資格的 Mₜ</text><text x="42" y="146.0" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="600" fill="#526B95">同一個 conveyor 的每一格畫面，只有在 declared eligibility 成立時，才有資格改變 background state。</text><rect x="1276" y="35" width="356" height="48" rx="24" fill="#FFFFFF" stroke="#A9C9FF" stroke-width="2"/><text x="1454" y="67.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#1769E0">BACKGROUND SUBTRACTION</text><text x="72" y="236.0" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="24" font-weight="900" fill="#103263">accepted observations over time</text><path d="M100 322 L580 322" fill="none" stroke="#B9D5FF" stroke-width="8" stroke-linecap="round"/><circle cx="145" cy="322" r="28" fill="#A8CEFF" stroke="#FFFFFF" stroke-width="4"/><text x="145" y="330.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#103263">t0</text><circle cx="253" cy="322" r="28" fill="#A8CEFF" stroke="#FFFFFF" stroke-width="4"/><text x="253" y="330.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#103263">t1</text><circle cx="361" cy="322" r="28" fill="#A8CEFF" stroke="#FFFFFF" stroke-width="4"/><text x="361" y="330.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#103263">t2</text><circle cx="469" cy="322" r="28" fi