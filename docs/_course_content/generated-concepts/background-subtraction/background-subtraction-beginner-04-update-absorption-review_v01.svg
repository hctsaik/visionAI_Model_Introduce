<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Background Subtraction update policy and long-stop absorption</title><desc id="desc">Update eligibility and learning policy decide whether a long-stopped object remains an evidence-backed candidate or is improperly absorbed into the background state.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-079C88" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#079C88"/></marker><marker id="arrow-149B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#149B62"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F28B00"/></marker><marker id="arrow-F4B533" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F4B533"/></marker><marker id="arrow-D94860" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D94860"/></marker><marker id="arrow-785FC5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#785FC5"/></marker><marker id="arrow-FFFFFF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FFFFFF"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#091B3E"/><text x="42" y="96.0" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="37" font-weight="900" fill="#091B3E">更新政策決定長停物：保持為候選，還是被悄悄吸收到背景</text><text x="42" y="146.0" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="600" fill="#526B95">這不是只調 threshold 的問題；learning rate/history 與 update eligibility 改變 Mₜ 本身，必須納入 challenge set。</text><rect x="1276" y="35" width="356" height="48" rx="24" fill="#FFFFFF" stroke="#A9C9FF" stroke-width="2"/><text x="1454" y="67.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#1769E0">BACKGROUND SUBTRACTION</text><text x="80" y="234.0" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="24" font-weight="900" fill="#103263">same conveyor sequence</text><path d="M125 337 L1143 337" fill="none" stroke="#BFD7FF" stroke-width="8" stroke-linecap="round"/><circle cx="174" cy="337" r="31" fill="#149B62" stroke="#FFFFFF" stroke-width="5"/><text x="174" y="404" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#103263">empty</text><text x="174" y="428" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#103263">M₀</text><circle cx="442" cy="337" r="31" fill="#1769E0" stroke="#FFFFFF" stroke-width="5"/><text x="442" y="404" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#103263">carrier</text><text x="442" y="428" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#103263">arrives</text><circle cx="710" cy="337" r="31" fill="#F28B00" stroke="#FFFFFF" stroke-width="5"/><text x="710" y="404" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#103263">stops</text><text x="710" y="428" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#103263">for dwell</text><circle cx="978" cy="337" r="31" fill="#D94860" stroke="#FFFFFF" stroke-width="5"/><text x="978" y="404" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#103263">long</text><text x="978" y="428" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#103263">stop</text><clipPath id="crop-absorb-seq-82-445-0-0"><rect x="82" y="445" width="440" height="246" rx="22"/></clipPath><g clip-path="url(#crop-absorb-seq-82-445-0-0)"><svg x="82" y="445" width="440" height="246" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid slice"><image href="../frame-difference/frame-difference-aoi-conveyor-clean_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="82" y="445" width="440" height="246" rx="22" fill="none" stroke="#1769E0" stroke-width="3"/><ellipse cx="343.40000000000003" cy="634.84" rx="57.2" ry="13.53" fill="#07162B" opacity=".34"/><rect x="271.20000000000005" y="555.7" width="114.4" height="44.28" rx="16" fill="#2179D6" stroke="#BCE5FF" stroke-width="3"/><rect x="287.92" y="567.2620000000001" width="80.96" height="17.220000000000002" rx="8" fill="#50A7F0" stroke="none" stroke-width="0"/><path d="M295.40000000000003 582.268 L361.84000000000003 582.268" fill="none" stroke="#CDEEFF" stroke-width="2" stroke-linecap="round"/><text x="302" y="724.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="800" fill="#103263">a visible residual may persist</text><path d="M 554 560 C 642 520, 701 510, 776 526" fill="none" stroke="#079C88" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-079C88)"/><rect x="790" y="430" width="385" height="160" rx="24" fill="#ECF9F2" stroke="#079C88" stroke-width="3"/><text x="982.5" y="468.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="24" font-weight="900" fill="#079C88">update eligibility</text><text x="982.5" y="499.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="700" fill="#103263">owner-approved update rule</text><path d="M826 514 L1139 514" fill="none" stroke="#B7E9D9" stroke-width="8" stroke-linecap="round"/><circle cx="905.5" cy="514" r="13" fill="#079C88"/><circle cx="1051.8" cy="514" r="13" fill="#F28B00"/><text x="893.95" y="573.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#079C88">eligible → update</text><text x="1071.05" y="573.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#F28B00">candidate → freeze</text><text x="982" y="628.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#526B95">the operating policy is evidence</text><path d="M 986 610 C 1025 644, 1082 660, 1142 670" fill="none" stroke="#079C88" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-079C88)"/><path d="M 1140 610 C 1182 650, 1230 701, 1281 749" fill="none" stroke="#D94860" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-D94860)"/><rect x="1184" y="434" width="394" height="202" rx="24" fill="#ECF9F2" stroke="#149B62" stroke-width="3"/><text x="1381" y="478.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#149B62">declared freeze for candidate</text><text x="1381" y="514.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="700" fill="#103263">state Mₜ is not updated by this dwell</text><text x="1381" y="554.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="850" fill="#103263">residual + dwell evidence</text><text x="1381" y="589.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="900" fill="#149B62">event candidate → REVIEW</text><rect x="884" y="699" width="694" height="104" rx="24" fill="#FFF4F6" stroke="#D94860" stroke-width="3"/><text x="1231" y="739.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#D94860">blind update / high learning rate → long-stop absorption risk</text><text x="1231" y="773.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="750" fill="#103263">「殘差消失」不等於「已證明正常」：保存 state snapshot，HOLD / audit policy。</text><rect x="40" y="849" width="1592" height="52" rx="21" fill="#FFF9E7" stroke="#F1B62D" stroke-width="2"/><text x="836" y="883.0" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="800" fill="#6C4800">Background Subtraction 的核心風險是 state 改了：以 long-stop、gradual change 與 stale ghost 的真實 challenge data 驗證 update policy。</text></svg>