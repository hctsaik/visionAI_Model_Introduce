<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">元件進事件窗口</title><desc id="desc">橘色前景元件沿時間線累積，最後停在 REVIEW 或 HOLD gate，而不是直接做決策。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="event_timeline" data-renderer-art="event_timeline" data-primitive="persistence_event_gate" data-semantic-scene="persistence_event_gate" data-semantic-entities="components|time_window|review_gate" data-specialist-coverage="components|time_window|review_gate" data-semantic-relation="require persistence before review" data-must-show="同一 component 的多個時間點排進 persistence、dedup 與 REVIEW／HOLD gate | 「元件進事件窗口」需以專屬物件與箭頭表達，不得使用通用 family motif。 | 邊界提示：單一前景元件不會自動成為最終事件。" data-not-claim="單一前景元件不會自動成為最終事件。"><title>元件進事件窗口</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="persistence_event_gate" data-specialist-coverage="components|time_window|review_gate"><rect x="89.52000000000001" y="95.02000000000001" width="64.4" height="70.06" rx="6" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><rect x="186.11999999999998" y="95.02000000000001" width="64.4" height="70.06" rx="6" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><circle cx="218.32000000000002" cy="131.18" r="10.17" fill="#F38B00"/><rect x="282.72" y="95.02000000000001" width="64.4" height="70.06" rx="6" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><circle cx="314.92" cy="131.18" r="10.17" fill="#F38B00"/><rect x="379.31999999999994" y="95.02000000000001" width="64.4" height="70.06" rx="6" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><circle cx="411.52" cy="131.18" r="10.17" fill="#F38B00"/><line x1="488.79999999999995" y1="131.18" x2="566.0799999999999" y2="131.18" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="566.0799999999999" y="85.98" width="90.16000000000001" height="90.4" rx="10" fill="#FFF4CC" stroke="#C88400" stroke-width="3"/><text data-label-line="true" x="360.0" y="228.35999999999999" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">持續性</text><text data-label-line="true" x="611.16" y="228.35999999999999" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">REVIEW</text></g></g><text x="42" y="311.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#0B2858">讀圖：元件進事件窗口</text><text x="42" y="339.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="700" fill="#8A5600">候選先交 REVIEW／HOLD；完整邊界見圖下說明。</text></svg>