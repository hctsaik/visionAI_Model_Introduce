<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">同一取像契約</title><desc id="desc">新影格以同一 ROI 和曝光規則對準版本化背景狀態，表示比較前先固定取像契約。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="frame_contract" data-renderer-art="frame_pair" data-primitive="background_frame_contract" data-semantic-scene="background_frame_contract" data-semantic-entities="current_frame|roi_policy|photometric_rule|background_state" data-specialist-coverage="current_frame|roi_policy|photometric_rule|background_state" data-semantic-relation="apply the same capture contract before foreground distance" data-must-show="新影格與 background state 共用 timestamp、ROI、registration 與光度前處理標記 | 「同一取像契約」需以專屬物件與箭頭表達，不得使用通用 family motif。 | 邊界提示：未對齊的新影格不可直接當成前景證據。" data-not-claim="未對齊的新影格不可直接當成前景證據。"><title>同一取像契約</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="147.48" y1="132.44" x2="246.03999999999996" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="313.79999999999995" y1="132.44" x2="412.36" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="480.12" y1="132.44" x2="572.52" y2="132.44" stroke="#F38B00" stroke-width="4" marker-end="url(#arrow-orange)"/><path d="M606.4 53.39999999999999L620.96 67.96L606.4 82.52L591.8399999999999 67.96z" fill="#FFF4CC" stroke="#C8840