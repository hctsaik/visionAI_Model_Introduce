chor="middle">blocked data stays local</text><path d="M960 470 L1060 470" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><rect x="1090" y="245" width="235" height="450" rx="30" fill="#EEF4FF" stroke="#1769E0" stroke-width="3"/><text x="1207" y="315" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#071D43" text-anchor="middle">named API</text><text x="1207" y="362" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#071D43" text-anchor="middle">model ID</text><text x="1207" y="409" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#071D43" text-anchor="middle">API version</text><text x="1207" y="456" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#071D43" text-anchor="middle">region</text><text x="1207" y="620" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#1769E0" text-anchor="middle">request contract</text><path d="M1360 470 L1455 470" fill="none" stroke="#00A9C7" stroke-width="6" stroke-linecap="round" marker-end="url(#a-00A9C7)"/><rect x="1485" y="285" width="125" height="340" rx="26" fill="#E9FBFF" stroke="#00A9C7" stroke-width="3"/><text x="1547" y="350" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#071D43" text-anchor="middle">provider</text><text x="1547" y="387" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#071D43" text-anchor="middle">multimodal</text><text x="1547" y="424" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#071D43" text-anchor="middle">service</text><text x="1547" y="555" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#506584" text-anchor="middle">internals opaque</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">重點：Gemini Vision 是 service-integration route：先治理資料邊界與可重播 request，再談生成的 assistive response。</text></svg>