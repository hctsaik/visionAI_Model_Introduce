<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><marker id="a-1769E0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1769E0"/></marker><marker id="a-00A9C7" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#00A9C7"/></marker><marker id="a-F38B00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#F38B00"/></marker><marker id="a-D9485F" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#D9485F"/></marker><marker id="a-159A63" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#159A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#082554"/><rect x="1282" y="33" width="346" height="50" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1455" y="66" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">GEMINI · RESPONSE → AUDIT</text><text x="40" y="108" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="39" font-weight="900" fill="#071D43" text-anchor="start">第二步：provider 回傳 text、JSON 或 tool call；它們是 service claim</text><text x="40" y="153" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="550" fill="#506584" text-anchor="start">我們能審核的是 request / response 行為、版本與 evidence；不要在教材裡虛構 provider 內部特徵路徑。</text><clipPath id="clip-55-255"><rect x="55" y="255" width="300" height="410" rx="26"/></clipPath><g clip-path="url(#clip-55-255)"><image href="gemini-vision-industrial-client-workpiece-anchor_v02.png" x="55" y="255" width="300" height="410" preserveAspectRatio="xMidYMid slice"/></g><rect x="55" y="255" width="300" height="410" rx="26" fill="none" stroke="#1769E0" stroke-width="3"/><path d="M390 455 L485 455" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><path d="M610 300 C510 300 500 465 610 530 C535 625 695 685 790 590 C890 650 1000 570 930 475 C1000 360 880 280 790 340 C735 290 665 285 610 300 Z" fill="#E9FBFF" stroke="#00A9C7" stroke-width="4"/><text x="765" y="414" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">provider multimodal</text><text x="765" y="454" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">service boundary</text><text x="765" y="520" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D9485F" text-anchor="middle">internal encoder is not a claim</text><path d="M970 455 L1065 455" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#a-F38B00)"/><rect x="1095" y="220" width="250" height="480" rx="30" fill="#FFF7EC" stroke="#F38B00" stroke-width="3"/><text x="1220" y="292" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#774C00" text-anchor="middle">generated</text><text x="1220" y="340" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#774C00" text-anchor="middle">text / JSON</text><text x="1220" y="388" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#774C00" text-anchor="middle">tool-call</text><text x="1220" y="436" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#774C00" text-anchor="middle">request</text><text x="1220" y="625" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D9485F" text-anchor="middle">structured ≠ grounded</text><path d="M1380 455 L1460 455" fill="none" stroke="#159A63" stroke-width="6" stroke-linecap="round" marker-end="url(#a-159A63)"/><rect x="1490" y="245" width="120" height="410" rx="26" fill="#EAF8EF" stroke="#159A63" stroke-width="3"/><text x="1550" y="315" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0A6644" text-anchor="middle">citation</text><text x="1550" y="357" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0A6644" text-anchor="middle">evidence</text><text x="1550" y="399" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0A6644" text-anchor="middle">abstain</text><text x="1550" y="441" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0A6644" text-anchor="middle">audit log</text><text x="1550" y="590" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#506584" text-anchor="middle">then specialist</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">重點：JSON 讓 parsing 可預測；citation、grounding、localization 與物理量測仍要由 evidence validation 與具名 owner 證明。</text></svg>