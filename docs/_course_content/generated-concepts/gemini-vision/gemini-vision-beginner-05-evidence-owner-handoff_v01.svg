<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><marker id="a-1769E0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1769E0"/></marker><marker id="a-00A9C7" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#00A9C7"/></marker><marker id="a-F38B00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#F38B00"/></marker><marker id="a-D9485F" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#D9485F"/></marker><marker id="a-159A63" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#159A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#082554"/><rect x="1282" y="33" width="346" height="50" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1455" y="66" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">GEMINI · AUDIT → OWNER</text><text x="40" y="108" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="39" font-weight="900" fill="#071D43" text-anchor="start">第四步：service claim 只進可審計 workflow；final action 仍由 evidence owner 決定</text><text x="40" y="153" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="550" fill="#506584" text-anchor="start">Gemini 可以協助文件擷取與審查摘要，但不能自行量測、定位、放行或代替安全 fallback。</text><clipPath id="clip-55-255"><rect x="55" y="255" width="300" height="410" rx="26"/></clipPath><g clip-path="url(#clip-55-255)"><image href="gemini-vision-industrial-client-workpiece-anchor_v02.png" x="55" y="255" width="300" height="410" preserveAspectRatio="xMidYMid slice"/></g><rect x="55" y="255" width="300" height="410" rx="26" fill="none" stroke="#1769E0" stroke-width="3"/><path d="M390 460 L495 460" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#a-F38B00)"/><rect x="525" y="245" width="320" height="430" rx="30" fill="#FFF7EC" stroke="#F38B00" stroke-width="3"/><text x="685" y="315" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#774C00" text-anchor="middle">service claim</text><text x="685" y="361" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#774C00" text-anchor="middle">structured response</text><text x="685" y="407" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#774C00" text-anchor="middle">tool request</text><text x="685" y="453" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#774C00" text-anchor="middle">audit record</text><text x="685" y="610" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#D9485F" text-anchor="middle">candidate for validation</text><path d="M880 460 L980 460" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><rect x="1010" y="205" width="575" height="540" rx="32" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1297" y="270" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="30" font-weight="900" fill="#071D43" text-anchor="middle">named evidence and action owners</text><circle cx="1080" cy="332" r="16" fill="#F38B00"/><text x="1120" y="340" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#071D43" text-anchor="start">data/security owner</text><text x="1120" y="365" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506584" text-anchor="start">ACL · retention · egress</text><circle cx="1080" cy="414" r="16" fill="#1769E0"/><text x="1120" y="422" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#071D43" text-anchor="start">grounder / detector / AD</text><text x="1120" y="447" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506584" text-anchor="start">can own ROI or candidate</text><circle cx="1080" cy="496" r="16" fill="#00A9C7"/><text x="1120" y="504" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#071D43" text-anchor="start">metrology / specialist</text><text x="1120" y="529" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506584" text-anchor="start">can own measurement / action</text><circle cx="1080" cy="578" r="16" fill="#159A63"/><text x="1120" y="586" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="850" fill="#071D43" text-anchor="start">fallback operator</text><text x="1120" y="611" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506584" text-anchor="start">can own outage response</text><rect x="1065" y="680" width="465" height="40" rx="16" fill="#FFF0F2" stroke="#D9485F" stroke-width="2"/><text x="1297" y="707" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D9485F" text-anchor="middle">missing evidence, data approval, audit or fallback → HOLD</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">重點：provider response 的價值是可治理的協助；證據、資料邊界、專家 action 與 fallback 缺一項都不應自動前進。</text></svg>