<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">client 端資料／權限 gate</title><desc id="desc">影像和文件先在 client 端通過來源、遮罩、權限和資料外送檢查</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="data_boundary" data-renderer-art="classifier_or_mask" data-primitive="gemini_data_boundary" data-semantic-scene="gemini_data_boundary" data-semantic-entities="client_image|permission_boundary|approved_request" data-specialist-coverage="client_image|permission_boundary|approved_request" data-semantic-relation="apply a data boundary before sending a request" data-must-show="image、document、video 先經 provenance、redaction、ACL、egress、retention | 只允許合規資料進 request | 邊界提示：送出 API 前不應假設 provider 內部可補齊治理。" data-not-claim="送出 API 前不應假設 provider 內部可補齊治理。"><title>client 端資料／權限 gate</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="178.27999999999997" y1="132.44" x2="326.12" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="393.88" y1="132.44" x2="535.56" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="client_image" data-entity-label-full="client"><rect x="108.99770114942527" y="106.9503448275862" width="70.80459770114943" height="48.14712643678162" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M116.07816091954021 142.0