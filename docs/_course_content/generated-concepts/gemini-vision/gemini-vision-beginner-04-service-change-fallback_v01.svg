<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><marker id="a-1769E0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1769E0"/></marker><marker id="a-00A9C7" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#00A9C7"/></marker><marker id="a-F38B00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#F38B00"/></marker><marker id="a-D9485F" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#D9485F"/></marker><marker id="a-159A63" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#159A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#082554"/><rect x="1282" y="33" width="346" height="50" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1455" y="66" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">GEMINI · CHANGE → FALLBACK</text><text x="40" y="108" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="39" font-weight="900" fill="#071D43" text-anchor="start">第三步：alias、區域、配額或 retry 改變，原本合格的 service route 要重驗</text><text x="40" y="153" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="550" fill="#506584" text-anchor="start">服務變更不一定會改你的 prompt；因此要以 replay set、telemetry 與 fallback 來發現它。</text><clipPath id="clip-55-245"><rect x="55" y="245" width="370" height="470" rx="26"/></clipPath><g clip-path="url(#clip-55-245)"><image href="gemini-vision-industrial-client-workpiece-anchor_v02.png" x="55" y="245" width="370" height="470" preserveAspectRatio="xMidYMid slice"/></g><rect x="55" y="245" width="370" height="470" rx="26" fill="none" stroke="#1769E0" stroke-width="3"/><text x="240" y="282" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#071D43" text-anchor="middle">same replay request</text><path d="M460 470 L560 360" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><path d="M460 470 L560 605" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><rect x="590" y="225" width="415" height="255" rx="30" fill="#EAF8EF" stroke="#159A63" stroke-width="3"/><text x="797" y="285" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#0A6644" text-anchor="middle">A · pinned, qualified service</text><rect x="650" y="345" width="295" height="49" rx="16" fill="#FFFFFF" stroke="#159A63" stroke-width="2"/><text x="797.5" y="377" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#071D43" text-anchor="middle">model ID + API + region</text><text x="797" y="435" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#0A6644" text-anchor="middle">response / citation / P95 replayed</text><rect x="590" y="535" width="415" height="255" rx="30" fill="#FFF0F2" stroke="#D9485F" stroke-width="3"/><text x="797" y="595" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#D9485F" text-anchor="middle">B · alias / quota / price changed</text><rect x="650" y="655" width="295" height="49" rx="16" fill="#FFFFFF" stroke="#D9485F" stroke-width="2"/><text x="797.5" y="687" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#071D43" text-anchor="middle">retry / 429 / limit / safety filter</text><text x="797" y="745" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#D9485F" text-anchor="middle">answer, availability or cost can change</text><path d="M1040 355 L1145 355" fill="none" stroke="#159A63" stroke-width="6" stroke-linecap="round" marker-end="url(#a-159A63)"/><path d="M1040 665 L1145 665" fill="none" stroke="#D9485F" stroke-width="6" stroke-linecap="round" marker-end="url(#a-D9485F)"/><rect x="1175" y="215" width="435" height="290" rx="30" fill="#EAF8EF" stroke="#159A63" stroke-width="3"/><text x="1392" y="280" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#0A6644" text-anchor="middle">audit request / response hash</text><text x="1392" y="328" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#0A6644" text-anchor="middle">P95 · errors · retries · cost</text><text x="1392" y="376" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#0A6644" text-anchor="middle">qualified specialist route</text><rect x="1175" y="565" width="435" height="205" rx="30" fill="#FFF0F2" stroke="#D9485F" stroke-width="3"/><text x="1392" y="625" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#D9485F" text-anchor="middle">monitor change</text><text x="1392" y="668" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#D9485F" text-anchor="middle">use safe fallback</text><text x="1392" y="711" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="850" fill="#D9485F" text-anchor="middle">HOLD + re-qualify</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">重點：service alias 與運營條件也是模型行為的一部分；資料、答案、延遲、錯誤與成本都要被 replay、監控與交接。</text></svg>