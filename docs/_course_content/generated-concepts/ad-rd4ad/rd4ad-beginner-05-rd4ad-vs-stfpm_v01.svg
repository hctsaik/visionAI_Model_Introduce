<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">RD4AD：reverse distillation 與 STFPM 的區別和邊界</title><desc id="desc">RD4AD 透過 bottleneck 和 reverse decoder 重建 teacher feature，STFPM 則比較 student 模仿 teacher 的 feature；teacher mismatch 和不可見微小缺陷都需 HOLD。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D9485F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0B2858"/><rect x="40" y="34" width="148" height="38" rx="19" fill="#E8F2FF" stroke="#E8F2FF" stroke-width="0"/><text x="114.0" y="59.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">選型邊界</text><text x="40" y="125.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="39" font-weight="900" fill="#081A38" text-anchor="start">RD4AD 與 STFPM 都比較 feature，但訓練路徑不同</text><text x="40" y="171.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="500" fill="#536A91" text-anchor="start">RD4AD 以 one-class bottleneck + reverse decoder 重建 teacher feature；STFPM 以 student 模仿 frozen teacher。兩者都只交 candidate evidence。</text><rect x="1320" y="36" width="312" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1476" y="68.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="800" fill="#1769E0" text-anchor="middle">RD4AD</text><rect x="40" y="230" width="770" height="370" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><rect x="862" y="230" width="770" height="370" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="78" y="278.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="26" font-weight="900" fill="#0B2858" text-anchor="start">RD4AD：reverse distillation</text><clipPath id="crop-compare-rd-84-318-1112-35"><rect x="84" y="318" width="156" height="184" rx="18"/></clipPath><g clip-path="url(#crop-compare-rd-84-318-1112-35)"><svg x="84" y="318" width="156" height="184" viewBox="1112 35 360 270" preserveAspectRatio="xMidYMid slice"><image href="rd4ad-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="84" y="318" width="156" height="184" rx="18" fill="none" stroke="#F38B00" stroke-width="2"/><rect x="270" y="360" width="98" height="64" rx="14" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><rect x="282.0" y="372.0" width="12.8" height="10.0" rx="4" fill="#81B2FF" fill-opacity="0.72" stroke="#81B2FF" stroke-width="0"/><rect x="296.8" y="372.0" width="12.8" height="10.0" rx="4" fill="#81B2FF" fill-opacity="0.72" stroke="#81B2FF" stroke-width="0"/><rect x="311.6" y="372.0" width="12.8" height="10.0" rx="4" fill="#81B2FF" fill-opacity="0.72" stroke="#81B2FF" stroke-width="0"/><rect x="326.4" y="372.0" width="12.8" height="10.0" rx="4" fill="#81B2FF" fill-opacity="0.72" stroke="#81B2FF" stroke-width="0"/><rect x="341.2" y="372.0" width="12.8" height="10.0" rx="4" fill="#81B2FF" fill-opacity="0.72" stroke="#81B2FF" stroke-width="0"/><rect x="282.0" y="385.3333333333333" width="12.8" height="10.0" rx="4" fill="#81B2FF" fill-opacity="0.72" stroke="#81B2FF" stroke-width="0"/><rect x="296.8" y="385.3333333333333" width="12.8" hei