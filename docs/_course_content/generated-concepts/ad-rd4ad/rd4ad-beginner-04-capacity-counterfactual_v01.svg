<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">RD4AD：bottleneck 與 decoder capacity 的受控反事實</title><desc id="desc">同一正常紋理與刮痕在不同 normal-path capacity 下，可能出現 false hold、候選分離或過度重建造成的漏檢風險。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D9485F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0B2858"/><rect x="40" y="34" width="148" height="38" rx="19" fill="#E8F2FF" stroke="#E8F2FF" stroke-width="0"/><text x="114.0" y="59.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">受控反事實</text><text x="40" y="125.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="39" font-weight="900" fill="#081A38" text-anchor="start">同一組正常與刮痕，容量太窄與太寬會犯相反的錯</text><text x="40" y="171.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="500" fill="#536A91" text-anchor="start">三欄只改 bottleneck／decoder capacity 與其 normal-trained checkpoint；示意結果是 POC 要驗證的假說，不是模型保證。</text><rect x="1320" y="36" width="312" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1476" y="68.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="800" fill="#1769E0" text-anchor="middle">RD4AD</text><rect x="40" y="236" width="492" height="570" rx="26" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><rect x="60" y="256" width="452" height="48" rx="18" fill="#FFFFFF" stroke="#F38B00" stroke-width="2"/><text x="286" y="288.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="900" fill="#F38B00" text-anchor="middle">① 太受限的 normal path</text><clipPath id="crop-capacity-narrow-82-330-1112-35"><rect x="82" y="330" width="408" height="178" rx="18"/></clipPath><g clip-path="url(#crop-capacity-narrow-82-330-1112-35)"><svg x="82" y="330" width="408" height="178" viewBox="1112 35 360 270" preserveAspectRatio="xMidYMid slice"><image href="rd4ad-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="82" y="330" width="408" height="178" rx="18" fill="none" stroke="#F38B00" stroke-width="2"/><rect x="230" y="396" width="74" height="64" rx="8" fill="none" stroke="#F38B00" stroke-width="4"/><text x="286" y="539.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="middle">同一張正常紋理 + 同一條刮痕</text><rect x="94" y="570" width="384" height="124" rx="18" fill="#F8FBFF" stroke="#D3E4FF" stroke-width="1"/><rect x="120" y="595" width="48" height="35" rx="5" fill="#F38B00" stroke="#F38B00" stroke-width="2"/><rect x="178" y="595" width="48" height="35" rx="5" fill="#F38B00" stroke="#F38B00" stroke-width="2"/><rect x="236" y="595" width="48" height="35" rx="5" fill="#F38B00" stroke="#F38B00" stroke-width="2"/><rect x="294" y="595" width="48" height="35" rx="5" fill="#D6E7FF" stroke="#1769E0" stroke-width="2"/><rect x="352" y="595" width="48" height="35" rx="5" fill="#D6E7FF" stroke="#1769E0" stroke-width="2"/><rect x="120" y="640" width="48" height="35" rx="5" fill="#D6E7FF" stroke="#1769E0" stroke-width="2"/><rect x="178" y="640" width="48" height="35" rx="5" fill="#D6E7FF" stroke="#1769E0" stroke-width="2"/><rect x="236" y="640" width="48" height="35" rx="5" fill="#F38B00" stroke="#F38B00" stroke-width="2"/><rect x="294" y="640" width="48" height="35" rx="5" fill="#F38B00" stroke="#F38B00" stroke-width="2"/><rect x="352" y="640" width="48" height="35" rx="5" fill="#F38B00" stroke="#F38B00" stroke-width="2"/><text x="286" y="731.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#F38B00" text-anchor="middle">正常紋理也留下差距</text><text x="286" y="766.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="middle">false HOLD → 擴大驗證，不是只壓低 loss</text><rect x="590" y="236" width="492" height="570" rx="26" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><rect x="610" y="256" width="452" height="48" rx="18" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><text x="836" y="288.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="900" fill="#1769E0" text-anchor="middle">② 已 qualification 的容量</text><clipPath id="crop-capacity-qualified-632-330-1112-35"><rect x="632" y="330" width="408" height="178" rx="18"/></clipPath><g clip-path="url(#crop-capacity-qualified-632-330-1112-35)"><svg x="632" y="330" width="408" height="178" viewBox="1112 35 360 270" preserveAspectRatio="xMidYMid slice"><image href="rd4ad-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="632" y="330" width="408" height="178" rx="18" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="780" y="396" width="74" height="64" rx="8" fill="none" stroke="#F38B00" stroke-width="4"/><text x="836" y="539.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="middle">同一張正常紋理 + 同一條刮痕</text><rect x="644" y="570" width="384" height="124" rx="18" fill="#F8FBFF" stroke="#D3E4FF" stroke-width="1"/><rect x="670" y="595" width="48" height="35" rx="5" fill=