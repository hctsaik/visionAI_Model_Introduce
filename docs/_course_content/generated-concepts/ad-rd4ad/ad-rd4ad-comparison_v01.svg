n mismatch into a candidate" data-must-show="Autoencoder (AE)：encoder-decoder 對指定 image 或 feature target 的重建 | candidate output: target 與 reconstruction residual 大 | Same input, ROI, preprocess, truth, and evidence gate; do not switch the comparison contract." data-not-claim="Autoencoder (AE) output is a candidate, not verified field truth; still use the evidence gate."><title>Autoencoder (AE)：encoder-decoder 對指定 image 或 feature target 的重建</title><rect x="1145" y="346" width="422" height="112" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="1225.59" y1="396.26" x2="1286.07" y2="396.26" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="1327.6499999999999" y1="396.26" x2="1388.13" y2="396.26" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="1429.71" y1="396.26" x2="1486.41" y2="396.26" stroke="#F38B00" stroke-width="4" marker-end="url(#arrow-orange)"/><g data-entity="input" data-entity-label-full="輸入"><path d="M1204.8 385.1806896551724L1214.5758620689655 391.0462068965517L1214.5758620689655 401.47379310344826L1204.8 407.3393103448276L1195.0241379310344 401.47379310344826L1195.0241379310344 391.0462068965517z" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><text data-label-line="true" x="1204.8" y="416.7893103448276" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">輸入</text></g><g data-entity="bottleneck" data-entity-label-full="bottleneck"><path d="M1306.86 385.1806896551724L1316.6358620689655 391.0462068965517L1316.6358620689655 401.47379310344826L1306.86 407.3393103448276L1297.0841379310343 401.47379310344826L1297.0841379310343 391.0462068965517z" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="3"/><text data-label-line="true" x="1306.86" y="416.7893103448276" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fil