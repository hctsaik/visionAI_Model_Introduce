 Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">gap</text></g></g><text x="105" y="493.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="900" fill="#1769E0">它把正常表示成</text><text x="105" y="525" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17.5" font-weight="650" fill="#0B2858">frozen teacher 下的 one-class</text><text x="105" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17.5" font-weight="650" fill="#0B2858">bottleneck＋reverse decoder</text><line x1="105" y1="628" x2="527" y2="628" stroke="#D6E7FF" stroke-width="2"/><text x="105" y="659.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="900" fill="#F38B00">新輸入何時值得回看</text><text x="105" y="690" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17.5" font-weight="650" fill="#0B2858">教師與反向重建 feature 的 cosine</text><text x="105" y="713" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17.5" font-weight="650" fill="#0B2858">discrepancy 大</text><rect x="597" y="260" width="478" height="500" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><rect x="597" y="260" width="478" height="68" rx="24" fill="#0AA6D8"/><rect x="597" y="304" width="478" height="24" fill="#0AA6D8"/><text x="625" y="304.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">STFPM</text><g data-visual-cue="stfpm_feature_pyramid" data-renderer-art="anomaly" data-primitive="detector_feature_pyramid" data-semantic-scene="detector_feature_pyramid" data-semantic-entities="backbone|multi_scale_maps|