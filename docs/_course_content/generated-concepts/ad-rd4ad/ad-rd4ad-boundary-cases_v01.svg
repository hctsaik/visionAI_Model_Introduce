69E0" stroke-width="3"/><line x1="691.9689655172414" y1="438.63068965517243" x2="694.5758620689654" y2="449.3841379310345" stroke="#1769E0" stroke-width="3"/><circle cx="684.8" cy="430.48413793103447" r="4" fill="#1769E0"/><circle cx="677.6310344827585" cy="438.63068965517243" r="4" fill="#1769E0"/><circle cx="691.9689655172414" cy="438.63068965517243" r="4" fill="#1769E0"/><circle cx="675.0241379310345" cy="449.3841379310345" r="4" fill="#1769E0"/><circle cx="694.5758620689654" cy="449.3841379310345" r="4" fill="#1769E0"/><text data-label-line="true" x="684.8" y="460.7893103448276" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">幾何</text></g><g data-entity="residual" data-entity-label-full="residual"><line x1="775.4548275862069" y1="449.3841379310345" x2="798.2651724137932" y2="431.1358620689655" stroke="#0AA6D8" stroke-width="4"/><circle cx="793.3772413793104" cy="435.37206896551726" r="3.2586206896551726" fill="#F38B00"/><line x1="781.9720689655172" y1="444.1703448275862" x2="793.3772413793104" y2="435.37206896551726" stroke="#F38B00" stroke-width="4" stroke-dasharray="5 3"/><text data-label-line="true" x="786.86" y="460.7893103448276" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">residual</text></g><g data-entity="coverage" data-entity-label-full="coverage"><path d="M888.9200000000001 429.1806896551724L898.6958620689655 435.0462068965517L898.6958620689655 445.47379310344826L888.9200000000001 451.3393103448276L879.1441379310346 445.47379310344826L879.1441379310346 435.0462068965517z" fill="#EAF3FF" stroke="#F38B00" stroke-width="3"/><text data-label-line="true" x="888.9200000000001" y="460.7893103448276" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">coverage</text></g><g data-entity="qualification_gate" data-entity-label-full="gate"><path d="M987.2 428.5289655172414L998.2793103448276 440.26L987.2 451.9910344827586L976.1206896551724 440.26z" fill="#FFF4CC" stroke="#D84A4A" stroke-width="3"/><circle cx="987.2" cy="440.26" r="2.932758620689655" fill="#D84A4A"/><text data-label-line="true" x="987.2" y="460.7893103448276" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#D84A4A">gate</text></g><g data-relation="qualify geometry with residual and coverage"><rect x="658.34" y="472.24" width="192" height="10.66" rx="4.92" fill="#EAF3FF" stroke="#9FC4FF" stroke-width="2"/><text data-label-line="true" x="754.34" y="473.78999999999996" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">geometry</text><text data-label-line="true" x="754.34" y="489.12999999999994" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">qualifi</text></g></g><text x="625" y="520.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#F38B00">可能看到</text><text x="625" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">異常 feature 也可能被重建，或污染</text><text x="625" y="570" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">型態被教成 normal，造成小</text><text x="625" y="592" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">discrepancy 與漏檢。</text><line x1="625" y1="646" x2="1047" y2="646" stroke="#D6E7FF" stroke-width="2"/><text x="625" y="675.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#1769E0">正確下一步</text><text x="625" y="703" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">HOLD；審查 normal support、escaped</text><text x="625" y="725" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">defects 與容量設定，重新訓練後用真</text><text x="625" y="747" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">實 challenge qualification。</text><rect x="1117" y="260" width="478" height="516" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><circle cx="1161" cy="306" r="25" fill="#1769E0"/><text x="1161" y="314.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">3</text><text x="1199" y="313" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">teacher domain mismatch、ROI／照明</text><text x="1199" y="342" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">漂移或 tiny defect 被 smoothing 稀</text><text x="1199" y="371" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">釋</text><g data-visual-cue="drift_hold_rd4ad_tiny_feature_stride" data-renderer-art="drift_hold" data-primitive="teacher_student_paths" data-semantic-scene="teacher_student_paths" data-semantic-entities="roi|teacher|student" data-specialist-coverage="roi|teacher|student" data-semantic-relation="compare two declared feature paths" data-must-show="ROI/照明漂移 | 整片 feature discrepancy | tiny defect 被 smoothing 稀釋 | HOLD 指向 recipe/domain 檢查" data-not-claim="feature 差距可自動分辨量測漂移和目標缺陷。"><title>漂移與微小訊號</title><rect x="1145" y="390" width="422" height="98" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="teacher-student-parallel-paths"><rect x="1178.34" y="431.24" width="52.92" height="24.599999999999998" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M1183.6319999999998 449.198 L1195.8036 442.802 L1205.8583999999998 446.98400000000004 L1221.7343999999998 437.39" fill="none" stroke="#93B8E8" stroke-width="3"/><rect x="1192.6283999999998" y="437.39" width="19.0512" height="10.578" rx="4" fill="none" stroke="#F38B00" stroke-width="3" stroke-dasharray="6 4"/><line x1="1242.6" y1="440.26" x2="1295.52" y2="428.78" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="1242.6" y1="446.82" x2="1295.52" y2="457.48" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="1299.3" y="419.76" width="52.92" height="16.400000000000002" rx="6" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><rect x="1299.3" y="450.92" width="52.92" height="16.400000000000002" rx="6" fill="#E8FAFF" stroke="#0AA6D8" stroke-width="3"/><line x1="1363.56" y1="427.96" x2="1442.94" y2="436.98" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="1363.56" y1="459.12" x2="1442.94" y2="450.1" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="1454.28" y1="433.7" x2="1492.0800000000002" y2="453.38" stroke="#F38B00" stroke-width="5"/><text data-label-line="true" x="1325.76" y="416.48" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">teacher</text><text data-label-line="true" x="1325.76" y="477.98" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">student</text><text data-label-line="true" x="1473.18" y="477.98" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">gap</text></g></g><text x="1145" y="520.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#F38B00">可能看到</text><text x="1145" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">feature 差距反映量測或 feature</text><text x="1145" y="570" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">stride，而非目標缺陷。</text><line x1="1145" y1="646" x2="1567" y2="646" stroke="#D6E7FF" stroke-width="2"/><text x="1145" y="675.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#1769E0">正確下一步</text><text x="1145" y="703" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">先查 acquisition／teacher fit／</text><text x="1145" y="725" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">effective pixels；保存每層 map、</text><text x="1145" y="747" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">resize、fusion、smoothing 與失敗例。</text><rect x="77" y="816" width="1518" height="63" rx="20" fill="#FFF4CC" stroke="#F1B828"/><text x="836" y="855.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="800" fill="#674500">任一條件超出 qualification envelope：先停在 HOLD／REVIEW，保存 raw evidence 與版本，再決定怎麼重驗。</text>
