  <rect x="40" y="32" width="150" height="32" rx="16" fill="#E6F0FF"/><text x="58" y="54.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="16" font-weight="800" fill="#1769E0">反事實與安全邊界</text><text x="40" y="116" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="43" font-weight="900" fill="#071A3B">同一條因果鏈，會在哪裡被破壞？</text><text x="40" y="182" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="500" fill="#50698F">不是多背三個風險名詞；要能預測畫面可能怎麼變，並選擇安全的下一步。</text><text x="1630" y="57.0" text-anchor="end" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#5C7395">RD4AD</text><rect x="77" y="260" width="478" height="516" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><circle cx="121" cy="306" r="25" fill="#D84A4A"/><text x="121" y="314.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">1</text><text x="159" y="313" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">bottleneck 太受限或 normal modes</text><text x="159" y="342" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">未涵蓋</text><g data-visual-cue="rank_tradeoff_rd4ad_bottleneck_capacity" data-renderer-art="rank_tradeoff" data-primitive="teacher_student_paths" data-semantic-scene="teacher_student_paths" data-semantic-entities="roi|teacher|student" data-specialist-coverage="roi|teacher|student" data-semantic-relation="compare two declared feature paths" data-must-show="太窄 bottleneck 導致正常也重建差 | 太寬/過度泛化 decoder 重建異常 | false reject 與 escape 兩箭頭 | 中間需 qualification 的區" data-not-claim="bottleneck 越小或 decoder 越強一定越安全。"><title>瓶頸兩端都危險</title><rect x="105" y="390" width="422" height="98" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="teacher-student-parallel-paths"><rect x="138.34" y="431.24" width="52.92" height="24.599999999999998" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M143.632 449.198 L155.80360000000002 442.802 L165.85840000000002 446.98400000000004 L181.7344 437.39" fill="none" stroke="#93B8E8" stroke-width="3"/><rect x="152.6284" y="437.39" width="19.0512" height="10.578" rx="4" fill="none" stroke="#F38B00" stroke-width="3" stroke-dasharray="6 4"/><line x1="202.60000000000002" y1="440.26" x2="255.51999999999998" y2="428.78" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="202.60000000000002" y1="446.82" x2="255.51999999999998" y2="457.48" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="259.3" y="419.76" width="52.92" height="16.400000000000002" rx="6" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><rect x="259.3" y="450.92" width="52.92" height="16.400000000000002" rx="6" fill="#E8FAFF" stroke="#0AA6D8" stroke-width="3"/><line x1="323.56" y1="427.96" x2="402.94" y2="436.98" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="323.56" y1="459.12" x2="402.94" y2="450.1" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="414.28000000000003" y1="433.7" x2="452.08" y2="453.38" stroke="#F38B00" stroke-width="5"/><text data-label-line="true" x="285.76" y="416.48" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">teacher</text><text data-label-line="true" x="285.76" y="477.98" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">student</text><text data-label-line="true" x="433.18" y="477.98" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">gap</text></g></g><text x="105" y="520.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#F38B00">可能看到</text><text x="105" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">合法正常微特徵無法重建，</text><text x="105" y="570" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">discrepancy 大，false reject 與</text><text x="105" y="592" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">review load 上升。</text><line x1="105" y1="646" x2="527" y2="646" stroke="#D6E7FF" stroke-width="2"/><text x="105" y="675.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#1769E0">正確下一步</text><text x="105" y="703" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">以隔離 holdout、不同 lot/view 支援</text><text x="105" y="725" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">抽樣和 seed spread 驗證，不要只壓</text><text x="105" y="747" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">低訓練 loss。</text><rect x="597" y="260" width="478" height="516" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><circle cx="641" cy="306" r="25" fill="#F38B00"/><text x="641" y="314.0" 