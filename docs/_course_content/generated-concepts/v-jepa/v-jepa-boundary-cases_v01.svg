<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">V-JEPA 的反事實與 HOLD 說明圖</title>
  <desc id="desc">三個模型專屬反事實卡片，分別呈現條件被破壞時的可觀察結果和安全的 HOLD 或重驗下一步。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0B3068" flood-opacity=".12"/></filter>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker>
    <marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker>
    <style>text { dominant-baseline: alphabetic; } .fine { fill:#536A91; font-size:18px; }</style>
  </defs>
  <rect width="1672" height="941" fill="#F5F8FE"/>
  <rect x="40" y="32" width="150" height="32" rx="16" fill="#E6F0FF"/><text x="58" y="54.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="16" font-weight="800" fill="#1769E0">反事實與安全邊界</text><text x="40" y="116" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="43" font-weight="900" fill="#071A3B">同一條因果鏈，會在哪裡被破壞？</text><text x="40" y="182" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="500" fill="#50698F">不是多背三個風險名詞；要能預測畫面可能怎麼變，並選擇安全的下一步。</text><text x="1630" y="57.0" text-anchor="end" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#5C7395">V-JEPA</text><rect x="77" y="260" width="478" height="516" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><circle cx="121" cy="306" r="25" fill="#D84A4A"/><text x="121" y="314.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">1</text><text x="159" y="313" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">micro-event 不在 clip/token/mask</text><text x="159" y="342" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">覆蓋內</text><g data-visual-cue="masked_target_gap" data-renderer-art="masked_prediction" data-primitive="temporal_state_route" data-semantic-scene="temporal_state_route" data-semantic-entities="clip_features|temporal_state|candidate" data-specialist-coverage="clip_features|temporal_state|candidate" data-semantic-relation="route temporal representation to a bounded candidate" data-must-show="target mask blocks 圍繞短事件 | 事件不與任一 target block 重疊 | 邊界提示：target prediction loss 不能涵蓋不存在的內容。" data-not-claim="target prediction loss 不能涵蓋不存在的內容。"><title>target 區不含短事件</title><rect x="105" y="390" width="422" height="98" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="204.48999999999998" y1="440.26" x2="295.21" y2="440.26" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="336.79" y1="440.26" x2="423.72999999999996" y2="440.26" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="clip_features" data-entity-label-full="clip features"><rect x="171.8182" y="428.3782" width="5.9212" height="5.9212" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="179.7394" y="428.3782" width="5.9212" height="5.9212" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="187.6606" y="428.3782" width="5.9212" height="5.9212" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="171.8182" y="436.2994" width="5.9212" height="5.9212" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="179.7394" y="436.2994" width="5.9212" height="5.9212" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="187.6606" y="436.2994" width="5.9212" height="5.9212" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="171.8182" y="444.2206" width="5.9212" height="5.9212" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="179.7394" y="444.2206" width="5.9212" height="5.9212" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><rect x="187.6606" y="444.2206" width="5.9212" height="5.9212" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1"/><text data-label-line="true" x="183.7" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">clip features</text></g><g data-entity="temporal_state" data-entity-label-full="temporal state"><rect x="301.5352" y="432.6832" width="6.888" height="13.