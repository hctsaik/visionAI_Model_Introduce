ty="1"/><rect x="1096" y="411" width="52" height="52" rx="9" fill="#00A9C7" opacity="1"/><rect x="700" y="477" width="52" height="52" rx="9" fill="#00A9C7" opacity="1"/><rect x="766" y="477" width="52" height="52" rx="9" fill="#00A9C7" opacity="1"/><rect x="832" y="477" width="52" height="52" rx="9" fill="#00A9C7" opacity="1"/><rect x="898" y="477" width="52" height="52" rx="9" fill="#00A9C7" opacity="1"/><rect x="964" y="477" width="52" height="52" rx="9" fill="#00A9C7" opacity="1"/><rect x="1030" y="477" width="52" height="52" rx="9" fill="#00A9C7" opacity="1"/><rect x="1096" y="477" width="52" height="52" rx="9" fill="#00A9C7" opacity="1"/><text x="865" y="541" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#00A9C7" text-anchor="middle">cyan = visible context</text><text x="1220" y="541" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#F38B00" text-anchor="middle">orange = masked target blocks</text><rect x="760" y="610" width="650" height="62" rx="18" fill="#FFF7EC" stroke="#F38B00" stroke-width="2"/><text x="1085" y="650" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#774C00" text-anchor="middle">clip length · sampling · token shape · context/target locations · seed</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">帶走：context/target mask 是 V-JEPA 的 input contract；改 temporal coverage 或 block geometry 時，必須重做 representation、cost 與 event coverage qualification。</text></svg>