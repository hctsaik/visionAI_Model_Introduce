<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><marker id="a-1769E0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1769E0"/></marker><marker id="a-00A9C7" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#00A9C7"/></marker><marker id="a-F38B00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#F38B00"/></marker><marker id="a-D9485F" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#D9485F"/></marker><marker id="a-159A63" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#159A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#082554"/><rect x="1240" y="33" width="388" height="50" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1434" y="66" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">V-JEPA · NOT PIXEL GENERATION</text><text x="40" y="108" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="38" font-weight="900" fill="#071D43" text-anchor="start">第三步：latent 在 feature space 對齊，不是 pixel 或事件結論</text><text x="40" y="153" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="550" fill="#506584" text-anchor="start">這個圖刻意不畫影像 decoder：V-JEPA 學的是 latent agreement，不是未來影格生成、pixel reconstruction、追蹤或事件 release。</text><clipPath id="clip-55-260"><rect x="55" y="260" width="340" height="390" rx="26"/></clipPath><g clip-path="url(#clip-55-260)"><image href="v-jepa-beginner-01-conveyor-context_v01.png" x="55" y="260" width="340" height="390" preserveAspectRatio="xMidYMid slice"/></g><rect x="55" y="260" width="340" height="390" rx="26" fill="none" stroke="#1769E0" stroke-width="3"/><path d="M430 455 L520 455" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><rect x="550" y="235" width="400" height="450" rx="30" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><text x="750" y="305" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="31" font-weight="900" fill="#071D43" text-anchor="middle">feature space</text><circle cx="665" cy="420" r="18" fill="#00A9C7"/><circle cx="750" cy="505" r="18" fill="#1769E0"/><circle cx="835" cy="390" r="18" fill="#00A9C7"/><circle cx="850" cy="570" r="18" fill="#F38B00"/><circle cx="720" cy="600" r="18" fill="#1769E0"/><circle cx="780" cy="460" r="28" fill="none" stroke="#F38B00" stroke-width="6"/><text x="750" y="650" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#071D43" text-anchor="middle">predicted latent ↔ target latent</text><path d="M985 455 L1085 455" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#a-F38B00)"/><rect x="1115" y="230" width="470" height="470" rx="30" fill="#FFF0F2" stroke="#D9485F" stroke-width="3"/><text x="1350" y="320" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#071D43" text-anchor="middle">do not infer</text><text x="1350" y="375" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#071D43" text-anchor="middle">pixel recovery</text><text x="1350" y="430" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#071D43" text-anchor="middle">micro-event coverage</text><text x="1350" y="485" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#071D43" text-anchor="middle">event / anomaly score</text><text x="1350" y="540" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#071D43" text-anchor="middle">track / identity / release</text><text x="1350" y="650" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#D9485F" text-anchor="middle">needs a named downstream head</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">帶走：latent agreement 是預訓練訊號；只要 micro-event 沒被 clip/token coverage 保留，低 loss 也不能證明 downstream 看得見它。</text></svg>