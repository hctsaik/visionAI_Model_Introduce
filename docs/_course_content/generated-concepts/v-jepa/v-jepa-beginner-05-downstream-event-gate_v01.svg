<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><marker id="a-1769E0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1769E0"/></marker><marker id="a-00A9C7" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#00A9C7"/></marker><marker id="a-F38B00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#F38B00"/></marker><marker id="a-D9485F" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#D9485F"/></marker><marker id="a-159A63" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#159A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#082554"/><rect x="1240" y="33" width="388" height="50" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1434" y="66" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">V-JEPA · EVENT EVIDENCE GATE</text><text x="40" y="108" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="38" font-weight="900" fill="#071D43" text-anchor="start">第四步：只有被命名的 downstream head 才能對事件真值、時間聚合與 action 負責</text><text x="40" y="153" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="550" fill="#506584" text-anchor="start">V-JEPA、VideoMAE 或 ConvLSTM 的 pretraining/objective 不能互相取代；公平比較要固定同一 temporal pixels、split、head、truth、hardware 與 P95。</text><clipPath id="clip-55-245"><rect x="55" y="245" width="350" height="410" rx="26"/></clipPath><g clip-path="url(#clip-55-245)"><image href="v-jepa-beginner-01-conveyor-context_v01.png" x="55" y="245" width="350" height="410" preserveAspectRatio="xMidYMid slice"/></g><rect x="55" y="245" width="350" height="410" rx="26" fill="none" stroke="#1769E0" stroke-width="3"/><path d="M440 450 L530 450" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><rect x="560" y="225" width="380" height="470" rx="30" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><text x="750" y="315" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">context</text><text x="750" y="366" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">representation</text><text x="750" y="417" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">→ embedding-distance</text><text x="750" y="468" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">or fine-tuned</text><text x="750" y="519" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">task head</text><path d="M975 455 L1065 455" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#a-F38B00)"/><rect x="1095" y="220" width="500" height="500" rx="30" fill="#FFF7EC" stroke="#F38B00" stroke-width="3"/><text x="1345" y="290" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="31" font-weight="900" fill="#774C00" text-anchor="middle">same evidence gate</text><circle cx="1180" cy="372" r="11" fill="#F38B00"/><text x="1212" y="380" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#071D43" text-anchor="start">event truth + temporal aggregation</text><circle cx="1180" cy="442" r="11" fill="#F38B00"/><text x="1212" y="450" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#071D43" text-anchor="start">micro-event coverage + frame-drop</text><circle cx="1180" cy="512" r="11" fill="#F38B00"/><text x="1212" y="520" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#071D43" text-anchor="start">sequence / lot isolation + drift</text><circle cx="1180" cy="582" r="11" fill="#F38B00"/><text x="1212" y="590" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#071D43" text-anchor="start">token / VRAM + complete P95</text><text x="1345" y="670" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#D9485F" text-anchor="middle">candidate → REVIEW / HOLD</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">帶走：必須先讓 downstream head、event truth、aggregation、calibration 與 action owner 可追溯；否則 V-JEPA 只是一個研究表徵。</text></svg>