<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Keypoint R-CNN occlusion and observability boundary</title><desc id="desc">Occlusion, truncation, tiny instances, label changes, or RPN misses cause missing evidence. The safe outcome is explicit visibility, requalification, or HOLD—not hallucinated keypoints.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0C9B91" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C9B91"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-149A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#149A63"/></marker><marker id="arrow-536989" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536989"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#09224C"/><text x="42" y="98.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#09224C" text-anchor="start">最後只改可觀測條件：遮擋、截斷、太小或 label drift 時，正確輸出是 HOLD</text><text x="42" y="145.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#536989" text-anchor="start">visibility / occlusion policy、effective pixels、proposal recall、K order / symmetry、heatmap resolution 與 inverse mapping 都是同一條 landmark 證據鏈的 gate。</text><rect x="1318" y="32" width="310" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1473" y="65.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">Keypoint R-CNN · landmarks</text><g data-entity="keypoint_rcnn_mobile_boundary_causal_flow"><rect x="32" y="177" width="600" height="146" rx="18" fill="#FFF7EB" stroke="#F28B00" stroke-width="2"/><text x="46" y="218.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#F28B00" text-anchor="start">observability + label contract + mapping</text><text x="46" y="259.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="30" font-weight="900" fill="#D94B62" text-anchor="start">insufficient / changed → HOLD</text><text x="46" y="300.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#123265" text-anchor="start">save raw AOI + labels + error tail</text></g><path d="M638 300 L675 338" fill="none" stroke="#F28B00" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><rect x="62" y="348" width="460" height="360" rx="24" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><clipPath id="crop-boundary-0-80-385-350-0"><rect x="80" y="385" width="424" height="220" rx="18"/></clipPath><g clip-path="url(#crop-boundary-0-80-385-350-0)"><svg x="80" y="385" width="424" height="220" viewBox="350 0 1260 941" preserveAspectRatio="xMidYMid slice"><image href="../yolo-seg/yolo-seg-beginner-01-pcb-instance-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="80" y="385" width="424" height="220" rx="18" fill="none" stroke="#1769E0" stroke-width="2"/><text x="292" y="374.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#1769E0" text-anchor="middle">A · enough pixels, all K visible</text><rect x="318" y="434" width="48" height="91" rx="12" fill="none" stroke="#149A63" stroke-width="4"/><rect x="318" y="395" width="48" height="34" rx="10" fill="#149A63" stroke="#149A63" stroke-width="0"/><text x="342.0" y="419.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">A</text><circle cx="330" cy="446" r="10" fill="#FFFFFF" stroke="#F28B00" stroke-width="4"/><circle cx="330" cy="446" r="3" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><circle cx="354" cy="446" r="10" fill="#FFFFFF" stroke="#00A8C6" stroke-width="4"/><circle cx="354" cy="446" r="3" fill="#00A8C6" stroke="#00A8C6" stroke-width="0"/><circle cx="354" cy="513" r="10" fill="#FFFFFF" stroke="#7657C8" stroke-width="4"/><circle cx="354" cy="513" r="3" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><circle cx="330" cy="513" r="10" fill="#FFFFFF" stroke="#149A63" stroke-width="4"/><circle cx="330" cy="513" r="3" fill="#149A63" stroke="#149A63" stroke-width="0"/><rect x="90" y="632" width="404" height="45" rx="14" fill="#EFFBF4" stroke="#149A63" stroke-width="2"/><text x="292" y="662.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#149A63" text-anchor="middle">eligible for review</text><rect x="575" y="348" width="460" height="360" rx="24" fill="#FFFFFF" stroke="#F28B00" stroke-width="2"/><clipPath id="crop-boundary-1-593-385-350-0"><rect x="593" y="385" width="424" height="220" rx="18"/></clipPath><g clip-path="url(#crop-boundary-1-593-385-350-0)"><svg x="593" y="385" width="424" height="220" viewBox="350 0 1260 941" preserveAspectRatio="xMidYMid slice"><image href="../yolo-seg/yolo-seg-beginner-01-pcb-instance-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="593" y="385" width="424" height="220" rx="18" fill="none" stroke="#F28B00" stroke-width="2"/><text x="805" y="374.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#F28B00" text-anchor="middle">B · occluded K3: label it</text><rect x="831" y="434" width="48" height="91" rx="12" fill="none" stroke="#F28B00" stroke-width="4"/><rect x="831" y="395" width="48" height="34" rx="10" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="855.0" y="419.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">A</text><circle cx="843" cy="446" r="10" fill="#FFFFFF" stroke="#F28B00" stroke-width="4"/><circle cx="843" cy="446" r="3" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><circle cx="867" cy="446" r="10" fill="#FFFFFF" stroke="#00A8C6" stroke-width="4"/><circle cx="867" cy="446" r="3" fill="#00A8C6" stroke="#00A8C6" stroke-width="0"/><circle cx="867" cy="513" r="10" fill="#FFFFFF" stroke="#7657C8" stroke-width="4"/><circle cx="867" cy="513" r="3" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><circle cx="843" cy="513" r="10" fill="#FFFFFF" stroke="#149A63" stroke-width="4"/><circle cx="843" cy="513" r="3" fill="#149A63" stroke="#149A63" stroke-width="0"/><rect x="855" y="489" width="42" height="55" rx="8" fill="#26394F" fill-opacity="0.78"/><text x="805" y="574.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">K3 = occluded / ignore</text><rect x="603" y="632" width="404" height="45" rx="14" fill="#FFF0F1" stroke="#D94B62" stroke-width="2"/><text x="805" y="662.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="middle">visibility / missing review</text><rect x="1088" y="348" width="460" height="360" rx="24" fill="#FFFFFF" stroke="#D94B62" stroke-width="2"/><clipPath id="crop-boundary-2-1106-385-350-0"><rect x="1106" y="385" width="424" height="220" rx="18"/></clipPath><g clip-path="url(#crop-boundary-2-1106-385-350-0)"><svg x="1106" y="385" width="424" height="220" viewBox="350 0 1260 941" preserveAspectRatio="xMidYMid slice"><image href="../yolo-seg/yolo-seg-beginner-01-pcb-instance-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="1106" y="385" width="424" height="220" rx="18" fill="none" stroke="#D94B62" stroke-width="2"/><text x="1318" y="374.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#D94B62" text-anchor="middle">C · tiny / truncated: RPN miss</text><rect x="1391" y="444" width="32" height="60" rx="8" fill="none" stroke="#D94B62" stroke-width="3"/><text x="1415" y="541.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#D94B62" text-anchor="middle">?</text><rect x="1363" y="426" width="90" height="112" rx="10" fill="none" stroke="#D94B62" stroke-width="3"/><text x="1318" y="574.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">proposal missing → no heatmaps</text><rect x="1116" y="632" width="404" height="45" rx="14" fill="#FFF0F1" stroke="#D94B62" stroke-width="2"/><text x="1318" y="662.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="middle">no ROI → HOLD</text><rect x="62" y="738" width="1546" height="75" rx="20" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="92" y="773" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#123265" text-anchor="start">evidence bundle：raw AOI / product revision · boxes + K order / symmetry / visibility labels · RPN / NMS / ROIAlign · heatmap resolution · inverse map</text><text x="92" y="797" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#123265" text-anchor="start">proposal + keypoint recall · missing / swap / association errors · pixel error / OKS / P95 tail · failure images。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">不要猜出被遮擋的 K 點，也不要把 box / peak 分數當量測 uncertainty；證據不足、schema 改變或 instance 漏失就 HOLD。</text></svg>