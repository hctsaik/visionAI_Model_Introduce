<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">peak 回映成可審計座標</title><desc id="desc">Keypoint R-CNN 將 heatmap peaks 經 confidence 和 inverse mapping 交付每個 instance 的 ordered keypoints。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="keypoint_inverse_mapping" data-renderer-art="detector_or_pose" data-primitive="keypoint_inverse_coordinates" data-semantic-scene="keypoint_inverse_coordinates" data-semantic-entities="heatmap_peak|inverse_transform|audit_coordinates" data-specialist-coverage="heatmap_peak|inverse_transform|audit_coordinates" data-semantic-relation="map peaks back to inspectable coordinates" data-must-show="heatmap peak 經 argmax/soft-argmax | confidence/visibility gate | inverse transform 回到 image" data-not-claim="peak 或 box score 不是校正後的不確定性。"><title>peak 回映成可審計座標</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="178.27999999999997" y1="132.44" x2="326.12" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="393.88" y1="132.44" x2="535.56" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="heatmap_peak" data-entity-label-full="peak"><rect x="119.97241379310341" y="108.01241379310343" width="14.28505747126437" height="14.28505747126437" rx="2" fill="#DCEBFF" stroke="#1769E0" stroke-width="1