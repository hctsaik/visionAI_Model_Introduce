<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Keypoint R-CNN proposal to ROIAlign dependency</title><desc id="desc">Backbone and FPN features feed RPN proposals. Filter and NMS select known instances; only selected proposals receive ROIAlign and later keypoint heatmaps.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0C9B91" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C9B91"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-149A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#149A63"/></marker><marker id="arrow-536989" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536989"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#09224C"/><text x="42" y="98.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#09224C" text-anchor="start">第一步：RPN 先提出 instance；沒有 proposal，就沒有 ROIAlign 或 K 點 heatmaps</text><text x="42" y="145.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#536989" text-anchor="start">backbone / FPN 產生多尺度 features，RPN 以 objectness + box proposals 經 filter / NMS 選出要進每個 ROI 的 known instances。</text><rect x="1318" y="32" width="310" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1473" y="65.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">Keypoint R-CNN · landmarks</text><g data-entity="keypoint_rcnn_mobile_rpn_causal_flow"><rect x="32" y="177" width="600" height="110" rx="18" fill="#EFF7FF" stroke="#1769E0" stroke-width="2"/><text x="46" y="221.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="31" font-weight="900" fill="#1769E0" text-anchor="start">image → backbone / FPN → RPN</text><text x="46" y="261.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#123265" text-anchor="start">proposal → ROIAlign → K heatmaps</text></g><clipPath id="crop-rpn-raw-62-349-350-0"><rect x="62" y="349" width="410" height="278" rx="22"/></clipPath><g clip-path="url(#crop-rpn-raw-62-349-350-0)"><svg x="62" y="349" width="410" height="278" viewBox="350 0 1260 941" preserveAspectRatio="xMidYMid slice"><image href="../yolo-seg/yolo-seg-beginner-01-pcb-instance-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="62" y="349" width="410" height="278" rx="22" fill="none" stroke="#1769E0" stroke-width="2"/><text x="267" y="329.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#123265" text-anchor="middle">same PCB AOI</text><rect x="308" y="430" width="56" height="106" rx="12" fill="none" stroke="#149A63" stroke-width="4"/><rect x="308" y="391" width="56" height="34" rx="10" fill="#149A63" stroke="#149A63" stroke-width="0"/><text x="336.0" y="415.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">A</text><rect x="383" y="430" width="56" height="106" rx="12" fill="none" stroke="#149A63" stroke-width="4"/><rect x="383" y="391" width="56" height="34" rx="10" fill="#149A63" stroke="#149A63" stroke-width="0"/><text x="411.0" y="415.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">B</text><rect x="179" y="508" width="46" height="64" rx="10" fill="none" stroke="#D94B62" stroke-width="3"/><text x="202" y="604.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D94B62" text-anchor="middle">tiny / missed</text><path d="M500 487 L566 487" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="592" y="330" width="292" height="316" rx="24" fill="#FFFFFF" stroke="#00A8C6" stroke-width="2"/><text x="738" y="371.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#00A8C6" text-anchor="middle">backbone / FPN</text><rect x="633.0" y="416" width="210" height="36" rx="10" fill="#E9FBFF" stroke="#00A8C6" stroke-width="2"/><rect x="645.0" y="425" width="18" height="18" rx="4" fill="#BDEFF5" stroke="#00A8C6" stroke-width="1"/><rect x="672.0" y="425" width="18" height="18" rx="4" fill="#BDEFF5" stroke="#00A8C6" stroke-width="1"/><rect x="699.0" y="425" width="18" height="18" rx="4" fill="#BDEFF5" stroke="#00A8C6" stroke-width="1"/><rect x="726.0" y="425" width="18" height="18" rx="4" fill="#BDEFF5" stroke="#00A8C6" stroke-width="1"/><rect x="753.0" y="425" width="18" height="18" rx="4" fill="#BDEFF5" stroke="#00A8C6" stroke-width="1"/><text x="857" y="442.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#00A8C6" text-anchor="start">P3</text><rect x="653.0" y="477" width="170" height="36" rx="10" fill="#E9FBFF" stroke="#00A8C6" stroke-width="2"/><rect x="665.0" y="486" width="18" height="18" rx="4" fill="#BDEFF5" stroke="#00A8C6" stroke-width="1"/><rect x="692.0" y="486" width="18" height="18" rx="4" fill="#BDEFF5" stroke="#00A8C6" stroke-width="1"/><rect x="719.0" y="486" width="18" height="18" rx="4" fill="#BDEFF5" stroke="#00A8C6" stroke-width="1"/><rect x="746.0" y="486" width="18" height="18" rx="4" fill="#BDEFF5" stroke="#00A8C6" stroke-width="1"/><text x="857" y="503.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#00A8C6" text-anchor="start">P4</text><rect x="673.0" y="538" width="130" height="36" rx="10" fill="#E9FBFF" stroke="#00A8C6" stroke-width="2"/><rect x="685.0" y="547" width="18" height="18" rx="4" fill="#BDEFF5" stroke="#00A8C6" stroke-width="1"/><rect x="712.0" y="547" width="18" height="18" rx="4" fill="#BDEFF5" stroke="#00A8C6" stroke-width="1"/><rect x="739.0" y="547" width="18" height="18" rx="4" fill="#BDEFF5" stroke="#00A8C6" stroke-width="1"/><text x="857" y="564.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#00A8C6" text-anchor="start">P5</text><text x="738" y="611.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="750" fill="#536989" text-anchor="middle">multi-scale instance features</text><path d="M910 487 L974 487" fill="none" stroke="#00A8C6" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><rect x="999" y="330" width="270" height="316" rx="24" fill="#FFFFFF" stroke="#F28B00" stroke-width="2"/><text x="1134" y="371.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#F28B00" text-anchor="middle">RPN + filter / NMS</text><rect x="1032" y="421" width="204" height="46" rx="15" fill="#FFF7EB" stroke="#F28B00" stroke-width="2"/><text x="1134.0" y="451.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#F28B00" text-anchor="middle">objectness + box</text><rect x="1032" y="489" width="204" height="46" rx="15" fill="#EFFBF4" stroke="#149A63" stroke-width="2"/><text x="1134.0" y="519.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#149A63" text-anchor="middle">proposal A</text><rect x="1032" y="548" width="204" height="46" rx="15" fill="#EFFBF4" stroke="#149A63" stroke-width="2"/><text x="1134.0" y="578.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#149A63" text-anchor="middle">proposal B</text><text x="1134" y="611.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D94B62" text-anchor="middle">missed object is not repaired later</text><path d="M1296 487 L1357 487" fill="none" stroke="#149A63" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-149A63)"/><rect x="1383" y="330" width="225" height="316" rx="24" fill="#F7F3FF" stroke="#7657C8" stroke-width="2"/><text x="1495" y="371.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#7657C8" text-anchor="middle">ROIAlign per proposal</text><rect x="1430" y="429" width="130" height="64" rx="12" fill="#EFF7FF" stroke="#1769E0" stroke-width="2"/><text x="1495" y="454.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#123265" text-anchor="middle">ROI A</text><rect x="1452" y="463" width="14" height="14" rx="3" fill="#C9DFFF" stroke="#1769E0" stroke-width="1"/><rect x="1475" y="463" width="14" height="14" rx="3" fill="#C9DFFF" stroke="#1769E0" stroke-width="1"/><rect x="1498" y="463" width="14" height="14" rx="3" fill="#C9DFFF" stroke="#1769E0" stroke-width="1"/><rect x="1521" y="463" width="14" height="14" rx="3" fill="#C9DFFF" stroke="#1769E0" stroke-width="1"/><rect x="1430" y="525" width="130" height="64" rx="12" fill="#EFF7FF" stroke="#00A8C6" stroke-width="2"/><text x="1495" y="550.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#123265" text-anchor="middle">ROI B</text><rect x="1452" y="559" width="14" height="14" rx="3" fill="#C9DFFF" stroke="#1769E0" stroke-width="1"/><rect x="1475" y="559" width="14" height="14" rx="3" fill="#C9DFFF" stroke="#1769E0" stroke-width="1"/><rect x="1498" y="559" width="14" height="14" rx="3" fill="#C9DFFF" stroke="#1769E0" stroke-width="1"/><rect x="1521" y="559" width="14" height="14" rx="3" fill="#C9DFFF" stroke="#1769E0" stroke-width="1"/><rect x="62" y="715" width="1546" height="92" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="92" y="751.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#123265" text-anchor="start">proposal recall 是 end-to-end keypoint recall 的上限：被遮擋、太小、被 NMS 移除或沒有有效 pixels 的 instance，根本不會進 ROIAlign。</text><text x="92" y="785.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="700" fill="#536989" text-anchor="start">所以先量 proposal recall / missing rate / critical size；不要只調 heatmap head，然後宣稱 landmark 路徑已可靠。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">Keypoint R-CNN 的 two-stage 順序不可跳過：先 proposal，才有 instance-local ROI 與 K 個 ordered landmark channels。</text></svg>