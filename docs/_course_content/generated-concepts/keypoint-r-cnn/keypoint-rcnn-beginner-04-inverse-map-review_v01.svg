B00" fill-opacity="0.94" stroke="#F28B00" stroke-width="0"/><rect x="720" y="446" width="14" height="14" rx="3" fill="#DDF8FC" fill-opacity="0.94" stroke="#DDF8FC" stroke-width="0"/><rect x="738" y="446" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="756" y="446" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="702" y="464" width="14" height="14" rx="3" fill="#DDF8FC" fill-opacity="0.94" stroke="#DDF8FC" stroke-width="0"/><rect x="720" y="464" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="738" y="464" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="756" y="464" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="702" y="482" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="720" y="482" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="738" y="482" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="756" y="482" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="702" y="500" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="720" y="500" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="738" y="500" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="756" y="500" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><text x="740" y="439.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F28B00" text-anchor="middle">K1 peak</text><rect x="820" y="421" width="116" height="116" rx="16" fill="#FFFFFF" stroke="#7657C8" stroke-width="2"/><rect x="840" y="446" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="858" y="446" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="876" y="446" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="894" y="446" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="840" y="464" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="858" y="464" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="876" y="464" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="894" y="464" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="840" y="482" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="858" y="482" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="876" y="482" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="894" y="482" width="14" height="14" rx="3" fill="#DDF8FC" fill-opacity="0.94" stroke="#DDF8FC" stroke-width="0"/><rect x="840" y="500" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="858" y="500" width="14" height="14" rx="3" fill="#EEF4FF" fill-opacity="1" stroke="#EEF4FF" stroke-width="0"/><rect x="876" y="500" width="14" height="14" rx="3" fill="#DDF8FC" fill-opacity="0.94" stroke="#DDF8FC" stroke-width="0"/><rect x="894" y="500" width="14" height="14" rx="3" fill="#7657C8" fill-opacity="0.94" stroke="#7657C8" stroke-width="0"/><text x="878" y="439.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7657C8" text-anchor="middle">K3 peak</text><rect x="678" y="564" width="228" height="46" rx="15" fill="#EFFBF4" stroke="#0C9B91" stroke-width="2"/><text x="792.0" y="594.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#0C9B91" text-anchor="middle">visibility + confidence</text><text x="792" y="647.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="750" fill="#536989" text-anchor="middle">ROI box + heatmap resolution</text><path d="M978 500 L1053 500" fill="none" stroke="#7657C8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="1080" y="340" width="224" height="344" rx="24" fill="#FFFFFF" stroke="#F28B00" stroke-width="2"/><text x="1192" y="382.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#F28B00" text-anchor="middle">inverse map</text><path d="M1132 449 C1180 418, 1226 486, 1254 442" fill="none" stroke="#F28B00" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><text x="1192" y="535.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#123265" text-anchor="middle">ROI local</text><text x="1192" y="567.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#F28B00" text-anchor="middle">(u, v)</text><path d="M1192 587 L1192 624" fill="none" stroke="#F28B00" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><text x="1192" y="655.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#123265" text-anchor="middle">raw image (x, y)</text><path d="M1330 500 L1380 500" fill="none" stroke="#149A63" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-149A63)"/><rect x="1402" y="340" width="206" height="344" rx="24" fill="#EFFBF4" stroke="#149A63" stroke-width="2"/><text x="1505" y="382.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#149A63" text-anchor="middle">review evidence</text><text x="1505" y="434.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#123265" text-anchor="middle">proposal / class</text><text x="1505" y="476.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#123265" text-anchor="middle">K order / v</text><text x="1505" y="518.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#123265" text-anchor="middle">peak + box scores</text><text x="1505" y="560.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#123265" text-anchor="middle">pixel error / OKS</text><text x="1505" y="602.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#123265" text-anchor="middle">raw ROI / version</text><rect x="1430" y="624" width="150" height="37" rx="12" fill="#FFF0F1" stroke="#D94B62" stroke-width="2"/><text x="1505" y="649.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">missing evidence → HOLD</text><rect x="62" y="716" width="1546" height="91" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="92" y="751.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#123265" text-anchor="start">inverse map 讓 candidate points 回到可追查的原始座標；pixel coordinate 仍不等於 calibrated physical uncertainty、2D / 3D pose 或可直接執行的機台動作。</text><text x="92" y="785.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="700" fill="#536989" text-anchor="start">若要量測或控制，另接 camera calibration、repeatability、per-keypoint uncertainty 與由對應 owner 負責的 geometry / safety gate。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">Keypoint R-CNN 交付可回查的 per-instance landmark candidates；回映、誤差與 review 完整時，才可能交接給後段。</text></svg>