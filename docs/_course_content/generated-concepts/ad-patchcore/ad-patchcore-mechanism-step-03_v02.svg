<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">coreset 留代表頁</title><desc id="desc">PatchCore 從大量正常 patch embeddings 以 coreset 保留代表例，建立可版本化 memory bank。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="memory_nn_patchcore_coreset_bank" data-renderer-art="anomaly" data-primitive="patchcore_coreset_memory" data-semantic-scene="patchcore_coreset_memory" data-semantic-entities="embedding_album|coreset|nearest_neighbor" data-specialist-coverage="embedding_album|coreset|nearest_neighbor" data-semantic-relation="keep representative normal embeddings for nearest-neighbor lookup" data-must-show="大量 normal patch embeddings | coreset/subsampling 篩選器 | 較小的代表 memory bank | versioned index 與 support IDs" data-not-claim="coreset 壓縮不會改變正常涵蓋。"><title>coreset 留代表頁</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="patchcore-coreset-nearest-neighbor"><rect x="95.11999999999998" y="88.75999999999999" width="98.56" height="18.72" rx="3" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><rect x="95.11999999999998" y="117.88" width="98.56" height="18.72" rx="3" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><rect x="95.11999999999998" y="147.0" width="98.56" height="18.72" rx="3" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><line x1="205.99999999999997" y1="140.76" x2="304.56" y2