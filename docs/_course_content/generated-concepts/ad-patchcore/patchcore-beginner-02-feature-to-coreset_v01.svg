"#F38B00" stroke-width="2"/><rect x="1138" y="674" width="14" height="32" rx="5" fill="#F38B00"/><rect x="1161" y="648" width="14" height="58" rx="5" fill="#F38B00"/><rect x="1184" y="664" width="14" height="42" rx="5" fill="#F38B00"/><rect x="1207" y="633" width="14" height="73" rx="5" fill="#F38B00"/><rect x="1230" y="658" width="14" height="48" rx="5" fill="#F38B00"/><rect x="1253" y="643" width="14" height="63" rx="5" fill="#F38B00"/><path d="M1108 663 L1202 663" fill="none" stroke="#F38B00" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><path d="M1232 663 L1425 485" fill="none" stroke="#F38B00" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-F38B00)" stroke-dasharray="9 8"/><circle cx="1425" cy="485" r="9" fill="#F38B00"/><text x="1310" y="735.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#F38B00" text-anchor="middle">它問：整個 retained bank 裡，</text><text x="1310" y="760.6" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#F38B00" text-anchor="middle">有沒有夠近的正常 exemplar？</text><text x="1264" y="792.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="middle">coreset 壓縮率改變 coverage、RAM／P95 與後續 distance。</text><rect x="40" y="849" width="1592" height="52" rx="22" fill="#FFF4CC" stroke="#F1B828" stroke-width="2"/><circle cx="78" cy="873" r="10" fill="none" stroke="#C58A00" stroke-width="2"/><path d="M72 883 L75 890 L81 890 L84 883" fill="none" stroke="#C58A00" stroke-width="2" stroke-linecap="round"/><path d="M64 873 L58 873 M92 873 L98 873 M67 862 L62 857 M89 862 L94 857" fill="none" stroke="#C58A00" stroke-width="2" stroke-linecap="round"/><text x="108" y="883.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="start">PatchCore 的 normality 是代表性 normal patch-feature memory，不是正常原圖、單一中心或 defect classifier。</text></svg>