<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">PatchCore：normal patch feature 如何成為 representative coreset</title><desc id="desc">正常與待檢局部在同一特徵 recipe 下形成 feature description；待檢 feature 可查整個代表性 normal memory，不限同一物理位置。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D9485F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0B2858"/><rect x="40" y="34" width="148" height="38" rx="19" fill="#E8F2FF" stroke="#E8F2FF" stroke-width="0"/><text x="114.0" y="59.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">比較規則</text><text x="40" y="125.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="39" font-weight="900" fill="#081A38" text-anchor="start">PatchCore 先把正常局部變成可查詢的代表相簿</text><text x="40" y="171.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="500" fill="#536A91" text-anchor="start">相簿保留的是 feature exemplar；待檢局部可查整個 retained bank，不限同一個物理位置。</text><rect x="1320" y="36" width="312" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1476" y="68.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="800" fill="#1769E0" text-anchor="middle">PatchCore</text><text x="70" y="250.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="27" font-weight="900" fill="#0B2858" text-anchor="start">已核准 normal support</text><text x="70" y="281.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="600" fill="#536A91" text-anchor="start">各張只提供『正常可怎麼變』的局部證據</text><clipPath id="crop-support-0-70-310-50-44"><rect x="70" y="310" width="250" height="106" rx="16"/></clipPath><g clip-path="url(#crop-support-0-70-310-50-44)"><svg x="70" y="310" width="250" height="106" viewBox="50 44 220 170" preserveAspectRatio="xMidYMid slice"><image href="patchcore-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="70" y="310" width="250" height="106" rx="16" fill="none" stroke="#1769E0" stroke-width="2"/><clipPath id="crop-support-1-70-436-50-236"><rect x="70" y="436" width="250" height="106" rx="16"/></clipPath><g clip-path="url(#crop-support-1-70-436-50-236)"><svg x="70" y="436" width="250" height="106" viewBox="50 236 220 170" preserveAspectRatio="xMidYMid slice"><image href="patchcore-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="70" y="436" width="250" height="106" rx="16" fill="none" stroke="#1769E0" stroke-width="2"/><clipPath id="crop-support-2-70-562-50-428"><rect x="70" y="562" width="250" height="106" rx="16"/></clipPath><g clip-path="url(#crop-support-2-70-562-50-428)"><svg x="70" y="562" width="250" height="106" viewBox="50 428 220 170" preserveAspectRatio="xMidYMid slice"><image href="patchcore-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="70" y="562" width="250" height="106" rx="16" fill="none" stroke="#1769E0" stroke-width="2"/><text x="195" y="707.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="800" fill="#1769E0" text-anchor="middle">這些是影像局部 patch</text><clipPath id="crop-query-scratch-70-735-1260-352"><rect x="70" y="735" width="250" height="80" rx="16"/></clipPath><g clip-path="url(#crop-query-scratch-70-735-1260-352)"><svg x="70" y="735" width="250" height="80" viewBox="1260 352 172 195" preserveAspectRatio="xMidYMid slice"><image href="patchcore-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="70" y="735" width="250" height="80" rx="16" fill="none" stroke="#F38B00" stroke-width="2"/><text x="195" y="804.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">待檢刮痕 patch</text><path d="M330 430 L466 430" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><path d="M330 775 L466 625" fill="none" stroke="#F38B00" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-F38B00)" stroke-dasharray="10 9"/><text x="632" y="351.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="24" font-weight="900" fill="#0B2858" text-anchor="middle">同一套 feature recipe</text><path d="M466 541 L558 523 L558 477 L466 495" fill="#DCEBFF" stroke="#1769E0" stroke-width="2"/><path d="M502 541 L594 508 L594 456 L502 489" fill="#BFD8FF" stroke="#1769E0" stroke-width="2"/><path d="M544 541 L636 493 L636 434 L544 482" fill="#88B7FF" stroke="#1769E0" stroke-width="2"/><path d="M616 481 L690 481" stroke="#1769E0" stroke-width="5" marker-end="url(#arrow-1769E0)"/><rect x="698" y="440" width="98" height="96" rx="18" fill="#EFF7FF" stroke="#00A8C6" stroke-width="2"/><rect x="712" y="496" width="14" height="32" rx="5" fill="#00A8C6"/><rect x="735" y="470" width="14" height="58" rx="5" fill="#00A8C6"/><rect x="758" y="486" width="14" height="42" rx="5" fill="#00A8C6"/><rect x="781" y="455" width="14" height="73" rx="5" fill="#00A8C6"/><rect x="804" y="480" width="14" height="48" rx="5" fill="#00A8C6"/><rect x="827" y="465" width="14" heigh