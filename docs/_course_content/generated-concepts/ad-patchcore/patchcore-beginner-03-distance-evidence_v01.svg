nd" marker-end="url(#arrow-F38B00)"/><rect x="1272" y="310" width="258" height="108" rx="18" fill="#FFF7EA" stroke="#F38B00" stroke-width="2"/><text x="1401" y="350.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#A75400" text-anchor="middle">image candidate score</text><text x="1401" y="384.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#D9485F" text-anchor="middle">不是 defect probability</text><rect x="720" y="534" width="858" height="260" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="754" y="580.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="25" font-weight="900" fill="#0B2858" text-anchor="start">B．localization candidate map：用來帶人回看</text><clipPath id="crop-map-plate-780-618-1014-250"><rect x="780" y="618" width="330" height="126" rx="16"/></clipPath><g clip-path="url(#crop-map-plate-780-618-1014-250)"><svg x="780" y="618" width="330" height="126" viewBox="1014 250 600 510" preserveAspectRatio="xMidYMid slice"><image href="patchcore-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="780" y="618" width="330" height="126" rx="16" fill="none" stroke="#00A8C6" stroke-width="2"/><rect x="812.0" y="650.0" width="48.0" height="32.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="863.0" y="650.0" width="48.0" height="32.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="914.0" y="650.0" width="48.0" height="32.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="965.0" y="650.0" width="48.0" height="32.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="1016.0" y="650.0" width="48.0" height="32.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="812.0" y="685.5" width="48.0" height="32.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="863.0" y="685.5" width="48.0" height="32.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="914.0" y="685.5" width="48.0" height="32.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="965.0" y="685.5" width="48.0" height="32.5" rx="3" fill="#F38B00" fill-opacity="0.25" stroke="#F38B00" stroke-width="2"/><rect x="1016.0" y="685.5" width="48.0" height="32.5" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><path d="M1118 680 L1234 680" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="1260" y="610" width="254" height="142" rx="18" fill="#EAFBFF" stroke="#00A8C6" stroke-width="2"/><text x="1387" y="650.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#0079A8" text-anchor="middle">回看 raw ROI</text><text x="1387" y="685.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#0B2858" text-anchor="middle">確認刮痕、對位或照明</text><text x="1387" y="718.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#F38B00" text-anchor="middle">heatmap ≠ native-pixel truth</text><rect x="40" y="849" width="1592" height="52" rx="22" fill="#FFF4CC" stroke="#F1B828" stroke-width="2"/><circle cx="78" cy="873" r="10" fill="none" stroke="#C58A00" stroke-width="2"/><path d="M72 883 L75 890 L81 890 L84 883" fill="none" stroke="#C58A00" stroke-width="2" stroke-linecap="round"/><path d="M64 873 L58 873 M92 873 L98 873 M67 862 L62 857 M89 862 L94 857" fill="none" stroke="#C58A00" stroke-width="2" stroke-linecap="round"/><text x="108" y="883.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="start">map 是粗 feature-grid evidence；score 是版本化統計。兩者都還要經過本地 evidence gate。</text></svg>