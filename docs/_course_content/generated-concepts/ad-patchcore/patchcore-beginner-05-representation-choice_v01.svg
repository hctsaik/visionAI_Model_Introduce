<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">PatchCore：exemplar memory 的選型邊界</title><desc id="desc">PatchCore 查整個 retained exemplar bank，PaDiM 則比較同一對齊位置分布；關係錯誤與不可見微小缺陷需要不同證據路徑。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D9485F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0B2858"/><rect x="40" y="34" width="148" height="38" rx="19" fill="#E8F2FF" stroke="#E8F2FF" stroke-width="0"/><text x="114.0" y="59.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">選型邊界</text><text x="40" y="125.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="39" font-weight="900" fill="#081A38" text-anchor="start">PatchCore 與 PaDiM 都會亮 candidate，但問的是不同問題</text><text x="40" y="171.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="500" fill="#536A91" text-anchor="start">先分清 normality 的表示方式；任務若是關係錯誤或看不見的尺度，不能靠調 threshold 補救。</text><rect x="1320" y="36" width="312" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1476" y="68.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="800" fill="#1769E0" text-anchor="middle">PatchCore</text><rect x="40" y="230" width="770" height="374" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><rect x="862" y="230" width="770" height="374" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="78" y="278.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="27" font-weight="900" fill="#0B2858" text-anchor="start">PatchCore：整個 retained bank 裡有近鄰嗎？</text><text x="900" y="278.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="27" font-weight="900" fill="#0B2858" text-anchor="start">PaDiM：這個對齊位置 p 還在自己的分布裡嗎？</text><clipPath id="crop-choice-patchcore-82-322-1260-352"><rect x="82" y="322" width="210" height="206" rx="18"/></clipPath><g clip-path="url(#crop-choice-patchcore-82-322-1260-352)"><svg x="82" y="322" width="210" height="206" viewBox="1260 352 172 195" preserveAspectRatio="xMidYMid slice"><image href="patchcore-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="82" y="322" width="210" height="206" rx="18" fill="none" stroke="#F38B00" stroke-width="2"/><rect x="151" y="388" width="72" height="68" rx="8" fill="none" stroke="#F38B00" stroke-width="4"/><path d="M300 425 L404 425" fill="none" stroke="#F38B00" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-F38B00)" stroke-dasharray="9 8"/><rect x="430" y="350" width="250" height="166" rx="20" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><clipPath id="crop-album-430-0-448-392-50-44"><rect x="448" y="392" width="62" height="47" rx="8"/></clipPath><g clip-path="url(#crop-album-430-0-448-392-50-44)"><svg x="448" y="392" width="62" height="47" viewBox="50 44 220 170" preserveAspectRatio="xMidYMid slice"><image href="patchcore-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="448" y="392" width="62" height="47" rx="8" fill="none" stroke="#1769E0" stroke-width="2"/><clipPath id="crop-album-430-1-524-