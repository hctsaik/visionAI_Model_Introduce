="url(#crop-album-430-5-600-449-55-335)"><svg x="600" y="449" width="62" height="47" viewBox="55 335 220 170" preserveAspectRatio="xMidYMid slice"><image href="patchcore-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="600" y="449" width="62" height="47" rx="8" fill="none" stroke="#1769E0" stroke-width="2"/><text x="555" y="548.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">最近 normal exemplar 的</text><text x="555" y="571.04" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">feature distance 大 → candidate</text><text x="425" y="591.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="start">test patch 與 exemplar 可跨物理座標。</text><clipPath id="crop-choice-padim-904-322-1014-40"><rect x="904" y="322" width="210" height="206" rx="18"/></clipPath><g clip-path="url(#crop-choice-padim-904-322-1014-40)"><svg x="904" y="322" width="210" height="206" viewBox="1014 40 600 840" preserveAspectRatio="xMidYMid slice"><image href="patchcore-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="904" y="322" width="210" height="206" rx="18" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="946.0" y="385.0" width="37.666666666666664" height="36.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="986.6666666666666" y="385.0" width="37.666666666666664" height="36.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="1027.3333333333333" y="385.0" width="37.666666666666664" height="36.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="946.0" y="424.0" width="37.666666666666664" height="36.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="986.6666666666666" y="424.0" width="37.666666666666664" height="36.0" rx="3" fill="#F38B00" fill-opacity="0.25" stroke="#F38B00" stroke-width="2"/><rect x="1027.3333333333333" y="424.0" width="37.666666666666664" height="36.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><path d="M1124 425 L1214 425" fill="none" stroke="#1769E0" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="1236" y="325" width="310" height="196" rx="18" fill="#F8FBFF" stroke="#D3E4FF" stroke-width="1"/><ellipse cx="1379" cy="433" rx="70" ry="42" fill="#E7F1FF" stroke="#1769E0" stroke-width="3" transform="rotate(-18 1379 433)"/><circle cx="1330" cy="434" r="6" fill="#5A97EF"/><circle cx="1349" cy="414" r="6" fill="#5A97EF"/><circle cx="1370" cy="436" r="6" fill="#5A97EF"/><circle cx="1386" cy="406" r="6" fill="#5A97EF"/><circle cx="1401" cy="440" r="6" fill="#5A97EF"/><circle cx="1411" cy="422" r="6" fill="#5A97EF"/><circle cx="1357" cy="459" r="6" fill="#5A97EF"/><circle cx="1390" cy="461" r="6" fill="#5A97EF"/><circle cx="1442" cy="391" r="9" fill="#F38B00"/><path d="M1442 391 L1413 410" stroke="#F38B00" stroke-width="4" stroke-dasharray="8 7"/><text x="1391" y="548.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">同一 p 的 μₚ、Σₚ</text><text x="1391" y="571.04" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">Mahalanobis distance 大 → candidate</text><text x="1208" y="591.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="start">先對齊同一物理結構；錯位會改變比較對象。</text><text x="56" y="653.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="25" font-weight="900" fill="#0B2858" text-anchor="start">不是 local texture / structure novelty 時，先換問題或先提高可觀測性</text><rect x="40" y="684" width="760" height="126" rx="20" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><clipPath id="crop-cable-68-704-0-40"><rect x="68" y="704" width="188" height="84" rx="14"/></clipPath><g clip-path="url(#crop-cable-68-704-0-40)"><svg x="68" y="704" width="188" height="84" viewBox="0 40 510 500" preserveAspectRatio="xMidYMid slice"><image href="../ad-anomalydino/anomalydino-cable-harness-base_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="68" y="704" width="188" height="84" rx="14" fill="none" stroke="#D9485F" stroke-width="2"/><text x="286" y="722.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="900" fill="#D9485F" text-anchor="start">連接、順序、數量關係錯</text><text x="286" y="755.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#536A91" text-anchor="start">每段局部外觀仍可能各自像 normal。</text><text x="286" y="786.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="start">→ 改用 presence／position／structure evidence</text><rect x="832" y="684" width="800" height="126" rx="20" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><clipPath id="crop-tiny-862-704-1014-240"><rect x="862" y="704" width="188" height="84" rx="14"/></clipPath><g clip-path="url(#crop-tiny-862-704-1014-240)"><svg x="862" y="704" width="188" height="84" viewBox="1014 240 600 520" preserveAspectRatio="xMidYMid slice"><image href="patchcore-industrial-reference-anchor_v02.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="862" y="704" width="188" height="84" rx="14" fill="none" stroke="#F38B00" stroke-width="2"/><rect x="892.0" y="726.0" width="28.0" height="16.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="923.0" y="726.0" width="28.0" height="16.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="954.0" y="726.0" width="28.0" height="16.0" rx="3" fill="#F38B00" fill-opacity="0.25" stroke="#F38B00" stroke-width="2"/><rect x="985.0" y="726.0" width="28.0" height="16.0" rx="3" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="892.0" y="745.0" width="28.0" 