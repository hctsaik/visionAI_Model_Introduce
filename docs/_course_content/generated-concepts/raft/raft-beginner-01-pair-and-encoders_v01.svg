294" width="246" height="255" rx="12" fill="none" stroke="#196fe5" stroke-width="3" stroke-dasharray="10 8"/><rect x="382" y="294" width="246" height="255" rx="12" fill="none" stroke="#196fe5" stroke-width="3" stroke-dasharray="10 8"/><text x="352" y="589" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="800" fill="#163a70">fixed ROI · locked resize / padding</text><path d="M 685 391 L 754 391" fill="none" stroke="#196fe5" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-196fe5)"/><rect x="772" y="225" width="484" height="395" rx="24" fill="#ffffff" stroke="#196fe5" stroke-width="3"/><text x="1014" y="272" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="27" font-weight="850" fill="#163a70">same feature encoder weights</text><text x="1014" y="306" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="650" fill="#4d6e9d">I₀ and I₁ use one declared feature recipe</text><g transform="translate(850 350)"><rect x="0" y="0" width="23" height="23" rx="4" fill="#dceaff" stroke="#196fe5" stroke-width="1.4"/><rect x="28" y="0" width="23" height="23" rx="4" fill="#dceaff" stroke="#196fe5" stroke-width="1.4"/><rect x="56" y="0" width="23" height="23" rx="4" fill="#dceaff" stroke="#196fe5" stroke-width="1.4"/><rect x="84" y="0" width="23" height="23" rx="4" fill="#dceaff" stroke="#196fe5" stroke-width="1.4"/><rect x="112" y="0" width="23" height="23" rx="4" fill="#dceaff" stroke="#196fe5" stroke-width="1.4"/><rect x="0" y="28" width="23" height="23" rx="4" fill="#dceaff" stroke="#196fe5" stroke-width="1.4"/><rect x="28" y="28" width="23" height="23" rx="4" fill="#dceaff" stroke="#196fe5" stroke-width="1.4"/><rect x="56" y="28" width="23" height="23" rx="4" fill="#f48112" stroke="#f48112" stroke-width="1.4"/><rect x="84" y="28" width="23" height="23" rx="4" fill="