<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">All-pairs correlation：每個 feature 位置都可查所有對應候選，不是局部 LK 小窗</title>
  <desc id="desc">RAFT 以兩個 feature grids 形成 all-pairs correlation volume，代表位置可查所有候選；圖中並說明它不是 Lucas–Kanade 的局部梯度小窗。</desc>
