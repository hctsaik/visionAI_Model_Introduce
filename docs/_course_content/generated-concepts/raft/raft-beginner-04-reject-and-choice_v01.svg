<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">稠密 flow 先過外部、宣告的 reject policy，才可形成 candidate 或 HOLD</title>
  <desc id="desc">RAFT dense flow 經 external uncertainty, consistency, occlusion, OOD, and global-motion policy 才成候選或 HOLD，並與 Frame Difference、LK、tracker 的不同輸出責任對照。</desc>
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173b70" flood-opacity=".16"/>
    </filter>
    <marker id="arrow-196fe5" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#196fe5"/></marker>
    <marker id="arrow-f48112" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f48112"/></marker>
    <marker id="arrow-e04c62" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e04c62"/></marker>
    <marker id="arrow-00a98f" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#00a98f"/></marker>
  </defs>
  <rect width="1672" height="941" fill="#f7fbff"/><rect width="1672" height="10" fill="#0d2d59"/><rect x="40" y="33" width="490" height="39" rx="19" fill="#196fe5" opacity=".12"/><text x="60" y="58" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#196fe5">dense flow → declared gate</text><text x="40" y="126" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="39" font-weight="850" fill="#082b5d">稠密 flow 先過外部、宣告的 reject policy，才可形成 candidate 或 HOLD</text><text x="40" y="168" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="600" fill="#4d6e9d">遮擋、反射／重複紋理、OOD 與 global camera motion 都可能讓稠密 vectors 看似連續卻不可信；色圖或 magnitude 不能自己變成事件。</text><rect x="1432" y="35" width="200" height="48" rx="24" fill="#ffffff" stroke="#8ab5ff" stroke-width="2"/><text x="1532" y="67" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="850" fill="#196fe5">RAFT</text><rect x="48" y="232" width="510" height="374" rx="24" fill="#fff7f8" stroke="#e04c62" stroke-width="3"/><text x="303" y="279" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="26" font-weight="850" fill="#a92b42">what can make vectors unreliable?</text><rect x="78" y="328" width="250" height="166" rx="18" fill="#edf5ff" stroke="#e04c62" stroke-width="3"/><rect x="94" y="359" width="218" height="93" rx="10" fill="#253a51"/><path d="M 98 386 H 308" stroke="#b9c9db" stroke-width="5" opacity=".9"/><path d="M 98 434 H 308" stroke="#b9c9db" stroke-width="5" opacity=".9"/><path d="M 228 362 L 276 450" stroke="#e4e9ed" stroke-width="7" opacity=".85"/><rect x="152" y="396" width="48" height="31" rx="6" fill="#196fe5" stroke="#ffffff" stroke-width="2"/><text x="96" y="479" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#163a70">occlusion</text><rect x="166" y="388" width="86" height="63" rx="8" fill="#8794a5" opacity=".95"/><rect x="302" y="328" width="250" height="166" rx="18" fill="#edf5ff" stroke="#e04c62" stroke-width="3"/><rect x="318" y="359" width="218" height="93" rx="10" fill="#253a51"/><path d="M 322 386 H 532" stroke="#b9c9db" stroke-width="5" opacity=".9"/><path d="M 322 434 H 532" stroke="#b9c9db" stroke-width="5" opacity=".9"/><path d="M 452 362 L 500 450" stroke="#e4e9ed" stroke-width="7" opacity=".85"/><rect x="433" y="396" width="48" height="31" rx="6" fill="#196fe5" stroke="#ffffff" stroke-width="2"/><text x="320" y="479" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#163a70">reflection / repeated texture</text><path d="M 402 360 L 514 454" stroke="#ffffff" stroke-width="14" opacity=".62"/><text x="303" y="565" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="750" fill="#a92b42">global camera motion → broad flow record</text><path d="M 582 420 L 648 420" fill="none" stroke="#e04c62" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-e04c62)"/><rect x="668" y="222" width="500" height="402" rx="26" fill="#fffaf2" stroke="#f48112" stroke-width="3"/><text x="918" y="273" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="27" font-weight="850" fill="#a85b09">external, versioned evidence gate</text><text x="918" y="308" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="700" fill="#a85b09">not supplied by a colour wheel</text><path d="M 742 359 H 1094" stroke="#f0a348" stroke-width="4" stroke-linecap="round"/><text x="918" y="385" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="850" fill="#a85b09">uncertainty proxy</text><text x="918" y="425" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="750" fill="#a85b09">forward–backward / consistency if configured</text><text x="918" y="465" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="850" fill="#a85b09">occlusion + OOD policy</text><text x="918" y="524" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="700" fill="#a85b09">rejected pixels / vectors + global-motion record</text><path d="M 742 563 H 1094" stroke="#f0a348" stroke-width="4" stroke-linecap="round"/><path d="M 1192 349 L 1260 349" fill="none" stroke="#00a98f" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-00a98f)"/><path d="M 1192 510 L 1260 510" fill="none" stroke="#e04c62" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-e04c62)"/><rect x="1282" y="252" width="324" height="176" rx="22" fill="#effbf7" stroke="#00a98f" stroke-width="3"/><text x="1444" y="305" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="24" font-weight="850" fill="#008e7a">valid flow only</text><text x="1444" y="344" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="750" fill="#008e7a">versioned aggregation</text><text x="1444" y="383" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="850" fill="#008e7a">candidate → REVIEW</text><rect x="1282" y="457" width="324" height="148" rx="22" fill="#fff7f8" stroke="#e04c62" stroke-width="3"/><text x="1444" y="509" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="850" fill="#a92b42">reject / OOD / camera motion</text><text x="1444" y="551" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="850" fill="#a92b42">HOLD → audit / re-capture</text><text x="58" y="692" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="26" font-weight="850" fill="#163a70">Choose the output you actually need</text><path d="M 82 744 H 1590" stroke="#b7cfef" stroke-width="5" stroke-linecap="round"/><circle cx="250" cy="744" r="13" fill="#f48112"/><text x="250" y="792" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#42638e">changed pixels → Frame Difference</text><circle cx="618" cy="744" r="13" fill="#196fe5"/><text x="618" y="792" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#42638e">few local vectors → Lucas–Kanade</text><circle cx="1011" cy="744" r="13" fill="#9b70d5"/><text x="1011" y="792" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#42638e">entity lifecycle → detector + tracker</text><circle cx="1410" cy="744" r="13" fill="#00a98f"/><text x="1410" y="792" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#42638e">validated dense correspondence → RAFT</text><rect x="40" y="855" width="1592" height="55" rx="26" fill="#fff3cf" stroke="#f0ad25" stroke-width="2"/><path d="M 76 878 q 12 -20 24 0 q -2 20 -12 20 q -10 0 -12 -20 M 88 866 v-14 M 63 878 h-13 M 113 878 h13" fill="none" stroke="#d18a00" stroke-width="3" stroke-linecap="round"/><text x="124" y="889" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="800" fill="#885c00">RAFT 的 dense field 要有目標域 truth、owner 與 VRAM/P95；它不產生 identity、速度、放行結論或自行成立的事件。</text>
</svg>
