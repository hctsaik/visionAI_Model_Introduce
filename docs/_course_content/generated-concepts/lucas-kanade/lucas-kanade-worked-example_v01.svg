<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Lucas–Kanade 的同一工作例說明圖</title>
  <desc id="desc">四個連續面板呈現固定工作例、預測、模型輸出與人類應如何安全解讀。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0B3068" flood-opacity=".12"/></filter>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker>
    <marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker>
    <style>text { dominant-baseline: alphabetic; } .fine { fill:#536A91; font-size:18px; }</style>
  </defs>
  <rect width="1672" height="941" fill="#F5F8FE"/>
  <rect x="40" y="32" width="150" height="32" rx="16" fill="#E6F0FF"/><text x="58" y="54.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="16" font-weight="800" fill="#1769E0">同一個工作例</text><text x="40" y="116" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="43" font-weight="900" fill="#071A3B">先預測，再看模型如何回答</text><text x="40" y="182" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="500" fill="#50698F">把同一個現場情境走一次：模型的輸出幫人決定下一個該回看的地方，而不是替人宣告真相。</text><text x="1630" y="57.0" text-anchor="end" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#5C7395">Lucas–Kanade</text><rect x="40" y="266" width="372" height="518" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><g data-visual-cue="frame_pair" data-renderer-art="frame_pair" data-primitive="textured_patch_displacement" data-semantic-scene="textured_patch_displacement" data-semantic-entities="patch_t|patch_t1|local_vector" data-specialist-coverage="patch_t|patch_t1|local_vector" data-semantic-relation="track a textured local patch across adjacent frames" data-must-show="I(t) 與 I(t+1) 的同一角點 patch 用小位移箭頭相連 | 固定 ROI 與時間間隔要可見 | 邊界提示：局部 patch 不是長期 identity。" data-not-claim="局部 patch 不是長期 identity。"><title>同一 texture patch 位移</title><rect x="64" y="294" width="324" height="122" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><rect x="105.6" y="325.56" width="67.2" height="42.32" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M112.32 356.4536 L127.776 345.4504 L140.54399999999998 352.64480000000003 L160.704 336.14" fill="none" stroke="#93B8E8" stroke-width="3"/><rect x="209.2" y="325.56" width="67.2" height="42.32" rx="8" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="3"/><path d="M215.92 356.4536 L231.37