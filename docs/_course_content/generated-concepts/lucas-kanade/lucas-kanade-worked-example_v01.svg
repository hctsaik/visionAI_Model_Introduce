font-size="25" font-weight="900" fill="#0B2858">固定工作例</text><text x="68" y="520" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">同一移動物件，一個 patch 落</text><text x="68" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">在清晰角點、另一個落在平坦</text><text x="68" y="576" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">表面。</text><rect x="445" y="266" width="372" height="518" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><g data-visual-cue="local_gradient" data-renderer-art="local_gradient" data-primitive="gradient_observability" data-semantic-scene="gradient_observability" data-semantic-entities="corner_patch|edge_patch|gradient_axes" data-specialist-coverage="corner_patch|edge_patch|gradient_axes" data-semantic-relation="two directions support a local solve" data-must-show="角點窗口畫出非共線 I_x、I_y 與 I_t | 平坦與單邊區只顯示不足方向 | 邊界提示：單一邊緣不能完整觀測二維位移。" data-not-claim="單一邊緣不能完整觀測二維位移。"><title>多方向 gradient 支持</title><rect x="469" y="294" width="324" height="122" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="gradient_observability" data-specialist-coverage="corner_patch|edge_patch|gradient_axes"><rect x="498.56" y="319.8" width="62.699999999999996" height="62.699999999999996" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M504.72 327.5l43.88999999999999 31.349999999999998 M513.96 368.2l35.112-36.36599999999999" stroke="#1769E0" stroke-width="3"/><rect x="621.76" y="319.8" width="62.699999999999996" height="62.699999999999996" rx="8" fill="#FFF7E8" stroke="#F38B00" stroke-width="3"/><path d="M631.0 351.7h45.144" stroke="#F38B00" stroke-width="5"/><line x1="563.24" y1="383.6" x2="597.12" y2="383.6" stroke="#1769E0" 