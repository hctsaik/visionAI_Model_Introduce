量與 outlier policy。</text><rect x="1255" y="266" width="372" height="518" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><g data-visual-cue="flow_reject" data-renderer-art="flow_reject" data-primitive="sparse_vector_reject" data-semantic-scene="sparse_vector_reject" data-semantic-entities="sparse_vector|condition_residual|reject_gate" data-specialist-coverage="sparse_vector|condition_residual|reject_gate" data-semantic-relation="reject an unsupported local vector" data-must-show="(u,v) 依 condition number、residual、forward-backward gate 篩選 | 只有有效向量可進後段聚合 | 邊界提示：flow vector 不是速度、identity 或事件結論。" data-not-claim="flow vector 不是速度、identity 或事件結論。"><title>向量仍要核對／reject</title><rect x="1279" y="294" width="324" height="122" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><rect x="1317.8" y="327.4" width="70.0" height="44.16" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M1324.8 359.6368 L1340.8999999999999 348.1552 L1354.2 355.6624 L1375.2 338.44" fill="none" stroke="#93B8E8" stroke-width="3"/><path d="M1340.2 360.52l25.2-15.64" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="1329.0" y="336.59999999999997" width="30.8" height="13.799999999999999" fill="none" stroke="#F38B00" stroke-width="3" stroke-dasharray="4 3"/><line x1="1399.0" y1="353.15999999999997" x2="1432.6" y2="353.15999999999997" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="1438.2" y="334.76" width="47.6" height="35.88" rx="8" fill="#E8FAFF" stroke="#0AA6D8" stroke-width="3"/><line x1="1449.4" y1="343.96" x2="1474.6" y2="343.96" stroke="#0AA6D8" stroke-width="3"/><line x1="1449.4" y1="354.08" x2="1474.6" y2="354.08" stroke="#F38B00" stroke-width="3" stroke-dasharray="4 3"/><line x1="1494.2" y1="353.15999999999997" x2="1525.0" y2="353.15999999999997" stroke="#F38B00" stroke-width="4" marker-end="url(#arrow-orange)"/><path d="M1539.0 334.76L1561.4 353.15999999999997L1539.0 371.55999999999995L1516.6 