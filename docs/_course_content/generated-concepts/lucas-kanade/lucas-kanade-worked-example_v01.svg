"604" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">是否可由局部 least-squares</text><text x="1283" y="632" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">支持？</text><line x1="416" y1="525" x2="433" y2="525" stroke="#1769E0" stroke-width="5" marker-end="url(#arrow-blue)"/><line x1="821" y1="525" x2="838" y2="525" stroke="#1769E0" stroke-width="5" marker-end="url(#arrow-blue)"/><line x1="1226" y1="525" x2="1243" y2="525" stroke="#1769E0" stroke-width="5" marker-end="url(#arrow-blue)"/><rect x="40" y="810" width="1592" height="100" rx="20" fill="#FFF4CC" stroke="#F1B828"/><text x="68" y="842.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="900" fill="#674500">這張圖要帶走：</text><text x="68" y="871" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="600" fill="#674500">有數值向量不表示它可靠。平坦或重複紋理使矩陣 ill-conditioned；photometric residual、forward-backward 與 outlier gate 要一起看。</text>
