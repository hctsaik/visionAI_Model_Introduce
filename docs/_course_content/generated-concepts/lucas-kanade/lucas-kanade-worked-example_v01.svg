示向量可觀測。"><title>局部 least-squares 解</title><rect x="874" y="294" width="324" height="122" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="normal_equation_solve" data-specialist-coverage="gradient_rows|ata_matrix|local_vector"><rect x="900.48" y="320.9" width="77.0" height="59.400000000000006" rx="10" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><line x1="912.8" y1="368.2" x2="965.16" y2="331.9" stroke="#1769E0" stroke-width="4"/><line x1="912.8" y1="334.1" x2="968.24" y2="362.7" stroke="#1769E0" stroke-width="4"/><line x1="918.96" y1="351.7" x2="971.3199999999999" y2="351.7" stroke="#1769E0" stroke-width="4"/><line x1="986.72" y1="351.7" x2="1020.6" y2="351.7" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="1026.76" y="334.1" width="40.04" height="33.0" rx="7" fill="#E8FAFF" stroke="#0AA6D8" stroke-width="3"/><path d="M1036.0 344.0h21.560000000000002 M1036.0 356.1h21.560000000000002" stroke="#0AA6D8" stroke-width="3"/><line x1="1072.96" y1="345.1" x2="1109.92" y2="335.2" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><circle cx="1134.56" cy="331.9" r="8.25" fill="#E8FAFF" stroke="#0AA6D8" stroke-width="3"/><line x1="1072.96" y1="360.5" x2="1109.92" y2="371.5" stroke="#F38B00" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arrow-orange)"/><rect x="1116.08" y="359.4" width="40.04" height="22.0" rx="6" fill="#FFF7E8" stroke="#F38B00" stroke-width="3"/><line x1="1122.24" y1="362.7" x2="1149.96" y2="378.1" stroke="#D84A4A" stroke-width="3"/><text data-label-line="true" x="937.44" y="400.1" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">2 dirs</text><text data-label-line="true" x="1048.32" y="400.1" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">AᵀA</text><text data-label-line="true" 