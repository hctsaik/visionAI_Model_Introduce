<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">先固定相鄰影格與 ROI，再選「真的有紋理支持」的局部角點</title>
  <desc id="desc">同一輸送帶的相鄰影格中圈出可追蹤的 L 形角點，並對比平坦藍色 patch 的不足紋理。</desc>
  <defs>
    <marker id="arrow-2b7ae8" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2b7ae8"/></marker>
    <marker id="arrow-f48112" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f48112"/></marker>
    <marker id="arrow-e04c62" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e04c62"/></marker>
    <marker id="arrow-00a98f" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#00a98f"/></marker>
  </defs>
  <rect width="1672" height="941" fill="#f7fbff"/><rect width="1672" height="10" fill="#0d2d59"/><rect x="40" y="33" width="371" height="39" rx="19" fill="#2b7ae8" opacity=".12"/><text x="60" y="58" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#2b7ae8">pair → local sample</text><text x="40" y="126" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="39" font-weight="850" fill="#082b5d">先固定相鄰影格與 ROI，再選「真的有紋理支持」的局部角點</text><text x="40" y="168" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="600" fill="#4d6e9d">Lucas–Kanade 不是每個像素都自動可靠：它先在宣告的 feature point 或 patch window 解一個小局部問題。</text><rect x="1300" y="35" width="332" height="48" rx="24" fill="#ffffff" stroke="#8ab5ff" stroke-width="2"/><text x="1466" y="67" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="850" fill="#2b7ae8">LUCAS–KANADE</text><clipPath id="pair-clip"><rect x="42" y="224" width="790" height="444" rx="22"/></clipPath><g clip-path="url(#pair-clip)"><svg x="42" y="224" width="790" height="444" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid slice"><image href="lucas-kanade-aoi-conveyor-corner-pair_v01.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/></svg></g><rect x="42" y="224" width="790" height="444" rx="22" fill="none" stroke="#2b7ae8" stroke-width="3"/><text x="105" y="265" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="850" fill="#2b7ae8">I₀ · adjacent timestamp</text><text x="487" y="265" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="850" fill="#2b7ae8">I₁ · adjacent timestamp</text><rect x="82" y="301" width="320" height="285" rx="12" fill="none" stroke="#2b7ae8" stroke-width="3" stroke-dasharray="10 8"/><rect x="465" y="301" width="320" height="285" rx="12" fill="none" stroke="#2b7ae8" stroke-width="3" stroke-dasharray="10 8"/><circle cx="234" cy="471" r="35" fill="none" stroke="#f48112" stroke-width="5"/><circle cx="615" cy="471" r="35" fill="none" stroke="#f48112" stroke-width="5"/><text x="437" y="628" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="800" fill="#163a70">same fixed ROI · declared Δt · a local corner moves a small distance</text><path d="M 856 421 L 922 421" fill="none" stroke="#2b7ae8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-2b7ae8)"/><rect x="946" y="226" width="638" height="416" rx="24" fill="#ffffff" stroke="#2b7ae8" stroke-width="3"/><text x="1265" y="274" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="28" font-weight="850" fill="#163a70">choose a declared local sample</text><text x="1265" y="310" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="650" fill="#4d6e9d">feature ID / patch window are stored evidence</text><rect x="1010" y="350" width="236" height="236" rx="18" fill="#effbf7" stroke="#00a98f" stroke-width="3"/><rect x="1032" y="372" width="192" height="192" rx="10" fill="#244058"/><path d="M 1065 408 V 521 H 1184" fill="none" stroke="#ffffff" stroke-width="18" stroke-linejoin="round"/><circle cx="1068" cy="522" r="10" fill="#0a274a" stroke="#ffffff" stroke-width="4"/><text x="1128.0" y="566" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#008e7a">corner: x + y texture</text><text x="1128.0" y="334" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="850" fill="#163a70">trackable corner</text><rect x="1308" y="350" width="236" height="236" rx="18" fill="#fff7f8" stroke="#e04c62" stroke-width="3"/><rect x="1330" y="372" width="192" height="192" rx="10" fill="#244058"/><rect x="1354" y="397" width="144" height="142" rx="8" fill="#2876d3"/><text x="1426.0" y="566" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#a92b42">flat blue patch</text><text x="1426.0" y="334" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="850" fill="#163a70">flat patch</text><text x="1128" y="626" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="750" fill="#008e7a">two directions → supported</text><text x="1426" y="626" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="750" fill="#a92b42">flat / weak direction → reject</text><rect x="264" y="713" width="1144" height="84" rx="20" fill="#effbf7" stroke="#00a98f" stroke-width="3"/><text x="836" y="748" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="800" fill="#008e7a">Sparse feature points and dense patch grids are different sampling choices—not semantic tracking.</text><text x="836" y="777" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="700" fill="#258b7a">A corner is a local measurement site; it does not create a long-term object ID.</text><rect x="40" y="855" width="1592" height="55" rx="26" fill="#fff3cf" stroke="#f0ad25" stroke-width="2"/><path d="M 76 878 q 12 -20 24 0 q -2 20 -12 20 q -10 0 -12 -20 M 88 866 v-14 M 63 878 h-13 M 113 878 h13" fill="none" stroke="#d18a00" stroke-width="3" stroke-linecap="round"/><text x="124" y="889" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="800" fill="#885c00">Lucas–Kanade 從可追溯的局部角點／patch 開始；尚未輸出 dense field、track、identity、速度或放行結論。</text>
</svg>
