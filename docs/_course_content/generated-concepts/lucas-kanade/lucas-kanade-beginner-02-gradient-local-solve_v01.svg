<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">在一個小窗口內，brightness constancy 的 Iₓ、Iᵧ、Iₜ 只解一個 local (u,v)</title>
  <desc id="desc">一個 L 形角點的 local window 產生 Ix、Iy、It，進入 normal equation 的 least squares，僅輸出一個 local vector。</desc>
  <defs>
    <marker id="arrow-2b7ae8" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2b7ae8"/></marker>
    <marker id="arrow-f48112" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f48112"/></marker>
    <marker id="arrow-e04c62" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e04c62"/></marker>
    <marker id="arrow-00a98f" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#00a98f"/></marker>
  </defs>
  <rect width="1672" height="941" fill="#f7fbff"/><rect width="1672" height="10" fill="#0d2d59"/><rect x="40" y="33" width="575" height="39" rx="19" fill="#2b7ae8" opacity=".12"/><text x="60" y="58" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#2b7ae8">local gradients → least squares</text><text x="40" y="126" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="39" font-weight="850" fill="#082b5d">在一個小窗口內，brightness constancy 的 Iₓ、Iᵧ、Iₜ 只解一個 local (u,v)</text><text x="40" y="168" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="600" fill="#4d6e9d">小位移與局部一致 motion 是解法前提；影像與時間梯度形成觀測，least-squares 只回答這一個 patch 的位移。</text><rect x="1300" y="35" width="332" height="48" rx="24" fill="#ffffff" stroke="#8ab5ff" stroke-width="2"/><text x="1466" y="67" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="850" fill="#2b7ae8">LUCAS–KANADE</text><rect x="54" y="264" width="310" height="310" rx="18" fill="#effbf7" stroke="#00a98f" stroke-width="3"/><rect x="76" y="286" width="266" height="266" rx="10" fill="#244058"/><path d="M 109 322 V 509 H 302" fill="none" stroke="#ffffff" stroke-width="18" stroke-linejoin="round"/><circle cx="112" cy="510" r="10" fill="#0a274a" stroke="#ffffff" stroke-width="4"/><text x="209.0" y="554" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#008e7a">corner: x + y texture</text><text x="209.0" y="248" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="850" fill="#163a70">declared local window</text><text x="209" y="610" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="750" fill="#42638e">same corner in I₀ and I₁</text><path d="M 390 424 L 466 424" fill="none" stroke="#2b7ae8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-2b7ae8)"/><rect x="488" y="242" width="415" height="394" rx="24" fill="#eef5ff" stroke="#2b7ae8" stroke-width="3"/><text x="696" y="288" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="27" font-weight="850" fill="#163a70">brightness constancy</text><text x="696" y="323" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="700" fill="#42638e">I(x+u, y+v, t+1) ≈ I(x, y, t)</text><path d="M 560 395 H 828" stroke="#b3cdf2" stroke-width="3" stroke-linecap="round"/><text x="570" y="375" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="25" font-weight="850" fill="#2b7ae8">Iₓ</text><path d="M 618 383 l 55 -32 l 44 26 l 58 -34" fill="none" stroke="#2b7ae8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="570" y="456" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="25" font-weight="850" fill="#00a98f">Iᵧ</text><path d="M 618 463 l 42 29 l 45 -45 l 72 33" fill="none" stroke="#00a98f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="570" y="537" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="25" font-weight="850" fill="#f48112">Iₜ</text><path d="M 618 544 l 50 -15 l 45 34 l 59 -35" fill="none" stroke="#f48112" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="696" y="598" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="750" fill="#42638e">spatial + temporal gradient evidence</text><path d="M 930 424 L 1002 424" fill="none" stroke="#f48112" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-f48112)"/><rect x="1024" y="235" width="376" height="408" rx="24" fill="#fffaf2" stroke="#f48112" stroke-width="3"/><text x="1212" y="282" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="26" font-weight="850" fill="#a85b09">local least-squares solve</text><text x="1212" y="331" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="700" fill="#a85b09">normal equation in this window</text><text x="1212" y="397" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="750" fill="#a85b09">[ ΣIₓ²    ΣIₓIᵧ ] [ u ]</text><text x="1212" y="438" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="750" fill="#a85b09">[ ΣIₓIᵧ  ΣIᵧ²  ] [ v ]</text><text x="1212" y="486" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="750" fill="#a85b09">= − [ ΣIₓIₜ ;  ΣIᵧIₜ ]</text><text x="1212" y="557" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="700" fill="#a85b09">window / weighting / solver</text><text x="1212" y="592" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="700" fill="#a85b09">are declared operating choices</text><path d="M 1426 424 L 1488 424" fill="none" stroke="#00a98f" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-00a98f)"/><rect x="1506" y="288" width="126" height="246" rx="22" fill="#effbf7" stroke="#00a98f" stroke-width="3"/><rect x="1528" y="330" width="82" height="168" rx="12" fill="#243a54"/><path d="M 1561 364 V 460 H 1567" fill="none" stroke="#ffffff" stroke-width="16" stroke-linejoin="round"/><path d="M 1545.06 435.6 l 54 -22 m -13 -7 l 13 7 l -8 12" fill="none" stroke="#00a98f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="1569.0" y="516" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#008e7a">local (u,v)</text><text x="1569" y="570" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="850" fill="#008e7a">one (u,v)</text><rect x="232" y="714" width="1208" height="86" rx="20" fill="#f2f7fd" stroke="#9db8df" stroke-width="3"/><text x="836" y="748" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="800" fill="#163a70">A numerical vector is only a local candidate: condition number, photometric residual and declared outlier checks still decide whether it is usable.</text><text x="836" y="778" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="700" fill="#42638e">It is not a defect score, dense RAFT field, object class, identity or calibrated physical velocity.</text><rect x="40" y="855" width="1592" height="55" rx="26" fill="#fff3cf" stroke="#f0ad25" stroke-width="2"/><path d="M 76 878 q 12 -20 24 0 q -2 20 -12 20 q -10 0 -12 -20 M 88 866 v-14 M 63 878 h-13 M 113 878 h13" fill="none" stroke="#d18a00" stroke-width="3" stroke-linecap="round"/><text x="124" y="889" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="800" fill="#885c00">LK 解的是一個小窗口的 (u,v)；brightness constancy、小位移與局部一致性不成立時，應拒絕而非硬解。</text>
</svg>
