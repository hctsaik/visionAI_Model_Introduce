<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">多方向 gradient 支持</title><desc id="desc">有紋理角點的局部窗口具有兩個方向的影像梯度和時間梯度</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="local_gradient" data-renderer-art="local_gradient" data-primitive="gradient_observability" data-semantic-scene="gradient_observability" data-semantic-entities="corner_patch|edge_patch|gradient_axes" data-specialist-coverage="corner_patch|edge_patch|gradient_axes" data-semantic-relation="two directions support a local solve" data-must-show="角點窗口畫出非共線 I_x、I_y 與 I_t | 平坦與單邊區只顯示不足方向 | 邊界提示：單一邊緣不能完整觀測二維位移。" data-not-claim="單一邊緣不能完整觀測二維位移。"><title>多方向 gradient 支持</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="gradient_observability" data-specialist-coverage="corner_patch|edge_patch|gradient_axes"><rect x="83.08000000000001" y="74.68" width="128.82" height="128.82" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M95.96000000000001 90.5l90.17399999999999 64.41 M115.28 174.12l72.1392-74.7156" stroke="#1769E0" stroke-width="3"/><rect x="340.68" y="74.68" width="128.82" height="128.82" rx="8" fill="#FFF7E8" stroke="#F38B00" stroke-width="3"/><path d="M360.0 140.22h92.75039999999998" stroke="#F38B00" stroke-width="5"/><line x1="218.32000000000002" y1="205.76" x2="289.15999999999997" y2="205.76" 