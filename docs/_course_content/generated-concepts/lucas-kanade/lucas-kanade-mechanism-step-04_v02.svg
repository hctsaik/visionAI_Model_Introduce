<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">向量仍要核對／reject</title><desc id="desc">局部位移向量先經條件數、殘差與一致性 gate，失敗向量被拒絕</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="flow_reject" data-renderer-art="flow_reject" data-primitive="sparse_vector_reject" data-semantic-scene="sparse_vector_reject" data-semantic-entities="sparse_vector|condition_residual|reject_gate" data-specialist-coverage="sparse_vector|condition_residual|reject_gate" data-semantic-relation="reject an unsupported local vector" data-must-show="(u,v) 依 condition number、residual、forward-backward gate 篩選 | 只有有效向量可進後段聚合 | 邊界提示：flow vector 不是速度、identity 或事件結論。" data-not-claim="flow vector 不是速度、identity 或事件結論。"><title>向量仍要核對／reject</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><rect x="88.96000000000001" y="84.6" width="154.0" height="99.84" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M104.36000000000001 157.4832 L139.78 131.5248 L169.04000000000002 148.4976 L215.24 109.56" fill="none" stroke="#93B8E8" stroke-width="3"/><path d="M138.24 159.48l55.44-35.36" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="113.60000000000001" y="105.39999999999999" width="67.76" height="31.2" fill="none" stroke="#F38B00" stroke-width="3" stroke-dasharray="4 3"/><line x1="267.6" y1="142.84" x2="34