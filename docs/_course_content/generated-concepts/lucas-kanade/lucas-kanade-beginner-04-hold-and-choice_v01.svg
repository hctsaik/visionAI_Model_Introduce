<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">局部向量必先通過可解性與相機治理：valid local evidence → candidate，否則 HOLD</title>
  <desc id="desc">LK 的 illumination/occlusion/flat/large-motion 邊界進入 conditioning, residual, forward-backward, outlier and global-motion gate，分流成 candidate review 或 HOLD，並與鄰近模型的輸出責任區分。</desc>
  <defs>
    <marker id="arrow-2b7ae8" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2b7ae8"/></marker>
    <marker id="arrow-f48112" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f48112"/></marker>
    <marker id="arrow-e04c62" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e04c62"/></marker>
    <marker id="arrow-00a98f" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#00a98f"/></marker>
  </defs>
  <rect width="1672" height="941" fill="#f7fbff"/><rect width="1672" height="10" fill="#0d2d59"/><rect x="40" y="33" width="490" height="39" rx="19" fill="#2b7ae8" opacity=".12"/><text x="60" y="58" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#2b7ae8">local flow → declared gate</text><text x="40" y="126" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="39" font-weight="850" fill="#082b5d">局部向量必先通過可解性與相機治理：valid local evidence → candidate，否則 HOLD</text><text x="40" y="168" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="600" fill="#4d6e9d">illumination、occlusion、flat patch、large motion 或 global camera motion 都可能讓 LK 的小窗口不再可解讀；不要把箭頭數量當事件真相。</text><rect x="1300" y="35" width="332" height="48" rx="24" fill="#ffffff" stroke="#8ab5ff" stroke-width="2"/><text x="1466" y="67" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="850" fill="#2b7ae8">LUCAS–KANADE</text><rect x="46" y="226" width="520" height="392" rx="24" fill="#fff7f8" stroke="#e04c62" stroke-width="3"/><text x="306" y="274" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="26" font-weight="850" fill="#a92b42">one local window, several ways to fail</text><rect x="84" y="316" width="440" height="216" rx="16" fill="#263b54" stroke="#e04c62" stroke-width="3"/><path d="M 128 365 V 478 H 258" fill="none" stroke="#ffffff" stroke-width="17" stroke-linejoin="round"/><rect x="110" y="332" width="390" height="74" rx="10" fill="#fff3a5" opacity=".42"/><rect x="242" y="396" width="102" height="91" rx="8" fill="#8c99a8" opacity=".92"/><rect x="383" y="428" width="80" height="45" rx="8" fill="#2a78d5"/><text x="304" y="555" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#a92b42">illumination / reflection · occlusion · flat patch</text><text x="306" y="590" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="750" fill="#a92b42">large shift / frame gap / camera motion → HOLD</text><path d="M 590 422 L 654 422" fill="none" stroke="#e04c62" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-e04c62)"/><rect x="676" y="220" width="492" height="405" rx="26" fill="#fffaf2" stroke="#f48112" stroke-width="3"/><text x="922" y="270" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="27" font-weight="850" fill="#a85b09">declared local-evidence gate</text><text x="922" y="305" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="700" fill="#a85b09">a vector magnitude alone is not enough</text><path d="M 746 349 H 1098" stroke="#f0a348" stroke-width="4" stroke-linecap="round"/><text x="922" y="385" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="800" fill="#a85b09"><tspan x="922" dy="0">condition number / texture support</tspan><tspan x="922" dy="38">photometric residual</tspan><tspan x="922" dy="38">forward–backward / outlier policy</tspan><tspan x="922" dy="38">registration or global-motion record</tspan></text><path d="M 746 565 H 1098" stroke="#f0a348" stroke-width="4" stroke-linecap="round"/><path d="M 1193 342 L 1252 342" fill="none" stroke="#00a98f" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-00a98f)"/><path d="M 1193 512 L 1252 512" fill="none" stroke="#e04c62" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-e04c62)"/><rect x="1274" y="246" width="330" height="176" rx="22" fill="#effbf7" stroke="#00a98f" stroke-width="3"/><text x="1439" y="300" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="24" font-weight="850" fill="#008e7a">valid local vectors</text><text x="1439" y="340" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="750" fill="#008e7a">versioned aggregation</text><text x="1439" y="381" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="850" fill="#008e7a">candidate → REVIEW</text><rect x="1274" y="459" width="330" height="146" rx="22" fill="#fff7f8" stroke="#e04c62" stroke-width="3"/><text x="1439" y="510" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="850" fill="#a92b42">reject evidence / camera motion</text><text x="1439" y="551" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="850" fill="#a92b42">HOLD → audit / re-capture</text><text x="58" y="691" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="26" font-weight="850" fill="#163a70">Choose the output you actually need</text><path d="M 82 744 H 1590" stroke="#b7cfef" stroke-width="5" stroke-linecap="round"/><circle cx="238" cy="744" r="13" fill="#f48112"/><text x="238" y="792" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#42638e">changed pixels → Frame Difference</text><circle cx="623" cy="744" r="13" fill="#2b7ae8"/><text x="623" y="792" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#42638e">validated local (u,v) → Lucas–Kanade</text><circle cx="1014" cy="744" r="13" fill="#00a98f"/><text x="1014" y="792" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#42638e">dense correspondence → RAFT</text><circle cx="1409" cy="744" r="13" fill="#9b70d5"/><text x="1409" y="792" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#42638e">entity lifecycle → ByteTrack</text><rect x="40" y="855" width="1592" height="55" rx="26" fill="#fff3cf" stroke="#f0ad25" stroke-width="2"/><path d="M 76 878 q 12 -20 24 0 q -2 20 -12 20 q -10 0 -12 -20 M 88 866 v-14 M 63 878 h-13 M 113 878 h13" fill="none" stroke="#d18a00" stroke-width="3" stroke-linecap="round"/><text x="124" y="889" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="800" fill="#885c00">LK 的 (u,v) 只是在局部有證據時可用的 candidate；它不產生 dense RAFT flow、track identity、速度或放行結論。</text>
</svg>
