<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">AnomalyDiffusion requires independent real-holdout evidence before an augmentation experiment can advance</title><desc id="desc">A fixed downstream experiment is evaluated only on independent real holdout evidence. Route or data changes trigger HOLD and full requalification.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-129B86" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#129B86"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D94B62"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092754"/><text x="42" y="99.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#092754" text-anchor="start">獨立 REAL HOLDOUT 才能回答：augmentation 是否有益</text><text x="42" y="147" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="600" fill="#52688D" text-anchor="start">只比較在固定 real split、synthetic volume、downstream recipe 與成本下的結果；synthetic authenticity 或 mask alignment 不能替代 stratified real-holdout evidence。</text><rect x="1096" y="34" width="536" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1364" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">ANOMALYDIFFUSION · SYNTHETIC AUGMENTATION</text><text x="50" y="211.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#12346C" text-anchor="start">controlled downstream experiment</text><rect x="50" y="242" width="406" height="420" rx="28" fill="#FFFFFF" stroke="#1769E0" stroke-width="3"/><text x="253" y="284.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#1769E0" text-anchor="middle">fixed downstream experiment</text><rect x="82" y="326" width="342" height="78" rx="17" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><rect x="92" y="337" width="322" height="8" rx="4" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="253.0" y="371.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#12346C" text-anchor="middle">real train split</text><text x="253.0" y="394.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">normal/anomaly taxonomy frozen</text><rect x="82" y="425" width="342" height="78" rx="17" fill="#FFFFFF" stroke="#F28B00" stroke-width="2"/><rect x="92" y="436" width="322" height="8" rx="4" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="253.0" y="470.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#12346C" text-anchor="middle">synthetic candidate</text><text x="253.0" y="493.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#F28B00" text-anchor="middle">image/mask/provenance versioned</text><rect x="82" y="524" width="342" height="78" rx="17" fill="#FFFFFF" stroke="#7657C8" stroke-width="2"/><rect x="92" y="535" width="322" height="8" rx="4" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><text x="253.0" y="569.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#12346C" text-anchor="middle">downstream model</text><text x="253.0" y="592.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#7657C8" text-anchor="middle">recipe + calibration frozen</text><text x="253" y="628.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">full GPU / P95 / cost included</text><path d="M480 452 L539 452" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="557" y="242" width="370" height="420" rx="28" fill="#F4F0FF" stroke="#7657C8" stroke-width="4"/><text x="742" y="286.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#7657C8" text-anchor="middle">downstream training</text><text x="742" y="325.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">controlled augmentation only</text><rect x="609" y="372" width="266" height="111" rx="20" fill="#FFFFFF" stroke="#F28B00" stroke-width="2"/><text x="742" y="411.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#F28B00" text-anchor="middle">SYNTHETIC data may enter</text><text x="742" y="442.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="middle">as versioned candidate data</text><text x="742" y="534.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#D94B62" text-anchor="middle">training output is not</text><text x="742" y="565.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#D94B62" text-anchor="middle">a production decision</text><path d="M951 452 L1013 452" fill="none" stroke="#7657C8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="1033" y="222" width="583" height="440" rx="30" fill="#EFFAF4" stroke="#149A62" stroke-width="4"/><text x="1324" y="266.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#149A62" text-anchor="middle">independent REAL HOLDOUT</text><g data-entity="anomalydiffusion_physical_aoi" data-contract="same physical inspection context"><clipPath id="crop-holdout-physical-1069-306-0-0"><rect x="1069" y="306" width="198" height="190" rx="15"/></clipPath><g clip-path="url(#crop-holdout-physical-1069-306-0-0)"><svg x="1069" y="306" width="198" height="190" viewBox="0 0 1180 941" preserveAspectRatio="xMidYMid slice"><image href="../../../roadmap-model-selection/diffusion-restoration/anomalydiffusion/images/source/ANOMALYDIFFUSION-01-engineer-anomaly-mask-review_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="1069" y="306" width="198" height="190" rx="15" fill="none" stroke="#149A62" stroke-width="3"/></g><rect x="1088" y="326" width="162" height="36" rx="17" fill="#149A62" stroke="#149A62" stroke-width="0"/><text x="1169.0" y="353.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">real image only</text><text x="1412" y="332.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#12346C" text-anchor="middle">stratified real evidence</text><text x="1412" y="365.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#149A62" text-anchor="middle">taxonomy / recipe</text><text x="1412" y="414.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">label integrity</text><text x="1412" y="446.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="middle">mode coverage + failure gallery</text><text x="1324" y="552.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#149A62" text-anchor="middle">domain-owner review · no-go rule · full P95/cost</text><text x="1324" y="589.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">synthetic images, masks, and reference families are blocked</text><rect x="50" y="710" width="1566" height="104" rx="23" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="833" y="748.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#D94B62" text-anchor="middle">HOLD / revise if real benefit, label integrity, coverage, provenance, owner acceptance, or full cost is missing or worsens.</text><text x="833" y="780.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="middle">Change reference/mask/taxonomy/split/checkpoint/embedding/attention/sampler/volume → retain traces, stop the claim, and requalify the full experiment.</text><text x="833" y="806.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D94B62" text-anchor="middle">A synthetic candidate never becomes an independent holdout label or a production action authority.</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">Select AnomalyDiffusion only with matched real-holdout benefit and owner review — visual authenticity or mask alignment alone never advances action.</text></svg>