<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">AnomalyDiffusion uses learnable anomaly appearance embeddings and mask-encoded spatial embeddings with adaptive attention re-weighting</title><desc id="desc">The model keeps anomaly appearance and planned location separate, then uses adaptive attention re-weighting and conditional denoising to produce a synthetic image-mask-provenance bundle.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-129B86" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#129B86"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D94B62"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092754"/><text x="42" y="99.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#092754" text-anchor="start">模型專屬：appearance embedding 與 spatial embedding 分工</text><text x="42" y="147" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="600" fill="#52688D" text-anchor="start">AnomalyDiffusion 不把 mask 當 anomaly score：few-shot references 學 appearance；planned mask 編碼 location；adaptive attention re-weighting 對齊 synthetic image 與 mask。</text><rect x="1096" y="34" width="536" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1364" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">ANOMALYDIFFUSION · SYNTHETIC AUGMENTATION</text><text x="50" y="211.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#12346C" text-anchor="start">two conditions enter one named generation route</text><rect x="50" y="242" width="390" height="188" rx="26" fill="#FFFFFF" stroke="#00A8C6" stroke-width="3"/><g data-entity="anomalydiffusion_physical_aoi" data-contract="same physical inspection context"><clipPath id="crop-embedding-reference-77-289-864-135"><rect x="77" y="289" width="128" height="105" rx="13"/></clipPath><g clip-path="url(#crop-embedding-reference-77-289-864-135)"><svg x="77" y="289" width="128" height="105" viewBox="864 135 652 450" preserveAspectRatio="xMidYMid slice"><image href="../../../roadmap-model-selection/diffusion-restoration/anomalydiffusion/images/source/ANOMALYDIFFUSION-01-engineer-anomaly-mask-review_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="77" y="289" width="128" height="105" rx="13" fill="none" stroke="#00A8C6" stroke-width="3"/></g><g data-entity="planned_anomaly_mask" data-contract="location policy; not physical label"><path d="M106.3 328.2 C123.7 311.8, 161.4 317.0, 174.7 332.8 C185.9 350.0, 158.3 370.2, 131.8 363.5 C103.3 360.5, 97.1 341.8, 106.3 328.2 Z" fill="#00A8C6" fill-opacity=".16" stroke="#00A8C6" stroke-width="5" stroke-dasharray="10 7"/></g><text x="330" y="291.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#00A8C6" text-anchor="middle">few anomaly references</text><text x="330" y="323.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#12346C" text-anchor="middle">learnable anomaly</text><text x="330" y="351.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#00A8C6" text-anchor="middle">appearance embedding</text><text x="330" y="392.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="middle">anomaly appearance</text><rect x="50" y="484" width="390" height="188" rx="26" fill="#FFFFFF" stroke="#F28B00" stroke-width="3"/><rect x="77" y="529" width="128" height="105" rx="14" fill="#FFF7EB" stroke="#F28B00" stroke-width="2"/><g data-entity="planned_anomaly_mask" data-contract="location policy; not physical label"><path d="M106.3 568.2 C123.7 551.8, 161.4 557.0, 174.7 572.8 C185.9 590.0, 158.3 610.2, 131.8 603.5 C103.3 600.5, 97.1 581.8, 106.3 568.2 Z" fill="#F28B00" fill-opacity=".16" stroke="#F28B00" stroke-width="5" stroke-dasharray="10 7"/></g><text x="330" y="529.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#F28B00" text-anchor="middle">planned mask</text><text x="330" y="557.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">+ normal target</text><text x="330" y="590.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#12346C" text-anchor="middle">mask-encoded spatial</text><text x="330" y="616.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#F28B00" text-anchor="middle">embedding</text><text x="330" y="654.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="middle">where it is guided</text><path d="M462 336 L518 336" fill="none" stroke="#00A8C6" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><path d="M462 578 L518 578" fill="none" stroke="#F28B00" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><rect x="535" y="226" width="560" height="477" rx="30" fill="#F4F0FF" stroke="#7657C8" stroke-width="4"/><text x="815" y="270.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#7657C8" text-anchor="middle">adaptive attention re-weighting</text><text x="815" y="302.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">aligns synthetic expression with the planned mask</text><rect x="572" y="340" width="220" height="105" rx="18" fill="#FFFFFF" stroke="#00A8C6" stroke-width="2"/><text x="682" y="379.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#00A8C6" text-anchor="middle">appearance embedding</text><text x="682" y="410.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="middle">few-shot anomaly look</text><rect x="838" y="340" width="220" height="105" rx="18" fill="#FFFFFF" stroke="#F28B00" stroke-width="2"/><text x="948" y="379.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#F28B00" text-anchor="middle">spatial embedding</text><text x="948" y="410.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="middle">mask location policy</text><path d="M 682 462 C 711 500 764 510 794 530" fill="none" stroke="#7657C8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><path d="M 948 462 C 920 500 867 510 836 530" fill="none" stroke="#7657C8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="634" y="540" width="362" height="106" rx="22" fill="#FFFFFF" stroke="#7657C8" stroke-width="3"/><text x="815" y="580.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#7657C8" text-anchor="middle">conditional denoising</text><text x="815" y="614.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="middle">scheduler · steps · guidance · seed</text><text x="815" y="676.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">alignment is not physical validation</text><path d="M1118 465 L1170 465" fill="none" stroke="#7657C8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="1188" y="242" width="428" height="430" rx="28" fill="#FFF7EB" stroke="#F28B00" stroke-width="3"/><text x="1402" y="284.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#F28B00" text-anchor="middle">synthetic image/mask bundle</text><g data-entity="anomalydiffusion_physical_aoi" data-contract="same physical inspection context"><clipPath id="crop-embedding-output-1224-321-855-145"><rect x="1224" y="321" width="180" height="174" rx="15"/></clipPath><g clip-path="url(#crop-embedding-output-1224-321-855-145)"><svg x="1224" y="321" width="180" height="174" viewBox="855 145 710 540" preserveAspectRatio="xMidYMid slice"><image href="../../../roadmap-model-selection/diffusion-restoration/anomalydiffusion/images/source/ANOMALYDIFFUSION-01-engineer-anomaly-mask-review_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="1224" y="321" width="180" height="174" rx="15" fill="none" stroke="#F28B00" stroke-width="3"/></g><g data-entity="planned_anomaly_mask" data-contract="location policy; not physical label"><path d="M1261.6 379.8 C1287.8 349.4, 1344.8 359.1, 1364.8 388.1 C1381.8 419.8, 1340.2 457.1, 1300.1 444.6 C1257.0 439.1, 1247.8 404.6, 1261.6 379.8 Z" fill="#F28B00" fill-opacity=".16" stroke="#F28B00" stroke-width="5" stroke-dasharray="10 7"/><rect x="1245" y="346" width="138" height="36" rx="17" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="1314.0" y="373.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">mask</text></g><g data-entity="synthetic_anomaly_expression"><path d="M1266.4 429.3 C1287.4 379.9, 1323.8 439.8, 1363.0 378.9" fill="none" stroke="#F28B00" stroke-width="12" stroke-linecap="round"/><path d="M1269.2 425.5 C1293.0 386.6, 1325.2 435.0, 1357.4 384.6" fill="none" stroke="#F5B835" stroke-width="4" stroke-linecap="round"/></g><text x="1490" y="360.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#D94B62" text-anchor="middle">SYNTHETIC</text><text x="1490" y="394.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">image + mask</text><text x="1490" y="426.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">+ provenance</text><rect x="1224" y="537" width="356" height="75" rx="18" fill="#FFFFFF" stroke="#F28B00" stroke-width="2"/><text x="1402" y="568.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">candidate for downstream training</text><text x="1402" y="596.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">not detector / score / label</text><rect x="50" y="749" width="1566" height="65" rx="21" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="833" y="780.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">appearance embedding answers what to express; spatial embedding answers where to guide it. Their alignment does not certify real defect geometry or severity.</text><text x="833" y="806.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D94B62" text-anchor="middle">Preserve checkpoint, embedding/attention revisions, scheduler, seed, mask policy, normal target, and generated provenance as one replayable bundle.</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">Adaptive attention re-weighting improves synthetic image-mask alignment; it does not turn a planned mask into a production truth claim.</text></svg>