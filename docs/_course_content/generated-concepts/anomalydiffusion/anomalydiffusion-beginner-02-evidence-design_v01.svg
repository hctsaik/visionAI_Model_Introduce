y="577.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">not physical defect geometry</text><path d="M222 647 L222 678" fill="none" stroke="#00A8C6" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><path d="M592 647 L592 678" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><path d="M962 647 L962 678" fill="none" stroke="#F28B00" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><rect x="50" y="689" width="1084" height="125" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="3"/><text x="592" y="729.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#12346C" text-anchor="middle">freeze the evidence registry</text><text x="592" y="766.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">reference/normal/mask hashes · taxonomy · placement policy · real train/REAL HOLDOUT split · license</text><text x="592" y="796.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">unknown source, mask policy, split, or license → HOLD</text><rect x="1170" y="244" width="446" height="570" rx="27" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="3"/><text x="1393" y="286.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#12346C" text-anchor="middle">two branches must stay separate</text><rect x="1200" y="328" width="386" height="170" rx="22" fill="#FFF7EB" stroke="#F28B00" stroke-width="3"/><text x="1393" y="370.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#F28B00" text-anchor="middle">synthetic-only branch</text><text x="1393" y="405.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">image + mask + provenance</text><rect x="1304" y="433" width="178" height="37" rx="17" fill="#D94B62" stroke="#D94B62" stroke-width="0"/><text x="1393.0" y="460.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">SYNTHETIC</text><path d="M1393 518 L1393 551" fill="none" stroke="#D94B62" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-D94B62)" stroke-dasharray="8 7"/><text x="1393" y="544.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">blocked</text><rect x="1200" y="570" width="386" height="202" rx="22" fill="#EFFAF4" stroke="#149A62" stroke-width="3"/><text x="1393" y="612.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#149A62" text-anchor="middle">independent REAL HOLDOUT</text><text x="1393" y="647.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">real image + qualified label only</text><text x="1393" y="684.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">synthetic is blocked</text><text x="1393" y="720.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#149A62" text-anchor="middle">downstream evidence lives here</text><path d="M1148 751 L1180 751" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">Normal condition, anomaly appearance, and planned location are explicit inputs; none may leak into the independent real holdout.</text></svg>