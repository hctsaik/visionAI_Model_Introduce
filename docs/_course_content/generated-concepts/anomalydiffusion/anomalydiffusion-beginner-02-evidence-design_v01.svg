<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">AnomalyDiffusion keeps anomaly appearance, normal condition, and planned location policy separate before generation</title><desc id="desc">Few anomaly references supply appearance evidence, normal targets supply normal-condition context, and planned masks supply location policy. A separate real holdout blocks synthetic leakage.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-129B86" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#129B86"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D94B62"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092754"/><text x="42" y="99.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#092754" text-anchor="start">先鎖三種 evidence：appearance、normal、location</text><text x="42" y="147" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="600" fill="#52688D" text-anchor="start">三種輸入角色不可互換：reference 提供 anomaly appearance 範例；normal target 提供背景條件；planned mask 只定義欲測試的 location policy。</text><rect x="1096" y="34" width="536" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1364" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">ANOMALYDIFFUSION · SYNTHETIC AUGMENTATION</text><text x="50" y="211.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#12346C" text-anchor="start">evidence design before generation</text><rect x="50" y="244" width="344" height="382" rx="26" fill="#FFFFFF" stroke="#00A8C6" stroke-width="3"/><text x="222" y="286.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#00A8C6" text-anchor="middle">few anomaly references</text><text x="222" y="314.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">appearance evidence</text><g data-entity="anomalydiffusion_physical_aoi" data-contract="same physical inspection context"><clipPath id="crop-evidence-reference-82-342-874-151"><rect x="82" y="342" width="280" height="150" rx="16"/></clipPath><g clip-path="url(#crop-evidence-reference-82-342-874-151)"><svg x="82" y="342" width="280" height="150" viewBox="874 151 648 400" preserveAspectRatio="xMidYMid slice"><image href="../../../roadmap-model-selection/diffusion-restoration/anomalydiffusion/images/source/ANOMALYDIFFUSION-01-engineer-anomaly-mask-review_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="82" y="342" width="280" height="150" rx="16" fill="none" stroke="#00A8C6" stroke-width="3"/></g><g data-entity="planned_anomaly_mask" data-contract="location policy; not physical label"><path d="M135.2 394.6 C164.1 372.2, 227.0 379.3, 249.1 400.7 C267.8 424.2, 221.9 451.7, 177.7 442.6 C130.1 438.5, 119.9 413.0, 135.2 394.6 Z" fill="#00A8C6" fill-opacity=".16" stroke="#00A8C6" stroke-width="5" stroke-dasharray="10 7"/><rect x="116" y="372" width="154" height="36" rx="17" fill="#00A8C6" stroke="#00A8C6" stroke-width="0"/><text x="193.0" y="399.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">reviewed mask</text></g><text x="222" y="535.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">few image + mask sources</text><text x="222" y="577.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">not normal-condition truth</text><rect x="420" y="244" width="344" height="382" rx="26" fill="#FFFFFF" stroke="#1769E0" stroke-width="3"/><text x="592" y="286.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#1769E0" text-anchor="middle">normal target AOI</text><text x="592" y="314.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">normal-condition evidence</text><g data-entity="anomalydiffusion_physical_aoi" data-contract="same physical inspection context"><clipPath id="crop-evidence-normal-452-342-900-95"><rect x="452" y="342" width="280" height="150" rx="16"/></clipPath><g clip-path="url(#crop-evidence-normal-452-342-900-95)"><svg x="452" y="342" width="280" height="150" viewBox="900 95 710 500" preserveAspectRatio="xMidYMid slice"><image href="../../../roadmap-model-selection/diffusion-restoration/anomalydiffusion/images/source/ANOMALYDIFFUSION-01-en