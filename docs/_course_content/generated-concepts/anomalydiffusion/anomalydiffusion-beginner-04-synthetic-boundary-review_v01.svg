<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">AnomalyDiffusion image-mask alignment is not physical anomaly evidence</title><desc id="desc">A synthetic image-mask candidate can be aligned yet still lack physical geometry, sensor fidelity, label truth, or production action evidence. Review or hold is required.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-129B86" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#129B86"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D94B62"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092754"/><text x="42" y="99.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#092754" text-anchor="start">mask alignment ≠ physical anomaly evidence</text><text x="42" y="147" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="600" fill="#52688D" text-anchor="start">一張 image/mask 視覺上對齊，只能表示模型遵循了 generation condition；texture、scale、illumination、sensor noise 與製程語意仍需用真實資料與 review 檢查。</text><rect x="1096" y="34" width="536" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1364" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">ANOMALYDIFFUSION · SYNTHETIC AUGMENTATION</text><text x="50" y="211.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#12346C" text-anchor="start">read the output boundary before using a synthetic sample</text><rect x="50" y="242" width="484" height="428" rx="29" fill="#FFFFFF" stroke="#F28B00" stroke-width="3"/><text x="292" y="284.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#F28B00" text-anchor="middle">synthetic training candidate</text><g data-entity="anomalydiffusion_physical_aoi" data-contract="same physical inspection context"><clipPath id="crop-boundary-output-88-327-860-140"><rect x="88" y="327" width="235" height="210" rx="16"/></clipPath><g clip-path="url(#crop-boundary-output-88-327-860-140)"><svg x="88" y="327" width="235" height="210" viewBox="860 140 720 550" preserveAspectRatio="xMidYMid slice"><image href="../../../roadmap-model-selection/diffusion-restoration/anomalydiffusion/images/source/ANOMALYDIFFUSION-01-engineer-anomaly-mask-review_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="88" y="327" width="235" height="210" rx="16" fill="none" stroke="#F28B00" stroke-width="3"/></g><g data-entity="planned_anomaly_mask" data-contract="location policy; not physical label"><path d="M138.0 399.5 C172.0 362.9, 246.0 374.6, 272.0 409.4 C294.0 447.6, 240.0 492.4, 188.0 477.5 C132.0 470.8, 120.0 429.3, 138.0 399.5 Z" fill="#F28B00" fill-opacity=".16" stroke="#F28B00" stroke-width="5" stroke-dasharray="10 7"/><rect x="114" y="357" width="184" height="36" rx="17" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="206.0" y="384.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">planned mask</text></g><g data-entity="synthetic_anomaly_expression"><path d="M147.2 455.7 C172.7 401.1, 216.9 467.2, 264.5 400.1" fill="none" stroke="#F28B00" stroke-width="12" stroke-linecap="round"/><path d="M150.6 451.5 C179.5 408.4, 218.6 462.0, 257.7 406.4" fill="none" stroke="#F5B835" stroke-width="4" stroke-linecap="round"/></g><rect x="350" y="337" width="148" height="95" rx="16" fill="#FFF1F3" stroke="#D94B62" stroke-width="2"/><text x="424" y="372.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#D94B62" text-anchor="middle">SYNTHETIC</text><text x="424" y="401.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="middle">image + mask</text><text x="292" y="585.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">provenance + review record required</text><text x="292" y="624.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F28B00" text-anchor="middle">may enter a controlled training experiment</text><path d="M557 450 L611 450" fill="none" stroke="#F28B00" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><rect x="632" y="242" width="410" height="428" rx="29" fill="#F4F0FF" stroke="#7657C8" stroke-width="3"/><text x="837" y="285.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#7657C8" text-anchor="middle">what alignment can say</text><rect x="670" y="331" width="334" height="102" rx="19" fill="#FFFFFF" stroke="#129B86" stroke-width="2"/><text x="837" y="369.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">generated expression follows</text><text x="837" y="398.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#129B86" text-anchor="middle">the planned mask location</text><text x="837" y="476.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#D94B62" text-anchor="middle">what it cannot say</text><text x="837" y="516.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">not physical geometry · not severity</text><text x="837" y="547.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">not sensor fidelity · not true label</text><text x="837" y="592.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">not a defect score or measurement</text><path d="M1065 450 L1118 450" fill="none" stroke="#D94B62" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-D94B62)"/><rect x="1138" y="242" width="478" height="428" rx="29" fill="#EFFAF4" stroke="#149A62" stroke-width="3"/><text x="1377" y="285.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#149A62" text-anchor="middle">quality + domain review</text><circle cx="1191" cy="343" r="9" fill="#149A62" stroke="none" stroke-width="0"/><text x="1217" y="350.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="start">appearance / texture / scale</text><circle cx="1191" cy="391" r="9" fill="#149A62" stroke="none" stroke-width="0"/><text x="1217" y="398.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="start">illumination / sensor noise</text><circle cx="1191" cy="439" r="9" fill="#149A62" stroke="none" stroke-width="0"/><text x="1217" y="446.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="start">process semantics / taxonomy</text><circle cx="1191" cy="487" r="9" fill="#149A62" stroke="none" stroke-width="0"/><text x="1217" y="494.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="start">few-shot identity or duplicate leak</text><g data-entity="human_review_or_hold_gate"><rect x="1185" y="556" width="385" height="86" rx="22" fill="#FFF1F3" stroke="#D94B62" stroke-width="3"/><text x="1209" y="590.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#D94B62" text-anchor="start">REVIEW / HOLD</text><text x="1209" y="620.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="start">not production label or action</text></g><rect x="50" y="724" width="1566" height="90" rx="23" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="833" y="762.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">A convincing-looking synthetic image/mask can still be implausible in texture, scale, illumination, sensor noise, process meaning, or rare safety modes.</text><text x="833" y="795.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D94B62" text-anchor="middle">Keep it synthetic, preserve provenance, inspect failure galleries, and route ambiguous outputs to review or HOLD — never to a physical anomaly claim.</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">AnomalyDiffusion&#x27;s output boundary is a synthetic candidate with provenance; it cannot certify a part, replace capture, or authorize release.</text></svg>