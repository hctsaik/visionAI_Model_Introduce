<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">AnomalyGPT observed inferred uncertainty and grounding boundary</title><desc id="desc">Observed evidence, inferred hypothesis, uncertainty and next confirmation must be separated and tied to a declared region. Region-text disagreement requires abstain or HOLD.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7352DA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7352DA"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9475F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9475F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#08275A"/><rect x="40" y="30" width="188" height="44" rx="22" fill="#F2EEFF" stroke="#7352DA" stroke-width="2"/><text x="134" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">STEP 4 / 5</text><rect x="1274" y="30" width="358" height="44" rx="22" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="2"/><text x="1453" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">AnomalyGPT · grounded assist</text><text x="40" y="123.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#0A1A37" text-anchor="start">grounded output：分開 observed、inferred、uncertainty；每句話都要回到宣告的 region</text><text x="40" y="166.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="650" fill="#52698D" text-anchor="start">區域對齊並不自動證明根因；region-text disagreement、hallucination 或沒有 evidence 時，模型應 abstain / HOLD</text><rect x="45" y="231" width="455" height="534" rx="27" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="3"/><text x="272" y="276.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#0A1A37" text-anchor="middle">same test ROI + declared R-17</text><g data-entity="anomalygpt_metal_plate_aoi"><clipPath id="photo-observed-88-313"><rect x="88" y="313" width="254" height="272" rx="22"/></clipPath><g clip-path="url(#photo-observed-88-313)"><image href="anomalygpt-industrial-metal-plate-anchor_v02.png" x="88" y="313" width="254" height="272" preserveAspectRatio="xMidYMid slice"/></g><rect x="88" y="313" width="254" height="272" rx="22" fill="none" stroke="#F38B00" stroke-width="3"/><rect x="260.72" y="476.2" width="43.18" height="43.52" rx="7" fill="none" stroke="#F38B00" stroke-width="4"/><text x="282.31" y="465.2" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">R-17 cue</text><text x="215.0" y="614.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="middle">raw ROI with evidence cue</text></g><g data-entity="anomalygpt_image_decoder_evidence_region"><rect x="122" y="631" width="186" height="112" rx="20" fill="#FFF4E4" stroke="#F38B00" stroke-width="3"/><text x="215.0" y="663.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0A1A37" text-anchor="middle">R-17</text><text x="215.0" y="688.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#F38B00" text-anchor="middle">image-decoder region</text><rect x="144.0" y="695.0" width="22.4" height="18.0" rx="5" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.2"/><rect x="172.4" y="695.0" width="22.4" height="18.0" rx="5" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.2"/><rect x="200.8" y="695.0" width="22.4" height="18.0" rx="5" fill="#F38B00" fill-opacity="0.7" stroke="#F38B00" stroke-width="1.2"/><rect x="229.2" y="695.0" width="22.4" height="18.0" rx="5" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.2"/><rect x="257.6" y="695.0" width="22.4" height="18.0" rx="5" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.2"/><text x="215.0" y="733.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">not truth</text></g><path d="M521 488 L578 488" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="603" y="232" width="532" height="517" rx="24" fill="#FFFFFF" stroke="#1769E0" stroke-width="3"/><text x="869" y="269.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#0A1A37" text-anchor="middle">structured assist schema</text><text x="869" y="295.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">response + region must travel together</text><rect x="638" y="336" width="462" height="51" rx="13" fill="#EAF8F0" stroke="#149A62" stroke-width="2"/><text x="658" y="367.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#149A62" text-anchor="start">observed: thin line is visible inside R-17</text><rect x="638" y="400" width="462" height="51" rx="13" fill="#F2EEFF" stroke="#7352DA" stroke-width="2"/><text x="658" y="431.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="start">inferred: possible scratch — specialist must confirm</text><rect x="638" y="464" width="462" height="51" rx="13" fill="#FFF4E4" stroke="#F38B00" stroke-width="2"/><text x="658" y="495.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="start">uncertainty: cause / severity are not observed</text><rect x="638" y="528" width="462" height="51" rx="13" fill="#FFF0F3" stroke="#D9475F" stroke-width="2"/><text x="658" y="559.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="start">next: inspect R-17; abstain if region is absent</text><text x="869" y="718.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">text confidence is not a defect probability</text><rect x="1170" y="231" width="445" height="534" rx="27" fill="#FFF0F3" stroke="#D9475F" stroke-width="3"/><text x="1392" y="276.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#D9475F" text-anchor="middle">counterfactual grounding check</text><rect x="1206" y="317" width="373" height="150" rx="18" fill="#FFFFFF" stroke="#149A62" stroke-width="2"/><text x="1392" y="350.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#149A62" text-anchor="middle">A · region supports the wording</text><text x="1392" y="381.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="middle">still a candidate → specialist confirmation</text><text x="1392" y="421.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">do not turn alignment into root cause</text><rect x="1206" y="505" width="373" height="174" rx="18" fill="#FFFFFF" stroke="#D9475F" stroke-width="2"/><text x="1392" y="539.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D9475F" text-anchor="middle">B · text and region disagree</text><text x="1392" y="570.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="middle">phrase says ‘scratch’; region is clean</text><text x="1392" y="601.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">→ abstain / HOLD, request evidence</text><text x="1392" y="636.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">fluency cannot repair missing grounding</text><rect x="40" y="851" width="1592" height="50" rx="18" fill="#FFF5D4" stroke="#E5AB22" stroke-width="2"/><circle cx="79" cy="876" r="12" fill="#FFE29A" stroke="#C98700" stroke-width="2"/><text x="79" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#805300" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#674700" text-anchor="start">observed 是可回看的證據；inferred 是待驗證假說。把兩者與 uncertainty 寫入 schema，才能讓 specialist 清楚知道下一步要確認什麼。</text></svg>