<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">AnomalyGPT 的反事實與 HOLD 說明圖</title>
  <desc id="desc">三個模型專屬反事實卡片，分別呈現條件被破壞時的可觀察結果和安全的 HOLD 或重驗下一步。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0B3068" flood-opacity=".12"/></filter>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker>
    <marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker>
    <style>text { dominant-baseline: alphabetic; } .fine { fill:#536A91; font-size:18px; }</style>
  </defs>
  <rect width="1672" height="941" fill="#F5F8FE"/>
  <rect x="40" y="32" width="150" height="32" rx="16" fill="#E6F0FF"/><text x="58" y="54.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="16" font-weight="800" fill="#1769E0">反事實與安全邊界</text><text x="40" y="116" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="43" font-weight="900" fill="#071A3B">同一條因果鏈，會在哪裡被破壞？</text><text x="40" y="182" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="500" fill="#50698F">不是多背三個風險名詞；要能預測畫面可能怎麼變，並選擇安全的下一步。</text><text x="1630" y="57.0" text-anchor="end" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#5C7395">AnomalyGPT</text><rect x="77" y="260" width="478" height="516" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><circle cx="121" cy="306" r="25" fill="#D84A4A"/><text x="121" y="314.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">1</text><text x="159" y="313" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">response hallucination或</text><text x="159" y="342" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">region-text disagreement</text><g data-visual-cue="review_gate_anomalygpt_hallucination_check" data-renderer-art="heatmap_review" data-primitive="evidence_review_gate" data-semantic-scene="evidence_review_gate" data-semantic-entities="candidate|raw_evidence|review_gate" data-specialist-coverage="candidate|raw_evidence|review_gate" data-semantic-relation="bound a candidate with evidence and human review" data-must-show="看似自信的文字泡泡 | 未對應任何 ROI region 的虛線 | grounding check 紅叉 | HOLD 與人工確認" data-not-claim="語言品質能保證視覺 grounding。"><title>幻覺與錯位</title><rect x="105" y="390" width="422" height="98" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="204.48999999999998" y1="440.26" x2="295.21" y2="440.26" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="336.79" y1="440.26" x2="423.72999999999996" y2="440.26" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><path d="M444.52 409.09999999999997L450.26 414.84L444.52 420.58L438.78 414.84z" fill="#FFF4CC" stroke="#C88400" stroke-width="2"/><g data-entity="candidate" data-entity-label-full="candidate"><path d="M183.7 427.8616L195.40959999999998 440.26L183.7 452.6584L171.9904 440.26z" fill="#FFF4CC" stroke="#1769E0" stroke-width="3"/><circle cx="183.7" cy="440.26" r="3.0995999999999997" fill="#1769E0"/><text data-label-line="true" x="183.7" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">candidate</text></g><g data-entity="raw_evidence" data-entity-label-full="raw proof"><rect x="298.78" y="427.8616" width="34.44" height="23.4192" rx="8" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="3"/><path d="M302.224 444.95761600000003 L310.1452 438.868624 L316.68879999999996 442.849888 L327.02079999999995 433.7164" fill="none" stroke="#93B8E8" stroke-width="3"/><text data-label-line="true" x="316.0" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">raw proof</text></g><g data-entity="review_gate" data-entity-label-full="REVIEW"><path d="M444.52 427.8616L456.2296 440.26L444.52 452.6584L432.81039999999996 440.26z" fill="#FFF4CC" stroke="#F38B00" stroke-width="3"/><circle cx="444.52" cy="440.26" r="3.0995999999999997" fill="#F38B00"/><text data-label-line="true" x="444.52" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">REVIEW</text></g><g data-relation="bound a candidate with evidence and human review"><rect x="138.34" y="472.24" width="192" height="10.66" rx="4.92" fill="#EAF3FF" stroke="#9FC4FF" stroke-width="2"/><text data-label-line="true" x="234.34" y="473.78999999999996" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">evidence</text><text data-label-line="true" x="234.34" y="489.12999999999994" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">review</text></g></g><text x="105" y="520.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#F38B00">可能看到</text><text x="105" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">流暢說明可能沒有對應視覺證據，錯誤</text><text x="105" y="570" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">仍看似可信。</text><line x1="105" y1="646" x2="527" y2="646" stroke="#D6E7FF" stroke-width="2"/><text x="105" y="675.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#1769E0">正確下一步</text><text x="105" y="703" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">HOLD/abstain；要求grounding、</text><text x="105" y="725" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">region-text agreement、specialist</text><text x="105" y="747" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">confirmation和hallucination test。</text><rect x="597" y="260" width="478" height="516" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><circle cx="641" cy="306" r="25" fill="#F38B00"/><text x="641" y="314.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">2</text><text x="679" y="313" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">prompt/LLM/tokenizer/retrieval/SOP/schema</text><text x="679" y="342" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">或generation controls改變</text><g data-visual-cue="prompt_text_anomalygpt_generation_revision" data-renderer-art="image_text_or_diffusion" data-primitive="text_prompt_embedding" data-semantic-scene="text_prompt_embedding" data-semantic-entities="prompt_text|text_encoder|text_vector" data-specialist-coverage="prompt_text|text_encoder|text_vector" data-semantic-relation="make a declared text representation" data-must-show="LLM、tokenizer、retrieval、SOP、schema、temperature 的版本卡 | 同一 ROI 的兩種文字輸出 | revision 箭頭 | 輸出不可比警示" data-not-claim="只要影像相同，生成回應就一定可重播。"><title>生成狀態會改輸出</title><rect x="625" y="390" width="422" height="98" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="single-text-prompt-embedding"><path d="M662.12 428.78h75.60000000000001v16.400000000000002h-75.60000000000001z" fill="#E8FAFF" stroke="#1769E0" stroke-width="3"/><line x1="745.28" y1="437.8" x2="801.98" y2="437.8" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="805.76" y="425.5" width="52.92" height="24.599999999999998" rx="6" fill="#F7FBFF" stroke="#0AA6D8" stroke-width="3"/><line x1="866.24" y1="437.8" x2="930.5000000000001" y2="437.8" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="930.5000000000001" y1="428.78" x2="975.86" y2="428.78" stroke="#F38B00" stroke-width="4"/><line x1="930.5000000000001" y1="436.98" x2="975.86" y2="436.98" stroke="#F38B00" stroke-width="4"/><line x1="930.5000000000001" y1="445.18" x2="975.86" y2="445.18" stroke="#F38B00" stroke-width="4"/><text data-label-line="true" x="699.92" y="477.98" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">prompt</text><text data-label-line="true" x="832.22" y="477.98" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">text encoder</text><text data-label-line="true" x="953.1800000000001" y="477.98" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">vector</text></g></g><text x="625" y="520.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#F38B00">可能看到</text><text x="625" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">同一輸入可能產生不同文字、區域、</text><text x="625" y="570" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">uncertainty與延遲。</text><line x1="625" y1="646" x2="1047" y2="646" stroke="#D6E7FF" stroke-width="2"/><text x="625" y="675.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#1769E0">正確下一步</text><text x="625" y="703" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">保存完整模型與generation state，變</text><text x="625" y="725" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">更後以固定case regression與</text><text x="625" y="747" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">security review重新qualification。</text><rect x="1117" y="260" width="478" height="516" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><circle cx="1161" cy="306" r="25" fill="#1769E0"/><text x="1161" y="314.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">3</text><text x="1199" y="313" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">sensitive data、token latency、</text><text x="1199" y="342" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">tiny defect或global logic</text><g data-visual-cue="drift_hold_anomalygpt_privacy_latency_limit" data-renderer-art="drift_hold" data-primitive="declared_drift_hold_anomalygpt_privacy_latency_limit" data-semantic-scene="declared_drift_hold_anomalygpt_privacy_latency_limit" data-semantic-entities="declared_input|declared_operation|candidate_or_gate" data-specialist-coverage="declared_input|declared_operation|candidate_or_gate" data-semantic-relation="show the authored operation before action" data-must-show="sensitive image 資料鎖 | token generation/retrieval 的延遲時間線 | tiny defect 小於有效視覺尺度 | HOLD 指向安全與專家路徑" data-not-claim="LVLM 可自動解決資料權限、P95 或微小缺陷可見性。"><title>隱私、延遲與尺度</title><rect x="1145" y="390" width="422" height="98" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="1244.49" y1="440.26" x2="1335.21" y2="440.26" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="1376.79" y1="440.26" x2="1463.73" y2="440.26" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="declared_input" data-entity-label-full="input"><path d="M1223.7 428.55039999999997L1234.0320000000002 434.7496L1234.0320000000002 445.7704L1223.7 451.9696L1213.368 445.7704L1213.368 434.7496z" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><text data-label-line="true" x="1223.7" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">input</text></g><g data-entity="declared_operation" data-entity-label-full="operation"><rect x="1343.6016" y="431.65" width="8.61" height="17.22" rx="5" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="3"/><rect x="1359.444" y="431.65" width="8.61" height="17.22" rx="5" fill="#E8FAFF" stroke="#0AA6D8" stroke-width="3"/><line x1="1354.278" y1="440.26" x2="1358.4108" y2="440.26" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><text data-label-line="true" x="1356.0" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">operation</text></g><g data-entity="candidate_or_gate" data-entity-label-full="candidate"><path d="M1484.52 427.8616L1496.2296 440.26L1484.52 452.6584L1472.8104 440.26z" fill="#FFF4CC" stroke="#F38B00" stroke-width="3"/><circle cx="1484.52" cy="440.26" r="3.0995999999999997" fill="#F38B00"/><text data-label-line="true" x="1484.52" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">candidate</text></g><g data-relation="show the authored operation before action"><rect x="1178.34" y="472.24" width="192" height="10.66" rx="4.92" fill="#EAF3FF" stroke="#9FC4FF" stroke-width="2"/><text data-label-line="true" x="1274.34" y="473.78999999999996" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">declared</text><text data-label-line="true" x="1274.34" y="489.12999999999994" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">drift h</text></g></g><text x="1145" y="520.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#F38B00">可能看到</text><text x="1145" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">資料權限/保留可能不合規，完整P95受</text><text x="1145" y="570" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">生成和retrieval影響，且assist層未</text><text x="1145" y="592" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">必有可靠視覺解析度或結構判讀。</text><line x1="1145" y1="646" x2="1567" y2="646" stroke="#D6E7FF" stroke-width="2"/><text x="1145" y="675.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#1769E0">正確下一步</text><text x="1145" y="703" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">先設ACL/redaction/retention與</text><text x="1145" y="725" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">complete P95；把精密檢測和release</text><text x="1145" y="747" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">放在specialist path。</text><rect x="77" y="816" width="1518" height="63" rx="20" fill="#FFF4CC" stroke="#F1B828"/><text x="836" y="855.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="800" fill="#674500">任一條件超出 qualification envelope：先停在 HOLD／REVIEW，保存 raw evidence 與版本，再決定怎麼重驗。</text>
</svg>