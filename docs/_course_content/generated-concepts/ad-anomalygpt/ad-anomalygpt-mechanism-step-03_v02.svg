<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">分開觀察與推論</title><desc id="desc">回答把可連回影像區域的 observed 與待驗證的 inferred 分開，並附不確定性與下一步。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="condition_map_anomalygpt_observed_inferred" data-renderer-art="image_text_or_diffusion" data-primitive="anomalygpt_observed_inferred_schema" data-semantic-scene="anomalygpt_observed_inferred_schema" data-semantic-entities="observed_region|inferred_claim|uncertainty_or_abstain|confirmation_action" data-specialist-coverage="observed_region|inferred_claim|uncertainty_or_abstain|confirmation_action" data-semantic-relation="separate image-grounded observations from inference before confirmation" data-must-show="observed 欄位連到 ROI region ID | inferred 欄位以虛線表示 | uncertainty/abstain 欄位 | 下一步 confirmation action" data-not-claim="模型的推論等同原圖中直接可觀察的事實。"><title>分開觀察與推論</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="anomalygpt-observed-inferred-schema"><rect x="58.16" y="99.16" width="86.24000000000001" height="70.72" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M66.78399999999999 150.7856 L86.6192 132.39839999999998 L103.0048 144.42079999999999 L128.8768 116.84" fill="none" stroke="#93B8E8" stroke-width="3"/><rect x="81.4448" y="116.84" width="31.046400000000002" height="30.40959