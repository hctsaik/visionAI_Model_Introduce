<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">先治理模擬與狀態</title><desc id="desc">AnomalyGPT 先把正常資料、模擬異常文字對、模型版本與資料安全規則一同治理。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="support_coverage_anomalygpt_governed_simulation" data-renderer-art="support_coverage" data-primitive="anomalygpt_simulation_governance" data-semantic-scene="anomalygpt_simulation_governance" data-semantic-entities="normal_support|simulated_instruction_pairs|versioned_vlm_stack|security_policy" data-specialist-coverage="normal_support|simulated_instruction_pairs|versioned_vlm_stack|security_policy" data-semantic-relation="govern simulation data and VLM state before assisted claims" data-must-show="normal support | simulated anomaly/text pair 資料卡 | visual encoder、prompt learner、bridge/LVLM 的版本鏈 | license/security policy 鎖頭" data-not-claim="模擬文字資料本身就是現場真實缺陷證據。"><title>先治理模擬與狀態</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="anomalygpt-simulation-governance"><rect x="64.32" y="99.16" width="86.24000000000001" height="70.72" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M72.94399999999999 150.7856 L92.7792 132.39839999999998 L109.1648 144.42079999999999 L135.0368 116.84" fill="none" stroke="#93B8E8" stroke-width="3"/><rect x="87.6048" y="116.84" width="31.046400000000002" height="30.409599999999998" rx="4" fill="none" stroke="#F38B00" stroke-width="3" stroke-dasharray="6 4"/><line x1="169.04" y1="136.60000000000002" x2="230.64" y2="136.60000000000002" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="224.48" y="95.0" width="98.56" height="33.28" rx="5" fill="#E8FAFF" stroke="#0AA6D8" stroke-width="2"/><rect x="224.48" y="153.24" width="98.56" height="33.28" rx="5" fill="#FFF7E8" stroke="#F38B00" stroke-width="2"/><line x1="341.52" y1="140.76" x2="409.28000000000003" y2="140.76" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="409.28000000000003" y="101.24000000000001" width="73.92" height="74.88" rx="6" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><line x1="495.52" y1="140.76" x2="563.28" y2="140.76" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><path d="M600.24 95.0L643.36 113.72v41.6L600.24 188.6L557.12 155.32V113.72z" fill="#FFF4CC" stroke="#C88400" stroke-width="3"/><text data-label-line="true" x="107.44" y="228.12" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">normal</text><text data-label-line="true" x="273.76" y="228.12" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">sim pairs</text><text data-label-line="true" x="446.24" y="228.12" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">VLM state</text><text data-label-line="true" x="600.24" y="228.12" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">security</text></g></g><text x="42" y="311.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-wei