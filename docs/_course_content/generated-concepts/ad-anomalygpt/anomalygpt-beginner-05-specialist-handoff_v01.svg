<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">AnomalyGPT grounding and specialist handoff boundary</title><desc id="desc">Grounding checks hand AnomalyGPT candidates to a specialist or human owner and an external decision policy. Simulation mismatch, model-state changes, security, latency, tiny defects or logical faults can require HOLD.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7352DA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7352DA"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9475F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9475F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#08275A"/><rect x="40" y="30" width="188" height="44" rx="22" fill="#F2EEFF" stroke="#7352DA" stroke-width="2"/><text x="134" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">STEP 5 / 5</text><rect x="1274" y="30" width="358" height="44" rx="22" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="2"/><text x="1453" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">AnomalyGPT · grounded assist</text><text x="40" y="123.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#0A1A37" text-anchor="start">先做 grounding，再交給 specialist / human；final owner 在 AnomalyGPT 外部</text><text x="40" y="166.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="650" fill="#52698D" text-anchor="start">只有 grounding、uncertainty / abstain、security、real holdout 與 complete P95 都受治理時，它才適合作為 engineering assist</text><g data-entity="anomalygpt_metal_plate_aoi"><clipPath id="photo-handoff-54-285"><rect x="54" y="285" width="251" height="285" rx="22"/></clipPath><g clip-path="url(#photo-handoff-54-285)"><image href="anomalygpt-industrial-metal-plate-anchor_v02.png" x="54" y="285" width="251" height="285" preserveAspectRatio="xMidYMid slice"/></g><rect x="54" y="285" width="251" height="285" rx="22" fill="none" stroke="#F38B00" stroke-width="3"/><rect x="224.68" y="456.0" width="42.67" height="45.6" rx="7" fill="none" stroke="#F38B00" stroke-width="4"/><text x="246.01500000000001" y="445.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">R-17 cue</text><text x="179.5" y="599.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="middle">raw ROI + R-17</text></g><path d="M326 427 L385 427" fill="none" stroke="#149A62" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-149A62)"/><g data-entity="anomalygpt_grounding_uncertainty_check"><rect x="409" y="268" width="334" height="317" rx="24" fill="#EAF8F0" stroke="#149A62" stroke-width="3"/><text x="576.0" y="303.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#0A1A37" text-anchor="middle">grounding check</text><text x="576.0" y="329.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#149A62" text-anchor="middle">before any handoff</text><circle cx="449" cy="367" r="9" fill="#149A62"/><text x="472" y="374.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#0A1A37" text-anchor="start">region ↔ text agree</text><circle cx="449" cy="415" r="9" fill="#149A62"/><text x="472" y="422.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#0A1A37" text-anchor="start">observed / inferred split</text><circle cx="449" cy="463" r="9" fill="#149A62"/><text x="472" y="470.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#0A1A37" text-anchor="start">uncertainty / abstain</text><text x="576.0" y="568.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">fails? → abstain / HOLD</text></g><path d="M764 427 L823 427" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="847" y="258" width="347" height="338" rx="26" fill="#EAF4FF" stroke="#1769E0" stroke-width="3"/><text x="1020" y="301.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#0A1A37" text-anchor="middle">specialist / human confirmation</text><text x="1020" y="331.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">review ROI + region + evidence</text><circle cx="887" cy="382" r="8" fill="#1769E0"/><text x="908" y="389.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#0A1A37" text-anchor="start">verify visual evidence</text><circle cx="887" cy="422" r="8" fill="#1769E0"/><text x="908" y="429.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#0A1A37" text-anchor="start">inspect declared SOP revision</text><circle cx="887" cy="462" r="8" fill="#1769E0"/><text x="908" y="469.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#0A1A37" text-anchor="start">request more data / abstain</text><circle cx="887" cy="502" r="8" fill="#1769E0"/><text x="908" y="509.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#0A1A37" text-anchor="start">record confirmation owner</text><text x="1020" y="565.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">the assistant stops here</text><path d="M1214 427 L1265 427" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><rect x="1289" y="258" width="322" height="338" rx="26" fill="#FFF4E4" stroke="#F38B00" stroke-width="3"/><text x="1450" y="301.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#0A1A37" text-anchor="middle">external owner contract</text><text x="1450" y="331.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">outside AnomalyGPT</text><rect x="1323" y="376" width="254" height="73" rx="16" fill="#FFFFFF" stroke="#F38B00" stroke-width="2"/><text x="1450" y="407.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#F38B00" text-anchor="middle">versioned decision policy</text><text x="1450" y="434.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">not generated by the LVLM</text><rect x="1323" y="482" width="254" height="71" rx="16" fill="#FFF0F3" stroke="#D9475F" stroke-width="2"/><text x="1450" y="513.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">missing prerequisite → HOLD</text><rect x="54" y="650" width="1557" height="133" rx="25" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="2"/><text x="84" y="688.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#D9475F" text-anchor="start">HOLD / re-qualify when:</text><circle cx="92" cy="720" r="8" fill="#D9475F"/><text x="113" y="727.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="start">simulated-to-real mismatch</text><text x="560" y="727.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="780" fill="#0A1A37" text-anchor="start">pair / wording does not cover real error taxonomy</text><circle cx="92" cy="747" r="8" fill="#7352DA"/><text x="113" y="754.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="start">prompt / LVLM / retrieval / schema change</text><text x="560" y="754.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="780" fill="#0A1A37" text-anchor="start">fixed-case regression + security review required</text><circle cx="92" cy="774" r="8" fill="#F38B00"/><text x="113" y="781.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="start">sensitive data, token P95, tiny or logical fault</text><text x="560" y="781.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="780" fill="#0A1A37" text-anchor="start">ACL / retention + complete latency + specialist path required</text><rect x="40" y="851" width="1592" height="50" rx="18" fill="#FFF5D4" stroke="#E5AB22" stroke-width="2"/><circle cx="79" cy="876" r="12" fill="#FFE29A" stroke="#C98700" stroke-width="2"/><text x="79" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#805300" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#674700" text-anchor="start">AnomalyGPT 是可追溯的 assist evidence loop；沒有 grounding、abstain、specialist owner、security 或 complete P95，就不要放進 autonomous release loop。</text></svg>