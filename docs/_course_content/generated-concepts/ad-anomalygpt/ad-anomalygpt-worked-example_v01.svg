  <rect x="40" y="32" width="150" height="32" rx="16" fill="#E6F0FF"/><text x="58" y="54.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="16" font-weight="800" fill="#1769E0">同一個工作例</text><text x="40" y="116" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="43" font-weight="900" fill="#071A3B">先預測，再看模型如何回答</text><text x="40" y="182" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="500" fill="#50698F">把同一個現場情境走一次：模型的輸出幫人決定下一個該回看的地方，而不是替人宣告真相。</text><text x="1630" y="57.0" text-anchor="end" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#5C7395">AnomalyGPT</text><rect x="40" y="266" width="372" height="518" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><g data-visual-cue="support_coverage_anomalygpt_governed_simulation" data-renderer-art="support_coverage" data-primitive="anomalygpt_simulation_governance" data-semantic-scene="anomalygpt_simulation_governance" data-semantic-entities="normal_support|simulated_instruction_pairs|versioned_vlm_stack|security_policy" data-specialist-coverage="normal_support|simulated_instruction_pairs|versioned_vlm_stack|security_policy" data-semantic-relation="govern simulation data and VLM state before assisted claims" data-must-show="normal support | simulated anomaly/text pair 資料卡 | visual encoder、prompt learner、bridge/LVLM 的版本鏈 | license/security policy 鎖頭" data-not-claim="模擬文字資料本身就是現場真實缺陷證據。"><title>先治理模擬與狀態</title><rect x="64" y="294" width="324" height="122" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="anomalygpt-simulation-governance"><rect x="91.6" y="333.84000000000003" width="39.2" height="31.28" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M95.52 356.67440000000005 L104.536 348.5416 L111.984 353.85920000000004 L123.744 341.66" fill="none" stroke="#93B8E8" stroke-width="3"/><rect x="102.184" y="341.66" width="14.112" height="13.4504" rx="4" fill="none" stroke="#F38B00" stroke-width="3" stroke-dasharray="6 4"/><line x1="139.2" y1="350.4" x2="167.20000000000002" y2="350.4" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="164.4" y="332.0" width="44.800000000000004" height="14.72" rx="5" fill="#E8FAFF" stroke="#0AA6D8" stroke-width="2"/><rect x="164.4" y="357.76" width="44.800000000000004" height="14.72" rx="5" fill="#FFF7E8" stroke="#F38B00" stroke-width="2"/><line x1="217.60000000000002" y1="352.24" x2="248.40000000000003" y2="352.24" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="248.40000000000003" y="334.76" width="33.6" height="33.12" rx="6" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><line x1="287.6" y1="352.24" x2="318.40000000000003" y2="352.24" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><path d="M335.20000000000005 332.0L354.80000000000007 340.28v18.400000000000002L335.20000000000005 373.4L315.6 358.68V340.28z" fill="#FFF4CC" stroke="#C88400" stroke-width="3"/><text data-label-line="true" x="111.2" y="390.88" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">normal</text><text data-label-line="true" x="186.8" y="390.88" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">sim pairs</text><text data-label-line="true" x="265.20000000000005" y="390.88" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">VLM state</text><text data-label-line="true" x="335.20000000000005" y="390.88" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">security</text></g></g><circle cx="360" cy="332" r="25" fill="#1769E0"/><text x="360" y="340.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">1</text><text x="68" y="448" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="25" font-weight="900" fill="#0B2858">固定工作例</text><text x="68" y="520" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">AnomalyGPT 讀取ROI和一張</text><text x="68" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">specialist candidate map，</text><text x="68" y="576" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">輸出『疑似污染』但region落</text><text x="68" y="604" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">在乾淨背景。</text><rect x="445" y="266" width="372" height="518" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><g data-visual-cue="prompt_text_anomalygpt_visual_language_path" data-renderer-art="image_text_or_diffusion" data-primitive="text_prompt_embedding" data-semantic-scene="text_prompt_embedding" data-semantic-entities="prompt_text|text_encoder|text_vector" data-specialist-coverage="prompt_text|text_encoder|text_vector" data-semantic-relation="make a declared text representation" data-must-show="test ROI | visual tokens 與 learned prompt | bridge/LVLM 文字回應 | image-decoder region 的定位框" data-not-claim="語句流暢就代表已經量到缺陷。"><title>視覺轉成助理候選</title><rect x="469" y="294" width="324" height="122" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="single-text-prompt-embedding"><path d="M502.20000000000005 335.68h56.0v18.400000000000002h-56.0z" fill="#E8FAFF" stroke="#1769E0" stroke-width="3"/><line x1="563.8000000000001" y1="345.8" x2="605.8000000000001" y2="345.8" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="608.6" y="332.0" width="39.2" height="27.599999999999998" rx="6" fill="#F7FBFF" stroke="#0AA6D8" stroke-width="3"/><line x1="653.4000000000001" y1="345.8" x2="701.0" y2="345.8" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="701.0" y1="335.68" x2="734.5999999999999" y2="335.68" stroke="#F38B00" stroke-width="4"/><line x1="701.0" y1="344.88" x2="734.5999999999999" y2="344.88" stroke="#F38B00" stroke-width="4"/><line x1="701.0" y1="354.08" x2="734.5999999999999" y2="354.08" stroke="#F38B00" stroke-width="4"/><text data-label-line="true" x="530.2" y="390.88" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">prompt</text><text data-label-line="true" x="628.2" y="390.88" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">text encoder</text><text data-label-line="true" x="717.8" y="390.88" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">vector</text></g></g><circle cx="765" cy="332" r="25" fill="#0AA6D8"/><text x="765" y="340.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">2</text><text x="473" y="448" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="25" font-weight="900" fill="#0B2858">先做預測</text><text x="473" y="520" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">這個回答應直接送PLC，還是要</text><text x="473" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">走什麼路徑？</text><rect x="850" y="266" width="372" height="518" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><g data-visual-cue="condition_map_anomalygpt_observed_inferred" data-renderer-art="image_text_or_diffusion" data-primitive="anomalygpt_observed_inferred_schema" data-semantic-scene="anomalygpt_observed_inferred_schema" data-semantic-entities="observed_region|inferred_claim|uncertainty_or_abstain|confirmation_action" data-specialist-coverage="observed_region|inferred_claim|uncertainty_or_abstain|confirmation_action" data-semantic-relation="separate image-grounded observations from inference before confirmation" data-must-show="observed 欄位連到 ROI region ID | inferred 欄位以虛線表示 | uncertainty/abstain 欄位 | 下一步 confirmation action" data-not-claim="模型的推論等同原圖中直接可觀察的事實。"><title>分開觀察與推論</title><rect x="874" y="294" width="324" height="122" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="anomalygpt-observed-inferred-schema"><rect x="898.8" y="333.84000000000003" width="39.2" height="31.28" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M902.7199999999999 356.67440000000005 L911.736 348.5416 L919.184 353.85920000000004 L930.944 341.66" fill="none" stroke="#93B8E8" stroke-width="3"/><rect x="909.3839999999999" y="341.66" width="14.112" height="13.4504" rx="4" fill="none" stroke="#F38B00" stroke-width="3" stroke-dasharray="6 4"/><line x1="946.4" y1="348.56" x2="974.4" y2="342.12" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="974.4" y="332.0" width="44.800000000000004" height="17.48" rx="5" fill="#E8FAFF" stroke="#1769E0" stroke-width="3"/><rect x="1050.0" y="359.6" width="44.800000000000004" height="17.48" rx="5" fill="#FFF7E8" stroke="#F38B00" stroke-width="3" stroke-dasharray="5 3"/><line x1="1024.8" y1="341.2" x2="1128.4" y2="345.8" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="1100.4" y1="367.88" x2="1128.4" y2="358.68" stroke="#F38B00" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arrow-orange)"/><path d="M1145.2 332.92L1164.8 352.24L1145.2 371.56L1125.6000000000001 352.24z" fill="#FFF4CC" stroke="#C88400" stroke-width="3"/><text data-label-line="true" x="996.8" y="327.4" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">observed</text><text data-label-line="true" x="1072.4" y="390.88" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">inferred?</text><text data-label-line="true" x="1145.2" y="384.64" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">confirm</text><text data-label-line="true" x="1145.2" y="399.97999999999996" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">/ abstain</text></g></g><circle cx="1170" cy="332" r="25" fill="#F38B00"/><text x="1170" y="340.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">3</text><text x="878" y="448" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="25" font-weight="900" fill="#0B2858">模型看到什麼</text><text x="878" y="520" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">應abstain或HOLD，要求</text><text x="878" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">grounding check與</text><text x="878" y="576" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">specialist/human</text><text x="878" y="604" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">confirmation。文字和區域不</text><text x="878" y="632" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">一致時，不能因語句自信就當</text><text x="878" y="660" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">成產品結論。</text><rect x="1255" y="266" width="372" height="518" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><g data-visual-cue="review_gate_anomalygpt_specialist_owner" data-renderer-art="heatmap_review" data-primitive="evidence_review_gate" data-semantic-scene="evidence_review_gate" data-semantic-entities="candidate|raw_evidence|review_gate" data-specialist-coverage="candidate|raw_evidence|review_gate" data-semantic-relation="bound a candidate with evidence and human review" data-must-show="region-text agreement check | hallucination 檢查圖示 | specialist/human owner | PASS、REVIEW、HOLD 只出現在 owner 端" data-not-claim="AnomalyGPT 可自行控制 PLC 或自動放行。"><title>grounding 後交 owner</title><rect x="1279" y="294" width="324" height="122" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="1358.4" y1="348.56" x2="1425.6" y2="348.56" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="1456.4" y1="348.56" x2="1520.8" y2="348.56" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><path d="M1536.2 313.6L1542.64 320.04L1536.2 326.48L1529.76 320.04z" fill="#FFF4CC" stroke="#C88400" stroke-width="2"/><g data-entity="candidate" data-entity-label-full="candidate"><path d="M1343.0 336.97379310344826L1353.942528735632 348.56L1343.0 360.14620689655175L1332.057471264368 348.56z" fill="#FFF4CC" stroke="#1769E0" stroke-width="3"/><circle cx="1343.0" cy="348.56" r="2.896551724137931" fill="#1769E0"/><text data-label-line="true" x="1343.0" y="368.8358620689655" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">candidate</text></g><g data-entity="raw_evidence" data-entity-label-full="raw proof"><rect x="1424.9080459770114" y="336.97379310344826" width="32.18390804597701" height="21.88505747126437" rx="8" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="3"/><path d="M1428.126436781609 352.94988505747125 L1435.5287356321837 347.2597701149425 L1441.6436781609195 350.98022988505744 L1451.2988505747126 342.44505747126436" fill="none" stroke="#93B8E8" stroke-width="3"/><text data-label-line="true" x="1441.0" y="368.8358620689655" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">raw proof</text></g><g data-entity="review_gate" data-entity-label-full="REVIEW"><path d="M1536.2 336.97379310344826L1547.1425287356321 348.56L1536.2 360.14620689655175L1525.257471264368 348.56z" fill="#FFF4CC" stroke="#F38B00" stroke-width="3"/><circle cx="1536.2" cy="348.56" r="2.896551724137931" fill="#F38B00"/><text data-label-line="true" x="1536.2" y="368.8358620689655" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">REVIEW</text></g><g data-relation="bound a candidate with evidence and human review"><rect x="1309.4" y="384.44" width="151.20000000000002" height="11.96" rx="5.52" fill="#EAF3FF" stroke="#9FC4FF" stroke-width="2"/><text data-label-line="true" x="1385.0" y="386.94" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">evidence</text><text data-label-line="true" x="1385.0" y="402.28" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">review</text></g></g><circle cx="1575" cy="332" r="25" fill="#C88400"/><text x="1575" y="340.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">4</text><text x="1283" y="448" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="25" font-weight="900" fill="#0B2858">人應如何解讀</text><text x="1283" y="520" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">不是文字流暢度、text</text><text x="1283" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">confidence或decoder</text><text x="1283" y="576" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">activation所代表的defect</text><text x="1283" y="604" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">probability或final decision。</text><line x1="416" y1="525" x2="433" y2="525" stroke="#1769E0" stroke-width="5" marker-end="url(#arrow-blue)"/><line x1="821" y1="525" x2="838" y2="525" stroke="#1769E0" stroke-width="5" marker-end="url(#arrow-blue)"/><line x1="1226" y1="525" x2="1243" y2="525" stroke="#1769E0" stroke-width="5" marker-end="url(#arrow-blue)"/><rect x="40" y="810" width="1592" height="100" rx="20" fill="#FFF4CC" stroke="#F1B828"/><text x="68" y="842.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="900" fill="#674500">這張圖要帶走：</text><text x="68" y="871" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="600" fill="#674500">即使回答流暢，也可能hallucinate或region-text不一致；它不解決tiny defect有效像素、全域邏輯、metrology或低FPR release。</text>
</svg>