<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">TF-IDG real holdout decision gate</title><desc id="desc">Only a same-contract comparison on stratified real holdout can establish downstream benefit. Integrity, coverage, failures, cost, license, and owner review can still HOLD the POC.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0C9B91" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C9B91"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-149A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#149A63"/></marker><marker id="arrow-536989" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536989"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#09224C"/><text x="42" y="98.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#09224C" text-anchor="start">第三步：只有 stratified real holdout 能判斷增強是否有用</text><text x="42" y="145.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#536989" text-anchor="start">synthetic candidates 先經 quality / domain review；再與 raw-only baseline 使用同一 real split、下游 recipe、review 與完整成本，最後由真實 holdout 決定。</text><rect x="1336" y="32" width="292" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1482" y="65.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">TF-IDG · synthetic augmentation</text><g data-entity="tfidg_mobile_holdout_causal_flow"><rect x="32" y="177" width="604" height="146" rx="18" fill="#EFFBF4" stroke="#149A63" stroke-width="2"/><text x="46" y="218.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#149A63" text-anchor="start">raw-only vs raw + reviewed synthetic</text><text x="46" y="259.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#123265" text-anchor="start">same downstream recipe → real holdout</text><text x="46" y="300.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#D94B62" text-anchor="start">benefit + integrity + owner → review / HOLD</text></g><clipPath id="crop-holdout-source-62-360-0-0"><rect x="62" y="360" width="342" height="254" rx="22"/></clipPath><g clip-path="url(#crop-holdout-source-62-360-0-0)"><svg x="62" y="360" width="342" height="254" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid slice"><image href="../ad-ae/ad-ae-metal-plate-anchor_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="62" y="360" width="342" height="254" rx="22" fill="none" stroke="#1769E0" stroke-width="2"/><text x="233" y="340.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#123265" text-anchor="middle">frozen real train / holdout split</text><rect x="432" y="347" width="350" height="112" rx="20" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><text x="607" y="388.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#1769E0" text-anchor="middle">A · raw-only baseline</text><text x="607" y="426.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#123265" text-anchor="middle">fixed classifier / segmenter recipe</text><rect x="432" y="511" width="350" height="112" rx="20" fill="#FFF7EB" stroke="#F28B00" stroke-width="2"/><text x="607" y="552.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#F28B00" text-anchor="middle">B · raw + reviewed synthetic</text><text x="607" y="590.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#123265" text-anchor="middle">same model / budget / review policy</text><path d="M810 403 L898 451" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><path d="M810 567 L898 513" fill="none" stroke="#F28B00" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><rect x="926" y="345" width="328" height="280" rx="24" fill="#FFFFFF" stroke="#149A63" stroke-width="2"/><text x="1090" y="388.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#149A63" text-anchor="middle">stratified real holdout</text><text x="1090" y="440.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#123265" text-anchor="middle">by recipe / category</text><rect x="1003" y="477" width="45" height="70" rx="7" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="1025" y="578.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#123265" text-anchor="middle">A</text><rect x="1081" y="435" width="45" height="112" rx="7" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="1103" y="578.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#123265" text-anchor="middle">B</text><rect x="1159" y="464" width="45" height="83" rx="7" fill="#00A8C6" stroke="#00A8C6" stroke-width="0"/><text x="1181" y="578.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#123265" text-anchor="middle">tail</text><text x="1090" y="608.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D94B62" text-anchor="middle">no result is implied by this sketch</text><path d="M1282 485 L1351 485" fill="none" stroke="#149A63" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-149A63)"/><rect x="1378" y="345" width="230" height="280" rx="24" fill="#EFFBF4" stroke="#149A63" stroke-width="2"/><text x="1493" y="388.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#149A63" text-anchor="middle">evidence gate</text><text x="1493" y="440.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#123265" text-anchor="middle">label integrity</text><text x="1493" y="476.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#123265" text-anchor="middle">mode coverage</text><text x="1493" y="512.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#123265" text-anchor="middle">failure review</text><text x="1493" y="548.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#123265" text-anchor="middle">P95 / cost / license</text><rect x="1415" y="574" width="156" height="34" rx="11" fill="#FFF0F1" stroke="#D94B62" stroke-width="2"/><text x="1493" y="597.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">missing → HOLD</text><rect x="62" y="715" width="1546" height="92" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="92" y="751.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#123265" text-anchor="start">不要拿「training-free」或一張美觀 sample 當效益。比較時固定 real split、synthetic volume、downstream model、human review、GPU / P95 / cost 與 no-go rule。</text><text x="92" y="785.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="700" fill="#536989" text-anchor="start">只接受 stratified real-holdout benefit、label integrity、mode coverage、reproducibility、license/provenance 和 domain-owner acceptance 都可驗證的結論。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">synthetic augmentation 是可比較的實驗變因；真正決策證據來自固定條件下的 real holdout 與 owner review。</text></svg>