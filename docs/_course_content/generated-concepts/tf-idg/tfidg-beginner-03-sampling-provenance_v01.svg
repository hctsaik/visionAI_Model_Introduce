<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">TF-IDG sampling recipe and synthetic provenance</title><desc id="desc">A locked sampling recipe produces a synthetic image, planned region, and provenance bundle. It remains a training candidate, not captured defect truth or physical severity.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0C9B91" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C9B91"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-149A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#149A63"/></marker><marker id="arrow-536989" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536989"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#09224C"/><text x="42" y="98.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#09224C" text-anchor="start">第二步：一張生成圖必須帶著完整 recipe；它是 synthetic candidate，不是 defect fact</text><text x="42" y="145.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#536989" text-anchor="start">固定 scheduler、steps、guidance、seed、resolution、tile / blend、candidate count 與 quality policy；把輸出和 planned region、來源與 sampling trace 綁在一起。</text><rect x="1336" y="32" width="292" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1482" y="65.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">TF-IDG · synthetic augmentation</text><g data-entity="tfidg_mobile_sampling_causal_flow"><rect x="32" y="177" width="604" height="110" rx="18" fill="#FFF7EB" stroke="#F28B00" stroke-width="2"/><text x="46" y="221.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="31" font-weight="900" fill="#F28B00" text-anchor="start">locked recipe + guided sampling</text><text x="46" y="261.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#123265" text-anchor="start">→ synthetic image / region / provenance</text></g><clipPath id="crop-sampling-raw-62-346-0-0"><rect x="62" y="346" width="410" height="284" rx="22"/></clipPath><g clip-path="url(#crop-sampling-raw-62-346-0-0)"><svg x="62" y="346" width="410" height="284" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid slice"><image href="../ad-ae/ad-ae-metal-plate-anchor_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="62" y="346" width="410" height="284" rx="22" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="279" y="501" width="104" height="66" rx="13" fill="#F28B00" fill-opacity="0.10" stroke="#F28B00" stroke-width="4" stroke-dasharray="10 8"/><text x="331.0" y="488.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F28B00" text-anchor="middle">planned</text><text x="267" y="326.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#123265" text-anchor="middle">raw normal source</text><path d="M500 488 L572 488" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="600" y="323" width="356" height="338" rx="26" fill="#FFFFFF" stroke="#7657C8" stroke-width="2"/><text x="778" y="365.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#7657C8" text-anchor="middle">replayable sampling recipe</text><circle cx="640" cy="414" r="8" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><text x="664" y="421.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#123265" text-anchor="start">base / code / license hash</text><circle cx="640" cy="455" r="8" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><text x="664" y="462.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#123265" text-anchor="start">prompt + negative + conditions</text><circle cx="640" cy="496" r="8" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><text x="664" y="503.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#123265" text-anchor="start">scheduler / steps / guidance</text><circle cx="640" cy="537" r="8" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><text x="664" y="544.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#123265" text-anchor="start">seed / resolution / tile / blend</text><circle cx="640" cy="578" r="8" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><text x="664" y="585.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#123265" text-anchor="start">candidate count + quality policy</text><path d="M984 488 L1054 488" fill="none" stroke="#7657C8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="1081" y="323" width="527" height="338" rx="26" fill="#FFFDFC" stroke="#F28B00" stroke-width="2"/><text x="1344" y="365.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#F28B00" text-anchor="middle">synthetic training candidate</text><clipPath id="crop-synthetic-candidate-1112-400-0-0"><rect x="1112" y="400" width="238" height="180" rx="17"/></clipPath><g clip-path="url(#crop-synthetic-candidate-1112-400-0-0)"><svg x="1112" y="400" width="238" height="180" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid slice"><image href="../ad-ae/ad-ae-metal-plate-anchor_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="1112" y="400" width="238" height="180" rx="17" fill="none" stroke="#F28B00" stroke-width="2"/><rect x="1223" y="495" width="69" height="42" rx="13" fill="#F28B00" fill-opacity="0.10" stroke="#F28B00" stroke-width="4" stroke-dasharray="10 8"/><text x="1257.5" y="482.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F28B00" text-anchor="middle"></text><path d="M1224 520 C1251.72 501.52, 1281.42 531.88, 1311.78 511.42" fill="none" stroke="#D94B62" stroke-width="5.28" stroke-linecap="round" opacity="0.94"/><text x="1231" y="608.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F28B00" text-anchor="middle">illustrated synthetic image</text><rect x="1381" y="400" width="192" height="180" rx="17" fill="#FFF7EB" stroke="#F28B00" stroke-width="2"/><text x="1477" y="440.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#F28B00" text-anchor="middle">bundle</text><text x="1477" y="480.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#123265" text-anchor="middle">planned region</text><text x="1477" y="515.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#123265" text-anchor="middle">seed + recipe</text><text x="1477" y="550.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#123265" text-anchor="middle">provenance ID</text><text x="1344" y="635.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D94B62" text-anchor="middle">not captured physics / severity / ground truth</text><rect x="62" y="714" width="1546" height="93" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="92" y="751.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#123265" text-anchor="start">生成 asset 與 planned region 只能表示「依這個 recipe 得到的 synthetic candidate」；quality filter 也只是 experiment policy，不會把它變成真實 defect label。</text><text x="92" y="785.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="700" fill="#536989" text-anchor="start">保留所有 seeds、outputs、failure gallery 和 provenance，避免只挑一張好看的圖、遺漏相反結果，或讓 synthetic style 滲入 real evidence。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">TF-IDG 的輸出是可追溯 synthetic asset；它不證明 defect presence、外觀物理、sensor response 或 inspection performance。</text></svg>