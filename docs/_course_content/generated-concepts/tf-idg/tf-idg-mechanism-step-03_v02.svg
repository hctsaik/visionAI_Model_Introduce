<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">固定 sampling 留 provenance</title><desc id="desc">每個合成影像都綁定取樣器、步數、guidance、種子和解析度的來源清單。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="synthetic_provenance" data-renderer-art="image_text_or_diffusion" data-primitive="synthetic_provenance" data-semantic-scene="synthetic_provenance" data-semantic-entities="seed_and_condition|generated_output|provenance_record" data-specialist-coverage="seed_and_condition|generated_output|provenance_record" data-semantic-relation="retain synthetic provenance" data-must-show="scheduler、steps、guidance、seed、resolution、candidate count 與每張 SYNTHETIC output 綁成 manifest | 「固定 sampling 留 provenance」需以專屬物件與箭頭表達，不得使用通用 family motif。 | 邊界提示：可重播並不等於物理正確。" data-not-claim="可重播並不等於物理正確。"><title>固定 sampling 留 provenance</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="178.27999999999997" y1="132.44" x2="326.12" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="393.88" y1="132.44" x2="535.56" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="seed_and_condition" data-entity-label-full="seed/cond."><path d="M144.39999999999998 108.3664367816092L165.6413793103448 121.11126436781609L165.6413793103448 143.7687356321839L144.39999999999998