<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">TF-IDG frozen base and declared guidance</title><desc id="desc">Normal AOI, text, reference feature, and planned-region policy guide a named frozen diffusion base. Training-free means no adaptation weights are fitted this run, not that the conditions or model no longer matter.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0C9B91" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C9B91"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-149A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#149A63"/></marker><marker id="arrow-536989" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536989"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#09224C"/><text x="42" y="98.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#09224C" text-anchor="start">第一步：training-free 不讓條件失效；frozen base 仍由 guidance 驅動</text><text x="42" y="145.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#536989" text-anchor="start">normal AOI、text、reference feature 與 planned region 一起引導 named frozen diffusion checkpoint 的 denoising trajectory；每個版本與條件都要被釘選。</text><rect x="1336" y="32" width="292" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1482" y="65.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">TF-IDG · synthetic augmentation</text><g data-entity="tfidg_mobile_frozen_causal_flow"><rect x="32" y="177" width="604" height="110" rx="18" fill="#F7F3FF" stroke="#7657C8" stroke-width="2"/><text x="46" y="221.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#7657C8" text-anchor="start">normal AOI + text / feature / region</text><text x="46" y="261.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#123265" text-anchor="start">→ frozen base → guided denoising</text></g><clipPath id="crop-frozen-raw-62-347-0-0"><rect x="62" y="347" width="366" height="276" rx="22"/></clipPath><g clip-path="url(#crop-frozen-raw-62-347-0-0)"><svg x="62" y="347" width="366" height="276" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid slice"><image href="../ad-ae/ad-ae-metal-plate-anchor_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="62" y="347" width="366" height="276" rx="22" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="255" y="507" width="92" height="60" rx="13" fill="#F28B00" fill-opacity="0.10" stroke="#F28B00" stroke-width="4" stroke-dasharray="10 8"/><text x="301.0" y="494.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F28B00" text-anchor="middle">region</text><text x="245" y="327.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#123265" text-anchor="middle">same normal AOI</text><path d="M454 485 L523 485" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="550" y="326" width="322" height="324" rx="24" fill="#FFFFFF" stroke="#0C9B91" stroke-width="2"/><text x="711" y="368.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#0C9B91" text-anchor="middle">declared guidance</text><rect x="585" y="416" width="252" height="46" rx="15" fill="#FFF7EB" stroke="#F28B00" stroke-width="2"/><text x="711.0" y="446.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#F28B00" text-anchor="middle">text prompt + negative</text><rect x="585" y="479" width="252" height="46" rx="15" fill="#E9FBFF" stroke="#00A8C6" stroke-width="2"/><text x="711.0" y="509.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#00A8C6" text-anchor="middle">reference feature</text><rect x="585" y="542" width="252" height="46" rx="15" fill="#EFFBF4" stroke="#0C9B91" stroke-width="2"/><text x="711.0" y="572.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#0C9B91" text-anchor="middle">region / mask policy</text><text x="711" y="620.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="750" fill="#536989" text-anchor="middle">all conditions are versioned</text><path d="M899 485 L966 485" fill="none" stroke="#0C9B91" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-0C9B91)"/><rect x="993" y="310" width="292" height="355" rx="26" fill="#F7F3FF" stroke="#7657C8" stroke-width="3"/><text x="1139" y="345.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#7657C8" text-anchor="middle">named frozen</text><text x="1139" y="373.6" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#7657C8" text-anchor="middle">diffusion base</text><text x="1139" y="406.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#123265" text-anchor="middle">checkpoint + tokenizer</text><text x="1139" y="440.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#123265" text-anchor="middle">license + hash + code</text><rect x="1036" y="491" width="206" height="57" rx="16" fill="#FFF0F1" stroke="#D94B62" stroke-width="2"/><text x="1139" y="527.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="middle">no weights fitted this run</text><text x="1139" y="607.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D94B62" text-anchor="middle">frozen ≠ domain aligned</text><path d="M1312 485 L1376 485" fill="none" stroke="#7657C8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="1403" y="326" width="205" height="324" rx="24" fill="#FFFFFF" stroke="#F28B00" stroke-width="2"/><text x="1505" y="369.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#F28B00" text-anchor="middle">guided denoising</text><circle cx="1464" cy="430" r="24" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><circle cx="1464" cy="430" r="17" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><circle cx="1464" cy="430" r="13" fill="#F28B00" fill-opacity="0.28"/><text x="1511" y="437.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#123265" text-anchor="start">zT</text><circle cx="1464" cy="492" r="24" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><circle cx="1464" cy="492" r="17" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><circle cx="1464" cy="492" r="13" fill="#F28B00" fill-opacity="0.52"/><text x="1511" y="499.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#123265" text-anchor="start">…</text><circle cx="1464" cy="554" r="24" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><circle cx="1464" cy="554" r="17" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><circle cx="1464" cy="554" r="13" fill="#F28B00" fill-opacity="0.84"/><text x="1511" y="561.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#123265" text-anchor="start">z0</text><rect x="62" y="715" width="1546" height="92" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="92" y="751.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#123265" text-anchor="start">training-free 不消除 prompt bias、feature / region policy、checkpoint、tokenizer、seed、scheduler、steps、guidance、resolution 或 license 的影響。</text><text x="92" y="785.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="700" fill="#536989" text-anchor="start">它只說這次 run 不做 adaptation fine-tuning；不是不需版本控制、不是自動便宜，也不是對工業外觀的真實保證。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">TF-IDG 的核心是 frozen base 下的 condition-guided sampling；所有 guidance 都是生成條件，不是 defect truth。</text></svg>