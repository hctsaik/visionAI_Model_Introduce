<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">TF-IDG counterfactual and no-go boundary</title><desc id="desc">Selected attractive samples, changed conditions, or split leakage invalidate claims. Preserve all conditions and seeds, failure review, real split, and the no-go decision; otherwise HOLD.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0C9B91" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C9B91"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-149A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#149A63"/></marker><marker id="arrow-536989" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536989"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#09224C"/><text x="42" y="98.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#09224C" text-anchor="start">最後只改一件事：漂亮 sample、條件漂移或資料洩漏，都不能變成效益結論</text><text x="42" y="145.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#536989" text-anchor="start">同一 normal AOI 的生成圖需要看全量 seed / condition / provenance；real holdout 必須與 synthetic generation 路徑保持可稽核的隔離。</text><rect x="1336" y="32" width="292" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1482" y="65.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">TF-IDG · synthetic augmentation</text><g data-entity="tfidg_mobile_boundary_causal_flow"><rect x="32" y="177" width="604" height="146" rx="18" fill="#FFF7EB" stroke="#F28B00" stroke-width="2"/><text x="46" y="218.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#F28B00" text-anchor="start">aesthetics / changed condition / leakage</text><text x="46" y="259.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#D94B62" text-anchor="start">is not real-holdout evidence</text><text x="46" y="300.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#123265" text-anchor="start">all seeds + provenance + no-go → HOLD</text></g><path d="M642 300 L680 340" fill="none" stroke="#F28B00" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><rect x="62" y="348" width="460" height="360" rx="24" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><clipPath id="crop-boundary-0-80-385-0-0"><rect x="80" y="385" width="424" height="220" rx="18"/></clipPath><g clip-path="url(#crop-boundary-0-80-385-0-0)"><svg x="80" y="385" width="424" height="220" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid slice"><image href="../ad-ae/ad-ae-metal-plate-anchor_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="80" y="385" width="424" height="220" rx="18" fill="none" stroke="#1769E0" stroke-width="2"/><text x="292" y="374.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#1769E0" text-anchor="middle">A · selected pretty seed</text><path d="M300 504 C332.76 482.16, 367.86 518.04, 403.74 493.86" fill="none" stroke="#F28B00" stroke-width="6.24" stroke-linecap="round" opacity="0.94"/><text x="292" y="574.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">one image cannot select the winner</text><rect x="90" y="632" width="404" height="45" rx="14" fill="#FFF0F1" stroke="#D94B62" stroke-width="2"/><text x="292" y="662.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="middle">aesthetics ≠ downstream benefit</text><rect x="575" y="348" width="460" height="360" rx="24" fill="#FFFFFF" stroke="#F28B00" stroke-width="2"/><clipPath id="crop-boundary-1-593-385-0-0"><rect x="593" y="385" width="424" height="220" rx="18"/></clipPath><g clip-path="url(#crop-boundary-1-593-385-0-0)"><svg x="593" y="385" width="424" height="220" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid slice"><image href="../ad-ae/ad-ae-metal-plate-anchor_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="593" y="385" width="424" height="220" rx="18" fill="none" stroke="#F28B00" stroke-width="2"/><text x="805" y="374.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#F28B00" text-anchor="middle">B · prompt / region drift</text><rect x="783" y="448" width="116" height="68" rx="13" fill="#F28B00" fill-opacity="0.10" stroke="#F28B00" stroke-width="4" stroke-dasharray="10 8"/><text x="841.0" y="435.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F28B00" text-anchor="middle">old region</text><rect x="877" y="508" width="92" height="52" rx="13" fill="#F28B00" fill-opacity="0.10" stroke="#F28B00" stroke-width="4" stroke-dasharray="10 8"/><text x="923.0" y="495.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F28B00" text-anchor="middle">changed</text><text x="805" y="584.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">prompt / mask / feature changed</text><rect x="603" y="632" width="404" height="45" rx="14" fill="#FFF0F1" stroke="#D94B62" stroke-width="2"/><text x="805" y="662.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="middle">changed condition → requalify</text><rect x="1088" y="348" width="460" height="360" rx="24" fill="#FFFFFF" stroke="#D94B62" stroke-width="2"/><clipPath id="crop-boundary-2-1106-385-0-0"><rect x="1106" y="385" width="424" height="220" rx="18"/></clipPath><g clip-path="url(#crop-boundary-2-1106-385-0-0)"><svg x="1106" y="385" width="424" height="220" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid slice"><image href="../ad-ae/ad-ae-metal-plate-anchor_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="1106" y="385" width="424" height="220" rx="18" fill="none" stroke="#D94B62" stroke-width="2"/><text x="1318" y="374.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#D94B62" text-anchor="middle">C · source / holdout leakage</text><path d="M1192 476 C1293 420, 1374 567, 1452 470" fill="none" stroke="#D94B62" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 10" marker-end="url(#arrow-D94B62)"/><text x="1318" y="550.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">generated style crosses split</text><text x="1318" y="580.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">real-holdout comparison invalid</text><rect x="1116" y="632" width="404" height="45" rx="14" fill="#FFF0F1" stroke="#D94B62" stroke-width="2"/><text x="1318" y="662.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="middle">invalid experiment → HOLD</text><rect x="62" y="738" width="1546" height="75" rx="20" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="92" y="773" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#123265" text-anchor="start">required trace：normal source / ROI / split hash · base checkpoint / license / code · prompt / feature / region conditions · scheduler / steps / guidance / all seeds</text><text x="92" y="797" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#123265" text-anchor="start">synthetic manifest + quality / failure review · downstream recipe · stratified real metrics · GPU / P95 / cost · domain-owner no-go decision。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">TF-IDG 可用於 bounded augmentation POC；來源、條件、split、review、license 或 no-go 缺失時，正確答案永遠是 HOLD。</text></svg>