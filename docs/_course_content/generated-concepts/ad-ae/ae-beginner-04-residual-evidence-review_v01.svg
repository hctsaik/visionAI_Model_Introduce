<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Autoencoder (AE)：target reconstruction 到 residual candidate review</title><desc id="desc">raw target 和 reconstruction 依固定 residual recipe 形成 candidate map 和 image candidate score；兩者皆不是 native defect mask、defect probability 或 PASS。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9485F"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#0A2A5B"/><rect x="40" y="30" width="196" height="44" rx="22" fill="#EAF4FF" stroke="#1769E0" stroke-width="2"/><text x="138" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="middle">residual evidence</text><rect x="1320" y="30" width="312" height="44" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1476" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">Autoencoder (AE)</text><text x="40" y="123.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="39" font-weight="900" fill="#081A38" text-anchor="start">把 target 與 reconstruction 的差異，轉成可追溯的 candidate—not a final defect truth</text><text x="40" y="166.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#536A91" text-anchor="start">同一筆 test ROI 要保留 raw input、x̂／F̂、residual recipe、候選圖、整圖分數與 review evidence。</text><g data-entity="ae_metal_plate_aoi"><clipPath id="crop-evidence-56-245"><rect x="56" y="245" width="315" height="392" rx="24"/></clipPath><g clip-path="url(#crop-evidence-56-245)"><image href="ae-industrial-metal-plate-anchor_v02.png" x="56" y="245" width="315" height="392" preserveAspectRatio="xMidYMid slice"/></g><rect x="56" y="245" width="315" height="392" rx="24" fill="none" stroke="#1769E0" stroke-width="3"/><rect x="267.05" y="488.03999999999996" width="50.4" height="70.56" rx="9" fill="none" stroke="#F38B00" stroke-width="4"/><text x="292.25" y="476.03999999999996" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">細線訊號</text><text x="213.5" y="669.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#081A38" text-anchor="middle">1 · raw test ROI x</text></g><path d="M394 424 L456 424" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><g data-entity="ae_reconstruction_not_ground_truth"><rect x="478" y="292" width="300" height="244" rx="24" fill="#EEF7FF" stroke="#00A8C6" stroke-width="3"/><text x="628.0" y="332.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#081A38" text-anchor="middle">reconstruction x̂ / F̂</text><text x="628.0" y="358.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#D9485F" text-anchor="middle">模型輸出，不是已檢驗的正常真值</text><rect x="520" y="374" width="216" height="120" rx="15" fill="#C8D5E4" stroke="#8EAECE" stroke-width="2"/><rect x="530.0" y="381.0" width="31.333333333333332" height="50.0" rx="5" fill="#B7C9DC" stroke="none" stroke-width="0"/><rect x="562.6666666666666" y="381.0" width="31.333333333333332" height="50.0" rx="5" fill="#DDE8F4" stroke="none" stroke-width="0"/><rect x="595.3333333333334" y="381.0" width="31.333333333333332" height="50.0" rx="5" fill="#B7C9DC" stroke="none" stroke-width="0"/><rect x="628.0" y="381.0" width="31.333333333333332" height="50.0" rx="5" fill="#DDE8F4" stroke="none" stroke-width="0"/><rect x="660.6666666666666" y="381.0" width="31.333333333333332" height="50.0" rx="5" fill="#B7C9DC" stroke="none" stroke-width="0"/><rect x="693.3333333333334" y="381.0" width="31.333333333333332" height="50.0" rx="5" fill="#DDE8F4" stroke="none" stroke-width="0"/><rect x="530.0" y="434.0" width="31.333333333333332" height="50.0" rx="5" fill="#DDE8F4" stroke="none" stroke-width="0"/><rect x="562.6666666666666" y="434.0" width="31.333333333333332" height="50.0" rx="5" fill="#B7C9DC" stroke="none" stroke-width="0"/><rect x="595.3333333333334" y="434.0" width="31.333333333333332" height="50.0" rx="5" fill="#DDE8F4" stroke="none" stroke-width="0"/><rect x="628.0" y="434.0" width="31.333333333333332" height="50.0" rx="5" fill="#B7C9DC" stroke="none" stroke-width="0"/><rect x="660.6666666666666" y="434.0" width="31.333333333333332" height="50.0" rx="5" fill="#DDE8F4" stroke="none" stroke-width="0"/><rect x="693.3333333333334" y="434.0" width="31.333333333333332" height="50.0" rx="5" fill="#B7C9DC" stroke="none" stroke-width="0"/><text x="628.0" y="521.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#00A8C6" text-anchor="middle">declared image / feature target</text></g><path d="M800 424 L861 424" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><g data-entity="ae_residual_candidate_evidence"><rect x="884" y="264" width="302" height="326" rx="24" fill="#FFFFFF" stroke="#F38B00" stroke-width="3"/><text x="1035.0" y="301.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#081A38" text-anchor="middle">residual evidence</text><text x="1035.0" y="325.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#F38B00" text-anchor="middle">| target − reconstruction |</text><rect x="921.0" y="355.0" width="33.0" height="43.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="960.0" y="355.0" width="33.0" height="43.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="999.0" y="355.0" width="33.0" height="43.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="1038.0" y="355.0" width="33.0" height="43.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="1077.0" y="355.0" width="33.0" height="43.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="1116.0" y="355.0" width="33.0" height="43.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="921.0" y="404.0" width="33.0" height="43.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="960.0" y="404.0" width="33.0" height="43.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="999.0" y="404.0" width="33.0" height="43.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="1038.0" y="404.0" width="33.0" height="43.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="1077.0" y="404.0" width="33.0" height="43.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="1116.0" y="404.0" width="33.0" height="43.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="921.0" y="453.0" width="33.0" height="43.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="960.0" y="453.0" width="33.0" height="43.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="999.0" y="453.0" width="33.0" height="43.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="1038.0" y="453.0" width="33.0" height="43.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="1077.0" y="453.0" width="33.0" height="43.0" rx="6" fill="#F38B00" fill-opacity="0.62" stroke="#F38B00" stroke-width="1.5"/><rect x="1116.0" y="453.0" width="33.0" height="43.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="921.0" y="502.0" width="33.0" height="43.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="960.0" y="502.0" width="33.0" height="43.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="999.0" y="502.0" width="33.0" height="43.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="1038.0" y="502.0" width="33.0" height="43.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="1077.0" y="502.0" width="33.0" height="43.0" rx="6" fill="#F38B00" fill-opacity="0.62" stroke="#F38B00" stroke-width="1.5"/><rect x="1116.0" y="502.0" width="33.0" height="43.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><text x="1035.0" y="575.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D9485F" text-anchor="middle">candidate map ≠ defect mask</text></g><path d="M1208 424 L1269 424" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><g data-entity="ae_candidate_review_gate"><rect x="1292" y="328" width="300" height="190" rx="24" fill="#FFF9EC" stroke="#F38B00" stroke-width="3"/><circle cx="1340" cy="423.0" r="24" fill="#F38B00"/><text x="1340" y="430.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#FFFFFF" text-anchor="middle">?</text><text x="1468.0" y="373.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#081A38" text-anchor="middle">candidate</text><text x="1468.0" y="397.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#081A38" text-anchor="middle">↓ raw ROI review</text><text x="1468.0" y="433.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#536A91" text-anchor="middle">recipe · threshold · owner</text><text x="1468.0" y="458.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D9485F" text-anchor="middle">not PASS / FAIL</text></g><text x="136" y="688.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#1769E0" text-anchor="middle">同一 AOI</text><text x="628" y="588.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#00A8C6" text-anchor="middle">2 · declared reconstruction</text><text x="1034" y="627.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#F38B00" text-anchor="middle">3 · residual candidate</text><text x="1442" y="550.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#F38B00" text-anchor="middle">4 · evidence gate</text><rect x="55" y="720" width="1535" height="95" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="87" y="756.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#081A38" text-anchor="start">哪一些東西會改候選？</text><circle cx="355" cy="748" r="11" fill="#1769E0"/><text x="378" y="755.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#081A38" text-anchor="start">resize / align</text><circle cx="630" cy="748" r="11" fill="#00A8C6"/><text x="653" y="755.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#081A38" text-anchor="start">mask / smooth</text><circle cx="905" cy="748" r="11" fill="#F38B00"/><text x="928" y="755.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#081A38" text-anchor="start">aggregation</text><circle cx="1180" cy="748" r="11" fill="#149A62"/><text x="1203" y="755.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#081A38" text-anchor="start">threshold / owner</text><text x="825" y="793.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#D9485F" text-anchor="middle">candidate map ≠ native-pixel mask；candidate score ≠ defect probability；兩者都不能直接變成 PASS。</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF5D4" stroke="#E4AA1D" stroke-width="2"/><circle cx="79" cy="875" r="12" fill="#FFE295" stroke="#C98700" stroke-width="2"/><text x="79" y="882.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#805300" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#654600" text-anchor="start">residual 的可用性來自完整 evidence chain；回到 raw ROI review，才能分辨產品訊號、取像變化與模型失配。</text></svg>