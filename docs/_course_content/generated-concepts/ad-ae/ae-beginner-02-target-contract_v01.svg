<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Autoencoder (AE)：宣告 image x 或 feature F target 的 reconstruction contract</title><desc id="desc">同一 raw AOI 的 Autoencoder 必須先宣告 target 是 raw image x 或指定 feature F，並連同 ROI、normalization、support IDs 和 residual definition 版本化；feature-AE 不等於 RD4AD。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9485F"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#0A2A5B"/><rect x="40" y="30" width="196" height="44" rx="22" fill="#EAF4FF" stroke="#1769E0" stroke-width="2"/><text x="138" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="middle">target 契約</text><rect x="1320" y="30" width="312" height="44" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1476" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">Autoencoder (AE)</text><text x="40" y="123.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="39" font-weight="900" fill="#081A38" text-anchor="start">先宣告它要重建什麼：image x，或指定的 feature F</text><text x="40" y="166.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#536A91" text-anchor="start">同一張 raw ROI 可以餵給不同 AE；但 target、recipe 與 residual 定義一變，就是不同的 normality state。</text><g data-entity="ae_metal_plate_aoi"><clipPath id="crop-target-60-242"><rect x="60" y="242" width="346" height="420" rx="24"/></clipPath><g clip-path="url(#crop-target-60-242)"><image href="ae-industrial-metal-plate-anchor_v02.png" x="60" y="242" width="346" height="420" preserveAspectRatio="xMidYMid slice"/></g><rect x="60" y="242" width="346" height="420" rx="24" fill="none" stroke="#1769E0" stroke-width="3"/><rect x="291.82000000000005" y="502.4" width="55.36" height="75.6" rx="9" fill="none" stroke="#F38B00" stroke-width="4"/><text x="319.50000000000006" y="490.4" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">細線訊號</text><text x="233.0" y="694.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#081A38" text-anchor="middle">same fixed raw ROI</text></g><path d="M431 445 L505 445" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="530" y="260" width="340" height="374" rx="27" fill="#FFFFFF" stroke="#1769E0" stroke-width="3"/><text x="700" y="309.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#081A38" text-anchor="middle">先鎖 target contract</text><circle cx="584" cy="363" r="11" fill="#1769E0"/><text x="611" y="370.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#081A38" text-anchor="start">ROI / registration</text><circle cx="584" cy="418" r="11" fill="#00A8C6"/><text x="611" y="425.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#081A38" text-anchor="start">resize / normalize</text><circle cx="584" cy="473" r="11" fill="#F38B00"/><text x="611" y="480.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#081A38" text-anchor="start">target = x 或 F</text><circle cx="584" cy="528" r="11" fill="#149A62"/><text x="611" y="535.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="800" fill="#081A38" text-anchor="start">support IDs / version</text><text x="700" y="600.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D9485F" text-anchor="middle">不是先看 heatmap 再補定義</text><path d="M895 378 L962 378" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><path d="M895 518 L962 518" fill="none" stroke="#00A8C6" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><rect x="985" y="244" width="605" height="238" rx="26" fill="#EAF4FF" stroke="#1769E0" stroke-width="3"/><text x="1017" y="292.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#1769E0" text-anchor="start">image-AE</text><text x="1017" y="326.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#081A38" text-anchor="start">target: x</text><path d="M1132 317 L1215 317" fill="none" stroke="#1769E0" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><g data-entity="ae_reconstruction_not_ground_truth"><rect x="1236" y="270" width="306" height="162" rx="24" fill="#EEF7FF" stroke="#00A8C6" stroke-width="3"/><text x="1389.0" y="310.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#081A38" text-anchor="middle">reconstruction x̂</text><text x="1389.0" y="336.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#D9485F" text-anchor="middle">模型輸出，不是已檢驗的正常真值</text><rect x="1278" y="352" width="222" height="38" rx="15" fill="#C8D5E4" stroke="#8EAECE" stroke-width="2"/><rect x="1288.0" y="359.0" width="32.333333333333336" height="9.0" rx="5" fill="#B7C9DC" stroke="none" stroke-width="0"/><rect x="1321.6666666666667" y="359.0" width="32.333333333333336" height="9.0" rx="5" fill="#DDE8F4" stroke="none" stroke-width="0"/><rect x="1355.3333333333333" y="359.0" width="32.333333333333336" height="9.0" rx="5" fill="#B7C9DC" stroke="none" stroke-width="0"/><rect x="1389.0" y="359.0" width="32.333333333333336" height="9.0" rx="5" fill="#DDE8F4" stroke="none" stroke-width="0"/><rect x="1422.6666666666667" y="359.0" width="32.333333333333336" height="9.0" rx="5" fill="#B7C9DC" stroke="none" stroke-width="0"/><rect x="1456.3333333333333" y="359.0" width="32.333333333333336" height="9.0" rx="5" fill="#DDE8F4" stroke="none" stroke-width="0"/><rect x="1288.0" y="371.0" width="32.333333333333336" height="9.0" rx="5" fill="#DDE8F4" stroke="none" stroke-width="0"/><rect x="1321.6666666666667" y="371.0" width="32.333333333333336" height="9.0" rx="5" fill="#B7C9DC" stroke="none" stroke-width="0"/><rect x="1355.3333333333333" y="371.0" width="32.333333333333336" height="9.0" rx="5" fill="#DDE8F4" stroke="none" stroke-width="0"/><rect x="1389.0" y="371.0" width="32.333333333333336" height="9.0" rx="5" fill="#B7C9DC" stroke="none" stroke-width="0"/><rect x="1422.6666666666667" y="371.0" width="32.333333333333336" height="9.0" rx="5" fill="#DDE8F4" stroke="none" stroke-width="0"/><rect x="1456.3333333333333" y="371.0" width="32.333333333333336" height="9.0" rx="5" fill="#B7C9DC" stroke="none" stroke-width="0"/><text x="1389.0" y="417.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#00A8C6" text-anchor="middle">declared image / feature target</text></g><text x="1017" y="437.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#536A91" text-anchor="start">residual: |x − x̂|（版本化 recipe）</text><rect x="985" y="506" width="605" height="238" rx="26" fill="#E7FBFE" stroke="#00A8C6" stroke-width="3"/><text x="1017" y="554.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#00A8C6" text-anchor="start">feature-AE</text><text x="1017" y="588.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#081A38" text-anchor="start">target: declared F → reconstruction: F̂</text><rect x="1245" y="617" width="31" height="20" rx="5" fill="#CBEDEA" stroke="#00A8C6" stroke-width="1.5"/><rect x="1286" y="617" width="31" height="20" rx="5" fill="#CBEDEA" stroke="#00A8C6" stroke-width="1.5"/><rect x="1327" y="617" width="31" height="20" rx="5" fill="#CBEDEA" stroke="#00A8C6" stroke-width="1.5"/><rect x="1368" y="617" width="31" height="20" rx="5" fill="#CBEDEA" stroke="#00A8C6" stroke-width="1.5"/><rect x="1409" y="617" width="31" height="20" rx="5" fill="#CBEDEA" stroke="#00A8C6" stroke-width="1.5"/><rect x="1450" y="617" width="31" height="20" rx="5" fill="#CBEDEA" stroke="#00A8C6" stroke-width="1.5"/><rect x="1245" y="646" width="31" height="20" rx="5" fill="#CBEDEA" stroke="#00A8C6" stroke-width="1.5"/><rect x="1286" y="646" width="31" height="20" rx="5" fill="#CBEDEA" stroke="#00A8C6" stroke-width="1.5"/><rect x="1327" y="646" width="31" height="20" rx="5" fill="#CBEDEA" stroke="#00A8C6" stroke-width="1.5"/><rect x="1368" y="646" width="31" height="20" rx="5" fill="#CBEDEA" stroke="#00A8C6" stroke-width="1.5"/><rect x="1409" y="646" width="31" height="20" rx="5" fill="#F38B00" fill-opacity="0.5" stroke="#00A8C6" stroke-width="1.5"/><rect x="1450" y="646" width="31" height="20" rx="5" fill="#CBEDEA" stroke="#00A8C6" stroke-width="1.5"/><rect x="1245" y="675" width="31" height="20" rx="5" fill="#CBEDEA" stroke="#00A8C6" stroke-width="1.5"/><rect x="1286" y="675" width="31" height="20" rx="5" fill="#CBEDEA" stroke="#00A8C6" stroke-width="1.5"/><rect x="1327" y="675" width="31" height="20" rx="5" fill="#CBEDEA" stroke="#00A8C6" stroke-width="1.5"/><rect x="1368" y="675" width="31" height="20" rx="5" fill="#CBEDEA" stroke="#00A8C6" stroke-width="1.5"/><rect x="1409" y="675" width="31" height="20" rx="5" fill="#CBEDEA" stroke="#00A8C6" stroke-width="1.5"/><rect x="1450" y="675" width="31" height="20" rx="5" fill="#CBEDEA" stroke="#00A8C6" stroke-width="1.5"/><text x="1390" y="723.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#536A91" text-anchor="middle">residual: distance(F, F̂)</text><rect x="60" y="750" width="1530" height="64" rx="20" fill="#FFF1F3" stroke="#D9485F" stroke-width="2"/><text x="825" y="789.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="850" fill="#D9485F" text-anchor="middle">不要把 feature-AE 自動說成 RD4AD：AE 的 target、encoder、loss 與 reconstruction path 必須各自明示。</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF5D4" stroke="#E4AA1D" stroke-width="2"/><circle cx="79" cy="875" r="12" fill="#FFE295" stroke="#C98700" stroke-width="2"/><text x="79" y="882.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#805300" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#654600" text-anchor="start">先選可回放的 target，再談 residual；混用 image 與 feature 的名詞，會讓比較、閾值與 review evidence 都失去意義。</text></svg>