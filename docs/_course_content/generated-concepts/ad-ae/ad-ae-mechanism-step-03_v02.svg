<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">量目標與重建差</title><desc id="desc">觀測目標與重建目標相減後形成局部 residual map，差異規則必須被明確命名。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="reconstruction_residual_ae_target_difference" data-renderer-art="anomaly" data-primitive="reconstruction_residual" data-semantic-scene="reconstruction_residual" data-semantic-entities="input|bottleneck|reconstruction|residual" data-specialist-coverage="input|bottleneck|reconstruction|residual" data-semantic-relation="turn reconstruction mismatch into a candidate" data-must-show="觀測 target 與 reconstruction 並排 | 兩者相減的差值符號 | 局部亮起的 residual map | L1、L2、SSIM 或 feature loss 必須命名的標籤" data-not-claim="亮的 residual 就是校正後的 defect probability。"><title>量目標與重建差</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="147.48" y1="132.44" x2="246.03999999999996" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="313.79999999999995" y1="132.44" x2="412.36" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="480.12" y1="132.44" x2="572.52" y2="132.44" stroke="#F38B00" stroke-width="4" marker-end="url(#arrow-orange)"/><g data-entity="input" data-entity-label-full="輸入"><path d="M113.6 114.3848275862069L129.53103448275863 123.94344827586207L129.53103448275863 140.