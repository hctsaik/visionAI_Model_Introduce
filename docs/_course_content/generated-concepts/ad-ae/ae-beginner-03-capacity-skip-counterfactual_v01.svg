<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Autoencoder (AE)：bottleneck、skip 與 over-reconstruction 的反事實</title><desc id="desc">同一金屬板與細線訊號在不同 capacity 和 skip governance 下，可能造成正常誤亮或陌生訊號也被重建；需要隔離 holdout qualification 而非僅看 training loss。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9485F"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#0A2A5B"/><rect x="40" y="30" width="196" height="44" rx="22" fill="#EAF4FF" stroke="#1769E0" stroke-width="2"/><text x="138" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="middle">capacity 反事實</text><rect x="1320" y="30" width="312" height="44" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1476" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">Autoencoder (AE)</text><text x="40" y="123.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="39" font-weight="900" fill="#081A38" text-anchor="start">bottleneck／skip 不是越強越好：太窄誤亮正常，太寬可能連陌生訊號也重建</text><text x="40" y="166.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#536A91" text-anchor="start">三種路徑都看同一金屬板與同一細線訊號；差別只在 normal-only reconstruction path 的容量與 bypass。</text><g data-entity="ae_metal_plate_aoi"><clipPath id="crop-capacity-55-239"><rect x="55" y="239" width="320" height="370" rx="24"/></clipPath><g clip-path="url(#crop-capacity-55-239)"><image href="ae-industrial-metal-plate-anchor_v02.png" x="55" y="239" width="320" height="370" preserveAspectRatio="xMidYMid slice"/></g><rect x="55" y="239" width="320" height="370" rx="24" fill="none" stroke="#1769E0" stroke-width="3"/><rect x="269.4" y="468.4" width="51.2" height="66.6" rx="9" fill="none" stroke="#F38B00" stroke-width="4"/><text x="295.0" y="456.4" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">細線訊號</text><text x="215.0" y="641.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#081A38" text-anchor="middle">same test ROI</text></g><path d="M400 421 L463 421" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="485" y="327" width="176" height="176" rx="25" fill="#EAF4FF" stroke="#1769E0" stroke-width="3"/><text x="573.0" y="371.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#081A38" text-anchor="middle">encoder</text><rect x="519" y="392" width="108" height="62" rx="16" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><rect x="540" y="418" width="25" height="20" rx="7" fill="#1769E0"/><rect x="582" y="406" width="25" height="32" rx="7" fill="#1769E0"/><rect x="624" y="395" width="25" height="43" rx="7" fill="#1769E0"/><rect x="666" y="409" width="25" height="29" rx="7" fill="#1769E0"/><text x="573.0" y="482.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#536A91" text-anchor="middle">same checkpoint</text><path d="M680 414 L724 414" fill="none" stroke="#00A8C6" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><rect x="742" y="327" width="164" height="176" rx="25" fill="#E7FBFE" stroke="#00A8C6" stroke-width="3"/><path d="M784 377 L864 377 L824 455 L824 455Z" fill="#FFFFFF" stroke="#00A8C6" stroke-width="3"/><circle cx="824.0" cy="416" r="27" fill="#00A8C6"/><text x="824.0" y="423.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">z</text><text x="824.0" y="481.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#536A91" text-anchor="middle">z + skip policy</text><path d="M925 414 L970 414" fill="none" stroke="#00A8C6" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><rect x="988" y="327" width="176" height="176" rx="25" fill="#E7FBFE" stroke="#00A8C6" stroke-width="3"/><text x="1076.0" y="371.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#081A38" text-anchor="middle">decoder</text><rect x="1022" y="392" width="108" height="62" rx="16" fill="#FFFFFF" stroke="#00A8C6" stroke-width="2"/><rect x="1040" y="405" width="28" height="20" rx="5" fill="#D5E7FF" stroke="#00A8C6" stroke-width="1"/><rect x="1075" y="405" width="28" height="20" rx="5" fill="#00A8C6" fill-opacity="0.55" stroke="#00A8C6" stroke-width="1"/><rect x="1110" y="405" width="28" height="20" rx="5" fill="#D5E7FF" stroke="#00A8C6" stroke-width="1"/><rect x="1145" y="405" width="28" height="20" rx="5" fill="#D5E7FF" stroke="#00A8C6" stroke-width="1"/><rect x="1040" y="432" width="28" height="20" rx="5" fill="#D5E7FF" stroke="#00A8C6" stroke-width="1"/><rect x="1075" y="432" width="28" height="20" rx="5" fill="#D5E7FF" stroke="#00A8C6" stroke-width="1"/><rect x="1110" y="432" width="28" height="20" rx="5" fill="#00A8C6" fill-opacity="0.55" stroke="#00A8C6" stroke-width="1"/><rect x="1145" y="432" width="28" height="20" rx="5" fill="#D5E7FF" stroke="#00A8C6" stroke-width="1"/><text x="1076.0" y="482.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#536A91" text-anchor="middle">same declared target</text><text x="805" y="270.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#F38B00" text-anchor="middle">只改：capacity / skip governance</text><path d="M1189 413 L1251 413" fill="none" stroke="#F38B00" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><rect x="1274" y="275" width="305" height="304" rx="25" fill="#FFF5E5" stroke="#F38B00" stroke-width="3"/><text x="1426" y="322.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#081A38" text-anchor="middle">先做 holdout qualification</text><text x="1426" y="365.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="750" fill="#536A91" text-anchor="middle">不是挑一張最漂亮的</text><text x="1426" y="394.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="750" fill="#536A91" text-anchor="middle">reconstruction</text><g data-entity="ae_residual_candidate_evidence"><rect x="1312" y="425" width="228" height="128" rx="24" fill="#FFFFFF" stroke="#F38B00" stroke-width="3"/><text x="1426.0" y="455.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#081A38" text-anchor="middle">residual evidence</text><text x="1426.0" y="477.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#F38B00" text-anchor="middle">| target − reconstruction |</text><rect x="1349.0" y="492.0" width="20.666666666666668" height="14.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="1375.6666666666667" y="492.0" width="20.666666666666668" height="14.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="1402.3333333333333" y="492.0" width="20.666666666666668" height="14.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="1429.0" y="492.0" width="20.666666666666668" height="14.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="1455.6666666666667" y="492.0" width="20.666666666666668" height="14.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="1482.3333333333333" y="492.0" width="20.666666666666668" height="14.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="1349.0" y="512.0" width="20.666666666666668" height="14.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="1375.6666666666667" y="512.0" width="20.666666666666668" height="14.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="1402.3333333333333" y="512.0" width="20.666666666666668" height="14.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="1429.0" y="512.0" width="20.666666666666668" height="14.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="1455.6666666666667" y="512.0" width="20.666666666666668" height="14.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="1482.3333333333333" y="512.0" width="20.666666666666668" height="14.0" rx="6" fill="#DBE9FA" stroke="#1769E0" stroke-width="1.5"/><text x="1426.0" y="545.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D9485F" text-anchor="middle">candidate map ≠ defect mask</text></g><path d="M91 688 L1580 688" fill="none" stroke="#C7DBF7" stroke-width="5" stroke-linecap="round"/><path d="M364 688 L513 688" fill="none" stroke="#F38B00" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><path d="M858 688 L1008 688" fill="none" stroke="#1769E0" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="60" y="710" width="420" height="100" rx="22" fill="#FFF5E5" stroke="#F38B00" stroke-width="2"/><text x="90" y="747.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#F38B00" text-anchor="start">太窄：正常微紋理也過不去</text><text x="90" y="782.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#536A91" text-anchor="start">正常 residual 變廣 → false HOLD / review load</text><rect x="536" y="710" width="420" height="100" rx="22" fill="#E7FBFE" stroke="#00A8C6" stroke-width="2"/><text x="566" y="747.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#00A8C6" text-anchor="start">經 qualification 的 operating point</text><text x="566" y="782.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#536A91" text-anchor="start">仍只交 candidate；要看 escape、FPR、drift</text><rect x="1012" y="710" width="568" height="100" rx="22" fill="#FFF1F3" stroke="#D9485F" stroke-width="2"/><text x="1042" y="747.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#D9485F" text-anchor="start">太寬／未治理 skip：陌生細節也可能被帶過</text><text x="1042" y="782.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#536A91" text-anchor="start">residual 變淡 ≠ 安全；可能增加 escaped anomaly risk</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF5D4" stroke="#E4AA1D" stroke-width="2"/><circle cx="79" cy="875" r="12" fill="#FFE295" stroke="#C98700" stroke-width="2"/><text x="79" y="882.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#805300" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#654600" text-anchor="start">低 training loss 或看似乾淨的 reconstruction 都不能證明安全；capacity、skip、support 與失敗例要一起在隔離資料上驗證。</text></svg>