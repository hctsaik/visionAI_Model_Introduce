<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">SIFT coverage and capture-drift boundary</title><desc id="desc">Spreading inliers across the ROI differs from many matches concentrated in a repeated corner. Capture drift, weak texture, glare, blur, or tiny ROI require evidence and HOLD rather than a forced transform.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0C9B91" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C9B91"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-149A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#149A63"/></marker><marker id="arrow-536989" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536989"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#09224C"/><text x="42" y="98.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#09224C" text-anchor="start">最後看分布與變化：match 多，不代表整個 ROI 的幾何可用</text><text x="42" y="145.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#536989" text-anchor="start">同一張圖上的 inliers 必須覆蓋需要的區域；capture drift、低紋理、反光、模糊或 tiny ROI 都要留下 raw evidence 並 HOLD。</text><rect x="1362" y="32" width="266" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1495" y="65.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">SIFT · correspondence</text><g data-entity="sift_mobile_boundary_causal_flow"><rect x="32" y="177" width="575" height="146" rx="18" fill="#FFF7EB" stroke="#F28B00" stroke-width="2"/><text x="46" y="218.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="30" font-weight="900" fill="#F28B00" text-anchor="start">coverage / residual / capture contract</text><text x="46" y="259.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="30" font-weight="900" fill="#D94B62" text-anchor="start">changed or insufficient → HOLD</text><text x="46" y="300.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#123265" text-anchor="start">save raw pair + settings + evidence</text></g><path d="M610 297 L648 339" fill="none" stroke="#F28B00" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><rect x="62" y="348" width="460" height="360" rx="24" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><clipPath id="crop-boundary-0-80-385-132-16"><rect x="80" y="385" width="424" height="220" rx="18"/></clipPath><g clip-path="url(#crop-boundary-0-80-385-132-16)"><svg x="80" y="385" width="424" height="220" viewBox="132 16 1390 900" preserveAspectRatio="xMidYMid slice"><image href="../ad-ae/ad-ae-metal-plate-anchor_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="80" y="385" width="424" height="220" rx="18" fill="none" stroke="#1769E0" stroke-width="2"/><text x="292" y="374.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#1769E0" text-anchor="middle">A · inliers spread across ROI</text><circle cx="153" cy="450" r="11" fill="#FFFFFF" stroke="#149A63" stroke-width="4"/><circle cx="153" cy="450" r="3" fill="#149A63" stroke="#149A63" stroke-width="0"/><circle cx="295" cy="498" r="11" fill="#FFFFFF" stroke="#149A63" stroke-width="4"/><circle cx="295" cy="498" r="3" fill="#149A63" stroke="#149A63" stroke-width="0"/><circle cx="422" cy="555" r="11" fill="#FFFFFF" stroke="#149A63" stroke-width="4"/><circle cx="422" cy="555" r="3" fill="#149A63" stroke="#149A63" stroke-width="0"/><circle cx="211" cy="572" r="11" fill="#FFFFFF" stroke="#149A63" stroke-width="4"/><circle cx="211" cy="572" r="3" fill="#149A63" stroke="#149A63" stroke-width="0"/><rect x="90" y="632" width="404" height="45" rx="14" fill="#EFFBF4" stroke="#149A63" stroke-width="2"/><text x="292" y="662.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#149A63" text-anchor="middle">eligible for review</text><rect x="575" y="348" width="460" height="360" rx="24" fill="#FFFFFF" stroke="#F28B00" stroke-width="2"/><clipPath id="crop-boundary-1-593-385-142-16"><rect x="593" y="385" width="424" height="220" rx="18"/></clipPath><g clip-path="url(#crop-boundary-1-593-385-142-16)"><svg x="593" y="385" width="424" height="220" viewBox="142 16 1390 900" preserveAspectRatio="xMidYMid slice"><image href="../ad-ae/ad-ae-metal-plate-anchor_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="593" y="385" width="424" height="220" rx="18" fill="none" stroke="#F28B00" stroke-width="2"/><text x="805" y="374.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#F28B00" text-anchor="middle">B · many lines in one corner</text><circle cx="674" cy="450" r="11" fill="#FFFFFF" stroke="#F28B00" stroke-width="4"/><circle cx="674" cy="450" r="3" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><circle cx="693" cy="468" r="11" fill="#FFFFFF" stroke="#F28B00" stroke-width="4"/><circle cx="693" cy="468" r="3" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><circle cx="713" cy="486" r="11" fill="#FFFFFF" stroke="#F28B00" stroke-width="4"/><circle cx="713" cy="486" r="3" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><circle cx="681" cy="506" r="11" fill="#FFFFFF" stroke="#F28B00" stroke-width="4"/><circle cx="681" cy="506" r="3" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><circle cx="705" cy="524" r="11" fill="#FFFFFF" stroke="#F28B00" stroke-width="4"/><circle cx="705" cy="524" r="3" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><circle cx="729" cy="542" r="11" fill="#FFFFFF" stroke="#F28B00" stroke-width="4"/><circle cx="729" cy="542" r="3" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><rect x="642" y="428" width="122" height="150" rx="14" fill="none" stroke="#F28B00" stroke-width="3"/><rect x="603" y="632" width="404" height="45" rx="14" fill="#FFF0F1" stroke="#D94B62" stroke-width="2"/><text x="805" y="662.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="middle">coverage insufficient → HOLD</text><rect x="1088" y="348" width="460" height="360" rx="24" fill="#FFFFFF" stroke="#D94B62" stroke-width="2"/><clipPath id="crop-boundary-2-1106-385-152-16"><rect x="1106" y="385" width="424" height="220" rx="18"/></clipPath><g clip-path="url(#crop-boundary-2-1106-385-152-16)"><svg x="1106" y="385" width="424" height="220" viewBox="152 16 1390 900" preserveAspectRatio="xMidYMid slice"><image href="../ad-ae/ad-ae-metal-plate-anchor_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="1106" y="385" width="424" height="220" rx="18" fill="none" stroke="#D94B62" stroke-width="2"/><text x="1318" y="374.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#D94B62" text-anchor="middle">C · capture drift / weak texture</text><rect x="1106" y="385" width="424" height="220" rx="18" fill="#FFFFFF" fill-opacity="0.45"/><path d="M1154 578 L1446 416" stroke="#D94B62" stroke-width="13" stroke-linecap="round" opacity="0.76"/><text x="1318" y="512.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#D94B62" text-anchor="middle">glare / blur / tiny ROI</text><rect x="1116" y="632" width="404" height="45" rx="14" fill="#FFF0F1" stroke="#D94B62" stroke-width="2"/><text x="1318" y="662.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="middle">requalify or HOLD</text><rect x="62" y="738" width="1546" height="75" rx="20" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="92" y="773" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#123265" text-anchor="start">最小 evidence bundle：reference/current raw ROI · exposure/focus/product version · keypoint threshold · matcher/ratio/RANSAC model</text><text x="92" y="797" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#123265" text-anchor="start">inlier map · residual P95 · reject pairs。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">SIFT 交付 correspondence / initialization evidence，不交付 defect、最終 registration 或自動 PASS；條件改變或證據不足就 HOLD。</text></svg>