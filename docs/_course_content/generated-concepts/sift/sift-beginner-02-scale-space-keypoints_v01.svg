<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">SIFT scale-space keypoint candidates</title><desc id="desc">The same metal fixture is represented at several image-pyramid scales. DoG extrema provide local candidates; low-contrast and edge-only responses are rejected rather than treated as detections.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0C9B91" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C9B91"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-149A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#149A63"/></marker><marker id="arrow-536989" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536989"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#09224C"/><text x="42" y="98.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#09224C" text-anchor="start">第一步：同一個局部在不同尺度出現，才有機會成為可重複的地標</text><text x="42" y="145.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#536989" text-anchor="start">image pyramid 讓不同成像大小都有候選；DoG extrema 找點後，還要拒絕 contrast 太弱或只有 edge 的不穩定點。</text><rect x="1362" y="32" width="266" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1495" y="65.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">SIFT · correspondence</text><g data-entity="sift_mobile_scale_causal_flow"><rect x="32" y="177" width="575" height="110" rx="18" fill="#EFF7FF" stroke="#1769E0" stroke-width="2"/><text x="46" y="221.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="32" font-weight="900" fill="#1769E0" text-anchor="start">image pyramid → DoG extrema</text><text x="46" y="261.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="30" font-weight="900" fill="#123265" text-anchor="start">→ stable keypoint candidates</text></g><clipPath id="crop-scale-raw-62-336-120-10"><rect x="62" y="336" width="446" height="346" rx="22"/></clipPath><g clip-path="url(#crop-scale-raw-62-336-120-10)"><svg x="62" y="336" width="446" height="346" viewBox="120 10 1420 916" preserveAspectRatio="xMidYMid slice"><image href="../ad-ae/ad-ae-metal-plate-anchor_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="62" y="336" width="446" height="346" rx="22" fill="none" stroke="#1769E0" stroke-width="2"/><text x="285" y="316.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#123265" text-anchor="middle">same textured fixture ROI</text><circle cx="170" cy="412" r="11" fill="#FFFFFF" stroke="#F28B00" stroke-width="4"/><circle cx="170" cy="412" r="3" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><path d="M182 403 L201 388" fill="none" stroke="#F28B00" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><circle cx="302" cy="455" r="11" fill="#FFFFFF" stroke="#00A8C6" stroke-width="4"/><circle cx="302" cy="455" r="3" fill="#00A8C6" stroke="#00A8C6" stroke-width="0"/><path d="M314 446 L333 431" fill="none" stroke="#00A8C6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><circle cx="424" cy="581" r="11" fill="#FFFFFF" stroke="#7657C8" stroke-width="4"/><circle cx="424" cy="581" r="3" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><path d="M436 572 L455 557" fill="none" stroke="#7657C8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><text x="285" y="718.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="750" fill="#536989" text-anchor="middle">每個候選記下 position + scale + orientation</text><path d="M536 505 L615 505" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="642" y="313" width="496" height="414" rx="26" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="890" y="354.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#123265" text-anchor="middle">image pyramid：同一 ROI 的三個尺度</text><clipPath id="crop-scale-0-675-391-160-32"><rect x="675" y="391" width="210" height="184" rx="16"/></clipPath><g clip-path="url(#crop-scale-0-675-391-160-32)"><svg x="675" y="391" width="210" height="184" viewBox="160 32 1320 850" preserveAspectRatio="xMidYMid slice"><image href="../ad-ae/ad-ae-metal-plate-anchor_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="675" y="391" width="210" height="184" rx="16" fill="none" stroke="#1769E0" stroke-width="2"/><circle cx="769.5" cy="470.12" r="11" fill="#FFFFFF" stroke="#F28B00" stroke-width="4"/><circle cx="769.5" cy="470.12" r="3" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="780.0" y="602.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#536989" text-anchor="middle">coarse</text><clipPath id="crop-scale-1-811-442-160-32"><rect x="811" y="442" width="210" height="184" rx="16"/></clipPath><g clip-path="url(#crop-scale-1-811-442-160-32)"><svg x="811" y="442" width="210" height="184" viewBox="160 32 1320 850" preserveAspectRatio="xMidYMid slice"><image href="../ad-ae/ad-ae-metal-plate-anchor_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="811" y="442" width="210" height="184" rx="16" fill="none" stroke="#00A8C6" stroke-width="2"/><circle cx="905.5" cy="521.12" r="11" fill="#FFFFFF" stroke="#F28B00" stroke-width="4"/><circle cx="905.5" cy="521.12" r="3" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="916.0" y="653.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#536989" text-anchor="middle">middle</text><clipPath id="crop-scale-2-931-505-160-32"><rect x="931" y="505" width="160" height="144" rx="16"/></clipPath><g clip-path="url(#crop-scale-2-931-505-160-32)"><svg x="931" y="505" width="160" height="144" viewBox="160 32 1320 850" preserveAspectRatio="xMidYMid slice"><image href="../ad-ae/ad-ae-metal-plate-anchor_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="931" y="505" width="160" height="144" rx="16" fill="none" stroke="#00A8C6" stroke-width="2"/><circle cx="1003.0" cy="566.92" r="11" fill="#FFFFFF" stroke="#F28B00" stroke-width="4"/><circle cx="1003.0" cy="566.92" r="3" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="1011.0" y="676.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#536989" text-anchor="middle">fine</text><path d="M1160 505 L1234 505" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="1260" y="313" width="348" height="414" rx="26" fill="#FFFDFC" stroke="#F28B00" stroke-width="2"/><text x="1434" y="356.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#F28B00" text-anchor="middle">localization + rejection</text><rect x="1302" y="413" width="264" height="46" rx="15" fill="#FFFFFF" stroke="#149A63" stroke-width="2"/><text x="1434.0" y="443.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#149A63" text-anchor="middle">keep: stable local structure</text><rect x="1302" y="493" width="264" height="46" rx="15" fill="#FFFFFF" stroke="#D94B62" stroke-width="2"/><text x="1434.0" y="523.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D94B62" text-anchor="middle">reject: low contrast</text><rect x="1302" y="573" width="264" height="46" rx="15" fill="#FFFFFF" stroke="#D94B62" stroke-width="2"/><text x="1434.0" y="603.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D94B62" text-anchor="middle">reject: edge-only response</text><text x="1434" y="665.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D94B62" text-anchor="middle">不是 box，不是 defect label</text><rect x="62" y="755" width="1546" height="55" rx="18" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="92" y="789.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="750" fill="#536989" text-anchor="start">可觀測紋理不足、模糊、鏡面或 tiny ROI 時，可靠 keypoint 可能本來就不夠；不要強行求 transform。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">SIFT 的找點步驟只提出尺度空間的局部地標候選；候選仍須經 descriptor、geometry 與 coverage 驗證。</text></svg>