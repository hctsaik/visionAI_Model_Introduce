<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">SIFT gradient descriptor and ratio test</title><desc id="desc">A SIFT keypoint has position, scale, orientation, and a gradient descriptor. Nearest-neighbor comparison and the ratio test create only correspondence candidates, not geometry.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0C9B91" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C9B91"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-149A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#149A63"/></marker><marker id="arrow-536989" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536989"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#09224C"/><text x="42" y="98.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#09224C" text-anchor="start">第二步：比較的是局部梯度名片；nearest match 還只是候選</text><text x="42" y="145.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#536989" text-anchor="start">keypoint 的 position、scale、orientation 與 gradient descriptor 讓局部可回查；nearest-neighbor 之後還要用 ratio test 排除曖昧匹配。</text><rect x="1362" y="32" width="266" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1495" y="65.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">SIFT · correspondence</text><g data-entity="sift_mobile_descriptor_causal_flow"><rect x="32" y="177" width="575" height="110" rx="18" fill="#F7F3FF" stroke="#7657C8" stroke-width="2"/><text x="46" y="221.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="31" font-weight="900" fill="#7657C8" text-anchor="start">keypoint + orientation + descriptor</text><text x="46" y="261.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#123265" text-anchor="start">→ nearest-neighbor → ratio test</text></g><clipPath id="crop-ref-62-62-370-140-18"><rect x="62" y="370" width="262" height="206" rx="22"/></clipPath><g clip-path="url(#crop-ref-62-62-370-140-18)"><svg x="62" y="370" width="262" height="206" viewBox="140 18 1370 878" preserveAspectRatio="xMidYMid slice"><image href="../ad-ae/ad-ae-metal-plate-anchor_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="62" y="370" width="262" height="206" rx="22" fill="none" stroke="#1769E0" stroke-width="2"/><clipPath id="crop-current-62-380-370-174-28"><rect x="380" y="370" width="262" height="206" rx="22"/></clipPath><g clip-path="url(#crop-current-62-380-370-174-28)"><svg x="380" y="370" width="262" height="206" viewBox="174 28 1330 858" preserveAspectRatio="xMidYMid slice"><image href="../ad-ae/ad-ae-metal-plate-anchor_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="380" y="370" width="262" height="206" rx="22" fill="none" stroke="#00A8C6" stroke-width="2"/><text x="193.0" y="354.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#123265" text-anchor="middle">reference ROI</text><text x="511.0" y="354.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#123265" text-anchor="middle">current ROI</text><circle cx="138" cy="437" r="11" fill="#FFFFFF" stroke="#F28B00" stroke-width="4"/><circle cx="138" cy="437" r="3" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><circle cx="448" cy="442" r="11" fill="#FFFFFF" stroke="#F28B00" stroke-width="4"/><circle cx="448" cy="442" r="3" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><circle cx="236" cy="461" r="11" fill="#FFFFFF" stroke="#00A8C6" stroke-width="4"/><circle cx="236" cy="461" r="3" fill="#00A8C6" stroke="#00A8C6" stroke-width="0"/><circle cx="546" cy="466" r="11" fill="#FFFFFF" stroke="#00A8C6" stroke-width="4"/><circle cx="546" cy="466" r="3" fill="#00A8C6" stroke="#00A8C6" stroke-width="0"/><circle cx="312" cy="551" r="11" fill="#FFFFFF" stroke="#7657C8" stroke-width="4"/><circle cx="312" cy="551" r="3" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><circle cx="619" cy="556" r="11" fill="#FFFFFF" stroke="#7657C8" stroke-width="4"/><circle cx="619" cy="556" r="3" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><text x="352" y="620.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="750" fill="#536989" text-anchor="middle">同一組局部的方向與周圍梯度</text><path d="M678 476 L753 476" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="783" y="324" width="354" height="312" rx="24" fill="#FFFFFF" stroke="#7657C8" stroke-width="2"/><text x="960" y="367.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#7657C8" text-anchor="middle">gradient descriptor</text><rect x="843" y="409" width="23" height="23" rx="5" fill="#7657C8" fill-opacity="0.84" stroke="#7657C8" stroke-width="0"/><rect x="874" y="409" width="23" height="23" rx="5" fill="#00A8C6" fill-opacity="0.84" stroke="#00A8C6" stroke-width="0"/><rect x="905" y="409" width="23" height="23" rx="5" fill="#F4B529" fill-opacity="0.84" stroke="#F4B529" stroke-width="0"/><rect x="936" y="409" width="23" height="23" rx="5" fill="#7657C8" fill-opacity="0.84" stroke="#7657C8" stroke-width="0"/><rect x="967" y="409" width="23" height="23" rx="5" fill="#00A8C6" fill-opacity="0.84" stroke="#00A8C6" stroke-width="0"/><rect x="998" y="409" width="23" height="23" rx="5" fill="#F4B529" fill-opacity="0.84" stroke="#F4B529" stroke-width="0"/><rect x="1029" y="409" width="23" height="23" rx="5" fill="#7657C8" fill-opacity="0.84" stroke="#7657C8" stroke-width="0"/><rect x="1060" y="409" width="23" height="23" rx="5" fill="#00A8C6" fill-opacity="0.84" stroke="#00A8C6" stroke-width="0"/><rect x="843" y="440" width="23" height="23" rx="5" fill="#00A8C6" fill-opacity="0.84" stroke="#00A8C6" stroke-width="0"/><rect x="874" y="440" width="23" height="23" rx="5" fill="#F4B529" fill-opacity="0.84" stroke="#F4B529" stroke-width="0"/><rect x="905" y="440" width="23" height="23" rx="5" fill="#7657C8" fill-opacity="0.84" stroke="#7657C8" stroke-width="0"/><rect x="936" y="440" width="23" height="23" rx="5" fill="#00A8C6" fill-opacity="0.84" stroke="#00A8C6" stroke-width="0"/><rect x="967" y="440" width="23" height="23" rx="5" fill="#F4B529" fill-opacity="0.84" stroke="#F4B529" stroke-width="0"/><rect x="998" y="440" width="23" height="23" rx="5" fill="#7657C8" fill-opacity="0.84" stroke="#7657C8" stroke-width="0"/><rect x="1029" y="440" width="23" height="23" rx="5" fill="#00A8C6" fill-opacity="0.84" stroke="#00A8C6" stroke-width="0"/><rect x="1060" y="440" width="23" height="23" rx="5" fill="#F4B529" fill-opacity="0.84" stroke="#F4B529" stroke-width="0"/><rect x="843" y="471" width="23" height="23" rx="5" fill="#F4B529" fill-opacity="0.84" stroke="#F4B529" stroke-width="0"/><rect x="874" y="471" width="23" height="23" rx="5" fill="#7657C8" fill-opacity="0.84" stroke="#7657C8" stroke-width="0"/><rect x="905" y="471" width="23" height="23" rx="5" fill="#00A8C6" fill-opacity="0.84" stroke="#00A8C6" stroke-width="0"/><rect x="936" y="471" width="23" height="23" rx="5" fill="#F4B529" fill-opacity="0.84" stroke="#F4B529" stroke-width="0"/><rect x="967" y="471" width="23" height="23" rx="5" fill="#7657C8" fill-opacity="0.84" stroke="#7657C8" stroke-width="0"/><rect x="998" y="471" width="23" height="23" rx="5" fill="#00A8C6" fill-opacity="0.84" stroke="#00A8C6" stroke-width="0"/><rect x="1029" y="471" width="23" height="23" rx="5" fill="#F4B529" fill-opacity="0.84" stroke="#F4B529" stroke-width="0"/><rect x="1060" y="471" width="23" height="23" rx="5" fill="#7657C8" fill-opacity="0.84" stroke="#7657C8" stroke-width="0"/><rect x="843" y="502" width="23" height="23" rx="5" fill="#7657C8" fill-opacity="0.84" stroke="#7657C8" stroke-width="0"/><rect x="874" y="502" width="23" height="23" rx="5" fill="#00A8C6" fill-opacity="0.84" stroke="#00A8C6" stroke-width="0"/><rect x="905" y="502" width="23" height="23" rx="5" fill="#F4B529" fill-opacity="0.84" stroke="#F4B529" stroke-width="0"/><rect x="936" y="502" width="23" height="23" rx="5" fill="#7657C8" fill-opacity="0.84" stroke="#7657C8" stroke-width="0"/><rect x="967" y="502" width="23" height="23" rx="5" fill="#00A8C6" fill-opacity="0.84" stroke="#00A8C6" stroke-width="0"/><rect x="998" y="502" width="23" height="23" rx="5" fill="#F4B529" fill-opacity="0.84" stroke="#F4B529" stroke-width="0"/><rect x="1029" y="502" width="23" height="23" rx="5" fill="#7657C8" fill-opacity="0.84" stroke="#7657C8" stroke-width="0"/><rect x="1060" y="502" width="23" height="23" rx="5" fill="#00A8C6" fill-opacity="0.84" stroke="#00A8C6" stroke-width="0"/><text x="960" y="571.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#123265" text-anchor="middle">局部結構的數字名片</text><path d="M1163 476 L1235 476" fill="none" stroke="#7657C8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="1262" y="318" width="346" height="328" rx="24" fill="#FFFDFC" stroke="#F28B00" stroke-width="2"/><text x="1435" y="362.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#F28B00" text-anchor="middle">nearest-neighbor + ratio test</text><text x="1302" y="423.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#123265" text-anchor="start">nearest d1</text><rect x="1450" y="399" width="101" height="34" rx="9" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="1302" y="486.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#123265" text-anchor="start">second d2</text><rect x="1450" y="462" width="127" height="34" rx="9" fill="#D9E6FA" stroke="#1769E0" stroke-width="0"/><text x="1435" y="544.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#149A63" text-anchor="middle">d1 / d2 small → clearer candidate</text><text x="1435" y="584.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D94B62" text-anchor="middle">d1 / d2 close → ambiguous → reject</text><rect x="62" y="713" width="1546" height="94" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="92" y="751.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#123265" text-anchor="start">ratio test 減少「兩個都很像」的候選，但它還沒問：這些線是否共同支持同一個幾何 transform？</text><text x="92" y="785.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="700" fill="#536989" text-anchor="start">週期孔洞、重複紋理或外觀改變仍可能讓許多 descriptor 一起像；不要把 descriptor distance 叫成 registration evidence。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">descriptor similarity 只建立 correspondence candidate；下一步由整組線的共同幾何決定能否往下。</text></svg>