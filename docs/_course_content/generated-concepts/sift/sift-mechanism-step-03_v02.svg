<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">相似 descriptor 先成候選</title><desc id="desc">SIFT 以最近鄰和 ratio test 將描述子相似性轉為候選 match。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="ratio_match" data-renderer-art="correspondence" data-primitive="ratio_match_filter" data-semantic-scene="ratio_match_filter" data-semantic-entities="query_descriptor|two_neighbors|ratio_gate" data-specialist-coverage="query_descriptor|two_neighbors|ratio_gate" data-semantic-relation="retain a match only after a ratio test" data-must-show="reference descriptor 對兩個近鄰 | 最佳 | 次佳距離比例的簡圖" data-not-claim="ratio test 只減少曖昧，尚未證明幾何。"><title>相似 descriptor 先成候選</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="178.27999999999997" y1="132.44" x2="326.12" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="393.88" y1="132.44" x2="535.56" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="query_descriptor" data-entity-label-full="query descriptor"><rect x="114.66206896551722" y="110.49057471264368" width="43.89885057471265" height="38.23448275862069" fill="none" stroke="#1769E0" stroke-width="3"/><circle cx="164.22528735632181" cy="120.4032183908046" r="5.664367816091954" fill="#1769E0"/><circle cx="164.22528735632181" cy="138.10436781