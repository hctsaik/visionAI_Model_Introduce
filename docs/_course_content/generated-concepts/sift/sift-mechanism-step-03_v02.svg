 sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">ratio</text><text data-label-line="true" x="166.48000000000002" y="242.42" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">match filt</text></g></g><text x="42" y="311.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#0B2858">讀圖：相似 descriptor 先成候選</text><text x="42" y="339.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="700" fill="#8A5600">候選先交 REVIEW／HOLD；完整邊界見圖下說明。</text></svg>