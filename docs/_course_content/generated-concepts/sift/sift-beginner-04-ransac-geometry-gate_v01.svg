<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">SIFT RANSAC geometry verification</title><desc id="desc">RANSAC tests which candidate lines support one transform, then requires inlier spatial coverage and reprojection residual before a correspondence or warp candidate can be reviewed.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0C9B91" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C9B91"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-149A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#149A63"/></marker><marker id="arrow-536989" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536989"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#09224C"/><text x="42" y="98.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="34" font-weight="900" fill="#09224C" text-anchor="start">第三步：整組線能否支持同一個 transform？</text><text x="42" y="145.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#536989" text-anchor="start">RANSAC 尋找共同幾何的 inliers；再看 inlier spatial coverage 與 reprojection residual，才得到可交給下游的 correspondence / warp candidate。</text><rect x="1362" y="32" width="266" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1495" y="65.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">SIFT · correspondence</text><g data-entity="sift_mobile_geometry_causal_flow"><rect x="32" y="177" width="575" height="146" rx="18" fill="#EFFBF4" stroke="#149A63" stroke-width="2"/><text x="46" y="218.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="32" font-weight="900" fill="#149A63" text-anchor="start">candidate matches → RANSAC</text><text x="46" y="259.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#123265" text-anchor="start">coverage + residual → candidate / HOLD</text><text x="46" y="300.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D94B62" text-anchor="start">not a final registration decision</text></g><clipPath id="crop-ref-62-62-368-140-18"><rect x="62" y="368" width="270" height="214" rx="22"/></clipPath><g clip-path="url(#crop-ref-62-62-368-140-18)"><svg x="62" y="368" width="270" height="214" viewBox="140 18 1370 878" preserveAspectRatio="xMidYMid slice"><image href="../ad-ae/ad-ae-metal-plate-anchor_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="62" y="368" width="270" height="214" rx="22" fill="none" stroke="#1769E0" stroke-width="2"/><clipPath id="crop-current-62-388-368-174-28"><rect x="388" y="368" width="270" height="214" rx="22"/></clipPath><g clip-path="url(#crop-current-62-388-368-174-28)"><svg x="388" y="368" width="270" height="214" viewBox="174 28 1330 858" preserveAspectRatio="xMidYMid slice"><image href="../ad-ae/ad-ae-metal-plate-anchor_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="388" y="368" width="270" height="214" rx="22" fill="none" stroke="#00A8C6" stroke-width="2"/><text x="197.0" y="352.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#123265" text-anchor="middle">reference ROI</text><text x="523.0" y="352.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#123265" text-anchor="middle">current ROI</text><circle cx="138" cy="435" r="11" fill="#FFFFFF" stroke="#F28B00" stroke-width="4"/><circle cx="138" cy="435" r="3" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><circle cx="456" cy="440" r="11" fill="#FFFFFF" stroke="#F28B00" stroke-width="4"/><circle cx="456" cy="440" r="3" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><path d="M138 435 C216 411, 378 464, 456 440" fill="none" stroke="#F28B00" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-F28B00)" stroke-dasharray="8 8"/><circle cx="236" cy="459" r="11" fill="#FFFFFF" stroke="#00A8C6" stroke-width="4"/><circle cx="236" cy="459" r="3" fill="#00A8C6" stroke="#00A8C6" stroke-width="0"/><circle cx="554" cy="464" r="11" fill="#FFFFFF" stroke="#00A8C6" stroke-width="4"/><circle cx="554" cy="464" r="3" fill="#00A8C6" stroke="#00A8C6" stroke-width="0"/><path d="M236 459 C314 435, 476 488, 554 464" fill="none" stroke="#00A8C6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-00A8C6)" stroke-dasharray="8 8"/><circle cx="312" cy="549" r="11" fill="#FFFFFF" stroke="#7657C8" stroke-width="4"/><circle cx="312" cy="549" r="3" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><circle cx="627" cy="554" r="11" fill="#FFFFFF" stroke="#7657C8" stroke-width="4"/><circle cx="627" cy="554" r="3" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><path d="M312 549 C390 525, 549 578, 627 554" fill="none" stroke="#7657C8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-7657C8)" stroke-dasharray="8 8"/><path d="M183 417 C380 574, 492 404, 688 474" fill="none" stroke="#D94B62" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-D94B62)" stroke-dasharray="10 9"/><path d="M294 549 C426 373, 534 574, 758 427" fill="none" stroke="#D94B62" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-D94B62)" stroke-dasharray="10 9"/><text x="410" y="624.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="750" fill="#536989" text-anchor="middle">coloured = retained inliers · red = reject</text><path d="M746 475 L818 475" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="846" y="326" width="296" height="330" rx="24" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><text x="994" y="358.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#1769E0" text-anchor="middle">RANSAC geometry</text><text x="994" y="387.9" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#1769E0" text-anchor="middle">solver</text><circle cx="994" cy="458" r="50" fill="#EFF7FF" stroke="#1769E0" stroke-width="3"/><text x="994" y="467.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#1769E0" text-anchor="middle">fit</text><text x="994" y="548.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#123265" text-anchor="middle">hypothesize → count inliers</text><text x="994" y="588.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#D94B62" text-anchor="middle">outlier lines do not vote</text><path d="M1168 475 L1239 475" fill="none" stroke="#149A63" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-149A63)"/><rect x="1266" y="326" width="342" height="330" rx="24" fill="#EFFBF4" stroke="#149A63" stroke-width="2"/><text x="1437" y="370.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#149A63" text-anchor="middle">geometry evidence</text><rect x="1305" y="420" width="264" height="46" rx="15" fill="#FFFFFF" stroke="#149A63" stroke-width="2"/><text x="1437.0" y="450.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#149A63" text-anchor="middle">inlier spatial coverage</text><rect x="1305" y="494" width="264" height="46" rx="15" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><text x="1437.0" y="524.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">reprojection residual</text><rect x="1305" y="569" width="264" height="49" rx="16" fill="#FFF0F1" stroke="#D94B62" stroke-width="2"/><text x="1437" y="602.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="middle">insufficient evidence → HOLD</text><rect x="62" y="713" width="1546" height="94" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="92" y="751.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#123265" text-anchor="start">transform 是一個可檢查的幾何假設：它必須讓分散的 correspondence 同時一致，並留下 residual 與 inlier map。</text><text x="92" y="785.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="700" fill="#536989" text-anchor="start">即使通過，SIFT warp 常只是 position-sensitive 下游的 initialization；finer registration 與最終 action 仍是後續責任。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">RANSAC + coverage + residual 讓 SIFT 的匹配變成可審核的候選；沒有這些證據，答案就是 HOLD。</text></svg>