<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">先宣告兩張影格：I(t-k) 與 Iₜ，比較的是固定 ROI 裡的改變</title>
  <desc id="desc">同一個輸送帶 AOI 在 I(t-k) 與 I(t) 中以宣告時間間隔比較；藍色 carrier 位置改變但不建立軌跡。</desc>
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173b70" flood-opacity=".18"/>
    </filter>
    <marker id="arrow-1b6ee8" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1b6ee8"/></marker>
    <marker id="arrow-f48112" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f48112"/></marker>
    <marker id="arrow-e04c62" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e04c62"/></marker>
  </defs>
  <rect width="1672" height="941" fill="#f7fbff"/><rect width="1672" height="10" fill="#102c58"/><rect x="40" y="34" width="367" height="38" rx="19" fill="#1769e0" opacity=".12"/><text x="60" y="58" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#1769e0">declared frame pair</text><text x="40" y="126" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="39" font-weight="850" fill="#092d61">先宣告兩張影格：I(t-k) 與 Iₜ，比較的是固定 ROI 裡的改變</text><text x="40" y="168" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="600" fill="#4d6e9d">同一個輸送帶 AOI、同一個 Δt / reference policy，才讓「兩張圖相減」有可重播的意義。</text><rect x="1325" y="35" width="307" height="48" rx="24" fill="#ffffff" stroke="#98beff" stroke-width="2"/><text x="1478" y="67" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="850" fill="#1769e0">FRAME DIFFERENCE</text><clipPath id="frame-before-clip"><rect x="52" y="225" width="610" height="392" rx="22"/></clipPath><g clip-path="url(#frame-before-clip)"><svg x="52" y="225" width="610" height="392" viewBox="0 180 1672 620" preserveAspectRatio="xMidYMid slice"><image href="frame-difference-aoi-conveyor-clean_v01.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/></svg></g><rect x="52" y="225" width="610" height="392" rx="22" fill="none" stroke="#1769e0" stroke-width="3"/><rect x="70" y="240" width="452" height="38" rx="19" fill="#1769e0" opacity=".12"/><text x="90" y="264" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#1769e0">I(t-k) • timestamp saved</text><rect x="106" y="305" width="505" height="243" rx="8" fill="none" stroke="#1769e0" stroke-width="3" stroke-dasharray="10 8"/><text x="118" y="295" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#1769e0">fixed ROI</text><g opacity="1.0" filter="url(#soft-shadow)"><rect x="234" y="421" width="106" height="54" rx="9" fill="#1769e0" stroke="#ffffff" stroke-width="3"/><rect x="249" y="433" width="76" height="30" rx="5" fill="#9bc7ff" opacity=".94"/><path d="M 262 456 L 284 441 L 310 456" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="287" y="406" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#1769e0">carrier at t-k</text><clipPath id="frame-now-clip"><rect x="1010" y="225" width="610" height="392" rx="22"/></clipPath><g clip-path="url(#frame-now-clip)"><svg x="1010" y="225" width="610" height="392" viewBox="0 180 1672 620" preserveAspectRatio="xMidYMid slice"><image href="frame-difference-aoi-conveyor-clean_v01.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/></svg></g><rect x="1010" y="225" width="610" height="392" rx="22" fill="none" stroke="#1769e0" stroke-width="3"/><rect x="1028" y="240" width="384" height="38" rx="19" fill="#1769e0" opacity=".12"/><text x="1048" y="264" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#1769e0">Iₜ • timestamp saved</text><rect x="1065" y="305" width="505" height="243" rx="8" fill="none" stroke="#1769e0" stroke-width="3" stroke-dasharray="10 8"/><text x="1077" y="295" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#1769e0">fixed ROI</text><g opacity="1.0" filter="url(#soft-shadow)"><rect x="1325" y="421" width="106" height="54" rx="9" fill="#1769e0" stroke="#ffffff" stroke-width="3"/><rect x="1340" y="433" width="76" height="30" rx="5" fill="#9bc7ff" opacity=".94"/><path d="M 1353 456 L 1375 441 L 1401 456" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1378" y="406" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#1769e0">same carrier at t</text><path d="M 680 420 L 982 420" fill="none" stroke="#1b6ee8" stroke-width="6" stroke-linecap="round"  marker-end="url(#arrow-1b6ee8)"/><text x="831" y="367" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="25" font-weight="850" fill="#1769e0">declared Δt = k frames</text><text x="831" y="403" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="650" fill="#58729b">frame rate / timestamp / drop record</text><text x="831" y="476" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="800" fill="#173b70">same camera</text><text x="831" y="507" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="800" fill="#173b70">same ROI</text><text x="831" y="538" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="800" fill="#173b70">same photometric contract</text><rect x="84" y="665" width="1504" height="143" rx="24" fill="#ffffff" stroke="#75cdbf" stroke-width="3"/><text x="118" y="718" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="27" font-weight="850" fill="#173b70">Frame-pair contract</text><text x="118" y="745" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="650" fill="#42638e"><tspan x="118" dy="0">raw I(t-k) + raw Iₜ</tspan><tspan x="118" dy="28">timestamps + frame interval/reference policy</tspan><tspan x="118" dy="28">fixed ROI / optional registration / normalization</tspan></text><text x="808" y="718" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="800" fill="#1769e0"><tspan x="808" dy="0">同一個 carrier 的位置改變 → 會留下 changed pixels</tspan><tspan x="808" dy="34">但結果沒有輸出 velocity vector、連續軌跡或 object identity</tspan></text><rect x="40" y="855" width="1592" height="55" rx="26" fill="#fff3cf" stroke="#f0ad25" stroke-width="2"/><path d="M 76 878 q 12 -20 24 0 q -2 20 -12 20 q -10 0 -12 -20 M 88 866 v-14 M 63 878 h-13 M 113 878 h13" fill="none" stroke="#d18a00" stroke-width="3" stroke-linecap="round"/><text x="124" y="889" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="800" fill="#885c00">Frame Difference 是固定相機下的前景事件候選；不是 optical flow、tracker 或類別模型。</text>
</svg>
