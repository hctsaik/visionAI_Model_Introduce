17.5" font-weight="650" fill="#0B2858">局部 brightness-consistent motion</text><text x="1145" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17.5" font-weight="650" fill="#0B2858">solve</text><line x1="1145" y1="628" x2="1567" y2="628" stroke="#D6E7FF" stroke-width="2"/><text x="1145" y="659.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="900" fill="#F38B00">會交出什麼時間輸出</text><text x="1145" y="690" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17.5" font-weight="650" fill="#0B2858">有效的 (u,v) flow vector</text><rect x="77" y="800" width="1518" height="100" rx="22" fill="#FFF4CC" stroke="#F1B828"/><text x="112" y="836.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="900" fill="#674500">共同邊界：</text><text x="112" y="865" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="600" fill="#674500">在既定 frame interval、ROI、光度處理與元件規則下，哪裡的像素變化夠大？輸出是 change component／temporal event，不是物件類別、</text><text x="112" y="889" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="600" fill="#674500">ID、速度、缺陷機率或根因。</text>
