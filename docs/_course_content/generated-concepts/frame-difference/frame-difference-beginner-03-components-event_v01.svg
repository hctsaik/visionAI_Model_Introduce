t an event</text><path d="M 1202 430 L 1238 430" fill="none" stroke="#1b6ee8" stroke-width="6" stroke-linecap="round"  marker-end="url(#arrow-1b6ee8)"/><rect x="1252" y="235" width="374" height="393" rx="24" fill="#ffffff" stroke="#1769e0" stroke-width="3"/><text x="1439" y="282" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="26" font-weight="850" fill="#173b70">component record</text><rect x="1294" y="332" width="290" height="124" rx="16" fill="#edf5ff" stroke="#7eb0ff" stroke-width="2"/><text x="1326" y="369" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="700" fill="#42638e"><tspan x="1326" dy="0">area   location</tspan><tspan x="1326" dy="32">duration   persistence</tspan></text><rect x="1308" y="504" width="262" height="38" rx="19" fill="#edf5ff" stroke="#1769e0" stroke-width="2"/><text x="1439" y="529" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="800" fill="#1769e0">candidate region</text><text x="1439" y="585" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="700" fill="#42638e">not object / track ID</text><text x="54" y="691" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="26" font-weight="850" fill="#173b70">temporal event aggregation</text><path d="M 80 751 H 1260" stroke="#8eb8f5" stroke-width="5" stroke-linecap="round"/><circle cx="172" cy="751" r="18" fill="#a9bedb" stroke="#ffffff" stroke-width="3"/><text x="172" y="790" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="700" fill="#42638e">t0</text><circle cx="362" cy="751" r="18" fill="#f48112" stroke="#ffffff" stroke-width="3"/><text x="362" y="790" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="700" fill="#42638e">t1</text><circle cx="552" cy="751" r="18" fill="#f48112" stroke="#ffffff" stroke-width="3"/><text x="552" y="790" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="700" fill="#42638e">t2</text><circle cx="742" cy="751" r="18" fill="#f48112" stroke="#ffffff" stroke-width="3"/><text x="742" y="790" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="700" fill="#42638e">t3</text><circle cx="932" cy="751" r="18" fill="#a9bedb" stroke="#ffffff" stroke-width="3"/><text x="932" y="790" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="700" fill="#42638e">t4</text><text x="638" y="709" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="800" fill="#a85b09">persistence window</text><path d="M 1277 751 L 1344 751" fill="none" stroke="#1b6ee8" stroke-width="6" stroke-linecap="round"  marker-end="url(#arrow-1b6ee8)"/><rect x="1358" y="678" width="268" height="118" rx="20" fill="#f4fffc" stroke="#00a98f" stroke-width="3"/><text x="1492" y="722" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="24" font-weight="850" fill="#008d78">event candidate</text><text x="1492" y="756" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="700" fill="#008d78">REVIEW / queue / HOLD</text><rect x="40" y="855" width="1592" height="55" rx="26" fill="#fff3cf" stroke="#f0ad25" stroke-width="2"/><path d="M 76 878 q 12 -20 24 0 q -2 20 -12 20 q -10 0 -12 -20 M 88 866 v-14 M 63 878 h-13 M 113 878 h13" fill="none" stroke="#d18a00" stroke-width="3" stroke-linecap="round"/><text x="124" y="889" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="800" fill="#885c00">component 是候選區域；event 由時間窗口與 queue policy 定義，不是 detected object、track ID 或自動放行。</text>
