<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Frame Difference 的同一工作例說明圖</title>
  <desc id="desc">四個連續面板呈現固定工作例、預測、模型輸出與人類應如何安全解讀。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0B3068" flood-opacity=".12"/></filter>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker>
    <marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker>
    <style>text { dominant-baseline: alphabetic; } .fine { fill:#536A91; font-size:18px; }</style>
  </defs>
  <rect width="1672" height="941" fill="#F5F8FE"/>
  <rect x="40" y="32" width="150" height="32" rx="16" fill="#E6F0FF"/><text x="58" y="54.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="16" font-weight="800" fill="#1769E0">同一個工作例</text><text x="40" y="116" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="43" font-weight="900" fill="#071A3B">先預測，再看模型如何回答</text><text x="40" y="182" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="500" fill="#50698F">把同一個現場情境走一次：模型的輸出幫人決定下一個該回看的地方，而不是替人宣告真相。</text><text x="1630" y="57.0" text-anchor="end" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#5C7395">Frame Difference</text><rect x="40" y="266" width="372" height="518" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><g data-visual-cue="frame_pair_interval" data-renderer-art="frame_pair" data-primitive="fixed_roi_time_difference" data-semantic-scene="fixed_roi_time_difference" data-semantic-entities="fixed_roi|time_a|time_b|difference" data-specialist-coverage="fixed_roi|time_a|time_b|difference" data-semantic-relation="compare one registered ROI across declared times" data-must-show="同一慢速工件位於 I(t-k) 與 I(t) 兩張固定 ROI | 兩者帶 timestamp 與 k | 邊界提示：兩張影格不同不表示已辨識物件或事件。" data-not-claim="兩張影格不同不表示已辨識物件或事件。"><title>兩個已宣告時間點</title><rect x="64" y="294" width="324" height="122" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="fixed_roi_time_difference" data-specialist-coverage="fixed_roi|time_a|time_b|difference"><rect x="80" y="322" width="77.0" height="52.8" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M87.7 360.544 L105.41 346.816 L120.03999999999999 355.79200000000003 L143.14 335.2" fill="none" stroke="#93B8E8" stroke-width="3"/><rect x="100.79" y="335.2" width="27.72" height="22.703999999999997" rx="4" fill="none" stroke="#F38B00" stroke-width="3" stroke-dasharray="6 4"/><rect x="201.35999999999999" y="322" width="77.0" height="52.8" rx="8" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="3"/><path d="M209.05999999999997 360.544 L226.76999999999998 346.816 L241.39999999999998 355.79200000000003 L264.5 335.2" fill="none" stroke="#93B8E8" stroke-width="3"/><rect x="222.14999999999998" y="335.2" width="27.72" height="22.703999999999997" rx="4" fill="none" stroke="#F38B00" stroke-width="3" stroke-dasharray="6 4"/><line x1="161.32" y1="350.6" x2="192.12" y2="350.6" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><path d="M96.64 392.4 H281.44000000000005" fill="none" stroke="#9FC4FF" stroke-width="3"/><path d="M96.64 385.8 v12.1 M281.44000000000005 385.8 v12.1" stroke="#1769E0" stroke-width="3"/><text data-label-line="true" x="133.6" y="401.2" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">t-k</text><text data-label-line="true" x="241.4" y="401.2" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">t</text><text data-label-line="true" x="330.71999999999997" y="358.3" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">Δt</text></g></g><circle cx="360" cy="332" r="25" fill="#1769E0"/><text x="360" y="340.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">1</text><text x="68" y="448" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="25" font-weight="900" fill="#0B2858">固定工作例</text><text x="68" y="520" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">工件慢慢移動，同時光源有一</text><text x="68" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">次 flicker；你分別把 k 設很</text><text x="68" y="576" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">小與較大。</text><rect x="445" y="266" width="372" height="518" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><g data-visual-cue="roi_alignment" data-renderer-art="roi_alignment" data-primitive="registered_roi_overlay" data-semantic-scene="registered_roi_overlay" data-semantic-entities="reference_roi|current_roi|alignment" data-specialist-coverage="reference_roi|current_roi|alignment" data-semantic-relation="align before differencing" data-must-show="兩張 ROI 疊合 | crosshair 表示 registration；exposure slider 表示相同光度規則 | 邊界提示：未對齊或曝光漂移不可被當成 motion。" data-not-claim="未對齊或曝光漂移不可被當成 motion。"><title>先對齊再比較</title><rect x="469" y="294" width="324" height="122" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="registered_roi_overlay" data-specialist-coverage="reference_roi|current_roi|alignment"><rect x="526.28" y="318.7" width="104.72000000000001" height="62.699999999999996" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M536.752 364.471 L560.8376 348.169 L580.7343999999999 358.828 L612.1504 334.375" fill="none" stroke="#93B8E8" stroke-width="3"/><rect x="560.8376" y="334.375" width="37.699200000000005" height="26.961" rx="4" fill="none" stroke="#F38B00" stroke-width="3" stroke-dasharray="6 4"/><rect x="560.16" y="327.5" width="104.72000000000001" height="62.699999999999996" rx="8" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="3"/><path d="M570.632 373.271 L594.7176 356.969 L614.6143999999999 367.628 L646.0304 343.175" fill="none" stroke="#93B8E8" stroke-width="3"/><rect x="588.4344" y="343.175" width="37.699200000000005" height="26.961" rx="4" fill="none" stroke="#F38B00" stroke-width="3" stroke-dasharray="6 4"/><path d="M621.76 316.5v72.60000000000001 M581.72 352.8h80.08" stroke="#F38B00" stroke-width="3" stroke-dasharray="5 4"/><line x1="520.12" y1="396.8" x2="587.88" y2="396.8" stroke="#F38B00" stroke-width="4" marker-end="url(#arrow-orange)"/><text data-label-line="true" x="661.8" y="399.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">ROI 對齊</text></g></g><circle cx="765" cy="332" r="25" fill="#0AA6D8"/><text x="765" y="340.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">2</text><text x="473" y="448" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="25" font-weight="900" fill="#0B2858">先做預測</text><text x="473" y="520" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">只調 threshold，能同時保住</text><text x="473" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">慢速事件、排除 flicker 並避</text><text x="473" y="576" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">免 motion trail 嗎？</text><rect x="850" y="266" width="372" height="518" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><g data-visual-cue="difference_components" data-renderer-art="difference_components" data-primitive="difference_to_component" data-semantic-scene="difference_to_component" data-semantic-entities="frame_pair|difference_grid|component" data-specialist-coverage="frame_pair|difference_grid|component" data-semantic-relation="turn a measured difference into a candidate component" data-must-show="absolute difference 經 threshold、morphology 後只留下橘色連通元件 | 「差分變粗 component」需以專屬物件與箭頭表達，不得使用通用 family motif。 | 邊界提示：橘色元件不是 object box、class 或 identity。" data-not-claim="橘色元件不是 object box、class 或 identity。"><title>差分變粗 component</title><rect x="874" y="294" width="324" height="122" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="difference_to_component" data-specialist-coverage="frame_pair|difference_grid|component"><rect x="886" y="320.9" width="52.36000000000001" height="47.3" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M891.236 355.429 L903.2788 343.131 L913.2272 351.17199999999997 L928.9352 332.72499999999997" fill="none" stroke="#93B8E8" stroke-width="3"/><rect x="943.6" y="320.9" width="52.36000000000001" height="47.3" rx="8" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="3"/><path d="M948.836 355.429 L960.8788000000001 343.131 L970.8272000000001 351.17199999999997 L986.5352 332.72499999999997" fill="none" stroke="#93B8E8" stroke-width="3"/><line x1="1002.12" y1="345.1" x2="1018.76" y2="345.1" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="1026.76" y="319.8" width="14.940000000000001" height="14.940000000000001" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><rect x="1043.7" y="319.8" width="14.940000000000001" height="14.940000000000001" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><rect x="1060.64" y="319.8" width="14.940000000000001" height="14.940000000000001" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><rect x="1077.58" y="319.8" width="14.940000000000001" height="14.940000000000001" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><rect x="1026.76" y="336.74" width="14.940000000000001" height="14.940000000000001" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><rect x="1043.7" y="336.74" width="14.940000000000001" height="14.940000000000001" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><rect x="1060.64" y="336.74" width="14.940000000000001" height="14.940000000000001" rx="2" fill="#F38B00" stroke="#0AA6D8" stroke-width="1"/><rect x="1077.58" y="336.74" width="14.940000000000001" height="14.940000000000001" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><rect x="1026.76" y="353.68" width="14.940000000000001" height="14.940000000000001" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><rect x="1043.7" y="353.68" width="14.940000000000001" height="14.940000000000001" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><rect x="1060.64" y="353.68" width="14.940000000000001" height="14.940000000000001" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><rect x="1077.58" y="353.68" width="14.940000000000001" height="14.940000000000001" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><line x1="1109.92" y1="345.1" x2="1128.4" y2="345.1" stroke="#F38B00" stroke-width="4" marker-end="url(#arrow-orange)"/><path d="M1137.6399999999999 330.8 c36.96-14.3 49.2817.6 15.429.700000000000003 c-36.9611.0-73.920-55.44-14.3z" fill="#F38B00" fill-opacity=".22" stroke="#F38B00" stroke-width="4"/><text data-label-line="true" x="1060.6399999999999" y="396.8" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">差異格</text><text data-label-line="true" x="1156.12" y="396.8" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">元件</text></g></g><circle cx="1170" cy="332" r="25" fill="#F38B00"/><text x="1170" y="340.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">3</text><text x="878" y="448" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="25" font-weight="900" fill="#0B2858">模型看到什麼</text><text x="878" y="520" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">不能保證。小 k 可能漏慢動；</text><text x="878" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">大 k 會拖出軌跡並混合無關動</text><text x="878" y="576" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">作。flicker、reflection 與</text><text x="878" y="604" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">registration error 也會像候</text><text x="878" y="632" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">選。</text><rect x="1255" y="266" width="372" height="518" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><g data-visual-cue="event_timeline" data-renderer-art="event_timeline" data-primitive="persistence_event_gate" data-semantic-scene="persistence_event_gate" data-semantic-entities="components|time_window|review_gate" data-specialist-coverage="components|time_window|review_gate" data-semantic-relation="require persistence before review" data-must-show="同一 component 依 persistence 排進 temporal queue | 在 REVIEW／HOLD gate 前停止 | 邊界提示：component 不能直接變成物理事件或 PASS。" data-not-claim="component 不能直接變成物理事件或 PASS。"><title>時間窗口前只算候選</title><rect x="1279" y="294" width="324" height="122" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="persistence_event_gate" data-specialist-coverage="components|time_window|review_gate"><rect x="1311.64" y="329.7" width="30.8" height="34.1" rx="6" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><rect x="1357.84" y="329.7" width="30.8" height="34.1" rx="6" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><circle cx="1373.24" cy="347.3" r="4.95" fill="#F38B00"/><rect x="1404.04" y="329.7" width="30.8" height="34.1" rx="6" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><circle cx="1419.44" cy="347.3" r="4.95" fill="#F38B00"/><rect x="1450.24" y="329.7" width="30.8" height="34.1" rx="6" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><circle cx="1465.6399999999999" cy="347.3" r="4.95" fill="#F38B00"/><line x1="1502.6" y1="347.3" x2="1539.56" y2="347.3" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="1539.56" y="325.3" width="43.120000000000005" height="44.0" rx="10" fill="#FFF4CC" stroke="#C88400" stroke-width="3"/><text data-label-line="true" x="1441.0" y="394.6" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">持續性</text><text data-label-line="true" x="1561.12" y="394.6" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">REVIEW</text></g></g><circle cx="1575" cy="332" r="25" fill="#C88400"/><text x="1575" y="340.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">4</text><text x="1283" y="448" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="25" font-weight="900" fill="#0B2858">人應如何解讀</text><text x="1283" y="520" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">在既定 frame interval、ROI、</text><text x="1283" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">光度處理與元件規則下，哪裡</text><text x="1283" y="576" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">的像素變化夠大？輸出是</text><text x="1283" y="604" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">change component／temporal</text><text x="1283" y="632" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">event，不是物件類別、ID、速</text><text x="1283" y="660" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#536A91">度、缺陷機率或根因。</text><line x1="416" y1="525" x2="433" y2="525" stroke="#1769E0" stroke-width="5" marker-end="url(#arrow-blue)"/><line x1="821" y1="525" x2="838" y2="525" stroke="#1769E0" stroke-width="5" marker-end="url(#arrow-blue)"/><line x1="1226" y1="525" x2="1243" y2="525" stroke="#1769E0" stroke-width="5" marker-end="url(#arrow-blue)"/><rect x="40" y="810" width="1592" height="100" rx="20" fill="#FFF4CC" stroke="#F1B828"/><text x="68" y="842.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="900" fill="#674500">這張圖要帶走：</text><text x="68" y="871" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="600" fill="#674500">k、threshold、blur、morphology、component filter 與 event window 共同定義部署行為；只寫 abs difference 並沒有定義系統。</text>
</svg>