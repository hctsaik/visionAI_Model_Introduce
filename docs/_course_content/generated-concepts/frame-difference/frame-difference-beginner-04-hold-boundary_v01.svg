<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">全域都亮或 frame pair 失真時，HOLD：不要把它說成 motion</title>
  <desc id="desc">照明變化、相機抖動、registration residual 與 dropped frame 都可產生 frame difference，但必須 HOLD 而非解讀為物理 motion。</desc>
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173b70" flood-opacity=".18"/>
    </filter>
    <marker id="arrow-1b6ee8" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1b6ee8"/></marker>
    <marker id="arrow-f48112" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f48112"/></marker>
    <marker id="arrow-e04c62" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e04c62"/></marker>
  </defs>
  <rect width="1672" height="941" fill="#f7fbff"/><rect width="1672" height="10" fill="#102c58"/><rect x="40" y="34" width="367" height="38" rx="19" fill="#1769e0" opacity=".12"/><text x="60" y="58" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#1769e0">failure / HOLD gate</text><text x="40" y="126" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="39" font-weight="850" fill="#092d61">全域都亮或 frame pair 失真時，HOLD：不要把它說成 motion</text><text x="40" y="168" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="600" fill="#4d6e9d">這三個受控情境都可能產生 change mask，但它們不證明有一個可追蹤的移動物件。</text><rect x="1325" y="35" width="307" height="48" rx="24" fill="#ffffff" stroke="#98beff" stroke-width="2"/><text x="1478" y="67" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="850" fill="#1769e0">FRAME DIFFERENCE</text><text x="50" y="226" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="850" fill="#173b70">illumination flicker / shadow：同一條空輸送帶，只有光度契約被破壞</text><clipPath id="flicker-a-clip"><rect x="50" y="248" width="450" height="184" rx="22"/></clipPath><g clip-path="url(#flicker-a-clip)"><svg x="50" y="248" width="450" height="184" viewBox="0 170 1672 620" preserveAspectRatio="xMidYMid slice"><image href="frame-difference-aoi-conveyor-clean_v01.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/></svg></g><rect x="50" y="248" width="450" height="184" rx="22" fill="none" stroke="#1769e0" stroke-width="3"/><rect x="68" y="263" width="146" height="38" rx="19" fill="#1769e0" opacity=".12"/><text x="88" y="287" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#1769e0">I(t-k)</text><clipPath id="flicker-b-clip"><rect x="535" y="248" width="450" height="184" rx="22"/></clipPath><g clip-path="url(#flicker-b-clip)"><svg x="535" y="248" width="450" height="184" viewBox="0 170 1672 620" preserveAspectRatio="xMidYMid slice"><image href="frame-difference-aoi-conveyor-clean_v01.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/></svg><rect x="535" y="248" width="450" height="184" fill="#fff4cc" opacity="0.25"/></g><rect x="535" y="248" width="450" height="184" rx="22" fill="none" stroke="#e04c62" stroke-width="3"/><rect x="553" y="263" width="265" height="38" rx="19" fill="#e04c62" opacity=".12"/><text x="573" y="287" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#e04c62">Iₜ • brighter</text><path d="M 1002 340 L 1090 340" fill="none" stroke="#e04c62" stroke-width="6" stroke-linecap="round"  marker-end="url(#arrow-e04c62)"/><rect x="1105" y="258" width="500" height="164" rx="20" fill="#fff8f8" stroke="#e04c62" stroke-width="3"/><text x="1138" y="304" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="800" fill="#cf3851"><tspan x="1138" dy="0">broad mask can be lighting</tspan><tspan x="1138" dy="31">not physical foreground motion</tspan><tspan x="1138" dy="31">HOLD → audit exposure / illumination</tspan></text><text x="50" y="497" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="850" fill="#173b70">camera jitter / registration residual：整個 rail、belt texture 一起位移</text><clipPath id="jitter-clip"><rect x="50" y="519" width="935" height="192" rx="22"/></clipPath><g clip-path="url(#jitter-clip)"><svg x="50" y="519" width="935" height="192" viewBox="0 170 1672 620" preserveAspectRatio="xMidYMid slice"><image href="frame-difference-aoi-conveyor-clean_v01.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/></svg></g><rect x="50" y="519" width="935" height="192" rx="22" fill="none" stroke="#e04c62" stroke-width="3"/><rect x="68" y="534" width="486" height="38" rx="19" fill="#e04c62" opacity=".12"/><text x="88" y="558" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#e04c62">same fixed camera required</text><rect x="132" y="556" width="770" height="112" rx="12" fill="none" stroke="#e04c62" stroke-width="4" stroke-dasharray="14 10"/><rect x="151" y="571" width="770" height="112" rx="12" fill="none" stroke="#1769e0" stroke-width="4" stroke-dasharray="14 10" opacity=".65"/><text x="525" y="695" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="800" fill="#cf3851">two global outlines ≠ local moving part</text><path d="M 1002 614 L 1090 614" fill="none" stroke="#e04c62" stroke-width="6" stroke-linecap="round"  marker-end="url(#arrow-e04c62)"/><rect x="1105" y="529" width="500" height="172" rx="20" fill="#fff8f8" stroke="#e04c62" stroke-width="3"/><text x="1138" y="574" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="800" fill="#cf3851"><tspan x="1138" dy="0">camera-motion gate / registration residual</tspan><tspan x="1138" dy="31">broad change → HOLD / re-capture</tspan><tspan x="1138" dy="31">do not invent many local events</tspan></text><text x="50" y="769" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="850" fill="#173b70">dropped frame / variable Δt：timestamp gap 使固定 event window 失效</text><path d="M 690 786 H 1275" stroke="#8eb8f5" stroke-width="5" stroke-linecap="round"/><circle cx="742" cy="786" r="17" fill="#1769e0" stroke="#ffffff" stroke-width="3"/><text x="742" y="824" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#42638e">t0</text><circle cx="874" cy="786" r="17" fill="#1769e0" stroke="#ffffff" stroke-width="3"/><text x="874" y="824" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#42638e">t1</text><circle cx="1006" cy="786" r="17" fill="#e04c62" stroke="#ffffff" stroke-width="3"/><text x="1006" y="824" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#42638e">DROP</text><circle cx="1138" cy="786" r="17" fill="#e04c62" stroke="#ffffff" stroke-width="3"/><text x="1138" y="824" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#42638e">t?</text><circle cx="1270" cy="786" r="17" fill="#1769e0" stroke="#ffffff" stroke-width="3"/><text x="1270" y="824" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#42638e">t4</text><rect x="40" y="855" width="1592" height="55" rx="26" fill="#fff3cf" stroke="#f0ad25" stroke-width="2"/><path d="M 76 878 q 12 -20 24 0 q -2 20 -12 20 q -10 0 -12 -20 M 88 866 v-14 M 63 878 h-13 M 113 878 h13" fill="none" stroke="#d18a00" stroke-width="3" stroke-linecap="round"/><text x="124" y="889" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="800" fill="#885c00">未宣告 Δt、dropped frame、global illumination 或 camera motion 時先 HOLD；不輸出 flow、速度或 identity。</text>
</svg>
