<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">先對齊再比較</title><desc id="desc">兩個時間點的 ROI 以十字準星對齊，旁邊有同一曝光正規化滑桿。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="roi_alignment" data-renderer-art="roi_alignment" data-primitive="registered_roi_overlay" data-semantic-scene="registered_roi_overlay" data-semantic-entities="reference_roi|current_roi|alignment" data-specialist-coverage="reference_roi|current_roi|alignment" data-semantic-relation="align before differencing" data-must-show="兩張 ROI 疊合 | crosshair 表示 registration；exposure slider 表示相同光度規則 | 邊界提示：未對齊或曝光漂移不可被當成 motion。" data-not-claim="未對齊或曝光漂移不可被當成 motion。"><title>先對齊再比較</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="registered_roi_overlay" data-specialist-coverage="reference_roi|current_roi|alignment"><rect x="141.04000000000002" y="72.42" width="218.96" height="128.82" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M162.93600000000004 166.4586 L213.29680000000002 132.9654 L254.8992 154.8648 L320.58720000000005 104.625" fill="none" stroke="#93B8E8" stroke-width="3"/><rect x="213.29680000000002" y="104.625" width="78.8256" height="55.392599999999995" rx="4" fill="none" stroke="#F38B00" stroke-width="3" stroke-dasharray="6 4"/><rect x="211.88000000000002" y="90.5" width="218.96" height="128.82" rx="8" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="3"/><path d="M233.776 184.53859999999997 L284.13680000000005 151.0454 L325.73920000000004 172.9448 L391.4272 122.705" fill="none" stroke="#93B8E8" stroke-width="3"/><rect x="270.99920000000003" y="122.705" width="78.8256" height="55.392599999999995" rx="4" fill="none" stroke="#F38B00" stroke-width="3" stroke-dasharray="6 4"/><path d="M340.68 67.9v149.16 M256.96000000000004 142.48h167.44" stroke="#F38B00" stroke-width="3" stroke-dasharray="5 4"/><line x1="128.16000000000003" y1="232.88" x2="269.84000000000003" y2="232.88" stroke="#F38B00" stroke-width="4" marker-end="url(#arrow-orange)"/><text data-label-line="true" x="424.4" y="237.4" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">ROI 對齊</text></g></g><text x="42" y="311.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#0B2858">讀圖：先對齊再比較</text><text x="42" y="339.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="700" fill="#8A5600">候選先交 REVIEW／HOLD；完整邊界見圖下說明。</text></svg>