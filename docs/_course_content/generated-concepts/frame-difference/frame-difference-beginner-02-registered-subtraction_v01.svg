<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">先對準同一 ROI，再算 absolute difference：Dₜ = |Iₜ − I(t-k)|</title>
  <desc id="desc">兩張固定 ROI 的 conveyor frame 經 registration/photometric contract 後相減，得到兩個物件位置的 absolute difference region。</desc>
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173b70" flood-opacity=".18"/>
    </filter>
    <marker id="arrow-1b6ee8" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1b6ee8"/></marker>
    <marker id="arrow-f48112" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f48112"/></marker>
    <marker id="arrow-e04c62" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e04c62"/></marker>
  </defs>
  <rect width="1672" height="941" fill="#f7fbff"/><rect width="1672" height="10" fill="#102c58"/><rect x="40" y="34" width="418" height="38" rx="19" fill="#1769e0" opacity=".12"/><text x="60" y="58" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#1769e0">registered subtraction</text><text x="40" y="126" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="39" font-weight="850" fill="#092d61">先對準同一 ROI，再算 absolute difference：Dₜ = |Iₜ − I(t-k)|</text><text x="40" y="168" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="600" fill="#4d6e9d">相減前的 ROI、可選 registration 與光度規則決定差分裡究竟是局部改變，還是把相機／曝光變化一起算進去。</text><rect x="1325" y="35" width="307" height="48" rx="24" fill="#ffffff" stroke="#98beff" stroke-width="2"/><text x="1478" y="67" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="850" fill="#1769e0">FRAME DIFFERENCE</text><clipPath id="sub-before-clip"><rect x="52" y="242" width="400" height="282" rx="22"/></clipPath><g clip-path="url(#sub-before-clip)"><svg x="52" y="242" width="400" height="282" viewBox="0 180 1672 620" preserveAspectRatio="xMidYMid slice"><image href="frame-difference-aoi-conveyor-clean_v01.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/></svg></g><rect x="52" y="242" width="400" height="282" rx="22" fill="none" stroke="#1769e0" stroke-width="3"/><rect x="70" y="257" width="316" height="38" rx="19" fill="#1769e0" opacity=".12"/><text x="90" y="281" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#1769e0">reference I(t-k)</text><rect x="94" y="302" width="318" height="175" rx="8" fill="none" stroke="#1769e0" stroke-width="3" stroke-dasharray="10 8"/><text x="106" y="292" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#1769e0">fixed ROI</text><g opacity="1.0" filter="url(#soft-shadow)"><rect x="150" y="385" width="106" height="54" rx="9" fill="#1769e0" stroke="#ffffff" stroke-width="3"/><rect x="165" y="397" width="76" height="30" rx="5" fill="#9bc7ff" opacity=".94"/><path d="M 178 420 L 200 405 L 226 420" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><clipPath id="sub-now-clip"><rect x="52" y="554" width="400" height="282" rx="22"/></clipPath><g clip-path="url(#sub-now-clip)"><svg x="52" y="554" width="400" height="282" viewBox="0 180 1672 620" preserveAspectRatio="xMidYMid slice"><image href="frame-difference-aoi-conveyor-clean_v01.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/></svg></g><rect x="52" y="554" width="400" height="282" rx="22" fill="none" stroke="#1769e0" stroke-width="3"/><rect x="70" y="569" width="214" height="38" rx="19" fill="#1769e0" opacity=".12"/><text x="90" y="593" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#1769e0">current Iₜ</text><rect x="94" y="614" width="318" height="175" rx="8" fill="none" stroke="#1769e0" stroke-width="3" stroke-dasharray="10 8"/><text x="106" y="604" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="850" fill="#1769e0">fixed ROI</text><g opacity="1.0" filter="url(#soft-shadow)"><rect x="278" y="697" width="106" height="54" rx="9" fill="#1769e0" stroke="#ffffff" stroke-width="3"/><rect x="293" y="709" width="76" height="30" rx="5" fill="#9bc7ff" opacity=".94"/><path d="M 306 732 L 328 717 L 354 732" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M 468 383 L 618 383" fill="none" stroke="#1b6ee8" stroke-width="6" stroke-linecap="round"  marker-end="url(#arrow-1b6ee8)"/><path d="M 468 696 L 618 696" fill="none" stroke="#1b6ee8" stroke-width="6" stroke-linecap="round"  marker-end="url(#arrow-1b6ee8)"/><rect x="632" y="275" width="410" height="535" rx="28" fill="#ffffff" stroke="#1769e0" stroke-width="3"/><text x="837" y="326" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="27" font-weight="850" fill="#173b70">same-coordinate contract</text><text x="837" y="370" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="650" fill="#42638e"><tspan x="837" dy="0">fixed ROI</tspan><tspan x="837" dy="34">optional registration</tspan><tspan x="837" dy="34">photometric normalization</tspan></text><path d="M 711 513 L 960 513" stroke="#1769e0" stroke-width="5" stroke-dasharray="10 8"/><text x="837" y="563" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="850" fill="#1769e0">then subtract</text><text x="837" y="617" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="32" font-weight="850" fill="#1769e0">Dₜ = | Iₜ − I(t-k) |</text><text x="837" y="669" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="700" fill="#58729b">absolute magnitude only</text><path d="M 1060 544 L 1132 544" fill="none" stroke="#f48112" stroke-width="6" stroke-linecap="round"  marker-end="url(#arrow-f48112)"/><rect x="1144" y="243" width="460" height="566" rx="28" fill="#182b42" stroke="#f48112" stroke-width="3"/><text x="1374" y="294" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="27" font-weight="850" fill="#ffffff">difference image Dₜ</text><text x="1374" y="328" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="650" fill="#cfe3ff">changed-pixel magnitude</text><rect x="1192" y="371" width="364" height="292" rx="18" fill="#243a54" stroke="#5a789a" stroke-width="2"/><rect x="1242" y="479" width="92" height="50" rx="9" fill="#f48112" opacity=".96"/><rect x="1420" y="479" width="92" height="50" rx="9" fill="#f48112" opacity=".96"/><text x="1374" y="704" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffe4bb">two changed regions, not a motion vector</text><rect x="40" y="855" width="1592" height="55" rx="26" fill="#fff3cf" stroke="#f0ad25" stroke-width="2"/><path d="M 76 878 q 12 -20 24 0 q -2 20 -12 20 q -10 0 -12 -20 M 88 866 v-14 M 63 878 h-13 M 113 878 h13" fill="none" stroke="#d18a00" stroke-width="3" stroke-linecap="round"/><text x="124" y="889" text-anchor="start" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial, sans-serif" font-size="21" font-weight="800" fill="#885c00">Dₜ 是既定座標下的絕對差；不輸出移動方向、速度、物件身分或物理原因。</text>
</svg>
