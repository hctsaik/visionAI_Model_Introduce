<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">DefectFill：LoRA-adapted text encoder and U-Net attention 對受遮罩區域提出 synthetic expression</title><desc id="desc">指定 base inpainting checkpoint 和 LoRA adapters 接收 reference、normal target 與 placement mask；未遮罩背景保留 normal target，遮罩區像素仍只是 synthetic candidate。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-129B86" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#129B86"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D94B62"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092754"/><text x="42" y="99.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#092754" text-anchor="start">LoRA 學的是缺陷概念；inpainting 只在 planned mask 裡提出 synthetic 表達</text><text x="42" y="147.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">指定 base checkpoint 與 LoRA adapters 共同定義生成路徑。未遮罩背景保持 normal target，遮罩內的像素仍是 synthetic candidate。</text><rect x="1144" y="34" width="488" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1388" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">DEFECTFILL · SYNTHETIC AUGMENTATION</text><text x="50" y="210.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#12346C" text-anchor="start">versioned inputs</text><g data-entity="defectfill_physical_aoi" data-contract="source physical inspection context"><clipPath id="crop-lora-reference-50-242-900-215"><rect x="50" y="242" width="280" height="188" rx="24"/></clipPath><g clip-path="url(#crop-lora-reference-50-242-900-215)"><svg x="50" y="242" width="280" height="188" viewBox="900 215 465 390" preserveAspectRatio="xMidYMid slice"><image href="../../../roadmap-model-selection/diffusion-restoration/defectfill/images/source/DEFECTFILL-01-engineer-synthetic-defect-review_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="50" y="242" width="280" height="188" rx="24" fill="none" stroke="#00A8C6" stroke-width="3"/></g><g data-entity="planned_placement_mask"><path d="M106.18 298.0 C149.36 271.0, 253.5 277.0, 271.28 314.5 C289.06 358.0, 223.02 383.5, 154.44 371.5 C93.48 358.0, 83.32 320.5, 106.18 298.0Z" fill="#00A8C6" fill-opacity=".17" stroke="#00A8C6" stroke-width="5" stroke-dasharray="10 7"/><rect x="71" y="265" width="205" height="36" rx="17" fill="#00A8C6" stroke="#00A8C6" stroke-width="0"/><text x="173.5" y="292.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">reference mask</text></g><text x="190" y="459.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#00A8C6" text-anchor="middle">few real reference + reviewed mask</text><g data-entity="defectfill_physical_aoi" data-contract="source physical inspection context"><clipPath id="crop-lora-normal-50-500-900-215"><rect x="50" y="500" width="280" height="188" rx="24"/></clipPath><g clip-path="url(#crop-lora-normal-50-500-900-215)"><svg x="50" y="500" width="280" height="188" viewBox="900 215 465 390" preserveAspectRatio="xMidYMid slice"><image href="../../../roadmap-model-selection/diffusion-restoration/defectfill/images/source/DEFECTFILL-01-engineer-synthetic-defect-review_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="50" y="500" width="280" height="188" rx="24" fill="none" stroke="#1769E0" stroke-width="3"/></g><g data-entity="planned_placement_mask"><path d="M106.18 556.0 C149.36 529.0, 253.5 535.0, 271.28 572.5 C289.06 616.0, 223.02 641.5, 154.44 629.5 C93.48 616.0, 83.32 578.5, 106.18 556.0Z" fill="#F28B00" fill-opacity=".17" stroke="#F28B00" stroke-width="5" stroke-dasharray="10 7"/><rect x="71" y="523" width="205" height="36" rx="17" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="173.5" y="550.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">planned placement</text></g><text x="190" y="717.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#1769E0" text-anchor="middle">normal target + placement</text><path d="M353 350 L424 350" fill="none" stroke="#00A8C6" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><path d="M353 594 L424 594" fill="none" stroke="#F28B00" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><rect x="446" y="225" width="576" height="496" rx="30" fill="#F4F0FF" stroke="#7657C8" stroke-width="4"/><text x="734" y="275.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#12346C" text-anchor="middle">named base inpainting checkpoint</text><text x="734" y="309.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#7657C8" text-anchor="middle">+ LoRA concept adapters</text><rect x="501" y="355" width="201" height="192" rx="22" fill="#FFFFFF" stroke="#1769E0" stroke-width="3"/><text x="602" y="396.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#12346C" text-anchor="middle">text encoder</text><text x="602" y="431.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#1769E0" text-anchor="middle">LoRA adapter</text><text x="602" y="486.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="middle">defect / object</text><text x="602" y="515.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="middle">learning setup</text><rect x="766" y="355" width="201" height="192" rx="22" fill="#FFFFFF" stroke="#7657C8" stroke-width="3"/><text x="866" y="396.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#12346C" text-anchor="middle">U-Net attention</text><text x="866" y="431.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#7657C8" text-anchor="middle">LoRA adapter</text><text x="866" y="486.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="middle">attention loss</text><text x="866" y="515.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D94B62" text-anchor="middle">not a defect score</text><path d="M 602 564 C 666 616 805 616 866 564" fill="none" stroke="#7657C8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-7657C8)" stroke-dasharray="8 7"/><text x="734" y="648.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D94B62" text-anchor="middle">checkpoint / code / LoRA rank + weights remain traceable</text><path d="M1044 474 L1107 474" fill="none" stroke="#7657C8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="1125" y="225" width="490" height="496" rx="30" fill="#FFF7EB" stroke="#F28B00" stroke-width="4"/><text x="1370" y="274.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#12346C" text-anchor="middle">masked denoising trajectory</text><g data-entity="defectfill_physical_aoi" data-contract="source physical inspection context"><clipPath id="crop-lora-output-1170-318-900-215"><rect x="1170" y="318" width="195" height="177" rx="15"/></clipPath><g clip-path="url(#crop-lora-output-1170-318-900-215)"><svg x="1170" y="318" width="195" height="177" viewBox="900 215 465 390" preserveAspectRatio="xMidYMid slice"><image href="../../../roadmap-model-selection/diffusion-restoration/defectfill/images/source/DEFECTFILL-01-engineer-synthetic-defect-review_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="1170" y="318" width="195" height="177" rx="15" fill="none" stroke="#1769E0" stroke-width="3"/></g><g data-entity="planned_placement_mask"><path d="M1211.07 373.04 C1240.14 347.3, 1310.25 353.02, 1322.22 388.77 C1334.19 430.24, 1289.73 454.55, 1243.56 443.11 C1202.52 430.24, 1195.68 394.49, 1211.07 373.04Z" fill="#F28B00" fill-opacity=".17" stroke="#F28B00" stroke-width="5" stroke-dasharray="10 7"/><rect x="1190" y="342" width="155" height="36" rx="17" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="1267.5" y="369.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">only here</text></g><g data-entity="synthetic_visual_expression"><path d="M1211.84 426.65 C1238.36 374.15, 1275.8 440.3, 1321.04 374.15" fill="none" stroke="#F28B00" stroke-width="12" stroke-linecap="round"/><path d="M1216.52 424.55 C1243.04 379.4, 1280.48 436.1, 1316.3600000000001 376.25" fill="none" stroke="#F5B835" stroke-width="4" stroke-linecap="round"/></g><text x="1473" y="369.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#12346C" text-anchor="middle">unmasked background</text><text x="1473" y="400.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#149A62" text-anchor="middle">keeps normal target</text><text x="1473" y="456.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#12346C" text-anchor="middle">masked region</text><text x="1473" y="487.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D94B62" text-anchor="middle">synthetic expression</text><rect x="1170" y="550" width="400" height="101" rx="20" fill="#FFFFFF" stroke="#F28B00" stroke-width="2"/><text x="1370" y="586.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#F28B00" text-anchor="middle">seed · scheduler · steps · guidance</text><text x="1370" y="618.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D94B62" text-anchor="middle">generation trace, not physical validation</text><rect x="50" y="759" width="1565" height="54" rx="18" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="833" y="794.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">LoRA-adapted inpainting proposes a synthetic image/mask inside a planned region; it does not create a real captured defect or a calibrated label.</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">學到的 token／attention 與 sampled pixels 都屬生成狀態；要與 raw source、mask、LoRA 與 seed 一起保存。</text></svg>