<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">DefectFill：只有固定下游與獨立 real holdout 能評估 augmentation benefit</title><desc id="desc">固定 real baseline、synthetic volume 和 downstream training recipe 後，以獨立 REAL HOLDOUT 的分層 benefit、label integrity、coverage、failure gallery、P95/cost 和 domain review 決定 HOLD or revise。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-129B86" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#129B86"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D94B62"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092754"/><text x="42" y="99.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#092754" text-anchor="start">只有 real holdout 能回答：合成 augmentation 是否真的改善下游任務？</text><text x="42" y="147.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">固定 real baseline、synthetic volume、downstream recipe 與分層切分；產生圖的外觀與 LFS 不能代替真實資料上的 evidence。</text><rect x="1144" y="34" width="488" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1388" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">DEFECTFILL · SYNTHETIC AUGMENTATION</text><text x="52" y="210.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#12346C" text-anchor="start">frozen experiment</text><rect x="52" y="241" width="414" height="355" rx="27" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="3"/><text x="259" y="284.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#12346C" text-anchor="middle">same downstream recipe</text><rect x="82" y="326" width="354" height="83" rx="17" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><rect x="92" y="338" width="334" height="8" rx="4" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="259.0" y="373.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#12346C" text-anchor="middle">real baseline</text><text x="259.0" y="398.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">fixed train split</text><rect x="82" y="426" width="354" height="83" rx="17" fill="#FFFFFF" stroke="#F28B00" stroke-width="2"/><rect x="92" y="438" width="334" height="8" rx="4" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="259.0" y="473.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#12346C" text-anchor="middle">synthetic volume</text><text x="259.0" y="498.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#F28B00" text-anchor="middle">versioned candidate data</text><text x="259" y="553.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="middle">classifier / segmenter stays fixed</text><path d="M489 420 L553 420" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="571" y="243" width="379" height="353" rx="28" fill="#F4F0FF" stroke="#7657C8" stroke-width="4"/><text x="760" y="285.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#12346C" text-anchor="middle">downstream training</text><text x="760" y="321.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#7657C8" text-anchor="middle">controlled augmentation experiment</text><path d="M612 351 L907 351" fill="none" stroke="#D8D0F8" stroke-width="2" stroke-linecap="round"/><text x="760" y="397.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#F28B00" text-anchor="middle">synthetic data may enter</text><text x="760" y="428.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="middle">only as a versioned candidate</text><text x="760" y="486.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="middle">training output is not</text><text x="760" y="515.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="middle">production decision</text><path d="M972 420 L1035 420" fill="none" stroke="#7657C8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="1054" y="220" width="560" height="403" rx="29" fill="#EFFAF4" stroke="#149A62" stroke-width="4"/><text x="1334" y="264.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#149A62" text-anchor="middle">independent REAL HOLDOUT</text><g data-entity="defectfill_physical_aoi" data-contract="source physical inspection context"><clipPath id="crop-holdout-real-1084-299-900-215"><rect x="1084" y="299" width="205" height="187" rx="15"/></clipPath><g clip-path="url(#crop-holdout-real-1084-299-900-215)"><svg x="1084" y="299" width="205" height="187" viewBox="900 215 465 390" preserveAspectRatio="xMidYMid slice"><image href="../../../roadmap-model-selection/diffusion-restoration/defectfill/images/source/DEFECTFILL-01-engineer-synthetic-defect-review_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="1084" y="299" width="205" height="187" rx="15" fill="none" stroke="#149A62" stroke-width="3"/></g><rect x="1102" y="319" width="161" height="36" rx="17" fill="#149A62" stroke="#149A62" stroke-width="0"/><text x="1182.5" y="346.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">real image only</text><text x="1432" y="332.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#12346C" text-anchor="middle">stratify by</text><text x="1432" y="363.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#149A62" text-anchor="middle">defect × recipe</text><text x="1432" y="420.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">label integrity</text><text x="1432" y="451.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="middle">coverage + failure gallery</text><text x="1334" y="546.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#149A62" text-anchor="middle">real metrics + calibration + full P95/cost + domain review</text><text x="1334" y="581.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">generated image never enters this holdout</text><rect x="52" y="677" width="1562" height="137" rx="26" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="833" y="720.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#12346C" text-anchor="middle">evidence gate</text><text x="833" y="757.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">show stratified real-holdout benefit · label integrity · mode coverage · failure review · specialist acceptance</text><text x="833" y="789.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D94B62" text-anchor="middle">if any part is unknown or worsens: HOLD / revise the augmentation experiment; do not use visual realism as a shortcut.</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">DefectFill is selected only when a fixed experiment improves independent real evidence; it never supplies release labels or a production decision.</text></svg>