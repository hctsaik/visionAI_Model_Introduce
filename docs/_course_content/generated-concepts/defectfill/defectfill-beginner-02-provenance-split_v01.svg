<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">DefectFill：reference mask normal target placement 與 real holdout 的 lineage 必須隔離</title><desc id="desc">資料 lineage 圖：few real reference、normal target、planned placement 和 split assignment 形成可追溯 source contract；synthetic-only branch 不得污染獨立 REAL HOLDOUT。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-129B86" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#129B86"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D94B62"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092754"/><text x="42" y="99.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#092754" text-anchor="start">先封存資料 lineage：reference、mask 與 real holdout 不能互相滲漏</text><text x="42" y="147.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">DefectFill 的第一個工程問題不是生成品質，而是能否證明 source、placement、split、license 與 synthetic volume 都可追溯。</text><rect x="1144" y="34" width="488" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1388" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">DEFECTFILL · SYNTHETIC AUGMENTATION</text><text x="50" y="211.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#12346C" text-anchor="start">real evidence registry</text><g data-entity="defectfill_physical_aoi" data-contract="source physical inspection context"><clipPath id="crop-provenance-context-50-244-0-0"><rect x="50" y="244" width="344" height="388" rx="24"/></clipPath><g clip-path="url(#crop-provenance-context-50-244-0-0)"><svg x="50" y="244" width="344" height="388" viewBox="0 0 1010 920" preserveAspectRatio="xMidYMid slice"><image href="../../../roadmap-model-selection/diffusion-restoration/defectfill/images/source/DEFECTFILL-01-engineer-synthetic-defect-review_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="50" y="244" width="344" height="388" rx="24" fill="none" stroke="#1769E0" stroke-width="3"/></g><rect x="74" y="267" width="184" height="36" rx="17" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="166.0" y="294.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">real source</text><text x="222" y="671.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#12346C" text-anchor="middle">source hash · sensor/recipe · ROI</text><path d="M415 425 L480 425" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="500" y="221" width="562" height="431" rx="29" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="3"/><text x="781" y="267.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#12346C" text-anchor="middle">freeze before generation</text><circle cx="551" cy="309" r="13" fill="#00A8C6" stroke="none" stroke-width="0"/><text x="582" y="316.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#12346C" text-anchor="start">few real reference</text><text x="582" y="343.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#00A8C6" text-anchor="start">image + reviewed mask + source hash</text><path d="M540 359 L1018 359" fill="none" stroke="#DCE9F8" stroke-width="2" stroke-linecap="round"/><circle cx="551" cy="384" r="13" fill="#1769E0" stroke="none" stroke-width="0"/><text x="582" y="391.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#12346C" text-anchor="start">normal target</text><text x="582" y="418.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="start">sensor / recipe / ROI / taxonomy</text><path d="M540 434 L1018 434" fill="none" stroke="#DCE9F8" stroke-width="2" stroke-linecap="round"/><circle cx="551" cy="459" r="13" fill="#F28B00" stroke="none" stroke-width="0"/><text x="582" y="466.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#12346C" text-anchor="start">planned placement</text><text x="582" y="493.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#F28B00" text-anchor="start">placement policy + mask version</text><path d="M540 509 L1018 509" fill="none" stroke="#DCE9F8" stroke-width="2" stroke-linecap="round"/><circle cx="551" cy="534" r="13" fill="#7657C8" stroke="none" stroke-width="0"/><text x="582" y="541.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#12346C" text-anchor="start">split assignment</text><text x="582" y="568.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#7657C8" text-anchor="start">real train / REAL HOLDOUT</text><text x="781" y="629.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="middle">unknown source / split / license → HOLD</text><path d="M1082 425 L1140 425" fill="none" stroke="#F28B00" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><rect x="1155" y="220" width="461" height="218" rx="27" fill="#FFF7EB" stroke="#F28B00" stroke-width="3"/><text x="1385" y="264.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#F28B00" text-anchor="middle">synthetic-only branch</text><text x="1385" y="304.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">reference + normal target + placement</text><text x="1385" y="336.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="middle">may enter generation / downstream training</text><rect x="1295" y="360" width="180" height="37" rx="17" fill="#D94B62" stroke="#D94B62" stroke-width="0"/><text x="1385.0" y="387.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">SYNTHETIC</text><text x="1385" y="421.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">never becomes real evidence</text><rect x="1155" y="494" width="461" height="158" rx="27" fill="#EFFAF4" stroke="#149A62" stroke-width="3"/><text x="1385" y="536.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#149A62" text-anchor="middle">independent REAL HOLDOUT</text><text x="1385" y="570.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">real images + qualified labels only</text><text x="1385" y="604.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">no reference / mask / synthetic leakage</text><path d="M 1310 439 C 1260 458 1240 474 1244 517" fill="none" stroke="#D94B62" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-D94B62)" stroke-dasharray="9 8"/><text x="1184" y="471.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="start">blocked</text><rect x="50" y="715" width="1566" height="99" rx="23" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="833" y="754.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#12346C" text-anchor="middle">provenance bundle: source hash · reviewed mask · taxonomy · placement · split · license · synthetic/real ID</text><text x="833" y="790.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D94B62" text-anchor="middle">若 reference、style、mask 或 holdout 有 leakage，任何 downstream gain 都失去解讀資格。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">先鎖真實資料切分，再生成 synthetic；REAL HOLDOUT 是隔離的驗證資料，不是可被補圖的區域。</text></svg>