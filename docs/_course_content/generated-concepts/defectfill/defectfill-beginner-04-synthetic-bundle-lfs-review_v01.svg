idth="5" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="1140" y="520" width="472" height="209" rx="27" fill="#EFFAF4" stroke="#149A62" stroke-width="3"/><text x="1376" y="562.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#149A62" text-anchor="middle">synthetic training bundle</text><circle cx="1210" cy="598" r="7" fill="#1769E0" stroke="none" stroke-width="0"/><text x="1230" y="604.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#12346C" text-anchor="start">image + placement mask</text><circle cx="1210" cy="627" r="7" fill="#F28B00" stroke="none" stroke-width="0"/><text x="1230" y="633.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#12346C" text-anchor="start">seed / sampler / steps / guidance</text><circle cx="1210" cy="656" r="7" fill="#7657C8" stroke="none" stroke-width="0"/><text x="1230" y="662.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#12346C" text-anchor="start">base + LoRA + prompt revision</text><circle cx="1210" cy="685" r="7" fill="#149A62" stroke="none" stroke-width="0"/><text x="1230" y="691.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#12346C" text-anchor="start">provenance + reviewer record</text><rect x="50" y="755" width="984" height="59" rx="19" fill="#FFF1F3" stroke="#D94B62" stroke-width="2"/><text x="542" y="790.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D94B62" text-anchor="middle">LFS 高分或看起來合理，不等於 scale、texture、edge、illumination 或 process semantics 真實。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">每個被選的 synthetic sample 都只能進候選資料集；先留 failure gallery，再由 real holdout 決定有沒有用。</text></svg>