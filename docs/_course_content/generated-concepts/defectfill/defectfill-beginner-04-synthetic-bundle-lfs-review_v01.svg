<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">DefectFill：LFS 選擇 synthetic visual expression，但不是 fidelity 或 label 真值</title><desc id="desc">多個 seed/sampling proposals 經 LFS/quality review 選為 synthetic training bundle；bundle 保存 image mask provenance trace and reviewer，不證明物理或真實效益。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-129B86" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#129B86"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D94B62"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092754"/><text x="42" y="99.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#092754" text-anchor="start">LFS 只是在多個 synthetic proposal 中挑一個較強的視覺表達</text><text x="42" y="147.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">選中的畫面仍要連同 image、mask、seed、sampling、LoRA 與 reviewer 打包；LFS 不驗證物理、label integrity 或真實效益。</text><rect x="1144" y="34" width="488" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1388" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">DEFECTFILL · SYNTHETIC AUGMENTATION</text><text x="50" y="210.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#12346C" text-anchor="start">same normal target + planned placement</text><g data-entity="defectfill_physical_aoi" data-contract="source physical inspection context"><clipPath id="crop-lfs-normal-50-242-900-215"><rect x="50" y="242" width="296" height="342" rx="24"/></clipPath><g clip-path="url(#crop-lfs-normal-50-242-900-215)"><svg x="50" y="242" width="296" height="342" viewBox="900 215 465 390" preserveAspectRatio="xMidYMid slice"><image href="../../../roadmap-model-selection/diffusion-restoration/defectfill/images/source/DEFECTFILL-01-engineer-synthetic-defect-review_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="50" y="242" width="296" height="342" rx="24" fill="none" stroke="#1769E0" stroke-width="3"/></g><g data-entity="planned_placement_mask"><path d="M112.2 339.96000000000004 C156.4 289.2, 263.0 300.48, 281.2 370.98 C299.4 452.76, 231.8 500.7, 161.6 478.14 C99.2 452.76, 88.8 382.26, 112.2 339.96000000000004Z" fill="#F28B00" fill-opacity=".17" stroke="#F28B00" stroke-width="5" stroke-dasharray="10 7"/><rect x="76" y="270" width="205" height="36" rx="17" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="178.5" y="297.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">placement</text></g><text x="198" y="622.0" 