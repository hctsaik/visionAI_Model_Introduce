<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">SegFormer semantic task and output</title><desc id="desc">An image and pixel-label contract pass through MiT and an all-MLP decoder to form per-pixel class logits and a semantic mask, not instances or metrology.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0B9E92" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0B9E92"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-139A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#139A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0A2450"/><text x="42" y="101.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="36" font-weight="900" fill="#0A2450" text-anchor="start">SegFormer：把每個像素分成已知語意類別</text><text x="42" y="148.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">先看完整責任鏈：影像與 pixel labels 定義任務，MiT＋MLP 產生 K-channel logits，再形成 semantic mask。</text><rect x="1382" y="34" width="250" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1507" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#1769E0" text-anchor="middle">SegFormer · semantic</text><rect x="42" y="178" width="238" height="42" rx="21" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><text x="161.0" y="206.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">INPUT · 影像</text><rect x="391" y="178" width="238" height="42" rx="21" fill="#FFFFFF" stroke="#F28B00" stroke-width="2"/><text x="510.0" y="206.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#F28B00" text-anchor="middle">TARGET · 標註</text><rect x="742" y="178" width="278" height="42" rx="21" fill="#FFFFFF" stroke="#7657C8" stroke-width="2"/><text x="881.0" y="206.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#7657C8" text-anchor="middle">MODEL · SegFormer</text><rect x="1132" y="178" width="220" height="42" rx="21" fill="#FFFFFF" stroke="#0B9E92" stroke-width="2"/><text x="1242.0" y="206.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0B9E92" text-anchor="middle">OUTPUT · logits</text><rect x="1434" y="178" width="198" height="42" rx="21" fill="#FFFFFF" stroke="#139A63" stroke-width="2"/><text x="1533.0" y="206.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#139A63" text-anchor="middle">MASK · 語意</text><clipPath id="crop-deep-task-42-246-720-40"><rect x="42" y="246" width="260" height="340" rx="22"/></clipPath><g clip-path="url(#crop-deep-task-42-246-720-40)"><svg x="42" y="246" width="260" height="340" viewBox="720 40 920 900" preserveAspectRatio="xMidYMid slice"><image href="segformer-beginner-01-wafer-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="42" y="246" width="260" height="340" rx="22" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="108" y="384" width="91" height="65" rx="8" fill="none" stroke="#F28B00" stroke-width="4"/><text x="172" y="625.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#102E62" text-anchor="middle">同一 raw AOI／ROI</text><path d="M314 416 L375 416" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="390" y="246" width="240" height="340" rx="22" fill="#F8FBFF" stroke="#0B9E92" stroke-width="2"/><clipPath id="mask-390-246"><circle cx="510.0" cy="416.0" r="100.8"/></clipPath><circle cx="510.0" cy="416.0" r="100.8" fill="#103E4C" stroke="#0A7180" stroke-width="3"/><g clip-path="url(#mask-390-246)"><path d="M433.2 320.8 C498.0 273.2, 550.8 314.0, 538.8 405.79999999999995 C493.2 429.6, 445.2 399.0, 433.2 320.8Z" fill="#55C8C2" fill-opacity=".88"/><path d="M445.2 484.0 L565.2 371.8" stroke="#F5B835" stroke-width="8.4" stroke-linecap="round"/><circle cx="562.8" cy="490.79999999999995" r="10.799999999999999" fill="#F28B00"/></g><text x="510" y="625.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#F28B00" text-anchor="middle">每個 pixel 的 class／ignore</text><path d="M646 416 L724 416" fill="none" stroke="#F28B00" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><rect x="740" y="246" width="282" height="340" rx="24" fill="#F7F4FF" stroke="#7657C8" stroke-width="2"/><text x="881" y="295.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#7657C8" text-anchor="middle">MiT encoder</text><rect x="786" y="326" width="190" height="34" rx="9" fill="#1769E0" fill-opacity="0.16" stroke="#1769E0" stroke-width="0"/><text x="986" y="350.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="start">S1</text><rect x="786" y="378" width="154" height="34" rx="9" fill="#00A8C6" fill-opacity="0.16" stroke="#00A8C6" stroke-width="0"/><text x="950" y="402.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#00A8C6" text-anchor="start">S2</text><rect x="786" y="430" width="118" height="34" rx="9" fill="#7657C8" fill-opacity="0.16" stroke="#7657C8" stroke-width="0"/><text x="914" y="454.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7657C8" text-anchor="start">S3</text><rect x="786" y="482" width="82" height="34" rx="9" fill="#F28B00" fill-opacity="0.16" stroke="#F28B00" stroke-width="0"/><text x="878" y="506.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F28B00" text-anchor="start">S4</text><text x="881" y="548.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#0B9E92" text-anchor="middle">All-MLP decoder</text><path d="M1038 416 L1116 416" fill="none" stroke="#7657C8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="1130" y="246" width="224" height="340" rx="24" fill="#EFFCF9" stroke="#0B9E92" stroke-width="2"/><text x="1242" y="295.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#0B9E92" text-anchor="middle">K-channel logits</text><text x="1160" y="342.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="start">coating</text><rect x="1160" y="357" width="150" height="22" rx="7" fill="#DDE8F5" stroke="#DDE8F5" stroke-width="0"/><rect x="1160" y="357" width="122.99999999999999" height="22" rx="7" fill="#0B9E92" stroke="#0B9E92" stroke-width="0"/><text x="1160" y="411.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="start">scribe</text><rect x="1160" y="426" width="150" height="22" rx="7" fill="#DDE8F5" stroke="#DDE8F5" stroke-width="0"/><rect x="1160" y="426" width="19.5" height="22" rx="7" fill="#F5B835" stroke="#F5B835" stroke-width="0"/><text x="1160" y="480.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="start">gap</text><rect x="1160" y="495" width="150" height="22" rx="7" fill="#DDE8F5" stroke="#DDE8F5" stroke-width="0"/><rect x="1160" y="495" width="7.5" height="22" rx="7" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="1242" y="548.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#102E62" text-anchor="middle">每個位置都有 K 個分數</text><path d="M1370 416 L1418 416" fill="none" stroke="#0B9E92" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-0B9E92)"/><rect x="1432" y="246" width="200" height="340" rx="22" fill="#F8FBFF" stroke="#0B9E92" stroke-width="2"/><clipPath id="mask-1432-246"><circle cx="1532.0" cy="416.0" r="84.0"/></clipPath><circle cx="1532.0" cy="416.0" r="84.0" fill="#103E4C" stroke="#0A7180" stroke-width="3"/><g clip-path="url(#mask-1432-246)"><path d="M1468.0 320.8 C1522.0 273.2, 1566.0 314.0, 1556.0 405.79999999999995 C1518.0 429.6, 1478.0 399.0, 1468.0 320.8Z" fill="#55C8C2" fill-opacity=".88"/><path d="M1478.0 484.0 L1578.0 371.8" stroke="#F5B835" stroke-width="8" stroke-linecap="round"/><circle cx="1576.0" cy="490.79999999999995" r="10" fill="#F28B00"/></g><text x="1532" y="625.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#139A63" text-anchor="middle">argmax／resize 後的 mask</text><rect x="42" y="692" width="760" height="117" rx="18" fill="#F1FBF7" stroke="#139A63" stroke-width="2"/><text x="72" y="732.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#139A63" text-anchor="start">它會交付</text><text x="72" y="768.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="700" fill="#102E62" text-anchor="start">每個像素的已知類別 logits／semantic mask，可回映到原圖。</text><rect x="830" y="692" width="802" height="117" rx="18" fill="#FFF4F5" stroke="#D94B62" stroke-width="2"/><text x="860" y="732.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#D94B62" text-anchor="start">它不會自動交付</text><text x="860" y="768.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="700" fill="#102E62" text-anchor="start">物件 instance ID、物理尺寸、缺陷根因，或產品 PASS／FAIL。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">先分清輸出責任：漂亮的 semantic mask 仍是像素類別候選，不是量測與放行結論。</text></svg>