<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">SegFormer all-MLP decoder shapes</title><desc id="desc">C1 through C4 are linearly projected, resized to one-quarter resolution, concatenated, fused, and classified into K-channel logits.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0B9E92" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0B9E92"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-139A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#139A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0A2450"/><text x="42" y="101.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="36" font-weight="900" fill="#0A2450" text-anchor="start">All-MLP decoder：把 C1～C4 對齊到 H/4，再輸出 K 類 logits</text><text x="42" y="148.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">這是一條可追 shape 的資料流；upsample 只做格點對齊，不會創造 encoder 沒保留下來的細節。</text><rect x="1382" y="34" width="250" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1507" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#1769E0" text-anchor="middle">SegFormer · semantic</text><rect x="58" y="245" width="244" height="82" rx="15" fill="#F8FBFF" stroke="#1769E0" stroke-width="2"/><text x="84" y="278.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#1769E0" text-anchor="start">C1</text><text x="84" y="307.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#102E62" text-anchor="start">H/4 × W/4 × C₁</text><path d="M316 286 L376 286" fill="none" stroke="#1769E0" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="390" y="245" width="218" height="82" rx="15" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><text x="499" y="279.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#1769E0" text-anchor="middle">Linear projection</text><text x="499" y="306.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">→ D channels</text><path d="M622 286 L682 286" fill="none" stroke="#1769E0" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="696" y="245" width="232" height="82" rx="15" fill="#EFFCF9" stroke="#0B9E92" stroke-width="2"/><text x="812" y="279.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#0B9E92" text-anchor="middle">bilinear resize</text><text x="812" y="306.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">→ H/4 × W/4 × D</text><path d="M944 286 C1010 286 1010 455 1068 455" fill="none" stroke="#1769E0" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="58" y="367" width="244" height="82" rx="15" fill="#F8FBFF" stroke="#00A8C6" stroke-width="2"/><text x="84" y="400.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#00A8C6" text-anchor="start">C2</text><text x="84" y="429.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#102E62" text-anchor="start">H/8 × W/8 × C₂</text><path d="M316 408 L376 408" fill="none" stroke="#00A8C6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><rect x="390" y="367" width="218" height="82" rx="15" fill="#FFFFFF" stroke="#00A8C6" stroke-width="2"/><text x="499" y="401.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#00A8C6" text-anchor="middle">Linear projection</text><text x="499" y="428.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">→ D channels</text><path d="M622 408 L682 408" fill="none" stroke="#00A8C6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><rect x="696" y="367" width="232" height="82" rx="15" fill="#EFFCF9" stroke="#0B9E92" stroke-width="2"/><text x="812" y="401.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#0B9E92" text-anchor="middle">bilinear resize</text><text x="812" y="428.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">→ H/4 × W/4 × D</text><path d="M944 408 C1010 408 1010 455 1068 455" fill="none" stroke="#00A8C6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><rect x="58" y="489" width="244" height="82" rx="15" fill="#F8FBFF" stroke="#7657C8" stroke-width="2"/><text x="84" y="522.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#7657C8" text-anchor="start">C3</text><text x="84" y="551.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#102E62" text-anchor="start">H/16 × W/16 × C₃</text><path d="M316 530 L376 530" fill="none" stroke="#7657C8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="390" y="489" width="218" height="82" rx="15" fill="#FFFFFF" stroke="#7657C8" stroke-width="2"/><text x="499" y="523.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#7657C8" text-anchor="middle">Linear projection</text><text x="499" y="550.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">→ D channels</text><path d="M622 530 L682 530" fill="none" stroke="#7657C8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="696" y="489" width="232" height="82" rx="15" fill="#EFFCF9" stroke="#0B9E92" stroke-width="2"/><text x="812" y="523.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#0B9E92" text-anchor="middle">bilinear resize</text><text x="812" y="550.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">→ H/4 × W/4 × D</text><path d="M944 530 C1010 530 1010 455 1068 455" fill="none" stroke="#7657C8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="58" y="611" width="244" height="82" rx="15" fill="#F8FBFF" stroke="#F28B00" stroke-width="2"/><text x="84" y="644.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#F28B00" text-anchor="start">C4</text><text x="84" y="673.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#102E62" text-anchor="start">H/32 × W/32 × C₄</text><path d="M316 652 L376 652" fill="none" stroke="#F28B00" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><rect x="390" y="611" width="218" height="82" rx="15" fill="#FFFFFF" stroke="#F28B00" stroke-width="2"/><text x="499" y="645.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#F28B00" text-anchor="middle">Linear projection</text><text x="499" y="672.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">→ D channels</text><path d="M622 652 L682 652" fill="none" stroke="#F28B00" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><rect x="696" y="611" width="232" height="82" rx="15" fill="#EFFCF9" stroke="#0B9E92" stroke-width="2"/><text x="812" y="645.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#0B9E92" text-anchor="middle">bilinear resize</text><text x="812" y="672.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">→ H/4 × W/4 × D</text><path d="M944 652 C1010 652 1010 455 1068 455" fill="none" stroke="#F28B00" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><rect x="1080" y="302" width="198" height="305" rx="22" fill="#F1FBF7" stroke="#0B9E92" stroke-width="2"/><text x="1179" y="348.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#0B9E92" text-anchor="middle">concat</text><text x="1179" y="381.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="700" fill="#52688D" text-anchor="middle">4D channels</text><rect x="1123" y="418" width="112" height="24" rx="7" fill="#1769E0" fill-opacity="0.65" stroke="#1769E0" stroke-width="0"/><rect x="1123" y="456" width="112" height="24" rx="7" fill="#00A8C6" fill-opacity="0.65" stroke="#00A8C6" stroke-width="0"/><rect x="1123" y="494" width="112" height="24" rx="7" fill="#7657C8" fill-opacity="0.65" stroke="#7657C8" stroke-width="0"/><rect x="1123" y="532" width="112" height="24" rx="7" fill="#F28B00" fill-opacity="0.65" stroke="#F28B00" stroke-width="0"/><path d="M1292 455 L1342 455" fill="none" stroke="#0B9E92" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-0B9E92)"/><rect x="1354" y="302" width="244" height="305" rx="22" fill="#FFF8EC" stroke="#F28B00" stroke-width="2"/><text x="1476" y="350.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#F28B00" text-anchor="middle">fuse + predict</text><text x="1476" y="388.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">1×1 fuse</text><text x="1476" y="420.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">dropout</text><text x="1476" y="452.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">1×1 classifier</text><rect x="1394" y="493" width="164" height="67" rx="12" fill="#FFFFFF" stroke="#F28B00" stroke-width="2"/><text x="1476" y="522.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#102E62" text-anchor="middle">H/4 × W/4</text><text x="1476" y="548.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F28B00" text-anchor="middle">× K logits</text><rect x="58" y="759" width="1540" height="56" rx="18" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="828" y="795.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#102E62" text-anchor="middle">實作檢查：輸出 K 必須等於本地 label classes；回原圖前還要保存 resize、padding、argmax 與 inverse mapping。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">decoder 很輕量，但輸出 shape 與座標責任不輕；每一個 resize／padding／回映步驟都要可重播。</text></svg>