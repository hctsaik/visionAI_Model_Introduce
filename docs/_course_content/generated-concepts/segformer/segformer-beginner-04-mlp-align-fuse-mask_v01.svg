<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">SegFormer MLP alignment, fusion, and candidate mask</title><desc id="desc">Per-scale MLP projections align to one grid, fuse into semantic logits, then create a semantic candidate mask for review or hold.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0B9E92" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0B9E92"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-139A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#139A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0A2450"/><text x="42" y="101.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="36" font-weight="900" fill="#0A2450" text-anchor="start">MLP decoder：先對齊四個尺度，再融合為語意候選圖</text><text x="42" y="148.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">每個 scale 先經 MLP projection，再上採樣至共同格點、concat/fuse，才由 head 得到 pixel logits 與 semantic mask candidate。</text><rect x="1382" y="34" width="250" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1507" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#1769E0" text-anchor="middle">SegFormer · semantic</text><text x="64" y="234.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#102E62" text-anchor="start">同一 raw AOI</text><clipPath id="crop-mlp-raw-64-264-790-120"><rect x="64" y="264" width="294" height="322" rx="22"/></clipPath><g clip-path="url(#crop-mlp-raw-64-264-790-120)"><svg x="64" y="264" width="294" height="322" viewBox="790 120 750 700" preserveAspectRatio="xMidYMid slice"><image href="segformer-beginner-01-wafer-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="64" y="264" width="294" height="322" rx="22" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="202" y="401" width="88" height="57" rx="8" fill="none" stroke="#F28B00" stroke-width="4"/><text x="211" y="615.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">raw evidence 保留</text><text x="211" y="640.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">decoder 不會補回未觀測細節</text><path d="M372 430 L426 430" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><text x="575" y="229.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#102E62" text-anchor="middle">四尺度 feature → MLP projection</text><rect x="448" y="266" width="224" height="46" 