engHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">最大容量候選</text><rect x="1215" y="654" width="357" height="62" rx="8" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="1393.5" y="692.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">同資料／硬體：IoU、boundary、memory、P95</text><rect x="58" y="754" width="734" height="79" rx="16" fill="#F2F7FF" stroke="#1769E0" stroke-width="2"/><text x="86" y="785.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#1769E0" text-anchor="start">論文 evidence</text><text x="86" y="814.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#102E62" text-anchor="start">B4：ADE20K 50.3 mIoU／64M；B5：Cityscapes val 84.0 mIoU。</text><rect x="824" y="754" width="748" height="79" rx="16" fill="#FFF4F5" stroke="#D94B62" stroke-width="2"/><text x="852" y="785.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="start">不可直接推論</text><text x="852" y="814.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#102E62" text-anchor="start">不同資料、解析度、硬體與推論策略下，paper 數字不是 fab operating point。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">模型越大不代表現場越好；只有本地 critical recall、boundary、memory、P95 與 review load 能回答是否值得升級。</text></svg>