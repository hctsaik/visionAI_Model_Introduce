<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">SegFormer B0 through B5</title><desc id="desc">B0 through B5 share the design and scale channel widths and stage depths; local latency, memory, boundary, and review evidence determine selection.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0B9E92" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0B9E92"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-139A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#139A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0A2450"/><text x="42" y="101.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="36" font-weight="900" fill="#0A2450" text-anchor="start">B0～B5：同一設計族，主要差在寬度與 stage depth</text><text x="42" y="148.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">不要把編號當品質等級；先以 B0／B1 建立延遲與記憶體基線，再用本地資料判斷更大模型是否值得。</text><rect x="1382" y="34" width="250" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1507" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#1769E0" text-anchor="middle">SegFormer · semantic</text><rect x="58" y="204" width="100" height="56" rx="10" fill="#102E62" stroke="#102E62" stroke-width="0"/><text x="108.0" y="239.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">Variant</text><rect x="172" y="204" width="300" height="56" rx="10" fill="#102E62" stroke="#102E62" stroke-width="0"/><text x="322.0" y="239.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">Stage channels</text><rect x="492" y="204" width="250" height="56" rx="10" fill="#102E62" stroke="#102E62" stroke-width="0"/><text x="617.0" y="239.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">Stage depths</text><rect x="762" y="204" width="203" height="56" rx="10" fill="#102E62" stroke="#102E62" stroke-width="0"/><text x="863.5" y="239.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">Parameters</text><rect x="985" y="204" width="210" height="56" rx="10" fill="#102E62" stroke="#102E62" stroke-width="0"/><text x="1090.0" y="239.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">定位</text><rect x="1215" y="204" width="357" height="56" rx="10" fill="#102E62" stroke="#102E62" stroke-width="0"/><text x="1393.5" y="239.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">本地要補的證據</text><rect x="58" y="274" width="100" height="62" rx="8" fill="#FFFFFF" stroke="#1769E0" stroke-width="1"/><text x="108.0" y="312.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">B0</text><rect x="172" y="274" width="300" height="62" rx="8" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="322.0" y="312.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">32·64·160·256</text><rect x="492" y="274" width="250" height="62" rx="8" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="617.0" y="312.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">2·2·2·2</text><rect x="762" y="274" width="203" height="62" rx="8" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="863.5" y="312.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">約 3.8M</text><rect x="985" y="274" width="210" height="62" rx="8" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="1090.0" y="312.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">延遲／記憶體優先</text><rect x="1215" y="274" width="357" height="62" rx="8" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="1393.5" y="312.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">同資料／硬體：IoU、boundary、memory、P95</text><rect x="58" y="350" width="100" height="62" rx="8" fill="#FFFFFF" stroke="#00A8C6" stroke-width="1"/><text x="108.0" y="388.0" font-fami