<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">SegFormer hold boundaries</title><desc id="desc">Tiny signals, label ambiguity, tile seams, instance identity, and metrology needs are explicit review or hold boundaries.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0B9E92" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0B9E92"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-139A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#139A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0A2450"/><text x="42" y="101.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="36" font-weight="900" fill="#0A2450" text-anchor="start">薄、小、模糊、接縫與實例需求：語意遮罩不能自動結論</text><text x="42" y="148.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">同一片 wafer 的候選 mask 只回答 pixel class；有效像素、label policy、stitch 與 decision unit 不清楚時，請停在 HOLD。</text><rect x="1382" y="34" width="250" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1507" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#1769E0" text-anchor="middle">SegFormer · semantic</text><text x="66" y="228.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#102E62" text-anchor="start">同一 raw wafer：三種會誤導你的情況</text><clipPath id="crop-hold-raw-66-260-690-20"><rect x="66" y="260" width="420" height="438" rx="22"/></clipPath><g clip-path="url(#crop-hold-raw-66-260-690-20)"><svg x="66" y="260" width="420" height="438" viewBox="690 20 930 900" preserveAspectRatio="xMidYMid slice"><image href="segformer-beginner-01-wafer-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="66" y="260" width="420" height="438" rx="22" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="240" y="456" width="50" height="38" rx="7" fill="none" stroke="#F28B00" stroke-width="4"/><text x="264" y="525.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F28B00" text-anchor="middle">tiny / thin</text><path d="M332 300 L332 650" stroke="#D94B62" stroke-width="4" stroke-dasharray="10 8"/><text x="350" y="330.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="start">tile seam</text><circle cx="191" cy="365" r="43" fill="none" stroke="#0B9E92" stroke-width="4"/><text x="191" y="420.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#0B9E92" text-anchor="middle">semantic region</text><text x="276" y="741.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#D94B62" text-anchor="middle">不要把這些標記直接當 defect truth</text><path d="M500 324 L560 324" fill="none" stroke="#F28B00" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><text x="583" y="303.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#102E62" text-anchor="start">A · thin / tiny feature</text><rect x="583" y="325" width="152" height="78" rx="14" fill="#F8FBFF" stroke="#1769E0" stroke-width="2"/><rect x="596" y="338" width="20" height="20" rx="4" fill="#9FC4FF" fill-opacity="0.6" stroke="#9FC4FF" stroke-width="0"/><rect x="623" y="338" width="20" height="20" rx="4" fill="#9FC4FF" fill-opacity="0.6" stroke="#9FC4FF" stroke-width="0"/><rect x="650" y="338" width="20" height="20" rx="4" fill="#9FC4FF" fill-opacity="0.6" stroke="#9FC4FF" stroke-width="0"/><rect x="677" y="338" width="20" height="20" rx="4" fill="#9FC4FF" fill-opacity="0.6" stroke="#9FC4FF" stroke-width="0"/><rect x="704" y="338" width="20" height="20" rx="4" fill="#9FC4FF" fill-opacity="0.6" stroke="#9FC4FF" stroke-width="0"/><rect x="596" y="367" width="20" height="20" rx="4" fill="#9FC4FF" fill-opacity="0.6" stroke="#9FC4FF" stroke-width="0"/><rect x="623" y="367" width="20" height="20" rx="4" fill="#9FC4FF" fill-opacity="0.6" stroke="#9FC4FF" stroke-width="0"/><rect x="650" y="367" width="20" height="20" rx="4" fill="#9FC4FF" fill-opacity="0.6" stroke="#9FC4FF" stroke-width="0"/><rect x="677" y="367" width="20" height="20" rx="4" fill="#9FC4FF" fill-opacity="0.6" stroke="#9FC4FF" stroke-width="0"/><rect x="704" y="367" width="20" height="20" rx="4" fill="#9FC4FF" fill-opacity="0.6" stroke="#9FC4FF" stroke-width="0"/><path d="M748 364 L800 364" fill="none" stroke="#F28B00" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><text x="823" y="343" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#D94B62" text-anchor="start">downsample 後</text><text x="823" y="368" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#D94B62" text-anchor="start">+有效像素可能不足</text><rect x="1128" y="317" width="418" height="91" rx="16" fill="#FFF6F7" stroke="#D94B62" stroke-width="2"/><text x="1337" y="351.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="middle">HOLD：以 critical recall / stride</text><text x="1337" y="381.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#102E62" text-anchor="middle">與 raw ROI failure set 重驗</text><path d="M548 455 L1554 455" stroke="#9FC4FF" stroke-width="2"/><path d="M500 505 L560 505" fill="none" stroke="#D94B62" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-D94B62)"/><text x="583" y="485.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#102E62" text-anchor="start">B · boundary policy + tile seam</text><rect x="583" y="506" width="118" height="76" rx="12" fill="#123E4A" stroke="#0B9E92" stroke-width="2"/><path d="M601 564 L674 524" stroke="#F5B835" stroke-width="10" stroke-linecap="round"/><rect x="644" y="535" width="25" height="24" rx="4" fill="none" stroke="#D94B62" stroke-width="3" stroke-dasharray=""/><text x="642" y="605.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">policy A</text><rect x="730" y="506" width="118" height="76" rx="12" fill="#123E4A" stroke="#0B9E92" stroke-width="2"/><path d="M748 564 L821 524" stroke="#F5B835" stroke-width="10" stroke-linecap="round"/><rect x="791" y="535" width="25" height="24" rx="4" fill="none" stroke="#D94B62" stroke-width="3" stroke-dasharray="7 5"/><text x="789" y="605.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#D94B62" text-anchor="middle">policy B / ignore</text><path d="M896 497 L896 588" stroke="#D94B62" stroke-width="4" stroke-dasharray="7 6"/><text x="920" y="530" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#D94B62" text-anchor="start">tile seam / stitch</text><text x="920" y="554" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#D94B62" text-anchor="start">+不是自然消失</text><rect x="1128" y="481" width="418" height="143" rx="16" fill="#FFF6F7" stroke="#D94B62" stroke-width="2"/><text x="1337" y="519.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="middle">HOLD：版本化 label / ignore</text><text x="1337" y="548.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#102E62" text-anchor="middle">與 crop / overlap / stitch recipe</text><text x="1337" y="578.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">target 不清，threshold 也無法補救</text><path d="M548 663 L1554 663" stroke="#9FC4FF" stroke-width="2"/><path d="M500 709 L560 709" fill="none" stroke="#0B9E92" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-0B9E92)"/><text x="583" y="690.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#102E62" text-anchor="start">C · semantic class ≠ instance / measurement</text><rect x="583" y="708" width="166" height="67" rx="12" fill="#123E4A" stroke="#0B9E92" stroke-width="2"/><rect x="607" y="723" width="48" height="36" rx="6" fill="#0B9E92" stroke="#A7FFF3" stroke-width="2"/><rect x="661" y="723" width="48" height="36" rx="6" fill="#0B9E92" stroke="#A7FFF3" stroke-width="2"/><path d="M764 742 L817 742" fill="none" stroke="#0B9E92" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-0B9E92)"/><text x="840" y="731" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#D94B62" text-anchor="start">同一 class region</text><text x="840" y="756" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#D94B62" text-anchor="start">+不等於 object ID 或 CD</text><rect x="1128" y="691" width="418" height="105" rx="16" fill="#FFF9EC" stroke="#F28B00" stroke-width="2"/><text x="1337" y="727.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#F28B00" text-anchor="middle">HOLD：改走 instance pipeline</text><text x="1337" y="756.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#102E62" text-anchor="middle">或經 calibration / repeatability</text><text x="1337" y="780.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">/ uncertainty gate 的量測流程</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">SegFormer 交付的是 semantic candidate；薄小訊號、模糊標註、接縫、instance 與量測需求，都應保留 review / HOLD。</text></svg>