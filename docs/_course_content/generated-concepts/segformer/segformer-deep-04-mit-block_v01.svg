xt><path d="M1014 494 L1066 494" fill="none" stroke="#7657C8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="1070" y="463" width="38" height="63" rx="15" fill="#F8FBFF" stroke="#7657C8" stroke-width="2"/><rect x="1084.0" y="475.0" width="10.0" height="16.0" rx="4" fill="#C4B8F0" fill-opacity="0.9" stroke="#C4B8F0" stroke-width="0"/><rect x="1084.0" y="498.0" width="10.0" height="16.0" rx="4" fill="#C4B8F0" fill-opacity="0.9" stroke="#C4B8F0" stroke-width="0"/><text x="852" y="582.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#102E62" text-anchor="middle">sr ratios：8 → 4 → 2 → 1</text><text x="852" y="615.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">Q 保持位置；K／V 減少 token 後再 attention</text><rect x="1144" y="397" width="104" height="86" rx="14" fill="#F8FBFF" stroke="#1769E0" stroke-width="2"/><text x="1196.0" y="449.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="middle">Linear</text><path d="M1252 440 L1264 440" fill="none" stroke="#1769E0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="1272" y="397" width="136" height="86" rx="14" fill="#F8FBFF" stroke="#0B9E92" stroke-width="2"/><text x="1340.0" y="449.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#0B9E92" text-anchor="middle">3×3 DWConv</text><path d="M1412 440 L1418 440" fill="none" stroke="#0B9E92" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-0B9E92)"/><rect x="1426" y="397" width="104" height="86" rx="14" fill="#F8FBFF" stroke="#F28B00" stroke-width="2"/><text x="1478.0" y="449.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F28B00" text-anchor="middle">GELU</text><path d="M1534 440 L1524 440" fill="none" stroke="#F28B00" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><rect x="1532" y="397" width="104" height="86" rx="14" fill="#F8FBFF" stroke="#7657C8" stroke-width="2"/><text x="1584.0" y="449.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7657C8" text-anchor="middle">Linear</text><text x="1372" y="552.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#102E62" text-anchor="middle">DWConv 在 token 中注入局部空間關係</text><rect x="1182" y="580" width="382" height="81" rx="16" fill="#F1FBF7" stroke="#139A63" stroke-width="2"/><text x="1373" y="613.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#139A63" text-anchor="middle">不使用 positional encoding</text><text x="1373" y="643.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">避免解析度改變時插值位置向量</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">三件事要一起理解：overlap 保存鄰域、SR attention 控成本、Mix-FFN 提供空間線索並移除 positional encoding。</text></svg>