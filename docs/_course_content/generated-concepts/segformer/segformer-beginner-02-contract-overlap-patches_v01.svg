<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">SegFormer fixed contract and overlapping patches</title><desc id="desc">One wafer AOI is governed by a replayable ROI, label, tile, and model contract before overlapping patch embedding.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0B9E92" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0B9E92"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-139A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#139A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0A2450"/><text x="42" y="101.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="36" font-weight="900" fill="#0A2450" text-anchor="start">先鎖定同一張影像的座標、標註與切圖契約</text><text x="42" y="148.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">SegFormer 不從「任意圖片」開始：ROI、resize、labels、ignore、tile/overlap 與 MiT checkpoint 都要可重播。</text><rect x="1382" y="34" width="250" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1507" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#1769E0" text-anchor="middle">SegFormer · semantic</text><text x="72" y="228.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#102E62" text-anchor="start">同一片 wafer AOI</text><clipPath id="crop-contract-raw-72-260-670-30"><rect x="72" y="260" width="540" height="432" rx="22"/></clipPath><g clip-path="url(#crop-contract-raw-72-260-670-30)"><svg x="72" y="260" width="540" height="432" viewBox="670 30 990 890" preserveAspectRatio="xMidYMid slice"><image href="segformer-beginner-01-wafer-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="72" y="260" width="540" height="432" rx="22" fill="none" stroke="#1769E0" stroke-width="2"/><rect x="267" y="427" width="176" height="102" rx="10" fill="none" stroke="#F28B00" stroke-width="4"/><rect x="166" y="540" width="376" height="74" rx="13" fill="#FFFFFF" fill-opacity="0.92" stroke="#FFFFFF" stroke-width="0"/><text x="354" y="568.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#F28B00" text-anchor="middle">固定 ROI / 座標原點</text><text x="354" y="597.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">同一 raw evidence</text><path d="M628 472 L704 472" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="718" y="220" width="454" height="508" rx="26" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="945" y="268.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#102E62" text-anchor="middle">一張可重播的 contract</text><circle cx="804" cy="322" r="9" fill="#1769E0"/><text x="830" y="329.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#102E62" text-anchor="start">ROI + resize</text><text x="830" y="358.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="600" fill="#52688D" text-anchor="start">輸入座標與像素尺度固定</text><circle cx="804" cy="420" r="9" fill="#F28B00"/><text x="830" y="427.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#102E62" text-anchor="start">pixel classes</text><text x="830" y="456.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="600" fill="#52688D" text-anchor="start">class / ignore / boundary policy</text><circle cx="804" cy="518" r="9" fill="#0B9E92"/><text x="830" y="525.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#102E62" text-anchor="start">tile + overlap</text><text x="830" y="554.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="600" fill="#52688D" text-anchor="start">訓練與推論使用同一套 recipe</text><circle cx="804" cy="616" r="9" fill="#7657C8"/><text x="830" y="623.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#102E62" text-anchor="start">MiT variant</text><text x="830" y="652.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="600" fill="#52688D" text-anchor="start">checkpoint / pretraining / decoder 版本</text><rect x="752" y="654" width="386" height="43" rx="14" fill="#F3FBF8" stroke="#139A63" stroke-width="1"/><text x="945" y="682.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#139A63" text-anchor="middle">每個欄位都能回查，不靠記憶</text><path d="M1189 472 L1252 472" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><text x="1416" y="228.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#102E62" text-anchor="middle">overlapping patch embedding</text><clipPath id="crop-overlap-1244-260-760-80"><rect x="1244" y="260" width="348" height="432" rx="22"/></clipPath><g clip-path="url(#crop-overlap-1244-260-760-80)"><svg x="1244" y="260" width="348" height="432" viewBox="760 80 850 820" preserveAspectRatio="xMidYMid slice"><image href="segformer-beginner-01-wafer-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="1244" y="260" width="348" height="432" rx="22" fill="none" stroke="#00A8C6" stroke-width="2"/><rect x="1272" y="288" width="146" height="126" rx="12" fill="#DFF5FF" fill-opacity="0.22" stroke="#00A8C6" stroke-width="3"/><rect x="1328" y="334" width="146" height="126" rx="12" fill="#DFF5FF" fill-opacity="0.22" stroke="#00A8C6" stroke-width="3"/><rect x="1384" y="380" width="146" height="126" rx="12" fill="#DFF5FF" fill-opacity="0.22" stroke="#00A8C6" stroke-width="3"/><rect x="1314" y="438" width="146" height="126" rx="12" fill="#DFF5FF" fill-opacity="0.22" stroke="#00A8C6" stroke-width="3"/><rect x="1260" y="608" width="316" height="67" rx="13" fill="#FFFFFF" fill-opacity="0.92" stroke="#FFFFFF" stroke-width="0"/><text x="1418" y="636.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#00A8C6" text-anchor="middle">相鄰 patch 看見重疊區域</text><text x="1418" y="663.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="middle">不是把座標／標籤契約丟掉</text><rect x="72" y="759" width="1520" height="55" rx="18" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="832" y="794.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#102E62" text-anchor="middle">模型前的契約會決定後面每一個 semantic pixel 能否被解釋、重播與比較。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">先固定 contract；resize、tile 與 label policy 改了，候選 mask 的意義也跟著改。</text></svg>