<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">mask 必須過 boundary/seam gate</title><desc id="desc">SegFormer 的 semantic mask 要經 stitch、inverse mapping 和 boundary/seam/critical recall gate。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="semantic_mask_seam_gate" data-renderer-art="classifier_or_mask" data-primitive="mask_seam_review" data-semantic-scene="mask_seam_review" data-semantic-entities="mask|boundary_seam|raw_image|review_gate" data-specialist-coverage="mask|boundary_seam|raw_image|review_gate" data-semantic-relation="check a mask at seams and boundaries" data-must-show="pixel logits 經 argmax | stitch | inverse map | 再量 boundary error 和 seam error" data-not-claim="paper mIoU 不等於本地 mask 可放行。"><title>mask 必須過 boundary/seam gate</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="147.48" y1="132.44" x2="246.03999999999996" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="313.79999999999995" y1="132.44" x2="412.36" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="480.12" y1="132.44" x2="572.52" y2="132.44" stroke="#F38B00" stroke-width="4" marker-end="url(#arrow-orange)"/><path d="M606.4 53.39999999999999L620.96 67.96L606.4 82.52L591.8399999999999 67.96z" fill="#FFF4CC" stroke="#C88400" stroke-w