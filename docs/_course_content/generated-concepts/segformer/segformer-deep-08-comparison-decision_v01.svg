<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">SegFormer fair comparison and decision</title><desc id="desc">Semantic, instance, and metrology outputs are separated before comparing U-Net, DeepLabV3+, SETR, SegFormer, and YOLO-Seg under a shared evidence contract.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0B9E92" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0B9E92"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-139A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#139A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0A2450"/><text x="42" y="101.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="36" font-weight="900" fill="#0A2450" text-anchor="start">先分輸出責任，再比較架構：SegFormer 不是所有分割問題的答案</text><text x="42" y="148.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">Semantic、instance 與 metrology 是不同任務；同為 semantic 時，再用 context、資料、邊界、成本與部署條件選方法。</text><rect x="1382" y="34" width="250" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1507" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#1769E0" text-anchor="middle">SegFormer · semantic</text><rect x="52" y="205" width="198" height="58" rx="10" fill="#102E62" stroke="#102E62" stroke-width="0"/><text x="151.0" y="242.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle">方法</text><rect x="260" y="205" width="396" height="58" rx="10" fill="#102E62" stroke="#102E62" stroke-width="0"/><text x="458.0" y="242.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle">架構重點</text><rect x="668" y="205" width="264" height="58" rx="10" fill="#102E62" stroke="#102E62" stroke-width="0"/><text x="800.0" y="242.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle">原生輸出</text><rect x="944" y="205" width="380" height="58" rx="10" fill="#102E62" stroke="#102E62" stroke-width="0"/><text x="1134.0" y="242.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle">何時放入候選</text><rect x="1336" y="205" width="284" height="58" rx="10" fill="#102E62" stroke="#102E62" stroke-width="0"/><text x="1478.0" y="242.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle">不能省略</text><rect x="52" y="280" width="198" height="72" rx="9" fill="#FFFFFF" stroke="#1769E0" stroke-width="1"/><text x="151.0" y="323.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">U-Net</text><rect x="260" y="280" width="396" height="72" rx="9" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="458.0" y="323.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">CNN encoder＋鏡像 decoder</text><rect x="668" y="280" width="264" height="72" rx="9" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="800.0" y="323.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">semantic mask</text><rect x="944" y="280" width="380" height="72" rx="9" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="1134.0" y="323.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">資料較少／局部細節基線</text><rect x="1336" y="280" width="284" height="72" rx="9" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="1478.0" y="323.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">同 split／pixels／P95／錯誤成本</text><rect x="52" y="369" width="198" height="72" rx="9" fill="#FFFFFF" stroke="#00A8C6" stroke-width="1"/><text x="151.0" y="412.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#00A8C6" text-anchor="middle">DeepLabV3+</text><rect x="260" y="369" width="396" height="72" rx="9" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="458.0" y="412.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">CNN＋dilated／context module</text><rect x="668" y="369" width="264" height="72" rx="9" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="800.0" y="412.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">semantic mask</text><rect x="944" y="369" width="380" height="72" rx="9" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="1134.0" y="412.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">成熟 CNN context 基線</text><rect x="1336" y="369" width="284" height="72" rx="9" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="1478.0" y="412.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">同 split／pixels／P95／錯誤成本</text><rect x="52" y="458" width="198" height="72" rx="9" fill="#FFFFFF" stroke="#7657C8" stroke-width="1"/><text x="151.0" y="501.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#7657C8" text-anchor="middle">SETR／plain ViT</text><rect x="260" y="458" width="396" height="72" rx="9" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="458.0" y="501.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">單一低解析 token map</text><rect x="668" y="458" width="264" height="72" rx="9" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="800.0" y="501.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">semantic mask</text><rect x="944" y="458" width="380" height="72" rx="9" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="1134.0" y="501.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">比較 hierarchy 的價值</text><rect x="1336" y="458" width="284" height="72" rx="9" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="1478.0" y="501.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">同 split／pixels／P95／錯誤成本</text><rect x="52" y="547" width="198" height="72" rx="9" fill="#FFFFFF" stroke="#0B9E92" stroke-width="1"/><text x="151.0" y="590.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0B9E92" text-anchor="middle">SegFormer</text><rect x="260" y="547" width="396" height="72" rx="9" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="458.0" y="590.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">MiT 四尺度＋All-MLP</text><rect x="668" y="547" width="264" height="72" rx="9" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="800.0" y="590.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">semantic mask</text><rect x="944" y="547" width="380" height="72" rx="9" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="1134.0" y="590.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">多尺度 context＋輕 decoder</text><rect x="1336" y="547" width="284" height="72" rx="9" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="1478.0" y="590.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">同 split／pixels／P95／錯誤成本</text><rect x="52" y="636" width="198" height="72" rx="9" fill="#FFFFFF" stroke="#F28B00" stroke-width="1"/><text x="151.0" y="679.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#F28B00" text-anchor="middle">YOLO-Seg</text><rect x="260" y="636" width="396" height="72" rx="9" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="458.0" y="679.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">box/class＋prototype mask</text><rect x="668" y="636" width="264" height="72" rx="9" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="800.0" y="679.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">instance masks</text><rect x="944" y="636" width="380" height="72" rx="9" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="1134.0" y="679.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">需要每個 object ID</text><rect x="1336" y="636" width="284" height="72" rx="9" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="1"/><text x="1478.0" y="679.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#102E62" text-anchor="middle">同 split／pixels／P95／錯誤成本</text><rect x="52" y="751" width="494" height="80" rx="16" fill="#F1FBF7" stroke="#139A63" stroke-width="2"/><text x="80" y="783.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#139A63" text-anchor="start">採用 SegFormer 前</text><text x="80" y="811.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#102E62" text-anchor="start">已知 classes、pixel labels、多尺度 context、成本可接受。</text><rect x="570" y="751" width="494" height="80" rx="16" fill="#FFF9E7" stroke="#F28B00" stroke-width="2"/><text x="598" y="783.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#F28B00" text-anchor="start">看到這些先 HOLD</text><text x="598" y="811.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#102E62" text-anchor="start">tiny 不可觀測、label／tile 未鎖、shift 未驗證。</text><rect x="1088" y="751" width="532" height="80" rx="16" fill="#FFF4F5" stroke="#D94B62" stroke-width="2"/><text x="1116" y="783.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="start">需要別的輸出責任</text><text x="1116" y="811.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#102E62" text-anchor="start">instance ID 改走 instance；尺寸另接 calibration／uncertainty。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">公平選型不是比模型名字；先固定任務、輸出單位、資料與錯誤成本，再讓本地 evidence 決定。</text></svg>