<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">SegFormer training and inference</title><desc id="desc">Training uses pixel labels and loss, while inference uses only an image to produce logits; sliding-window inference is an optional large-image strategy.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0B9E92" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0B9E92"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D94B62"/></marker><marker id="arrow-139A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#139A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0A2450"/><text x="42" y="101.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="36" font-weight="900" fill="#0A2450" text-anchor="start">不要把訓練與推論混成一條線：兩者使用不同證據</text><text x="42" y="148.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">訓練需要 pixel labels 與 loss；部署只接收影像並輸出 logits。sliding-window 是大圖策略，不是 MiT block。</text><rect x="1382" y="34" width="250" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1507" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#1769E0" text-anchor="middle">SegFormer · semantic</text><rect x="48" y="208" width="756" height="548" rx="26" fill="#F2F7FF" stroke="#1769E0" stroke-width="2"/><rect x="868" y="208" width="756" height="548" rx="26" fill="#F1FBF7" stroke="#0B9E92" stroke-width="2"/><text x="86" y="258.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#1769E0" text-anchor="start">TRAIN · 學會 pixel class</text><text x="906" y="258.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#0B9E92" text-anchor="start">INFERENCE · 對新影像產生 logits</text><rect x="84" y="304" width="646" height="61" rx="15" fill="#FFFFFF" stroke="#7657C8" stroke-width="2"/><circle cx="114" cy="334" r="22" fill="#7657C8"/><text x="114" y="341.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text><text x="152" y="331.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#7657C8" text-anchor="start">ImageNet-1K</text><text x="314" y="331.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="start">預訓練 MiT encoder</text><path d="M407 368 L407 383" fill="none" stroke="#7657C8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="84" y="387" width="646" height="61" rx="15" fill="#FFFFFF" stroke="#F28B00" stroke-width="2"/><circle cx="114" cy="417" r="22" fill="#F28B00"/><text x="114" y="424.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text><text x="152" y="414.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#F28B00" text-anchor="start">image + mask</text><text x="314" y="414.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="start">crop／pad／normalize</text><path d="M407 451 L407 466" fill="none" stroke="#F28B00" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><rect x="84" y="470" width="646" height="61" rx="15" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><circle cx="114" cy="500" r="22" fill="#1769E0"/><text x="114" y="507.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text><text x="152" y="497.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#1769E0" text-anchor="start">SegFormer</text><text x="314" y="497.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="start">forward → K logits</text><path d="M407 534 L407 549" fill="none" stroke="#1769E0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="84" y="553" width="646" height="61" rx="15" fill="#FFFFFF" stroke="#D94B62" stroke-width="2"/><circle cx="114" cy="583" r="22" fill="#D94B62"/><text x="114" y="590.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">4</text><text x="152" y="580.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#D94B62" text-anchor="start">loss</text><text x="314" y="580.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="start">ignore index／class policy</text><path d="M407 617 L407 632" fill="none" stroke="#D94B62" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-D94B62)"/><rect x="84" y="636" width="646" height="61" rx="15" fill="#FFFFFF" stroke="#139A63" stroke-width="2"/><circle cx="114" cy="666" r="22" fill="#139A63"/><text x="114" y="673.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">5</text><text x="152" y="663.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#139A63" text-anchor="start">update</text><text x="314" y="663.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="start">fine-tune encoder＋decoder</text><rect x="904" y="304" width="646" height="61" rx="15" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><circle cx="934" cy="334" r="22" fill="#1769E0"/><text x="934" y="341.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text><text x="972" y="331.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#1769E0" text-anchor="start">raw image</text><text x="1134" y="331.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="start">固定 ROI／resize／normalize</text><path d="M1227 368 L1227 383" fill="none" stroke="#1769E0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="904" y="387" width="646" height="61" rx="15" fill="#FFFFFF" stroke="#7657C8" stroke-width="2"/><circle cx="934" cy="417" r="22" fill="#7657C8"/><text x="934" y="424.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text><text x="972" y="414.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#7657C8" text-anchor="start">SegFormer</text><text x="1134" y="414.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="start">forward → H/4 logits</text><path d="M1227 451 L1227 466" fill="none" stroke="#7657C8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="904" y="470" width="646" height="61" rx="15" fill="#FFFFFF" stroke="#0B9E92" stroke-width="2"/><circle cx="934" cy="500" r="22" fill="#0B9E92"/><text x="934" y="507.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text><text x="972" y="497.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0B9E92" text-anchor="start">resize</text><text x="1134" y="497.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="start">logits 對齊目標／原圖</text><path d="M1227 534 L1227 549" fill="none" stroke="#0B9E92" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-0B9E92)"/><rect x="904" y="553" width="646" height="61" rx="15" fill="#FFFFFF" stroke="#F28B00" stroke-width="2"/><circle cx="934" cy="583" r="22" fill="#F28B00"/><text x="934" y="590.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">4</text><text x="972" y="580.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#F28B00" text-anchor="start">argmax</text><text x="1134" y="580.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="start">每 pixel 選已知 class</text><path d="M1227 617 L1227 632" fill="none" stroke="#F28B00" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><rect x="904" y="636" width="646" height="61" rx="15" fill="#FFFFFF" stroke="#139A63" stroke-width="2"/><circle cx="934" cy="666" r="22" fill="#139A63"/><text x="934" y="673.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">5</text><text x="972" y="663.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#139A63" text-anchor="start">review</text><text x="1134" y="663.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#52688D" text-anchor="start">保存 mask、版本與座標</text><rect x="48" y="780" width="1576" height="54" rx="18" fill="#FFF9E7" stroke="#F5B835" stroke-width="2"/><text x="836" y="815.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">大影像可選 sliding-window／overlap／stitch；若整張影像可直接推論，就不必把切圖當成模型必備模組。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">訓練證據是 labels、loss 與 split；推論證據是輸入、logits、resize、座標與 review。兩條線必須分開記錄。</text></svg>