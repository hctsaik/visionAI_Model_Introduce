<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Diffusion Restoration：degradation、route 或 domain 變更時，舊 x-hat 必須 HOLD</title><desc id="desc">完整 contract 的三個 checkpoints 變更後，保存 raw/old-new trace，重跑 fidelity、holdout、failure 和 review，不能從 changed x-hat 主張 ground truth 或 release。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#00A8C6"/></marker><marker id="arrow-129B86" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#129B86"/></marker><marker id="arrow-7657C8" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#D94B62"/></marker><marker id="arrow-149A62" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#149A62"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092754"/><text x="42" y="99.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#092754" text-anchor="start">condition 或 route 改了：舊 x-hat 先 HOLD</text><text x="42" y="147.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">Diffusion Restoration 的 output 綁定完整 degradation/estimate contract。改條件或跨 domain 時，舊 restored pixels、residual 與 runtime 宣稱不能直接沿用。</text><rect x="1102" y="34" width="530" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1367" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">DIFFUSION RESTORATION · ESTIMATE</text><text x="50" y="211.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#12346C" text-anchor="start">original capture does not change</text><g data-entity="diffusion_restoration_physical_aoi" data-contract="degraded raw capture remains evidence"><clipPath id="crop-hold-raw-50-244"><rect x="50" y="244" width="330" height="378" rx="24"/></clipPath><g clip-path="url(#crop-hold-raw-50-244)"><image href="../../../roadmap-model-selection/diffusion-restoration/diffusion-restoration/images/source/DIFFUSION-RESTORATION-01-engineer-story_v01.png" x="50" y="244" width="330" height="378" preserveAspectRatio="xMidYMid slice"/></g><rect x="50" y="244" width="330" height="378" rx="24" fill="none" stroke="#1769E0" stroke-width="3"/></g><g data-entity="degraded_raw_image"><rect x="50" y="244" width="330" height="378" rx="11" fill="#1769E0" fill-opacity="0.18" stroke="#1769E0" stroke-width="0"/><rect x="165.5" y="346.06" width="92.4" height="117.17999999999999" rx="5" fill="none" stroke="#D94B62" stroke-width="3"/><rect x="58" y="253" width="178" height="36" rx="17" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="147.0" y="280.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">raw y remains evidence</text></g><text x="215" y="662.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="middle">raw is not replaced by x-hat</text><path d="M403 431 L467 431" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="488" y="224" width="660" height="398" rx="29" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="3"/><text x="818" y="268.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#12346C" text-anchor="middle">one output depends on three checkpoints</text><rect x="532" y="325" width="170" height="178" rx="18" fill="#FFF7EB" stroke="#F28B00" stroke-width="3"/><text x="617" y="364.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#F28B00" text-anchor="middle">1. degradation</text><path d="M558 391 L676 391" fill="none" stroke="#F28B00" stroke-width="3" stroke-linecap="round"/><text x="617" y="424" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="middle">blur / noise / codec</text><text x="617" y="449" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="middle">condition</text><text x="617" y="480.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">versioned</text><rect x="743" y="325" width="170" height="178" rx="18" fill="#F4F0FF" stroke="#7657C8" stroke-width="3"/><text x="828" y="364.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#7657C8" text-anchor="middle">2. estimate route</text><path d="M769 391 L887 391" fill="none" stroke="#7657C8" stroke-width="3" stroke-linecap="round"/><text x="828" y="424" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="middle">checkpoint / steps</text><text x="828" y="449" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="middle">guidance / seed</text><text x="828" y="480.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">versioned</text><rect x="954" y="325" width="170" height="178" rx="18" fill="#EAFBFC" stroke="#129B86" stroke-width="3"/><text x="1039" y="364.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#129B86" text-anchor="middle">3. spatial/domain</text><path d="M980 391 L1098 391" fill="none" stroke="#129B86" stroke-width="3" stroke-linecap="round"/><text x="1039" y="424" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="middle">resolution / tile</text><text x="1039" y="449" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="middle">capture domain</text><text x="1039" y="480.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">versioned</text><text x="818" y="575.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="middle">old x-hat is valid only for the same complete contract</text><path d="M1174 431 L1235 431" fill="none" stroke="#D94B62" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-D94B62)"/><rect x="1254" y="224" width="362" height="398" rx="29" fill="#FFF1F3" stroke="#D94B62" stroke-width="4"/><text x="1435" y="277.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#D94B62" text-anchor="middle">CHANGE? → HOLD</text><circle cx="1303" cy="338" r="11" fill="#D94B62" stroke="none" stroke-width="0"/><text x="1331" y="345.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="start">degradation model / condition</text><circle cx="1303" cy="393" r="11" fill="#D94B62" stroke="none" stroke-width="0"/><text x="1331" y="400.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="start">checkpoint / sampling / tile</text><circle cx="1303" cy="448" r="11" fill="#D94B62" stroke="none" stroke-width="0"/><text x="1331" y="455.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="start">domain / capture / calibration</text><text x="1435" y="553.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="middle">save diff + stop the claim</text><rect x="50" y="687" width="1566" height="127" rx="23" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="833" y="724.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#12346C" text-anchor="middle">HOLD: keep raw y + old/new condition + old/new route + x-hat/residual/uncertainty traces</text><text x="833" y="753.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">then repeat controlled fidelity, real degraded holdout, failure gallery, full P95/cost, and specialist review</text><text x="833" y="788.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="middle">Do not infer recovered ground truth, defect existence, size, measurement, PASS, or release from a changed x-hat.</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">HOLD 保留 raw 與條件差異，而非刪除結果；它阻止先前的 restored estimate 被誤帶進新的 degradation、sampling 或 domain 情境。</text></svg>