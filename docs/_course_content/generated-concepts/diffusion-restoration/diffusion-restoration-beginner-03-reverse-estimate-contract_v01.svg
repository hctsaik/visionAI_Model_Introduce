<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Diffusion Restoration：declared degradation 和 versioned reverse diffusion route 共同決定 x-hat</title><desc id="desc">degraded y、condition、checkpoint、denoiser steps、guidance、seed、resolution 和 tile stitch 進入 route，形成 x-hat/residual/trace estimate bundle。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#00A8C6"/></marker><marker id="arrow-129B86" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#129B86"/></marker><marker id="arrow-7657C8" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#D94B62"/></marker><marker id="arrow-149A62" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#149A62"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092754"/><text x="42" y="99.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#092754" text-anchor="start">reverse estimate 取決於 degradation 與 sampling route</text><text x="42" y="147.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">同一 degraded y 若換 degradation condition、checkpoint、steps、guidance、seed、resolution 或 tile stitch，x-hat 的細節、artifact 和成本都可能不同。</text><rect x="1102" y="34" width="530" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1367" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">DIFFUSION RESTORATION · ESTIMATE</text><text x="50" y="210.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#12346C" text-anchor="start">versioned inputs</text><g data-entity="diffusion_restoration_physical_aoi" data-contract="degraded raw capture remains evidence"><clipPath id="crop-route-raw-50-242"><rect x="50" y="242" width="278" height="186" rx="24"/></clipPath><g clip-path="url(#crop-route-raw-50-242)"><image href="../../../roadmap-model-selection/diffusion-restoration/diffusion-restoration/images/source/DIFFUSION-RESTORATION-01-engineer-story_v01.png" x="50" y="242" width="278" height="186" preserveAspectRatio="xMaxYMid slice"/></g><rect x="50" y="242" width="278" height="186" rx="24" fill="none" stroke="#1769E0" stroke-width="3"/></g><g data-entity="degraded_raw_image"><rect x="50" y="242" width="278" height="186" rx="11" fill="#1769E0" fill-opacity="0.18" stroke="#1769E0" stroke-width="0"/><rect x="147.3" y="292.22" width="77.84" height="57.66" rx="5" fill="none" stroke="#D94B62" stroke-width="3"/><rect x="58" y="251" width="178" height="36" rx="17" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="147.0" y="278.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">degraded raw y</text></g><text x="189" y="456.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#1769E0" text-anchor="middle">degraded y + capture / ROI</text><rect x="50" y="500" width="278" height="81" rx="17" fill="#FFFFFF" stroke="#F28B00" stroke-width="2"/><rect x="60" y="512" width="258" height="8" rx="4" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="189.0" y="547.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#12346C" text-anchor="middle">degradation condition</text><text x="189.0" y="571.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#F28B00" text-anchor="middle">blur / noise / codec model</text><text x="189" y="613.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F28B00" text-anchor="middle">declared; not guessed afterward</text><path d="M351 348 L421 348" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><path d="M351 541 L421 541" fill="none" stroke="#F28B00" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><rect x="443" y="224" width="615" height="499" rx="30" fill="#F4F0FF" stroke="#7657C8" stroke-width="4"/><text x="750" y="272.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#12346C" text-anchor="middle">named reverse estimate route</text><text x="750" y="307.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#7657C8" text-anchor="middle">freeze the route before comparing x-hat</text><rect x="486" y="351" width="244" height="81" rx="17" fill="#FFFFFF" stroke="#7657C8" stroke-width="2"/><rect x="496" y="363" width="224" height="8" rx="4" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><text x="608.0" y="398.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#12346C" text-anchor="middle">checkpoint</text><text x="608.0" y="422.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#7657C8" text-anchor="middle">model prior + license/hash</text><rect x="768" y="351" width="244" height="81" rx="17" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><rect x="778" y="363" width="224" height="8" rx="4" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="890.0" y="398.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#12346C" text-anchor="middle">denoiser</text><text x="890.0" y="422.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">reverse steps + guidance</text><rect x="486" y="469" width="244" height="81" rx="17" fill="#FFFFFF" stroke="#129B86" stroke-width="2"/><rect x="496" y="481" width="224" height="8" rx="4" fill="#129B86" stroke="#129B86" stroke-width="0"/><text x="608.0" y="516.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#12346C" text-anchor="middle">sampling</text><text x="608.0" y="540.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#129B86" text-anchor="middle">sampler + seed</text><rect x="768" y="469" width="244" height="81" rx="17" fill="#FFFFFF" stroke="#F28B00" stroke-width="2"/><rect x="778" y="481" width="224" height="8" rx="4" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="890.0" y="516.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#12346C" text-anchor="middle">spatial path</text><text x="890.0" y="540.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#F28B00" text-anchor="middle">resolution / tile / stitch</text><text x="750" y="613.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D94B62" text-anchor="middle">GPU/VRAM · full P95 · trace bundle</text><text x="750" y="652.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="middle">any route change = a different estimate</text><path d="M1080 473 L1143 473" fill="none" stroke="#7657C8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="1161" y="224" width="454" height="499" rx="30" fill="#EAFBFC" stroke="#129B86" stroke-width="4"/><text x="1388" y="272.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#12346C" text-anchor="middle">visible estimate bundle</text><g data-entity="diffusion_restoration_physical_aoi" data-contract="degraded raw capture remains evidence"><clipPath id="crop-route-xhat-1201-316"><rect x="1201" y="316" width="184" height="172" rx="15"/></clipPath><g clip-path="url(#crop-route-xhat-1201-316)"><image href="../../../roadmap-model-selection/diffusion-restoration/diffusion-restoration/images/source/DIFFUSION-RESTORATION-01-engineer-story_v01.png" x="1201" y="316" width="184" height="172" preserveAspectRatio="xMaxYMid slice"/></g><rect x="1201" y="316" width="184" height="172" rx="15" fill="none" stroke="#129B86" stroke-width="3"/></g><g data-entity="restored_estimate"><rect x="1201" y="316" width="184" height="172" rx="11" fill="#129B86" fill-opacity="0.11" stroke="#129B86" stroke-width="0"/><path d="M1235.96 367.6 L1235.96 424.36" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M1230.44 374.48 L1350.04 374.48" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M1263.56 367.6 L1263.56 424.36" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M1230.44 388.24 L1350.04 388.24" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M1291.16 367.6 L1291.16 424.