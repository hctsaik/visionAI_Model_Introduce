ecovery</text><rect x="50" y="759" width="1565" height="54" rx="18" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="833" y="794.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">The same y can yield a different x-hat when the declared route changes; re-run fidelity, hallucination, residual, and runtime checks rather than reuse claims.</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">版本化 reverse route 是為了重播 estimate 與 failure，不是證明模型反推出真實表面；任一 condition 或 sampling 改變都需重新 qualification。</text></svg>