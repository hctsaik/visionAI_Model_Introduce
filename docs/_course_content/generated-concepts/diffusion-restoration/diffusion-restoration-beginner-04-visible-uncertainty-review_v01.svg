<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Diffusion Restoration：visible uncertainty 將 reviewer 帶回 raw evidence、controlled target 和 holdout</title><desc id="desc">raw y、x-hat 與 uncertainty 並列，並以 controlled fidelity、real degraded holdout、failure gallery、P95/cost 和 specialist review 限定 human-assist 範圍。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#00A8C6"/></marker><marker id="arrow-129B86" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#129B86"/></marker><marker id="arrow-7657C8" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#D94B62"/></marker><marker id="arrow-149A62" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#149A62"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092754"/><text x="42" y="99.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#092754" text-anchor="start">residual / uncertainty 可見時：先回到 raw review</text><text x="42" y="147.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">review 不只看 x-hat 是否清楚；它要檢查 critical ROI 的 residual/uncertainty、artifact failure、controlled target 與真實 degraded holdout，才決定 human-assist 範圍。</text><rect x="1102" y="34" width="530" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1367" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">DIFFUSION RESTORATION · ESTIMATE</text><text x="50" y="210.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#12346C" text-anchor="start">same evidence bundle</text><rect x="50" y="241" width="695" height="420" rx="29" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="3"/><text x="397" y="286.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#12346C" text-anchor="middle">compare raw y, x-hat, and visible uncertainty</text><g data-entity="diffusion_restoration_physical_aoi" data-contract="degraded raw capture remains evidence"><clipPath id="crop-review-raw-83-326"><rect x="83" y="326" width="190" height="159" rx="14"/></clipPath><g clip-path="url(#crop-review-raw-83-326)"><image href="../../../roadmap-model-selection/diffusion-restoration/diffusion-restoration/images/source/DIFFUSION-RESTORATION-01-engineer-story_v01.png" x="83" y="326" width="190" height="159" preserveAspectRatio="xMaxYMid slice"/></g><rect x="83" y="326" width="190" height="159" rx="14" fill="none" stroke="#1769E0" stroke-width="3"/></g><g data-entity="degraded_raw_image"><rect x="83" y="326" width="190" height="159" rx="11" fill="#1769E0" fill-opacity="0.18" stroke="#1769E0" stroke-width="0"/><rect x="149.5" y="368.93" width="53.2" height="49.29" rx="5" fill="none" stroke="#D94B62" stroke-width="3"/><rect x="91" y="335" width="174" height="36" rx="17" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="178.0" y="362.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">raw y</text></g><g data-entity="diffusion_restoration_physical_aoi" data-contract="degraded raw capture remains evidence"><clipPath id="crop-review-xhat-303-326"><rect x="303" y="326" width="190" height="159" rx="14"/></clipPath><g clip-path="url(#crop-review-xhat-303-326)"><image href="../../../roadmap-model-selection/diffusion-restoration/diffusion-restoration/images/source/DIFFUSION-RESTORATION-01-engineer-story_v01.png" x="303" y="326" width="190" height="159" preserveAspectRatio="xMaxYMid slice"/></g><rect x="303" y="326" width="190" height="159" rx="14" fill="none" stroke="#129B86" stroke-width="3"/></g><g data-entity="restored_estimate"><rect x="303" y="326" width="190" height="159" rx="11" fill="#129B86" fill-opacity="0.11" stroke="#129B86" stroke-width="0"/><path d="M339.1 373.7 L339.1 426.17" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M333.4 380.06 L456.9 380.06" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M367.6 373.7 L367.6 426.17" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M333.4 392.78000000000003 L456.9 392.78000000000003" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M396.1 373.7 L396.1 426.17" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M333.4 405.5 L456.9 405.5" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M424.6 373.7 L424.6 426.17" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M333.4 418.22 L456.9 418.22" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><rect x="369.5" y="368.93" width="53.2" height="49.29" rx="5" fill="none" stroke="#129B86" stroke-width="3"/><rect x="311" y="335" width="174" height="36" rx="17" fill="#129B86" stroke="#129B86" stroke-width="0"/><text x="398.0" y="362.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">x-hat</text><text x="396.1" y="448.43" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D94B62" text-anchor="middle">estimate only</text></g><g data-entity="residual_or_uncertainty"><rect x="523" y="326" width="190" height="159" rx="12" fill="#081C42" stroke="#1769E0" stroke-width="3"/><rect x="541.0" y="379.0" width="19.285714285714285" height="12.8" rx="5" fill="#113D90" fill-opacity="0.92" stroke="#113D90" stroke-width="0"/><rect x="565.6666666666666" y="379.0" width="19.285714285714285" height="12.8" rx="5" fill="#F5C84A" fill-opacity="0.92" stroke="#F5C84A" stroke-width="0"/><rect x="590.3333333333334" y="379.0" width="19.285714285714285" height="12.8" rx="5" fill="#113D90" fill-opacity="0.92" stroke="#113D90" stroke-width="0"/><rect x="615.0" y="379.0" width="19.285714285714285" height="12.8" rx="5" fill="#F5C84A" fill-opacity="0.92" stroke="#F5C84A" stroke-width="0"/><rect x="639.6666666666666" y="379.0" width="19.285714285714285" height="12.8" rx="5" fill="#113D90" fill-opacity="0.92" stroke="#113D90" stroke-width="0"/><rect x="664.3333333333334" y="379.0" width="19.285714285714285" height="12.8" rx="5" fill="#F5C84A" fill-opacity="0.92" stroke="#F5C84A" stroke-width="0"/><rect x="541.0" y="400.0" width="19.285714285714285" height="12.8" rx="5" fill="#00B5C6" fill-opacity="0.92" stroke="#00B5C6" stroke-width="0"/><rect x="565.6666666666666" y="400.0" width="19.285714285714285" height="12.8" rx="5" fill="#D94B62" fill-opacity="0.92" stroke="#D94B62" stroke-width="0"/><rect x="590.3333333333334" y="400.0" width="19.285714285714285" height="12.8" rx="5" fill="#00B5C6" fill-opacity="0.92" stroke="#00B5C6" stroke-width="0"/><rect x="615.0" y="400.0" width="19.285714285714285" height="12.8" rx="5" fill="#D94B62" fill-opacity="0.92" stroke="#D94B62" stroke-width="0"/><rect x="639.6666666666666" y="400.0" width="19.285714285714285" height="12.8" rx="5" fill="#00B5C6" fill-opacity="0.92" stroke="#00B5C6" stroke-width="0"/><rect x="664.3333333333334" y="400.0" width="19.285714285714285" height="12.8" rx="5" fill="#D94B62" fill-opacity="0.92" stroke="#D94B62" stroke-width="0"/><rect x="541.0" y="421.0" width="19.285714285714285" height="12.8" rx="5" fill="#F28B00" fill-opacity="0.92" stroke="#F28B00" stroke-width="0"/><rect x="565.6666666666666" y="421.0" width="19.285714285714285" height="12.8" rx="5" fill="#1B78E5" fill-opacity="0.92" stroke="#1B78E5" stroke-width="0"/><rect x="590.3333333333334" y="421.0" width="19.285714285714285" height="12.8" rx="5" fill="#F28B00" fill-opacity="0.92" stroke="#F28B00" stroke-width="0"/><rect x="615.0" y="421.0" width="19.285714285714285" height="12.8" rx="5" fill="#1B78E5" fill-opacity="0.92" stroke="#1B78E5" stroke-width="0"/><rect x="639.6666666666666" y="421.0" width="19.285714285714285" height="12.8" rx="5" fill="#F28B00" fill-opacity="0.92" stroke="#F28B00" stroke-width="0"/><rect x="664.3333333333334" y="421.0" width="19.285714285714285" height="12.8" rx="5" fill="#1B78E5" fill-opacity="0.92" stroke="#1B78E5" stroke-width="0"/><rect x="541.0" y="442.0" width="19.285714285714285" height="12.8" rx="5" fill="#113D90" fill-opacity="0.92" stroke="#113D90" stroke-width="0"/><rect x="565.6666666666666" y="442.0" width="19.285714285714285" height="12.8" rx="5" fill="#F5C84A" fill-opacity="0.92" stroke="#F5C84A" stroke-width="0"/><rect x="590.3333333333334" y="442.0" width="19.285714285714285" height="12.8" rx="5" fill="#113D90" fill-opacity="0.92" stroke="#113D90" stroke-width="0"/><rect x="615.0" y="442.0" width="19.285714285714285" height="12.8" rx="5" fill="#F5C84A" fill-opacity="0.92" stroke="#F5C84A" stroke-width="0"/><rect x="639.6666666666666" y="442.0" width="19.285714285714285" height="12.8" rx="5" fill="#113D90" fill-opacity="0.92" stroke="#113D90" stroke-width="0"/><rect x="664.3333333333334" y="442.0" width="19.285714285714285" height="12.8" rx="5" fill="#F5C84A" fill-opacity="0.92" stroke="#F5C84A" stroke-width="0"/><rect x="531" y="335" width="174" height="36" rx="17" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><text x="618.0" y="362.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">uncertainty</text><text x="618.0" y="468.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">warm = review</text></g><text x="178" y="535.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="middle">sensor evidence</text><text x="398" y="535.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#129B86" text-anchor="middle">conditional estimate</text><text x="618" y="535.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">inspect / uncertain</text><text x="397" y="607.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="middle">critical ROI high residual or uncertainty → do not make a pixel claim</text><path d="M770 451 L831 451" fill="none" stroke="#D94B62" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-D94B62)"/><rect x="850" y="226" width="339" height="455" rx="29" fill="#F4F0FF" stroke="#7657C8" stroke-width="3"/><text x="1019" y="272.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#7657C8" text-anchor="middle">qualification evidence</text><circle cx="889" cy="326" r="10" fill="#1769E0" stroke="none" stroke-width="0"/><text x="916" y="333.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="start">paired / controlled target</text><path d="M880 350 L1156 350" fill="none" stroke="#D7E5F8" stroke-width="2" stroke-linecap="round"/><circle cx="889" cy="381" r="10" fill="#129B86" stroke="none" stroke-width="0"/><text x="916" y="388.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="start">real degraded holdout</text><path d="M880 405 L1156 405" fill="none" stroke="#D7E5F8" stroke-width="2" stroke-linecap="round"/><circle cx="889" cy="436" r="10" fill="#F28B00" stroke="none" stroke-width="0"/><text x="916" y="443.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="start">fidelity + hallucination</text><path d="M880 460 L1156 460" fill="none" stroke="#D7E5F8" stroke-width="2" stroke-linecap="round"/><circle cx="889" cy="491" r="10" fill="#D94B62" stroke="none" stroke-width="0"/><text x="916" y="498.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="start">tile seam + domain failure</text><path d="M880 515 L1156 515" fill="none" stroke="#D7E5F8" stroke-width="2" stroke-linecap="round"/><circle cx="889" cy="546" r="10" fill="#7657C8" stroke="none" stroke-width="0"/><text x="916" y="553.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="start">full P95 / VRAM / cost</text><text x="1019" y="641.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D94B62" text-anchor="middle">missing evidence → HOLD</text><path d="M1210 451 L1263 451" fill="none" stroke="#149A62" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-149A62)"/><rect x="1280" y="226" width="336" height="455" rx="29" fill="#EFFAF4" stroke="#149A62" stroke-width="3"/><text x="1448" y="271.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#149A62" text-anchor="middle">specialist review</text><text x="1448" y="318.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#12346C" text-anchor="middle">human-assist scope only</text><circle cx="1331" cy="365" r="9" fill="#149A62" stroke="none" stroke-width="0"/><text x="1358" y="372.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="start">read x-hat with raw</text><circle cx="1331" cy="413" r="9" fill="#149A62" stroke="none" stroke-width="0"/><text x="1358" y="420.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="start">review residual / uncertainty</text><circle cx="1331" cy="461" r="9" fill="#149A62" stroke="none" stroke-width="0"/><text x="1358" y="468.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="start">inspect failure gallery</text><circle cx="1331" cy="509" r="9" fill="#149A62" stroke="none" stroke-width="0"/><text x="1358" y="516.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#12346C" text-anchor="start">use capture for critical claim</text><g data-entity="raw_evidence_gate"><rect x="1306" y="570" width="282" height="88" rx="22" fill="#FFF1F3" stroke="#D94B62" stroke-width="3"/><text x="1330" y="605.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#D94B62" text-anchor="start">REVIEW / HOLD</text><text x="1330" y="635.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="start">not measurement or PASS</text></g><rect x="50" y="718" width="1566" height="96" rx="23" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="833" y="757.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#12346C" text-anchor="middle">Visible uncertainty makes the model&#x27;s limits inspectable: uncertainty sends a reviewer to raw evidence or re-capture, not to a confident-looking conclusion.</text><text x="833" y="791.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D94B62" text-anchor="middle">A restoration study is valid only with controlled fidelity and real degraded holdout evidence; a sharp x-hat alone does not establish a defect, size, or action.</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">x-hat 可支援閱讀，不可單獨成為關鍵證據；critical ROI、measurement 和 release 一律回查 raw capture、controlled target 與具名 reviewer。</text></svg>