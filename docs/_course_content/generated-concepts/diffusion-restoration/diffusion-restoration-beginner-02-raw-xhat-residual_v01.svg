<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Diffusion Restoration：raw y、x-hat、residual 和 uncertainty 是四種不可互換的視圖</title><desc id="desc">同一 ROI 分別展示 sensor observation、model estimate、raw-estimate mismatch 和 uncertainty；後兩者引導回 raw review，不構成 defect truth。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#00A8C6"/></marker><marker id="arrow-129B86" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#129B86"/></marker><marker id="arrow-7657C8" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#D94B62"/></marker><marker id="arrow-149A62" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#149A62"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092754"/><text x="42" y="99.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#092754" text-anchor="start">不要只看一張清楚圖：raw y、x-hat、residual 與 uncertainty 各回答不同問題</text><text x="42" y="147.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">同一 ROI 的四種視圖是互補關係。raw 記錄相機看見什麼；x-hat 是條件式 estimate；residual/uncertainty 指出哪裡需要回查，而不是另一個 defect truth。</text><rect x="1102" y="34" width="530" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1367" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">DIFFUSION RESTORATION · ESTIMATE</text><text x="50" y="210.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#12346C" text-anchor="start">same ROI, four non-interchangeable views</text><rect x="50" y="245" width="348" height="403" rx="26" fill="#FFFFFF" stroke="#1769E0" stroke-width="3"/><text x="224" y="288.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#1769E0" text-anchor="middle">1. degraded raw y</text><g data-entity="diffusion_restoration_physical_aoi" data-contract="degraded raw capture remains evidence"><clipPath id="crop-views-raw-90-330"><rect x="90" y="330" width="268" height="174" rx="16"/></clipPath><g clip-path="url(#crop-views-raw-90-330)"><image href="../../../roadmap-model-selection/diffusion-restoration/diffusion-restoration/images/source/DIFFUSION-RESTORATION-01-engineer-story_v01.png" x="90" y="330" width="268" height="174" preserveAspectRatio="xMaxYMid slice"/></g><rect x="90" y="330" width="268" height="174" rx="16" fill="none" stroke="#1769E0" stroke-width="3"/></g><g data-entity="degraded_raw_image"><rect x="90" y="330" width="268" height="174" rx="11" fill="#1769E0" fill-opacity="0.18" stroke="#1769E0" stroke-width="0"/><rect x="183.8" y="376.98" width="75.04" height="53.94" rx="5" fill="none" stroke="#D94B62" stroke-width="3"/><rect x="98" y="339" width="178" height="36" rx="17" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="187.0" y="366.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">degraded raw y</text></g><text x="224" y="552.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">sensor observation</text><text x="224" y="588.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="middle">raw stays immutable</text><rect x="442" y="245" width="348" height="403" rx="26" fill="#FFFFFF" stroke="#129B86" stroke-width="3"/><text x="616" y="288.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#129B86" text-anchor="middle">2. restored x-hat</text><g data-entity="diffusion_restoration_physical_aoi" data-contract="degraded raw capture remains evidence"><clipPath id="crop-views-xhat-482-330"><rect x="482" y="330" width="268" height="174" rx="16"/></clipPath><g clip-path="url(#crop-views-xhat-482-330)"><image href="../../../roadmap-model-selection/diffusion-restoration/diffusion-restoration/images/source/DIFFUSION-RESTORATION-01-engineer-story_v01.png" x="482" y="330" width="268" height="174" preserveAspectRatio="xMaxYMid slice"/></g><rect x="482" y="330" width="268" height="174" rx="16" fill="none" stroke="#129B86" stroke-width="3"/></g><g data-entity="restored_estimate"><rect x="482" y="330" width="268" height="174" rx="11" fill="#129B86" fill-opacity="0.11" stroke="#129B86" stroke-width="0"/><path d="M532.92 382.2 L532.92 439.62" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M524.88 389.16 L699.08 389.16" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M573.12 382.2 L573.12 439.62" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M524.88 403.08000000000004 L699.08 403.08000000000004" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M613.3199999999999 382.2 L613.3199999999999 439.62" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M524.88 417.0 L699.08 417.0" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M653.52 382.2 L653.52 439.62" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><path d="M524.88 430.92 L699.08 430.92" fill="none" stroke="#129B86" stroke-width="2" stroke-linecap="round"/><rect x="575.8" y="376.98" width="75.04" height="53.94" rx="5" fill="none" stroke="#129B86" stroke-width="3"/><rect x="490" y="339" width="175" height="36" rx="17" fill="#129B86" stroke="#129B86" stroke-width="0"/><text x="577.5" y="366.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">x-hat estimate</text><text x="613.3199999999999" y="463.98" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D94B62" text-anchor="middle">estimate only</text></g><text x="616" y="552.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">model estimate</text><text x="616" y="588.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">not ground truth</text><rect x="834" y="245" width="348" height="403" rx="26" fill="#FFFFFF" stroke="#F28B00" stroke-width="3"/><text x="1008" y="288.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#F28B00" text-anchor="middle">3. residual</text><g data-entity="residual_or_uncertainty"><rect x="874" y="330" width="268" height="174" rx="12" fill="#081C42" stroke="#1769E0" stroke-width="3"/><rect x="892.0" y="383.0" width="30.428571428571427" height="15.8" rx="5" fill="#113D90" fill-opacity="0.92" stroke="#113D90" stroke-width="0"/><rect x="929.66666666666