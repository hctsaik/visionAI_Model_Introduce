32.5" width="30.428571428571427" height="15.8" rx="5" fill="#F28B00" fill-opacity="0.92" stroke="#F28B00" stroke-width="0"/><rect x="1005.0" y="432.5" width="30.428571428571427" height="15.8" rx="5" fill="#1B78E5" fill-opacity="0.92" stroke="#1B78E5" stroke-width="0"/><rect x="1042.6666666666667" y="432.5" width="30.428571428571427" height="15.8" rx="5" fill="#F28B00" fill-opacity="0.92" stroke="#F28B00" stroke-width="0"/><rect x="1080.3333333333333" y="432.5" width="30.428571428571427" height="15.8" rx="5" fill="#1B78E5" fill-opacity="0.92" stroke="#1B78E5" stroke-width="0"/><rect x="892.0" y="457.25" width="30.428571428571427" height="15.8" rx="5" fill="#113D90" fill-opacity="0.92" stroke="#113D90" stroke-width="0"/><rect x="929.6666666666666" y="457.25" width="30.428571428571427" height="15.8" rx="5" fill="#F5C84A" fill-opacity="0.92" stroke="#F5C84A" stroke-width="0"/><rect x="967.3333333333334" y="457.25" width="30.428571428571427" height="15.8" rx="5" fill="#113D90" fill-opacity="0.92" stroke="#113D90" stroke-width="0"/><rect x="1005.0" y="457.25" width="30.428571428571427" height="15.8" rx="5" fill="#F5C84A" fill-opacity="0.92" stroke="#F5C84A" stroke-width="0"/><rect x="1042.6666666666667" y="457.25" width="30.428571428571427" height="15.8" rx="5" fill="#113D90" fill-opacity="0.92" stroke="#113D90" stroke-width="0"/><rect x="1080.3333333333333" y="457.25" width="30.428571428571427" height="15.8" rx="5" fill="#F5C84A" fill-opacity="0.92" stroke="#F5C84A" stroke-width="0"/><rect x="882" y="339" width="220" height="36" rx="17" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><text x="992.0" y="366.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">residual</text><text x="1008.0" y="487.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">warm = review</text></g><text x="1008" y="552.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">raw vs estimate mismatch</text><text x="1008" y="588.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F28B00" text-anchor="middle">warm areas need review</text><rect x="1226" y="245" width="348" height="403" rx="26" fill="#FFFFFF" stroke="#7657C8" stroke-width="3"/><text x="1400" y="288.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#7657C8" text-anchor="middle">4. uncertainty</text><g data-entity="residual_or_uncertainty"><rect x="1266" y="330" width="268" height="174" rx="12" fill="#081C42" stroke="#1769E0" stroke-width="3"/><rect x="1284.0" y="383.0" width="30.428571428571427" height="15.8" rx="5" fill="#113D90" fill-opacity="0.92" stroke="#113D90" stroke-width="0"/><rect x="1321.6666666666667" y="383.0" width="30.428571428571427" height="15.8" rx="5" fill="#F5C84A" fill-opacity="0.92" stroke="#F5C84A" stroke-width="0"/><rect x="1359.3333333333333" y="383.0" width="30.428571428571427" height="15.8" rx="5" fill="#113D90" fill-opacity="0.92" stroke="#113D90" stroke-width="0"/><rect x="1397.0" y="383.0" width="30.428571428571427" height="15.8" rx="5" fill="#F5C84A" fill-opacity="0.92" stroke="#F5C84A" stroke-width="0"/><rect x="1434.6666666666667" y="383.0" width="30.428571428571427" height="15.8" rx="5" fill="#113D90" fill-opacity="0.92" stroke="#113D90" stroke-width="0"/><rect x="1472.3333333333333" y="383.0" width="30.428571428571427" height="15.8" rx="5" fill="#F5C84A" fill-opacity="0.92" stroke="#F5C84A" stroke-width="0"/><rect x="1284.0" y="407.75" width="30.428571428571427" height="15.8" rx="5" fill="#00B5C6" fill-opacity="0.92" stroke="#00B5C6" stroke-width="0"/><rect x="1321.6666666666667" y="407.75" width="30.428571428571427" height="15.8" rx="5" fill="#D94B62" fill-opacity="0.92" stroke="#D94B62" stroke-width="0"/><rect x="1359.3333333333333" y="407.75" width="30.428571428571427" height="15.8" rx="5" fill="#00B5C6" fill-opacity="0.92" stroke="#00B5C6" stroke-width="0"/><rect x="1397.0" y="407.75" width="30.428571428571427" height="15.8" rx="5" fill="#D94B62" fill-opacity="0.92" stroke="#D94B62" stroke-width="0"/><rect x="1434.6666666666667" y="407.75" width="30.428571428571427" height="15.8" rx="5" fill="#00B5C6" fill-opacity="0.92" stroke="#00B5C6" stroke-width="0"/><rect x="1472.3333333333333" y="407.75" width="30.428571428571427" height="15.8" rx="5" fill="#D94B62" fill-opacity="0.92" stroke="#D94B62" stroke-width="0"/><rect x="1284.0" y="432.5" width="30.428571428571427" height="15.8" rx="5" fill="#F28B00" fill-opacity="0.92" stroke="#F28B00" stroke-width="0"/><rect x="1321.6666666666667" y="432.5" width="30.428571428571427" height="15.8" rx="5" fill="#1B78E5" fill-opacity="0.92" stroke="#1B78E5" stroke-width="0"/><rect x="1359.3333333333333" y="432.5" width="30.428571428571427" height="15.8" rx="5" fill="#F28B00" fill-opacity="0.92" stroke="#F28B00" stroke-width="0"/><rect x="1397.0" y="432.5" width="30.428571428571427" height="15.8" rx="5" fill="#1B78E5" fill-opacity="0.92" stroke="#1B78E5" stroke-width="0"/><rect x="1434.6666666666667" y="432.5" width="30.428571428571427" height="15.8" rx="5" fill="#F28B00" fill-opacity="0.92" stroke="#F28B00" stroke-width="0"/><rect x="1472.3333333333333" y="432.5" width="30.428571428571427" height="15.8" rx="5" fill="#1B78E5" fill-opacity="0.92" stroke="#1B78E5" stroke-width="0"/><rect x="1284.0" y="457.25" width="30.428571428571427" height="15.8" rx="5" fill="#113D90" fill-opacity="0.92" stroke="#113D90" stroke-width="0"/><rect x="1321.6666666666667" y="457.25" width="30.428571428571427" height="15.8" rx="5" fill="#F5C84A" fill-opacity="0.92" stroke="#F5C84A" stroke-width="0"/><rect x="1359.3333333333333" y="457.25" width="30.428571428571427" height="15.8" rx="5" fill="#113D90" fill-opacity="0.92" stroke="#113D90" stroke-width="0"/><rect x="1397.0" y="457.25" width="30.428571428571427" height="15.8" rx="5" fill="#F5C84A" fill-opacity="0.92" stroke="#F5C84A" stroke-width="0"/><rect x="1434.6666666666667" y="457.25" width="30.428571428571427" height="15.8" rx="5" fill="#113D90" fill-opacity="0.92" stroke="#113D90" stroke-width="0"/><rect x="1472.3333333333333" y="457.25" width="30.428571428571427" height="15.8" rx="5" fill="#F5C84A" fill-opacity="0.92" stroke="#F5C84A" stroke-width="0"/><rect x="1274" y="339" width="220" height="36" rx="17" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><text x="1384.0" y="366.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">uncertainty</text><text x="1400.0" y="487.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">warm = review</text></g><rect x="1452" y="395" width="53" height="53" rx="7" fill="none" stroke="#D94B62" stroke-width="3"/><text x="1400" y="552.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#12346C" text-anchor="middle">where confidence is weak</text><text x="1400" y="588.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">weak claim → HOLD</text><path d="M407 447 L430 447" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><path d="M799 447 L822 447" fill="none" stroke="#F28B00" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><path d="M1191 447 L1214 447" fill="none" stroke="#7657C8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="50" y="711" width="1566" height="103" rx="23" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="833" y="752.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#12346C" text-anchor="middle">Read left to right: what was captured → what the model estimates → where they disagree → where the estimate is weak or unsafe to use.</text><text x="833" y="790.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D94B62" text-anchor="middle">A hot residual or uncertainty region does not certify a defect; it directs a reviewer back to raw capture, controlled reference, or HOLD.</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">把 x-hat、residual 與 uncertainty 和 raw 一起交付；只展示更清楚的結果，會隱藏 prior invent/erase detail 的風險。</text></svg>