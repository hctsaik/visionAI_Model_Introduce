<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Diffusion Restoration 的反事實與 HOLD 說明圖</title>
  <desc id="desc">三個模型專屬反事實卡片，分別呈現條件被破壞時的可觀察結果和安全的 HOLD 或重驗下一步。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0B3068" flood-opacity=".12"/></filter>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker>
    <marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker>
    <style>text { dominant-baseline: alphabetic; } .fine { fill:#536A91; font-size:18px; }</style>
  </defs>
  <rect width="1672" height="941" fill="#F5F8FE"/>
  <rect x="40" y="32" width="150" height="32" rx="16" fill="#E6F0FF"/><text x="58" y="54.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="16" font-weight="800" fill="#1769E0">反事實與安全邊界</text><text x="40" y="116" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="43" font-weight="900" fill="#071A3B">同一條因果鏈，會在哪裡被破壞？</text><text x="40" y="182" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="500" fill="#50698F">不是多背三個風險名詞；要能預測畫面可能怎麼變，並選擇安全的下一步。</text><text x="1630" y="57.0" text-anchor="end" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#5C7395">Diffusion Restoration</text><rect x="77" y="260" width="478" height="516" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><circle cx="121" cy="306" r="25" fill="#D84A4A"/><text x="121" y="314.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">1</text><text x="159" y="313" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">真實 blur/noise/codec 不符合已宣告</text><text x="159" y="342" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">的 degradation model。</text><g data-visual-cue="condition_mismatch" data-renderer-art="image_text_or_diffusion" data-primitive="generation_condition_contract" data-semantic-scene="generation_condition_contract" data-semantic-entities="raw_image|condition_or_mask|version_lock" data-specialist-coverage="raw_image|condition_or_mask|version_lock" data-semantic-relation="keep raw evidence and generation condition separate" data-must-show="假設 blur/noise 與 raw 實際 pattern 不一致 | 箭頭打叉 | 邊界提示：錯誤條件下的估計不能被解讀為真實結構。" data-not-claim="錯誤條件下的估計不能被解讀為真實結構。"><title>退化條件不符</title><rect x="105" y="390" width="422" height="98" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="204.48999999999998" y1="440.26" x2="295.21" y2="440.26" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="336.79" y1="440.26" x2="423.72999999999996" y2="440.26" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><path d="M444.52 409.09999999999997L450.26 414.84L444.52 420.58L438.78 414.84z" fill="#FFF4CC" stroke="#C88400" stroke-width="2"/><g data-entity="raw_image" data-entity-label-full="raw"><rect x="166.48" y="427.8616" width="34.44" height="23.4192" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M169.92399999999998 444.95761600000003 L177.84519999999998 438.868624 L184.3888 442.849888 L194.7208 433.7164" fill="none" stroke="#93B8E8" stroke-width="3"/><text data-label-line="true" x="183.7" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">raw</text></g><g data-entity="condition_or_mask" data-entity-label-full="mask/cond."><rect x="304.1182" y="428.3782" width="5.9212" height="5.9212" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><rect x="312.0394" y="428.3782" width="5.9212" height="5.9212" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><rect x="319.9606" y="428.3782" width="5.9212" height="5.9212" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><rect x="304.1182" y="436.2994" width="5.9212" height="5.9212" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><rect x="312.0394" y="436.2994" width="5.9212" height="5.9212" rx="2" fill="#F38B00" stroke="#0AA6D8" stroke-width="1"/><rect x="319.9606" y="436.2994" width="5.9212" height="5.9212" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><rect x="304.1182" y="444.2206" width="5.9212" height="5.9212" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><rect x="312.0394" y="444.2206" width="5.9212" height="5.9212" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><rect x="319.9606" y="444.2206" width="5.9212" height="5.9212" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><text data-label-line="true" x="316.0" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">mask/cond.</text></g><g data-entity="version_lock" data-entity-label-full="lock"><rect x="434.8768" y="439.5712" width="19.2864" height="13.776" rx="5" fill="#EAF3FF" stroke="#F38B00" stroke-width="3"/><path d="M439.0096 439.5712v-5.5104a5.5104 5.5104 0 0 1 11.0208 0v5.5104" fill="none" stroke="#F38B00" stroke-width="3"/><text data-label-line="true" x="444.52" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">lock</text></g><g data-relation="keep raw evidence and generation condition separate"><rect x="138.34" y="472.24" width="192" height="10.66" rx="4.92" fill="#EAF3FF" stroke="#9FC4FF" stroke-width="2"/><text data-label-line="true" x="234.34" y="473.78999999999996" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">generation</text><text data-label-line="true" x="234.34" y="489.12999999999994" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">condi</text></g></g><text x="105" y="520.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#F38B00">可能看到</text><text x="105" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">prior 可能 invent/erase detail，</text><text x="105" y="570" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">x-hat 偏離觀測。</text><line x1="105" y1="646" x2="527" y2="646" stroke="#D6E7FF" stroke-width="2"/><text x="105" y="675.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#1769E0">正確下一步</text><text x="105" y="703" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">以 controlled pair、real degraded</text><text x="105" y="725" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">holdout 與 failure gallery 重新驗</text><text x="105" y="747" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">證 estimate。</text><rect x="597" y="260" width="478" height="516" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><circle cx="641" cy="306" r="25" fill="#F38B00"/><text x="641" y="314.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">2</text><text x="679" y="313" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">critical ROI 的已宣告 residual 高，</text><text x="679" y="342" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">或出現 tile seam/domain mismatch。</text><g data-visual-cue="hallucinated_detail" data-renderer-art="image_text_or_diffusion" data-primitive="declared_hallucinated_detail" data-semantic-scene="declared_hallucinated_detail" data-semantic-entities="declared_input|declared_operation|candidate_or_gate" data-specialist-coverage="declared_input|declared_operation|candidate_or_gate" data-semantic-relation="show the authored operation before action" data-must-show="raw 無可見支持的紋理在 x-hat 中出現 | 橘色新像素標示 | 邊界提示：新紋理不是已量到的缺陷。" data-not-claim="新紋理不是已量到的缺陷。"><title>生成微細節</title><rect x="625" y="390" width="422" height="98" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="724.49" y1="440.26" x2="815.21" y2="440.26" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="856.79" y1="440.26" x2="943.73" y2="440.26" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="declared_input" data-entity-label-full="input"><path d="M703.7 428.55039999999997L714.032 434.7496L714.032 445.7704L703.7 451.9696L693.368 445.7704L693.368 434.7496z" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><text data-label-line="true" x="703.7" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">input</text></g><g data-entity="declared_operation" data-entity-label-full="operation"><rect x="823.6016" y="431.65" width="8.61" height="17.22" rx="5" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="3"/><rect x="839.444" y="431.65" width="8.61" height="17.22" rx="5" fill="#E8FAFF" stroke="#0AA6D8" stroke-width="3"/><line x1="834.278" y1="440.26" x2="838.4108" y2="440.26" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><text data-label-line="true" x="836.0" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">operation</text></g><g data-entity="candidate_or_gate" data-entity-label-full="candidate"><path d="M964.52 427.8616L976.2296 440.26L964.52 452.6584L952.8104 440.26z" fill="#FFF4CC" stroke="#F38B00" stroke-width="3"/><circle cx="964.52" cy="440.26" r="3.0995999999999997" fill="#F38B00"/><text data-label-line="true" x="964.52" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">candidate</text></g><g data-relation="show the authored operation before action"><rect x="658.34" y="472.24" width="192" height="10.66" rx="4.92" fill="#EAF3FF" stroke="#9FC4FF" stroke-width="2"/><text data-label-line="true" x="754.34" y="473.78999999999996" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">declared</text><text data-label-line="true" x="754.34" y="489.12999999999994" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">halluci</text></g></g><text x="625" y="520.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#F38B00">可能看到</text><text x="625" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">看似清楚的 output 沒有可靠可追溯性。</text><line x1="625" y1="646" x2="1047" y2="646" stroke="#D6E7FF" stroke-width="2"/><text x="625" y="675.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#1769E0">正確下一步</text><text x="625" y="703" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">回查 raw/capture，重驗證或 HOLD；</text><text x="625" y="725" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">x-hat 不可單獨決策。</text><rect x="1117" y="260" width="478" height="516" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><circle cx="1161" cy="306" r="25" fill="#1769E0"/><text x="1161" y="314.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">3</text><text x="1199" y="313" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">只留 x-hat，未保留 raw y 與 route</text><text x="1199" y="342" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">trace。</text><g data-visual-cue="hold_gate" data-renderer-art="drift_hold" data-primitive="declared_hold_gate" data-semantic-scene="declared_hold_gate" data-semantic-entities="declared_input|declared_operation|candidate_or_gate" data-specialist-coverage="declared_input|declared_operation|candidate_or_gate" data-semantic-relation="show the authored operation before action" data-must-show="condition mismatch、hallucination、無 paired target 合流 | 進 raw evidence／HOLD | 邊界提示：修復估計不可成唯一 production evidence。" data-not-claim="修復估計不可成唯一 production evidence。"><title>不確定先 HOLD</title><rect x="1145" y="390" width="422" height="98" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="1244.49" y1="440.26" x2="1335.21" y2="440.26" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="1376.79" y1="440.26" x2="1463.73" y2="440.26" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><path d="M1484.52 409.09999999999997L1490.26 414.84L1484.52 420.58L1478.78 414.84z" fill="#FFF4CC" stroke="#C88400" stroke-width="2"/><g data-entity="declared_input" data-entity-label-full="input"><path d="M1223.7 428.55039999999997L1234.0320000000002 434.7496L1234.0320000000002 445.7704L1223.7 451.9696L1213.368 445.7704L1213.368 434.7496z" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><text data-label-line="true" x="1223.7" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">input</text></g><g data-entity="declared_operation" data-entity-label-full="operation"><rect x="1343.6016" y="431.65" width="8.61" height="17.22" rx="5" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="3"/><rect x="1359.444" y="431.65" width="8.61" height="17.22" rx="5" fill="#E8FAFF" stroke="#0AA6D8" stroke-width="3"/><line x1="1354.278" y1="440.26" x2="1358.4108" y2="440.26" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><text data-label-line="true" x="1356.0" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">operation</text></g><g data-entity="candidate_or_gate" data-entity-label-full="candidate"><path d="M1484.52 427.8616L1496.2296 440.26L1484.52 452.6584L1472.8104 440.26z" fill="#FFF4CC" stroke="#F38B00" stroke-width="3"/><circle cx="1484.52" cy="440.26" r="3.0995999999999997" fill="#F38B00"/><text data-label-line="true" x="1484.52" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">candidate</text></g><g data-relation="show the authored operation before action"><rect x="1178.34" y="472.24" width="192" height="10.66" rx="4.92" fill="#EAF3FF" stroke="#9FC4FF" stroke-width="2"/><text data-label-line="true" x="1274.34" y="473.78999999999996" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">declared</text><text data-label-line="true" x="1274.34" y="489.12999999999994" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">hold ga</text></g></g><text x="1145" y="520.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#F38B00">可能看到</text><text x="1145" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">無法重播或分辨 model estimate 與</text><text x="1145" y="570" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">sensor evidence。</text><line x1="1145" y1="646" x2="1567" y2="646" stroke="#D6E7FF" stroke-width="2"/><text x="1145" y="675.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#1769E0">正確下一步</text><text x="1145" y="703" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">鎖定 raw y；保存 condition、</text><text x="1145" y="725" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">checkpoint、sampling 與 reviewer</text><text x="1145" y="747" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">decision。</text><rect x="77" y="816" width="1518" height="63" rx="20" fill="#FFF4CC" stroke="#F1B828"/><text x="836" y="855.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="800" fill="#674500">任一條件超出 qualification envelope：先停在 HOLD／REVIEW，保存 raw evidence 與版本，再決定怎麼重驗。</text>
</svg>