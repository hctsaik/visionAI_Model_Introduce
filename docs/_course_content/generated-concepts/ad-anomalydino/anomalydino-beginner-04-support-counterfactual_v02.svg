<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">AnomalyDINO：support 改變 normality 的 AOI 反事實</title><desc id="desc">同一個 test ROI 在合法正常外觀漏收、合格 support、或可疑刮痕混入 support 時，會有不同 candidate 結果。</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7EA8E8" flood-opacity="0.18"/></filter><marker id="arrow-1769E0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1769E0"/></marker><marker id="arrow-F38B00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#F38B00"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0B2858"/><rect x="40" y="34" width="156" height="36" rx="18" fill="#E8F2FF" stroke="#E8F2FF" stroke-width="0"/><text x="118" y="59.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">反事實 04</text><text x="40" y="125.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="39" font-weight="900" fill="#081A38" text-anchor="start">support 的兩種失敗，為什麼會讓 candidate 失真？</text><text x="40" y="171.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="500" fill="#536A91" text-anchor="start">左邊是 coverage 反事實；中／右才是同一條刮痕在 clean 與 contaminated support 的比較。</text><rect x="1320" y="36" width="312" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1476" y="68.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="800" fill="#1769E0" text-anchor="middle">AnomalyDINO</text><clipPath id="triptych-40-230-0"><rect x="40" y="230" width="492" height="520" rx="26"/></clipPath><g clip-path="url(#triptych-40-230-0)"><svg x="40" y="230" width="492" height="520" viewBox="0 0 512 1024" preserveAspectRatio="xMidYMid slice"><image href="anomalydino-support-counterfactual-base_v02.png" x="0" y="0" width="1536" height="1024"/></svg></g><rect x="58" y="248" width="456" height="48" rx="18" fill="#FFFFFF" fill-opacity="0.91"/><text x="286" y="280.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#F38B00" text-anchor="middle">① coverage 漏收：合法正常變化</text><rect x="114" y="694" width="344" height="34" rx="15" fill="#FFFFFF" fill-opacity="0.92"/><text x="286" y="717.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#F38B00" text-anchor="middle">support references：缺少此合法變化</text><text x="286" y="794.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#F38B00" text-anchor="middle">正常品也可能亮 → HOLD，補 coverage</text><clipPath id="triptych-590-230-512"><rect x="590" y="230" width="492" height="520" rx="26"/></clipPath><g clip-path="url(#triptych-590-230-512)"><svg x="590" y="230" width="492" height="520" viewBox="512 0 512 1024" preserveAspectRatio="xMidYMid slice"><image href="anomalydino-support-counterfactual-base_v02.png" x="0" y="0" width="1536" height="1024"/></svg></g><rect x="608" y="248" width="456" height="48" rx="18" fill="#FFFFFF" fill-opacity="0.91"/><text x="836" y="280.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#1769E0" text-anchor="middle">② 同一條刮痕：乾淨 support</text><rect x="664" y="694" width="344" height="34" rx="15" fill="#FFFFFF" fill-opacity="0.92"/><text x="836" y="717.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">support references：不含此刮痕</text><text x="836" y="794.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">新刮痕成 candidate → 回看 raw ROI</text><clipPath id="triptych-1140-230-1024"><rect x="1140" y="230" width="492" height="520" rx="26"/></clipPath><g clip-path="url(#triptych-1140-230-1024)"><svg x="1140" y="230" width="492" height="520" viewBox="1024 0 512 1024" preserveAspectRatio="xMidYMid slice"><image href="anomalydino-support-counterfactual-base_v02.png" x="0" y="0" width="1536" height="1024"/></svg></g><rect x="1158" y="248" width="456" height="48" rx="18" fill="#FFFFFF" fill-opacity="0.91"/><text x="1386" y="280.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#D9485F" text-anchor="middle">③ 同一條刮痕：刮痕混進 support</text><rect x="1214" y="694" width="344" height="34" rx="15" fill="#FFFFFF" fill-opacity="0.92"/><text x="1386" y="717.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#D9485F" text-anchor="middle">support references：已含此刮痕</text><text x="1386" y="794.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#D9485F" text-anchor="middle">同一刮痕可能變淡 → contamination audit</text><rect x="184" y="382" width="116" height="74" rx="10" fill="none" stroke="#0AA6D8" stroke-width="4"/><text x="242" y="480.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#0AA6D8" text-anchor="middle">合法變化</text><rect x="708" y="386" width="198" height="102" rx="10" fill="none" stroke="#F38B00" stroke-width="4"/><text x="807" y="512.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#F38B00" text-anchor="middle">待檢刮痕</text><rect x="1258" y="386" width="198" height="102" rx="10" fill="none" stroke="#D9485F" stroke-width="4"/><text x="1357" y="512.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#D9485F" text-anchor="middle">同一條刮痕</text><rect x="40" y="836" width="1592" height="48" rx="18" fill="#E8F2FF" stroke="#1769E0" stroke-width="2"/><text x="836" y="868.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="800" fill="#0B2858" text-anchor="middle">coverage 缺口會讓合法正常品 false HOLD；同一刮痕混入 support，則會提高漏檢風險。</text></svg>