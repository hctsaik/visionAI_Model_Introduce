<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">每格找最近鄰</title><desc id="desc">每個測試 token 在正常 token memory 中找 cosine 最近鄰；找不到相近者的距離較大。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="memory_nn_anomalydino_cosine_search" data-renderer-art="anomaly" data-primitive="normal_memory_nearest_neighbor" data-semantic-scene="normal_memory_nearest_neighbor" data-semantic-entities="normal_patch_bank|query_patch|nearest_distance" data-specialist-coverage="normal_patch_bank|query_patch|nearest_distance" data-semantic-relation="compare a query feature with normal exemplars" data-must-show="一個 test query token | normal token memory 的多個藍點 | 最近 cosine neighbour 的短連線 | 沒有近鄰的橘色 query 與長連線" data-not-claim="最近鄰搜尋會辨識缺陷名稱或原因。"><title>每格找最近鄰</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="178.27999999999997" y1="132.44" x2="326.12" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="393.88" y1="132.44" x2="535.56" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="normal_patch_bank" data-entity-label-full="memory"><rect x="120.32643678160917" y="112.61471264367816" width="45.314942528735635" height="8.496551724137932" rx="3" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><rect x="120.32643678160917" y="125.35954022988