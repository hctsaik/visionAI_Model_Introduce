<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><title>只有幾張正常品，能先找出可疑處嗎？</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#173A5E"/></marker><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#ECF2F7"/><stop offset=".55" stop-color="#BACBDA"/><stop offset="1" stop-color="#E7EEF3"/></linearGradient></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#FCFCFA" stroke="#FCFCFA" stroke-width="2"/><text x="52" y="53.0" font-size="20" fill="#087F8C" font-weight="600">ANOMALYDINO / 用工作案例理解模型</text><text x="52" y="112.0" font-size="42" fill="#173A5E" font-weight="800">只有幾張正常品，能先找出可疑處嗎？</text><text x="52" y="159.0" font-size="24" fill="#526477" font-weight="600">先拿金屬面板 A-01 試做：要找表面刮傷，但目前缺陷樣本不夠。</text><rect x="60" y="210" width="472" height="570" rx="18" fill="#F3F7FB" stroke="#CDDAE7" stroke-width="2"/><text x="84" y="255.0" font-size="27" fill="#2463C5" font-weight="800">1  先準備：允許的正常外觀</text><g transform="translate(94 316) scale(0.75)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7E95A9" stroke-width="2"/><path d="M22 24 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 39 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 54 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 69 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 84 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 99 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 114 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 129 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 144 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 159 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 174 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 189 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 204 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 219 H218" stroke="#9FB3C5" opacity=".3"/><circle cx="44" cy="44" r="17" fill="#526477"/><path d="M36 44 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="196" cy="44" r="17" fill="#526477"/><path d="M188 44 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="44" cy="196" r="17" fill="#526477"/><path d="M36 196 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="196" cy="196" r="17" fill="#526477"/><path d="M188 196 h16" stroke="#CAD8E3" stroke-width="3"/><text x="79" y="224.0" font-size="18" fill="#173A5E" font-weight="600">A-01</text></g><g transform="translate(300 358) scale(0.75)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7E95A9" stroke-width="2"/><path d="M22 24 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 39 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 54 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 69 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 84 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 99 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 114 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 129 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 144 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 159 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 174 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 189 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 204 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 219 H218" stroke="#9FB3C5" opacity=".3"/><circle cx="44" cy="44" r="17" fill="#526477"/><path d="M36 44 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="196" cy="44" r="17" fill="#526477"/><path d="M188 44 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="44" cy="196" r="17" fill="#526477"/><path d="M36 196 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="196" cy="196" r="17" fill="#526477"/><path d="M188 196 h16" stroke="#CAD8E3" stroke-width="3"/><path d="M70 10 L150 10 L95 230 L25 230Z" fill="white" opacity=".5"/><text x="79" y="224.0" font-size="18" fill="#173A5E" font-weight="600">A-01</text></g><text x="85" y="616.0" font-size="26" fill="#173A5E" font-weight="600">同產品、同檢查範圍</text><text x="85" y="653.7" font-size="26" fill="#173A5E" font-weight="600">包含合格的批次與反光變化</text><rect x="600" y="210" width="472" height="570" rx="18" fill="#F3F7FB" stroke="#CDDAE7" stroke-width="2"/><text x="624" y="255.0" font-size="27" fill="#2463C5" font-weight="800">2  這一件：右下方出現刮傷</text><g transform="translate(717 318) scale(1.0)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7E95A9" stroke-width="2"/><path d="M22 24 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 39 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 54 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 69 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 84 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 99 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 114 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 129 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 144 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 159 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 174 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 189 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 204 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 219 H218" stroke="#9FB3C5" opacity=".3"/><circle cx="44" cy="44" r="17" fill="#526477"/><path d="M36 44 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="196" cy="44" r="17" fill="#526477"/><path d="M188 44 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="44" cy="196" r="17" fill="#526477"/><path d="M36 196 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="196" cy="196" r="17" fill="#526477"/><path d="M188 196 h16" stroke="#CAD8E3" stroke-width="3"/><path d="M133 124 L160 167 M139 124 L164 160" stroke="#A12E32" stroke-width="4"/><text x="79" y="224.0" font-size="18" fill="#173A5E" font-weight="600">A-01</text></g><text x="626" y="616.0" font-size="26" fill="#173A5E" font-weight="600">參考裡找不到相似局部時</text><text x="626" y="653.7" font-size="26" fill="#173A5E" font-weight="600">這裡的距離可能升高</text><rect x="1140" y="210" width="472" height="570" rx="18" fill="#F3F7FB" stroke="#CDDAE7" stroke-width="2"/><text x="1164" y="255.0" font-size="27" fill="#2463C5" font-weight="800">3  交出：可疑位置，待人確認</text><g transform="translate(1255 318) scale(1.0)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7E95A9" stroke-width="2"/><path d="M22 24 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 39 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 54 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 69 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 84 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 99 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 114 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 129 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 144 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 159 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 174 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 189 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 204 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 219 H218" stroke="#9FB3C5" opacity=".3"/><circle cx="44" cy="44" r="17" fill="#526477"/><path d="M36 44 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="196" cy="44" r="17" fill="#526477"/><path d="M188 44 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="44" cy="196" r="17" fill="#526477"/><path d="M36 196 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="196" cy="196" r="17" fill="#526477"/><path d="M188 196 h16" stroke="#CAD8E3" stroke-width="3"/><ellipse cx="147" cy="146" rx="35" ry="43" fill="#FFB833" opacity=".6"/><ellipse cx="147" cy="146" rx="17" ry="28" fill="#D84739" opacity=".65"/><path d="M133 124 L160 167 M139 124 L164 160" stroke="#A12E32" stroke-width="4"/><text x="79" y="224.0" font-size="18" fill="#173A5E" font-weight="600">A-01</text></g><text x="1164" y="616.0" font-size="26" fill="#173A5E" font-weight="600">看右下方熱區，再回到原圖</text><text x="1164" y="653.7" font-size="26" fill="#173A5E" font-weight="600">確認刮傷是否超出允收標準</text><rect x="48" y="818" width="1576" height="84" rx="18" fill="#FFF4CC" stroke="#E6C669" stroke-width="2"/><text x="70" y="869.0" font-size="27" fill="#614A14" font-weight="600">先找不像正常的局部，再由人依規格判定；不是自動替你定義合格。</text></svg>