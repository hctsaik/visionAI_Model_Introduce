<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><title>這道刮傷，為什麼會得到高分？</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#173A5E"/></marker><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#ECF2F7"/><stop offset=".55" stop-color="#BACBDA"/><stop offset="1" stop-color="#E7EEF3"/></linearGradient></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#FCFCFA" stroke="#FCFCFA" stroke-width="2"/><text x="52" y="53.0" font-size="20" fill="#087F8C" font-weight="600">ANOMALYDINO / 用工作案例理解模型</text><text x="52" y="112.0" font-size="42" fill="#173A5E" font-weight="800">這道刮傷，為什麼會得到高分？</text><text x="52" y="159.0" font-size="24" fill="#526477" font-weight="600">每個待測局部都問一次：正常參考中，最像我的那個局部，還差多遠？</text><rect x="60" y="210" width="472" height="570" rx="18" fill="#F3F7FB" stroke="#CDDAE7" stroke-width="2"/><text x="84" y="255.0" font-size="27" fill="#2463C5" font-weight="800">1  先看刮傷所在的局部</text><g transform="translate(164 309) scale(1.0)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7E95A9" stroke-width="2"/><path d="M22 24 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 39 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 54 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 69 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 84 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 99 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 114 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 129 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 144 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 159 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 174 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 189 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 204 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 219 H218" stroke="#9FB3C5" opacity=".3"/><circle cx="44" cy="44" r="17" fill="#526477"/><path d="M36 44 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="196" cy="44" r="17" fill="#526477"/><path d="M188 44 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="44" cy="196" r="17" fill="#526477"/><path d="M36 196 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="196" cy="196" r="17" fill="#526477"/><path d="M188 196 h16" stroke="#CAD8E3" stroke-width="3"/><path d="M133 124 L160 167 M139 124 L164 160" stroke="#A12E32" stroke-width="4"/><text x="79" y="224.0" font-size="18" fill="#173A5E" font-weight="600">A-01</text></g><rect x="292" y="427" width="42" height="55" rx="2" fill="none" stroke="#C84343" stroke-width="2"/><text x="84" y="616.0" font-size="26" fill="#173A5E" font-weight="600">拿這一格的「特徵」去問</text><text x="84" y="653.7" font-size="26" fill="#173A5E" font-weight="600">參考庫裡，誰最像我？</text><rect x="600" y="210" width="472" height="570" rx="18" fill="#F3F7FB" stroke="#CDDAE7" stroke-width="2"/><text x="624" y="255.0" font-size="27" fill="#2463C5" font-weight="800">2  搜尋整個正常庫，取最小值</text><rect x="630" y="347" width="104" height="86" rx="8" fill="#D9E4EE" stroke="#90A5B8" stroke-width="2"/><text x="645" y="467.0" font-size="26" fill="#C84343" font-weight="600">0.4</text><rect x="780" y="347" width="104" height="86" rx="8" fill="#D9E4EE" stroke="#90A5B8" stroke-width="2"/><circle cx="832" cy="390" r="23" fill="#526477"/><text x="795" y="467.0" font-size="26" fill="#C84343" font-weight="600">0.62</text><rect x="930" y="347" width="104" height="86" rx="8" fill="#D9E4EE" stroke="#90A5B8" stroke-width="2"/><text x="945" y="467.0" font-size="26" fill="#C84343" font-weight="600">0.55</text><text x="631" y="546.0" font-size="24" fill="#526477" font-weight="600">三個候選距離（教學摘錄）</text><text x="632" y="601.0" font-size="33" fill="#C84343" font-weight="800">最像的也有 0.40</text><text x="626" y="673.0" font-size="25" fill="#173A5E" font-weight="600">比的是特徵，不是像素相減</text><text x="626" y="709.25" font-size="25" fill="#173A5E" font-weight="600">也不限原圖的同一座標</text><rect x="1140" y="210" width="472" height="570" rx="18" fill="#F3F7FB" stroke="#CDDAE7" stroke-width="2"/><text x="1164" y="255.0" font-size="27" fill="#2463C5" font-weight="800">3  正常局部則能找到近鄰</text><rect x="1183" y="348" width="104" height="86" rx="8" fill="#D9E4EE" stroke="#90A5B8" stroke-width="2"/><path d="M1309 389 L1399 389" stroke="#173A5E" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="1434" y="348" width="104" height="86" rx="8" fill="#D9E4EE" stroke="#90A5B8" stroke-width="2"/><text x="1190" y="522.0" font-size="27" fill="#087F8C" font-weight="600">相似正常紋理：距離 0.02</text><text x="1164" y="616.0" font-size="25" fill="#173A5E" font-weight="600">距離小：參考裡見過類似外觀</text><text x="1164" y="652.25" font-size="25" fill="#173A5E" font-weight="600">距離大：優先回原圖檢查</text><rect x="48" y="818" width="1576" height="84" rx="18" fill="#FFF4CC" stroke="#E6C669" stroke-width="2"/><text x="70" y="869.0" font-size="27" fill="#614A14" font-weight="600">查的是全庫最近鄰；正常局部容易找到相似例，未知外觀可能找不到。</text></svg>