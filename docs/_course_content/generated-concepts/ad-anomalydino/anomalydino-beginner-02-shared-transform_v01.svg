<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">AnomalyDINO：同一套規則將 patch 轉成 token</title><desc id="desc">乾淨 normal ROI 和 test ROI 在可比較的 ROI／resize 定義與 frozen DINOv2 下形成 token；mask 與 rotation 是另行宣告的 policy。</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7EA8E8" flood-opacity="0.18"/></filter><marker id="arrow-1769E0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1769E0"/></marker><marker id="arrow-F38B00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#F38B00"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0B2858"/><rect x="40" y="34" width="156" height="36" rx="18" fill="#E8F2FF" stroke="#E8F2FF" stroke-width="0"/><text x="118" y="59.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">機制 02</text><text x="40" y="125.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="39" font-weight="900" fill="#081A38" text-anchor="start">同一套可比較規則，才有意義的距離</text><text x="40" y="171.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="500" fill="#536A91" text-anchor="start">先把影像小格變成特徵描述；後面比較的是 token，不是像素顏色。</text><rect x="1320" y="36" width="312" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1476" y="68.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="800" fill="#1769E0" text-anchor="middle">AnomalyDINO</text><rect x="40" y="230" width="350" height="548" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="215" y="276.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="25" font-weight="900" fill="#0B2858" text-anchor="middle">clean normal ROIs</text><clipPath id="clip-87-322-255-130"><rect x="87" y="322" width="255" height="130" rx="18"/></clipPath><rect x="87" y="322" width="255" height="130" rx="18" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><image href="anomalydino-industrial-reference-anchor_v02.png" x="87" y="322" width="255" height="130" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip-87-322-255-130)"/><rect x="150" y="360" width="20" height="20" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="178" y="360" width="20" height="20" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="206" y="360" width="20" height="20" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="150" y="388" width="20" height="20" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="178" y="388" width="20" height="20" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="206" y="388" width="20" height="20" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><clipPath id="clip-87-491-255-130"><rect x="87" y="491" width="255" height="130" rx="18"/></clipPath><rect x="87" y="491" width="255" height="130" rx="18" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><image href="anomalydino-industrial-reference-anchor_v02.png" x="87" y="491" width="255" height="130" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip-87-491-255-130)"/><rect x="150" y="529" width="20" height="20" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="178" y="529" width="20" height="20" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="206" y="529" width="20" height="20" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="150" y="557" width="20" height="20" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="178" y="557" width="20" height="20" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="206" y="557" width="20" height="20" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="458" y="260" width="346" height="470" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="631" y="314.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="26" font-weight="900" fill="#0B2858" text-anchor="middle">共同的比較契約</text><rect x="510" y="354" width="242" height="70" rx="18" fill="#E8F2FF" stroke="#1769E0" stroke-width="2"/><text x="631" y="386.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#1769E0" text-anchor="middle">ROI／resize 定義</text><rect x="510" y="456" width="242" height="70" rx="18" fill="#EAFBFF" stroke="#0AA6D8" stroke-width="2"/><text x="631" y="488.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#0079A8" text-anchor="middle">frozen DINOv2</text><rect x="510" y="558" width="242" height="70" rx="18" fill="#E8F2FF" stroke="#1769E0" stroke-width="2"/><text x="631" y="590.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="900" fill="#1769E0" text-anchor="middle">patch → token</text><text x="631" y="678.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="600" fill="#536A91" text-anchor="middle">mask／rotation 是另行宣告的 policy</text><rect x="872" y="230" width="350" height="548" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1047" y="276.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="25" font-weight="900" fill="#0B2858" text-anchor="middle">test ROI</text><clipPath id="clip-919-322-255-300"><rect x="919" y="322" width="255" height="300" rx="18"/></clipPath><rect x="919" y="322" width="255" height="300" rx="18" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><image href="anomalydino-industrial-reference-anchor_v02.png" x="919" y="322" width="255" height="300" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip-919-322-255-300)"/><rect x="964" y="477" width="58" height="58" rx="8" fill="none" stroke="#F38B00" stroke-width="4"/><text x="1047" y="668.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="800" fill="#0B2858" text-anchor="middle">影像小格：patch</text><rect x="1288" y="230" width="344" height="548" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1460" y="276.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="25" font-weight="900" fill="#0B2858" text-anchor="middle">可比較的特徵</text><rect x="1347" y="339" width="36" height="36" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="1391" y="339" width="36" height="36" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="1435" y="339" width="36" height="36" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="1479" y="339" width="36" height="36" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="1347" y="383" width="36" height="36" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="1391" y="383" width="36" height="36" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="1435" y="383" width="36" height="36" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="1479" y="383" width="36" height="36" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="1347" y="427" width="36" height="36" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="1391" y="427" width="36" height="36" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="1435" y="427" width="36" height="36" rx="7" fill="#F38B00" stroke="#F38B00" stroke-width="2"/><rect x="1479" y="427" width="36" height="36" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="1334" y="556" width="252" height="92" rx="18" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><text x="1460" y="594.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="900" fill="#1769E0" text-anchor="middle">token = 一格的特徵描述</text><text x="1460" y="625.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="600" fill="#536A91" text-anchor="middle">不是一小塊像素本身</text><path d="M390 470 L458 470" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><path d="M804 470 L872 470" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><path d="M1222 470 L1288 470" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="40" y="849" width="1592" height="52" rx="22" fill="#FFF4CC" stroke="#F1B828" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">若 ROI／尺度／取像規則改變，距離可能量到 recipe 差異，而不是產品局部差異。</text></svg>