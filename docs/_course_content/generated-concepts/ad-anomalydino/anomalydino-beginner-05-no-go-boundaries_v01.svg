<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">AnomalyDINO：semantic／layout 與 tiny-defect 的選型邊界</title><desc id="desc">局部外觀可匹配不代表組裝關係正確；小於 token 可見尺度的缺陷也可能被稀釋，兩者都要分流。</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7EA8E8" flood-opacity="0.18"/></filter><marker id="arrow-1769E0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1769E0"/></marker><marker id="arrow-F38B00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#F38B00"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0B2858"/><rect x="40" y="34" width="156" height="36" rx="18" fill="#E8F2FF" stroke="#E8F2FF" stroke-width="0"/><text x="118" y="59.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">選型邊界 05</text><text x="40" y="125.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="39" font-weight="900" fill="#081A38" text-anchor="start">局部都能匹配，不代表整體組裝正確</text><text x="40" y="171.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="500" fill="#536A91" text-anchor="start">先辨別任務：local novelty 才是這條路徑的核心；layout／尺度問題要分流。</text><rect x="1320" y="36" width="312" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1476" y="68.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="800" fill="#1769E0" text-anchor="middle">AnomalyDINO</text><rect x="40" y="230" width="770" height="554" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="78" y="278.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="27" font-weight="900" fill="#0B2858" text-anchor="start">no-go A：排列／數量／順序錯誤</text><clipPath id="clip-78-320-330-250"><rect x="78" y="320" width="330" height="250" rx="18"/></clipPath><rect x="78" y="320" width="330" height="250" rx="18" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><image href="anomalydino-cable-harness-base_v01.png" x="78" y="320" width="330" height="250" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip-78-320-330-250)"/><text x="242" y="602.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="600" fill="#536A91" text-anchor="middle">每條線的局部外觀都可能有 normal 鄰居</text><rect x="455" y="329" width="300" height="240" rx="18" fill="#F8FBFF" stroke="#9FC4FF" stroke-width="2"/><text x="605" y="364.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="900" fill="#D9485F" text-anchor="middle">但連接關係錯了</text><path d="M500 414 C560 414, 620 505, 700 505" fill="none" stroke="#1769E0" stroke-width="14" stroke-linecap="round"/><path d="M500 470 C560 470, 620 414, 700 414" fill="none" stroke="#F38B00" stroke-width="14" stroke-linecap="round"/><path d="M500 526 L700 526" fill="none" stroke="#11A863" stroke-width="14" stroke-linecap="round"/><text x="605" y="621.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="900" fill="#F38B00" text-anchor="middle">AnomalyDINO 可能不亮</text><rect x="78" y="660" width="677" height="78" rx="18" fill="#FFF7EA" stroke="#F6B243" stroke-width="2"/><text x="416" y="694.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="900" fill="#A75400" text-anchor="middle">改用：位置／數量／順序規則，或 detector／keypoint／graph</text><text x="416" y="720.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#A75400" text-anchor="middle">不要把 local matching 的不亮解讀成組裝正確。</text><rect x="862" y="230" width="770" height="554" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="900" y="278.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="27" font-weight="900" fill="#0B2858" text-anchor="start">no-go B：缺陷小於 token 可觀測尺度</text><clipPath id="clip-900-320-320-250"><rect x="900" y="320" width="320" height="250" rx="18"/></clipPath><rect x="900" y="320" width="320" height="250" rx="18" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><image href="anomalydino-industrial-reference-anchor_v02.png" x="900" y="320" width="320" height="250" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip-900-320-320-250)"/><rect x="1283" y="344" width="44" height="44" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="1335" y="344" width="44" height="44" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="1387" y="344" width="44" height="44" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="1439" y="344" width="44" height="44" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="1283" y="396" width="44" height="44" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="1335" y="396" width="44" height="44" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="1387" y="396" width="44" height="44" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="1439" y="396" width="44" height="44" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="1283" y="448" width="44" height="44" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="1335" y="448" width="44" height="44" rx="7" fill="#F38B00" stroke="#F38B00" stroke-width="2"/><rect x="1387" y="448" width="44" height="44" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><rect x="1439" y="448" width="44" height="44" rx="7" fill="#CFE2FF" stroke="#1769E0" stroke-width="2"/><path d="M1220 446 L1283 446" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="1337" y="432" width="44" height="44" rx="7" fill="none" stroke="#F38B00" stroke-width="4"/><text x="1444" y="543.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="900" fill="#F38B00" text-anchor="middle">微小刮痕被混入一格</text><text x="1444" y="574.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="600" fill="#536A91" text-anchor="middle">訊號可能被稀釋</text><rect x="900" y="660" width="677" height="78" rx="18" fill="#EAFBFF" stroke="#0AA6D8" stroke-width="2"/><text x="1238" y="694.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="19" font-weight="900" fill="#0079A8" text-anchor="middle">先查 effective pixels、input／tile、光學與 token-grid policy</text><text x="1238" y="720.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#0079A8" text-anchor="middle">不是把 threshold 調低就能補回看不見的證據。</text><rect x="40" y="849" width="1592" height="52" rx="22" fill="#FFF4CC" stroke="#F1B828" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">選模型前先問：錯誤是局部外觀陌生，還是結構關係／尺度根本不在這條路徑可見範圍？</text></svg>