<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><title>先問：這種變化，在工作上算正常嗎？</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#173A5E"/></marker><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#ECF2F7"/><stop offset=".55" stop-color="#BACBDA"/><stop offset="1" stop-color="#E7EEF3"/></linearGradient></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#FCFCFA" stroke="#FCFCFA" stroke-width="2"/><text x="52" y="53.0" font-size="20" fill="#087F8C" font-weight="600">ANOMALYDINO / 用工作案例理解模型</text><text x="52" y="112.0" font-size="42" fill="#173A5E" font-weight="800">先問：這種變化，在工作上算正常嗎？</text><text x="52" y="159.0" font-size="24" fill="#526477" font-weight="600">遮罩、旋轉參考和局部搜尋都有用途；也會影響哪些問題容易被看見。</text><rect x="60" y="210" width="472" height="570" rx="18" fill="#F3F7FB" stroke="#CDDAE7" stroke-width="2"/><text x="84" y="255.0" font-size="27" fill="#2463C5" font-weight="800">1  遮背景前，先確定沒遮到工件</text><g transform="translate(186 324) scale(0.9166666666666666)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7E95A9" stroke-width="2"/><path d="M22 24 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 39 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 54 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 69 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 84 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 99 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 114 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 129 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 144 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 159 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 174 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 189 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 204 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 219 H218" stroke="#9FB3C5" opacity=".3"/><circle cx="44" cy="44" r="17" fill="#526477"/><path d="M36 44 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="196" cy="44" r="17" fill="#526477"/><path d="M188 44 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="44" cy="196" r="17" fill="#526477"/><path d="M36 196 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="196" cy="196" r="17" fill="#526477"/><path d="M188 196 h16" stroke="#CAD8E3" stroke-width="3"/><path d="M0 0 H240 V100 L100 240 H0Z" fill="#E4ECEF" opacity=".85"/><text x="79" y="224.0" font-size="18" fill="#173A5E" font-weight="600">A-01</text></g><text x="84" y="603.0" font-size="26" fill="#173A5E" font-weight="600">若遮罩漏掉待檢區域</text><text x="84" y="640.7" font-size="26" fill="#173A5E" font-weight="600">該處異常就可能被忽略</text><text x="84" y="719.0" font-size="25" fill="#C84343" font-weight="600">每種產品先看遮罩疊圖</text><rect x="600" y="210" width="472" height="570" rx="18" fill="#F3F7FB" stroke="#CDDAE7" stroke-width="2"/><text x="624" y="255.0" font-size="27" fill="#2463C5" font-weight="800">2  旋轉何時算正常？先問規格</text><g transform="translate(649 340) scale(0.5833333333333334)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7E95A9" stroke-width="2"/><path d="M22 24 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 39 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 54 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 69 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 84 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 99 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 114 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 129 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 144 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 159 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 174 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 189 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 204 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 219 H218" stroke="#9FB3C5" opacity=".3"/><circle cx="44" cy="44" r="17" fill="#526477"/><path d="M36 44 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="196" cy="44" r="17" fill="#526477"/><path d="M188 44 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="44" cy="196" r="17" fill="#526477"/><path d="M36 196 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="196" cy="196" r="17" fill="#526477"/><path d="M188 196 h16" stroke="#CAD8E3" stroke-width="3"/><text x="79" y="224.0" font-size="18" fill="#173A5E" font-weight="600">A-01</text></g><g transform="rotate(90 945 410)"><g transform="translate(875 340) scale(0.5833333333333334)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7E95A9" stroke-width="2"/><path d="M22 24 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 39 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 54 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 69 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 84 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 99 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 114 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 129 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 144 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 159 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 174 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 189 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 204 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 219 H218" stroke="#9FB3C5" opacity=".3"/><circle cx="44" cy="44" r="17" fill="#526477"/><path d="M36 44 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="196" cy="44" r="17" fill="#526477"/><path d="M188 44 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="44" cy="196" r="17" fill="#526477"/><path d="M36 196 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="196" cy="196" r="17" fill="#526477"/><path d="M188 196 h16" stroke="#CAD8E3" stroke-width="3"/><text x="79" y="224.0" font-size="18" fill="#173A5E" font-weight="600">A-01</text></g></g><text x="624" y="566.0" font-size="24" fill="#173A5E" font-weight="600">可自由擺放：旋轉參考可能有用</text><text x="624" y="600.8" font-size="24" fill="#173A5E" font-weight="600">方向必須一致：別把錯向當正常</text><text x="624" y="717.0" font-size="23" fill="#087F8C" font-weight="600">改前處理後，重跑方向錯誤案例</text><rect x="1140" y="210" width="472" height="570" rx="18" fill="#F3F7FB" stroke="#CDDAE7" stroke-width="2"/><text x="1164" y="255.0" font-size="27" fill="#2463C5" font-weight="800">3  外觀像正常，排列仍可能錯</text><rect x="1190" y="333" width="360" height="100" rx="18" fill="white" stroke="#CDDAE7" stroke-width="2"/><text x="1220" y="393.0" font-size="42" fill="#087F8C" font-weight="600">A    B    C</text><rect x="1190" y="470" width="360" height="100" rx="18" fill="white" stroke="#CDDAE7" stroke-width="2"/><text x="1220" y="530.0" font-size="42" fill="#C84343" font-weight="600">A    C    B</text><text x="1164" y="633.0" font-size="24" fill="#173A5E" font-weight="600">DINO 特徵含上下文，但這套方法</text><text x="1164" y="667.8" font-size="24" fill="#173A5E" font-weight="600">沒有明寫「順序必須 A-B-C」</text><text x="1164" y="738.0" font-size="23" fill="#087F8C" font-weight="600">順序任務加位置／類別規則驗證</text><rect x="48" y="818" width="1576" height="84" rx="18" fill="#FFF4CC" stroke="#E6C669" stroke-width="2"/><text x="70" y="869.0" font-size="27" fill="#614A14" font-weight="600">讓模型忽略什麼，要由工作規格決定；前處理也需要缺陷反例驗證。</text></svg>