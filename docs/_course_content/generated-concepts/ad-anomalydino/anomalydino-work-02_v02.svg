<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><title>不重訓 DINOv2，怎麼認識你的產品？</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#173A5E"/></marker><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#ECF2F7"/><stop offset=".55" stop-color="#BACBDA"/><stop offset="1" stop-color="#E7EEF3"/></linearGradient></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#FCFCFA" stroke="#FCFCFA" stroke-width="2"/><text x="52" y="53.0" font-size="20" fill="#087F8C" font-weight="600">ANOMALYDINO / 用工作案例理解模型</text><text x="52" y="112.0" font-size="42" fill="#173A5E" font-weight="800">不重訓 DINOv2，怎麼認識你的產品？</text><text x="52" y="159.0" font-size="24" fill="#526477" font-weight="600">正常參考與待測品各走同一個固定模型；差別在於一批用來存，一批用來查。</text><rect x="60" y="210" width="472" height="570" rx="18" fill="#F3F7FB" stroke="#CDDAE7" stroke-width="2"/><text x="84" y="255.0" font-size="27" fill="#2463C5" font-weight="800">1  兩批影像，各自送進來</text><g transform="translate(87 309) scale(0.7083333333333334)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7E95A9" stroke-width="2"/><path d="M22 24 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 39 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 54 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 69 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 84 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 99 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 114 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 129 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 144 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 159 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 174 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 189 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 204 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 219 H218" stroke="#9FB3C5" opacity=".3"/><circle cx="44" cy="44" r="17" fill="#526477"/><path d="M36 44 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="196" cy="44" r="17" fill="#526477"/><path d="M188 44 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="44" cy="196" r="17" fill="#526477"/><path d="M36 196 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="196" cy="196" r="17" fill="#526477"/><path d="M188 196 h16" stroke="#CAD8E3" stroke-width="3"/><text x="79" y="224.0" font-size="18" fill="#173A5E" font-weight="600">A-01</text></g><text x="285" y="374.0" font-size="25" fill="#087F8C" font-weight="600">正常參考</text><g transform="translate(87 530) scale(0.7083333333333334)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7E95A9" stroke-width="2"/><path d="M22 24 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 39 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 54 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 69 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 84 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 99 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 114 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 129 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 144 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 159 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 174 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 189 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 204 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 219 H218" stroke="#9FB3C5" opacity=".3"/><circle cx="44" cy="44" r="17" fill="#526477"/><path d="M36 44 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="196" cy="44" r="17" fill="#526477"/><path d="M188 44 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="44" cy="196" r="17" fill="#526477"/><path d="M36 196 h16" stroke="#CAD8E3" stroke-width="3"/><circle cx="196" cy="196" r="17" fill="#526477"/><path d="M188 196 h16" stroke="#CAD8E3" stroke-width="3"/><path d="M133 124 L160 167 M139 124 L164 160" stroke="#A12E32" stroke-width="4"/><text x="79" y="224.0" font-size="18" fill="#173A5E" font-weight="600">A-01</text></g><text x="285" y="598.0" font-size="25" fill="#C84343" font-weight="600">待測 A-01</text><rect x="600" y="210" width="472" height="570" rx="18" fill="#F3F7FB" stroke="#CDDAE7" stroke-width="2"/><text x="624" y="255.0" font-size="27" fill="#2463C5" font-weight="800">2  共用同一個固定 DINOv2</text><rect x="648" y="348" width="375" height="235" rx="18" fill="#E5F0FA" stroke="#CDDAE7" stroke-width="2"/><text x="682" y="411.0" font-size="29" fill="#2463C5" font-weight="600">把每個局部</text><text x="682" y="453.05" font-size="29" fill="#2463C5" font-weight="600">描述成可比對的特徵</text><text x="677" y="538.0" font-size="23" fill="#173A5E" font-weight="600">權重固定，不為本產品重訓</text><text x="626" y="659.0" font-size="26" fill="#173A5E" font-weight="600">它已在大量影像上學過</text><text x="626" y="696.7" font-size="26" fill="#173A5E" font-weight="600">現在借用它辨識外觀的能力</text><path d="M542 385 L587 385" stroke="#173A5E" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M542 606 L587 606" stroke="#173A5E" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="1140" y="210" width="472" height="570" rx="18" fill="#F3F7FB" stroke="#CDDAE7" stroke-width="2"/><text x="1164" y="255.0" font-size="27" fill="#2463C5" font-weight="800">3  存參考；查待測的相似局部</text><rect x="1180" y="325" width="390" height="118" rx="18" fill="#E4F3F0" stroke="#CDDAE7" stroke-width="2"/><text x="1200" y="365.0" font-size="28" fill="#087F8C" font-weight="600">正常特徵 → 參考庫</text><text x="1200" y="411.0" font-size="22" fill="#173A5E" font-weight="600">保留來源，之後可查回原圖</text><rect x="1180" y="520" width="390" height="118" rx="18" fill="#FDEEE8" stroke="#CDDAE7" stroke-width="2"/><text x="1200" y="560.0" font-size="28" fill="#C84343" font-weight="600">待測特徵 → 查參考庫</text><text x="1200" y="606.0" font-size="23" fill="#173A5E" font-weight="600">不用先知道缺陷叫什麼</text><text x="1164" y="714.0" font-size="25" fill="#173A5E" font-weight="600">免額外訓練 ≠ 免整理與驗證</text><path d="M1082 384 L1127 384" stroke="#173A5E" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M1082 578 L1127 578" stroke="#173A5E" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="48" y="818" width="1576" height="84" rx="18" fill="#FFF4CC" stroke="#E6C669" stroke-width="2"/><text x="70" y="869.0" font-size="27" fill="#614A14" font-weight="600">模型權重沒改；你改的是「允許哪些外觀作為正常參考」。</text></svg>