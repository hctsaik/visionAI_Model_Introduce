<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><title>加正常參考，為什麼也可能漏掉刮傷？</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#173A5E"/></marker><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#ECF2F7"/><stop offset=".55" stop-color="#BACBDA"/><stop offset="1" stop-color="#E7EEF3"/></linearGradient></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#FCFCFA" stroke="#FCFCFA" stroke-width="2"/><text x="52" y="53.0" font-size="20" fill="#087F8C" font-weight="600">ANOMALYDINO / 用工作案例理解模型</text><text x="52" y="112.0" font-size="42" fill="#173A5E" font-weight="800">加正常參考，為什麼也可能漏掉刮傷？</text><text x="52" y="159.0" font-size="24" fill="#526477" font-weight="600">固定特徵與待測工件，只增加參考；距離為教學示意，兩組長條使用相同尺度。</text><rect x="60" y="210" width="472" height="570" rx="18" fill="#F3F7FB" stroke="#CDDAE7" stroke-width="2"/><text x="84" y="255.0" font-size="27" fill="#2463C5" font-weight="800">1  正常反光沒收齊 → 誤報風險</text><g transform="translate(94 301) scale(0.6458333333333334)"><rect x="0" y="0" width="240" height="240" rx="24" fill="url(#metal)" stroke="#7E95A9" stroke-width="2"/><path d="M22 24 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 39 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 54 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 69 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 84 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 99 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 114 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 129 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 144 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 159 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 174 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 189 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 204 H218" stroke="#9FB3C5" opacity=".3"/><path d="M22 219 H218" stroke="#9FB3C5" opac