<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769E0"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F38B00"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect x="0" y="0" width="1672" height="8" fill="#0B2858"/><rect x="40" y="34" width="150" height="36" rx="18" fill="#E8F2FF" stroke="#E8F2FF" stroke-width="0"/><text x="115" y="59.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" font-weight="800" fill="#1769E0" text-anchor="middle">邊界 04</text><text x="40" y="125.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="39" font-weight="900" fill="#081A38" text-anchor="start">整片一起亮，或缺件沒有亮：先不要把 residual 當缺陷結論</text><text x="40" y="171.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="500" fill="#536A91" text-anchor="start">SubspaceAD 只能量 feature 是否離既有線性 normal span 太遠；先分清量測狀態與問題型態。</text><rect x="1320" y="36" width="312" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1476" y="68.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" font-weight="800" fill="#1769E0" text-anchor="middle">SubspaceAD</text><rect x="40" y="230" width="760" height="564" rx="26" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="82" y="278.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="28" font-weight="900" fill="#0B2858" text-anchor="start">A．整片 residual 一起升高</text><text x="82" y="312.0" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="20" font-weight="600" fill="#536A91" text-anchor="start">先懷疑 acquisition／ROI／照明 recipe drift</text><clipPath id="metal-82-350"><rect x="8