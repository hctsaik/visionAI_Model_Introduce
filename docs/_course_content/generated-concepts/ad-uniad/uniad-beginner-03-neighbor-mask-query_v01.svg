e">layer-wise query decoder</text><text x="1094.0" y="315.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#7352DA" text-anchor="middle">one learned query set per layer</text><rect x="945" y="348" width="298" height="46" rx="14" fill="#FFFFFF" stroke="#F38B00" stroke-width="2"/><circle cx="968" cy="371" r="8" fill="#F38B00"/><text x="988" y="377.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#0A1A37" text-anchor="start">training: feature jitter</text><rect x="945" y="409" width="298" height="46" rx="14" fill="#FFFFFF" stroke="#7352DA" stroke-width="2"/><circle cx="968" cy="432" r="8" fill="#7352DA"/><text x="988" y="438.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#0A1A37" text-anchor="start">learned layer queries</text><rect x="945" y="470" width="298" height="46" rx="14" fill="#FFFFFF" stroke="#D9475F" stroke-width="2"/><circle cx="968" cy="493" r="8" fill="#D9475F"/><text x="988" y="499.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#0A1A37" text-anchor="start">neighbor-masked attention</text><text x="1094.0" y="565.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">force a normal-pattern estimate</text><text x="1094.0" y="589.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">not a free identity copy</text></g><rect x="916" y="635" width="356" height="112" rx="18" fill="#FFF4E4" stroke="#F38B00" stroke-width="2"/><text x="1094" y="672.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#F38B00" text-anchor="middle">training-only jitter perturbs feature input</text><text x="1094" y="701.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="middle">inference: reuse pinned state</text><path d="M1294 438 L1347 438" fill="none" stroke="#00A8C6" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><rect x="1371" y="268" width="244" height="384" rx="25" fill="#E6FBFD" stroke="#00A8C6" stroke-width="3"/><text x="1493" y="311.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#0A1A37" text-anchor="middle">reconstruct feature</text><g data-entity="uniad_feature_plane"><rect x="1401" y="343" width="184" height="207" rx="18" fill="#E6FBFD" stroke="#00A8C6" stroke-width="2"/><text x="1493.0" y="371.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#00A8C6" text-anchor="middle">F-hat</text><rect x="1418.0" y="389.0" width="22.0" height="29.333333333333336" rx="5" fill="#C7EDF1" stroke="#00A8C6" stroke-width="1.2"/><rect x="1448.0" y="389.0" width="22.0" height="29.333333333333336" rx="5" fill="#C7EDF1" stroke="#00A8C6" stroke-width="1.2"/><rect x="1478.0" y="389.0" width="22.0" height="29.333333333333336" rx="5" fill="#C7EDF1" stroke="#00A8C6" stroke-width="1.2"/><rect x="1508.0" y="389.0" width="22.0" height="29.333333333333336" rx="5" fill="#C7EDF1" stroke="#00A8C6" stroke-width="1.2"/><rect x="1538.0" y="389.0" width="22.0" height="29.333333333333336" rx="5" fill="#C7EDF1" stroke="#00A8C6" stroke-width="1.2"/><rect x="1418.0" y="426.3333333333333" width="22.0" height="29.333333333333336" rx="5" fill="#C7EDF1" stroke="#00A8C6" stroke-width="1.2"/><rect x="1448.0" y="426.3333333333333" width="22.0" height="29.333333333333336" rx="5" fill="#C7EDF1" stroke="#00A8C6" stroke-width="1.2"/><rect x="1478.0" y="426.3333333333333" width="22.0" height="29.333333333333336" rx="5" fill="#C7EDF1" stroke="#00A8C6" stroke-width="1.2"/><rect x="1508.0" y="426.3333333333333" width="22.0" height="29.333333333333336" rx="5" fill="#C7EDF1" stroke="#00A8C6" stroke-width="1.2"/><rect x="1538.0" y="426.3333333333333" width="22.0" height="29.333333333333336" rx="5" fill="#C7EDF1" stroke="#00A8C6" stroke-width="1.2"/><rect x="1418.0" y="463.6666666666667" width="22.0" height="29.333333333333336" rx="5" fill="#C7EDF1" stroke="#00A8C6" stroke-width="1.2"/><rect x="1448.0" y="463.6666666666667" width="22.0" height="29.333333333333336" rx="5" fill="#C7EDF1" stroke="#00A8C6" stroke-width="1.2"/><rect x="1478.0" y="463.6666666666667" width="22.0" height="29.333333333333336" rx="5" fill="#F38B00" fill-opacity="0.72" stroke="#F38B00" stroke-width="1.2"/><rect x="1508.0" y="463.6666666666667" width="22.0" height="29.333333333333336" rx="5" fill="#C7EDF1" stroke="#00A8C6" stroke-width="1.2"/><rect x="1538.0" y="463.6666666666667" width="22.0" height="29.333333333333336" rx="5" fill="#C7EDF1" stroke="#00A8C6" stroke-width="1.2"/><text x="1493.0" y="536.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D9475F" text-anchor="middle">not raw pixels</text></g><text x="1493" y="587.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#00A8C6" text-anchor="middle">wider normal pattern</text><text x="1493" y="615.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#52698D" text-anchor="middle">may estimate the center</text><rect x="1371" y="680" width="244" height="67" rx="18" fill="#FFF0F3" stroke="#D9475F" stroke-width="2"/><text x="1493" y="710.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">weak control? → HOLD</text><rect x="40" y="851" width="1592" height="50" rx="18" fill="#FFF5D4" stroke="#E5AB22" stroke-width="2"/><circle cx="79" cy="876" r="12" fill="#FFE29A" stroke="#C98700" stroke-width="2"/><text x="79" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#805300" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#674700" text-anchor="start">mask / jitter 是 anti-copy 假說，不是保證；要以每類真實 escape、false reject 與 drift 實測它有沒有保護到。</text></svg>