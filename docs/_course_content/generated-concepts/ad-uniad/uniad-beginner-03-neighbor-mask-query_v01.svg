<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">UniAD feature jitter, layer-wise queries, and neighbor-masked attention</title><desc id="desc">Training-time feature jitter and neighbor-masked layer-wise query reconstruction suppress an identity-copy route. The control must be verified with real category-specific escape and false-reject evidence.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7352DA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7352DA"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9475F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9475F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#08275A"/><rect x="40" y="30" width="188" height="44" rx="22" fill="#F2EEFF" stroke="#7352DA" stroke-width="2"/><text x="134" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">STEP 3 / 5</text><rect x="1300" y="30" width="332" height="44" rx="22" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="2"/><text x="1466" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">UniAD · multi-class feature path</text><text x="40" y="123.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="37" font-weight="900" fill="#0A1A37" text-anchor="start">training：jitter + layer-wise queries + neighbor mask，防止『抄隔壁』捷徑</text><text x="40" y="166.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="650" fill="#52698D" text-anchor="start">中央橘色 feature 若能從近鄰直接搬運，異常也可能被重建得太像 normal；mask 讓這個風險可被驗證</text><g data-entity="uniad_window_panel_aoi"><clipPath id="photo-mask-photo-50-270"><rect x="50" y="270" width="292" height="334" rx="23"/></clipPath><g clip-path="url(#photo-mask-photo-50-270)"><image href="uniad-industrial-shared-workpiece-anchor_v02.png" x="50" y="270" width="292" height="334" preserveAspectRatio="xMidYMid slice"/></g><rect x="50" y="270" width="292" height="334" rx="23" fill="none" stroke="#1769E0" stroke-width="3"/><rect x="231.04" y="500.46" width="52.559999999999995" height="50.1" rx="7" fill="none" stroke="#F38B00" stroke-width="4"/><text x="257.32" y="489.46" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">review cue</text><text x="196.0" y="633.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="middle">same raw ROI → selected feature</text></g><path d="M365 437 L432 437" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="455" y="240" width="354" height="430" rx="27" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="3"/><text x="632" y="286.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#0A1A37" text-anchor="middle">zoom into one selected feature layer</text><text x="632" y="315.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#F38B00" text-anchor="middle">orange cell is a candidate location</text><rect x="510" y="356" width="43" height="43" rx="7" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="565" y="356" width="43" height="43" rx="7" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="620" y="356" width="43" height="43" rx="7" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="675" y="356" width="43" height="43" rx="7" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="510" y="411" width="43" height="43" rx="7" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="565" y="411" width="43" height="43" rx="7" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="620" y="411" width="43" height="43" rx="7" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="675" y="411" width="43" height="43" rx="7" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="510" y="466" width="43" height="43" rx="7" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="565" y="466" width="43" height="43" rx="7" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="620" y="466" width="43" height="43" rx="7" fill="#F38B00" fill-opacity="0.74" stroke="#F38B00" stroke-width="1.5"/><rect x="675" y="466" width="43" height="43" rx="7" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="510" y="521" width="43" height="43" rx="7" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="565" y="521" width="43" height="43" rx="7" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="620" y="521" width="43" height="43" rx="7" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.5"/><rect x="675" y="521" width="43" height="43" rx="7" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.5"/><path d="M586 487 L641 487" fill=