<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">UniAD category roster and coverage contract</title><desc id="desc">A shared decoder is fitted over a governed multi-category normal roster. Category-specific support, balance, normal modes, and future evidence cannot be replaced by a pooled metric.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7352DA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7352DA"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9475F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9475F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#08275A"/><rect x="40" y="30" width="188" height="44" rx="22" fill="#F2EEFF" stroke="#7352DA" stroke-width="2"/><text x="134" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">STEP 2 / 5</text><rect x="1300" y="30" width="332" height="44" rx="22" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="2"/><text x="1466" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">UniAD · multi-class feature path</text><text x="40" y="123.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="37" font-weight="900" fill="#0A1A37" text-anchor="start">shared model 的輸入是治理過的 category roster，不是把所有正常品平均掉</text><text x="40" y="166.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="650" fill="#52698D" text-anchor="start">每個 category 的 normal modes、lot / view coverage、sampler、contamination 與 future split 都會改變共享 normality</text><rect x="40" y="215" width="755" height="590" rx="28" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="3"/><text x="74" y="264.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#0A1A37" text-anchor="start">一個 shared decoder 的 normal support，從三個被追蹤的 category 開始</text><g data-entity="uniad_window_panel_aoi"><rect x="78" y="304" width="204" height="245" rx="18" fill="#FFFFFF" stroke="#149A62" stroke-width="2"/><clipPath id="roster-roster-a-78-304"><rect x="90" y="316" width="180" height="183" rx="12"/></clipPath><g clip-path="url(#roster-roster-a-78-304)"><image href="uniad-industrial-shared-workpiece-anchor_v02.png" x="90" y="316" width="180" height="183" preserveAspectRatio="xMidYMid slice"/></g><rect x="90" y="316" width="180" height="183" rx="12" fill="none" stroke="#149A62" stroke-width="2"/><text x="180.0" y="531.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#149A62" text-anchor="middle">Category A · covered</text></g><g data-entity="uniad_window_panel_aoi"><rect x="315" y="304" width="204" height="245" rx="18" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><clipPath id="roster-roster-b-315-304"><rect x="327" y="316" width="180" height="183" rx="12"/></clipPath><g clip-path="url(#roster-roster-b-315-304)"><image href="uniad-industrial-shared-workpiece-anchor_v02.png" x="327" y="316" width="180" height="183" preserveAspectRatio="xMidYMid slice"/></g><rect x="327" y="316" width="180" height="183" rx="12" fill="none" stroke="#1769E0" stroke-width="2"/><text x="417.0" y="531.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="middle">Category B · covered</text></g><g data-entity="uniad_window_panel_aoi"><rect x="552" y="304" width="204" height="245" rx="18" fill="#FFFFFF" stroke="#F38B00" stroke-width="2"/><clipPath id="roster-roster-c-552-304"><rect x="564" y="316" width="180" height="183" rx="12"/></clipPath><g clip-path="url(#roster-roster-c-552-304)"><image href="uniad-industrial-shared-workpiece-anchor_v02.png" x="564" y="316" width="180" height="183" preserveAspectRatio="xMidYMid slice"/></g><rect x="564" y="316" width="180" height="183" rx="12" fill="none" stroke="#F38B00" stroke-width="2"/><text x="654.0" y="531.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">Category C · rare mode</text></g><rect x="78" y="584" width="678" height="165" rx="20" fill="#EAF8F0" stroke="#149A62" stroke-width="2"/><text x="107" y="625.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#149A62" text-anchor="start">先保留 category identity，再談 shared normality</text><text x="107" y="657.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="start">roster · normal IDs · balance / sampler · normal modes · lot / view / illumination</text><text x="107" y="687.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="start">任何一個稀有類別 coverage 不足，都不是『共享後自然補齊』。</text><rect x="831" y="245" width="323" height="461" rx="27" fill="#EAF4FF" stroke="#1769E0" stroke-width="3"/><text x="992" y="290.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#0A1A37" text-anchor="middle">one shared feature path</text><text x="992" y="319.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">fixed backbone / selected layers</text><path d="M795 474 L829 474" fill="none" stroke="#149A62" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-149A62)"/><g data-entity="uniad_frozen_multilayer_backbone"><rect x="860" y="349" width="264" height="280" rx="24" fill="#FFFFFF" stroke="#1769E0" stroke-width="3"/><text x="992.0" y="385.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#0A1A37" text-anchor="middle">fixed visual backbone</text><text x="992.0" y="411.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">checkpoint + layers pinned</text><rect x="890" y="442" width="204" height="34" rx="9" fill="#DCEBFD" stroke="#1769E0" stroke-width="1.5"/><text x="992.0" y="465.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">layer 1 · fine</text><rect x="902" y="487" width="180" height="34" rx="9" fill="#C9DDF8" stroke="#1769E0" stroke-width="1.5"/><text x="992.0" y="510.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">layer 2 · middle</text><rect x="914" y="532" width="156" height="34" rx="9" fill="#B9D4F7" stroke="#1769E0" stroke-width="1.5"/><text x="992.0" y="555.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">layer 3 · coarse</text><text x="992.0" y="613.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">feature tensors · not pixels</text></g><rect x="1200" y="245" width="400" height="461" rx="27" fill="#FFF0F3" stroke="#D9475F" stroke-width="3"/><text x="1400" y="290.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#D9475F" text-anchor="middle">pooled metric can hide a tail</text><g data-entity="uniad_window_panel_aoi"><clipPath id="photo-roster-tail-1251-335"><rect x="1251" y="335" width="190" height="204" rx="23"/></clipPath><g clip-path="url(#photo-roster-tail-1251-335)"><image href="uniad-industrial-shared-workpiece-anchor_v02.png" x="1251" y="335" width="190" height="204" preserveAspectRatio="xMidYMid slice"/></g><rect x="1251" y="335" width="190" height="204" rx="23" fill="none" stroke="#F38B00" stroke-width="3"/><rect x="1368.8" y="475.76" width="34.199999999999996" height="30.599999999999998" rx="7" fill="none" stroke="#F38B00" stroke-width="4"/><text x="1385.8999999999999" y="464.76" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">review cue</text><text x="1346.0" y="568.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="middle">Category C example</text></g><rect x="1463" y="338" width="103" height="198" rx="18" fill="#FFFFFF" stroke="#D9475F" stroke-width="2"/><rect x="1480" y="451" width="13" height="44" rx="4" fill="#9EC4FF" stroke="#9EC4FF" stroke-width="0"/><rect x="1499" y="430" width="13" height="65" rx="4" fill="#9EC4FF" stroke="#9EC4FF" stroke-width="0"/><rect x="1518" y="407" width="13" height="88" rx="4" fill="#9EC4FF" stroke="#9EC4FF" stroke-width="0"/><rect x="1537" y="379" width="13" height="116" rx="4" fill="#F38B00" stroke="#F38B00" stroke-width="0"/><text x="1515" y="521.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">C tail</text><text x="1400" y="590.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#D9475F" text-anchor="middle">A / B looks fine does not qualify C</text><text x="1400" y="620.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="middle">measure C: escapes · false rejects · review load</text><text x="1400" y="651.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#D9475F" text-anchor="middle">missing evidence → HOLD</text><rect x="831" y="744" width="769" height="61" rx="18" fill="#FFF4E4" stroke="#F38B00" stroke-width="2"/><text x="1216" y="781.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#805300" text-anchor="middle">共享 feature space 可以減少 operations；它不會替稀有 category 生成未見 normal mode。</text><rect x="40" y="851" width="1592" height="50" rx="18" fill="#FFF5D4" stroke="#E5AB22" stroke-width="2"/><circle cx="79" cy="876" r="12" fill="#FFE29A" stroke="#C98700" stroke-width="2"/><text x="79" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#805300" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#674700" text-anchor="start">UniAD 的 multi-class value 只有在 roster 受治理、support 有代表性、每類 operating evidence 可量時才成立。</text></svg>