<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">UniAD per-category qualification and HOLD boundary</title><desc id="desc">A UniAD candidate needs raw ROI, category, model state, map rule, and per-category support, operating, and future evidence. Weak anti-copy controls, rare-class gaps, or unobservable faults require HOLD.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7352DA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7352DA"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9475F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9475F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#08275A"/><rect x="40" y="30" width="188" height="44" rx="22" fill="#F2EEFF" stroke="#7352DA" stroke-width="2"/><text x="134" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">STEP 5 / 5</text><rect x="1300" y="30" width="332" height="44" rx="22" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="2"/><text x="1466" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">UniAD · multi-class feature path</text><text x="40" y="123.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="37" font-weight="900" fill="#0A1A37" text-anchor="start">candidate 必須回到『這個 category 的證據』；只有 pooled 成績時，正確動作是 HOLD</text><text x="40" y="166.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="650" fill="#52698D" text-anchor="start">保留 raw ROI、category ID、feature / decoder state、per-layer map、fusion rule、threshold 與每類 future / drift evidence</text><rect x="40" y="232" width="420" height="543" rx="27" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="3"/><text x="250" y="277.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#0A1A37" text-anchor="middle">same Category C workpiece</text><g data-entity="uniad_window_panel_aoi"><clipPath id="photo-evidence-photo-83-313"><rect x="83" y="313" width="252" height="256" rx="23"/></clipPath><g clip-path="url(#photo-evidence-photo-83-313)"><image href="uniad-industrial-shared-workpiece-anchor_v02.png" x="83" y="313" width="252" height="256" preserveAspectRatio="xMidYMid slice"/></g><rect x="83" y="313" width="252" height="256" rx="23" fill="none" stroke="#F38B00" stroke-width="3"/><rect x="239.24" y="489.64" width="45.36" height="38.4" rx="7" fill="none" stroke="#F38B00" stroke-width="4"/><text x="261.92" y="478.64" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">review cue</text><text x="209.0" y="598.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="middle">raw ROI</text></g><g data-entity="uniad_layer_feature_residual"><rect x="98" y="629" width="222" height="129" rx="22" fill="#FFF4E4" stroke="#F38B00" stroke-width="3"/><text x="209.0" y="662.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0A1A37" text-anchor="middle">C candidate map</text><text x="209.0" y="687.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#F38B00" text-anchor="middle">feature residual</text><rect x="124.0" y="701.0" width="38.0" height="10.5" rx="5" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.2"/><rect x="166.5" y="701.0" width="38.0" height="10.5" rx="5" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.2"/><rect x="209.0" y="701.0" width="38.0" height="10.5" rx="5" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.2"/><rect x="251.5" y="701.0" width="38.0" height="10.5" rx="5" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.2"/><rect x="124.0" y="715.5" width="38.0" height="10.5" rx="5" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.2"/><rect x="166.5" y="715.5" width="38.0" height="10.5" rx="5" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.2"/><rect x="209.0" y="715.5" width="38.0" height="10.5" rx="5" fill="#F38B00" fill-opacity="0.72" stroke="#F38B00" stroke-width="1.2"/><rect x="251.5" y="715.5" width="38.0" height="10.5" rx="5" fill="#DCE9FA" stroke="#1769E0" stroke-width="1.2"/><text x="209.0" y="742.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">not probability</text></g><path d="M480 495 L537 495" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><rect x="560" y="232" width="553" height="543" rx="27" fill="#EAF4FF" stroke="#1769E0" stroke-width="3"/><text x="836" y="278.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#0A1A37" text-anchor="middle">per-category qualification evidence</text><text x="836" y="307.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">candidate is useful only with its operating context</text><rect x="595" y="320" width="483" height="80" rx="16" fill="#FFFFFF" stroke="#149A62" stroke-width="2"/><circle cx="626" cy="360" r="10" fill="#149A62"/><text x="651" y="364.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#149A62" text-anchor="start">1 · support is representative</text><text x="651" y="390.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="780" fill="#0A1A37" text-anchor="start">normal IDs · rare-mode coverage · contamination</text><rect x="595" y="423" width="483" height="80" rx="16" fill="#FFFFFF" stroke="#F38B00" stroke-width="2"/><circle cx="626" cy="463" r="10" fill="#F38B00"/><text x="651" y="467.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#F38B00" text-anchor="start">2 · candidate behavior is measured</text><text x="651" y="493.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="780" fill="#0A1A37" text-anchor="start">low-FPR escape · false reject · review load</text><rect x="595" y="526" width="483" height="80" rx="16" fill="#FFFFFF" stroke="#7352DA" stroke-width="2"/><circle cx="626" cy="566" r="10" fill="#7352DA"/><text x="651" y="570.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#7352DA" text-anchor="start">3 · future behavior is measured</text><text x="651" y="596.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="780" fill="#0A1A37" text-anchor="start">future/drift split · ablation · P95 / P99</text><rect x="595" y="656" width="483" height="75" rx="16" fill="#FFF0F3" stroke="#D9475F" stroke-width="2"/><text x="836" y="687.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D9475F" text-anchor="middle">pooled AUROC cannot replace Category C evidence</text><text x="836" y="714.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">missing category evidence → HOLD</text><path d="M1135 495 L1190 495" fill="none" stroke="#D9475F" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-D9475F)"/><rect x="1214" y="232" width="400" height="543" rx="27" fill="#FFF0F3" stroke="#D9475F" stroke-width="3"/><text x="1414" y="278.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#D9475F" text-anchor="middle">what can break the causal chain?</text><circle cx="1255" cy="349" r="10" fill="#D9475F"/><text x="1278" y="356.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D9475F" text-anchor="start">shortcut controls weaken</text><text x="1278" y="383.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="780" fill="#0A1A37" text-anchor="start">copy → residual becomes too small</text><circle cx="1255" cy="460" r="10" fill="#D9475F"/><text x="1278" y="467.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D9475F" text-anchor="start">rare normal mode is missing</text><text x="1278" y="494.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="780" fill="#0A1A37" text-anchor="start">Category C normal → false reject tail</text><circle cx="1255" cy="571" r="10" fill="#D9475F"/><text x="1278" y="578.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D9475F" text-anchor="start">tiny / logical fault is unseen</text><text x="1278" y="605.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="780" fill="#0A1A37" text-anchor="start">local feature cannot see it</text><rect x="1244" y="665" width="340" height="65" rx="16" fill="#FFFFFF" stroke="#D9475F" stroke-width="2"/><text x="1414" y="695.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">HOLD → preserve → investigate</text><rect x="40" y="851" width="1592" height="50" rx="18" fill="#FFF5D4" stroke="#E5AB22" stroke-width="2"/><circle cx="79" cy="876" r="12" fill="#FFE29A" stroke="#C98700" stroke-width="2"/><text x="79" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#805300" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#674700" text-anchor="start">UniAD 交付的是可回查的 per-category candidate evidence；當觀測、support 或 anti-copy contract 不成立時，不要把 candidate 推進成產品結論。</text></svg>