stroke-width="2"/><circle cx="79" cy="876" r="12" fill="#FFE29A" stroke="#C98700" stroke-width="2"/><text x="79" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#765000" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#674700" text-anchor="start">小 residual 只支持已宣告的幾何假設；仍要看 coverage、conditioning、tail 和 downstream safety owner。</text></svg>