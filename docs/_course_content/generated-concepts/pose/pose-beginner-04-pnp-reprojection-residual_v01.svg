<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Pose PnP candidate and reprojection residual</title><desc id="desc">PnP or RANSAC consumes calibrated K and named P_i to u_i pairs to create an R,t pose candidate. Reprojected declared points are compared against observed image points to make residual e_i visible.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7352DA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7352DA"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9485F"/></marker><marker id="arrow-F2B641" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F2B641"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#0B2858"/><rect x="40" y="31" width="178" height="42" rx="21" fill="#F2EEFF" stroke="#7352DA" stroke-width="2"/><text x="129" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">STEP 4 / 6</text><rect x="1277" y="31" width="355" height="42" rx="21" fill="#FFFFFF" stroke="#A7C9FA" stroke-width="2"/><text x="1454" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="middle">Pose：calibrated geometry path</text><text x="40" y="121.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#081A38" text-anchor="start">PnP 解出的是 pose 假設；把 3D 點投回來才看得到 residual</text><text x="40" y="164.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="650" fill="#52698D" text-anchor="start">用 calibrated K 和明確的 Pᵢ↔uᵢ 求 R, t；再重投影 Pᵢ，量 observed 與 predicted 的距離 eᵢ。</text><rect x="40" y="204" width="1592" height="76" rx="22" fill="#F2EEFF" stroke="#7352DA" stroke-width="2"/><text x="836" y="238.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#7352DA" text-anchor="middle">K + (Pᵢ ↔ uᵢ)  →  PnP / RANSAC  →  pose candidate (R, t)  →  reproject Pᵢ  →  residual eᵢ</text><g data-entity="pose_calibrated_inspection_camera"><rect x="109.1" y="363.1" width="147.0" height="130.20000000000002" rx="23.1" fill="#DDEBFF" stroke="#1769E0" stroke-width="3.1500000000000004"/><rect x="131.15" y="384.1" width="102.9" height="35.7" rx="9.450000000000001" fill="#FFFFFF" stroke="#1769E0" stroke-width="2.1"/><circle cx="183.65" cy="449.2" r="36.75" fill="#182B50" stroke="#071A3B" stroke-width="4.2"/><circle cx="183.65" cy="449.2" r="24.150000000000002" fill="#14B6D4" stroke="#D7F9FF" stroke-width="3.1500000000000004"/><circle cx="183.65" cy="449.2" r="10.5" fill="#071A3B"/><path d="M150.05 483.85 L183.65 577.3 L217.25 483.85z" fill="#BFEFFF" fill-opacity=".38" stroke="#00A8C6" stroke-width="2.1"/><path d="M183.65 545.8 L245.6 545.8" fill="none" stroke="#D9485F" stroke-width="3.1500000000000004" stroke-linecap="round" marker-end="url(#arrow-D9485F)"/><path d="M183.65 545.8 L183.65 485.95000000000005" fill="none" stroke="#149A62" stroke-width="3.1500000000000004" stroke-linecap="round" marker-end="url(#arrow-149A62)"/><text x="183.65" y="605.6500000000001" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#0B2858" text-anchor="middle">calibrated camera</text></g><g data-entity="pose_declared_3d_fixture"><rect x="315" y="332" width="430" height="360" rx="24" fill="#FFFFFF" stroke="#7352DA" stroke-width="3"/><text x="530.0" y="367.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0B2858" text-anchor="middle">3D fixture points Pᵢ</text><polygon points="392.4,476.0 562.68,432.8 628.9,516.32 446.79499999999996,562.4" fill="#E7F0FF" stroke="#1769E0" stroke-width="3"/><polygon points="446.79499999999996,562.4 628.9,516.32 628.9,556.64 446.79499999999996,598.4" fill="#D9E7FC" stroke="#1769E0" stroke-width="3"/><polygon points="628.9,516.32 562.68,432.8 562.68,474.56 628.9,556.64" fill="#C5D9F8" stroke="#1769E0" stroke-width="3"/><circle cx="451.34000000000003" cy="481.8" r="10" fill="#FFFFFF" stroke="#F38B00" stroke-width="4"/><circle cx="451.34000000000003" cy="481.8" r="3.5" fill="#F38B00"/><text x="467.34000000000003" y="470.8" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="start">P1</text><circle cx="594.98" cy="456.72" r="10" fill="#FFFFFF" stroke="#00A8C6" stroke-width="4"/><circle cx="594.98" cy="456.72" r="3.5" fill="#00A8C6"/><text x="610.98" y="445.72" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#00A8C6" text-anchor="start">P2</text><circle cx="618.9200000000001" cy="557.04" r="10" fill="#FFFFFF" stroke="#149A62" stroke-width="4"/><circle cx="618.9200000000001" cy="557.04" r="3.5" fill="#149A62"/><text x="634.9200000000001" y="546.04" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#149A62" text-anchor="start">P3</text><circle cx="475.28000000000003" cy="575.28" r="10" fill="#FFFFFF" stroke="#7352DA" stroke-width="4"/><circle cx="475.28000000000003" cy="575.28" r="3.5" fill="#7352DA"/><text x="491.28000000000003" y="564.28" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="start">P4</text><path d="M396.7 630.8 L470.7 630.8" fill="none" stroke="#D9485F" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-D9485F)"/><path d="M396.7 630.8 L396.7 569.8" fill="none" stroke="#149A62" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-149A62)"/><path d="M396.7 630.8 L438.7 588.8" fill="none" stroke="#1769E0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><text x="480.7" y="636.8" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9485F" text-anchor="start">X</text><text x="391.7" y="558.8" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#149A62" text-anchor="start">Y</text><text x="447.7" y="583.8" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="start">Z</text></g><path d="M275 505 L300 505" fill="none" stroke="#00A8C6" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><path d="M764 510 L808 510" fill="none" stroke="#7352DA" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-7352DA)"/><g data-entity="pose_pnp_geometric_solver"><rect x="829" y="342" width="314" height="331" rx="28" fill="#F2EEFF" stroke="#7352DA" stroke-width="3"/><text x="986.0" y="384.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#081A38" text-anchor="middle">PnP / RANSAC</text><text x="986.0" y="415.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#7352DA" text-anchor="middle">geometric solver</text><rect x="857" y="445" width="258" height="52" rx="14" fill="#FFFFFF" stroke="#7352DA" stroke-width="2"/><text x="986.0" y="477.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#0B2858" text-anchor="middle">input: K + (Pᵢ ↔ uᵢ)</text><path d="M986.0 508 L986.0 550" fill="none" stroke="#7352DA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-7352DA)"/><rect x="857" y="563" width="258" height="70" rx="14" fill="#E9F8F0" stroke="#149A62" stroke-width="2"/><text x="986.0" y="593.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#149A62" text-anchor="middle">pose candidate</text><text x="986.0" y="619.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#0B2858" text-anchor="middle">R, t  +  inlier set</text><text x="986.0" y="655.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9485F" text-anchor="middle">not a detector / matcher</text></g><path d="M1162 510 L1208 510" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><g data-entity="pose_image_observations"><rect x="1231" y="330" width="353" height="369" rx="24" fill="#FFFFFF" stroke="#1769E0" stroke-width="3"/><text x="1407.5" y="365.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0B2858" text-anchor="middle">reprojection check</text><rect x="