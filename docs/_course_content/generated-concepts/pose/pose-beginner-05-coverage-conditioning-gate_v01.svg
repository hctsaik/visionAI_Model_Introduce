<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Pose coverage and conditioning qualification gate</title><desc id="desc">Wide image and object coverage plus non-degenerate 3D geometry support a residual and repeatability review. A clustered or nearly-collinear set can show local residuals while remaining too weak to qualify a pose.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7352DA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7352DA"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9485F"/></marker><marker id="arrow-F2B641" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F2B641"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#0B2858"/><rect x="40" y="31" width="178" height="42" rx="21" fill="#F2EEFF" stroke="#7352DA" stroke-width="2"/><text x="129" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">STEP 5 / 6</text><rect x="1277" y="31" width="355" height="42" rx="21" fill="#FFFFFF" stroke="#A7C9FA" stroke-width="2"/><text x="1454" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="middle">Pose：calibrated geometry path</text><text x="40" y="121.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#081A38" text-anchor="start">同樣有 residual，coverage 與 conditioning 仍會改變答案能不能用</text><text x="40" y="164.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="650" fill="#52698D" text-anchor="start">點要跨使用範圍、幾何要能約束 pose；一小塊集中或近共線的點，即使局部 residual 小，也可能不穩。</text><rect x="40" y="202" width="1592" height="76" rx="22" fill="#FFF4E4" stroke="#F38B00" stroke-width="2"/><text x="836" y="236.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#F38B00" text-anchor="middle">qualification gate = calibration revision + image/3D coverage + geometric conditioning + residual distribution / repeatability</text><rect x="55" y="316" width="743" height="470" rx="28" fill="#FFFFFF" stroke="#149A62" stroke-width="3"/><text x="426" y="356.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#149A62" text-anchor="middle">A · points spread across the declared working range</text><g data-entity="pose_image_observations"><rect x="82" y="389" width="338" height="293" rx="24" fill="#FFFFFF" stroke="#1769E0" stroke-width="3"/><text x="251.0" y="424.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0B2858" text-anchor="middle">wide image coverage</text><rect x="116" y="450" width="270" height="182" rx="16" fill="#F7FBFF" stroke="#C3DAFF" stroke-width="1.5"/><path d="M170.0 450 L170.0 632" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><path d="M224.0 450 L224.0 632" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><path d="M278.0 450 L278.0 632" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><path d="M332.0 450 L332.0 632" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><path d="M116 510.6666666666667 L386 510.6666666666667" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><path d="M116 571.3333333333334 L386 571.3333333333334" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><circle cx="175.4" cy="508.24" r="10" fill="#FFFFFF" stroke="#F38B00" stroke-width="4"/><circle cx="175.4" cy="508.24" r="3.5" fill="#F38B00"/><text x="192.4" y="497.24" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="start">u1</text><circle cx="321.2" cy="500.96000000000004" r="10" fill="#FFFFFF" stroke="#00A8C6" stroke-width="4"/><circle cx="321.2" cy="500.96000000000004" r="3.5" fill="#00A8C6"/><text x="338.2" y="489.96000000000004" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#00A8C6" text-anchor="start">u2</text><circle cx="197.0" cy="581.04" r="10" fill="#FFFFFF" stroke="#149A62" stroke-width="4"/><circle cx="197.0" cy="581.04" r="3.5" fill="#149A62"/><text x="214.0" y="570.04" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#149A62" text-anchor="start">u3</text><circle cx="329.3" cy="573.76" r="10" fill="#FFFFFF" stroke="#7352DA" stroke-width="4"/><circle cx="329.3" cy="573.76" r="3.5" fill="#7352DA"/><text x="346.3" y="562.76" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="start">u4</text></g><g data-entity="pose_declared_3d_fixture"><rect x="453" y="389" width="313" height="293" rx="24" fill="#FFFFFF" stroke="#7352DA" stroke-width="3"/><text x="609.5" y="424.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0B2858" text-anchor="middle">3D points span a surface</text><polygon points="509.34,506.20000000000005 633.288,471.04 681.49,539.0160000000001 548.9345,576.52" fill="#E7F0FF" stroke="#1769E0" stroke-width="3"/><polygon points="548.9345,576.52 681.49,539.0160000000001 681.49,571.832 548.9345,605.82" fill="#D9E7FC" stroke="#1769E0" stroke-width="3"/><polygon points="681.49,539.0160000000001 633.288,471.04 633.288,505.028 681.49,571.832" fill="#C5D9F8" stroke="#1769E0" stroke-width="3"/><circle cx="557.75" cy="515.35" r="10" fill="#FFFFFF" stroke="#F38B00" stroke-width="4"/><circle cx="557.75" cy="515.35" r="3.5" fill="#F38B00"/><text x="573.75" y="504.35" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="start">P1</text><circle cx="652.25" cy="497.64" r="10" fill="#FFFFFF" stroke="#00A8C6" stroke-width="4"/><circle cx="652.25" cy="497.64" r="3.5" fill="#00A8C6"/><text x="668.25" y="486.64" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#00A8C6" text-anchor="start">P2</text><circle cx="668.0" cy="568.48" r="10" fill="#FFFFFF" stroke="#149A62" stroke-width="4"/><circle cx="668.0" cy="568.48" r="3.5" fill="#149A62"/><text x="684.0" y="557.48" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#149A62" text-anchor="start">P3</text><circle cx="573.5" cy="581.36" r="10" fill="#FFFFFF" stroke="#7352DA" stroke-width="4"/><circle cx="573.5" cy="581.36" r="3.5" fill="#7352DA"/><text x="589.5" y="570.36" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="start">P4</text><path d="M512.47 632.19 L586.47 632.19" fill="none" stroke="#D9485F" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-D9485F)"/><path d="M512.47 632.19 L512.47 571.19" fill="none" stroke="#149A62" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-149A62)"/><path d="M512.47 632.19 L554.47 590.19" fill="none" stroke="#1769E0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><text x="596.47" y="638.19" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9485F" text-anchor="start">X</text><text x="507.47" y="560.19" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#149A62" text-anchor="start">Y</text><text x="563.47" y="585.19" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="start">Z</text></g><text x="426" y="725.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#149A62" text-anchor="middle">coverage + non-degenerate geometry → eligible for residual / repeatability review</text><rect x="874" y="316" width="743" height="470" rx="28" fill="#FFFFFF" stroke="#D9485F" stroke-width="3"/><text x="1246" y="356.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#D9485F" text-anchor="middle">B · points cluster / become nearly collinear</text><g data-entity="pose_image_observations"><rect x="901" y="389" width="338" height="293" rx="24" fill="#FFFFFF" stroke="#1769E0" stroke-width="3"/><text x="1070.0" y="424.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0B2858" text-anchor="middle">local cluster only</text><rect x="935" y="450" width="270" height="182" rx="16" fill="#F7FBFF" stroke="#C3DAFF" stroke-width="1.5"/><path d="M989.0 450 L989.0 632" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><path d="M1043.0 450 L1043.0 632" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><path d="M1097.0 450 L1097.0 632" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><path d="M1151.0 450 L1151.0 632" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><path d="M935 510.6666666666667 L1205 510.6666666666667" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><path d="M935 571.3333333333334 L1205 571.3333333333334" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><circle cx="1070.0" cy="528.26" r="10" fill="#FFFFFF" stroke="#F38B00" stroke-width="4"/><circle cx="1070.0" cy="528.26" r="3.5" fill="#F38B00"/><text x="1087.0" y="517.26" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="start">u1</text><circle cx="1097.0" cy="531.9" r="10" fill="#FFFFFF" stroke="#00A8C6" stroke-width="4"/><circle cx="1097.0" cy="531.9" r="3.5" fill="#00A8C6"/><text x="1114.0" y="520.9" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#00A8C6" text-anchor="start">u2</text><circle cx="1067.3" cy="553.74" r="10" fill="#FFFFFF" stroke="#149A62" stroke-width="4"/><circle cx="1067.3" cy="553.74" r="3.5" fill="#149A62"/><text x="1084.3" y="542.74" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#149A62" text-anchor="start">u3</text><circle cx="1097.0" cy="559.2" r="10" fill="#FFFFFF" stroke="#7352DA" stroke-width="4"/><circle cx="1097.0" cy="559.2" r="3.5" fill="#7352DA"/><text x="1114.0" y="548.2" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="start">u4</text></g><g data-entity="pose_declared_3d_fixture"><rect x="1272" y="389" width="313" height="293" rx="24" fill="#FFFFFF" stroke="#7352DA" stroke-width="3"/><text x="1428.5" y="424.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0B2858" text-anchor="middle">weak 3D conditioning</text><polygon points="1328.34,512.0600000000001 1500.49,512.0600000000001 1457.4524999999999,544.876 1293.9099999999999,544.876" fill="#FFF4E4" stroke="#F38B00" stroke-width="3"/><circle cx="1379.0" cy="534.67" r="10" fill="#FFFFFF" stroke="#F38B00" stroke-width="4"/><circle cx="1379.0" cy="534.67" r="3.5" fill="#F38B00"/><text x="1395.0" y="523.67" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="start">P1</text><circle cx="1415.0" cy="537.89" r="10" fill="#FFFFFF" stroke="#00A8C6" stroke-width="4"/><circle cx="1415.0" cy="537.89" r="3.5" fill="#00A8C6"/><text x="1431.0" y="526.89" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#00A8C6" text-anchor="start">P2</text><circle cx="1448.75" cy="541.11" r="10" fill="#FFFFFF" stroke="#149A62" stroke-width="4"/><circle cx="1448.75" cy="541.11" r="3.5" fill="#149A62"/><text x="1464.75" y="530.11" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#149A62" text-anchor="start">P3</text><circle cx="1482.5" cy="544.33" r="10" fill="#FFFFFF" stroke="#7352DA" stroke-width="4"/><circle cx="1482.5" cy="544.33" r="3.5" fill="#7352DA"/><text x="1498.5" y="533.33" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="start">P4</text><path d="M1331.47 632.19 L1405.47 632.19" fill="none" stroke="#D9485F" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-D9485F)"/><path d="M1331.47 632.19 L1331.47 571.19" fill="none" stroke="#149A62" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-149A62)"/><path d="M1331.47 632.19 L1373.47 590.19" fill="none" stroke="#1769E0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><text x="1415.47" y="638.19" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9485F" text-anchor="start">X</text><text x="1326.47" y="560.19" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#149A62" text-anchor="start">Y</text><text x="1382.47" y="585.19" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="start">Z</text></g><text x="1246" y="725.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9485F" text-anchor="middle">local eᵢ may look small; untested directions remain weak → HOLD / re-qualify</text><path d="M799 550 L854 550" fill="none" stroke="#F38B00" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><rect x="721" y="506" width="211" height="89" rx="20" fill="#FFF4E4" stroke="#F38B00" stroke-width="2"/><text x="826" y="541.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#F38B00" text-anchor="middle">do not average</text><text x="826" y="568.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9485F" text-anchor="middle">away the tail</text><rect x="55" y="804" width="1562" height="27" rx="13" fill="#FFF8E8" stroke="#F3C762" stroke-width="1.5"/><text x="836" y="825.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0B2858" text-anchor="middle">also lock distortion / intrinsics revision, usable pixels, pose diversity, residual P95 and re-mount repeatability</text><rect x="40" y="851" width="1592" height="50" rx="18" fill="#FFF6D9" stroke="#E5AB22" stroke-width="2"/><circle cx="79" cy="876" r="12" fill="#FFE29A" stroke="#C98700" stroke-width="2"/><text x="79" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#765000" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#674700" text-anchor="start">coverage 是被測過的範圍；conditioning 是這些點能否真正約束 pose。兩者缺一，就不是可放行證據。</text></svg>