<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Pose calibrated intrinsics and 2D to 3D correspondence contract</title><desc id="desc">Calibrated intrinsics and distortion, named point identities, units, object frame, and fixture revision bind observed image pixels u_i to declared 3D object points P_i. Keypoint R-CNN, SIFT, and LightGlue may help upstream but do not supply this complete contract alone.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7352DA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7352DA"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9485F"/></marker><marker id="arrow-F2B641" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F2B641"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#0B2858"/><rect x="40" y="31" width="178" height="42" rx="21" fill="#F2EEFF" stroke="#7352DA" stroke-width="2"/><text x="129" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">STEP 3 / 6</text><rect x="1277" y="31" width="355" height="42" rx="21" fill="#FFFFFF" stroke="#A7C9FA" stroke-width="2"/><text x="1454" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="middle">Pose：calibrated geometry path</text><text x="40" y="121.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#081A38" text-anchor="start">每一條 correspondence 都要有身分、座標系與版本</text><text x="40" y="164.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="650" fill="#52698D" text-anchor="start">PnP 不吃一堆看似相似的點；它需要同一個 Pᵢ 和 uᵢ 被明確宣告為同一個物理特徵。</text><rect x="40" y="202" width="1592" height="82" rx="22" fill="#E7FBFD" stroke="#00A8C6" stroke-width="2"/><text x="74" y="237.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#00A8C6" text-anchor="start">calibrated K / distortion</text><path d="M346 232 L414 232" fill="none" stroke="#00A8C6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><text x="442" y="237.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#7352DA" text-anchor="start">named IDs: P1↔u1 … P4↔u4</text><path d="M822 232 L890 232" fill="none" stroke="#7352DA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-7352DA)"/><text x="918" y="237.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#0B2858" text-anchor="start">same unit · object frame · fixture revision</text><text x="74" y="266.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52698D" text-anchor="start">先確認『哪個點是誰』，再確認『它在哪個座標系』；相似外觀不是 correspondence 的證明。</text><g data-entity="pose_image_observations"><rect x="74" y="330" width="514" height="353" rx="24" fill="#FFFFFF" stroke="#1769E0" stroke-width="3"/><text x="331.0" y="365.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0B2858" text-anchor="middle">observed image points uᵢ</text><rect x="108" y="391" width="446" height="242" rx="16" fill="#F7FBFF" stroke="#C3DAFF" stroke-width="1.5"/><path d="M197.2 391 L197.2 633" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><path d="M286.4 391 L286.4 633" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><path d="M375.6 391 L375.6 633" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><path d="M464.8 391 L464.8 633" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><path d="M108 471.6666666666667 L554 471.6666666666667" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><path d="M108 552.3333333333334 L554 552.3333333333334" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><circle cx="206.12" cy="468.44" r="10" fill="#FFFFFF" stroke="#F38B00" stroke-width="4"/><circle cx="206.12" cy="468.44" r="3.5" fill="#F38B00"/><text x="223.12" y="457.44" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="start">u1</text><circle cx="446.96" cy="458.76" r="10" fill="#FFFFFF" stroke="#00A8C6" stroke-width="4"/><circle cx="446.96" cy="458.76" r="3.5" fill="#00A8C6"/><text x="463.96" y="447.76" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#00A8C6" text-anchor="start">u2</text><circle cx="241.79999999999998" cy="565.24" r="10" fill="#FFFFFF" stroke="#149A62" stroke-width="4"/><circle cx="241.79999999999998" cy="565.24" r="3.5" fill="#149A62"/><text x="258.79999999999995" y="554.24" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#149A62" text-anchor="start">u3</text><circle cx="460.34000000000003" cy="555.56" r="10" fill="#FFFFFF" stroke="#7352DA" stroke-width="4"/><circle cx="460.34000000000003" cy="555.56" r="3.5" fill="#7352DA"/><text x="477.34000000000003" y="544.56" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="start">u4</text></g><text x="331" y="721.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#1769E0" text-anchor="middle">2D image plane</text><rect x="665" y="329" width="338" height="357" rx="24" fill="#FFFFFF" stroke="#A7C9FA" stroke-width="2"/><text x="834" y="370.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#081A38" text-anchor="middle">identity bridge</text><path d="M710 408 L740 408" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round"/><text x="765" y="415.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#F38B00" text-anchor="start">P1  ↔  u1</text><path d="M710 465 L740 465" fill="none" stroke="#00A8C6" stroke-width="6" stroke-linecap="round"/><text x="765" y="472.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#00A8C6" text-anchor="start">P2  ↔  u2</text><path d="M710 522 L740 522" fill="none" stroke="#149A62" stroke-width="6" stroke-linecap="round"/><text x="765" y="529.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#149A62" text-anchor="start">P3  ↔  u3</text><path d="M710 579 L740 579" fill="none" stroke="#7352DA" stroke-width="6" stroke-linecap="round"/><text x="765" y="586.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#7352DA" text-anchor="start">P4  ↔  u4</text><text x="834" y="654.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9485F" text-anchor="middle">ID / order / frame must match</text><path d="M605 510 L647 510" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><path d="M1020 510 L1062 510" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><g data-entity="pose_declared_3d_fixture"><rect x="1080" y="330" width="506" height="353" rx="24" fill="#FFFFFF" stroke="#7352DA" stroke-width="3"/><text x="1333.0" y="365.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0B2858" text-anchor="middle">declared 3D object points Pᵢ</text><polygon points="1171.08,471.20000000000005 1371.456,428.84000000000003 1449.3799999999999,510.73600000000005 1235.089,555.9200000000001" fill="#E7F0FF" stroke="#1769E0" stroke-width="3"/><polygon points="1235.089,555.9200000000001 1449.3799999999999,510.73600000000005 1449.3799999999999,550.272 1235.089,591.22" fill="#D9E7FC" stroke="#1769E0" stroke-width="3"/><polygon points="1449.3799999999999,510.73600000000005 1371.456,428.84000000000003 1371.456,469.788 1449.3799999999999,550.272" fill="#C5D9F8" stroke="#1769E0" stroke-width="3"/><circle cx="1236.8600000000001" cy="477.35" r="10" fill="#FFFFFF" stroke="#F38B00" stroke-width="4"/><circle cx="1236.8600000000001" cy="477.35" r="3.5" fill="#F38B00"/><text x="1252.8600000000001" y="466.35" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="start">P1</text><circle cx="1412.42" cy="453.04" r="10" fill="#FFFFFF" stroke="#00A8C6" stroke-width="4"/><circle cx="1412.42" cy="453.04" r="3.5" fill="#00A8C6"/><text x="1428.42" y="442.04" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#00A8C6" text-anchor="start">P2</text><circle cx="1441.68" cy="550.28" r="10" fill="#FFFFFF" stroke="#149A62" stroke-width="4"/><circle cx="1441.68" cy="550.28" r="3.5" fill="#149A62"/><text x="1457.68" y="539.28" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#149A62" text-anchor="start">P3</text><circle cx="1266.12" cy="567.96" r="10" fill="#FFFFFF" stroke="#7352DA" stroke-width="4"/><circle cx="1266.12" cy="567.96" r="3.5" fill="#7352DA"/><text x="1282.12" y="556.96" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="start">P4</text><path d="M1176.14 622.99 L1250.14 622.99" fill="none" stroke="#D9485F" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-D9485F)"/><path d="M1176.14 622.99 L1176.14 561.99" fill="none" stroke="#149A62" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-149A62)"/><path d="M1176.14 622.99 L1218.14 580.99" fill="none" stroke="#1769E0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><text x="1260.14" y="628.99" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9485F" text-anchor="start">X</text><text x="1171.14" y="550.99" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#149A62" text-anchor="start">Y</text><text x="1227.14" y="575.99" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="start">Z</text></g><text x="1333" y="721.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#7352DA" text-anchor="middle">fixture / object frame</text><rect x="74" y="756" width="1512" height="54" rx="18" fill="#FFFFFF" stroke="#A7C9FA" stroke-width="2"/><text x="104" y="790.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#0B2858" text-anchor="start">責任邊界：Keypoint R-CNN 可提供 2D instance landmarks；SIFT／LightGlue 可提供 image↔image matches；兩者都還缺 known 3D Pᵢ + calibrated K。</text><rect x="40" y="851" width="1592" height="50" rx="18" fill="#FFF6D9" stroke="#E5AB22" stroke-width="2"/><circle cx="79" cy="876" r="12" fill="#FFE29A" stroke="#C98700" stroke-width="2"/><text x="79" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#765000" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#674700" text-anchor="start">「點找得到」與「點能支援 calibrated 2D↔3D PnP」是兩個不同的工程契約。</text></svg>