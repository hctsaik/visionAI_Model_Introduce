<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12Z" fill="#0754b8"/></marker></defs><rect x="0" y="0" width="1672" height="941" rx="0" fill="#fff" stroke="none" stroke-width="2"/><text x="30" y="60" font-size="34" fill="#173650" font-weight="800" text-anchor="start">Pose Pipeline：用對應點解釋物體姿態</text><text x="30" y="108" font-size="23" fill="#087f85" font-weight="500" text-anchor="start">G-01合成治具 · 沿用已保存的OpenCV解算資料</text><rect x="24" y="839" width="672" height="80" rx="12" fill="#fff3d5" stroke="#e9c878" stroke-width="2"/><text x="40" y="872" font-size="27" fill="#173650" font-weight="700" text-anchor="start">2D點＋已知3D點＋相機參數 → PnP。</text><text x="40" y="905" font-size="27" fill="#173650" font-weight="700" text-anchor="start">求旋轉／位移後，投回影像驗證。</text><text x="35" y="180" font-size="27" fill="#173650" font-weight="700" text-anchor="start">影像只給像素座標；</text><text x="35" y="223" font-size="27" fill="#173650" font-weight="700" text-anchor="start">要問物體朝哪裡、距相機多遠，還缺幾何。</text><rect x="35" y="287" width="296" height="210" rx="4" fill="#f1f6fa" stroke="none" stroke-width="2"/><polygon points="88.35857061038118,325.80692928538264 276.6571613026761,339.69370396979974 261.27909183160216,458.0338797868252 79.63498212482861,449.15691207445377" fill="#dce8e9" stroke="#087f85" stroke-width="3"/><circle cx="88.74926828479977" cy="325.61158044817336" r="7" fill="#087f85" stroke="white" stroke-width="3"/><text x="100.74926828479977" y="315.61158044817336" font-size="23" fill="#087f85" font-weight="800" text-anchor="start">1</text><circle cx="276.3641380468622" cy="340.182076062823" r="7" fill="#087f85" stroke="white" stroke-width="3"/><text x="288.3641380468622" y="330.182076062823" font-size="23" fill="#087f85" font-weight="800" text-anchor="start">2</text><circle cx="261.47444066881144" cy="458.42457746124376" r="7" fill="#087f85" stroke="white" stroke-width="3"/><text x="273.47444066881144" y="448.42457746124376" font-size="23" fill="#087f85" font-weight="800" text-anchor="start">3</text><circle cx="79.14661003180535" cy="448.86388881863985" r="7" fill="#087f85" stroke="white" stroke-width="3"/><text x="91.14661003180535" y="438.86388881863985" font-size="23" fill="#087f85" font-weight="800" text-anchor="start">4</text><circle cx="184.61690423678192" cy="332.49354768506157" r="7" fill="#087f85" stroke="white" stroke-width="3"/><text x="196.61690423678192" y="322.49354768506157" font-size="23" fill="#087f85" font-weight="800" text-anchor="start">5</text><circle cx="171.9474531365854" cy="453.8731282894536" r="7" fill="#087f85" stroke="white" stroke-width="3"/><text x="183.9474531365854" y="443.8731282894536" font-size="23" fill="#087f85" font-weight="800" text-anchor="start">6</text><text x="40" y="540" font-size="26" fill="#173650" font-weight="700" text-anchor="start">① 有ID的2D觀測</text><rect x="427" y="324" width="210" height="140" rx="3" fill="#e5f4f0" stroke="#087f85" stroke-width="2"/><text x="393" y="289" font-size="26" fill="#173650" font-weight="700" text-anchor="start">G-01：120×80mm</text><circle cx="427" cy="324" r="6" fill="#087f85" stroke="white" stroke-width="2"/><text x="434" y="314" font-size="23" fill="#087f85" font-weight="700" text-anchor="start">1</text><circle cx="637" cy="324" r="6" fill="#087f85" stroke="white" stroke-width="2"/><text x="644" y="314" font-size="23" fill="#087f85" font-weight="700" text-anchor="start">2</text><circle cx="637" cy="464" r="6" fill="#087f85" stroke="white" stroke-width="2"/><text x="644" y="454" font-size="23" fill="#087f85" font-weight="700" text-anchor="start">3</text><circle cx="427" cy="464" r="6" fill="#087f85" stroke="white" stroke-width="2"/><text x="434" y="454" font-size="23" fill="#087f85" font-weight="700" text-anchor="start">4</text><circle cx="532.0" cy="324" r="6" fill="#087f85" stroke="white" stroke-width="2"/><text x="539.0" y="314" font-size="23" fill="#087f85" font-weight="700" text-anchor="start">5</text><circle cx="532.0" cy="464" r="6" fill="#087f85" stroke="white" stroke-width="2"/><text x="539.0" y="454" font-size="23" fill="#087f85" font-weight="700" text-anchor="start">6</text><text x="395" y="507" font-size="24" fill="#173650" font-weight="500" text-anchor="start">同ID；再加相機參數</text><text x="400" y="540" font-size="25" fill="#173650" font-weight="700" text-anchor="start">② 補上幾何與相機</text><path d="M175,552 L175,588" fill="none" stroke="#0754b8" stroke-width="4"/><path d="M530,552 L530,588" fill="none" stroke="#0754b8" stroke-width="4"/><path d="M175,588 L530,588" fill="none" stroke="#0754b8" stroke-width="4"/><path d="M350,588 L350,627" fill="none" stroke="#0754b8" stroke-width="4" marker-end="url(#arrow)"/><rect x="199" y="636" width="300" height="65" rx="12" fill="#f1f6fb" stroke="#0754b8" stroke-width="2"/><text x="350" y="678" font-size="25" fill="#173650" font-weight="700" text-anchor="middle">③ PnP → 旋轉R、位移t</text><text x="35" y="761" font-size="28" fill="#173650" font-weight="700" text-anchor="start">此例回投影RMSE 0.31px</text><text x="35" y="807" font-size="24" fill="#087f85" font-weight="500" text-anchor="start">投回影像再查；2D很準也不能省掉點ID與校正。</text></svg>