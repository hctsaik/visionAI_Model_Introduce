<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Pose candidate review and HOLD boundary</title><desc id="desc">The Pose pipeline provides an evidence-backed R,t candidate to an external review owner. Calibration, identity, coverage, conditioning, residual-tail or repeatability gaps require HOLD or requalification; Pose is not an automatic PASS or action owner.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7352DA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7352DA"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9485F"/></marker><marker id="arrow-F2B641" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F2B641"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#0B2858"/><rect x="40" y="31" width="178" height="42" rx="21" fill="#F2EEFF" stroke="#7352DA" stroke-width="2"/><text x="129" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">STEP 6 / 6</text><rect x="1277" y="31" width="355" height="42" rx="21" fill="#FFFFFF" stroke="#A7C9FA" stroke-width="2"/><text x="1454" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="middle">Pose：calibrated geometry path</text><text x="40" y="121.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#081A38" text-anchor="start">Pose 交付 candidate 與 evidence；review 或 HOLD 才是安全的下一步</text><text x="40" y="164.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="650" fill="#52698D" text-anchor="start">不要把 PnP 的 R,t、任何 keypoint score，或任一 matcher 的 confidence 直接轉成 robot / production action。</text><g data-entity="pose_image_observations"><rect x="58" y="269" width="274" height="274" rx="24" fill="#FFFFFF" stroke="#1769E0" stroke-width="3"/><text x="195.0" y="304.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0B2858" text-anchor="middle">raw AOI → observed uᵢ</text><rect x="92" y="330" width="206" height="163" rx="16" fill="#F7FBFF" stroke="#C3DAFF" stroke-width="1.5"/><path d="M133.2 330 L133.2 493" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><path d="M174.4 330 L174.4 493" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><path d="M215.6 330 L215.6 493" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><path d="M256.8 330 L256.8 493" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><path d="M92 384.3333333333333 L298 384.3333333333333" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><path d="M92 438.6666666666667 L298 438.6666666666667" fill="none" stroke="#D6E6FF" stroke-width="1.5" stroke-linecap="round"/><circle cx="137.32" cy="382.16" r="10" fill="#FFFFFF" stroke="#F38B00" stroke-width="4"/><circle cx="137.32" cy="382.16" r="3.5" fill="#F38B00"/><text x="154.32" y="371.16" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="start">u1</text><circle cx="248.56" cy="375.64" r="10" fill="#FFFFFF" stroke="#00A8C6" stroke-width="4"/><circle cx="248.56" cy="375.64" r="3.5" fill="#00A8C6"/><text x="265.56" y="364.64" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#00A8C6" text-anchor="start">u2</text><circle cx="153.8" cy="447.36" r="10" fill="#FFFFFF" stroke="#149A62" stroke-width="4"/><circle cx="153.8" cy="447.36" r="3.5" fill="#149A62"/><text x="170.8" y="436.36" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#149A62" text-anchor="start">u3</text><circle cx="254.74" cy="440.84000000000003" r="10" fill="#FFFFFF" stroke="#7352DA" stroke-width="4"/><circle cx="254.74" cy="440.84000000000003" r="3.5" fill="#7352DA"/><text x="271.74" y="429.84000000000003" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="start">u4</text></g><path d="M352 405 L410 405" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><g data-entity="pose_pnp_geometric_solver"><rect x="433" y="256" width="305" height="309" rx="28" fill="#F2EEFF" stroke="#7352DA" stroke-width="3"/><text x="585.5" y="298.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#081A38" text-anchor="middle">PnP / RANSAC</text><text x="585.5" y="329.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#7352DA" text-anchor="middle">geometric solver</text><rect x="461" y="359" width="249" height="52" rx="14" fill="#FFFFFF" stroke="#7352DA" stroke-width="2"/><text x="585.5" y="391.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#0B2858" text-anchor="middle">input: K + (Pᵢ ↔ uᵢ)</text><path d="M585.5 422 L585.5 464" fill="none" stroke="#7352DA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-7352DA)"/><rect x="461" y="477" width="249" height="70" rx="14" fill="#E9F8F0" stroke="#149A62" stroke-width="2"/><text x="585.5" y="507.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#149A62" text-anchor="middle">pose candidate</text><text x="585.5" y="533.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#0B2858" text-anchor="middle">R, t  +  inlier set</text><text x="585.5" y="547.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9485F" text-anchor="middle">not a detector / matcher</text></g><path d="M758 405 L815 405" fill="none" stroke="#7352DA" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-7352DA)"/><rect x="838" y="246" width="550" height="364" rx="28" fill="#FFFFFF" stroke="#A7C9FA" stroke-width="3"/><text x="1113" y="288.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="26" font-weight="900" fill="#081A38" text-anchor="middle">review the evidence bundle</text><rect x="866" y="322" width="484" height="69" rx="17" fill="#EAF8F0" stroke="#149A62" stroke-width="2"/><circle cx="898" cy="356" r="18" fill="#149A62"/><text x="898" y="362.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">✓</text><text x="929" y="350.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#149A62" text-anchor="start">camera / fixture revision</text><text x="929" y="374.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#081A38" text-anchor="start">K, distortion, unit and frame match</text><rect x="866" y="403" width="484" height="69" rx="17" fill="#EAF8F0" stroke="#149A62" stroke-width="2"/><circle cx="898" cy="437" r="18" fill="#149A62"/><text x="898" y="443.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">✓</text><text x="929" y="431.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#149A62" text-anchor="start">correspondence identity</text><text x="929" y="455.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#081A38" text-anchor="start">Pᵢ↔uᵢ order / visibility are coherent</text><rect x="866" y="484" width="484" height="69" rx="17" fill="#EAF8F0" stroke="#149A62" stroke-width="2"/><circle cx="898" cy="518" r="18" fill="#149A62"/><text x="898" y="524.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">✓</text><text x="929" y="512.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#149A62" text-anchor="start">coverage + conditioning + tail</text><text x="929" y="536.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#081A38" text-anchor="start">qualified range / P95 / repeatability exist</text><path d="M1412 368 L1467 320" fill="none" stroke="#149A62" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-149A62)"/><path d="M1412 502 L1467 552" fill="none" stroke="#D9485F" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-D9485F)"/><rect x="1484" y="256" width="126" height="122" rx="22" fill="#EAF8F0" stroke="#149A62" stroke-width="3"/><text x="1547" y="295.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#149A62" text-anchor="middle">candidate</text><text x="1547" y="324.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#149A62" text-anchor="middle">→ REVIEW</text><text x="1547" y="350.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0B2858" text-anchor="middle">owner decides</text><rect x="1484" y="493" width="126" height="122" rx="22" fill="#FFF0F3" stroke="#D9485F" stroke-width="3"/><text x="1547" y="532.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#D9485F" text-anchor="middle">HOLD</text><text x="1547" y="560.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9485F" text-anchor="middle">save AOI</text><text x="1547" y="586.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0B2858" text-anchor="middle">re-qualify</text><rect x="58" y="659" width="1552" height="142" rx="26" fill="#FFFFFF" stroke="#A7C9FA" stroke-width="2"/><text x="86" y="699.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#0B2858" text-anchor="start">責任邊界</text><text x="86" y="734.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#1769E0" text-anchor="start">Keypoint R-CNN：2D per-instance landmarks</text><path d="M461 728 L520 728" fill="none" stroke="#1769E0" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><text x="545" y="734.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#7352DA" text-anchor="start">SIFT / LightGlue：image↔image correspondence candidates</text><path d="M1044 728 L1103 728" fill="none" stroke="#7352DA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-7352DA)"/><text x="1128" y="734.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#149A62" text-anchor="start">Pose：calibrated 2D↔3D + PnP + reprojection evidence</text><text x="86" y="773.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9485F" text-anchor="start">任何前段可以是輸入的一部分；只有固定 K、3D reference、solver、coverage/conditioning 與 review policy 才構成這條 pose contract。</text><rect x="40" y="851" width="1592" height="50" rx="18" fill="#FFF6D9" stroke="#E5AB22" stroke-width="2"/><circle cx="79" cy="876" r="12" fill="#FFE29A" stroke="#C98700" stroke-width="2"/><text x="79" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#765000" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#674700" text-anchor="start">Pose candidate 不是自動 PASS；robot / production action 由外部 decision owner 依完整 evidence 另行決定。</text></svg>