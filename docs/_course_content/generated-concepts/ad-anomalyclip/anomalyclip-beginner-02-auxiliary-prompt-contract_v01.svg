<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">AnomalyCLIP auxiliary prompt learning and target exclusion contract</title><desc id="desc">Auxiliary data with source IDs, licenses, taxonomy and split learns prompt tokens. Target data must stay excluded; tokenizer, text adaptation and prompt state form a versioned transfer contract.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7352DA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7352DA"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9475F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9475F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#08275A"/><rect x="40" y="30" width="188" height="44" rx="22" fill="#F2EEFF" stroke="#7352DA" stroke-width="2"/><text x="134" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">STEP 2 / 5</text><rect x="1271" y="30" width="361" height="44" rx="22" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="2"/><text x="1452" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#7352DA" text-anchor="middle">AnomalyCLIP · learned prompts</text><text x="40" y="123.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="37" font-weight="900" fill="#0A1A37" text-anchor="start">zero-shot 的資料邊界：auxiliary prompt learning 必須證明 target exclusion</text><text x="40" y="166.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="650" fill="#52698D" text-anchor="start">目標產品不進 prompt training，不代表沒有 learned prompt state；source IDs、split、license、taxonomy 與 adaptation 都要可稽核</text><rect x="54" y="264" width="415" height="326" rx="26" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="3"/><text x="262" y="310.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#0A1A37" text-anchor="middle">auxiliary prompt-learning audit</text><circle cx="104" cy="358" r="10" fill="#149A62"/><text x="130" y="365.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#0A1A37" text-anchor="start">source IDs + license</text><circle cx="104" cy="408" r="10" fill="#1769E0"/><text x="130" y="415.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#0A1A37" text-anchor="start">taxonomy + split</text><circle cx="104" cy="458" r="10" fill="#7352DA"/><text x="130" y="465.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#0A1A37" text-anchor="start">target exclusion proof</text><rect x="85" y="504" width="353" height="50" rx="14" fill="#FFF0F3" stroke="#D9475F" stroke-width="2"/><text x="262" y="536.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#D9475F" text-anchor="middle">no target train sample allowed</text><path d="M493 421 L557 421" fill="none" stroke="#7352DA" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-7352DA)"/><rect x="581" y="272" width="245" height="298" rx="25" fill="#F2EEFF" stroke="#7352DA" stroke-width="3"/><text x="704" y="314.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#0A1A37" text-anchor="middle">learn prompt tokens</text><text x="704" y="341.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#7352DA" text-anchor="middle">auxiliary training only</text><rect x="628" y="387" width="29" height="23" rx="5" fill="#E4DAFF" stroke="#7352DA" stroke-width="1.1"/><rect x="670" y="387" width="29" height="23" rx="5" fill="#E4DAFF" stroke="#7352DA" stroke-width="1.1"/><rect x="712" y="387" width="29" height="23" rx="5" fill="#E4DAFF" stroke="#7352DA" stroke-width="1.1"/><rect x="754" y="387" width="29" height="23" rx="5" fill="#E4DAFF" stroke="#7352DA" stroke-width="1.1"/><rect x="628" y="421" width="29" height="23" rx="5" fill="#E4DAFF" stroke="#7352DA" stroke-width="1.1"/><rect x="670" y="421" width="29" height="23" rx="5" fill="#E4DAFF" stroke="#7352DA" stroke-width="1.1"/><rect x="712" y="421" width="29" height="23" rx="5" fill="#E4DAFF" stroke="#7352DA" stroke-width="1.1"/><rect x="754" y="421" width="29" height="23" rx="5" fill="#E4DAFF" stroke="#7352DA" stroke-width="1.1"/><rect x="628" y="455" width="29" height="23" rx="5" fill="#E4DAFF" stroke="#7352DA" stroke-width="1.1"/><rect x="670" y="455" width="29" height="23" rx="5" fill="#E4DAFF" stroke="#7352DA" stroke-width="1.1"/><rect x="712" y="455" width="29" height="23" rx="5" fill="#E4DAFF" stroke="#7352DA" stroke-width="1.1"/><rect x="754" y="455" width="29" height="23" rx="5" fill="#E4DAFF" stroke="#7352DA" stroke-width="1.1"/><text x="704" y="526.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">loss + seed + checkpoint</text><path d="M850 421 L914 421" fill="none" stroke="#7352DA" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-7352DA)"/><rect x="938" y="272" width="297" height="298" rx="25" fill="#FFFFFF" stroke="#1769E0" stroke-width="3"/><text x="1087" y="314.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#0A1A37" text-anchor="middle">CLIP text side</text><text x="1087" y="341.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">tokenizer + text adaptation</text><rect x="974" y="390" width="226" height="52" rx="14" fill="#FFFFFF" stroke="#149A62" stroke-width="2"/><text x="1000" y="423.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#0A1A37" text-anchor="start">normal text embedding</text><rect x="974" y="461" width="226" height="52" rx="14" fill="#FFFFFF" stroke="#D9475F" stroke-width="2"/><text x="1000" y="494.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#0A1A37" text-anchor="start">anomaly text embedding</text><path d="M1258 421 L1322 421" fill="none" stroke="#149A62" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-149A62)"/><rect x="1346" y="293" width="244" height="254" rx="24" fill="#EAF8F0" stroke="#149A62" stroke-width="3"/><text x="1468" y="333.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#0A1A37" text-anchor="middle">transfer-ready</text><text x="1468" y="363.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#149A62" text-anchor="middle">prompt state</text><g data-entity="anomalyclip_ceramic_contact_plate_aoi"><clipPath id="photo-audit-1383-390"><rect x="1383" y="390" width="170" height="105" rx="23"/></clipPath><g clip-path="url(#photo-audit-1383-390)"><image href="anomalyclip-industrial-ceramic-contacts-anchor_v02.png" x="1383" y="390" width="170" height="105" preserveAspectRatio="xMidYMid slice"/></g><rect x="1383" y="390" width="170" height="105" rx="23" fill="none" stroke="#1769E0" stroke-width="3"/><text x="1468.0" y="524.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="middle">target eval only</text></g><rect x="54" y="668" width="1536" height="135" rx="23" fill="#FFF0F3" stroke="#D9475F" stroke-width="2"/><text x="86" y="708.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#D9475F" text-anchor="start">Audit boundary before transfer</text><text x="86" y="741.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#0A1A37" text-anchor="start">Target exclusion, prompt initialization/context, tokenizer, text-encoder scope, feature adaptation, losses, checkpoint selection and source licenses are deployment state.</text><text x="86" y="775.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D9475F" text-anchor="start">If a target sample, product semantic, or unapproved source crossed the split boundary, HOLD—not a valid zero-shot claim.</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF5D4" stroke="#E5AB22" stroke-width="2"/><circle cx="79" cy="875" r="12" fill="#FFE29A" stroke="#C98700" stroke-width="2"/><text x="79" y="882.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#805300" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#674700" text-anchor="start">Zero-shot means no target-dataset training sample at evaluation. It does not erase auxiliary-data learning, prompt-token weights, text adaptation or transfer risk。</text></svg>