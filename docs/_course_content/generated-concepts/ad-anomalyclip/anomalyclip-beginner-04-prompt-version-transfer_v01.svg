<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">AnomalyCLIP prompt revision and local transfer calibration</title><desc id="desc">Changes to learned prompt tokens, template, context, tokenizer, adaptation, checkpoint or feature layer change the margin contract. Local target holdout and prompt variance evidence are required before a candidate rule transfers.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7352DA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7352DA"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9475F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9475F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#08275A"/><rect x="40" y="30" width="188" height="44" rx="22" fill="#F2EEFF" stroke="#7352DA" stroke-width="2"/><text x="134" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">STEP 4 / 5</text><rect x="1271" y="30" width="361" height="44" rx="22" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="2"/><text x="1452" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#7352DA" text-anchor="middle">AnomalyCLIP · learned prompts</text><text x="40" y="123.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="37" font-weight="900" fill="#0A1A37" text-anchor="start">prompt revision 是模型 revision：同一 ROI 的 margin 也會變</text><text x="40" y="166.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="650" fill="#52698D" text-anchor="start">先鎖 prompt/text/feature state，再看 map；任何 revision 都要有 local calibration、target holdout 與 prompt-variance evidence</text><g data-entity="anomalyclip_ceramic_contact_plate_aoi"><clipPath id="photo-revision-54-275"><rect x="54" y="275" width="240" height="282" rx="23"/></clipPath><g clip-path="url(#photo-revision-54-275)"><image href="anomalyclip-industrial-ceramic-contacts-anchor_v02.png" x="54" y="275" width="240" height="282" preserveAspectRatio="xMidYMid slice"/></g><rect x="54" y="275" width="240" height="282" rx="23" fill="none" stroke="#1769E0" stroke-width="3"/><rect x="222.0" y="441.38" width="33.6" height="39.480000000000004" rx="7" fill="none" stroke="#F38B00" stroke-width="4"/><text x="238.8" y="430.38" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">review cue</text><text x="174.0" y="586.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="middle">same raw ROI</text></g><path d="M316 415 L375 415" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><g data-entity="anomalyclip_global_and_patch_features"><rect x="398" y="282" width="238" height="248" rx="21" fill="#EAF4FF" stroke="#00A8C6" stroke-width="3"/><text x="517.0" y="314.0" font-family="Segoe UI, Mi