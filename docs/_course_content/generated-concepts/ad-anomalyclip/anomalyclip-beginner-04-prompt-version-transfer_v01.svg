00" stroke-width="1.2"/><rect x="1284.8" y="454.5" width="33.4" height="26.25" rx="5" fill="#F38B00" fill-opacity="0.7" stroke="#F38B00" stroke-width="1.2"/><text x="1230.5" y="514.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">not defect probability</text></g><path d="M1367 399 L1427 399" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><rect x="1450" y="284" width="150" height="244" rx="22" fill="#EAF4FF" stroke="#1769E0" stroke-width="3"/><text x="1525" y="325.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0A1A37" text-anchor="middle">local</text><text x="1525" y="351.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#1769E0" text-anchor="middle">calibration</text><text x="1525" y="399.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#149A62" text-anchor="middle">holdout</text><text x="1525" y="432.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#7352DA" text-anchor="middle">variance</text><text x="1525" y="465.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#F38B00" text-anchor="middle">threshold</text><rect x="54" y="670" width="1546" height="133" rx="23" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="2"/><text x="84" y="710.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#0A1A37" text-anchor="start">Transfer evidence must answer three questions</text><circle cx="105" cy="739" r="8" fill="#149A62"/><text x="126" y="746.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#149A62" text-anchor="start">auxiliary → target transfer</text><text x="440" y="746.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#0A1A37" text-anchor="start">does language / visual domain transfer?</text><circle cx="105" cy="767" r="8" fill="#7352DA"/><text x="126" y="774.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#7352DA" text-anchor="start">prompt variance</text><text x="440" y="774.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#0A1A37" text-anchor="start">does a revision move low-FPR tails?</text><circle cx="105" cy="793" r="8" fill="#F38B00"/><text x="126" y="800.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#F38B00" text-anchor="start">patch effective pixels</text><text x="440" y="800.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#0A1A37" text-anchor="start">can this layer see the critical signal?</text><rect x="1074" y="705" width="482" height="72" rx="17" fill="#FFF0F3" stroke="#D9475F" stroke-width="2"/><text x="1315" y="736.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#D9475F" text-anchor="middle">no evidence → abstain / HOLD</text><text x="1315" y="761.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D9475F" text-anchor="middle">not ‘best-looking prompt wins’</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF5D4" stroke="#E5AB22" stroke-width="2"/><circle cx="79" cy="875" r="12" fill="#FFE29A" stroke="#C98700" stroke-width="2"/><text x="79" y="882.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#805300" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#674700" text-anchor="start">A prompt revision is not copy editing. It changes the vision-language comparison state and may require a new calibration, regression, latency and hand-off qualification。</text></svg>