  <rect x="40" y="32" width="150" height="32" rx="16" fill="#E6F0FF"/><text x="58" y="54.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="16" font-weight="800" fill="#1769E0">反事實與安全邊界</text><text x="40" y="116" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="43" font-weight="900" fill="#071A3B">同一條因果鏈，會在哪裡被破壞？</text><text x="40" y="182" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="500" fill="#50698F">不是多背三個風險名詞；要能預測畫面可能怎麼變，並選擇安全的下一步。</text><text x="1630" y="57.0" text-anchor="end" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#5C7395">AnomalyCLIP</text><rect x="77" y="260" width="478" height="516" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><circle cx="121" cy="306" r="25" fill="#D84A4A"/><text x="121" y="314.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">1</text><text x="159" y="313" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">auxiliary data 對 target 有</text><text x="159" y="342" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">leakage、license 或 taxonomy 不清</text><g data-visual-cue="support_coverage_anomalyclip_target_leakage" data-renderer-art="support_coverage" data-primitive="geometry_qualification" data-semantic-scene="geometry_qualification" data-semantic-entities="geometry|residual|coverage|qualification_gate" data-specialist-coverage="geometry|residual|coverage|qualification_gate" data-semantic-relation="qualify geometry with residual and coverage" data-must-show="auxiliary training set | target product 名稱或影像被遮蔽的禁止符號 | leakage 紅線 | zero-shot 標籤被打叉" data-not-claim="使用已看過目標語義仍可稱為可靠 zero-shot transfer。"><title>資料洩漏</title><rect x="105" y="390" width="422" height="98" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="185.59" y1="440.26" x2="246.07000000000002" y2="440.26" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="287.65000000000003" y1="440.26" x2="348.13" y2="440.26" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="389.71000000000004" y1="440.26" x2="446.40999999999997" y2="440.26" stroke="#F38B00" stroke-width="4" marker-end="url(#arrow-orange)"/><path d="M467.2 409.09999999999997L472.94 414.84L467.2 420.58L461.46 414.84z" fill="#FFF4CC" stroke="#C88400" stroke-width="2"/><g data-entity="geometry" data-entity-label-full="幾何"><line x1="164.8" y1="430.48413793103447" x2="157.63103448275862" y2="438.63068965517243" stroke="#1769E0" stroke-width="3"/><line x1="164.8" y1="430.48413793103447" x2="171.9689655172414" y2="438.63068965517243" stroke="#1769E0" stroke-width="3"/><line x1="157.63103448275862" y1="438.63068965517243" x2="155.0241379310345" y2="449.3841379310345" stroke="#1769E0" stroke-width="3"/><line x1="171.9689655172414" y1="438.63068965517243" x2="174.57586206896553" y2="449.3841379310345" stroke="#1769E0" stroke-width="3"/><circle cx="164.8" cy="430.48413793103447" r="4" fill="#1769E0"/><circle cx="157.63103448275862" cy="438.63068965517243" r="4" fill="#1769E0"/><circle cx="171.9689655172414" cy="438.63068965517243" r="4" fill="#1769E0"/><circle cx="155.0241379310345" cy="449.3841379310345" r="4" fill="#1769E0"/><circle cx="174.57586206896553" cy="449.3841379310345" r="4" fill="#1769E0"/><text data-label-line="true" x="164.8" y="460.7893103448276" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">幾何</text></g><g data-entity="residual" data-entity-label-full="residual"><line x1="255.4548275862069" y1="449.3841379310345" x2="278.2651724137931" y2="431.1358620689655" stroke="#0AA6D8" stroke-width="4"/><circle cx="273.37724137931036" cy="435.37206896551726" r="3.2586206896551726" fill="#F38B00"/><line x1="261.9720689655173" y1="444.1703448275862" x2="273.37724137931036" y2="435.37206896551726" stroke="#F38B00" stroke-width="4" stroke-dasharray="5 3"/><text data-label-line="true" x="266.86" y="460.7893103448276" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">residual</text></g><g data-entity="coverage" data-entity-label-full="coverage"><path d="M368.92 429.1806896551724L378.69586206896554 435.0462068965517L378.69586206896554 445.47379310344826L368.92 451.3393103448276L359.1441379310345 445.47379310344826L359.1441379310345 435.0462068965517z" fill="#EAF3FF" stroke="#F38B00" stroke-width="3"/><text data-label-line="true" x="368.92" y="460.7893103448276" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">coverage</text></g><g data-entity="qualification_gate" data-entity-label-full="gate"><path d="M467.2 428.5289655172414L478.2793103448276 440.26L467.2 451.9910344827586L456.1206896551724 440.26z" fill="#FFF4CC" stroke="#D84A4A" stroke-width="3"/><circle cx="467.2" cy="440.26" r="2.932758620689655" fill="#D84A4A"/><text data-label-line="true" x="467.2" y="460.7893103448276" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#D84A4A">gate</text></g><g data-relation="qualify geometry with residual and coverage"><rect x="138.34" y="472.24" width="192" height="10.66" rx="4.92" fill="#EAF3FF" stroke="#9FC4FF" stroke-width="2"/><text data-label-line="true" x="234.34" y="473.78999999999996" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">geometry</text><text data-label-line="true" x="234.34" y="489.12999999999994" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">qualifi</text></g></g><text x="105" y="520.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#F38B00">可能看到</text><text x="105" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">所謂zero-shot transfer可能已見過目</text><text x="105" y="570" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">標語義，結論與部署資料治理都失效。</text><line x1="105" y1="646" x2="527" y2="646" stroke="#D6E7FF" stroke-width="2"/><text x="105" y="675.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#1769E0">正確下一步</text><text x="105" y="703" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">HOLD；保存source</text><text x="105" y="725" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">IDs/splits/licenses與target</text><text x="105" y="747" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">exclusion audit，必要時改用可追溯</text><text x="105" y="769" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">方法。</text><rect x="597" y="260" width="478" height="516" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><circle cx="641" cy="306" r="25" fill="#F38B00"/><text x="641" y="314.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">2</text><text x="679" y="313" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">prompt/tokenizer/template/CLIP</text><text x="679" y="342" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">revision 改變，或 prompt transfer</text><text x="679" y="371" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">不穩</text><g data-visual-cue="prompt_text_anomalyclip_prompt_drift" data-renderer-art="image_text_or_diffusion" data-primitive="text_prompt_embedding" data-semantic-scene="text_prompt_embedding" data-semantic-entities="prompt_text|text_encoder|text_vector" data-specialist-coverage="prompt_text|text_encoder|text_vector" data-semantic-relation="make a declared text representation" data-must-show="prompt、tokenizer、template、checkpoint 四張版本卡 | 同一 patch 的相反 margin | 舊新 revision 箭頭 | 重新校正圖示" data-not-claim="prompt state 改動只影響文字而不影響熱圖。"><title>提示漂移</title><rect x="625" y="390" width="422" height="98" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="single-text-prompt-embedding"><path d="M662.12 428.78h75.60000000000001v16.400000000000002h-75.60000000000001z" fill="#E8FAFF" stroke="#1769E0" stroke-width="3"/><line x1="745.28" y1="437.8" x2="801.98" y2="437.8" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="805.76" y="425.5" width="52.92" height="24.599999999999998" rx="6" fill="#F7FBFF" stroke="#0AA6D8" stroke-width="3"/><line x1="866.24" y1="437.8" x2="930.5000000000001" y2="437.8" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="930.5000000000001" y1="428.78" x2="975.86" y2="428.78" stroke="#F38B00" stroke-width="4"/><line x1="930.5000000000001" y1="436.98" x2="975.86" y2="436.98" stroke="#F38B00" stroke-width="4"/><line x1="930.5000000000001" y1="445.18" x2="975.86" y2="445.18" stroke="#F38B00" stroke-width="4"/><text data-label-line="true" x="699.92" y="477.98" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">prompt</text><text data-label-line="true" x="832.22" y="477.98" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">text encoder</text><text data-label-line="true" x="953.1800000000001" y="477.98" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">vector</text></g></g><text x="625" y="520.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#F38B00">可能看到</text><text x="625" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">normal/anomaly margin 可能反轉，同</text><text x="625" y="570" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">一熱圖無法與舊 threshold 比較。</text><line x1="625" y1="646" x2="1047" y2="646" stroke="#D6E7FF" stroke-width="2"/><text x="625" y="675.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#1769E0">正確下一步</text><text x="625" y="703" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">重新校正，執行prompt variance、</text><text x="625" y="725" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">target holdout、unseen product與低</text><text x="625" y="747" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">FPR regression。</text><rect x="1117" y="260" width="478" height="516" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><circle cx="1161" cy="306" r="25" fill="#1769E0"/><text x="1161" y="314.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">3</text><text x="1199" y="313" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">patch有效尺度不足、image/text</text><text x="1199" y="342" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">domain gap 或 global logic</text><g data-visual-cue="drift_hold_anomalyclip_resolution_logic_gap" data-renderer-art="drift_hold" data-primitive="declared_drift_hold_anomalyclip_resolution_logic_gap" data-semantic-scene="declared_drift_hold_anomalyclip_resolution_logic_gap" data-semantic-entities="declared_input|declared_operation|candidate_or_gate" data-specialist-coverage="declared_input|declared_operation|candidate_or_gate" data-semantic-relation="show the authored operation before action" data-must-show="小於 patch 尺度的 tiny defect | 插值後變淡的 map | 缺件/關係錯誤圖示 | HOLD 指向 specialist method" data-not-claim="prompt margin 具備原生像素解析度或關係推理能力。"><title>小缺陷與邏輯題</title><rect x="1145" y="390" width="422" height="98" rx="16" fill="#F7FBFF" stroke="#