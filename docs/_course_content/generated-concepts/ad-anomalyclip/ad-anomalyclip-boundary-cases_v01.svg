"10.66" rx="4.92" fill="#EAF3FF" stroke="#9FC4FF" stroke-width="2"/><text data-label-line="true" x="1274.34" y="473.78999999999996" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">declared</text><text data-label-line="true" x="1274.34" y="489.12999999999994" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">drift h</text></g></g><text x="1145" y="520.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#F38B00">可能看到</text><text x="1145" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">tiny defect可能被插值掩蓋；產品命</text><text x="1145" y="570" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">名、材料、照明或缺件關係未必被</text><text x="1145" y="592" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">prompt margin表達。</text><line x1="1145" y1="646" x2="1567" y2="646" stroke="#D6E7FF" stroke-width="2"/><text x="1145" y="675.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#1769E0">正確下一步</text><text x="1145" y="703" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">驗effective pixels與domain</text><text x="1145" y="725" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">coverage；對低FPR/結構問題使用</text><text x="1145" y="747" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">specialist evidence或HOLD。</text><rect x="77" y="816" width="1518" height="63" rx="20" fill="#FFF4CC" stroke="#F1B828"/><text x="836" y="855.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="800" fill="#674500">任一條件超出 qualification envelope：先停在 HOLD／REVIEW，保存 raw evidence 與版本，再決定怎麼重驗。</text>
