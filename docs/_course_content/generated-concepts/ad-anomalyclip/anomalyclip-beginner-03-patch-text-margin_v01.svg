 fill="#B9D7F8" stroke="#00A8C6" stroke-width="1.2"/><rect x="766.0" y="452.0" width="24.0" height="31.0" rx="5" fill="#B9D7F8" stroke="#00A8C6" stroke-width="1.2"/><rect x="797.0" y="452.0" width="24.0" height="31.0" rx="5" fill="#DCEBFC" stroke="#00A8C6" stroke-width="1.2"/><rect x="828.0" y="452.0" width="24.0" height="31.0" rx="5" fill="#B9D7F8" stroke="#00A8C6" stroke-width="1.2"/><rect x="859.0" y="452.0" width="24.0" height="31.0" rx="5" fill="#DCEBFC" stroke="#00A8C6" stroke-width="1.2"/><rect x="890.0" y="452.0" width="24.0" height="31.0" rx="5" fill="#B9D7F8" stroke="#00A8C6" stroke-width="1.2"/><rect x="921.0" y="452.0" width="24.0" height="31.0" rx="5" fill="#DCEBFC" stroke="#00A8C6" stroke-width="1.2"/><text x="859.0" y="520.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#00A8C6" text-anchor="middle">selected intermediate layer</text></g><rect x="1010" y="248" width="245" height="320" rx="24" fill="#EAF8F0" stroke="#149A62" stroke-width="3"/><text x="1132" y="290.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0A1A37" text-anchor="middle">normal text embedding n</text><rect x="1050" y="334" width="25" height="23" rx="5" fill="#D8F4E5" stroke="#149A62" stroke-width="1.1"/><rect x="1083" y="334" width="25" height="23" rx="5" fill="#D8F4E5" stroke="#149A62" stroke-width="1.1"/><rect x="1116" y="334" width="25" height="23" rx="5" fill="#D8F4E5" stroke="#149A62" stroke-width="1.1"/><rect x="1149" y="334" width="25" height="23" rx="5" fill="#D8F4E5" stroke="#149A62" stroke-width="1.1"/><rect x="1182" y="334" width="25" height="23" rx="5" fill="#D8F4E5" stroke="#149A62" stroke-width="1.1"/><text x="1132" y="392.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#149A62" text-anchor="middle">sim(p7, n)</text><rect x="1010" y="414" width="245" height="120" rx="18" fill="#FFF0F3" stroke="#D9475F" stroke-width="2"/><text x="1132" y="450.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0A1A37" text-anchor="middle">anomaly text embedding a</text><rect x="1050" y="474" width="25" height="23" rx="5" fill="#F7D9DF" stroke="#D9475F" stroke-width="1.1"/><rect x="1083" y="474" width="25" height="23" rx="5" fill="#F7D9DF" stroke="#D9475F" stroke-width="1.1"/><rect x="1116" y="474" width="25" height="23" rx="5" fill="#F7D9DF" stroke="#D9475F" stroke-width="1.1"/><rect x="1149" y="474" width="25" height="23" rx="5" fill="#F7D9DF" stroke="#D9475F" stroke-width="1.1"/><rect x="1182" y="474" width="25" height="23" rx="5" fill="#F7D9DF" stroke="#D9475F" stroke-width="1.1"/><text x="1132" y="520.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#D9475F" text-anchor="middle">sim(p7, a)</text><path d="M1280 361 L1339 394" fill="none" stroke="#149A62" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-149A62)"/><path d="M1280 494 L1339 450" fill="none" stroke="#D9475F" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-D9475F)"/><rect x="1363" y="302" width="239" height="238" rx="24" fill="#FFF4E4" stroke="#F38B00" stroke-width="3"/><text x="1483" y="344.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#0A1A37" text-anchor="middle">normalized margin</text><text x="1483" y="377.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#F38B00" text-anchor="middle">sim(a) − sim(n)</text><rect x="1393" y="414" width="180" height="55" rx="13" fill="#FFFFFF" stroke="#F38B00" stroke-width="2"/><text x="1483" y="448.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#0A1A37" text-anchor="middle">patch candidate</text><text x="1483" y="512.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">not text answer</text><rect x="58" y="678" width="1544" height="125" rx="23" fill="#FFF0F3" stroke="#D9475F" stroke-width="2"/><text x="88" y="718.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#D9475F" text-anchor="start">Prompt state can move the same patch</text><text x="88" y="751.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#0A1A37" text-anchor="start">Change tokens, template, context, tokenizer, CLIP revision, text adaptation or selected patch layer → margin distribution changes → recalibrate.</text><text x="88" y="781.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D9475F" text-anchor="start">Use real target holdout and prompt-variance tests; do not choose the wording that merely makes a small sample heatmap look strongest.</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF5D4" stroke="#E5AB22" stroke-width="2"/><circle cx="79" cy="875" r="12" fill="#FFE29A" stroke="#C98700" stroke-width="2"/><text x="79" y="882.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#805300" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#674700" text-anchor="start">Patch-to-text margin is local evidence—not defect type or global assembly proof; it may miss signals below the patch receptive field。</text></svg>