<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">AnomalyCLIP patch feature comparison to learned normal and anomaly text embeddings</title><desc id="desc">A selected CLIP patch feature compares with learned normal and anomaly text embeddings. Its normalized similarity margin is a local candidate signal, not a free-form text answer or defect probability.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7352DA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7352DA"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9475F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9475F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#08275A"/><rect x="40" y="30" width="188" height="44" rx="22" fill="#F2EEFF" stroke="#7352DA" stroke-width="2"/><text x="134" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">STEP 3 / 5</text><rect x="1271" y="30" width="361" height="44" rx="22" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="2"/><text x="1452" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#7352DA" text-anchor="middle">AnomalyCLIP · learned prompts</text><text x="40" y="123.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="37" font-weight="900" fill="#0A1A37" text-anchor="start">同一 patch 對兩個 learned text embeddings 比較：margin 才是 local candidate evidence</text><text x="40" y="166.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="650" fill="#52698D" text-anchor="start">固定 CLIP image / text state、ROI、patch layer、normalization 與 similarity；不是讓 CLIP 自由回答產品語意</text><g data-entity="anomalyclip_ceramic_contact_plate_aoi"><clipPath id="photo-margin-58-276"><rect x="58" y="276" width="248" height="292" rx="23"/></clipPath><g clip-path="url(#photo-margin-58-276)"><image href="anomalyclip-industrial-ceramic-contacts-anchor_v02.png" x="58" y="276" width="248" height="292" preserveAspectRatio="xMidYMid slice"/></g><rect x="58" y="276" width="248" height="292" rx="23" fill="none" stroke="#1769E0" stroke-width="3"/><rect x="231.6" y="448.28" width="34.720000000000006" height="40.88" rx="7" fill="none" stroke="#F38B00" stroke-width="4"/><text x="248.96" y="437.28" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">review cue</text><text x="182.0" y="597.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="middle">same test ROI</text></g><path d="M327 420 L383 420" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><g data-entity="anomalyclip_clip_image_encoder"><rect x="406" y="276" width="238" height="292" rx="24" fill="#FFFFFF" stroke="#1769E0" stroke-width="3"/><text x="525.0" y="311.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#0A1A37" text-anchor="middle">CLIP image encoder</text><text x="525.0" y="336.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">frozen / declared adapted</text><rect x="472.22" y="368" width="105.55999999999999" height="29" rx="7" fill="#D7E8FC" stroke="#1769E0" stroke-width="1.4"/><text x="525.0" y="389.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">global</text><rect x="455.84000000000003" y="416" width="138.32" height="29" rx="7" fill="#D7E8FC" stroke="#1769E0" stroke-width="1.4"/><text x="525.0" y="437.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">patch layer 1</text><rect x="439.46000000000004" y="464" width="171.07999999999998" height="29" rx="7" fill="#D7E8FC" stroke="#1769E0" stroke-width="1.4"/><text x="525.0" y="485.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">patch layer 2</text><text x="525.0" y="553.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52698D" text-anchor="middle">preprocess + layers locked</text></g><path d="M665 420 L721 420" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><g data-entity="anomalyclip_global_and_patch_features"><rect x="744" y="282" width="230" height="252" rx="21" fill="#EAF4FF" stroke="#00A8C6" stroke-width="3"/><text x="859.0" y="314.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0A1A37" text-anchor="middle">patch