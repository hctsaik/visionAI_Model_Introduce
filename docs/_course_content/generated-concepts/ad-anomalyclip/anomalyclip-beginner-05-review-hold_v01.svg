<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">AnomalyCLIP candidate review and prompt transfer hold boundary</title><desc id="desc">Patch margins become candidates only after versioned interpolation, aggregation and local calibration. Hold when source audit, prompt transfer, patch effective pixels or local-feature assumptions are not validated.</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7352DA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7352DA"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9475F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9475F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#08275A"/><rect x="40" y="30" width="188" height="44" rx="22" fill="#F2EEFF" stroke="#7352DA" stroke-width="2"/><text x="134" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="middle">STEP 5 / 5</text><rect x="1271" y="30" width="361" height="44" rx="22" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="2"/><text x="1452" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#7352DA" text-anchor="middle">AnomalyCLIP · learned prompts</text><text x="40" y="123.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="37" font-weight="900" fill="#0A1A37" text-anchor="start">margin map → candidate review：資料、prompt 或可觀測性不成立就 HOLD</text><text x="40" y="166.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="650" fill="#52698D" text-anchor="start">interpolation、smoothing、aggregation、calibration、threshold / abstain、decision unit 與 prompt state 共同決定 review 行為</text><g data-entity="anomalyclip_ceramic_contact_plate_aoi"><clipPath id="photo-hold-53-266"><rect x="53" y="266" width="228" height="276" rx="23"/></clipPath><g clip-path="url(#photo-hold-53-266)"><image href="anomalyclip-industrial-ceramic-contacts-anchor_v02.png" x="53" y="266" width="228" height="276" preserveAspectRatio="xMidYMid slice"/></g><rect x="53" y="266" width="228" height="276" rx="23" fill="none" stroke="#1769E0" stroke-width="3"/><rect x="212.6" y="428.84000000000003" width="31.92" height="38.64" rx="7" fill="none" stroke="#F38B00" stroke-width="4"/><text x="228.56" y="417.84000000000003" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="middle">review cue</text><text x="167.0" y="571.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="middle">same raw AOI</text></g><g data-entity="anomalyclip_normal_anomaly_similarity_margin"><rect x="325" y="262" width="250" height="242" rx="22" fill="#FFF4E4" stroke="#F38B00" stroke-width="3"/><text x="450.0" y="295.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#0A1A37" text-anchor="middl