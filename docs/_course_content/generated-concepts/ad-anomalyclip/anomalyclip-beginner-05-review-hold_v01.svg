oke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><g data-entity="anomalyclip_candidate_review"><rect x="1181" y="307" width="255" height="153" rx="21" fill="#FFF4E4" stroke="#F38B00" stroke-width="3"/><circle cx="1308.5" cy="335" r="18" fill="#F38B00"/><text x="1308.5" y="342.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#FFFFFF" text-anchor="middle">?</text><text x="1308.5" y="379.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0A1A37" text-anchor="middle">candidate</text><text x="1308.5" y="405.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#0A1A37" text-anchor="middle">ROI + prompt trace review</text><text x="1308.5" y="445.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="middle">not auto PASS</text></g><rect x="1455" y="262" width="137" height="242" rx="22" fill="#FFF4E4" stroke="#F38B00" stroke-width="3"/><text x="1524" y="302.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#0A1A37" text-anchor="middle">record</text><text x="1524" y="337.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">ROI</text><text x="1524" y="368.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#7352DA" text-anchor="middle">prompts</text><text x="1524" y="399.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#00A8C6" text-anchor="middle">layers</text><text x="1524" y="430.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#F38B00" text-anchor="middle">rule</text><text x="1524" y="472.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D9475F" text-anchor="middle">review</text><rect x="325" y="637" width="1267" height="166" rx="24" fill="#FFFFFF" stroke="#A9C9FB" stroke-width="2"/><text x="357" y="678.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#0A1A37" text-anchor="start">HOLD when prompt transfer or observability breaks</text><circle cx="364" cy="710" r="9" fill="#D9475F"/><text x="386" y="717.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D9475F" text-anchor="start">auxiliary source, license, split or target exclusion is uncertain</text><text x="970" y="717.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="760" fill="#0A1A37" text-anchor="start">stop zero-shot claim; complete the audit</text><circle cx="364" cy="745" r="9" fill="#7352DA"/><text x="386" y="752.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7352DA" text-anchor="start">prompt variance or language / visual domain transfer is unstable</text><text x="970" y="752.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="760" fill="#0A1A37" text-anchor="start">recalibrate on target holdout or abstain</text><circle cx="364" cy="780" r="9" fill="#F38B00"/><text x="386" y="787.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F38B00" text-anchor="start">tiny signal below patch scale or global logic exceeds local map</text><text x="970" y="787.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="760" fill="#0A1A37" text-anchor="start">measure effective pixels; use specialist evidence</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF5D4" stroke="#E5AB22" stroke-width="2"/><circle cx="79" cy="875" r="12" fill="#FFE29A" stroke="#C98700" stroke-width="2"/><text x="79" y="882.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#805300" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#674700" text-anchor="start">Candidate margin is an operating signal—not root cause or PASS. Preserve ROI, prompt/text hash, layer, map, rule and owner for REVIEW / HOLD。</text></svg>