<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">先查輔助資料</title><desc id="desc">AnomalyCLIP 的輔助 prompt-learning 資料、目標排除、授權與 checkpoint 必須先被稽核。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="support_coverage_anomalyclip_auxiliary_audit" data-renderer-art="support_coverage" data-primitive="anomalyclip_auxiliary_provenance_audit" data-semantic-scene="anomalyclip_auxiliary_provenance_audit" data-semantic-entities="auxiliary_taxonomy|target_exclusion|license_split|prompt_checkpoint" data-specialist-coverage="auxiliary_taxonomy|target_exclusion|license_split|prompt_checkpoint" data-semantic-relation="audit governed auxiliary prompt-learning provenance before transfer" data-must-show="auxiliary data 卡片與 taxonomy | target exclusion 的禁止符號 | license 與 split 標籤 | prompt-learning checkpoint 的版本章" data-not-claim="zero-shot 等於沒有任何訓練資料或學習狀態。"><title>先查輔助資料</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="anomalyclip-auxiliary-provenance-audit"><rect x="58.16" y="103.32" width="86.24000000000001" height="70.72" rx="6" fill="#E8FAFF" stroke="#1769E0" stroke-width="3"/><path d="M82.8 124.12h36.96 M82.8 147.0h36.96" stroke="#1769E0" stroke-width="3"/><line x1="162.88" y1="140.76" x2="218.32000000000005" y2="140.76" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><c