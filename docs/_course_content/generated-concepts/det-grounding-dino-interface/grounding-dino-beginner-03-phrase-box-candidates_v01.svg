<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Grounding DINO：phrase-conditioned boxes 經 threshold NMS inverse map 成候選 ROI</title><desc id="desc">與 phrase 綁定的 boxes/scores 經版本化 threshold、NMS 與 inverse map 回到 raw ROI；它們仍不是 raw physical truth。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7759C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7759C8"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-139B63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#139B63"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D9485F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092957"/><rect x="1178" y="34" width="454" height="48" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1405" y="66.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">GROUNDING DINO · PHRASE → BOX</text><text x="40" y="110.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="40" font-weight="900" fill="#071C3D" text-anchor="start">phrase 指到哪裡？先得到候選框，再回到原始 ROI</text><text x="40" y="155.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="550" fill="#506887" text-anchor="start">decoder 的輸出是與 phrase 綁定的 boxes/scores；threshold、NMS 與 inverse map 仍是輸出契約的一部分。</text><g data-entity="versioned_phrase_prompt"><rect x="48" y="217" width="545" height="100" rx="24" fill="#F0ECFF" stroke="#7759C8" stroke-width="3"/><text x="76" y="249.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#7759C8" text-anchor="start">text phrase / prompt</text><text x="76" y="283.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#071C3D" text-anchor="start">phrase：『surface scratch』</text><text x="569" y="303.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506887" text-anchor="end">one declared phrase bundle</text></g><g data-entity="same_wafer_aoi_workpiece" data-contract="same raw AOI image"><clipPath id="aoi-photo-48-340"><rect x="48" y="340" width="545" height="374" rx="28"/></clipPath><g clip-path="url(#aoi-photo-48-340)"><image href="grounding-dino-industrial-aoi-anchor_v02.png" x="48" y="340" width="545" height="374" preserveAspectRatio="xMidYMid slice"/></g><rect x="48" y="340" width="545" height="374" rx="28" fill="none" stroke="#1769E0" stroke-width="3"/></g><g data-entity="phrase_conditioned_candidate_box"><rect x="196" y="458" width="116" height="94" rx="8" fill="none" stroke="#F38B00" stroke-width="6"/><rect x="196" y="416" width="220" height="36" rx="18" fill="#F38B00" stroke="#F38B00" stroke-width="0"/><text x="208" y="441.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="start">scratch · candidate</text></g><g data-entity="phrase_conditioned_candidate_box"><rect x="352" y="540" width="120" height="82" rx="8" fill="none" stroke="#F38B00" stroke-width="6"/><rect x="352" y="498" width="220" height="36" rx="18" fill="#F38B00" stroke="#F38B00" stroke-width="0"/><text x="364" y="523.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="start">scratch · candidate</text></g><text x="320" y="749.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#092957" text-anchor="middle">same image · several phrase-linked boxes</text><path d="M624 521 L718 521" fill="none" stroke="#F38B00" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><rect x="744" y="300" width="372" height="420" rx="30" fill="#FFF9F0" stroke="#F38B00" stroke-width="4"/><text x="930" y="352.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#092957" text-anchor="middle">cross-modal decoder</text><text x="930" y="388.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="700" fill="#506887" text-anchor="middle">phrase-conditioned boxes / scores</text><rect x="806" y="458" width="248" height="48" rx="14" fill="#FFE5B8" stroke="#F38B00" stroke-width="2"/><text x="930" y="490.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#F38B00" text-anchor="middle">candidate ①</text><rect x="806" y="532" width="248" height="48" rx="14" fill="#FFD692" stroke="#F38B00" stroke-width="2"/><text x="930" y="564.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#F38B00" text-anchor="middle">candidate ②</text><rect x="806" y="606" width="248" height="48" rx="14" fill="#FFF0D7" stroke="#F38B00" stroke-width="2"/><text x="930" y="638.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#F38B00" text-anchor="middle">candidate ③</text><text x="930" y="683.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D9485F" text-anchor="middle">not object-class truth</text><path d="M1142 521 L1226 521" fill="none" stroke="#F38B00" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><rect x="1252" y="300" width="340" height="198" rx="28" fill="#EEF8FB" stroke="#00A8C6" stroke-width="3"/><text x="1422" y="348.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#092957" text-anchor="middle">threshold / NMS</text><text x="1422" y="388.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506887" text-anchor="middle">versioned filter policy</text><text x="1422" y="446.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="850" fill="#00A8C6" text-anchor="middle">keep candidate ROI</text><path d="M1422 521 L1422 567" fill="none" stroke="#00A8C6" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><rect x="1252" y="579" width="340" height="142" rx="28" fill="#F2FBF6" stroke="#139B63" stroke-width="3"/><text x="1422" y="622.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#139B63" text-anchor="middle">inverse map → raw ROI</text><text x="1422" y="659.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506887" text-anchor="middle">save phrase / score / transform</text><g data-entity="hold_review_gate"><rect x="718" y="753" width="874" height="92" rx="22" fill="#FFF3F4" stroke="#D9485F" stroke-width="3"/><text x="746" y="788.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#D9485F" text-anchor="start">candidate ≠ raw physical truth</text><text x="746" y="820.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506887" text-anchor="start">send the saved raw ROI to a specialist detector / AD / human review</text></g><rect x="40" y="850" width="1592" height="52" rx="20" fill="#FFF6D8" stroke="#E4AF2B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#6E4A00" text-anchor="middle">帶走：box 的含義由 phrase、prompt、threshold、NMS 與 inverse mapping 一起決定。</text></svg>