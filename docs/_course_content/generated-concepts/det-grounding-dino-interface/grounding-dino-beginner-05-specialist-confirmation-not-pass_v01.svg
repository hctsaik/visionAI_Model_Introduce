<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Grounding DINO：candidate ROI 必須交 specialist confirmation，不可直接 PASS</title><desc id="desc">Grounding DINO 只提文字導引的 candidate ROI；高解析 detector、AD、metrology 或 human inspection 形成 evidence record，最後由具名 owner 決定 action。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7759C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7759C8"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-139B63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#139B63"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D9485F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092957"/><rect x="1178" y="34" width="454" height="48" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1405" y="66.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">GROUNDING DINO · CANDIDATE → REVIEW</text><text x="40" y="110.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="40" font-weight="900" fill="#071C3D" text-anchor="start">Grounding DINO 的盒子只負責縮小搜尋範圍；結論要由 evidence owner 產生</text><text x="40" y="155.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="550" fill="#506887" text-anchor="start">文字導引可提高探索性候選；但 phrase box 不能跳過專業檢測、原始證據與人員確認而直接變成 PASS。</text><g data-entity="same_wafer_aoi_workpiece" data-contract="same raw AOI image"><clipPath id="aoi-photo-42-248"><rect x="42" y="248" width="345" height="402" rx="28"/></clipPath><g clip-path="url(#aoi-photo-42-248)"><image href="grounding-dino-industrial-aoi-anchor_v02.png" x="42" y="248" width="345" height="402" preserveAspectRatio="xMidYMid slice"/></g><rect x="42" y="248" width="345" height="402" rx="28" fill="none" stroke="#1769E0" stroke-width="3"/></g><rect x="67" y="273" width="190" height="42" rx="21" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="162.0" y="302.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">same AOI + phrase</text><g data-entity="phrase_conditioned_candidate_box"><rect x="171" y="454" width="86" height="68" rx="8" fill="none" stroke="#F38B00" stroke-width="6"/><rect x="171" y="412" width="162" height="36" rx="18" fill="#F38B00" stroke="#F38B00" stroke-width="0"/><text x="183" y="437.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="start">phrase · ROI</text></g><text x="214" y="695.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#092957" text-anchor="middle">1 · phrase-conditioned input</text><path d="M410 450 L498 450" fill="none" stroke="#7759C8" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-7759C8)"/><rect x="522" y="294" width="278" height="302" rx="28" fill="#FFF9F0" stroke="#F38B00" stroke-width="4"/><text x="661" y="348.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#092957" text-anchor="middle">Grounding DINO</text><text x="661" y="391" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="850" fill="#F38B00" text-anchor="middle">candidate ROI</text><text x="661" y="421" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="850" fill="#F38B00" text-anchor="middle">phrase / score</text><text x="661" y="451" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="850" fill="#F38B00" text-anchor="middle">raw-coordinate link</text><text x="661" y="527.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#D9485F" text-anchor="middle">not PASS</text><path d="M826 450 L910 450" fill="none" stroke="#F38B00" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><rect x="934" y="266" width="328" height="370" rx="28" fill="#EEF8FB" stroke="#00A8C6" stroke-width="4"/><text x="1098" y="322.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#092957" text-anchor="middle">specialist confirmation</text><text x="1098" y="374" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#00A8C6" text-anchor="middle">high-resolution detector</text><text x="1098" y="403" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#00A8C6" text-anchor="middle">AD / metrology</text><text x="1098" y="432" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#00A8C6" text-anchor="middle">or human inspection</text><path d="M977 491 L1221 491" fill="none" stroke="#C5E9F2" stroke-width="3" stroke-linecap="round"/><text x="1098" y="539" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="750" fill="#506887" text-anchor="middle">record observed evidence</text><text x="1098" y="566" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="750" fill="#506887" text-anchor="middle">not prompt confidence</text><path d="M1288 450 L1370 450" fill="none" stroke="#139B63" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-139B63)"/><rect x="1394" y="291" width="234" height="322" rx="28" fill="#F2FBF6" stroke="#139B63" stroke-width="4"/><text x="1511" y="346.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#139B63" text-anchor="middle">evidence record</text><text x="1511" y="399" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#092957" text-anchor="middle">raw ROI</text><text x="1511" y="428" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#092957" text-anchor="middle">prompt bundle</text><text x="1511" y="457" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#092957" text-anchor="middle">transform</text><text x="1511" y="486" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#092957" text-anchor="middle">specialist result</text><text x="1511" y="557.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#139B63" text-anchor="middle">named owner decides</text><rect x="392" y="741" width="1240" height="66" rx="24" fill="#FFF1F2" stroke="#D9485F" stroke-width="3"/><text x="1012" y="780.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#D9485F" text-anchor="middle">禁止捷徑：phrase-conditioned candidate ROI  ──✕──&gt;  PASS / release</text><rect x="40" y="850" width="1592" height="52" rx="20" fill="#FFF6D8" stroke="#E4AF2B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#6E4A00" text-anchor="middle">帶走：Grounding DINO 適合 text-guided candidate exploration；release 要有獨立、可追溯的 specialist evidence。</text></svg>