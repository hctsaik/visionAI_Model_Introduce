<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Grounding DINO：版本化 prompt ontology 改變時必須 HOLD 並重做 qualification</title><desc id="desc">phrase、template、vocabulary、tokenizer、threshold/NMS 與 image recipe 一起定義 prompt bundle；改變後要量 prompt sensitivity 與 grounding evidence。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7759C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7759C8"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-139B63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#139B63"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D9485F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092957"/><rect x="1178" y="34" width="454" height="48" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1405" y="66.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">GROUNDING DINO · VERSIONED ONTOLOGY</text><text x="40" y="110.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="40" font-weight="900" fill="#071C3D" text-anchor="start">ontology 一變，舊 box／threshold 不能直接比較</text><text x="40" y="155.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="550" fill="#506887" text-anchor="start">phrase、template、vocabulary、tokenizer、threshold/NMS 與 image recipe 必須一起記成可重播的 prompt bundle。</text><g data-entity="same_wafer_aoi_workpiece" data-contract="same raw AOI image"><clipPath id="aoi-photo-48-233"><rect x="48" y="233" width="418" height="442" rx="28"/></clipPath><g clip-path="url(#aoi-photo-48-233)"><image href="grounding-dino-industrial-aoi-anchor_v02.png" x="48" y="233" width="418" height="442" preserveAspectRatio="xMidYMid slice"/></g><rect x="48" y="233" width="418" height="442" rx="28" fill="none" stroke="#1769E0" stroke-width="3"/></g><rect x="74" y="260" width="176" height="42" rx="21" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="162.0" y="289.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">same raw AOI</text><g data-entity="phrase_conditioned_candidate_box"><rect x="205" y="473" width="104" height="76" rx="8" fill="none" stroke="#F38B00" stroke-width="6"/><rect x="205" y="431" width="129" height="36" rx="18" fill="#F38B00" stroke="#F38B00" stroke-width="0"/><text x="217" y="456.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="start">old · ROI</text></g><text x="257" y="716.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#092957" text-anchor="middle">same image remains evidence</text><path d="M492 453 L566 453" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="590" y="218" width="514" height="493" rx="30" fill="#F8F5FF" stroke="#7759C8" stroke-width="4"/><text x="847" y="270.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="30" font-weight="900" fill="#7759C8" text-anchor="middle">versioned prompt bundle</text><path d="M636 300 L1056 300" fill="none" stroke="#D9D0FA" stroke-width="2" stroke-linecap="round"/><text x="642" y="340.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#7759C8" text-anchor="start">phrase</text><text x="835" y="340.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#071C3D" text-anchor="start">surface scratch</text><path d="M638 364 L1056 364" fill="none" stroke="#E3DCF9" stroke-width="2" stroke-linecap="round"/><text x="642" y="416.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#7759C8" text-anchor="start">template / ontology</text><text x="835" y="416.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#071C3D" text-anchor="start">approved terms · rev 18</text><path d="M638 440 L1056 440" fill="none" stroke="#E3DCF9" stroke-width="2" stroke-linecap="round"/><text x="642" y="492.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#7759C8" text-anchor="start">tokenizer</text><text x="835" y="492.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#071C3D" text-anchor="start">model/tokenizer revision</text><path d="M638 516 L1056 516" fill="none" stroke="#E3DCF9" stroke-width="2" stroke-linecap="round"/><text x="642" y="568.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#7759C8" text-anchor="start">output policy</text><text x="835" y="568.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#071C3D" text-anchor="start">phrase/box threshold · NMS</text><text x="847" y="653.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D9485F" text-anchor="middle">a changed word can move candidate boxes</text><path d="M1132 453 L1196 453" fill="none" stroke="#7759C8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-7759C8)"/><rect x="1220" y="227" width="380" height="430" rx="30" fill="#FFF9F0" stroke="#F38B00" stroke-width="4"/><text x="1410" y="276.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#092957" text-anchor="middle">compare only after</text><text x="1410" y="320.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#F38B00" text-anchor="middle">prompt sensitivity</text><text x="1410" y="370" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="750" fill="#506887" text-anchor="middle">seen / unseen terms</text><text x="1410" y="401" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="750" fill="#506887" text-anchor="middle">localization failures</text><text x="1410" y="432" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="750" fill="#506887" text-anchor="middle">specialist confirmation</text><path d="M1260 490 L1560 490" fill="none" stroke="#F6D48A" stroke-width="2" stroke-linecap="round"/><text x="1410" y="536" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#071C3D" text-anchor="middle">grounding recall / IoU</text><text x="1410" y="566" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#071C3D" text-anchor="middle">complete P95</text><g data-entity="hold_review_gate"><rect x="610" y="749" width="990" height="92" rx="22" fill="#FFF3F4" stroke="#D9485F" stroke-width="3"/><text x="638" y="784.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#D9485F" text-anchor="start">phrase / ontology / tokenizer / threshold changed → HOLD</text><text x="638" y="816.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506887" text-anchor="start">save the new bundle, rerun qualification, then decide whether a candidate path is usable</text></g><rect x="40" y="850" width="1592" height="52" rx="20" fill="#FFF6D8" stroke="#E4AF2B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#6E4A00" text-anchor="middle">帶走：一張候選框不可脫離它的 versioned prompt bundle 被解讀或比較。</text></svg>