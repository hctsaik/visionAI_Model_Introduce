<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">Grounding DINO：vision features 與 phrase tokens 在 cross-modal grounding path 相遇</title><desc id="desc">同一 AOI image features 與 versioned phrase tokens 經 feature enhancer、language-guided queries 和 cross-modal decoder 形成文字導引的 candidate regions。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-7759C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7759C8"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-139B63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#139B63"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D9485F"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#092957"/><rect x="1178" y="34" width="454" height="48" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1405" y="66.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#1769E0" text-anchor="middle">GROUNDING DINO · DUAL INPUT</text><text x="40" y="110.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="40" font-weight="900" fill="#071C3D" text-anchor="start">文字與影像在同一條 grounding path 相遇</text><text x="40" y="155.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="550" fill="#506887" text-anchor="start">左邊是同一 AOI 的 vision features；上方是 phrase tokens。紫色文字路徑會導引 query，不是替既有類別換名字。</text><g data-entity="same_wafer_aoi_workpiece" data-contract="same raw AOI image"><clipPath id="aoi-photo-46-236"><rect x="46" y="236" width="430" height="442" rx="28"/></clipPath><g clip-path="url(#aoi-photo-46-236)"><image href="grounding-dino-industrial-aoi-anchor_v02.png" x="46" y="236" width="430" height="442" preserveAspectRatio="xMidYMid slice"/></g><rect x="46" y="236" width="430" height="442" rx="28" fill="none" stroke="#1769E0" stroke-width="3"/></g><rect x="72" y="262" width="154" height="42" rx="21" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="149.0" y="291.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">same AOI</text><g data-entity="phrase_conditioned_candidate_box"><rect x="205" y="469" width="110" height="83" rx="8" fill="none" stroke="#F38B00" stroke-width="6"/><rect x="205" y="427" width="220" height="36" rx="18" fill="#F38B00" stroke="#F38B00" stroke-width="0"/><text x="217" y="452.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="start">raw ROI · candidate</text></g><g data-entity="vision_feature_stream"><rect x="520" y="488" width="370" height="94" rx="22" fill="#EAF4FF" stroke="#00A8C6" stroke-width="3"/><text x="548" y="521.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#092957" text-anchor="start">vision features</text><text x="548" y="550.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="650" fill="#506887" text-anchor="start">same encoder + preprocess</text><rect x="798.0" y="515" width="24" height="40" rx="6" fill="#BFEAF5" stroke="#00A8C6" stroke-width="1"/><rect x="805.1428571428571" y="515" width="24" height="40" rx="6" fill="#BFEAF5" stroke="#00A8C6" stroke-width="1"/><rect x="812.2857142857143" y="515" width="24" height="40" rx="6" fill="#55C7E2" stroke="#00A8C6" stroke-width="1"/><rect x="819.4285714285714" y="515" width="24" height="40" rx="6" fill="#BFEAF5" stroke="#00A8C6" stroke-width="1"/><rect x="826.5714285714286" y="515" width="24" height="40" rx="6" fill="#BFEAF5" stroke="#00A8C6" stroke-width="1"/><rect x="833.7142857142857" y="515" width="24" height="40" rx="6" fill="#55C7E2" stroke="#00A8C6" stroke-width="1"/><rect x="840.8571428571429" y="515" width="24" height="40" rx="6" fill="#BFEAF5" stroke="#00A8C6" stroke-width="1"/><rect x="848.0" y="515" width="24" height="40" rx="6" fill="#BFEAF5" stroke="#00A8C6" stroke-width="1"/></g><path d="M478 482 L511 482" fill="none" stroke="#00A8C6" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-00A8C6)"/><g data-entity="versioned_phrase_prompt"><rect x="520" y="236" width="742" height="100" rx="24" fill="#F0ECFF" stroke="#7759C8" stroke-width="3"/><text x="548" y="268.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#7759C8" text-anchor="start">text phrase / prompt</text><text x="548" y="302.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#071C3D" text-anchor="start">phrase：『edge contamination』</text><text x="1238" y="322.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#506887" text-anchor="end">versioned text input</text></g><g data-entity="phrase_tokens"><rect x="576" y="369" width="110" height="58" rx="17" fill="#F5F1F