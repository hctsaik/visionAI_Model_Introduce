g TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D9485F" text-anchor="middle">not a closed-set class head</text><path d="M1368 511 L1430 511" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><rect x="1450" y="356" width="170" height="314" rx="28" fill="#FFF7EC" stroke="#F38B00" stroke-width="3"/><text x="1535" y="402" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#F38B00" text-anchor="middle">language-</text><text x="1535" y="433" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#F38B00" text-anchor="middle">guided</text><text x="1535" y="464" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#F38B00" text-anchor="middle">queries</text><path d="M1535 505 L1535 548" fill="none" stroke="#F38B00" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-F38B00)"/><text x="1535" y="583" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#092957" text-anchor="middle">cross-modal</text><text x="1535" y="612" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#092957" text-anchor="middle">decoder</text><text x="1535" y="632" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#506887" text-anchor="middle">phrase →</text><text x="1535" y="656" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#506887" text-anchor="middle">regions</text><rect x="48" y="731" width="1570" height="76" rx="24" fill="#EEF8FB" stroke="#00A8C6" stroke-width="2"/><text x="833" y="764.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#092957" text-anchor="middle">只有 Grounding DINO 這條文字輸入會參與 query/decoder：同一 AOI，換 phrase 就是另一個 query/score space。</text><rect x="40" y="850" width="1592" height="52" rx="20" fill="#FFF6D8" stroke="#E4AF2B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#6E4A00" text-anchor="middle">帶走：text phrase 是模型輸入；要和 image preprocessing 一樣保存與版本化。</text></svg>