<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><marker id="a-1769E0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1769E0"/></marker><marker id="a-00A9C7" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#00A9C7"/></marker><marker id="a-F38B00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#F38B00"/></marker><marker id="a-D9485F" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#D9485F"/></marker><marker id="a-159A63" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#159A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#082554"/><rect x="1282" y="33" width="346" height="50" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1455" y="66" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">QWEN-VL · TOKEN → COST</text><text x="40" y="108" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="39" font-weight="900" fill="#071D43" text-anchor="start">第三步：同一問題遇到不同輸入形狀，token、VRAM、P95 與可見 evidence 會一起改變</text><text x="40" y="153" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="550" fill="#506584" text-anchor="start">不要因為三次回答同樣流暢，就假設它們處在同一個 operating point。</text><clipPath id="clip-55-245"><rect x="55" y="245" width="380" height="470" rx="26"/></clipPath><g clip-path="url(#clip-55-245)"><image href="qwen-vl-industrial-variable-input-anchor_v02.png" x="55" y="245" width="380" height="470" preserveAspectRatio="xMidYMid slice"/></g><rect x="55" y="245" width="380" height="470" rx="26" fill="none" stroke="#1769E0" stroke-width="3"/><text x="245" y="282" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">same question</text><path d="M475 470 L570 470" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><rect x="600" y="225" width="390" height="520" rx="30" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="795" y="285" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">measured deployment traces</text><text x="655" y="365" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="850" fill="#071D43" text-anchor="start">wide AOI</text><rect x="830" y="341" width="125" height="30" rx="10" fill="#00A9C7"/><text x="655" y="470" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="850" fill="#071D43" text-anchor="start">square carrier</text><rect x="830" y="446" width="205" height="30" rx="10" fill="#1769E0"/><text x="655" y="575" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="850" fill="#071D43" text-anchor="start">tall document</text><rect x="830" y="551" width="300" height="30" rx="10" fill="#F38B00"/><text x="795" y="700" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#D9485F" text-anchor="middle">profile, do not infer</text><path d="M1025 470 L1120 470" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#a-F38B00)"/><rect x="1150" y="230" width="460" height="510" rx="30" fill="#FFF7EC" stroke="#F38B00" stroke-width="3"/><text x="1380" y="300" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="850" fill="#774C00" text-anchor="middle">measure together</text><text x="1380" y="354" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="850" fill="#774C00" text-anchor="middle">visual evidence coverage</text><text x="1380" y="408" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="850" fill="#774C00" text-anchor="middle">VRAM + prefill + decode</text><text x="1380" y="462" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="850" fill="#774C00" text-anchor="middle">retrieval/tool + full P95</text><text x="1380" y="516" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="850" fill="#774C00" text-anchor="middle">cost + truncation</text><rect x="1210" y="635" width="340" height="52" rx="16" fill="#FFF0F2" stroke="#D9485F" stroke-width="2"/><text x="1380" y="668" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D9485F" text-anchor="middle">unqualified change → HOLD / re-profile</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">重點：token count 是部署控制變數：輸入、processor、pixel cap、sampling 或 context 改變時，同時重測 evidence coverage 與完整成本。</text></svg>