<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><marker id="a-1769E0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1769E0"/></marker><marker id="a-00A9C7" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#00A9C7"/></marker><marker id="a-F38B00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#F38B00"/></marker><marker id="a-D9485F" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#D9485F"/></marker><marker id="a-159A63" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#159A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#082554"/><rect x="1282" y="33" width="346" height="50" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1455" y="66" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">QWEN-VL · QUALIFICATION</text><text x="40" y="108" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="39" font-weight="900" fill="#071D43" text-anchor="start">第四步：選的是具名、日期固定的 deployment；不是一個叫 Qwen-VL 的 family 名稱</text><text x="40" y="153" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="550" fill="#506584" text-anchor="start">同一 image/question/schema/data contract 下，只有 grounded、可拒答且完整 P95/cost 合格的 route 才能進 specialist review。</text><clipPath id="clip-55-255"><rect x="55" y="255" width="300" height="410" rx="26"/></clipPath><g clip-path="url(#clip-55-255)"><image href="qwen-vl-industrial-variable-input-anchor_v02.png" x="55" y="255" width="300" height="410" preserveAspectRatio="xMidYMid slice"/></g><rect x="55" y="255" width="300" height="410" rx="26" fill="none" stroke="#1769E0" stroke-width="3"/><path d="M390 460 L490 460" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#a-F38B00)"/><rect x="520" y="245" width="335" height="430" rx="30" fill="#FFF0F2" stroke="#D9485F" stroke-width="3"/><text x="687" y="315" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="850" fill="#D9485F" text-anchor="middle">broad family name</text><text x="687" y="363" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="850" fill="#D9485F" text-anchor="middle">or fluent screenshot</text><text x="687" y="411" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="850" fill="#D9485F" text-anchor="middle">cannot reproduce</text><text x="687" y="459" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="25" font-weight="850" fill="#D9485F" text-anchor="middle">cannot authorize action</text><text x="687" y="610" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#D9485F" text-anchor="middle">reject shortcut</text><path d="M890 460 L990 460" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><rect x="1020" y="205" width="570" height="540" rx="32" fill="#EAF8EF" stroke="#159A63" stroke-width="3"/><text x="1305" y="270" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="31" font-weight="900" fill="#0A6644" text-anchor="middle">named deployment evidence gate</text><circle cx="1100" cy="343" r="15" fill="#1769E0"/><text x="1135" y="350" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#071D43" text-anchor="start">revision / processor / pixel-token policy</text><circle cx="1100" cy="425" r="15" fill="#00A9C7"/><text x="1135" y="432" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#071D43" text-anchor="start">grounding + source coverage + abstention</text><circle cx="1100" cy="507" r="15" fill="#F38B00"/><text x="1135" y="514" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#071D43" text-anchor="start">ACL / injection / replay + fallback</text><circle cx="1100" cy="589" r="15" fill="#159A63"/><text x="1135" y="596" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#071D43" text-anchor="start">VRAM / P95 / cost + specialist acceptance</text><rect x="1080" y="671" width="450" height="42" rx="16" fill="#FFFFFF" stroke="#159A63" stroke-width="2"/><text x="1305" y="699" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#0A6644" text-anchor="middle">candidate → specialist review / HOLD, never automatic release</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">重點：Qwen-VL 是一條治理過的 assist route；grounding、abstention、資料邊界、資源與 specialist evidence 缺一項都不能自動前進。</text></svg>