<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><marker id="a-1769E0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1769E0"/></marker><marker id="a-00A9C7" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#00A9C7"/></marker><marker id="a-F38B00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#F38B00"/></marker><marker id="a-D9485F" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#D9485F"/></marker><marker id="a-159A63" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#159A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#082554"/><rect x="1285" y="33" width="343" height="50" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1456" y="66" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">CLIP · PROMPT CONTRACT</text><text x="40" y="108" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="40" font-weight="900" fill="#071D43" text-anchor="start">先固定要比較的文字候選，而不是先相信一句 prompt</text><text x="40" y="153" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="550" fill="#506584" text-anchor="start">CLIP 的文字端會把 ontology、template、synonyms 和 tokenizer 變成可比較的 text embedding；改 wording 就可能改排名。</text><clipPath id="clip-55-235"><rect x="55" y="235" width="430" height="480" rx="26"/></clipPath><g clip-path="url(#clip-55-235)"><image href="clip-industrial-ceramic-workpiece-anchor_v02.png" x="55" y="235" width="430" height="480" preserveAspectRatio="xMidYMid slice"/></g><rect x="55" y="235" width="430" height="480" rx="26" fill="none" stroke="#1769E0" stroke-width="3"/><text x="270" y="278" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#071D43" text-anchor="middle">fixed AOI ROI</text><rect x="92" y="650" width="356" height="44" rx="16" fill="#FFF7EC" stroke="#F38B00" stroke-width="2"/><text x="270" y="679" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="850" fill="#774C00" text-anchor="middle">影像不變；候選文字要版本化</text><path d="M525 465 L630 465" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><rect x="660" y="220" width="440" height="520" rx="30" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="880" y="285" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#071D43" text-anchor="middle">controlled prompt ontology</text><rect x="730" y="355" width="300" height="62" rx="18" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/><text x="880" y="395" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="800" fill="#071D43" text-anchor="middle">「正常接點」</text><rect x="730" y="440" width="300" height="62" rx="18" fill="#FFFFFF" stroke="#F38B00" stroke-width="2"/><text x="880" y="480" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="800" fill="#071D43" text-anchor="middle">「表面刮痕」</text><rect x="730" y="525" width="300" height="62" rx="18" fill="#FFFFFF" stroke="#00A9C7" stroke-width="2"/><text x="880" y="565" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="800" fill="#071D43" text-anchor="middle">「表面標記」</text><text x="880" y="650" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="750" fill="#506584" text-anchor="middle">template + synonyms + tokenizer</text><path d="M1130 465 L1225 465" fill="none" stroke="#00A9C7" stroke-width="6" stroke-linecap="round" marker-end="url(#a-00A9C7)"/><rect x="1255" y="235" width="355" height="480" rx="30" fill="#E9FBFF" stroke="#00A9C7" stroke-width="3"/><text x="1432" y="320" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">text encoder</text><text x="1432" y="372" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">→ normalized t</text><text x="1432" y="424" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">→ versioned</text><text x="1432" y="476" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#071D43" text-anchor="middle">candidate set</text><text x="1432" y="625" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="850" fill="#D9485F" text-anchor="middle">wording change = t changes</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">帶走：CLIP 的 prompt 不是自然語言裝飾；prompt pool、template、synonyms 與 tokenizer 都是 ranking contract。</text></svg>