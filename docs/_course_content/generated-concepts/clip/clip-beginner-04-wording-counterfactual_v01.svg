<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><marker id="a-1769E0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1769E0"/></marker><marker id="a-00A9C7" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#00A9C7"/></marker><marker id="a-F38B00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#F38B00"/></marker><marker id="a-D9485F" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#D9485F"/></marker><marker id="a-159A63" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#159A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#082554"/><rect x="1285" y="33" width="343" height="50" rx="24" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="1456" y="66" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">CLIP · PROMPT VARIANCE</text><text x="40" y="108" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="40" font-weight="900" fill="#071D43" text-anchor="start">同一張影像，改 prompt wording 就可能改 candidate ranking</text><text x="40" y="153" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="23" font-weight="550" fill="#506584" text-anchor="start">這不是模型不穩定的藉口，而是必須保存 prompt pool 與 variance、並在不確定時 abstain 的工程原因。</text><clipPath id="clip-55-235"><rect x="55" y="235" width="420" height="480" rx="26"/></clipPath><g clip-path="url(#clip-55-235)"><image href="clip-industrial-ceramic-workpiece-anchor_v02.png" x="55" y="235" width="420" height="480" preserveAspectRatio="xMidYMid slice"/></g><rect x="55" y="235" width="420" height="480" rx="26" fill="none" stroke="#1769E0" stroke-width="3"/><text x="265" y="278" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="28" font-weight="900" fill="#071D43" text-anchor="middle">同一張 fixed ROI</text><path d="M515 470 L625 470" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" marker-end="url(#a-1769E0)"/><rect x="655" y="230" width="410" height="500" rx="30" fill="#FFFFFF" stroke="#A8C9FF" stroke-width="2"/><text x="860" y="292" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="29" font-weight="900" fill="#071D43" text-anchor="middle">only wording changes</text><rect x="710" y="365" width="300" height="62" rx="18" fill="#FFFFFF" stroke="#F38B00" stroke-width="2"/><text x="860" y="405" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="800" fill="#071D43" text-anchor="middle">「scratch」</text><rect x="710" y="475" width="300" height="62" rx="18" fill="#FFFFFF" stroke="#00A9C7" stroke-width="2"/><text x="860" y="515" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="800" fill="#071D43" text-anchor="middle">「surface mark」</text><text x="860" y="615" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="750" fill="#506584" text-anchor="middle">two different text embeddings t</text><path d="M1095 415 L1200 360" fill="none" stroke="#F38B00" stroke-width="6" stroke-linecap="round" marker-end="url(#a-F38B00)"/><path d="M1095 525 L1200 580" fill="none" stroke="#00A9C7" stroke-width="6" stroke-linecap="round" marker-end="url(#a-00A9C7)"/><rect x="1230" y="230" width="370" height="500" rx="30" fill="#FFF7EC" stroke="#F38B00" stroke-width="3"/><text x="1415" y="310" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#774C00" text-anchor="middle">candidate ranks</text><text x="1415" y="353" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#774C00" text-anchor="middle">can move even</text><text x="1415" y="396" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#774C00" text-anchor="middle">when pixels</text><text x="1415" y="439" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#774C00" text-anchor="middle">do not change</text><rect x="1280" y="540" width="270" height="80" rx="18" fill="#FFF0F2" stroke="#D9485F" stroke-width="2"/><text x="1415" y="575" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="850" fill="#D9485F" text-anchor="middle">save prompt variance</text><text x="1415" y="603" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="850" fill="#D9485F" text-anchor="middle">or abstain / REVIEW</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF6D7" stroke="#E5AF2C" stroke-width="2"/><text x="836" y="883" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#674500" text-anchor="middle">帶走：CLIP 排的是目前 prompt set 的相近度；改 ontology 或 wording，必須重看 rank、variance、OOD 與後續 evidence。</text></svg>