<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">YOLOE：prompt exemplar mode export 或 P95 改變時 HOLD 並重做 qualification</title><desc id="desc">text prompt、visual exemplar、mode、export 或 P95 預算改變時，舊 candidate 不能沿用；保存 raw evidence，重做 mode-wise qualification 和 specialist review。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0C9B91" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0C9B91"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D94B62"/></marker><marker id="arrow-139A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#139A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#0A2450"/><text x="42" y="99.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#0A2450" text-anchor="start">prompt、exemplar、mode、export 或 P95 變了？先 HOLD</text><text x="42" y="147.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">這些不是可忽略的 UI 選項。任一項改變，舊候選的 score、box／mask 與 runtime 證據都不能直接沿用。</text><rect x="1302" y="34" width="330" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1467" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">YOLOE · PROMPT + MODE</text><text x="53" y="212.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#102E62" text-anchor="start">same raw AOI stays evidence</text><g data-entity="yoloe_aoi_workpiece" data-contract="same raw AOI image"><clipPath id="crop-hold-aoi-53-244-260-15"><rect x="53" y="244" width="355" height="352" rx="24"/></clipPath><g clip-path="url(#crop-hold-aoi-53-244-260-15)"><svg x="53" y="244" width="355" height="352" viewBox="260 15 1190 900" preserveAspectRatio="xMidYMid slice"><image href="../yolo-seg/yolo-seg-beginner-01-pcb-instance-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="53" y="244" width="355" height="352" rx="24" fill="none" stroke="#1769E0" stroke-width="3"/></g><g data-entity="prompt_conditioned_candidate_box"><rect x="203" y="366" width="95" height="76" rx="8" fill="none" stroke="#F28B00" stroke-width="5"/><rect x="203" y="335" width="213" height="27" rx="9" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="215" y="356.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="start">old · candidate</text></g><text x="230" y="634.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#102E62" text-anchor="middle">原圖不變；contract 可能變</text><text x="494" y="214.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#102E62" text-anchor="start">versioned contract — any changed checkpoint blocks comparison</text><path d="M502 294 L1362 294" fill="none" stroke="#C9DAF7" stroke-width="8" stroke-linecap="round"/><circle cx="502" cy="294" r="18" fill="#7657C8" stroke="#FFFFFF" stroke-width="4"/><text x="502" y="342.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7657C8" text-anchor="middle">text prompt</text><text x="502" y="370.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="middle">T-17 → T-18</text><path d="M530 294 L689 294" fill="none" stroke="#7657C8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><circle cx="717" cy="294" r="18" fill="#0C9B91" stroke="#FFFFFF" stroke-width="4"/><text x="717" y="342.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#0C9B91" text-anchor="middle">visual exemplar</text><text x="717" y="370.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="middle">EX-24 → EX-31</text><path d="M745 294 L904 294" fill="none" stroke="#0C9B91" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-0C9B91)"/><circle cx="932" cy="294" r="18" fill="#F28B00" stroke="#FFFFFF" stroke-width="4"/><text x="932" y="342.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F28B00" text-anchor="middle">mode</text><text x="932" y="370.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="middle">box → mask</text><path d="M960 294 L1119 294" fill="none" stroke="#F28B00" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><circle cx="1147" cy="294" r="18" fill="#1769E0" stroke="#FFFFFF" stroke-width="4"/><text x="1147" y="342.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="middle">export</text><text x="1147" y="370.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="middle">postprocess r5 → r6</text><path d="M1175 294 L1334 294" fill="none" stroke="#1769E0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-1769E0)"/><circle cx="1362" cy="294" r="18" fill="#D94B62" stroke="#FFFFFF" stroke-width="4"/><text x="1362" y="342.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#D94B62" text-anchor="middle">P95 budget</text><text x="1362" y="370.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="middle">112 ms → 160 ms</text><path d="M 930 393 C 930 431 930 437 930 453" fill="none" stroke="#D94B62" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-D94B62)"/><g data-entity="contract_change_hold_gate"><rect x="517" y="460" width="1030" height="128" rx="30" fill="#FFF2F4" stroke="#D94B62" stroke-width="5"/><text x="1032.0" y="508.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="950" fill="#D94B62" text-anchor="middle">HOLD</text><text x="1032.0" y="541.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="850" fill="#102E62" text-anchor="middle">changed contract: do not reuse the old candidate</text><text x="1032.0" y="570.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="middle">save raw AOI + changed setting, then re-qualify</text></g><text x="1032" y="629.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#D94B62" text-anchor="middle">HOLD does not erase evidence; it stops an unqualified comparison.</text><text x="501" y="683.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#102E62" text-anchor="start">re-qualify the changed source × mode</text><rect x="491" y="710" width="1061" height="104" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><rect x="503.0" y="731" width="241.25" height="11" rx="5" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><text x="623.625" y="775.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#7657C8" text-anchor="middle">text / visual recall</text><text x="623.625" y="801.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="middle">new evidence record</text><path d="M756.25 725 L756.25 802" fill="none" stroke="#D8E6F7" stroke-width="2" stroke-linecap="round"/><rect x="768.25" y="731" width="241.25" height="11" rx="5" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="888.875" y="775.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#F28B00" text-anchor="middle">box or mask metrics</text><text x="888.875" y="801.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="middle">new evidence record</text><path d="M1021.5 725 L1021.5 802" fill="none" stroke="#D8E6F7" stroke-width="2" stroke-linecap="round"/><rect x="1033.5" y="731" width="241.25" height="11" rx="5" fill="#1769E0" stroke="#1769E0" stroke-width="0"/><text x="1154.125" y="775.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#1769E0" text-anchor="middle">export + end-to-end P95</text><text x="1154.125" y="801.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="middle">new evidence record</text><path d="M1286.75 725 L1286.75 802" fill="none" stroke="#D8E6F7" stroke-width="2" stroke-linecap="round"/><rect x="1298.75" y="731" width="241.25" height="11" rx="5" fill="#139A63" stroke="#139A63" stroke-width="0"/><text x="1419.375" y="775.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#139A63" text-anchor="middle">specialist review evidence</text><text x="1419.375" y="801.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="middle">new evidence record</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">改 prompt/exemplar/mode/export/P95 → HOLD；先存 evidence、重做 mode-wise qualification，再交 review owner。</text></svg>