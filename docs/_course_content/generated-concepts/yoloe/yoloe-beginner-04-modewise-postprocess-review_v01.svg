<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">YOLOE：detection 與 segmentation 各有後處理、inverse mapping、metrics 與 review</title><desc id="desc">每個 mode 對應自己的 threshold、NMS 或 mask postprocess、inverse ROI、metrics 和 specialist review evidence；candidate 不等於物理真值。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0C9B91" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0C9B91"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D94B62"/></marker><marker id="arrow-139A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#139A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#0A2450"/><text x="42" y="99.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#0A2450" text-anchor="start">每個 mode 各走自己的後處理、回映、量測與 review</text><text x="42" y="147.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">候選的可見形狀來自 mode-specific postprocess；只有把它回到 raw AOI、記下 metrics 與 specialist review，才可被稽核。</text><rect x="1302" y="34" width="330" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1467" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">YOLOE · PROMPT + MODE</text><text x="52" y="214.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#102E62" text-anchor="start">same raw AOI</text><g data-entity="yoloe_aoi_workpiece" data-contract="same raw AOI image"><clipPath id="crop-review-aoi-52-246-285-15"><rect x="52" y="246" width="344" height="373" rx="24"/></clipPath><g clip-path="url(#crop-review-aoi-52-246-285-15)"><svg x="52" y="246" width="344" height="373" viewBox="285 15 1170 900" preserveAspectRatio="xMidYMid slice"><image href="../yolo-seg/yolo-seg-beginner-01-pcb-instance-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="52" y="246" width="344" height="373" rx="24" fill="none" stroke="#1769E0" stroke-width="3"/></g><g data-entity="prompt_conditioned_candidate_box"><rect x="220" y="371" width="92" height="79" rx="8" fill="none" stroke="#F28B00" stroke-width="5"/><rect x="220" y="340" width="210" height="27" rx="9" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="232" y="361.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="start">ROI · raw link</text></g><g data-entity="prompt_conditioned_candidate_mask"><path d="M217.42000000000002 490.96 C248.22 476.4, 292.88 488.88, 299.04 515.92 C305.2 540.88, 271.32 553.36, 237.44 540.88 C206.64 529.44, 197.4 503.44, 217.42000000000002 490.96Z" fill="#0C9B91" fill-opacity=".38" stroke="#0C9B91" stroke-width="5"/><rect x="194" y="478" width="130" height="33" rx="16" fill="#0C9B91" stroke="#0C9B91" stroke-width="0"/><text x="259.0" y="503.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">mask ROI</text></g><text x="224" y="658.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#102E62" text-anchor="middle">保留 raw pixels / coordinates</text><path d="M416 376 L482 376" fill="none" stroke="#F28B00" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><path d="M416 543 L482 543" fill="none" stroke="#0C9B91" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-0C9B91)"/><g data-entity="detection_mode_contract_lane"><rect x="491" y="258" width="1110" height="124" rx="24" fill="#FFFFFF" stroke="#F28B00" stroke-width="3"/><rect x="507" y="275" width="214" height="35" rx="16" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="614" y="301.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">detection</text><text x="848.25" y="306.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#102E62" text-anchor="middle">prompt score</text><text x="848.25" y="339.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#F28B00" text-anchor="middle">threshold</text><path d="M933.5 359 L967.5 359" fill="none" stroke="#F28B00" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><text x="1054.75" y="306.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#102E62" text-anchor="middle">box candidates</text><text x="1054.75" y="339.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#F28B00" text-anchor="middle">NMS / policy</text><path d="M1140.0 359 L1174.0 359" fill="none" stroke="#F28B00" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><text x="1261.25" y="306.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#102E62" text-anchor="middle">inverse box</text><text x="1261.25" y="339.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#F28B00" text-anchor="middle">raw ROI</text><path d="M1346.5 359 L1380.5 359" fill="none" stroke="#F28B00" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><text x="1467.75" y="306.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#102E62" text-anchor="middle">box recall</text><text x="1467.75" y="339.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#F28B00" text-anchor="middle">localization</text><text x="1573" y="366.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D94B62" text-anchor="end">→ review</text></g><g data-entity="segmentation_mode_contract_lane"><rect x="491" y="465" width="1110" height="124" rx="24" fill="#FFFFFF" stroke="#0C9B91" stroke-width="3"/><rect x="507" y="482" width="214" height="35" rx="16" fill="#0C9B91" stroke="#0C9B91" stroke-width="0"/><text x="614" y="508.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">segmentation</text><text x="848.25" y="513.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#102E62" text-anchor="middle">mask logit</text><text x="848.25" y="546.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#0C9B91" text-anchor="middle">threshold / compose</text><path d="M933.5 566 L967.5 566" fill="none" stroke="#0C9B91" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-0C9B91)"/><text x="1054.75" y="513.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#102E62" text-anchor="middle">mask postprocess</text><text x="1054.75" y="546.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#0C9B91" text-anchor="middle">contour / tile</text><path d="M1140.0 566 L1174.0 566" fill="none" stroke="#0C9B91" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-0C9B91)"/><text x="1261.25" y="513.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#102E62" text-anchor="middle">inverse mask</text><text x="1261.25" y="546.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#0C9B91" text-anchor="middle">raw ROI</text><path d="M1346.5 566 L1380.5 566" fill="none" stroke="#0C9B91" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-0C9B91)"/><text x="1467.75" y="513.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="900" fill="#102E62" text-anchor="middle">mask consistency</text><text x="1467.75" y="546.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#0C9B91" text-anchor="middle">boundary / tiny</text><text x="1573" y="573.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D94B62" text-anchor="end">→ review</text></g><g data-entity="specialist_review_gate"><rect x="490" y="629" width="1111" height="85" rx="21" fill="#EFFAF4" stroke="#139A63" stroke-width="3"/><text x="515" y="663.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#139A63" text-anchor="start">candidate evidence → specialist confirmation</text><text x="515" y="692.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="start">save prompt/exemplar ID · mode · output · postprocess · inverse transform · metric · raw ROI</text></g><rect x="491" y="733" width="1110" height="83" rx="20" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1046" y="765.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#102E62" text-anchor="middle">separate operating records: each mode retains its own evidence</text><text x="1046" y="796.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#52688D" text-anchor="middle">detection: box recall / localization / P95     |     segmentation: mask consistency / boundary / P95</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">將 box 與 mask 分 mode 保存：各自的 postprocess、inverse ROI、metric 與 review 都不能借用。</text></svg>