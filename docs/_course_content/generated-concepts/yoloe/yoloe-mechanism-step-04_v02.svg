<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">每個 mode 分開回映與確認</title><desc id="desc">YOLOE 需要對每個 prompt/mode 分別回映、量 recall/mask consistency/P95，並交 specialist confirmation。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="mode_specific_confirmation" data-renderer-art="image_text_or_diffusion" data-primitive="yoloe_mode_confirmation" data-semantic-scene="yoloe_mode_confirmation" data-semantic-entities="mode_output|raw_evidence|confirmation_gate" data-specialist-coverage="mode_output|raw_evidence|confirmation_gate" data-semantic-relation="confirm each output mode against the declared evidence" data-must-show="box path 有 NMS/inverse ROI | mask path 有 postprocess/inverse map | 兩者各進不同 metrics 與 specialist" data-not-claim="選一張漂亮輸出不能代表所有 modes 可用。"><title>每個 mode 分開回映與確認</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="yoloe-separate-mode-confirmation"><rect x="82.8" y="95.0" width="86.24000000000001" height="39.52" fill="none" stroke="#1769E0" stroke-width="3"/><rect x="267.59999999999997" y="159.48000000000002" width="20.88" height="20.88" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><rect x="290.47999999999996" y="159.48000000000002" width="20.88" height="20.88" rx="2" fill="#F38B00" stroke="#0AA6D8" stroke-width="1"/><rect x="313.35999999999996" y="159.48000000000002" width="20.88" height="20.88" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><rect x="267.59999999999997" y="182.36" width="20.88" height="20.88" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><rect x="290.47999999999996" y="182.36" width="20.88" height="20.88" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><rect x="313.35999999999996" y="182.36" width="20.88" height="20.88" rx="2" fill="#DCEBFF" stroke="#0AA6D8" stroke-width="1"/><line x1="181.36" y1="113.72" x2="477.0400000000001" y2="115.8" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="366.15999999999997" y1="178.20000000000002" x2="477.0400000000001" y2="163.64" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><path d="M526.32 88.75999999999999h73.92l-21.560000000000002 29.120000000000005v45.76l-21.560000000000002 29.120000000000005h-73.92z" fill="#FFF4CC" stroke="#F38B00" stroke-width="3"/><line x1="612.5600000000001" y1="140.76" x2="637.1999999999999" y2="140.76" stroke="#F38B00" stroke-width="4" marker-end="url(#arrow-orange)"/><circle cx="637.1999999999999" cy="140.76" r="12.48" fill="#F7FBFF" stroke="#D84A4A" stroke-width="3"/><text data-label-line="true" x="125.92" y="228.12" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">box + NMS</text><text data-label-line="true" x="310.71999999999997" y="228.12" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">mask + post</text><text data-label-line="true" x="563.2800000000001" y="221.88" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">separate</text><text data-label-line="true" x="563.2800000000001" y="237.22" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">metrics</text><text data-label-line="true" x="637.1999999999999" y="228.12" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#D84A4A">review</text></g></g><text x="42" y="311.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#0B2858">讀圖：每個 mode 分開回映與確認</text><text x="42" y="339.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="700" fill="#8A5600">候選先交 REVIEW／HOLD；完整邊界見圖下說明。</text></svg>