<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">文字或 exemplar 形成 prompt representation</title><desc id="desc">YOLOE 將文字 tokens 或 visual exemplar 轉成 prompt representation，與影像 features 對齊。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="text_visual_prompt_representation" data-renderer-art="image_text_or_diffusion" data-primitive="yoloe_prompt_representation" data-semantic-scene="yoloe_prompt_representation" data-semantic-entities="text_or_exemplar|prompt_vector|visual_features" data-specialist-coverage="text_or_exemplar|prompt_vector|visual_features" data-semantic-relation="form a prompt representation before matching" data-must-show="text tokens | exemplar crop 各自進 embedding path | 合流為 prompt representation" data-not-claim="不同 exemplar 或文字版本可改變要找的語意。"><title>文字或 exemplar 形成 prompt representation</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="yoloe-text-exemplar-merge"><path d="M64.32 88.75999999999999h86.24000000000001v33.28h-86.24000000000001z" fill="#E8FAFF" stroke="#1769E0" stroke-width="3"/><rect x="64.32" y="157.4" width="86.24000000000001" height="41.6" rx="8" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="3"/><path d="M72.94399999999999 187.768 L92.7792 176.952 L109.1648 184.024 L135.0368 167.8" fill="none" stroke="#93B8E8" stroke-width="3"/><rect x="87.60