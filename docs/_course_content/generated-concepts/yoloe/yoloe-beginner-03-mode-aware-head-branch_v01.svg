 y="473.25" width="17.11111111111111" height="10.75" rx="6" fill="#BCECF3" fill-opacity="0.92" stroke="#BCECF3" stroke-width="0"/><rect x="724.7777777777778" y="473.25" width="17.11111111111111" height="10.75" rx="6" fill="#8FD7E6" fill-opacity="0.92" stroke="#8FD7E6" stroke-width="0"/><rect x="748.8888888888889" y="473.25" width="17.11111111111111" height="10.75" rx="6" fill="#CDE7FF" fill-opacity="0.92" stroke="#CDE7FF" stroke-width="0"/></g><path d="M 664 241 C 664 218 902 218 902 301" fill="none" stroke="#7657C8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="550" y="206" width="230" height="33" rx="16" fill="#7657C8" stroke="#7657C8" stroke-width="0"/><text x="665.0" y="231.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">prompt representation</text><path d="M850 430 L902 430" fill="none" stroke="#7657C8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-7657C8)"/><rect x="919" y="310" width="276" height="240" rx="26" fill="#F5F1FF" stroke="#7657C8" stroke-width="4"/><text x="1057" y="356.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="25" font-weight="900" fill="#102E62" text-anchor="middle">prompt-aware</text><text x="1057" y="393.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="31" font-weight="900" fill="#7657C8" text-anchor="middle">head</text><text x="1057" y="439.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="middle">same features +</text><text x="1057" y="468.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="middle">chosen prompt</text><text x="1057" y="518.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D94B62" text-anchor="middle">then choose mode</text><path d="M 1214 376 C 1251 334 1266 331 1291 331" fill="none" stroke="#F28B00" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-F28B00)"/><path d="M 1214 484 C 1251 525 1266 530 1291 530" fill="none" stroke="#0C9B91" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-0C9B91)"/><rect x="1303" y="233" width="315" height="211" rx="24" fill="#FFF7EB" stroke="#F28B00" stroke-width="4"/><text x="1460" y="274.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#F28B00" text-anchor="middle">detection mode</text><g data-entity="yoloe_aoi_workpiece" data-contract="same raw AOI image"><clipPath id="crop-branch-box-1324-294-1030-140"><rect x="1324" y="294" width="112" height="103" rx="12"/></clipPath><g clip-path="url(#crop-branch-box-1324-294-1030-140)"><svg x="1324" y="294" width="112" height="103" viewBox="1030 140 440 365" preserveAspectRatio="xMidYMid slice"><image href="../yolo-seg/yolo-seg-beginner-01-pcb-instance-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="1324" y="294" width="112" height="103" rx="12" fill="none" stroke="#F28B00" stroke-width="3"/></g><rect x="1350" y="325" width="58" height="46" rx="7" fill="none" stroke="#F28B00" stroke-width="4"/><text x="1532" y="325.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#102E62" text-anchor="middle">candidate box</text><text x="1530" y="356.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="middle">prompt score</text><text x="1460" y="422.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D94B62" text-anchor="middle">location candidate</text><rect x="1303" y="492" width="315" height="211" rx="24" fill="#EFFAF4" stroke="#0C9B91" stroke-width="4"/><text x="1460" y="533.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" font-weight="900" fill="#0C9B91" text-anchor="middle">segmentation mode</text><g data-entity="yoloe_aoi_workpiece" data-contract="same raw AOI image"><clipPath id="crop-branch-mask-1324-553-1030-140"><rect x="1324" y="553" width="112" height="103" rx="12"/></clipPath><g clip-path="url(#crop-branch-mask-1324-553-1030-140)"><svg x="1324" y="553" width="112" height="103" viewBox="1030 140 440 365" preserveAspectRatio="xMidYMid slice"><image href="../yolo-seg/yolo-seg-beginner-01-pcb-instance-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="1324" y="553" width="112" height="103" rx="12" fill="none" stroke="#0C9B91" stroke-width="3"/></g><g data-entity="prompt_conditioned_candidate_mask"><path d="M1354.62 580.4 C1373.42 568.5, 1400.68 578.7, 1404.44 600.8 C1408.2 621.2, 1387.52 631.4, 1366.84 621.2 C1348.04 611.85, 1342.4 590.6, 1354.62 580.4Z" fill="#0C9B91" fill-opacity=".38" stroke="#0C9B91" stroke-width="5"/><rect x="1345" y="572" width="70" height="33" rx="16" fill="#0C9B91" stroke="#0C9B91" stroke-width="0"/><text x="1380.0" y="597.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="middle">mask</text></g><text x="1532" y="584.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="900" fill="#102E62" text-anchor="middle">candidate mask</text><text x="1530" y="615.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="750" fill="#52688D" text-anchor="middle">mask / contour score</text><text x="1460" y="681.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D94B62" text-anchor="middle">region candidate</text><rect x="52" y="744" width="1566" height="72" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="835" y="777.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="850" fill="#102E62" text-anchor="middle">不可平均：box 回答「哪裡值得看」；mask 回答「哪一片候選區域」；兩者都有各自的 threshold、後處理與誤差。</text><text x="835" y="804.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D94B62" text-anchor="middle">score 仍然受 prompt 與 mode 條件影響，不是缺陷的單一真值分數。</text><rect x="40" y="849" width="1592" height="52" rx="20" fill="#FFF9E7" stroke="#F2B52B" stroke-width="2"/><text x="836" y="883.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#684600" text-anchor="middle">YOLOE 的可變輸入 + mode-aware head 是主題；不能畫成一個固定類別的 YOLO dense detector。</text></svg>