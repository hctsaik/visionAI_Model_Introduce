<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">YOLOE：prompt-aware head 依 detection 或 segmentation mode 交付不同候選</title><desc id="desc">同一 features 和 prompt representation 進 prompt-aware head；detection mode 交 box and score candidates，segmentation mode 交 mask and score candidates。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-0C9B91" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0C9B91"/></marker><marker id="arrow-7657C8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7657C8"/></marker><marker id="arrow-F28B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F28B00"/></marker><marker id="arrow-D94B62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D94B62"/></marker><marker id="arrow-139A63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#139A63"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#0A2450"/><text x="42" y="99.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="35" font-weight="900" fill="#0A2450" text-anchor="start">mode 決定交付單位：框與遮罩不是同一個輸出</text><text x="42" y="147.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#52688D" text-anchor="start">同一 AOI features 加 prompt representation 進 prompt-aware head；選 detection 或 segmentation 後，要用不同的 evidence 和驗收方式。</text><rect x="1302" y="34" width="330" height="48" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1467" y="67.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" font-weight="850" fill="#1769E0" text-anchor="middle">YOLOE · PROMPT + MODE</text><text x="52" y="211.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="23" font-weight="900" fill="#102E62" text-anchor="start">same AOI + versioned prompt</text><g data-entity="yoloe_aoi_workpiece" data-contract="same raw AOI image"><clipPath id="crop-branch-aoi-52-242-286-20"><rect x="52" y="242" width="340" height="374" rx="24"/></clipPath><g clip-path="url(#crop-branch-aoi-52-242-286-20)"><svg x="52" y="242" width="340" height="374" viewBox="286 20 1170 890" preserveAspectRatio="xMidYMid slice"><image href="../yolo-seg/yolo-seg-beginner-01-pcb-instance-contract_v01.png" x="0" y="0" width="1672" height="941"/></svg></g><rect x="52" y="242" width="340" height="374" rx="24" fill="none" stroke="#1769E0" stroke-width="3"/></g><g data-entity="prompt_conditioned_candidate_box"><rect x="215" y="371" width="95" height="78" rx="8" fill="none" stroke="#F28B00" stroke-width="5"/><rect x="215" y="340" width="213" height="27" rx="9" fill="#F28B00" stroke="#F28B00" stroke-width="0"/><text x="227" y="361.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#FFFFFF" text-anchor="start">ROI · candidate</text></g><text x="222" y="658.0" font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#102E62" text-anchor="middle">same raw coordinate link</text><path d="M414 430 L478 430" fill="none" stroke="#1769E0" stroke-width="6" stroke-linecap="round" 