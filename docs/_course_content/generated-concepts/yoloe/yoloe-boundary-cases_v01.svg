<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">YOLOE 的反事實與 HOLD 說明圖</title>
  <desc id="desc">三個模型專屬反事實卡片，分別呈現條件被破壞時的可觀察結果和安全的 HOLD 或重驗下一步。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0B3068" flood-opacity=".12"/></filter>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker>
    <marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker>
    <style>text { dominant-baseline: alphabetic; } .fine { fill:#536A91; font-size:18px; }</style>
  </defs>
  <rect width="1672" height="941" fill="#F5F8FE"/>
  <rect x="40" y="32" width="150" height="32" rx="16" fill="#E6F0FF"/><text x="58" y="54.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="16" font-weight="800" fill="#1769E0">反事實與安全邊界</text><text x="40" y="116" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="43" font-weight="900" fill="#071A3B">同一條因果鏈，會在哪裡被破壞？</text><text x="40" y="182" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="500" fill="#50698F">不是多背三個風險名詞；要能預測畫面可能怎麼變，並選擇安全的下一步。</text><text x="1630" y="57.0" text-anchor="end" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="800" fill="#5C7395">YOLOE</text><rect x="77" y="260" width="478" height="516" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><circle cx="121" cy="306" r="25" fill="#D84A4A"/><text x="121" y="314.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">1</text><text x="159" y="313" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">prompt drift、text</text><text x="159" y="342" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">template/vocabulary 改變或 visual</text><text x="159" y="371" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">exemplar bias</text><g data-visual-cue="prompt_exemplar_drift" data-renderer-art="image_text_or_diffusion" data-primitive="text_prompt_embedding" data-semantic-scene="text_prompt_embedding" data-semantic-entities="prompt_text|text_encoder|text_vector" data-specialist-coverage="prompt_text|text_encoder|text_vector" data-semantic-relation="make a declared text representation" data-must-show="phrase/template 更新 | 兩張不同 exemplar | candidate shift 前 | 對比" data-not-claim="同名 prompt 不表示相同 representation。"><title>文字 drift 或 exemplar bias</title><rect x="105" y="390" width="422" height="98" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="single-text-prompt-embedding"><path d="M142.12 428.78h75.60000000000001v16.400000000000002h-75.60000000000001z" fill="#E8FAFF" stroke="#1769E0" stroke-width="3"/><line x1="225.28000000000003" y1="437.8" x2="281.98" y2="437.8" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="285.76000000000005" y="425.5" width="52.92" height="24.599999999999998" rx="6" fill="#F7FBFF" stroke="#0AA6D8" stroke-width="3"/><line x1="346.24" y1="437.8" x2="410.5" y2="437.8" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="410.5" y1="428.78" x2="455.86" y2="428.78" stroke="#F38B00" stroke-width="4"/><line x1="410.5" y1="436.98" x2="455.86" y2="436.98" stroke="#F38B00" stroke-width="4"/><line x1="410.5" y1="445.18" x2="455.86" y2="445.18" stroke="#F38B00" stroke-width="4"/><text data-label-line="true" x="179.92000000000002" y="477.98" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">prompt</text><text data-label-line="true" x="312.22" y="477.98" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">text encoder</text><text data-label-line="true" x="433.18" y="477.98" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">vector</text></g></g><text x="105" y="520.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#F38B00">可能看到</text><text x="105" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">prompt representation 改變，候選</text><text x="105" y="570" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">boxes/masks/scores 可能偏向不同外</text><text x="105" y="592" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">觀或失去穩定性。</text><line x1="105" y1="646" x2="527" y2="646" stroke="#D6E7FF" stroke-width="2"/><text x="105" y="675.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#1769E0">正確下一步</text><text x="105" y="703" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">版本化 prompt source/ID/embedding，</text><text x="105" y="725" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">分開量 text/visual recall、prompt</text><text x="105" y="747" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">stability 與專家確認率。</text><rect x="597" y="260" width="478" height="516" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><circle cx="641" cy="306" r="25" fill="#F38B00"/><text x="641" y="314.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">2</text><text x="679" y="313" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">detection/segmentation mode 混用，</text><text x="679" y="342" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">或 threshold、NMS、mask</text><text x="679" y="371" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">postprocess、inverse mapping 未鎖</text><g data-visual-cue="mode_postprocess_mismatch" data-renderer-art="image_text_or_diffusion" data-primitive="declared_mode_postprocess_mismatch" data-semantic-scene="declared_mode_postprocess_mismatch" data-semantic-entities="declared_input|declared_operation|candidate_or_gate" data-specialist-coverage="declared_input|declared_operation|candidate_or_gate" data-semantic-relation="show the authored operation before action" data-must-show="box | mask | score 三張不同形狀卡被錯誤堆疊後打叉 | 旁有各自 threshold/NMS/mask processing" data-not-claim="不同 mode 的 metric、ROI 和 inverse mapping 不可混用。"><title>mode/postprocess 混用</title><rect x="625" y="390" width="422" height="98" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="724.49" y1="440.26" x2="815.21" y2="440.26" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="856.79" y1="440.26" x2="943.73" y2="440.26" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="declared_input" data-entity-label-full="input"><path d="M703.7 428.55039999999997L714.032 434.7496L714.032 445.7704L703.7 451.9696L693.368 445.7704L693.368 434.7496z" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><text data-label-line="true" x="703.7" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">input</text></g><g data-entity="declared_operation" data-entity-label-full="operation"><rect x="823.6016" y="431.65" width="8.61" height="17.22" rx="5" fill="#EAF3FF" stroke="#0AA6D8" stroke-width="3"/><rect x="839.444" y="431.65" width="8.61" height="17.22" rx="5" fill="#E8FAFF" stroke="#0AA6D8" stroke-width="3"/><line x1="834.278" y1="440.26" x2="838.4108" y2="440.26" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><text data-label-line="true" x="836.0" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">operation</text></g><g data-entity="candidate_or_gate" data-entity-label-full="candidate"><path d="M964.52 427.8616L976.2296 440.26L964.52 452.6584L952.8104 440.26z" fill="#FFF4CC" stroke="#F38B00" stroke-width="3"/><circle cx="964.52" cy="440.26" r="3.0995999999999997" fill="#F38B00"/><text data-label-line="true" x="964.52" y="461.9572" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">candidate</text></g><g data-relation="show the authored operation before action"><rect x="658.34" y="472.24" width="192" height="10.66" rx="4.92" fill="#EAF3FF" stroke="#9FC4FF" stroke-width="2"/><text data-label-line="true" x="754.34" y="473.78999999999996" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">declared</text><text data-label-line="true" x="754.34" y="489.12999999999994" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0B2858">mode po</text></g></g><text x="625" y="520.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#F38B00">可能看到</text><text x="625" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">box、mask、score 被錯當成同一粒度，</text><text x="625" y="570" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">邊界/定位差異無法重播，mask</text><text x="625" y="592" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">inconsistency 被隱藏。</text><line x1="625" y1="646" x2="1047" y2="646" stroke="#D6E7FF" stroke-width="2"/><text x="625" y="675.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#1769E0">正確下一步</text><text x="625" y="703" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">量 box recall、mask consistency、</text><text x="625" y="725" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">tiny/localization errors 和 P95。</text><rect x="1117" y="260" width="478" height="516" rx="24" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2" filter="url(#shadow)"/><circle cx="1161" cy="306" r="25" fill="#1769E0"/><text x="1161" y="314.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">3</text><text x="1199" y="313" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">把 text/visual prompt candidate 視</text><text x="1199" y="342" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">為製程證據、defect truth 或</text><text x="1199" y="371" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="23" font-weight="900" fill="#0B2858">release</text><g data-visual-cue="prompt_candidate_not_evidence" data-renderer-art="image_text_or_diffusion" data-primitive="text_prompt_embedding" data-semantic-scene="text_prompt_embedding" data-semantic-entities="prompt_text|text_encoder|text_vector" data-specialist-coverage="prompt_text|text_encoder|text_vector" data-semantic-relation="make a declared text representation" data-must-show="raw AOI | prompt/mode | output | postprocess/inverse ROI | review result 形成 evidence packet | PASS shortcut 被擋住" data-not-claim="text/visual prompt output 不能直接作 release。"><title>prompt candidate 不是製程證據</title><rect x="1145" y="390" width="422" height="98" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="single-text-prompt-embedding"><path d="M1182.1200000000001 428.78h75.60000000000001v16.400000000000002h-75.60000000000001z" fill="#E8FAFF" stroke="#1769E0" stroke-width="3"/><line x1="1265.28" y1="437.8" x2="1321.98" y2="437.8" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="1325.76" y="425.5" width="52.92" height="24.599999999999998" rx="6" fill="#F7FBFF" stroke="#0AA6D8" stroke-width="3"/><line x1="1386.24" y1="437.8" x2="1450.5" y2="437.8" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="1450.5" y1="428.78" x2="1495.8600000000001" y2="428.78" stroke="#F38B00" stroke-width="4"/><line x1="1450.5" y1="436.98" x2="1495.8600000000001" y2="436.98" stroke="#F38B00" stroke-width="4"/><line x1="1450.5" y1="445.18" x2="1495.8600000000001" y2="445.18" stroke="#F38B00" stroke-width="4"/><text data-label-line="true" x="1219.92" y="477.98" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#1769E0">prompt</text><text data-label-line="true" x="1352.22" y="477.98" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#0AA6D8">text encoder</text><text data-label-line="true" x="1473.18" y="477.98" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="13.0" font-weight="800" fill="#F38B00">vector</text></g></g><text x="1145" y="520.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#F38B00">可能看到</text><text x="1145" y="548" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">小物、prompt/exemplar 偏差、mask</text><text x="1145" y="570" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">不一致和語意不確定被跳過，造成高風</text><text x="1145" y="592" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">險錯誤決策。</text><line x1="1145" y1="646" x2="1567" y2="646" stroke="#D6E7FF" stroke-width="2"/><text x="1145" y="675.0" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="18" font-weight="900" fill="#1769E0">正確下一步</text><text x="1145" y="703" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">保存 raw image、prompt/mode、</text><text x="1145" y="725" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">outputs、postprocess/inverse ROI</text><text x="1145" y="747" text-anchor="start" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B2858">和 review result。</text><rect x="77" y="816" width="1518" height="63" rx="20" fill="#FFF4CC" stroke="#F1B828"/><text x="836" y="855.0" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="800" fill="#674500">任一條件超出 qualification envelope：先停在 HOLD／REVIEW，保存 raw evidence 與版本，再決定怎麼重驗。</text>
</svg>