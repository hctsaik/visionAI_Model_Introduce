<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">造可追溯練習題</title><desc id="desc">DRAEM 以 Perlin mask、外部 texture 和混合規則從正常 ROI 造出可追溯的合成異常對。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="input_roi_draem_synthetic_corruption_pair" data-renderer-art="input_roi" data-primitive="synthetic_corruption_pair" data-semantic-scene="synthetic_corruption_pair" data-semantic-entities="clean_roi|synthetic_corruption|training_pair" data-specialist-coverage="clean_roi|synthetic_corruption|training_pair" data-semantic-relation="create a declared synthetic training pair" data-must-show="clean normal ROI | Perlin mask | source texture/noise | corrupted I_a 與 synthetic mask M_a 的成對輸出" data-not-claim="synthetic anomaly 就是現場真實缺陷分布。"><title>造可追溯練習題</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><g data-primitive="draem-clean-synthetic-corruption-pair"><rect x="95.11999999999998" y="95.0" width="98.56" height="74.88" rx="8" fill="#EAF3FF" stroke="#1769E0" stroke-width="3"/><path d="M104.97599999999997 149.6624 L127.64479999999998 130.1936 L146.3712 142.9232 L175.93919999999997 113.72" fill="none" stroke="#93B8E8" stroke-width="3"/><line x1="212.15999999999997" y1="134.51999999999998" x2="286.08" y2="134.51999999999998" stroke="#F38B00" stroke-width="4" marker-end="url(#arrow-orange)"/><rect x="298.4" y="9