"#8254E3" fill-opacity="0.65" stroke="#8254E3" stroke-width="1"/><rect x="1526.8" y="568.0" width="34.6" height="13.5" rx="5" fill="#B9D5F7" stroke="#1769E0" stroke-width="1"/><rect x="1378.0" y="586.5" width="34.6" height="13.5" rx="5" fill="#B9D5F7" stroke="#1769E0" stroke-width="1"/><rect x="1415.2" y="586.5" width="34.6" height="13.5" rx="5" fill="#B9D5F7" stroke="#1769E0" stroke-width="1"/><rect x="1452.4" y="586.5" width="34.6" height="13.5" rx="5" fill="#B9D5F7" stroke="#1769E0" stroke-width="1"/><rect x="1489.6" y="586.5" width="34.6" height="13.5" rx="5" fill="#8254E3" fill-opacity="0.65" stroke="#8254E3" stroke-width="1"/><rect x="1526.8" y="586.5" width="34.6" height="13.5" rx="5" fill="#B9D5F7" stroke="#1769E0" stroke-width="1"/><text x="1471.0" y="624.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#8254E3" text-anchor="middle">Mₐ trains</text></g><rect x="60" y="718" width="1525" height="96" rx="22" fill="#FFF1F3" stroke="#D9485F" stroke-width="2"/><text x="91" y="755.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="22" font-weight="900" fill="#D9485F" text-anchor="start">硬 gate</text><text x="91" y="786.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="800" fill="#081A38" text-anchor="start">不要把 Iₐ 當真實 defect、把 Mₐ 當產線 ground truth，或用 synthetic IoU 取代 real holdout 的 escape／false-HOLD evidence。</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF5D4" stroke="#E4AA1D" stroke-width="2"/><circle cx="79" cy="875" r="12" fill="#FFE295" stroke="#C98700" stroke-width="2"/><text x="79" y="882.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#805300" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#654600" text-anchor="start">DRAEM 的 simulator 是模型狀態：配方、來源、mask、blend、seed 或 augmentation 改變後，synthetic-to-real qualification 必須重做。</text></svg>