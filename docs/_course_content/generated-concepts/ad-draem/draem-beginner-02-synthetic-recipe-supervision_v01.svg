<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">DRAEM：synthetic recipe、I_a、M_a 與訓練 supervision</title><desc id="desc">clean normal carrier 以可追溯 texture、mask、blend、seed 配方生成 I_a 和 M_a；I_a 供 reconstruction 和 joint discriminator 訓練，M_a 僅是訓練 label，不能當真實 defect truth。</desc><defs><marker id="arrow-1769E0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1769E0"/></marker><marker id="arrow-00A8C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00A8C6"/></marker><marker id="arrow-8254E3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8254E3"/></marker><marker id="arrow-F38B00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F38B00"/></marker><marker id="arrow-D9485F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D9485F"/></marker><marker id="arrow-149A62" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#149A62"/></marker></defs><rect width="1672" height="941" fill="#F5F9FF"/><rect width="1672" height="8" fill="#0A2A5B"/><rect x="40" y="30" width="210" height="44" rx="22" fill="#F3EEFF" stroke="#8254E3" stroke-width="2"/><text x="145" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#8254E3" text-anchor="middle">訓練關係</text><rect x="1320" y="30" width="312" height="44" rx="22" fill="#FFFFFF" stroke="#9FC4FF" stroke-width="2"/><text x="1476" y="59.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="19" font-weight="900" fill="#8254E3" text-anchor="middle">DRAEM</text><text x="40" y="123.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="38" font-weight="900" fill="#081A38" text-anchor="start">synthetic corruption 與 synthetic mask 是『訓練監督』，不是產線真實缺陷</text><text x="40" y="166.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="21" font-weight="600" fill="#536A91" text-anchor="start">normal-only carrier 依可回放的 texture、Perlin／shape mask、opacity、blend、seed 產生 Iₐ 與 Mₐ；它們必須被版本化與真實資料反證。</text><g data-entity="draem_ceramic_carrier_aoi"><clipPath id="photo-recipe-clean-60-255"><rect x="60" y="255" width="330" height="366" rx="22"/></clipPath><g clip-path="url(#photo-recipe-clean-60-255)"><image href="draem-industrial-carrier-anchor_v02.png" x="60" y="255" width="330" height="366" preserveAspectRatio="xMidYMid slice"/></g><rect x="60" y="255" width="330" height="366" rx="22" fill="none" stroke="#149A62" stroke-width="3"/><text x="225.0" y="650.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#081A38" text-anchor="middle">clean normal target x</text></g><path d="M413 438 L480 438" fill="none" stroke="#8254E3" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-8254E3)"/><rect x="504" y="242" width="396" height="392" rx="27" fill="#FFFFFF" stroke="#8254E3" stroke-width="3"/><text x="702" y="291.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="27" font-weight="900" fill="#081A38" text-anchor="middle">versioned synthetic recipe</text><circle cx="560" cy="357" r="11" fill="#8254E3"/><text x="587" y="365.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#081A38" text-anchor="start">texture / noise provenance</text><circle cx="560" cy="412" r="11" fill="#F38B00"/><text x="587" y="420.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#081A38" text-anchor="start">Perlin / shape mask</text><circle cx="560" cy="467" r="11" fill="#00A8C6"/><text x="587" y="475.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#081A38" text-anchor="start">geometry / color transform</text><circle cx="560" cy="522" r="11" fill="#1769E0"/><text x="587" y="530.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#081A38" text-anchor="start">opacity / blend / seed</text><text x="702" y="594.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="850" fill="#D9485F" text-anchor="middle">simulator state—not decoration</text><path d="M925 438 L985 438" fill="none" stroke="#8254E3" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-8254E3)"/><g data-entity="draem_synthetic_training_corruption"><clipPath id="synthetic-recipe-1008-260"><rect x="1008" y="260" width="284" height="202" rx="18"/></clipPath><g clip-path="url(#synthetic-recipe-1008-260)"><image href="draem-industrial-carrier-anchor_v02.png" x="1008" y="260" width="284" height="202" preserveAspectRatio="xMidYMid slice"/><path d="M1070.48 306.46 C1130.12 266.06, 1203.96 314.54, 1215.32 358.98 C1235.2 405.44, 1135.8 433.72, 1073.32 391.3 C1027.88 358.98, 1033.56 328.68, 1070.48 306.46Z" fill="#D75CEC" fill-opacity=".54" stroke="#F38B00" stroke-width="4"/><path d="M1076.16 330.7 L1110.24 401.4" fill="none" stroke="#FFE38D" stroke-width="3" stroke-linecap="round"/><path d="M1098.88 330.7 L1132.96 401.4" fill="none" stroke="#FFE38D" stroke-width="3" stroke-linecap="round"/><path d="M1121.6000000000001 330.7 L1155.68 401.4" fill="none" stroke="#FFE38D" stroke-width="3" stroke-linecap="round"/><path d="M1144.3200000000002 330.7 L1178.4 401.4" fill="none" stroke="#FFE38D" str