<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">辨別器同看原圖與重建</title><desc id="desc">DRAEM 的辨別式 segmentation network 同看原圖與重建，對合成異常 mask 學習候選圖。</desc><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#1769E0"/></marker><marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#0AA6D8"/></marker><marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 10 6 L 0 11 z" fill="#F38B00"/></marker></defs><rect width="720" height="360" fill="#F5F8FE"/><g data-visual-cue="condition_map_draem_joint_discriminator" data-renderer-art="image_text_or_diffusion" data-primitive="draem_joint_discriminator" data-semantic-scene="draem_joint_discriminator" data-semantic-entities="raw_image|reconstruction|discriminator" data-specialist-coverage="raw_image|reconstruction|discriminator" data-semantic-relation="let the discriminator inspect raw image and reconstruction together" data-must-show="I_a 與 I_r 並排 | joint representation 交會 | discriminative segmentation network | synthetic anomaly map" data-not-claim="DRAEM 只在做 pixel residual。"><title>辨別器同看原圖與重建</title><rect x="30" y="28" width="660" height="238" rx="16" fill="#F7FBFF" stroke="#C7DDFF" stroke-width="2"/><line x1="165.95999999999998" y1="101.24000000000001" x2="532.4799999999999" y2="132.44" stroke="#1769E0" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="381.56" y1="159.48000000000002" x2="532.4799999999999" y2="132.44" stroke="#0AA6D8" stroke-width="4" marker-end="url(#arrow-blue)"/><g data-entity="raw_image" data-entity-label-full="raw"><rect x="108.99770114942527" y="75.75034482758622" width="70.80459770114943" height="48.14712643678162" rx="8" fill="#EAF3FF" stroke="