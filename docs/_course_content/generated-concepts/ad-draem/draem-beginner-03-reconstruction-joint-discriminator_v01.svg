ns-serif" font-size="18" font-weight="850" fill="#D9485F" text-anchor="start">M_pred 是 candidate map，不是 raw residual、native defect mask、defect probability 或 PASS。</text><rect x="40" y="850" width="1592" height="50" rx="18" fill="#FFF5D4" stroke="#E4AA1D" stroke-width="2"/><circle cx="79" cy="875" r="12" fill="#FFE295" stroke="#C98700" stroke-width="2"/><text x="79" y="882.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="900" fill="#805300" text-anchor="middle">!</text><text x="110" y="883.0" font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" font-size="18" font-weight="800" fill="#654600" text-anchor="start">若把 DRAEM 簡化成純 AE residual，就會遺漏 synthetic supervision 與 discriminative segmentation 這兩個模型身分。</text></svg>