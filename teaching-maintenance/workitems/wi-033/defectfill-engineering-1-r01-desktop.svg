<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">DefectFill：合成資料先核對再加入</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">少量真缺陷及人工遮罩</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.55)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><rect x="135.0" y="164.0" width="80" height="40" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/><line x1="143.0" y1="197.0" x2="207.0" y2="171.0" stroke="#253846" stroke-width="5"/><line x1="148.0" y1="201.0" x2="212.0" y2="173.0" stroke="white" stroke-width="2"/></g><g transform="translate(280,20) scale(0.55)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/></g><text x="20" y="204" font-size="26" fill="#1765CA" font-weight="500" text-anchor="start">訓練／參考來源</text><text x="280" y="204" font-size="26" fill="#238854" font-weight="500" text-anchor="start">真實留出另存</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">真刮傷與mask配對，底圖另存</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">參考用過的工件不再算獨立測試</text></g></g><line x1="543" y1="388" x2="567" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="567.0,388.0 553.0,381.0 553.0,395.0" fill="#1765CA"/><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同板指定位置產生刮傷</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,25) scale(0.55)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><rect x="135.0" y="164.0" width="80" height="40" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/></g><line x1="229" y1="90" x2="273" y2="90" stroke="#1765CA" stroke-width="5"/><polygon points="273.0,90.0 259.0,83.0 259.0,97.0" fill="#1765CA"/><g transform="translate(280,25) scale(0.55)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><rect x="135.0" y="164.0" width="80" height="40" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/><line x1="143.0" y1="197.0" x2="207.0" y2="171.0" stroke="#253846" stroke-width="5"/><line x1="148.0" y1="201.0" x2="212.0" y2="173.0" stroke="white" stroke-width="2"/></g><text x="20" y="200" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">正常圖＋下方遮罩</text><text x="280" y="200" font-size="27" fill="#CE7917" font-weight="500" text-anchor="start">合成刮傷</text><text x="20" y="278" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">已學缺陷條件 → 多步去噪</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同一雙孔板，下方區域填傷</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">mask指定位置，仍需核對結果</text></g></g><line x1="1098" y1="388" x2="1122" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="1122.0,388.0 1108.0,381.0 1108.0,395.0" fill="#1765CA"/><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">檢查後納入訓練資料</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.7)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><rect x="135.0" y="164.0" width="80" height="40" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/><line x1="143.0" y1="197.0" x2="207.0" y2="171.0" stroke="#253846" stroke-width="5"/><line x1="148.0" y1="201.0" x2="212.0" y2="173.0" stroke="white" stroke-width="2"/></g><text x="310" y="73" font-size="29" fill="#238854" font-weight="500" text-anchor="start">位置</text><text x="310" y="127" font-size="29" fill="#238854" font-weight="500" text-anchor="start">材質</text><text x="310" y="181" font-size="29" fill="#238854" font-weight="500" text-anchor="start">孔位</text><line x1="170" y1="209" x2="170" y2="245" stroke="#1765CA" stroke-width="5"/><polygon points="170.0,245.0 177.0,231.0 163.0,231.0" fill="#1765CA"/><rect x="25" y="260" width="430" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="240.0" y="290" font-size="26" fill="white" font-weight="700" text-anchor="middle">合成圖＋核對後標註 → 訓練</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">來源、遮罩與版本一起保存</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">效益交真實留出集檢驗</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">合成圖供訓練增補，真實留出集負責驗收。</text></svg>