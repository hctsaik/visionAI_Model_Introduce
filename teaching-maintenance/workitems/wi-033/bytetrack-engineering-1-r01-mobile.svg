<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">ByteTrack：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">跨幀接身份，計數另定義</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">偵測器交每幀框與分數</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,45) scale(1)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="65" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/><text x="85" y="104" font-size="47" fill="#172B43" font-weight="700" text-anchor="start">L</text></g><rect x="284" y="85" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/><rect x="76" y="80" width="92" height="95" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><rect x="280" y="80" width="92" height="95" rx="0" fill="none" stroke="#1765CA" stroke-width="2"/><text x="72" y="28" font-size="28" fill="#CE7917" font-weight="700" text-anchor="start">低分 .3</text><text x="278" y="28" font-size="28" fill="#1765CA" font-weight="700" text-anchor="start">高分 .9</text><rect x="110" y="45" width="33" height="76" rx="0" fill="#A2ACB3" stroke="#748A9C" stroke-width="2"/><text x="25" y="263" font-size="29" fill="#CE7917" font-weight="700" text-anchor="start">ID7處短暫遮擋 → 低分框</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">偵測器先出框與分數</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">分數為給定例，不是門檻建議</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">高低兩輪續接身份</text><g transform="translate(8,66) scale(0.965)"><text x="20" y="30" font-size="28" fill="#1765CA" font-weight="700" text-anchor="start">第一輪：高分框配現有軌跡</text><rect x="25" y="52" width="72" height="67" rx="0" fill="none" stroke="#238854" stroke-width="2"/><rect x="32" y="58" width="72" height="67" rx="0" fill="none" stroke="#1765CA" stroke-width="2"/><line x1="125" y1="83" x2="220" y2="83" stroke="#1765CA" stroke-width="5"/><polygon points="220.0,83.0 206.0,76.0 206.0,90.0" fill="#1765CA"/><text x="240" y="91" font-size="29" fill="#238854" font-weight="700" text-anchor="start">已配對</text><text x="20" y="168" font-size="28" fill="#CE7917" font-weight="700" text-anchor="start">第二輪：剩餘軌跡配低分框</text><rect x="25" y="190" width="72" height="67" rx="0" fill="none" stroke="#238854" stroke-width="2"/><rect x="32" y="196" width="72" height="67" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="47" y="240" font-size="35" fill="#172B43" font-weight="700" text-anchor="start">L</text><line x1="125" y1="223" x2="220" y2="223" stroke="#1765CA" stroke-width="5"/><polygon points="220.0,223.0 206.0,216.0 206.0,230.0" fill="#1765CA"/><text x="240" y="234" font-size="29" fill="#238854" font-weight="700" text-anchor="start">續接ID7</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">先高再低，低分仍需位置依據</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">孤立低分框不直接產生新ID</text></g></g><line x1="384.0" y1="1461.0" x2="384.0" y2="1478.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1478.0 391.0,1464.0 377.0,1464.0" fill="#1765CA"/><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">ID7越線由下游記一次</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.95)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="250" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/><text x="270" y="104" font-size="47" fill="#172B43" font-weight="700" text-anchor="start">L</text></g><line x1="240" y1="20" x2="240" y2="177" stroke="#CE7917" stroke-width="4"/><line x1="167" y1="115" x2="287" y2="115" stroke="#238854" stroke-width="5"/><polygon points="287.0,115.0 273.0,108.0 273.0,122.0" fill="#238854"/><text x="250" y="220" font-size="29" fill="#238854" font-weight="700" text-anchor="start">ID7已跨線</text><text x="25" y="290" font-size="26" fill="#1765CA" font-weight="700" text-anchor="start">下游記錄：ID7／方向／時間</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">跨線事件需另定重複政策</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">框或ID數量不直接等於通過件數</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">框先偵測，ID靠配對，過線再計數。</text></svg>