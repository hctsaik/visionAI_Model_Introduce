<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">Deblur：速度、細節和假邊一起驗</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">保存解析度、曝光與模型</text><g transform="translate(8,66) scale(0.965)"><rect x="30" y="10" width="430" height="282" rx="9" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="48" y="48" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">原觀測</text><text x="48" y="82" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">解析度／曝光／運動／對焦</text><text x="48" y="126" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">復原模型</text><text x="48" y="160" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">訓練退化與checkpoint</text><text x="48" y="204" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">比較方式</text><text x="48" y="238" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">同位置清晰參考＋邊緣誤差</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">模型與實際退化條件需對應</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">不只比重建圖的視覺銳利度</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">逐位置比較邊緣偏移</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(1.55)"><rect x="0" y="0" width="190" height="140" rx="3" fill="#23313E" stroke="#73899E" stroke-width="2"/><rect x="0" y="0" width="95" height="140" rx="0" fill="url(#steel)" stroke="none" stroke-width="2"/></g><line x1="167" y1="10" x2="167" y2="253" stroke="#238854" stroke-width="4"/><line x1="188" y1="10" x2="188" y2="253" stroke="#CE7917" stroke-width="4"/><text x="220" y="238" font-size="29" fill="#CE7917" font-weight="500" text-anchor="start">差2像素</text><text x="20" y="294" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">給定：真邊100，估計102</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同座標比位置，不能只比斜率</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">示意像素未校正，不是毫米</text></g></g><line x1="384.0" y1="1461.0" x2="384.0" y2="1478.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1478.0 391.0,1464.0 377.0,1464.0" fill="#1765CA"/><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">端到端延遲與錯誤一起看</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(1)"><rect x="0" y="0" width="190" height="140" rx="3" fill="#23313E" stroke="#73899E" stroke-width="2"/><rect x="0" y="0" width="95" height="140" rx="0" fill="url(#steel)" stroke="none" stroke-width="2"/><rect x="88" y="0" width="8" height="140" rx="0" fill="white" stroke="none" stroke-width="2"/><rect x="108" y="0" width="7" height="140" rx="0" fill="#06121A" stroke="none" stroke-width="2"/><rect x="123" y="0" width="5" height="140" rx="0" fill="#657A88" stroke="none" stroke-width="2"/></g><g transform="translate(280,20) scale(1)"><rect x="0" y="0" width="190" height="140" rx="3" fill="#23313E" stroke="#73899E" stroke-width="2"/><rect x="0" y="0" width="95" height="140" rx="0" fill="url(#steel)" stroke="none" stroke-width="2"/></g><text x="20" y="201" font-size="28" fill="#CE7917" font-weight="500" text-anchor="start">假邊／偏移</text><text x="280" y="201" font-size="27" fill="#238854" font-weight="500" text-anchor="start">獨立清晰圖</text><text x="20" y="278" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">同硬體：總延遲＋邊緣誤差</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">取像、傳輸與前後處理一起計時</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">快或清晰都不能單獨代表可量測</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">按實際曝光與運動條件驗完整流程。</text></svg>