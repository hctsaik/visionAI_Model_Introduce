<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">YOLO-Seg：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">共用原型，每件用不同係數</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">共享特徵產生原型圖</text><g transform="translate(8,66) scale(0.965)"><rect x="15.0" y="47.0" width="26.0" height="26.0" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="43.0" y="47.0" width="26.0" height="26.0" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="71.0" y="47.0" width="26.0" height="26.0" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="99.0" y="47.0" width="26.0" height="26.0" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="15.0" y="75.0" width="26.0" height="26.0" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="43.0" y="75.0" width="26.0" height="26.0" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="71.0" y="75.0" width="26.0" height="26.0" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="99.0" y="75.0" width="26.0" height="26.0" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/