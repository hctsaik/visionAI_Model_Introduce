<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">PaDiM：同位置的方向，改變距離</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">p與q分別累積正常分布</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,15) scale(0.57)"><rect x="0" y="0" width="350" height="225" rx="8" fill="url(#steel)" stroke="#748A9C" stroke-width="2"/><circle cx="68" cy="65" r="35" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><rect x="247" y="94" width="65" height="58" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="318" y="124" font-size="31" fill="#CE7917" font-weight="700" text-anchor="start">p</text></g><g transform="translate(270,15) scale(0.57)"><rect x="0" y="0" width="350" height="225" rx="8" fill="url(#steel)" stroke="#748A9C" stroke-width="2"/><circle cx="68" cy="65" r="35" fill="white" stroke="#748A9C" strok