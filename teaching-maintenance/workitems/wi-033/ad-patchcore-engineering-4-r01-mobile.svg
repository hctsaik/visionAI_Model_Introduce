<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">PatchCore：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">庫裡混入刮傷，就可能漏報</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同板刮傷p保持不變</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(40,20) scale(1.1)"><rect x="0" y="0" width="350" height="225" rx="8" fill="url(#steel)" stroke="#748A9C" stroke-width="2"/><circle cx="13" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><line x1="266" y1="133" x2="300" y2="103" stroke="#34424B" stroke-width="6"/><line x1="260" y1="142" x2="286" y2="122" stroke="#EDF2F6" stroke-width="3"/><rect x="247" y="94" width="65" height="58" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="318" y="124" font-size="31" fill="#CE7917" font-weight="700" text-anchor="start">p</text></g><text x="30" y="308" font-size="30" fill="#1765CA" font-weight="700" text-anchor="start">同一工件A，追刮傷位置p</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">保持孔位、位置與允收定義</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">候選方案共用同一工作題目</text></g></g><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">正常代表與p仍有距離</text><g transform="translate(8,66) scale(0.965)"><text x="20" y="45" font-size="34" fill="#CE7917" font-weight="700" text-anchor="start">待測p = [3, 2]</text><rect x="20" y="80" width="220" height="72" rx="6" fill="white" stroke="#1765CA" stroke-width="2"/><text x="32" y="110" font-size="25" fill="#1765CA" font-weight="700" text-anchor="start">r1 = [0, 0]</text><text x="32" y="140" font-size="27" fill="#1765CA" font-weight="500" text-anchor="start">√13 ≈ 3.61</text><rect x="260" y="80" width="220" height="72" rx="6" fill="white" stroke="#238854" stroke-width="2"/><text x="272" y="110" font-size="25" fill="#238854" font-weight="700" text-anchor="start">r2 = [2, 0]</text><text x="272" y="140" font-size="27" fill="#238854" font-weight="500" text-anchor="start">√5 ≈ 2.24</text><line x1="244" y1="185" x2="244" y2="222" stroke="#1765CA" stroke-width="5"/><polygon points="244.0,222.0 251.0,208.0 237.0,208.0" fill="#1765CA"/><rect x="40" y="233" width="410" height="65" rx="8" fill="#EDF8F0" stroke="#238854" stroke-width="2"/><text x="58" y="276" font-size="29" fill="#238854" font-weight="700" text-anchor="start">最近是r2：局部距離2.24</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">在同一特徵空間找最近鄰</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">二維算例，非像素相減</text></g></g><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">若把同刮傷加入正常庫</text><g transform="translate(8,66) scale(0.965)"><text x="15" y="40" font-size="31" fill="#C6473D" font-weight="700" text-anchor="start">誤存刮傷 [3, 2] 為正常</text><g transform="translate(15,78) scale(0.5)"><rect x="0" y="0" width="350" height="225" rx="8" fill="url(#steel)" stroke="#748A9C" stroke-width="2"/><circle cx="13" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><line x1="266" y1="133" x2="300" y2="103" stroke="#34424B" stroke-width="6"/><line x1="260" y1="142" x2="286" y2="122" stroke="#EDF2F6" stroke-width="3"/><rect x="247" y="94" width="65" height="58" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="318" y="124" font-size="31" fill="#CE7917" font-weight="700" text-anchor="start">p</text></g><line x1="210" y1="126" x2="256" y2="126" stroke="#C6473D" stroke-width="5"/><polygon points="256.0,126.0 242.0,119.0 242.0,133.0" fill="#C6473D"/><rect x="266" y="88" width="220" height="72" rx="6" fill="white" stroke="#C6473D" stroke-width="2"/><text x="278" y="118" font-size="25" fill="#C6473D" font-weight="700" text-anchor="start">污染庫新增</text><text x="278" y="148" font-size="27" fill="#C6473D" font-weight="500" text-anchor="start">r3 = [3, 2]</text><text x="15" y="251" font-size="33" fill="#CE7917" font-weight="700" text-anchor="start">p查到r3：距離 = 0</text><text x="15" y="302" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">刮傷仍在原圖，沒有消失</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">低距離也可能來自錯誤資料</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">正常庫來源需可追溯與審核</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">低距離可能只是正常庫被污染。</text></svg>