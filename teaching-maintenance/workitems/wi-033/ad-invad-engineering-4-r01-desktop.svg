<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">InvAD：位置條件不能平均成一數</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同一z在p與q調制不同</text><g transform="translate(8,66) scale(0.965)"><text x="20" y="38" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">給定標準化後 z = 3</text><rect x="15" y="73" width="220" height="72" rx="6" fill="white" stroke="#CE7917" stroke-width="2"/><text x="27" y="103" font-size="25" fill="#CE7917" font-weight="700" text-anchor="start">p：縮放2／偏移1</text><text x="27" y="133" font-size="27" fill="#CE7917" font-weight="500" text-anchor="start">2 × 3 + 1 = 7</text><rect x="250" y="73" width="220" height="72" rx="6" fill="white" stroke="#238854" stroke-width="2"/><text x="262" y="103" font-size="25" fill="#238854" font-weight="700" text-anchor="start">q：縮放.5／偏移0</text><text x="262" y="133" font-size="27" fill="#238854" font-weight="500" text-anchor="start">.5 × 3 + 0 = 1.5</text><rect x="35.0" y="180.0" width="31.333333333333336" height="31.333333333333336" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="68.33333333333334" y="180.0" width="31.333333333333336" height="31.333333333333336" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="101.66666666666667" y="180.0" width="31.333333333333336" height="31.333333333333336" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="35.0" y="213.33333333333334" width="31.333333333333336" height="31.333333333333336" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="68.33333333333334" y="213.33333333333334" width="31.333333333333336" height="31.333333333333336" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="101.66666666666667" y="213.33333333333334" width="31.333333333333336" height="31.333333333333336" rx="1" fill="#CE7917" stroke="#1765CA" stroke-width="2"/><rect x="35.0" y="246.66666666666669" width="31.333333333333336" height="31.333333333333336" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="68.33333333333334" y="246.66666666666669" width="31.333333333333336" height="31.333333333333336" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="101.66666666666667" y="246.66666666666669" width="31.333333333333336" height="31.333333333333336" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><line x1="155" y1="227" x2="265" y2="227" stroke="#1765CA" stroke-width="5"/><polygon points="265.0,227.0 251.0,220.0 251.0,234.0" fill="#1765CA"/><rect x="285.0" y="180.0" width="31.333333333333336" height="31.333333333333336" rx="1" fill="#E3EEF9" stroke="#238854" stroke-width="2"/><rect x="318.3333333333333" y="180.0" width="31.333333333333336" height="31.333333333333336" rx="1" fill="#E3EEF9" stroke="#238854" stroke-width="2"/><rect x="351.6666666666667" y="180.0" width="31.333333333333336" height="31.333333333333336" rx="1" fill="#E3EEF9" stroke="#238854" stroke-width="2"/><rect x="285.0" y="213.33333333333334" width="31.333333333333336" height="31.333333333333336" rx="1" fill="#E3EEF9" stroke="#238854" stroke-width="2"/><rect x="318.3333333333333" y="213.33333333333334" width="31.333333333333336" height="31.333333333333336" rx="1" fill="#E3EEF9" stroke="#238854" stroke-width="2"/><rect x="351.6666666666667" y="213.33333333333334" width="31.333333333333336" height="31.333333333333336" rx="1" fill="#E3EEF9" stroke="#238854" stroke-width="2"/><rect x="285.0" y="246.66666666666669" width="31.333333333333336" height="31.333333333333336" rx="1" fill="#E3EEF9" stroke="#238854" stroke-width="2"/><rect x="318.3333333333333" y="246.66666666666669" width="31.333333333333336" height="31.333333333333336" rx="1" fill="#E3EEF9" stroke="#238854" stroke-width="2"/><rect x="351.6666666666667" y="246.66666666666669" width="31.333333333333336" height="31.333333333333336" rx="1" fill="#E3EEF9" stroke="#238854" stroke-width="2"/><text x="37" y="316" font-size="28" fill="#1765CA" font-weight="700" text-anchor="start">常數起步 → 逐階調制</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">SSM：空間風格調制</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">此例只追一個已標準化分量</text></g></g><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">若平均條件，兩點都4.25</text><g transform="translate(8,66) scale(0.965)"><text x="20" y="43" font-size="30" fill="#1765CA" font-weight="700" text-anchor="start">若把p、q條件平均</text><rect x="15" y="85" width="220" height="72" rx="6" fill="white" stroke="#CE7917" stroke-width="2"/><text x="27" y="115" font-size="25" fill="#CE7917" font-weight="700" text-anchor="start">縮放平均</text><text x="27" y="145" font-size="27" fill="#CE7917" font-weight="500" text-anchor="start">(2 + .5)/2 = 1.25</text><rect x="250" y="85" width="220" height="72" rx="6" fill="white" stroke="#238854" stroke-width="2"/><text x="262" y="115" font-size="25" fill="#238854" font-weight="700" text-anchor="start">偏移平均</text><text x="262" y="145" font-size="27" fill="#238854" font-weight="500" text-anchor="start">(1 + 0)/2 = .5</text><text x="25" y="229" font-size="31" fill="#CE7917" font-weight="700" text-anchor="start">1.25 × 3 + .5 = 4.25</text><text x="25" y="296" font-size="30" fill="#1765CA" font-weight="700" text-anchor="start">p、q得到同一個值</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">原本7／1.5的區別消失</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">给定局部算例，不預測性能</text></g></g><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">仍需回原圖驗位置差異</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(10,15) scale(0.54)"><rect x="0" y="0" width="350" height="225" rx="8" fill="url(#steel)" stroke="#748A9C" stroke-width="2"/><circle cx="68" cy="65" r="35" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="282" cy="181" r="22" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><line x1="266" y1="133" x2="300" y2="103" stroke="#34424B" stroke-width="6"/><line x1="260" y1="142" x2="286" y2="122" stroke="#EDF2F6" stroke-width="3"/><rect x="247" y="94" width="65" height="58" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="318" y="124" font-size="31" fill="#CE7917" font-weight="700" text-anchor="start">p</text></g><g transform="translate(265,15) scale(0.54)"><rect x="0" y="0" width="350" height="225" rx="8" fill="url(#steel)" stroke="#748A9C" stroke-width="2"/><circle cx="68" cy="65" r="35" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="282" cy="181" r="22" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/></g><text x="15" y="185" font-size="28" fill="#CE7917" font-weight="700" text-anchor="start">刮傷：驗漏檢</text><text x="270" y="185" font-size="28" fill="#238854" font-weight="700" text-anchor="start">正常：驗誤報</text><text x="30" y="274" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">獨立留出集＋原圖覆核</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">位置分數回原圖逐件檢查</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">獨立正常與真缺陷不可省略</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">保留空間差異，才保留不同位置的調制。</text></svg>