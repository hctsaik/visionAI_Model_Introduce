<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">Pose：影像點必須對上實體點</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">影像中找得到同名點</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(100,80) scale(1.1)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/><circle cx="95" cy="0" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="105" y="-10" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">A</text><circle cx="60" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="70" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">B</text><circle cx="190" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="200" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">C</text></g><text x="15" y="315" font-size="26" fill="#172B43" font-weight="500" text-anchor="start">A：缺口轉角　B／C：孔心</text><text x="15" y="365" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">影像點名 ↔ CAD 同名位置</text><text x="15" y="415" font-size="26" fill="#CE7917" font-weight="500" text-anchor="start">示意三點，不保證唯一解</text></g></g><line x1="543" y1="388" x2="567" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="567.0,388.0 553.0,381.0 553.0,395.0" fill="#1765CA"/><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">已知 3D 點與相機設定</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(40,50) scale(0.8)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/><circle cx="95" cy="0" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="105" y="-10" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">A</text><circle cx="60" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="70" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">B</text><circle cx="190" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="200" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">C</text></g><line x1="280" y1="100" x2="450" y2="100" stroke="#1765CA" stroke-width="5"/><polygon points="450.0,100.0 436.0,93.0 436.0,107.0" fill="#1765CA"/><text x="350" y="80" font-size="27" fill="#1765CA" font-weight="500" text-anchor="start">X</text><line x1="280" y1="100" x2="280" y2="210" stroke="#238854" stroke-width="5"/><polygon points="280.0,210.0 287.0,196.0 273.0,196.0" fill="#238854"/><text x="294" y="208" font-size="27" fill="#238854" font-weight="500" text-anchor="start">Y</text><rect x="20" y="265" width="220" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="130.0" y="295" font-size="26" fill="white" font-weight="700" text-anchor="middle">相機 K／畸變</text><rect x="255" y="265" width="215" height="43" rx="12" fill="#238854" stroke="#238854" stroke-width="2"/><text x="362.5" y="295" font-size="26" fill="white" font-weight="700" text-anchor="middle">3D 點／單位</text><text x="15" y="365" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">CAD 座標與影像身份對齊</text><text x="15" y="414" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">鎖定校正、解法與點數</text></g></g><line x1="1098" y1="388" x2="1122" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="1122.0,388.0 1108.0,381.0 1108.0,395.0" fill="#1765CA"/><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">PnP 求物體到相機的姿態</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(30,45) scale(0.6)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/><circle cx="95" cy="0" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="105" y="-10" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">A</text><circle cx="60" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="70" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">B</text><circle cx="190" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="200" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">C</text></g><line x1="210" y1="100" x2="330" y2="100" stroke="#1765CA" stroke-width="5"/><polygon points="330.0,100.0 316.0,93.0 316.0,107.0" fill="#1765CA"/><rect x="350" y="55" width="105" height="90" rx="8" fill="#DCE8F5" stroke="#1765CA" stroke-width="2"/><circle cx="402" cy="100" r="26" fill="#F5F9FF" stroke="#1765CA" stroke-width="3"/><text x="20" y="200" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">物體座標</text><text x="340" y="200" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">相機座標</text><rect x="105" y="255" width="285" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="247.5" y="285" font-size="26" fill="white" font-weight="700" text-anchor="middle">R：旋轉　t：平移</text><text x="15" y="360" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">相機點 = R × 物體點 + t</text><text x="15" y="410" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">t 的單位跟 CAD 一致</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">先鎖定點名與相機設定，才能解讀姿態。</text></svg>