<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">Inpainting：遮罩太緊或太大各有代價</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">緊遮罩保留邊缘污點</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.9)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><path d="M 150,174 q 17,-15 33,0 q 20,6 10,20 q -18,8 -43,-2 Z" fill="#25313A"/></g><rect x="170" y="182" width="21" height="17" rx="0" fill="#CE791744" stroke="#CE7917" stroke-width="2"/><text x="20" y="288" font-size="27" fill="#CE7917" font-weight="700" text-anchor="start">遮罩太小，污點邊緣在範圍外</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">若只改小內區，外圈可能殘留</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">依原始污點邊界檢查修改範圍</text></g></g><line x1="543" y1="388" x2="567" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="567.0,388.0 553.0,381.0 553.0,395.0" fill="#1765CA"/><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">大遮罩可能波及鄰近結構</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.9)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><path d="M 150,174 q 17,-15 33,0 q 20,6 10,20 q -18,8 -43,-2 Z" fill="#25313A"/></g><rect x="45" y="45" width="265" height="175" rx="5" fill="#CE791733" stroke="#CE7917" stroke-width="2"/><text x="20" y="288" font-size="29" fill="#CE7917" font-weight="700" text-anchor="start">過大遮罩包含了部分孔位</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">修改範圍擴大，也會暴露鄰近結構</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">邊界、孔位及遮罩外都要比</text></g></g><line x1="1098" y1="388" x2="1122" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="1122.0,388.0 1108.0,381.0 1108.0,395.0" fill="#1765CA"/><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">保留原圖與mask縮放記錄</text><g transform="translate(8,66) scale(0.965)"><rect x="30" y="10" width="430" height="282" rx="9" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="48" y="48" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">原始來源</text><text x="48" y="82" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">原圖另存＋尺寸座標</text><text x="48" y="126" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">遮罩約定</text><text x="48" y="160" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">本圖1=修改；API另核對</text><text x="48" y="204" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">生成設定</text><text x="48" y="238" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">縮放／羽化／模型／種子</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">原圖、mask與候選一起保存</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">不要讓編修版覆蓋原始觀測</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">按原位置驗接縫、孔位與遮罩外變化。</text></svg>