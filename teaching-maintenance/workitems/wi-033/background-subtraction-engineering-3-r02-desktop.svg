<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">背景相減：啟動與更新速度都要驗</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">起始背景尚不穩定</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,15) scale(0.95)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="130" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/></g><text x="25" y="212" font-size="28" fill="#CE7917" font-weight="700" text-anchor="start">相機啟動／移位／切換場景</text><text x="25" y="282" font-size="28" fill="#1765CA" font-weight="700" text-anchor="start">重建背景，驗穩定後再用</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">背景未穩定時前景可能亂跳</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">啟動策略不能只看單張圖</text></g></g><line x1="543" y1="388" x2="567" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="567.0,388.0 553.0,381.0 553.0,395.0" fill="#1765CA"/><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">更新快慢有不同取捨</text><g transform="translate(8,66) scale(0.965)"><rect x="15" y="30" width="220" height="72" rx="6" fill="white" stroke="#1765CA" stroke-width="2"/><text x="27" y="60" font-size="25" fill="#1765CA" font-weight="700" text-anchor="start">較快更新</text><text x="27" y="90" font-size="27" fill="#1765CA" font-weight="500" text-anchor="start">適應變化較快</text><rect x="250" y="30" width="220" height="72" rx="6" fill="white" stroke="#238854" stroke-width="2"/><text x="262" y="60" font-size="25" fill="#238854" font-weight="700" text-anchor="start">較慢更新</text><text x="262" y="90" font-size="27" fill="#238854" font-weight="500" text-anchor="start">保留歷史較久</text><g transform="translate(110,148) scale(0.55)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="130" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/></g><text x="15" y="282" font-size="30" fill="#CE7917" font-weight="700" text-anchor="start">停留吸收 ↔ 光照殘留</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">快慢都有代價，要用同段影片驗</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">不指定通用最佳learningRate</text></g></g><line x1="1098" y1="388" x2="1122" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="1122.0,388.0 1108.0,381.0 1108.0,395.0" fill="#1765CA"/><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">部署保存狀態和陰影處理</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,5) scale(0.42)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="130" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/></g><text x="215" y="68" font-size="28" fill="#1765CA" font-weight="700" text-anchor="start">固定同一版本</text><rect x="20" y="128" width="440" height="54" rx="3" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="30" y="163" font-size="26" fill="#1765CA" font-weight="500" text-anchor="start">history／learningRate</text><rect x="20" y="193" width="440" height="54" rx="3" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="30" y="228" font-size="26" fill="#1765CA" font-weight="500" text-anchor="start">陰影標籤／ROI／前處理</text><rect x="20" y="258" width="440" height="54" rx="3" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="30" y="293" font-size="26" fill="#1765CA" font-weight="500" text-anchor="start">場景切換／背景重置</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">背景狀態依賴前段影格</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">同參數但不同歷史，結果可不同</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">先穩定背景，再評停留和光照變化。</text></svg>