<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">ConvLSTM：有記憶也可能忘記關鍵</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">短暫失敗發生在中間影格</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.64)"><rect x="0" y="0" width="220" height="175" rx="5" fill="#E4EBF1" stroke="#73899E" stroke-width="2"/><rect x="72" y="117" width="76" height="44" rx="2" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><rect x="72" y="10" width="76" height="35" rx="2" fill="#172B43" stroke="#172B43" stroke-width="2"/><line x1="56" y1="34" x2="56" y2="67" stroke="#172B43" stroke-width="13"/><line x1="164" y1="34" x2="164" y2="67" stroke="#172B43" stroke-width="13"/><line x1="56" y1="67" x2="67" y2="67" stroke="#172B43" stroke-width="9"/><line x1="164" y1="67" x2="153" y2="67" stroke="#172B43" stroke-width="9"/></g><g transform="translate(180,20) scale(0.64)"><g transform="translate(0,0) scale(1)"><rect x="0" y="0" width="220" height="175" rx="5" fill="#E4EBF1" stroke="#73899E" stroke-width="2"/><rect x="72" y="117" width="76" height="44" rx="2" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><rect x="72" y="10" widt