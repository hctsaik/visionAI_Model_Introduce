A" stroke-width="5"/><polygon points="432.0,254.0 418.0,247.0 418.0,261.0" fill="#1765CA"/><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">短事件發生在兩次取樣之間</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">模型未看到的事件不能靠記憶補證</text></g></g><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">忘記門連乘使舊訊號衰減</text><g transform="translate(8,66) scale(0.965)"><rect x="20" y="35" width="111" height="55" rx="2" fill="white" stroke="#1765CA" stroke-width="2"/><text x="75.5" y="72" font-size="26" fill="#1765CA" font-weight="700" text-anchor="middle">1</text><rect x="135" y="35" width="111" height="55" rx="2" fill="white" stroke="#1765CA" stroke-width="2"/><text x="190.5" y="72" font-size="26" fill="#1765CA" font-weight="700" text-anchor="middle">0.5</text><rect x="250" y="35" width="111" height="55" rx="2" fill="white" stroke="#1765CA" stroke-width="2"/><text x="305.5" y="72" font-size="26" fill="#1765CA" font-weight="700" text-anchor="middle">0.25</text><rect x="365" y="35" width="111" height="55" rx="2" fill="white" stroke="#1765CA" stroke-width="2"/><text x="420.5" y="72" font-size="26" fill="#1765CA" font-weight="700" text-anchor="middle">0.125</text><line x1="90" y1="127" x2="147" y2="127" stroke="#1765CA" stroke-width="5"/><polygon points="147.0,127.0 133.0,120.0 133.0,134.0" fill="#1765CA"/><line x1="205" y1="127" x2="262" y2="127" stroke="#1765CA" stroke-width="5"/><polygon points="262.0,127.0 248.0,120.0 248.0,134.0" fill="#1765CA"/><line x1="320" y1="127" x2="377" y2="127" stroke="#1765CA" stroke-width="5"/><polygon points="377.0,127.0 363.0,120.0 363.0,134.0" fill="#1765CA"/><text x="20" y="213" font-size="29" fill="#172B43" font-weight="500" text-anchor="start">每步乘0.5；不加入新值</text><text x="20" y="278" font-size="30" fill="#238854" font-weight="700" text-anchor="start">三步後：1 × 0.5³ = 0.125</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">作者單格例：舊訊號可衰減</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">真實忘記門是學到的變動值</text></g></g><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">不同片長與幀距各自驗</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.75)"><rect x="0" y="0" width="220" height="175" rx="5" fill="#E4EBF1" stroke="#73899E" stroke-width="2"/><rect x="72" y="117" width="76" height="44" rx="2" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><rect x="72" y="10" width="76" height="35" rx="2" fill="#172B43" stroke="#172B43" stroke-width="2"/><line x1="73" y1="34" x2="73" y2="127" stroke="#172B43" stroke-width="13"/><line x1="147" y1="34" x2="147" y2="127" stroke="#172B43" stroke-width="13"/><line x1="73" y1="127" x2="84" y2="127" stroke="#172B43" stroke-width="9"/><line x1="147" y1="127" x2="136" y2="127" stroke="#172B43" stroke-width="9"/></g><g transform="translate(295,20) scale(0.75)"><g transform="translate(0,0) scale(1)"><rect x="0" y="0" width="220" height="175" rx="5" fill="#E4EBF1" stroke="#73899E" stroke-width="2"/><rect x="72" y="117" width="76" height="44" rx="2" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><rect x="72" y="10" width="76" height="35" rx="2" fill="#172B43" stroke="#172B43" stroke-width="2"/><line x1="73" y1="34" x2="73" y2="127" stroke="#172B43" stroke-width="13"/><line x1="147" y1="34" x2="147" y2="127" stroke="#172B43" stroke-width