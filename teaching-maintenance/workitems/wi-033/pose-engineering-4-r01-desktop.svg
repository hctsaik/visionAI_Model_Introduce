<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">Pose：對稱件的小誤差也可能騙人</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">遮擋讓點身份變模糊</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(100,70) scale(1.1)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/><circle cx="95" cy="0" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="105" y="-10" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">A</text><circle cx="60" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="70" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">B</text><circle cx="190" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="200" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">C</text></g><rect x="177" y="40" width="100" height="80" rx="5" fill="#647A91" stroke="#647A91" stroke-width="2"/><text x="15" y="305" font-size="29" fill="#CE7917" font-weight="500" text-anchor="start">辨識方向的缺口被遮住</text><text x="15" y="360" font-size="25" fill="#172B43" font-weight="500" text-anchor="start">孔洞外觀相似，點名可能互換</text><text x="15" y="412" font-size="25" fill="#172B43" font-weight="500" text-anchor="start">這是身份問題，不只是點偏移</text></g></g><line x1="543" y1="388" x2="567" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="567.0,388.0 553.0,381.0 553.0,395.0" fill="#1765CA"/><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">候選都能貼近觀測點</text><g transform="translate(8,66) scale(0.965)"><text x="15" y="55" font-size="28" fill="#1765CA" font-weight="500" text-anchor="start">候選 1</text><circle cx="205" cy="45" r="10" fill="none" stroke="#1765CA" stroke-width="3"/><circle cx="208" cy="48" r="5" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><circle cx="295" cy="45" r="10" fill="none" stroke="#1765CA" stroke-width="3"/><circle cx="298" cy="48" r="5" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><circle cx="385" cy="45" r="10" fill="none" stroke="#1765CA" stroke-width="3"/><circle cx="388" cy="48" r="5" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="15" y="215" font-size="28" fill="#238854" font-weight="500" text-anchor="start">候選 2</text><circle cx="205" cy="205" r="10" fill="none" stroke="#238854" stroke-width="3"/><circle cx="208" cy="208" r="5" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><circle cx="295" cy="205" r="10" fill="none" stroke="#238854" stroke-width="3"/><circle cx="298" cy="208" r="5" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><circle cx="385" cy="205" r="10" fill="none" stroke="#238854" stroke-widt