"2"/><text x="89" y="2272" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">清楚角點、穩定影格與小位移，</text><text x="45" y="2318" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">是局部解的起點。</text></svg>