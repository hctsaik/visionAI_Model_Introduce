<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2400" viewBox="0 0 768 2400"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2400" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">Lucas–Kanade：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">先讓角點有可追的鄰域</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.3)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同相機相鄰影格</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(8,55) scale(1)"><rect x="0" y="0" width="190" height="175" rx="10" fill="#D6E0E9" stroke="#8399AD" stroke-width="2"/><circle cx="13" cy="13" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="177" cy="13" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="13" cy="162" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="177" cy="162" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><path d="M55,35 v75 h75" fill="none" stroke="#243548" stroke-width="20"/></g><g transform="translate(285,55) scale(1)"><rect x="0" y="0" width="190" height="175" rx="10" fill="#D6E0E9" stroke="#8399AD" stroke-width="2"/><circle cx="13" cy="13" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="177" cy="13" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="13" cy="162" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="177" cy="162" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><path d="M75,35 v75 h75" fill="none" stroke="#243548" stroke-width="20"/></g><text x="15" y="30" font-size="29" fill="#172B43" font-weight="500" text-anchor="start">前影格</text><text x="292" y="30" font-size="29" fill="#172B43" font-weight="500" text-anchor="start">後影格</text><line x1="210" y1="138" x2="265" y2="138" stroke="#1765CA" stroke-width="5"/><polygon points="265.0,138.0 251.0,131.0 251.0,145.0" fill="#1765CA"/><text x="15" y="315" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">同一 L 形刻痕，工件平移</text><text x="15" y="363" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">固定時間差、裁切與取像</text></g></g><line x1="384.0" y1="848.0" x2="384.0" y2="867.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,867.0 391.0,853.0 377.0,853.0" fill="#1765CA"/><g transform="translate(50,870.0) scale(1.3)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">角點提供兩方向線索</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(145,0) scale(1.1)"><rect x="0" y="0" width="190" height="175" rx="10" fill="#D6E0E9" stroke="#8399AD" stroke-width="2"/><circle cx="13" cy="13" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="177" cy="13" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="13" cy="162" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="177" cy="162" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><path d="M55,35 v75 h75" fill="none" stroke="#243548" stroke-width="20"/></g><rect x="196" y="105" width="70" height="65" rx="0" fill="none" stroke="#1765CA" stroke-width="2"/><line x1="218" y1="148" x2="278" y2="148" stroke="#CE7917" stroke-width="5"/><polygon points="278.0,148.0 264.0,141.0 264.0,155.0" fill="#CE7917"/><line x1="218" y1="148" x2="218" y2="81" stroke="#238854" stroke-width="5"/><polygon points="218.0,81.0 211.0,95.0 225.0,95.0" fill="#238854"/><text x="15" y="264" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">角點：兩方向都有亮度變化</text><text x="15" y="312" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">單一平邊只能限制一方向</text><text x="15" y="360" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">平坦區幾乎沒有位移線索</text></g></g><line x1="384.0" y1="1523.0" x2="384.0" y2="1542.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1542.0 391.0,1528.0 377.0,1528.0" fill="#1765CA"/><g transform="translate(50,1545.0) scale(1.3)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">金字塔先粗後細</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(22,10) scale(0.42)"><rect x="0" y="0" width="190" height="175" rx="10" fill="#D6E0E9" stroke="#8399AD" stroke-width="2"/><circle cx="13" cy="13" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="177" cy="13" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="13" cy="162" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="177" cy="162" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><path d="M55,35 v75 h75" fill="none" stroke="#243548" stroke-width="20"/></g><line x1="115" y1="49" x2="155" y2="49" stroke="#1765CA" stroke-width="5"/><polygon points="155.0,49.0 141.0,42.0 141.0,56.0" fill="#1765CA"/><g transform="translate(172,10) scale(0.68)"><rect x="0" y="0" width="190" height="175" rx="10" fill="#D6E0E9" stroke="#8399AD" stroke-width="2"/>