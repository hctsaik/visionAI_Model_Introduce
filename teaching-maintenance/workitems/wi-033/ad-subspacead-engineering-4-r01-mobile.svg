<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">SubspaceAD：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">留全維，連異常也能投回去</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同一待測特徵x保持不變</text><g transform="translate(8,66) scale(0.965)"><line x1="45" y1="280" x2="450" y2="280" stroke="#1765CA" stroke-width="4"/><line x1="45" y1="280" x2="45" y2="30" stroke="#B9D4EF" stroke-width="2"/><line x1="45" y1="280" x2="300" y2="100" stroke="#CE7917" stroke-width="5"/><polygon points="300.0,100.0 284.5,102.4 292.6,113.8" fill="#CE7917"/><line x1="300" y1="100" x2="300" y2="280" stroke="#C6473D" stroke-width="5" stroke-dasharray="7 7"/><circle cx="300" cy="100" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><circle cx="300" cy="280" r="7" fill="#238854" stroke="#238854" stroke-width="3"/><text x="280" y="65" font-size="29" fill="#CE7917" font-weight="700" text-anchor="start">x = [3, 2]</text><text x="210" y="322" font-size="29" fill="#238854" font-weight="700" text-anchor="start">投影 [3, 0]</text><line x1="282" y1="280" x2="282" y2="262" stroke="#238854" stroke-width="2"/><line x1="282" y1="262" x2="300" y2="262" stroke="#238854" stroke-width="2"/><text x="326" y="194" font-size="28" fill="#C6473D" font-weight="500" text-anchor="start">殘差2</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">垂直落回保留的正常方向</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">特徵投影，不是工件幾何投影</text></g></g><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">只留一維：殘差長度2</text><g transform="translate(8,66) scale(0.965)"><line x1="30" y1="255" x2="470" y2="255" stroke="#1765CA" stroke-width="4"/><line x1="310" y1="80" x2="310" y2="255" stroke="#C6473D" stroke-width="5" stroke-dasharray="7 7"/><circle cx="310" cy="80" r="8" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><circle cx="310" cy="255" r="8" fill="#238854" stroke="#238854" stroke-width="3"/><text x="225" y="50" font-size="30" fill="#CE7917" font-weight="500" text-anchor="start">x=[3,2]</text><text x="20" y="306" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">一維：投影[3,0]，殘差2</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">保留水平正常方向</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">同一向量仍有垂直未解釋量</text></g></g><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">兩維全留：殘差變成0</text><g transform="translate(8,66) scale(0.965)"><rect x="25" y="30" width="440" hei