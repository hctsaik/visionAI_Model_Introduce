<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">U-Net：像素位置先映回，再談尺寸</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">裁切與縮放都留下映射</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(25,20) scale(0.85)"><rect x="0" y="0" width="385" height="210" rx="12" fill="#EAF0F5" stroke="#73899E" stroke-width="2"/><rect x="20" y="28" width="72" height="144" rx="6" fill="#ADBCC7" stroke="#73899E" stroke-width="2"/><rect x="295" y="28" width="72" height="144" rx="6" fill="#ADBCC7" stroke="#73899E" stroke-width="2"/><path d="M65 103 H155 L182 71 H236 L263 103 H325" fill="none" stroke="#B88842" stroke-width="10" stroke-linejoin="round"/></g><rect x="54" y="51" width="260" height="106" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><line x1="192" y1="197" x2="192" y2="236" stroke="#1765CA" stroke-width="5"/><polygon points="192.0,236.0 199.0,222.0 185.0,222.0" fill="#1765CA"/><rect x="55" y="247" width="267" height="51" rx="0" fill="white" stroke="#1765CA" stroke-width="2"/><text x="66" y="283" font-size="26" fill="#1765CA" font-weight="700" text-anchor="start">ROI → resize → padding</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">裁切起點、比例與補邊要留存</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">後續用同一映射還原像素</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">遮罩回到原圖同一位置</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,20) scale(0.53)"><rect x="0" y="0" width="385" height="210" rx="12" fill="#EAF0F5" stroke="#73899E" stroke-width="2"/><rect x="20" y="28" width="72" height="144" rx="6" fill="#ADBCC7" stroke="#73899E" stroke-width="2"/><rect x="295" y="28" width="72" height="144" rx="6" fill="#ADBCC7" stroke="#73899E" stroke-width="2"/><path d="M65 103 H155 L182 71 H236 L263 103 H325" fill="none" stroke="#1765CA" stroke-width="13" stroke-linejoin="round"/></g><line x1="240" y1="91" x2="274" y2="91" stroke="#1765CA" stroke-width="5"/><polygon points="274.0,91.0 260.0,84.0 260.0,98.0" fill="#1765CA"/><g transform="translate(277,34) scale(0.5)"><rect x="0" y="0" width="385" height="210" rx="12" fill="#EAF0F5" stroke="#73899E" stroke-width="2"/><rect x="20" y="28" width="72" height="144" rx="6" fill="#ADBCC7" stroke="#73899E" stroke-width="2"/><rect x="295" y="28" width="72" height="144" rx="6" fill="#ADBCC7" stroke="#73899E" stroke-width="2"/><path d="M65 103 H155 L182 71 H236 L263 103 H325" fill="none" stroke="#1765CA" stroke-width="13" stroke-linejoin="round"/></g><text x="15" y="245" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">模型格位 → 還原ROI</text><text x="15" y="291" font-size="30" fill="#1765CA" font-weight="700" text-anchor="start">同一條線，回到原圖位置</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">還原resize与padding後疊回</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">不能把模型座標直接當原圖</text></g></g><line x1="384.0" y1="1461.0" x2="384.0" y2="1478.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1478.0 391.0,1464.0 377.0,1464.0" fill="#1765CA"/><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">輪廓核對後才另接量測</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(10,14) scale(0.53)"><rect x="0" y="0" width="385" height="210" rx="12" fill="#EAF0F5" stroke="#73899E" stroke-width="2"/><rect x="20" y="28" width="72" height="144" rx="6" fill="#ADBCC7" stroke="#73899E" stroke-width="2"/><rect x="295" y="28" width="72" height="144" rx="6" fill="#ADBCC7" stroke="#73899E" stroke-width="2"/><path d="M65 103 H155 L182 71 H236 L263 103 H325" fill="none" stroke="#B88842" stroke-width="10" stroke-linejoin="round"/></g><g transform="translate(247,14) scale(0.53)"><rect x="0" y="0" width="385" height="210" rx="12" fill="#EAF0F5" stroke="#73899E" stroke-width="2"/><rect x="20" y="28" width="72" height="144" rx="6" fill="#ADBCC7" stroke="#73899E" stroke-width="2"/><rect x="295" y="28" width="72" height="144" rx="6" fill="#ADBCC7" stroke="#73899E" stroke-width="2"/><path d="M65 103 H155 L182 71 H236 L263 103 H325" fill="none" stroke="#1765CA" stroke-width="13" stroke-linejoin="round"/><rect x="184" y="60" width="16" height="24" rx="0" fill="#EAF0F5" stroke="none" stroke-width="2"/></g><text x="17" y="180" font-size="30" fill="#1765CA" font-weight="700" text-anchor="start">原圖連續</text><text x="248" y="180" font-size="30" fill="#CE7917" font-weight="700" text-anchor="start">候選斷裂</text><text x="15" y="270" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">連通／邊界／錯分／延遲</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">檢查最窄位置，不只看IoU</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">物理尺寸另需校正與誤差驗證</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">記錄resize與裁切，</text><text x="45" y="2222" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">像素遮罩不能直接當毫米。</text></svg>