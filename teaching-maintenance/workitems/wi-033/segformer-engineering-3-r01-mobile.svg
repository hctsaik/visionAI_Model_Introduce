<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">SegFormer：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">解析度與細邊界一起驗</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">原圖細線與較粗取樣</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(9,5) scale(0.54)"><rect x="0" y="0" width="385" height="210" rx="12" fill="#EAF0F5" stroke="#73899E" stroke-width="2"/><rect x="20" y="28" width="72" height="144" rx="6" fill="#ADBCC7" stroke="#73899E" stroke-width="2"/><rect x="295" y="28" width="72" height="144" rx="6" fill="#ADBCC7" stroke="#73899E" stroke-width="2"/><path d="M65 103 H155 L182 71 H236 L263 103 H325" fill="none" stroke="#B88842" stroke-width="10" stroke-linejoin="round"/></g><text x="15" y="150" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">細線輸入</text><g transform="translate(245,5) scale(0.54)"><rect x="0" y="0" width="385" height="210" rx="12" fill="#EAF0F5" stroke="#73899E" stroke-width="2"/><rect x="20" y="28" width="72" height="144" rx="6" fill="#ADBCC7" stroke="#73899E" stroke-width="2"/><rect x="295" y="28" width="72" height="144" rx="6" fill="#ADBCC7" stroke="#73899E" stroke-width="2"/><path d="M65 103 H155 L182 71 H236 L263 103 H325" fill="none" stroke="#B88842" stroke-width="10" stroke-linejoin="round"/><rect x="184" y="60" width="16" height="24" rx="0" fill="#EAF0F5" stroke="none" stroke-width="2"/></g><text x="245" y="150" font-size="28" fill="#CE7917" font-weight="700" text-anchor="start">粗採樣示意</text><line x1="15" y1="216" x2="445" y2="216" stroke="#B9D4EF" stroke-width="2"/><text x="15" y="272" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">先確認需要的線索仍在</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">更多輸出格不等於更多觀測</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">同件、同缺陷，改輸入解析度</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">融合輸出映回原圖</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,20) scale(0.53)"><rect x="0" y="0" width="385" height="210" rx="12" fill="#EAF0F5" stroke="#73899E" stroke-width="2"/><rect x="20" y="28" width="72" height="144" rx="6" fill="#ADBCC7" stroke="#73899E" stroke-width="2"/><rect x="295" y="28" width="72" height="144" rx="6" fill="#ADBCC7" stroke="#73899E" stroke-width="2"/><path d="M65 103 H155 L182 71 H236 L263 103 H325" fill="none" stroke="#1765CA" stroke-width="13" stroke-linejoin="round"/></g><line x1="240" y1="91" x2="274" y2="91" stroke="#1765CA" stroke-width="5"/><polygon points="274.0,91.0 260.0,84.0 260.0,98.0" fill="#1765CA"/><g transform="translate(277,34) scale(0.5)"><rect x="0" y="0" width="385" height="210" rx="12" fill="#EAF0F5" stroke="#73899E" stroke-width="2"/><rect x="20" y="28" width="72" height="144" rx="6" fill="#ADBCC7" stroke="#73899E" stroke-width="2"/><rect x="295" y="28" width="72" height="144" rx="6" fill="#ADBCC7" stroke="#73899E" stroke-width="2"/><path d="M65 103 H155 L182 71 H236 L263 103 H325" fill="none" stroke="#1765CA" stroke-width="13" stroke-linejoin="round"/></g><text x="15" y="245" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">模型格位 → 還原ROI</text><text x="15" y="291" font-size="30" fill="#1765CA" font-weight="700" text-anchor="start">同一條線，回到原圖位置</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">還原resize与padding後疊回</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">不能把模型座標直接當原圖</text></g></g><line x1="384.0" y1="1461.0" x2="384.0" y2="1478.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1478.0 391.0,1464.0 377.0,1464.0" fill="#1765CA"/><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">核對細線、邊界與時間</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(10,14) scale(0.53)"><rect x="0" y="0" width="385" height="210" rx="12" fill="#EAF0F5" stroke="#73899E" stroke-width="2"/><rect x="20" y="28" width="72" height="144" rx="6" fill="#ADBCC7" stroke="#73899E" stroke-width="2"/><rect x="295" y="28" width="72" height="144" rx="6" fill="#ADBCC7" stroke="#73899E" stroke-width="2"/><path d="M65 103 H155 L182 71 H236 L263 103 H325" fill="none" stroke="#B88842" stroke-width="10" stroke-linejoin="round"/></g><g transform="translate(247,14) scale(0.53)"><rect x="0" y="0" width="385" height="210" rx="12" fill="#EAF0F5" stroke="#73899E" stroke-width="2"/><rect x="20" y="28" width="72" height="144" rx="6" fill="#ADBCC7" stroke="#73899E" stroke-width="2"/><rect x="295" y="28" width="72" height="144" rx="6" fill="#ADBCC7" stroke="#73899E" stroke-width="2"/><path d="M65 103 H155 L182 71 H236 L263 103 H325" fill="none" stroke="#1765CA" stroke-width="13" stroke-linejoin="round"/><rect x="184" y="60" width="16" height="24" rx="0" fill="#EAF0F5" stroke="none" stroke-width="2"/></g><text x="17" y="180" font-size="30" fill="#1765CA" font-weight="700" text-anchor="start">原圖連續</text><text x="248" y="180" font-size="30" fill="#CE7917" font-weight="700" text-anchor="start">候選斷裂</text><text x="15" y="270" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">連通／邊界／錯分／延遲</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">檢查最窄位置，不只看IoU</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">物理尺寸另需校正與誤差驗證</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">多尺度不能補回取像已消失的細線。</text></svg>