<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">LLaVA與專用視覺：先定義交付</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">共同接頭與左右座位</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,15) scale(1)"><rect x="0" y="0" width="410" height="205" rx="15" fill="#34424B" stroke="#23333D" stroke-width="2"/><circle cx="112" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="112" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="300" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="300" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="112" cy="103" r="32" fill="#CAD3D8" stroke="#AAB6BD" stroke-width="3"/><line x1="89" y1="103" x2="135" y2="103" stroke="#596D79" stroke-width="6"/><line x1="112" y1="80" x2="112" y2="126" stroke="#596D79" stroke-width="6"/></g><text x="25" y="279" font-size="30" fill="#1765CA" font-weight="700" text-anchor="start">左：可見螺絲　右：空座</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">兩候選共用同一接頭影像</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">先固定需要交付的欄位與允收</text></g></g><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">VLM回答可見描述</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(25,12) scale(0.66)"><rect x="0" y="0" width="410" height="205" rx="15" fill="#34424B" stroke="#23333D" stroke-width="2"/><circle cx="112" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="112" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="300" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="300" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="112" cy="103" r="32" fill="#CAD3D8" stroke="#AAB6BD" stroke-width="3"/><line x1="89" y1="103" x2="135" y2="103" stroke="#596D79" stroke-width="6"/><line x1="112" y1="80" x2="112" y2="126" stroke="#596D79" stroke-width="6"/></g><text x="22" y="204" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">左側 → 可見 → 螺絲</text><text x="22" y="254" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">右側 → 未見 → 螺絲</text><text x="22" y="301" font-size="29" fill="#CE7917" font-weight="700" text-anchor="start">原因：未知</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">逐token回答仍可能犯錯</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">空座不能證明漏裝或鬆脫原因</text></g></g><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">固定ROI可用專用分類</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(10,10) scale(0.72)"><rect x="0" y="0" width="410" height="205" rx="15" fill="#34424B" stroke="#23333D" stroke-width="2"/><circle cx="112" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="112" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="300" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="300" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="112" cy="103" r="32" fill="#CAD3D8" stroke="#AAB6BD" stroke-width="3"/><line x1="89" y1="103" x2="135" y2="103" stroke="#596D79" stroke-width="6"/><line x1="112" y1="80" x2="112" y2="126" stroke="#596D79" stroke-width="6"/></g><rect x="42" y="35" width="99" height="101" rx="0" fill="none" stroke="#1765CA" stroke-width="2"/><rect x="177" y="35" width="99" height="101" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="340" y="69" font-size="26" fill="#1765CA" font-weight="500" text-anchor="start">左ROI</text><text x="340" y="130" font-size="26" fill="#CE7917" font-weight="500" text-anchor="start">右ROI</text><line x1="172" y1="171" x2="172" y2="220" stroke="#1765CA" stroke-width="5"/><polygon points="172.0,220.0 179.0,206.0 165.0,206.0" fill="#1765CA"/><rect x="20" y="234" width="437" height="55" rx="6" fill="white" stroke="#1765CA" stroke-width="2"/><text x="32" y="271" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">固定座位：有／未見／待覆核</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">固定問題可另評專用分類器</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">仍需遮擋資料、門檻與誤判驗證</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">可追問的回答與固定座位判定，</text><text x="45" y="2222" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">各驗各的成本。</text></svg>