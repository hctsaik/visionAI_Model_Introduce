<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">AnomalyDiffusion：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">兩區各有資料責任</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">真缺陷教外觀與位置</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.55)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><rect x="54.0" y="126.5" width="92" height="65" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/><line x1="62.0" y1="184.5" x2="138.0" y2="133.5" stroke="#253846" stroke-width="5"/><line x1="67.0" y1="188.5" x2="143.0" y2="135.5" stroke="white" stroke-width="2"/><rect x="253.0" y="169.0" width="54" height="34" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/><line x1="261.0" y1="196.0" x2="299.0" y2="176.0" stroke="#253846" stroke-width="5"/><line x1="266.0" y1="200.0" x2="304.0" y2="178.0" stroke="white" stroke-width="2"/></g