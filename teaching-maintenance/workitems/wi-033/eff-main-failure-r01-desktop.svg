<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">同一托盤，換取像仍可能漏掉異常</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">共同托盤：缺件與污點</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(55,5) scale(1.1)"><rect x="0" y="30" width="350" height="150" rx="12" fill="#A3B7C7" stroke="#71869A" stroke-width="2"/><rect x="12" y="50" width="98" height="110" rx="5" fill="#607A90" stroke="#71869A" stroke-width="2"/><rect x="22" y="30" width="78" height="110" rx="7" fill="#D2DFE8" stroke="#6F8598" stroke-width="2"/><ellipse cx="61" cy="30" rx="39" ry="16" fill="#E5EDF4" stroke="#6F8598" stroke-width="3"/><rect x="126" y="50" width="98" height="110" rx="5" fill="#607A90" stroke="#71869A" stroke-width="2"/><rect x="240" y="50" width="98" height="110" rx="5" fill="#607A90" stroke="#71869A" stroke-width="2"/><rect x="250" y="30" width="78" height="110" rx="7" fill="#D2DFE8" stroke="#6F8598" stroke-width="2"/><ellipse cx="289" cy="30" rx="39" ry="16" fill="#E5EDF4" stroke="#6F8598" stroke-width="3"/><path d="M282,78 l15,-7 9,13 -6,20 -22,5 -4,-13 Z" fill="#6A514D"/></g><text x="15" y="280" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">中間缺件、右側污點</text><text x="15" y="328" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">同一影像送T、學生與AE</text><text x="15" y="376" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">位置與表示皆為教學示意</text></g></g><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">反光只遮住右側污點</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(55,5) scale(1.1)"><rect x="0" y="30" width="350" height="150" rx="12" fill="#A3B7C7" stroke="#71869A" stroke-width="2"/><rect x="12" y="50" width="98" height="110" rx="5" fill="#607A90" stroke="#71869A" stroke-width="2"/><rect x="22" y="30" width="78" height="110" rx="7" fill="#D2DFE8" stroke="#6F8598" stroke-width="2"/><ellipse cx="61" cy="30" rx="39" ry="16" fill="#E5EDF4" stroke="#6F8598" stroke-width="3"/><rect x="126" y="50" width="98" height="110" rx="5" fill="#607A90" stroke="#71869A" stroke-width="2"/><rect x="240" y="50" width="98" height="110" rx="5" fill="#607A90" stroke="#71869A" stroke-width="2"/><rect x="250" y="30" width="78" height="110" rx="7" fill="#D2DFE8" stroke="#6F8598" stroke-width="2"/><ellipse cx="289" cy="30" rx="39" ry="16" fill="#E5EDF4" stroke="#6F8598" stroke-width="3"/><path d="M282,78 l15,-7 9,13 -6,20 -22,5 -4,-13 Z" fill="#6A514D"/><rect x="270" y="63" width="45" height="61" rx="11" fill="white" stroke="none" stroke-width="2"/></g><text x="15" y="280" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">仍是同件、同位置的污點</text><text x="15" y="328" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">反光遮住線索；缺件仍可見</text><text x="15" y="376" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">兩路都不能保證補回資訊</text></g></g><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同一資料檢查兩路與融合</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(55,5) scale(1.1)"><rect x="0" y="30" width="350" height="150" rx="12" fill="#A3B7C7" stroke="#71869A" stroke-width="2"/><rect x="12" y="50" width="98" height="110" rx="5" fill="#607A90" stroke="#71869A" stroke-width="2"/><rect x="22" y="30" width="78" height="110" rx="7" fill="#D2DFE8" stroke="#6F8598" stroke-width="2"/><ellipse cx="61" cy="30" rx="39" ry="16" fill="#E5EDF4" stroke="#6F8598" stroke-width="3"/><rect x="126" y="50" width="98" height="110" rx="5" fill="#607A90" stroke="#71869A" stroke-width="2"/><rect x="240" y="50" width="98" height="110" rx="5" fill="#607A90" stroke="#71869A" stroke-width="2"/><rect x="250" y="30" width="78" height="110" rx="7" fill="#D2DFE8" stroke="#6F8598" stroke-width="2"/><ellipse cx="289" cy="30" rx="39" ry="16" fill="#E5EDF4" stroke="#6F8598" stroke-width="3"/><path d="M282,78 l15,-7 9,13 -6,20 -22,5 -4,-13 Z" fill="#6A514D"/></g><rect x="189" y="65" width="96" height="140" rx="4" fill="none" stroke="#CE7917" stroke-width="2"/><rect x="352" y="86" width="50" height="70" rx="4" fill="none" stroke="#CE7917" stroke-width="2"/><text x="15" y="279" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">缺件、污點分開記錄漏檢</text><text x="15" y="327" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">允收正常变化另記誤報</text><text x="15" y="375" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">回原圖，不把亮區當尺寸</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">先核對原圖線索，再驗兩路與融合結果。</text></svg>