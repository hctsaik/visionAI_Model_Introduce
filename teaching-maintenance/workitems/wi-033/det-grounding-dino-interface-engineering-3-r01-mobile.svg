<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">Grounding DINO：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">提示詞也是設定</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">固定查詢與模型設定</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,10) scale(0.58)"><rect x="0" y="0" width="390" height="240" rx="12" fill="#D9ECE6" stroke="#77A796" stroke-width="2"/><line x1="105" y1="0" x2="105" y2="240" stroke="#92B6A2" stroke-width="12"/><rect x="75" y="40" width="60" height="155" rx="5" fill="#9AA6AC" stroke="#6F7F88" stroke-width="2"/><rect x="75" y="65" width="60" height="105" rx="2" fill="#243B40" stroke="#243B40" stroke-width="2"/><text x="105" y="123" font-size="25" fill="white" font-weight="700" text-anchor="middle">103</text><text x="105" y="223" font-size="25" fill="#172B43" font-weight="700" text-anchor="middle">A</text><line x1="270" y1="0" x2="270" y2="240" stroke="#92B6A2" stroke-width="12"/><rect x="240" y="40" width="60" height="155" rx="5" fill="#9AA6AC" stroke="#6F7F88" stroke-width="2"/><rect x="240" y="65" width="60" height="105" rx="2" fill="#243B40" stroke="#243B40" stroke-width="2"/><text x="270" y="123" font-size="25" fill="white" font-weight="700" text-anchor="middle">272</text><text x="270" y="223" font-size="25" fill="#172B43" font-weight="700" text-anchor="middle">B</text></g><rect x="275" y="16" width="205" height="97" rx="6" fill="white" stroke="#238854" stroke-width="2"/><text x="287" y="53" font-size="27" fill="#238854" font-weight="650" text-anchor="start">查詢：</text><text x="287" y="95" font-size="27" fill="#238854" font-weight="650" text-anchor="start">resistor</text><rect x="20" y="200" width="438" height="97" rx="6" fill="white" stroke="#1765CA" stroke-width="2"/><text x="32" y="237" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">保存模型＋完整提示詞</text><text x="32" y="279" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">換詞語就是換一項條件</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同圖改詞，候選可能改變</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">領域詞與料號需獨立驗證</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">詞與框門檻影響保留</text><g transform="translate(8,66) scale(0.965)"><text x="20" y="36" font-size="29" fill="#238854" font-weight="700" text-anchor="start">固定同一詞：resistor</text><text x="20" y="102" font-size="27" fill="#1765CA" font-weight="500" text-anchor="start">A：.90　B：.80　板面：.10</text><rect x="20" y="147" width="438" height="97" rx="6" fill="white" stroke="#CE7917" stroke-width="2"/><text x="32" y="184" font-size="27" fill="#CE7917" font-weight="650" text-anchor="start">門檻.50 → 留A、B</text><text x="32" y="226" font-size="27" fill="#CE7917" font-weight="650" text-anchor="start">門檻.85 → 只留A</text><text x="20" y="300" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">單一分数簡化例；非實測</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">詞／框門檻分別依實作保存</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">分數門檻不等於幾何誤差允收</text></g></g><line x1="384.0" y1="1461.0" x2="384.0" y2="1478.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1478.0 391.0,1464.0 377.0,1464.0" fill="#1765CA"/><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">核對原圖框與漏件</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(25,12) scale(0.9)"><rect x="0" y="0" width="390" height="240" rx="12" fill="#D9ECE6" stroke="#77A796" stroke-width="2"/><line x1="105" y1="0" x2="105" y2="240" stroke="#92B6A2" stroke-width="12"/><rect x="75" y="40" width="60" height="155" rx="5" fill="#9AA6AC" stroke="#6F7F88" stroke-width="2"/><rect x="75" y="65" width="60" height="105" rx="2" fill="#243B40" stroke="#243B40" stroke-width="2"/><text x="105" y="123" font-size="25" fill="white" font-weight="700" text-anchor="middle">103</text><text x="105" y="223" font-size="25" fill="#172B43" font-weight="700" text-anchor="middle">A</text><line x1="270" y1="0" x2="270" y2="240" stroke="#92B6A2" stroke-width="12"/><rect x="240" y="40" width="60" height="155" rx="5" fill="#9AA6AC" stroke="#6F7F88" stroke-width="2"/><rect x="240" y="65" width="60" height="105" rx="2" fill="#243B40" stroke="#243B40" stroke-width="2"/><text x="270" y="123" font-size="25" fill="white" font-weight="700" text-anchor="middle">272</text><text x="270" y="223" font-size="25" fill="#172B43" font-weight="700" text-anchor="middle">B</text></g><rect x="82" y="37" width="76" height="162" rx="0" fill="none" stroke="#1765CA" stroke-width="2"/><rect x="87" y="42" width="76" height="162" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="20" y="278" font-size="31" fill="#C6473D" font-weight="700" text-anchor="start">A：重複兩框　B：漏框</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">示意錯誤：逐件回原圖核對</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">同時記錄定位與前後處理耗時</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">保存提示與門檻，框映回原圖後逐件核對。</text></svg>