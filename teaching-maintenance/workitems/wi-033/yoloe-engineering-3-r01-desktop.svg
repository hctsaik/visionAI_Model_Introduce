<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">YOLOE：把提示與結果一起留存</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">參考圖與ROI固定版本</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,15) scale(0.9)"><rect x="0" y="0" width="390" height="240" rx="12" fill="#D9ECE6" stroke="#77A796" stroke-width="2"/><line x1="105" y1="0" x2="105" y2="240" stroke="#92B6A2" stroke-width="12"/><rect x="75" y="40" width="60" height="155" rx="5" fill="#9AA6AC" stroke="#6F7F88" stroke-width="2"/><rect x="75" y="65" width="60" height="105" rx="2" fill="#243B40" stroke="#243B40" stroke-width="2"/><text x="105" y="123" font-size="25" fill="white" font-weight="700" text-anchor="middle">103</text><text x="105" y="223" font-size="25" fill="#172B43" font-weight="700" text-anchor="middle">A</text><line x1="270" y1="0" x2="270" y2="240" stroke="#92B6A2" stroke-width="12"/><rect x="240" y="40" width="60" height="155" rx="5" fill="#9AA6AC" stroke="#6F7F88" stroke-width="2"/><rect x="240" y="65" width="60" height="105" rx="2" fill="#243B40" stroke="#243B40" stroke-width="2"/><text x="270" y="123" font-size="25" fill="white" font-weight="700"