<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2400" viewBox="0 0 768 2400"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2400" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">Lucas–Kanade：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">多個像素一起限制位移</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.3)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">局部像素提供亮度變化</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(8,18) scale(0.8)"><rect x="0" y="0" width="190" height="175" rx="10" fill="#D6E0E9" stroke="#8399AD" stroke-width="2"/><circle cx="13" cy="13" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="177" cy="13" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="13" cy="162" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="177" cy="162" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><path d="M55,35 v75 h75" fill="none" stroke="#243548" stroke-width="20"/></g><rect x="160" y="22" width="320" height="212" rx="9" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="190" y="63" font-size="32" fill="#1765CA" font-weight="700" text-anchor="start">Ix     Iy     It</text><text x="190" y="111" font-size="31" fill="#172B43" font-weight="500" text-anchor="start">1       0      −2</text><text x="190" y="161" font-size="31" fill="#172B43" font-weight="500" text-anchor="start">0       1      −1</text><text x="190" y="211" font-size="31" fill="#172B43" font-weight="500" text-anchor="start">1       1      −3</text><text x="15" y="285" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">小窗內三個像素的給定梯度</text><text x="15" y="333" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">Ix / Iy：空間亮度變化</text><text x="15" y="381" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">It：跨影格亮度變化</text></g></g><line x1="384.0" y1="848.0" x2="384.0" y2="867.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,867.0 391.0,853.0 377.0,853.0" fill="#1765CA"/><g transform="translate(50,870.0) scale(1.3)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">共同的小位移符合多條式子</text><g transform="translate(8,66) scale(0.965)"><rect x="20" y="15" width="460" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="250.0" y="45" font-size="26" fill="white" font-weight="700" text-anchor="middle">同一小窗，共同未知 u / v</text><text x="35" y="120" font-size="32" fill="#1765CA" font-weight="700" text-anchor="start">Ix · u + Iy · v + It ≈ 0</text><text x="45" y="199" font-size="38" fill="#172B43" font-weight="500" text-anchor="start">u = 2</text><text x="45" y="256" font-size="38" fill="#172B43" font-weight="500" text-anchor="start">v = 1</text><text x="45" y="313" font-size="38" fill="#172B43" font-weight="500" text-anchor="start">u + v = 3</text><text x="20" y="398" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">多條限制一起解；真實資料有誤差</text></g></g><line x1="384.0" y1="1523.0" x2="384.0" y2="1542.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1542.0 391.0,1528.0 377.0,1528.0" fill="#1765CA"/><g transform="translate(50,1545.0) scale(1.3)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">把解變成可核對的向量</text><g transform="translate(8,66) scale(0.965)"><line x1="65" y1="80" x2="65" y2="245" stroke="#B9D4EF" stroke-width="2"/><line x1="65" y1="245" x2="415" y2="245" stroke="#B9D4EF" stroke-width="2"/><line x1="90" y1="90" x2="330" y2="210" stroke="#1765CA" stroke-width="7"/><polygon points="330.0,210.0 320.6,197.5 314.3,210.0" fill="#1765CA"/><line x1="90" y1="90" x2="330" y2="90" stroke="#238854" stroke-width="3"/><line x1="330" y1="90" x2="330" y2="210" stroke="#CE7917" stroke-width="3"/><text x="165" y="75" font-size="31" fill="#238854" font-weight="500" text-anchor="start">u = 2</text><text x="344" y="150" font-size="31" fill="#CE7917" font-weight="500" text-anchor="start">v = 1</text><text x="15" y="290" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">影像座標：右為正，下為正</text><text x="15" y="338" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">像素／影格間隔；非毫米速度</text><text x="15" y="386" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">另查可解性、殘差與往返</text></g></g><rect x="24" y="2220" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2260" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2276" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2272" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">局部梯度支持共同位移，</text><text x="45" y="2318" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">解出數字後仍要檢查。</text></svg>