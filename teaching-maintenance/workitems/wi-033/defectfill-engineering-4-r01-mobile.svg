<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">DefectFill：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">局部差大，也可能是假傷</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同板同位置的刮傷候選</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.55)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><rect x="135.0" y="164.0" width="80" height="40" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/><line x1="143.0" y1="197.0" x2="207.0" y2="171.0" stroke="#9CAAB5" stroke-width="2"/><line x1="148.0" y1="201.0" x2="212.0" y2="173.0" stroke="white" stroke-width="1"/></g><g transform="translate(280,20) scale(0.55)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><rect x="135.0" y="164.0" width="80" height="40" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/><line x1="143.0" y1="197.0" x2="207.0" y2="171.0" stroke="#253846" stroke-width="5"/><line x1="148.0" y1="201.0" x2="212.0" y2="173.0" stroke="white" stroke-width="2"/></g><text x="20" y="204" font-size="26" fill="#172B43" font-weight="500" text-anchor="start">候選A：給定0.1</text><text x="280" y="204" font-size="26" fill="#238854" font-weight="500" text-anchor="start">候選B：給定0.3</text><text x="20" y="271" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">LFS選較大遮罩內LPIPS</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">相對正常圖，局部感知差異</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">較大不等於物理真實或正確</text></g></g><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">異常大黑塊也可能差很大</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.9)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><rect x="135.0" y="164.0" width="80" height="40" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/></g><rect x="145" y="167" width="62" height="37" rx="4" fill="#19252F" stroke="#CE7917" stroke-width="2"/><text x="20" y="283" font-size="27" fill="#CE7917" font-weight="700" text-anchor="start">不合理黑塊也會增加局部差異</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同位置，但外觀不是可信刮傷</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">距離較大不自動代表更好候選</text></g></g><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">用真實缺陷留出驗效益</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.55)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/></g><g transform="translate(280,20) scale(0.55)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><line x1="143.0" y1="197.0" x2="207.0" y2="171.0" stroke="#253846" stroke-width="5"/><line x1="148.0" y1="201.0" x2="212.0" y2="173.0" stroke="white" stroke-width="2"/></g><text x="20" y="205" font-size="27" fill="#1765CA" font-weight="500" text-anchor="start">正常：驗誤報</text><text x="280" y="205" font-size="27" fill="#CE7917" font-weight="500" text-anchor="start">缺陷：驗漏檢</text><text x="20" y="280" font-size="28" fill="#238854" font-weight="700" text-anchor="start">真實留出，按件與批次分開</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">比較加合成前後的真實錯誤</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">不能用合成圖本身證明資料效益</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">LFS挑局部差異，物理合理性仍需另驗。</text></svg>