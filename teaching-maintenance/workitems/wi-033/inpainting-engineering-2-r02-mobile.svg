<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">Inpainting：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">指定內區，保留外部上下文</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">原圖與可編修遮罩分開保存</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.58)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><path d="M 150,174 q 17,-15 33,0 q 20,6 10,20 q -18,8 -43,-2 Z" fill="#25313A"/></g><g transform="translate(270,20) scale(0.58)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><rect x="135.0" y="164.0" width="80" height="40" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/><path d="M 150,174 q 17,-15 33,0 q 20,6 10,20 q -18,8 -43,-2 Z" fill="#25313A"/></g><text x="20" y="217" font-size="29" fill="#1765CA" font-weight="500" text-anchor="start">原圖另存</text><text x="270" y="217" font-size="27" fill="#CE7917" font-weight="500" text-anchor="start">1 = 可編修區</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同板下方待編修污點</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">本圖遮罩約定，API需核對</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">遮罩內去噪、外部提供上下文</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.9)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><rect x="135.0" y="164.0" width="80" height="40" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/></g><line x1="67" y1="170" x2="147" y2="170" stroke="#1765CA" stroke-width="4"/><polygon points="147.0,170.0 133.0,163.0 133.0,177.0" fill="#1765CA"/><line x1="343" y1="170" x2="263" y2="170" stroke="#1765CA" stroke-width="4"/><polygon points="263.0,170.0 277.0,177.0 277.0,163.0" fill="#1765CA"/><text x="20" y="282" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">外部上下文 → 內部去噪</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">指定區域內生成連續外觀</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">各實作保留外區的方式不同</text></g></g><line x1="384.0" y1="1461.0" x2="384.0" y2="1478.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1478.0 391.0,1464.0 377.0,1464.0" fill="#1765CA"/><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">檢查接縫與遮罩外變動</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.55)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><rect x="135.0" y="164.0" width="80" height="40" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/><path d="M 150,174 q 17,-15 33,0 q 20,6 10,20 q -18,8 -43,-2 Z" fill="#25313A"/></g><g transform="translate(280,20) scale(0.55)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><rect x="135.0" y="164.0" width="80" height="40" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/></g><text x="20" y="207" font-size="29" fill="#1765CA" font-weight="500" text-anchor="start">原影像</text><text x="280" y="207" font-size="29" fill="#238854" font-weight="500" text-anchor="start">編修候選</text><text x="20" y="276" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">接縫、孔位、遮罩外逐一比</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">編修結果另存，不覆蓋原始圖</text><text x="15" y="397" font-size="27" fill=