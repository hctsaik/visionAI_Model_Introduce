.org/2000/svg" x="825" y="477" font-size="27" fill="#173650" font-weight="500" text-anchor="start">原有特徵 x</text><text xmlns="http://www.w3.org/2000/svg" x="1110" y="477" font-size="27" fill="#173650" font-weight="500" text-anchor="start">修正 F(x)</text><text xmlns="http://www.w3.org/2000/svg" x="1395" y="477" font-size="27" fill="#173650" font-weight="500" text-anchor="start">相加結果</text><text xmlns="http://www.w3.org/2000/svg" x="825" y="565" font-size="29" fill="#173650" font-weight="700" text-anchor="start">不需調整時</text><rect xmlns="http://www.w3.org/2000/svg" x="825" y="590" width="66" height="66" rx="2" fill="#7db5df" stroke="none" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="859.0" y="631.48" font-size="29" fill="#173650" font-weight="700" text-anchor="middle">2.0</text><rect xmlns="http://www.w3.org/2000/svg" x="893" y="590" width="66" height="66" rx="2" fill="#b6d6ee" stroke="none" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="927.0" y="631.48" font-size="29" fill="#173650" font-weight="700" text-anchor="middle">1.0</text><rect xmlns="http://www.w3.org/2000/svg" x="961" y="590" width="66" height="66" rx="2" fill="#4493d0" stroke="none" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="995.0" y="631.48" font-size="29" fill="#173650" font-weight="700" text-anchor="middle">3.0</text><rect xmlns="http://www.w3.org/2000/svg" x="1110" y="590" width="66" height="66" rx="2" fill="#eef7fd" stroke="none" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="1144.0" y="631.48" font-size="29" fill="#173650" font-weight="700" text-anchor="middle">0.0</text><rect xmlns="http://www.w3.org/2000/svg" x="1178" y="590" width="66" height="66" rx="2" fill="#eef7fd" stroke="none" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="1212.0" y="631.48" font-size="29" fill="#173650" font-weight="700" text-anchor="middle">0.0</text><rect xmlns="http://www.w3.org/2000/svg" x="1246" y="590" width="66" height="66" rx="2" fill="#eef7fd" stroke="none" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="1280.0" y="631.48" font-size="29" fill="#173650" font-weight="700" text-anchor="middle">0.0</text><rect xmlns="http://www.w3.org/2000/svg" x="1395" y="590" width="66" height="66" rx="2" fill="#7db5df" stroke="none" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="1429.0" y="631.48" font-size="29" fill="#173650" font-weight="700" text-anchor="middle">2.0</text><rect xmlns="http://www.w3.org/2000/svg" x="1463" y="590" width="66" height="66" rx="2" fill="#b6d6ee" stroke="none" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="1497.0" y="631.48" font-size="29" fill="#173650" font-weight="700" text-anchor="middle">1.0</text><rect xmlns="http://www.w3.org/2000/svg" x="1531" y="590" width="66" height="66" rx="2" fill="#4493d0" stroke="none" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="1565.0" y="631.48" font-size="29" fill="#173650" font-weight="700" text-anchor="middle">3.0</text><text xmlns="http://www.w3.org/2000/svg" x="1056" y="637" font-size="38" fill="#173650" font-weight="500" text-anchor="start">+</text><text xmlns="http://www.w3.org/2000/svg" x="1343" y="637" font-size="38" fill="#173650" font-weight="500" text-anchor="start">=</text><text xmlns="http://www.w3.org/2000/svg" x="825" y="702" font-size="27" fill="#173650" font-weight="500" text-anchor="start">原有特徵 x</text><text xmlns="http://www.w3.org/2000/svg" x="1110" y="702" font-size="27" fill="#173650" font-weight="500" text-anchor="start">修正 F(x)</text><text xmlns="http://www.w3.org/2000/svg" x="1395" y="702" font-size="27" fill="#173650" font-weight="500" text-anchor="start">相加結果</text><text xmlns="http://www.w3.org/2000/svg" x="825" y="790" font-size="27" fill="#087f85" font-weight="500" text-anchor="start">此例皆非負；ResNet v1相加後再經 ReLU。</text></g></defs><rect x="0" y="0" width="768" height="2800" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="55" font-size="38" fill="#173650" font-weight="800" text-anchor="start">跳接保留同一輸入特徵</text><text x="28" y="145" font-size="23" fill="#526B81" font-weight="500" text-anchor="start">原算例重排；非模型實際推論</text><rect x="30" y="210" width="708" height="770" rx="18" fill="#F3F8FF" stroke="#BAD5EF" stroke-width="2"/><rect x="46" y="225" width="676" height="64" rx="13" fill="#1762CD" stroke="none" stroke-width="2"/><text x="66" y="268" font-size="30" fill="white" font-weight="700" text-anchor="start">普通塊：輸入經過全部層</text><svg x="230" y="305" width="305" height="560" viewBox="35 150 250 600" preserveAspectRatio="xMidYMid meet"><defs><clipPath id="crop-0-0"><rect x="35" y="150" width="250" height="600"/></clipPath></defs><use href="#original-evidence" clip-path="url(#crop-0-0)"/></svg><text x="58" y="884" font-size="27" fill="#173650" font-weight="600" text-anchor="start">普通路徑直接學整個輸出H(x)</text><text x="377" y="1000" font-size="26" fill="#1762CD" font-weight="700" text-anchor="start">↓</text><rect x="30" y="1005" width="708" height="770" rx="18" fill="#F3F8FF" stroke="#BAD5EF" stroke-width="2"/><rect x="46" y="1020" width="676" height="64" rx="13" fill="#1762CD" stroke="none" stroke-width="2"/><text x="66" y="1063" font-size="30" fill="white" font-weight="700" text-anchor="start">殘差塊：保留 x，再加 F(x)</text><svg x="195" y="1100" width="390" height="560" viewBox="350 150 385 600" preserveAspectRatio="xMidYMid meet"><defs><clipPath id="crop-1-0"><rect x="350" y="150" width="385" height="600"/></clipPath></defs><use href="#original-evidence" clip-path="url(#crop-1-0)"/></svg><text x="58" y="1679" font-size="27" fill="#173650" font-weight="600" text-anchor="start">x=[2,1,3]；F(x)=[0,2,−1]</text><text x="58" y="1713" font-size="27" fill="#173650" font-weight="600" text-anchor="start">相加得到[2,3,2]，再經ReLU</text><text x="377" y="1795" font-size="26" fill="#1762CD" font-weight="700" text-anchor="start">↓</text><rect x="30" y="1800" width="708" height="770" rx="18" fill="#F3F8FF" stroke="#BAD5EF" stroke-width="2"/><rect x="46" y="1815" width="676" height="64" rx="13" fill="#1762CD" stroke="none" stroke-width="2"/><text x="66" y="1858" font-size="30" fill="white" font-weight="700" text-anchor="start">修正為零，直通仍保留輸入</text><svg x="60" y="1900" width="665" height="500" viewBox="805 170 830 570" preserveAspectRatio="xMidYMid meet"><defs><clipPath id="crop-2-0"><rect x="805" y="170" width="830" height="570"/></clipPath></defs><use href="#original-evidence" clip-path="url(#crop-2-0)"/></svg><text x="58" y="2474" font-size="27" fill="#173650" font-weight="600" text-anchor="start">形狀不同時需投影或對齊</text><text x="58" y="2508" font-size="27" fill="#173650" font-weight="600" text-anchor="start">直通的是特徵，不是修補後照片</text><rect x="24" y="2630" width="720" height="145" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><text x="44" y="2680" font-size="30" fill="#173650" font-weight="800" text-anchor="start">主路學修正，直通輸入在相加點會合。</text></svg>