<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2800" viewBox="0 0 768 2800"><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><defs><g id="original-evidence"><defs xmlns="http://www.w3.org/2000/svg"><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12Z" fill="#0754b8" /></marker></defs><rect xmlns="http://www.w3.org/2000/svg" x="0" y="0" width="1672" height="941" rx="0" fill="#fff" stroke="none" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="50" y="78" font-size="47" fill="#173650" font-weight="800" text-anchor="start">Skip connection：多一條直接路徑</text><text xmlns="http://www.w3.org/2000/svg" x="50" y="127" font-size="26" fill="#087f85" font-weight="500" text-anchor="start">基本殘差塊示意 · 設定特徵值，非模型推論</text><rect xmlns="http://www.w3.org/2000/svg" x="40" y="839" width="1592" height="80" rx="12" fill="#fff3d5" stroke="#e9c878" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="65" y="872" font-size="31" fill="#173650" font-weight="700" text-anchor="start">Skip connection（跳接）跨過若干層，把輸入直接送到相加點；主路徑仍學習修正。</text><text xmlns="http://www.w3.org/2000/svg" x="40" y="171" font-size="28" fill="#173650" font-weight="800" text-anchor="start">普通塊：一條路</text><text xmlns="http://www.w3.org/2000/svg" x="358" y="171" font-size="28" fill="#173650" font-weight="800" text-anchor="start">殘差塊：兩條路</text><rect xmlns="http://www.w3.org/2000/svg" x="42" y="195" width="236" height="58" rx="12" fill="#eef5fc" stroke="#c3d5e5" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="160.0" y="234" font-size="25" fill="#173650" font-weight="700" text-anchor="middle">特徵 x = [2,1,3]</text><path xmlns="http://www.w3.org/2000/svg" d="M160,255 L160,303" fill="none" stroke="#0754b8" stroke-width="4" marker-end="url(#arrow)" /><rect xmlns="http://www.w3.org/2000/svg" x="42" y="308" width="236" height="58" rx="12" fill="#eef5fc" stroke="#c3d5e5" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="160.0" y="347" font-size="27" fill="#173650" font-weight="700" text-anchor="middle">卷積 → ReLU</text><path xmlns="http://www.w3.org/2000/svg" d="M160,368 L160,413" fill="none" stroke="#0754b8" stroke-width="4" marker-end="url(#arrow)" /><rect xmlns="http://www.w3.org/2000/svg" x="42" y="418" width="236" height="58" rx="12" fill="#eef5fc" stroke="#c3d5e5" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="160.0" y="457" font-size="28" fill="#173650" font-weight="700" text-anchor="middle">卷積</text><rect xmlns="http://www.w3.org/2000/svg" x="360" y="195" width="236" height="58" rx="12" fill="#eef5fc" stroke="#c3d5e5" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="478.0" y="234" font-size="25" fill="#173650" font-weight="700" text-anchor="middle">特徵 x = [2,1,3]</text><path xmlns="http://www.w3.org/2000/svg" d="M478,255 L478,303" fill="none" stroke="#0754b8" stroke-width="4" marker-end="url(#arrow)" /><rect xmlns="http://www.w3.org/2000/svg" x="360" y="308" width="236" height="58" rx="12" fill="#eef5fc" stroke="#c3d5e5" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="478.0" y="347" font-size="27" fill="#173650" font-weight="700" text-anchor="middle">卷積 → ReLU</text><path xmlns="http://www.w3.org/2000/svg" d="M478,368 L478,413" fill="none" stroke="#0754b8" stroke-width="4" marker-end="url(#arrow)" /><rect xmlns="http://www.w3.org/2000/svg" x="360" y="418" width="236" height="58" rx="12" fill="#eef5fc" stroke="#c3d5e5" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="478.0" y="457" font-size="28" fill="#173650" font-weight="700" text-anchor="middle">卷積</text><path xmlns="http://www.w3.org/2000/svg" d="M160,479 L160,490" fill="none" stroke="#0754b8" stroke-width="4" /><path xmlns="http://www.w3.org/2000/svg" d="M160,544 L160,563" fill="none" stroke="#0754b8" stroke-width="4" marker-end="url(#arrow)" /><rect xmlns="http://www.w3.org/2000/svg" x="42" y="572" width="236" height="58" rx="12" fill="#eef5fc" stroke="#c3d5e5" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="160.0" y="611" font-size="24" fill="#173650" font-weight="700" text-anchor="middle">學整個輸出 H(x)</text><text xmlns="http://www.w3.org/2000/svg" x="42" y="531" font-size="25" fill="#087f85" font-weight="500" text-anchor="start">必須經過全部層</text><path xmlns="http://www.w3.org/2000/svg" d="M478,479 L478,490" fill="none" stroke="#0754b8" stroke-width="4" /><path xmlns="http://www.w3.org/2000/svg" d="M478,539 L478,557" fill="none" stroke="#0754b8" stroke-width="4" marker-end="url(#arrow)" /><rect xmlns="http://www.w3.org/2000/svg" x="442" y="562" width="72" height="64" rx="32" fill="#fff3d5" stroke="#c77b20" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="478" y="607" font-size="42" fill="#173650" font-weight="800" text-anchor="middle">＋</text><path xmlns="http://www.w3.org/2000/svg" d="M595,224 L663,224" fill="none" stroke="#087f85" stroke-width="4" /><path xmlns="http://www.w3.org/2000/svg" d="M663,224 L663,594" fill="none" stroke="#087f85" stroke-width="4" /><path xmlns="http://www.w3.org/2000/svg" d="M663,594 L517,594" fill="none" stroke="#087f85" stroke-width="4" marker-end="url(#arrow)" /><text xmlns="http://www.w3.org/2000/svg" x="646" y="320" font-size="34" fill="#087f85" font-weight="800" text-anchor="middle">x</text><text xmlns="http://www.w3.org/2000/svg" x="646" y="365" font-size="25" fill="#087f85" font-weight="500" text-anchor="middle">不</text><text xmlns="http://www.w3.org/2000/svg" x="646" y="400" font-size="25" fill="#087f85" font-weight="500" text-anchor="middle">變</text><text xmlns="http://www.w3.org/2000/svg" x="365" y="521" font-size="25" fill="#b85a00" font-weight="500" text-anchor="start">F(x) = [0,2,-1]</text><path xmlns="http://www.w3.org/2000/svg" d="M478,628 L478,669" fill="none" stroke="#0754b8" stroke-width="4" marker-end="url(#arrow)" /><rect xmlns="http://www.w3.org/2000/svg" x="360" y="674" width="236" height="58" rx="12" fill="#eef5fc" stroke="#c3d5e5" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="478.0" y="713" font-size="24" fill="#173650" font-weight="700" text-anchor="middle">[2,3,2] → ReLU</text><path xmlns="http://www.w3.org/2000/svg" d="M160,632 L160,669" fill="none" stroke="#0754b8" stroke-width="4" marker-end="url(#arrow)" /><rect xmlns="http://www.w3.org/2000/svg" x="42" y="674" width="236" height="58" rx="12" fill="#eef5fc" stroke="#c3d5e5" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="160.0" y="713" font-size="25" fill="#173650" font-weight="700" text-anchor="middle">再經 ReLU</text><text xmlns="http://www.w3.org/2000/svg" x="35" y="783" font-size="27" fill="#173650" font-weight="700" text-anchor="start">若修正 F(x)=0：殘差路徑保留 [2,1,3]。</text><text xmlns="http://www.w3.org/2000/svg" x="825" y="208" font-size="36" fill="#173650" font-weight="800" text-anchor="start">為什麼叫 residual（殘差）？</text><text xmlns="http://www.w3.org/2000/svg" x="825" y="270" font-size="30" fill="#173650" font-weight="500" text-anchor="start">主路徑學「目標輸出 − 原有特徵」這筆修正。</text><text xmlns="http://www.w3.org/2000/svg" x="825" y="340" font-size="29" fill="#173650" font-weight="700" text-anchor="start">需要調整時</text><rect xmlns="http://www.w3.org/2000/svg" x="825" y="365" width="66" height="66" rx="2" fill="#7db5df" stroke="none" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="859.0" y="406.48" font-size="29" fill="#173650" font-weight="700" text-anchor="middle">2.0</text><rect xmlns="http://www.w3.org/2000/svg" x="893" y="365" width="66" height="66" rx="2" fill="#b6d6ee" stroke="none" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="927.0" y="406.48" font-size="29" fill="#173650" font-weight="700" text-anchor="middle">1.0</text><rect xmlns="http://www.w3.org/2000/svg" x="961" y="365" width="66" height="66" rx="2" fill="#4493d0" stroke="none" stroke-width="2" /><text xmlns="http://www.w3.org/2000/svg" x="995.0" y="406.48" font-size="29" fill="#173650" font-weight=