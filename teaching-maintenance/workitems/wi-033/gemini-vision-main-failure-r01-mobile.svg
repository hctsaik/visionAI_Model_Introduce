<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">同一圓接頭：JSON能解析仍可能填錯</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">左有螺絲，右是空座</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,15) scale(0.9)"><rect x="0" y="0" width="410" height="205" rx="15" fill="#34424B" stroke="#23333D" stroke-width="2"/><circle cx="112" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="112" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="300" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="300" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="112" cy="103" r="32" fill="#CAD3D8" stroke="#AAB6BD" stroke-width="3"/><line x1="89" y1="103" x2="135" y2="103" stroke="#596D79" stroke-width="6"/><line x1="112" y1="80" x2="112" y2="126" stroke="#596D79" stroke-width="6"/></g><rect x="220" y="36" width="139" height="150" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="20" y="273" font-size="32" fill="#1765CA" font-weight="700" text-anchor="start">左有螺絲；右是空座</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">固定主線的同一圓接頭</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">只核對可見狀態，不從照片猜原因</text></g></g><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">反例JSON錯填右側present</text><g transform="translate(8,66) scale(0.965)"><rect x="10" y="15" width="467" height="285" rx="8" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="25" y="58" font-size="28" fill="#172B43" font-weight="600" text-anchor="start">{</text><text x="25" y="107" font-size="28" fill="#172B43" font-weight="600" text-anchor="start">  &quot;left&quot;: &quot;present&quot;,</text><text x="25" y="156" font-size="28" fill="#C6473D" font-weight="600" text-anchor="start">  &quot;right&quot;: &quot;present&quot;,</text><text x="25" y="205" font-size="28" fill="#172B43" font-weight="600" text-anchor="start">  &quot;cause&quot;: &quot;unknown&quot;</text><text x="25" y="254" font-size="28" fill="#172B43" font-weight="600" text-anchor="start">}</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">反例：JSON格式能解析</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">右側內容仍錯；作者設計回覆</text></g></g><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">分開驗格式與可見內容</text><g transform="translate(8,66) scale(0.965)"><rect x="20" y="20" width="440" height="55" rx="6" fill="white" stroke="#238854" stroke-width="2"/><text x="32" y="57" font-size="27" fill="#238854" font-weight="650" text-anchor="start">格式檢查：可解析 ✓</text><rect x="20" y="129" width="440" height="55" rx="6" fill="white" stroke="#C6473D" stroke-width="2"/><text x="32" y="166" font-size="27" fill="#C6473D" font-weight="650" text-anchor="start">內容檢查：右側填錯 ×</text><text x="25" y="269" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">右欄應記：not_visible</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">格式通過，內容仍然不通過</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">先回原圖查欄位，再交付工作結論</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">格式通過不等於內容通過，欄位要對回原圖。</text></svg>