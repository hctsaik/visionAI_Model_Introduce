 y="251" font-size="29" fill="#172B43" font-weight="400" text-anchor="middle">3Δt</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">保存片長、幀距、裁切與縮放</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">同樣幀數，不代表同樣時間長度</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同片續接，換片重設</text><g transform="translate(8,66) scale(0.965)"><rect x="20" y="20" width="190" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="115.0" y="50" font-size="26" fill="white" font-weight="700" text-anchor="middle">影片A：H/C</text><line x1="220" y1="42" x2="271" y2="42" stroke="#1765CA" stroke-width="5"/><polygon points="271.0,42.0 257.0,35.0 257.0,49.0" fill="#1765CA"/><rect x="280" y="20" width="190" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="375.0" y="50" font-size="26" fill="white" font-weight="700" text-anchor="middle">A下一段</text><line x1="30" y1="110" x2="460" y2="110" stroke="#B9D4EF" stroke-width="2"/><rect x="20" y="146" width="190" height="43" rx="12" fill="#238854" stroke="#238854" stroke-width="2"/><text x="115.0" y="176" font-size="26" fill="white" font-weight="700" text-anchor="middle">切換影片B</text><line x1="220" y1="168" x2="269" y2="168" stroke="#238854" stroke-width="5"/><polygon points="269.0,168.0 255.0,161.0 255.0,175.0" fill="#238854"/><rect x="280" y="146" width="190" height="43" rx="12" fill="#238854" stroke="#238854" stroke-width="2"/><text x="375.0" y="176" font-size="26" fill="white" font-weight="700" text-anchor="middle">初始狀態</text><text x="20" y="279" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">重設規則要與訓練方式一致</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同片續接，換片明確重設</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">不把A的狀態當B的歷史</text></g></g><line x1="384.0" y1="1461.0" x2="384.0" y2="1478.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1478.0 391.0,1464.0 377.0,1464.0" fill="#1765CA"/><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">保存狀態與任務頭版本</text><g transform="translate(8,66) scale(0.965)"><rect x="30" y="10" width="430" height="282" rx="9" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="48" y="48" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">時間與空間</text><text x="48" y="82" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">幀距／解析度／裁切</text><text x="48" y="126" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">配套權重</text><text x="48" y="160" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">ConvLSTM＋任務頭</text><text x="48" y="204" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">執行狀態</text><text x="48" y="238" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">初始化／續接／重設</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">模型與狀態策略一起交付</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">總延遲含取像、前處理及讀出</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circ