<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">同一支架的小缺口，特徵仍可能很相近</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同L支架，只改一小段邊緣</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,20) scale(0.7)"><path d="M0 0 H110 V140 H260 V220 H0 Z" fill="url(#steel)" stroke="#748A9C" stroke-width="4"/><circle cx="55" cy="62" r="23" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="209" cy="180" r="23" fill="white" stroke="#748A9C" stroke-width="3"/></g><g transform="translate(264,20) scale(0.7)"><path d="M0 0 H110 V140 H260 V160 H250 V177 H260 V220 H0 Z" fill="url(#steel)" stroke="#748A9C" stroke-width="4"/><circle cx="55" cy="62" r="23" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="209" cy="180" r="23" fill="white" stroke="#748A9C" stroke-width="3"/></g><rect x="432" y="124" width="23" height="28" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="20" y="250" font-size="29" fill="#238854" font-weight="700" text-anchor="start">完整支架</text><text x="265" y="250" font-size="29" fill="#CE7917" font-weight="700" text-anchor="start">同件小缺口</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同L支架、同孔位，只改右緣</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">細小變化可能在整圖表示中變弱</text></g></g><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">表示很近，不代表允收</text><g transform="translate(8,66) scale(0.965)"><rect x="15" y="20" width="447" height="97" rx="6" fill="white" stroke="#1765CA" stroke-width="2"/><text x="27" y="57" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">完整：[.20, .80]</text><text x="27" y="99" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">缺口：[.21, .79]</text><text x="20" y="194" font-size="35" fill="#1765CA" font-weight="700" text-anchor="start">歐氏距離 ≈ .014</text><text x="20" y="258" font-size="35" fill="#CE7917" font-weight="800" text-anchor="start">相近 ≠ 沒有缺口</text><text x="20" y="307" font-size="26" fill="#172B43" font-weight="500" text-anchor="start">作者給定反例，不是模型特徵</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">特徵相似度不是允收規格</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">僅调門檻不能補回丟失的線索</text></g></g><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">回同一缺口查可見線索</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,5) scale(1.08)"><path d="M0 0 H110 V140 H260 V160 H250 V177 H260 V220 H0 Z" fill="url(#steel)" stroke="#748A9C" stroke-width="4"/><circle cx="55" cy="62" r="23" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="209" cy="180" r="23" fill="white" stroke="#748A9C" stroke-width="3"/></g><rect x="280" y="169" width="30" height="36" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><line x1="422" y1="122" x2="310" y2="181" stroke="#CE7917" stroke-width="5"/><polygon points="310.0,181.0 325.6,180.7 319.1,168.3" fill="#CE7917"/><text x="324" y="94" font-size="28" fill="#CE7917" font-weight="700" text-anchor="start">同一缺口</text><text x="20" y="291" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">先核對原圖，再評局部方法</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">局部取樣／下游頭需另驗證</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">DINOv2不自動交出缺陷輪廓</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">相近特徵不能證明完整，先回原圖查細節。</text></svg>