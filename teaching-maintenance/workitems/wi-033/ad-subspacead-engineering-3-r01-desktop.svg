<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">SubspaceAD：保留維度就是模型設定</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">保存中心化與投影設定</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(12,15) scale(0.43)"><rect x="0" y="0" width="350" height="225" rx="8" fill="url(#steel)" stroke="#748A9C" stroke-width="2"/><circle cx="68" cy="65" r="35" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="282" cy="181" r="22" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><line x1="266" y1="133" x2="300" y2="103" stroke="#34424B" stroke-width="6"/><line x1="260" y1="142" x2="286" y2="122" stroke="#EDF2F6" stroke-width="3"/><rect x="247" y="94" width="65" height="58" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="318" y="124" font-size="31" fill="#CE7917" font-weight="700" text-anchor="start">p</text></g><text x="193" y="58" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">同一處理版本</text><rect x="15" y="130" width="464" height="50" rx="5" fill="white" stroke="#1765CA" stroke-width="2"/><text x="28" y="164" font-size="27" fill="#1765CA" font-weight="500" text-anchor="start">骨幹 / 前處理 / 正常資料</text><rect x="15" y="190" width="464" height="50" rx="5" fill="white" stroke="#1765CA" stroke-width="2"/><text x="28" y="224" font-size="27" fill="#1765CA" font-weight="500" text-anchor="start">均值 μ + 正交方向 U + 維度k</text><rect x="15" y="250" width="464" height="50" rx="5" fill="white" stroke="#1765CA" stroke-width="2"/><text x="28" y="284" font-size="27" fill="#1765CA" font-weight="500" text-anchor="start">先減μ → 投影 → 再加μ</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">本例μ=0，不是所有資料都為0</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">保存設定，才能重現局部殘差</text></g></g><line x1="543" y1="388" x2="567" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="567.0,388.0 553.0,381.0 553.0,395.0" fill="#1765CA"/><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同一x投影到保留方向</text><g transform="translate(8,66) scale(0.965)"><line x1="45" y1="280" x2="450" y2="280" stroke="#1765CA" stroke-width="4"/><line x1="45" y1="280" x2="45" y2="30" stroke="#B9D4EF" stroke-width="2"/><line x1="45" y1="280" x2="300" y2="100" stroke="#CE7917" stroke-width="5"/><polygon points="300.0,100.0 284.5,102.4 292.6,113.8" fill="#CE7917"/><line x1="300" y1="100" x2="300" y2="280" stroke="#C6473D" stroke-width="5" stroke-dasharray="7 7"/><circle cx="300" cy="100" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><circle cx="300" cy="280" r="7" fill="#238854" stroke="#238854" stroke-width="3"/><text x="280" y="65" font-size="29" fill="#CE7917" font-weight="700" text-anchor="start">x = [3, 2]</text><text x="210" y="322" font-size="29" fill="#238854" font-weight="700" text-anchor="start">投影 [3, 0]</text><line x1="282" y1="280" x2="282" y2="262" stroke="#238854" stroke-width="2"/><line x1="282" y1="262" x2="300" y2="262" stroke="#238854" stroke-width="2"/><text x="326" y="194" font-size="28" fill="#C6473D" font-weight="500" text-anchor="start">殘差2</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">垂直落回保留的正常方向</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">特徵投影，不是工件幾何投影</text></g></g><line x1="1098" y1="388" x2="1122" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="1122.0,388.0 1108.0,381.0 1108.0,395.0" fill="#1765CA"/><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">用留出集驗殘差與覆核成本</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(10,20) scale(0.6)"><rect x="0" y="0" width="350" height="225" rx="8" fill="url(#steel)" stroke="#748A9C" stroke-width="2"/><circle cx="68" cy="65" r="35" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="282" cy="181" r="22" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><line x1="266" y1="133" x2="300" y2="103" stroke="#34424B" stroke-width="6"/><line x1="260" y1="142" x2="286" y2="122" stroke="#EDF2F6" stroke-width="3"/><rect x="247" y="94" width="65" height="58" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="318" y="124" font-size="31" fill="#CE7917" font-weight="700" text-anchor="start">p</text></g><g transform="translate(265,20) scale(0.6)"><rect x="0" y="0" width="350" height="225" rx="8" fill="url(#steel)" stroke="#748A9C" stroke-width="2"/><circle cx="68" cy="65" r="35" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="282" cy="181" r="22" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/></g><text x="20" y="213" font-size="28" fill="#C6473D" font-weight="700" text-anchor="start">真缺陷：查漏檢</text><text x="270" y="213" font-size="28" fill="#238854" font-weight="700" text-anchor="start">正常：查誤報</text><text x="20" y="288" font-size="26" fill="#1765CA" font-weight="500" text-anchor="start">固定留出資料 + 門檻 + 覆核量</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">k變大需重驗正常與真缺陷</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">不只挑最低的正常擬合誤差</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">均值、方向與保留維度都必須能重現。</text></svg>