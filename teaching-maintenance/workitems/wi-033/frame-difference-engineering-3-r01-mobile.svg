<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">Frame Difference：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">相機與時間間隔要固定</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">保存前後時間与相機設定</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,5) scale(0.42)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="130" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/><text x="150" y="104" font-size="47" fill="#172B43" font-weight="700" text-anchor="start">L</text></g><text x="215" y="68" font-size="28" fill="#1765CA" font-weight="700" text-anchor="start">固定同一版本</text><rect x="20" y="128" width="440" height="54" rx="3" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="30" y="163" font-size="26" fill="#1765CA" font-weight="500" text-anchor="start">前後幀時間／固定相機</text><rect x="20" y="193" width="440" height="54" rx="3" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="30" y="228" font-size="26" fill="#1765CA" font-weight="500" text-anchor="start">曝光／ROI／灰階處理</text><rect x="20" y="258" width="440" height="54" rx="3" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="30" y="293" font-size="26" fill="#1765CA" font-weight="500" text-anchor="start">差分門檻／後處理</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">幀距影響移動距離與雙帶</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">保存時間順序以便追查</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">全畫面變亮也會有差</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,15) scale(0.85)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="130" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/></g><g transform="translate(20,175) scale(0.85)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="130" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/><rect x="0" y="0" width="440" height="165" rx="0" fill="#FFFFFF77" stroke="none" stroke-width="2"/></g><text x="330" y="55" font-size="28" fill="white" font-weight="700" text-anchor="start">前</text><text x="330" y="215" font-size="28" fill="#172B43" font-weight="700" text-anchor="start">後</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">方件不動，曝光升高也有差</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">全畫面亮起可能只是光照變化</text></g></g><line x1="384.0" y1="1461.0" x2="384.0" y2="1478.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1478.0 391.0,1464.0 377.0,1464.0" fill="#1765CA"/><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">停住物件兩幀差為0</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,15) scale(0.85)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="130" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/></g><g transform="translate(20,175) scale(0.85)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="130" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/></g><text x="330" y="55" font-size="28" fill="white" font-weight="700" text-anchor="start">前</text><text x="330" y="215" font-size="28" fill="white" font-weight="700" text-anchor="start">後</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同方件停住，兩幀位置相同</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">相鄰差分會失去靜止物件</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">不同取像條件，差異的原因也會改變。</text></svg>