<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">DINOv2：查庫必須使用相容特徵</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">正常支架建立參考庫</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(10,12) scale(0.57)"><path d="M0 0 H110 V140 H260 V220 H0 Z" fill="url(#steel)" stroke="#748A9C" stroke-width="4"/><circle cx="55" cy="62" r="23" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="209" cy="180" r="23" fill="white" stroke="#748A9C" stroke-width="3"/></g><g transform="translate(213,12) scale(0.57)"><path d="M0 0 H110 V140 H260 V220 H0 Z" fill="url(#steel)" stroke="#748A9C" stroke-width="4"/><circle cx="55" cy="62" r="23" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="209" cy="180" r="23" fill="white" stroke="#748A9C" stroke-width="3"/></g><line x1="211" y1="167" x2="211" y2="214" stroke="#1765CA" stroke-width="5"/><polygon points="211.0,214.0 218.0,200.0 204.0,200.0" fill="#1765CA"/><rect x="20" y="232" width="433" height="55" rx="6" fill="white" stroke="#1765CA" stroke-width="2"/><text x="32" y="269" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">參考庫：[.2,.8]、[.3,.7]</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">正常參考用同一骨幹抽特徵</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">兩維向量僅為距離教學例</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">待測表示查同一特徵空間</text><g transform="translate(8,66) scale(0.965)"><text x="20" y="43" font-size="32" fill="#1765CA" font-weight="700" text-anchor="start">待測 q = [.4, .6]</text><text x="20" y="111" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">r1 = [.2, .8]　距離≈.283</text><text x="20" y="175" font-size="28" fill="#238854" font-weight="700" text-anchor="start">r2 = [.3, .7]　距離≈.141</text><line x1="237" y1="206" x2="237" y2="239" stroke="#1765CA" stroke-width="5"/><polygon points="237.0,239.0 244.0,225.0 230.0,225.0" fill="#1765CA"/><text x="30" y="294" font-size="29" fill="#238854" font-weight="700" text-anchor="start">最近：r2；距離不是缺陷率</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同一特徵空間的歐氏距離例</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">換骨幹或前處理，庫也須重驗</text></g></g><line x1="384.0" y1="1461.0" x2="384.0" y2="1478.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1478.0 391.0,1464.0 377.0,1464.0" fill="#1765CA"/><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">把排名與原圖一起核對</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(10,15) scale(0.7)"><path d="M0 0 H110 V140 H260 V220 H0 Z" fill="url(#steel)" stroke="#748A9C" stroke-width="4"/><circle cx="55" cy="62" r="23" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="209" cy="180" r="23" fill="white" stroke="#748A9C" stroke-width="3"/></g><g transform="translate(278,15) scale(0.7)"><path d="M0 0 H110 V140 H260 V220 H0 Z" fill="url(#steel)" stroke="#748A9C" stroke-width="4"/><circle cx="55" cy="62" r="23" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="209" cy="180" r="23" fill="white" stroke="#748A9C" stroke-width="3"/></g><text x="20" y="227" font-size="29" fill="#1765CA" font-weight="500" text-anchor="start">待測支架</text><text x="274" y="227" font-size="29" fill="#238854" font-weight="500" text-anchor="start">最近參考</text><text x="20" y="302" font-size="30" fill="#172B43" font-weight="500" text-anchor="start">先核對孔位、表面與條件</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">保留原圖和參考來源便於覆核</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">沒有像素標註就不能宣稱輪廓精度</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">換骨幹或前處理，舊庫不能直接混用。</text></svg>