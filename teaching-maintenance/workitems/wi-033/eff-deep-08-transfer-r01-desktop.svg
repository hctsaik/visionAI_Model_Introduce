<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">需求從可疑位置變成刮痕面積</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">目前：只有正常影像</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,10) scale(0.72)"><rect x="0" y="0" width="210" height="230" rx="13" fill="#CAD8E4" stroke="#71899F" stroke-width="2"/><text x="38" y="37" font-size="28" fill="#172B43" font-weight="700" text-anchor="start">A-01</text><line x1="22" y1="24" x2="22" y2="52" stroke="#172B43" stroke-width="4"/><line x1="13" y1="33" x2="31" y2="33" stroke="#172B43" stroke-width="4"/><circle cx="63" cy="85" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="149" cy="85" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="63" cy="172" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="149" cy="172" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/></g><g transform="translate(292,10) scale(0.72)"><rect x="0" y="0" width="210" height="230" rx="13" fill="#CAD8E4" stroke="#71899F" stroke-width="2"/><text x="38" y="37" font-size="28" fill="#172B43" font-weight="700" text-anchor="start">A-01</text><line x1="22" y1="24" x2="22" y2="52" stroke="#172B43" stroke-width="4"/><line x1="13" y1="33" x2="31" y2="33" stroke="#172B43" stroke-width="4"/><circle cx="63" cy="85" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="149" cy="85" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="63" cy="172" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="149" cy="172" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/></g><text x="15" y="279" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">確認正常樣本，涵蓋允收變化</text><text x="15" y="327" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">用於學生與AE訓練</text><text x="15" y="375" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">不是全部未知樣本都已涵蓋</text></g></g><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">先篩查：找可疑位置</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(140,5) scale(1.05)"><rect x="0" y="0" width="210" height="230" rx="13" fill="#CAD8E4" stroke="#71899F" stroke-width="2"/><text x="38" y="37" font-size="28" fill="#172B43" font-weight="700" text-anchor="start">A-01</text><line x1="22" y1="24" x2="22" y2="52" stroke="#172B43" stroke-width="4"/><line x1="13" y1="33" x2="31" y2="33" stroke="#172B43" stroke-width="4"/><circle cx="63" cy="85" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="149" cy="85" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="63" cy="172" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="149" cy="172" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><line x1="107" y1="187" x2="125" y2="211" stroke="#B54F46" stroke-width="7"/></g><rect x="241" y="190" width="45" height="43" rx="0" fill="#F7C886" stroke="#CE7917" stroke-width="2"/><text x="15" y="290" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">正常訓練 → 可疑位置線索</text><text x="15" y="338" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">幫人找到該看的區域</text><text x="15" y="386" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">不直接交付缺陷類別或輪廓</text></g></g><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">改要面積：輪廓與校正</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,12) scale(0.65)"><rect x="0" y="0" width="210" height="230" rx="13" fill="#CAD8E4" stroke="#71899F" stroke-width="2"/><text x="38" y="37" font-size="28" fill="#172B43" font-weight="700" text-anchor="start">A-01</text><line x1="22" y1="24" x2="22" y2="52" stroke="#172B43" stroke-width="4"/><line x1="13" y1="33" x2="31" y2="33" stroke="#172B43" stroke-width="4"/><circle cx="63" cy="85" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="149" cy="85" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="63" cy="172" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="149" cy="172" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><line x1="107" y1="187" x2="125" y2="211" stroke="#B54F46" stroke-width="7"/></g><line x1="165" y1="95" x2="220" y2="95" stroke="#1765CA" stroke-width="5"/><polygon points="220.0,95.0 206.0,88.0 206.0,102.0" fill="#1765CA"/><rect x="231" y="65" width="240" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="351.0" y="95" font-size="26" fill="white" font-weight="700" text-anchor="middle">輪廓標註</text><line x1="347" y1="120" x2="347" y2="166" stroke="#1765CA" stroke-width="5"/><polygon points="347.0,166.0 354.0,152.0 340.0,152.0" fill="#1765CA"/><rect x="231" y="181" width="240" height="43" rx="12" fill="#238854" stroke="#238854" stroke-width="2"/><text x="351.0" y="211" font-size="26" fill="white" font-weight="700" text-anchor="middle">分割驗證</text><text x="15" y="287" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">像素面積不直接等於平方毫米</text><text x="15" y="335" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">實體尺度需校正与誤差驗證</text><text x="15" y="383" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">資料與驗收隨需求更新</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">需求改變時，資料、輸出與驗收也要改。</text></svg>