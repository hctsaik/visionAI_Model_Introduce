 cx="337" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><line x1="266" y1="133" x2="300" y2="103" stroke="#34424B" stroke-width="6"/><line x1="260" y1="142" x2="286" y2="122" stroke="#EDF2F6" stroke-width="3"/><rect x="247" y="94" width="65" height="58" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="318" y="124" font-size="31" fill="#CE7917" font-weight="700" text-anchor="start">p</text></g><text x="215" y="68" font-size="28" fill="#1765CA" font-weight="700" text-anchor="start">固定同一版本</text><rect x="20" y="128" width="440" height="54" rx="3" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="30" y="163" font-size="26" fill="#1765CA" font-weight="500" text-anchor="start">骨幹＋MLP＋解碼器</text><rect x="20" y="193" width="440" height="54" rx="3" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="30" y="228" font-size="26" fill="#1765CA" font-weight="500" text-anchor="start">取用層／分組／前處理</text><rect x="20" y="258" width="440" height="54" rx="3" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="30" y="293" font-size="26" fill="#1765CA" font-weight="500" text-anchor="start">eval／評分／門檻</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">分組和權重共同版本化</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">改分組也須重驗留出資料</text></g></g><line x1="1098" y1="388" x2="1122" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="1122.0,388.0 1108.0,381.0 1108.0,395.0" fill="#1765CA"/><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" 