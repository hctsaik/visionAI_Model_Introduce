<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">ByteTrack：幀率與丟失緩衝要配套</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">保存偵測與關聯設定</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,5) scale(0.42)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="130" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/><text x="150" y="104" font-size="47" fill="#172B43" font-weight="700" text-anchor="start">L</text></g><text x="215" y="68" font-size="28" fill="#1765CA" font-weight="700" text-anchor="start">固定同一版本</text><rect x="20" y="128" width="440" height="54" rx="3" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="30" y="163" font-size="26" fill="#1765CA" font-weight="500" text-anchor="start">偵測器／分數與匹配門檻</text><rect x="20" y="193" width="440" height="54" rx="3" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="30" y="228" font-size="26" fill="#1765CA" font-weight="500" text-anchor="start">有效幀率／丟失緩衝</text><rect x="20" y="258" width="440" height="54" rx="3" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="30" y="293" font-size="26" fill="#1765CA" font-weight="500" text-anchor="start">計數線／方向／重複規則</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">場景切換時重置不相關軌跡</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">按完整影片驗證斷軌與誤計數</text></g></g><line x1="543" y1="388" x2="567" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="567.0,388.0 553.0,381.0 553.0,395.0" fill="#1765CA"/><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同樣緩衝幀數，時間不同</text><g transform="translate(8,66) scale(0.965)"><text x="25" y="42" font-size="30" fill="#1765CA" font-weight="700" text-anchor="start">給定有效緩衝：30幀</text><rect x="15" y="90" width="220" height="72" rx="6" fill="white" stroke="#1765CA" stroke-width="2"/><text x="27" y="120" font-size="25" fill="#1765CA" font-weight="700" text-anchor="start">30fps</text><text x="27" y="150" font-size="27" fill="#1765CA" font-weight="500" text-anchor="start">30 / 30 = 1秒</text><rect x="250" y="90" width="220" height="72" rx="6" fill="white" stroke="#CE7917" stroke-width="2"/><text x="262" y="120" font-size="25" fill="#CE7917" font-weight="700" text-anchor="start">10fps</text><text x="262" y="150" font-size="27" fill="#CE7917" font-weight="500" text-anchor="start">30 / 10 = 3秒</text><text x="25" y="256" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">核對實作是否按fps縮放</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">相同幀數不等於相同秒數</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">示意有效幀數，不套用預設參數</text></g></g><line x1="1098" y1="388" x2="1122" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="1122.0,388.0 1108.0,381.0 1108.0,395.0" fill="#1765CA"/><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">遮擋回來可能換ID</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.9)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="130" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/><text x="150" y="104" font-size="47" fill="#172B43" font-weight="700" text-anchor="start">L</text></g><text x="25" y="215" font-size="27" fill="#CE7917" font-weight="700" text-anchor="start">ID7 → 遮擋超期 → 新ID12</text><text x="25" y="284" font-size="29" fill="#C6473D" font-weight="700" text-anchor="start">同物件可能被誤當第二件</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同L標記物件仍可能換ID</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">需用完整影片查重複计數</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">驗完整影片的斷軌與重複計數。</text></svg>