<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">沒有可靠對應，兩種光流都要核對</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">共用兩組影格：清楚／反光</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(0,0) scale(0.9)"><g transform="translate(8,55) scale(1)"><rect x="0" y="0" width="190" height="175" rx="10" fill="#D6E0E9" stroke="#8399AD" stroke-width="2"/><circle cx="13" cy="13" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="177" cy="13" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="13" cy="162" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="177" cy="162" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><path d="M55,35 v75 h75" fill="none" stroke="#243548" stroke-width="20"/></g><g transform="translate(285,55) scale(1)"><rect x="0" y="0" width="190" height="175" rx="10" fill="#D6E0E9" stroke="#8399AD" stroke-width="2"/><circle cx="13" cy="13" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="177" cy="13" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="13" cy="162" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/