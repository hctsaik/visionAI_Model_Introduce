th="5"/><polygon points="265.0,138.0 251.0,131.0 251.0,145.0" fill="#1765CA"/></g><text x="185" y="209" font-size="26" fill="#238854" font-weight="500" text-anchor="start">清楚</text><text x="185" y="401" font-size="26" fill="#CE7917" font-weight="500" text-anchor="start">只改反光</text></g></g><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">LK：兩條件都檢查點對</text><g transform="translate(8,66) scale(0.965)"><rect x="15" y="20" width="200" height="43" rx="12" fill="#238854" stroke="#238854" stroke-width="2"/><text x="115.0" y="50" font-size="26" fill="white" font-weight="700" text-anchor="middle">清楚組</text><line x1="225" y1="43" x2="285" y2="43" stroke="#1765CA" stroke-width="5"/><polygon points="285.0,43.0 271.0,36.0 271.0,50.0" fill="#1765CA"/><text x="305" y="55" font-size="33" fill="#172B43" font-weight="500" text-anchor="start">點對</text><rect x="15" y="152" width="200" height="43" rx="12" fill="#CE7917" stroke="#CE7917" stroke-width="2"/><text x="115.0" y="182" font-size="26" fill="white" font-weight="700" text-anchor="middle">反光組</text><line x1="225" y1="175" x2="285" y2="175" stroke="#1765CA" stroke-width="5"/><polygon points="285.0,175.0 271.0,168.0 271.0,182.0" fill="#1765CA"/><text x="305" y="187" font-size="33" fill="#172B43" font-weight="500" text-anchor="start">點對</text><text x="15" y="284" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">兩組都跑，不只挑有利條件</text><text x="15" y="332" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">核對原圖、錯誤與可用覆蓋</text><text x="15" y="380" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">未實測；不替任一方法判勝</text></g></g><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">RAFT：兩條件都檢查向量</text><g transform="translate(8,66) scale(0.965)"><rect x="15" y="20" width="200" height="43" rx="12" fill="#238854" stroke="#238854" stroke-width="2"/><text x="115.0" y="50" font-size="26" fill="white" font-weight="700" text-anchor="middle">清楚組</text><line x1="225" y1="43" x2="285" y2="43" stroke="#1765CA" stroke-width="5"/><polygon points="285.0,43.0 271.0,36.0 271.0,50.0" fill="#1765CA"/><text x="305" y="55" font-size="33" fill="#172B43" font-weight="500" text-anchor="start">位移場</text><rect x="15" y="152" width="200" height="43" rx="12" fill="#CE7917" stroke="#CE7917" stroke-width="2"/><text x="115.0" y="182" font-size="26" fill="white" font-weight="700" text-anchor="middle">反光組</text><line x1="225" y1="175" x2="285" y2="175" stroke="#1765CA" stroke-width="5"/><polygon points="285.0,175.0 271.0,168.0 271.0,182.0" fill="#1765CA"/><text x="305" y="187" font-size="33" fill="#172B43" font-weight="500" text-anchor="start">位移場</text><text x="15" y="284" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">兩組都跑，不只挑有利條件</text><text x="15" y="332" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">核對原圖、錯誤與可用覆蓋</text><text x="15" y="380" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">未實測；不替任一方法判勝</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">LK與RAFT都看相同輸入；數值不能補回不可見對應。</text></svg>