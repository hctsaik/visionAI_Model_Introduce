<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">LLaVA：影像與問題共同形成回答</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">固定同接頭及檢查問題</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,15) scale(0.85)"><rect x="0" y="0" width="410" height="205" rx="15" fill="#34424B" stroke="#23333D" stroke-width="2"/><circle cx="112" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="112" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="300" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="300" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="112" cy="103" r="32" fill="#CAD3D8" stroke="#AAB6BD" stroke-width="3"/><line x1="89" y1="103" x2="135" y2="103" stroke="#596D79" stroke-width="6"/><line x1="112" y1="80" x2="112" y2="126" stroke="#596D79" stroke-width="6"/></g><line x1="192" y1="204" x2="192" y2="242" stroke="#1765CA" stroke-width="5"/><polygon points="192.0,242.0 199.0,228.0 185.0,228.0" fill="#1765CA"/><rect x="24" y="259" width="400" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="224.0" y="289" font-size="26" fill="white" font-weight="700" text-anchor="middle">視覺編碼器 → 影像表示</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">左座有螺絲，右座未見螺絲</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">固定同一照片，保留可見證據</text></g></g><line x1="543" y1="388" x2="567" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="567.0,388.0 553.0,381.0 553.0,395.0" fill="#1765CA"/><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">影像投影與文字共同輸入</text><g transform="translate(8,66) scale(0.965)"><text x="20" y="45" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">影像表示 [a, b, …]</text><line x1="218" y1="65" x2="218" y2="104" stroke="#1765CA" stroke-width="5"/><polygon points="218.0,104.0 225.0,90.0 211.0,90.0" fill="#1765CA"/><rect x="25" y="117" width="400" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="225.0" y="147" font-size="26" fill="white" font-weight="700" text-anchor="middle">原版：學習線性投影</text><line x1="218" y1="170" x2="218" y2="203" stroke="#1765CA" stroke-width="5"/><polygon points="218.0,203.0 225.0,189.0 211.0,189.0" fill="#1765CA"/><text x="20" y="244" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">視覺token＋「哪邊有螺絲？」</text><text x="20" y="300" font-size="31" fill="#238854" font-weight="700" text-anchor="start">→ 語言模型輸入空間</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">投影橋接不同表示空間</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">示意向量長度不是實際維度</text></g></g><line x1="1098" y1="388" x2="1122" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="1122.0,388.0 1108.0,381.0 1108.0,395.0" fill="#1765CA"/><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">回答再對照可見部位</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(25,12) scale(0.66)"><rect x="0" y="0" width="410" height="205" rx="15" fill="#34424B" stroke="#23333D" stroke-width="2"/><circle cx="112" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="112" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="300" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="300" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="112" cy="103" r="32" fill="#CAD3D8" stroke="#AAB6BD" stroke-width="3"/><line x1="89" y1="103" x2="135" y2="103" stroke="#596D79" stroke-width="6"/><line x1="112" y1="80" x2="112" y2="126" stroke="#596D79" stroke-width="6"/></g><text x="22" y="204" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">左側 → 可見 → 螺絲</text><text x="22" y="254" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">右側 → 未見 → 螺絲</text><text x="22" y="301" font-size="29" fill="#CE7917" font-weight="700" text-anchor="start">原因：未知</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">逐token回答仍可能犯錯</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">空座不能證明漏裝或鬆脫原因</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">可見描述與原因推測要分開交付。</text></svg>