<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">Gemini Vision：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">交付可以核對的欄位</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同接頭加上檢查問題</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,8) scale(0.87)"><rect x="0" y="0" width="410" height="205" rx="15" fill="#34424B" stroke="#23333D" stroke-width="2"/><circle cx="112" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="112" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="300" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="300" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="112" cy="103" r="32" fill="#CAD3D8" stroke="#AAB6BD" stroke-width="3"/><line x1="89" y1="103" x2="135" y2="103" stroke="#596D79" stroke-width="6"/><line x1="112" y1="80" x2="112" y2="126" stroke="#596D79" stroke-width="6"/></g><rect x="20" y="225" width="437" height="55" rx="6" fill="white" stroke="#1765CA" stroke-width="2"/><text x="32" y="262" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">問題：哪一側未見螺絲？</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">影像與檢查問題一起定義任務</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">問題需能由可見部位支持</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">先定義左右與原因欄位</text><g transform="translate(8,66) scale(0.965)"><rect x="20" y="15" width="437" height="139" rx="6" fill="white" stroke="#1765CA" stroke-width="2"/><text x="32" y="52" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">left：可見狀態</text><text x="32" y="94" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">right：可見狀態</text><text x="32" y="136" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">cause：已知原因或unknown</text><text x="25" y="226" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">逐欄定義要交付的內容</text><text x="25" y="289" font-size="29" fill="#172B43" font-weight="500" text-anchor="start">先定欄位，再對照原圖</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">這是欄位設計，不是API回覆</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">格式有規格，內容仍須另外核對</text></g></g><line x1="384.0" y1="1461.0" x2="384.0" y2="1478.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1478.0 391.0,1464.0 377.0,1464.0" fill="#1765CA"/><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">回原圖核對可見內容</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,5) scale(0.72)"><rect x="0" y="0" width="410" height="205" rx="15" fill="#34424B" stroke="#23333D" stroke-width="2"/><circle cx="112" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="112" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="300" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="300" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="112" cy="103" r="32" fill="#CAD3D8" stroke="#AAB6BD" stroke-width="3"/><line x1="89" y1="103" x2="135" y2="103" stroke="#596D79" stroke-width="6"/><line x1="112" y1="80" x2="112" y2="126" stroke="#596D79" stroke-width="6"/></g><line x1="94" y1="160" x2="94" y2="201" stroke="#1765CA" stroke-width="5"/><polygon points="94.0,201.0 101.0,187.0 87.0,187.0" fill="#1765CA"/><line x1="231" y1="160" x2="326" y2="201" stroke="#CE7917" stroke-width="5"/><polygon points="326.0,201.0 315.9,189.0 310.4,201.9" fill="#CE7917"/><rect x="15" y="215" width="208" height="55" rx="6" fill="white" stroke="#1765CA" stroke-width="2"/><text x="27" y="252" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">左：有螺絲</text><rect x="248" y="215" width="221" height="55" rx="6" fill="white" stroke="#CE7917" stroke-width="2"/><text x="260" y="252" font-size="27" fill="#CE7917" font-weight="650" text-anchor="start">右：未見</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">先逐側對照影像可見內容</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">此圖是證據關係，不是模型熱點</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">要求欄位能幫助核對，但不保證內容正確。</text></svg>