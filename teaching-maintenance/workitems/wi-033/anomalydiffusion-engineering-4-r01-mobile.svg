<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">AnomalyDiffusion：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">兩個遮罩只長一傷</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">條件指定左大右小兩區</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.9)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><rect x="54.0" y="126.5" width="92" height="65" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/><rect x="253.0" y="169.0" width="54" height="34" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/></g><text x="20" y="285" font-size="30" fill="#1765CA" font-weight="700" text-anchor="start">指定兩區 ≠ 已觀測到兩傷</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">大左下、小右下是生成条件</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">必須回頭看實際產出的影像</text></g></g><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">反例只生成左側刮傷</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.9)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><rect x="54.0" y="126.5" width="92" height="65" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/><line x1="62.0" y1="184.5" x2="138.0" y2="133.5" stroke="#253846" stroke-width="5"/><line x1="67.0" y1="188.5" x2="143.0" y2="135.5" stroke="white" stroke-width="2"/><rect x="253.0" y="169.0" width="54" height="34" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/></g><circle cx="272" cy="187" r="32" fill="none" stroke="#CE7917" stroke-width="3"/><text x="20" y="285" font-size="29" fill="#CE7917" font-weight="700" text-anchor="start">右側只有mask，沒有刮傷</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">若保留雙傷標註，就會錯標</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">本圖為作者失敗示意</text></g></g><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">剔除或修標，再驗訓練效益</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.58)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><rect x="54.0" y="126.5" width="92" height="65" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/><line x1="62.0" y1="184.5" x2="138.0" y2="133.5" stroke="#253846" stroke-width="5"/><line x1="67.0" y1="188.5" x2="143.0" y2="135.5" stroke="white" stroke-width="2"/><rect x="253.0" y="169.0" width="54" height="34" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/></g><line x1="256" y1="38" x2="449" y2="162" stroke="#C6473D" stroke-width="6"/><line x1="449" y1="38" x2="256" y2="162" stroke="#C6473D" stroke-width="6"/><text x="20" y="229" font-size="29" fill="#C6473D" font-weight="700" text-anchor="start">剔除，或按可見傷修正標註</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">修正後仍要驗證真實資料效益</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">自適應引導不是免審保證</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">未生成的區域，不能沿用缺陷標籤。</text></svg>