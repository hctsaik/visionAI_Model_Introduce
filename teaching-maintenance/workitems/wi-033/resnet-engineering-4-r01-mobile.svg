<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">ResNet：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">背景變了，分類依據仍要成立</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同件放在兩種背景</text><g transform="translate(8,66) scale(0.965)"><rect x="12" y="22" width="220" height="186" rx="6" fill="#E5E7EB" stroke="none" stroke-width="2"/><rect x="261" y="22" width="220" height="186" rx="6" fill="#DDEAD7" stroke="none" stroke-width="2"/><g transform="translate(29,46) scale(0.7)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/><path d="M137,50 l-12,18 18,11 -11,20" stroke="#B94C42" stroke-width="6" fill="none"/></g><g transform="translate(278,46) scale(0.7)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/><path d="M137,50 l-12,18 18,11 -11,20" stroke="#B94C42" stroke-width="6" fill="none"/></g><text x="15" y="271" font-size="32" fill="#1765CA" font-weight="700" text-anchor="start">工件不變，只改背景</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">缺陷仍是同一條刮傷</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">比較兩張是否被分到同一類</text></g></g><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">分類器只給整件類別</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(12,12) scale(0.61)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/><path d="M137,50 l-12,18 18,11 -11,20" stroke="#B94C42" stroke-width="6" fill="none"/></g><text x="230" y="60" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">整圖分類</text><g transform="translate(0,126) scale(0.93)"><text x="15" y="45" font-size="29" fill="#172B43" font-weight="500" text-anchor="start">完整</text><rect x="150" y="18" width="250" height="30" rx="3" fill="#E4EDF7" stroke="none" stroke-width="2"/><rect x="150" y="18" width="45.0" height="30" rx="3" fill="#1765CA" stroke="none" stroke-width="2"/><text x="420" y="45" font-size="27" fill="#1765CA" font-weight="500" text-anchor="start">0.18</text><text x="15" y="145" font-size="29" fill="#172B43" font-weight="500" text-anchor="start">刮傷</text><rect x="150" y="118" width="250" height="30" rx="3" fill="#E4EDF7" stroke="none" stroke-width="2"/><rect x="150" y="118" width="205.0" height="30" rx="3" fill="#8AB2DE" stroke="none" stroke-width="2"/><text x="420" y="145" font-size="27" fill="#1765CA" font-weight="500" text-anchor="start">0.82</text></g><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">整件類別，沒有刮傷座標</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">教學给定分數；不是位置圖</text></g></g><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">需要位置時比較分割</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(40,30) scale(1)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/><path d="M137,50 l-12,18 18,11 -11,20" stroke="#B94C42" stroke-width="6" fill="none"/></g><rect x="156" y="77" width="31" height="57" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="15" y="257" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">像素標註 → 分割訓練</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">需要位置，另評像素輸出</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">多付標註成本；仍需誤差驗證</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">同件換背景測捷徑，定位需求另選位置輸出。</text></svg>