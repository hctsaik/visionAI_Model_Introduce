<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">Keypoint R-CNN：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">先找物件，再找具名點</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">支架A缺口、B/C孔心</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(40,50) scale(1.1)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/><circle cx="95" cy="0" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="105" y="-10" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">A</text><circle cx="60" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="70" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">B</text><circle cx="190" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="200" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">C</text></g><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">A是缺口角，B/C是具名孔心</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">自訂工件需定義並標註點名</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">每件ROI保留相對位置</text><g transform="translate(8,66) scale(0.965)"><rect x="10" y="10" width="466" height="261" rx="10" fill="white" stroke="#B9D4EF" stroke-width="2"/><g transform="translate(107.5,100) scale(0.5)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/><circle cx="95" cy="0" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="105" y="-10" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">A</text><circle cx="60" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="70" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">B</text><circle cx="190" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="200" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">C</text></g><rect x="100" y="50" width="200" height="160" rx="0" fill="none" stroke="#1765CA" stroke-width="2"/><text x="17" y="301" font-size="28" fill=