<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">相鄰差分與背景相減：參考不同</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同一方件已停住</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,15) scale(0.85)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="130" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/></g><g transform="translate(20,175) scale(0.85)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="130" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/></g><text x="330" y="55" font-size="28" fill="white" font-weight="700" text-anchor="start">前</text><text x="330" y="215" font-size="28" fill="white" font-weight="700" text-anchor="start">後</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同方件停住，兩幀位置相同</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">相鄰差分會失去靜止物件</text></g></g><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">前後相同：相鄰差為0</text><g transform="translate(8,66) scale(0.965)"><text x="25" y="42" font-size="30" fill="#1765CA" font-weight="700" text-anchor="start">同位置前後值相同</text><rect x="25" y="65" width="80" height="54" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><text x="65" y="101" font-size="27" fill="#1765CA" font-weight="700" text-anchor="middle">20</text><rect x="110" y="65" width="80" height="54" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><text x="150" y="101" font-size="27" fill="#1765CA" font-weight="700" text-anchor="middle">100</text><rect x="195" y="65" width="80" height="54" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><text x="235" y="101" font-size="27" fill="#1765CA" font-weight="700" text-anchor="middle">100</text><rect x="280" y="65" width="80" height="54" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><text x="320" y="101" font-size="27" fill="#1765CA" font-weight="700" text-anchor="middle">100</text><rect x="365" y="65" width="80" height="54" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><text x="405" y="101" font-size="27" fill="#1765CA" font-weight="700" text-anchor="middle">20</text><rect x="25" y="145" width="80" height="54" rx="1" fill="#E3EEF9" stroke="#238854" stroke-width="2"/><text x="65" y="181" font-size="27" fill="#238854" font-weight="700" text-anchor="middle">20</text><rect x="110" y="145" width="80" height="54" rx="1" fill="#E3EEF9" stroke="#238854" stroke-width="2"/><text x="150" y="181" font-size="27" fill="#238854" font-weight="700" text-anchor="middle">100</text><rect x="195" y="145" width="80" height="54" rx="1" fill="#E3EEF9" stroke="#238854" stroke-width="2"/><text x="235" y="181" font-size="27" fill="#238854" font-weight="700" text-anchor="middle">100</text><rect x="280" y="145" width="80" height="54" rx="1" fill="#E3EEF9" stroke="#238854" stroke-width="2"/><text x="320" y="181" font-size="27" fill="#238854" font-weight="700" text-anchor="middle">100</text><rect x="365" y="145" width="80" height="54" rx="1" fill="#E3EEF9" stroke="#238854" stroke-width="2"/><text x="405" y="181" font-size="27" fill="#238854" font-weight="700" text-anchor="middle">20</text><text x="25" y="261" font-size="30" fill="#CE7917" font-weight="700" text-anchor="start">差 = [0, 0, 0, 0, 0]</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">全零差分不代表現場空無一物</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">靜止物件仍在原影格</text></g></g><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">相對舊背景仍可能是前景</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,15) scale(0.49)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/></g><g transform="translate(255,15) scale(0.49)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="160" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/></g><text x="50" y="125" font-size="26" fill="#1765CA" font-weight="700" text-anchor="start">累積背景</text><text x="282" y="125" font-size="26" fill="#CE7917" font-weight="700" text-anchor="start">目前有方件</text><line x1="105" y1="140" x2="170" y2="172" stroke="#1765CA" stroke-width="5"/><polygon points="170.0,172.0 160.5,159.5 154.3,172.1" fill="#1765CA"/><line x1="370" y1="140" x2="290" y2="172" stroke="#1765CA" stroke-width="5"/><polygon points="290.0,172.0 305.6,173.3 300.4,160.3" fill="#1765CA"/><g transform="translate(55,182) scale(0.8)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#15222F" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="160" y="40" width="85" height="85" rx="1" fill="white" stroke="#DAE1E7" stroke-width="2"/></g><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同位置比較，方件形成前景</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">不是只和上一張影格相減</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">同件停住，兩方法的時間記憶不同。</text></svg>