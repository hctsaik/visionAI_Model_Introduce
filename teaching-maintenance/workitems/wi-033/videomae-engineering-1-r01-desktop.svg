ke="#172B43" stroke-width="13"/><line x1="84" y1="93" x2="96" y2="93" stroke="#172B43" stroke-width="9"/><line x1="136" y1="93" x2="124" y2="93" stroke="#172B43" stroke-width="9"/></g><line x1="224" y1="90" x2="272" y2="90" stroke="#1765CA" stroke-width="5"/><polygon points="272.0,90.0 258.0,83.0 258.0,97.0" fill="#1765CA"/><rect x="290" y="69" width="180" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="380.0" y="99" font-size="26" fill="white" font-weight="700" text-anchor="middle">任務輸出</text><text x="270" y="186" font-size="29" fill="#CE7917" font-weight="700" text-anchor="start">示意：失敗</text><text x="20" y="276" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">保留片段與時間 → 人員覆核</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">類別是下游頭的輸出</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">非本輪真實影片推論結果</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">預訓練學表示，標註任務教答案。</text></svg>