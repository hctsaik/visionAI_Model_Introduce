<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">VideoMAE：預訓練與分類分工</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">未標註影片遮蔽重建</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.8)"><rect x="0" y="0" width="220" height="175" rx="5" fill="#E4EBF1" stroke="#73899E" stroke-width="2"/><rect x="72" y="117" width="76" height="44" rx="2" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><rect x="72" y="10" width="76" height="35" rx="2" fill="#172B43" stroke="#172B43" stroke-width="2"/><line x1="71" y1="34" x2="71" y2="98" stroke="#172B43" stroke-width="13"/><line x1="149" y1="34" x2="149" y2="98" stroke="#172B43" stroke-width="13"/><line x1="71" y1="98" x2="82" y2="98" stroke="#172B43" stroke-width="9"/><line x1="149" y1="98" x2="138" y2="98" stroke="#172B43" stroke-width="9"/></g><rect x="50" y="68" width="60" height="60" rx="1" fill="#9BABB9" stroke="white" stroke-width="2"/><line x1="215" y1="89" x2="271" y2="89" stroke="#1765CA" stroke-width="5"/><polygon points="271.0,89.0 257.0,82.0 257.0,96.0" fill="#1765CA"/><rect x="285" y="67" width="180" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="375.0" y="97" font-size="26" fill="white" font-weight="700" text-anchor="middle">重建預訓練</text><text x="20" y="226" font-size="30" fill="#1765CA" font-weight="700" text-anchor="start">目標：被遮住的原像素</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">原影片提供自監督訊號</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">此時沒有教夾取成功的標籤</text></g></g><line x1="543" y1="388" x2="567" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="567.0,388.0 553.0,381.0 553.0,395.0" fill="#1765CA"/><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">標註影片訓練分類頭</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.8)"><rect x="0" y="0" width="220" height="175" rx="5" fill="#E4EBF1" stroke="#73899E" stroke-width="2"/><rect x="72" y="117" width="76" height="44" rx="2" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><rect x="72" y="10" width="76" height="35" rx="2" fill="#172B43" stroke="#172B43" stroke-width="2"/><line x1="73" y1="34" x2="73" y2="127" stroke="#172B43" stroke-width="13"/><line x1="147" y1="34" x2="147" y2="127" stroke="#172B43" stroke-width="13"/><line x1="73" y1="127" x2="84" y2="127" stroke="#172B43" stroke-width="9"/><line x1="147" y1="127" x2="136" y2="127" stroke="#172B43" stroke-width="9"/></g><text x="20" y="201" font-size="28" fill="#238854" font-weight="500" text-anchor="start">影片標籤：成功</text><line x1="215" y1="82" x2="268" y2="82" stroke="#1765CA" stroke-width="5"/><polygon points="268.0,82.0 254.0,75.0 254.0,89.0" fill="#1765CA"/><rect x="285" y="60" width="180" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"