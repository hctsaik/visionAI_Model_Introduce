<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">ByteTrack：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">低分框要有配對證據</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">ID7的低分框可接現有軌跡</text><g transform="translate(8,66) scale(0.965)"><text x="20" y="30" font-size="28" fill="#1765CA" font-weight="700" text-anchor="start">第一輪：高分框配現有軌跡</text><rect x="25" y="52" width="72" height="67" rx="0" fill="none" stroke="#238854" stroke-width="2"/><rect x="32" y="58" width="72" height="67" rx="0" fill="none" stroke="#1765CA" stroke-width="2"/><line x1="125" y1="83" x2="220" y2="83" stroke="#1765CA" stroke-width="5"/><polygon points="220.0,83.0 206.0,76.0 206.0,90.0" fill="#1765CA"/><text x="240" y="91" font-size="29" fill="#238854" font-weight="700" text-anchor="start">已配對</text><text x="20" y="168" font-size="28" fill="#CE7917" font-weight="700" text-anchor="start">第二輪：剩餘軌跡配低分框</text><rect x="25" y="190" width="72" height="67" rx="0" fill="none" stroke="#238854" stroke-width="2"/><rect x="32" y="196" width="72" height="67" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="47" y="240" font-size="35" fill="#172B43" font-weight="700" text-anchor="start">L</text><line x1="125" y1="223" x2="220" y2="223" stroke="#1765CA" stroke-width="5"/><polygon points="220.0,223.0 206.0,216.0 206.0,230.0" fill="#1765CA"/><text x="240" y="234" font-size="29" fill="#238854" font-weight="700" text-anchor="start">續接ID7</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">先高再低，低分仍需位置依據</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">孤立低分框不直接產生新ID</text></g></g><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">孤立低分框不新建ID</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.9)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/></g><rect x="260" y="64" width="85" height="85" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="275" y="110" font-size="28" fill="#CE7917" font-weight="700" text-anchor="start">.3</text><text x="25" y="225" font-size="28" fill="#1765CA" font-weight="700" text-anchor="start">附近沒有可接的活動軌跡</text><text x="25" y="285" font-size="28" fill="#CE7917" font-weight="700" text-anchor="start">孤立低分 → 不直接建ID</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">此框是偵測器誤框的給定例</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">低分再匹配不是全收低分框</text></g></g><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">新高分候選仍需確認</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.9)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="250" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/></g><rect x="240" y="50" width="85" height="85" rx="0" fill="none" stroke="#1765CA" stroke-width="2"/><text x="25" y="225" font-size="28" fill="#1765CA" font-weight="700" text-anchor="start">未配對高分框 → 新候選</text><text x="25" y="285" font-size="28" fill="#238854" font-weight="700" text-anchor="start">依實作確認與後續續接</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">高分也不等於一定是真物件</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">繼續核對偵測與身份穩定性</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">孤立低分不能憑空建成可靠新物件。</text></svg>