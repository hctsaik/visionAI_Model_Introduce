" text-anchor="middle">正常小孔q卻可能被模糊</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,20) scale(0.55)"><rect x="0" y="0" width="350" height="225" rx="8" fill="url(#steel)" stroke="#748A9C" stroke-width="2"/><circle cx="68" cy="65" r="35" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="282" cy="181" r="22" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/></g><g transform="translate(275,20) scale(0.55)"><rect x="0" y="0" width="350" height="225" rx="8" fill="url(#steel)" stroke="#748A9C" stroke-width="2"/><circle cx="68" cy="65" r="35" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="282" cy="181" r="22" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/></g><circle cx="430.1" cy="119.55000000000001" r="12" fill="#ABB8C4" stroke="#ABB8C4" stroke-width="3"/><text x="20" y="205" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">原q：30</text><text x="270" y="205" font-size="30" fill="#CE7917" font-weight="700" text-anchor="start">模糊q：100</text><text x="65" y="291" font-size="36" fill="#CE7917" font-weight="700" text-anchor="start">|30 − 100| = 70</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">給定反例：正常小孔被模糊</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">較大差異也可能是誤報</text></g></g><rec