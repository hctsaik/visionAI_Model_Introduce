,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同好件位移也須另外驗</text><g transform="translate(8,66) scale(0.965)"><rect x="10" y="15" width="222" height="185" rx="2" fill="white" stroke="#B9D4EF" stroke-width="2"/><rect x="260" y="15" width="222" height="185" rx="2" fill="white" stroke="#B9D4EF" stroke-width="2"/><g transform="translate(20,35) scale(0.5)"><rect x="0" y="0" width="350" height="225" rx="8" fill="url(#steel)" stroke="#748A9C" stroke-width="2"/><circle cx="68" cy="65" r="35" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/></g><g transform="translate(294,55) scale(0.5)"><rect x="0" y="0" width="350" height="225" rx="8" fill="url(#steel)" stroke="#748A9C" stroke-width="2"/><circle cx="68" cy="65" r="35" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/></g><rect x="45" y="48" width="23" height="35" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><rect x="295" y="48" width="23" height="35" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="20" y="240" font-size="29" fill="#1765CA" font-weight="500" text-anchor="start">原定位</text><text x="272" y="240" font-size="29" fill="#CE7917" font-weight="500" text-anchor="start">同好件位移</text><text x="20" y="299" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">固定影像位置可能讀到不同部位</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">位移與工件缺陷是不同原因</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">先看對齊，再解讀位置距離</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">換取像或特徵，位置分布也要重新核對。</text></svg>