<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">PaDiM：位置與統計必須一起保存</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">固定網格與特徵處理</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(12,15) scale(0.43)"><rect x="0" y="0" width="350" height="225" rx="8" fill="url(#steel)" stroke="#748A9C" stroke-width="2"/><circle cx="68" cy="65" r="35" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><line x1="266" y1="133" x2="300" y2="103" stroke="#34424B" stroke-width="6"/><line x1="260" y1="142" x2="286" y2="122" stroke="#EDF2F6" stroke-width="3"/><rect x="247" y="94" width="65" height="58" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="318" y="124" font-size="31" fill="#CE7917" font-weight="700" text-anchor="start">p</text></g><text x="193" y="58" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">同一處理版本</text><rect x="15" y="130" width="464" height="50" rx="5" fill="white" stroke="#1765CA" stroke-width="2"/><text x="28" y="164" font-size="27" fill="#1765CA" font-weight="500" text-anchor="start">固定取像 / 對齊 / 空間網格</text><rect x="15" y="190" width="464" height="50" rx="5" fill="white" stroke="#1765CA" stroke-width="2"/><text x="28" y="224" font-size="27" fill="#1765CA" font-weight="500" text-anchor="start">特徵維度 + 各位置μ / Σ</text><rect x="15" y="250" width="464" height="50" rx="5" fill="white" stroke="#1765CA" stroke-width="2"/><text x="28" y="284" font-size="27" fill="#1765CA" font-weight="500" text-anchor="start">正則化與評分設定一起保存</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">每個位置有自己的正常統計</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">工件換位，不能直接套舊分布</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">樣本不足時統計不穩定</text><g transform="translate(8,66) scale(0.965)"><text x="15" y="40" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">高度相關的兩個特徵分量</text><rect x="15" y="75" width="65" height="65" rx="5" fill="#DBEAFE" stroke="#1765CA" stroke-width="2"/><text x="47.5" y="119.80000000000001" font-size="31" fill="#1765CA" font-weight="700" text-anchor="middle">1</text><rect x="85" y="75" width="65" height="65" rx="5" fill="#DBEAFE" stroke="#1765CA" stroke-width="2"/><text x="117.5" y="119.80000000000001" font-size="31" fill="#1765CA" font-weight="700" text-anchor="middle">1</text><rect x