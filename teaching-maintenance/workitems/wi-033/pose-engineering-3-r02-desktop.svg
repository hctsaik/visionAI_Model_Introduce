<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">Pose：姿態還要投回原图檢查</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">保存姿態與座標契約</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(30,45) scale(0.6)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/><circle cx="95" cy="0" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="105" y="-10" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">A</text><circle cx="60" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="70" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">B</text><circle cx="190" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="200" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">C</text></g><line x1="210" y1="100" x2="330" y2="100" stroke="#1765CA" stroke-width="5"/><polygon points="330.0,100.0 316.0,93.0 316.0,107.0" fill="#1765CA"/><rect x="350" y="55" width="105" height="90" rx="8" fill="#DCE8F5" stroke="#1765CA" stroke-width="2"/><circle cx="402" cy="100" r="26" fill="#F5F9FF" stroke="#1765CA" stroke-width="3"/><text x="20" y="200" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">物體座標</text><text x="340" y="200" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">相機座標</text><rect x="105" y="255" width="285" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="247.5" y="285" font-size="26" fill="white" font-weight="700" text-anchor="middle">R：旋轉　t：平移</text><text x="15" y="360" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">相機點 = R × 物體點 + t</text><text x="15" y="410" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">t 的單位跟 CAD 一致</text></g></g><line x1="543" y1="388" x2="567" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="567.0,388.0 553.0,381.0 553.0,395.0" fill="#1765CA"/><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">把 3D 點投回相機影像</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(105,65) scale(1.1)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/><circle cx="95" cy="0" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="105" y="-10" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">A</text><circle cx="60" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="70" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">B</text><circle cx="190" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="200" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">C</text></g><circle cx="214" cy="72" r="9" fill="none" stroke="#238854" stroke-width="3"/><circle cx="173" cy="174" r="9" fill="none" stroke="#238854" stroke-width="3"/><circle cx="317" cy="183" r="9" fill="none" stroke="#238854" stroke-width="3"/><text x="15" y="319" font-size="28" fill="#CE7917" font-weight="500" text-anchor="start">橘實心：觀測點</text><text x="15" y="365" font-size="28" fill="#238854" font-weight="500" text-anchor="start">綠空心：姿態重投影</text><text x="15" y="415" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">逐點比較，不能只看平均</text></g></g><line x1="1098" y1="388" x2="1122" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="1122.0,388.0 1108.0,381.0 1108.0,395.0" fill="#1765CA"/><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">逐點誤差與站點交付</text><g transform="translate(8,66) scale(0.965)"><text x="20" y="65" font-size="32" fill="#172B43" font-weight="500" text-anchor="start">A</text><rect x="90" y="39" width="240.0" height="30" rx="3" fill="#1765CA" stroke="none" stroke-width="2"/><text x="20" y="145" font-size="32" fill="#172B43" font-weight="500" text-anchor="start">B</text><rect x="90" y="119" width="90.0" height="30" rx="3" fill="#1765CA" stroke="none" stroke-width="2"/><text x="20" y="225" font-size="32" fill="#172B43" font-weight="500" text-anchor="start">C</text><rect x="90" y="199" width="180.0" height="30" rx="3" fill="#1765CA" stroke="none" stroke-width="2"/><text x="15" y="298" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">示意殘差；單位為 pixel</text><text x="15" y="350" font-size="25" fill="#172B43" font-weight="500" text-anchor="start">保存點ID、可見性與校正版本</text><text x="15" y="405" font-size="25" fill="#172B43" font-weight="500" text-anchor="start">R／t → 工作站；外參另行核對</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">交付 R／t、座標單位與逐點誤差，再核對實體。</text></svg>