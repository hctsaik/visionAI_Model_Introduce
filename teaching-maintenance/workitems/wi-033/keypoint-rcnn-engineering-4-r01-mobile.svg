<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">關鍵點與分割：要具名位置還是整片區域</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同一支架工作需求</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(40,50) scale(1.1)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/><circle cx="95" cy="0" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="105" y="-10" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">A</text><circle cx="60" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="70" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">B</text><circle cx="190" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="200" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">C</text></g><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">A是缺口角，B/C是具名孔心</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">自訂工件需定義並標註點名</text></g></g><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">關鍵點：A/B/C具名座標</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(40,50) scale(1.1)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/><circle cx="95" cy="0" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="105" y="-10" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">A</text><circle cx="60" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="70" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">B</text><circle cx="190" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="200" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">C</text></g><text x="20" y="298" font-size="30" fill="#1765CA" font-weight="700" text-anchor="start">A ↔ A，B ↔ B，C ↔ C</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">具名2D座標供幾何對應</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">點的可信度與可見性另查</text></g></g><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">分割：逐像素物件區域</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(30,25) scale(1.7)"><rect x="0" y="0" width="210" height="140" rx="4" fill="white" stroke="#B9D4EF" stroke-width="2"/><g transform="translate(8,8) scale(0.35)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="#1765CA"/><circle cx="60" cy="102" r="24" fill="white" stroke="white" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="white" stroke="white" stroke-width="3"/></g></g><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">分割交物件區域，並非點名</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">要孔心仍需定義提取與驗證</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">按交付選標註：</text><text x="45" y="2222" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">具名點、輪廓與姿態各有責任。</text></svg>