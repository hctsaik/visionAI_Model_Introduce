<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2400" viewBox="0 0 768 2400"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2400" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">EfficientAD：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">局部與全局比較對象不同</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.3)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同一待測托盤送入三者</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(55,5) scale(1.1)"><rect x="0" y="30" width="350" height="150" rx="12" fill="#A3B7C7" stroke="#71869A" stroke-width="2"/><rect x="12" y="50" width="98" height="110" rx="5" fill="#607A90" stroke="#71869A" stroke-width="2"/><rect x="22" y="30" width="78" height="110" rx="7" fill="#D2DFE8" stroke="#6F8598" stroke-width="2"/><ellipse cx="61" cy="30" rx="39" ry="16" fill="#E5EDF4" stroke="#6F8598" stroke-width="3"/><rect x="126" y="50" width="98" height="110" rx="5" fill="#607A90" stroke="#71869A" stroke-width="2"/><rect x="240" y="50" width="98" height="110" rx="5" fill="#607A90" stroke="#71869A" stroke-width="2"/><rect x="250" y="30" width="78" height="110" rx="7" fill="#D2DFE8" stroke="#6F8598" stroke-width="2"/><ellipse cx="289" cy="30" rx="39" ry="16" fill="#E5EDF4" stroke="#6F8598" stroke-width="3"/><path d="M282,78 l15,-7 9,13 -6,20 -22,5 -4,-13 Z" fill="#6A514D"/></g><text x="15" y="280" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">中間缺件、右側污點</text><text x="15" y="328" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">同一影像送T、學生與AE</text><text x="15" y="376" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">位置與表示皆為教學示意</text></g></g><line x1="384.0" y1="848.0" x2="384.0" y2="867.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,867.0 391.0,853.0 377.0,853.0" fill="#1765CA"/><g transform="translate(50,870.0) scale(1.3)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">兩路各比對應的表示</text><g transform="translate(8,66) scale(0.965)"><rect x="8" y="10" width="165" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="90.5" y="40" font-size="26" fill="white" font-weight="700" text-anchor="middle">T</text><rect x="317" y="10" width="165" height="43" rx="12" fill="#238854" stroke="#238854" stroke-width="2"/><text x="399.5" y="40" font-size="26" fill="white" font-weight="700" text-anchor="middle">S1</text><text x="220" y="44" font-size="37" fill="#172B43" font-weight="500" text-anchor="start">−</text><line x1="242" y1="60" x2="242" y2="101" stroke="#1765CA" stroke-width="5"/><polygon points="242.0,101.0 249.0,87.0 235.0,87.0" fill="#1765CA"/><rect x="116" y="114" width="255" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="243.5" y="144" font-size="26" fill="white" font-weight="700" text-anchor="middle">local：均方差</text><rect x="8" y="223" width="165" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="90.5" y="253" font-size="26" fill="white" font-weight="700" text-anchor="middle">AE</text><rect x="317" y="223" width="165" height="43" rx="12" fill="#238854" stroke="#238854" stroke-width="2"/><text x="399.5" y="253" font-size="26" fill="white" font-weight="700" text-anchor="middle">S2</text><text x="220" y="257" font-size="37" fill="#172B43" font-weight="500" text-anchor="start">−</text><line x1="242" y1="270" x2="242" y2="311" stroke="#1765CA" stroke-width="5"/><polygon points="242.0,311.0 249.0,297.0 235.0,297.0" fill="#1765CA"/><rect x="116" y="324" width="255" height="43" rx="12" fill="#238854" stroke="#238854" stroke-width="2"/><text x="243.5" y="354" font-size="26" fill="white" font-weight="700" text-anchor="middle">global：均方差</text><text x="22" y="405" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">每個位置：通道平方差再平均</text></g></g><line x1="384.0" y1="1523.0" x2="384.0" y2="1542.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1542.0 391.0,1528.0 377.0,1528.0" fill="#1765CA"/><g transform="translate(50,1545.0) scale(1.3)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">正常驗證資料校正後融合</text><g transform="translate(8,66) scale(0.965)"><rect x="10" y="10" width="200" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="110.0" y="40" font-size="26" fill="white" font-weight="700" text-anchor="middle">local</text><rect x="280" y="10" width="200" height="43" rx="12" fill="#238854" stroke="#238854" stroke-width="2"/><text x="380.0" y="40" font-size="26" fill="white" font-weight="700" text-anchor="middle">global</text><line x1="110" y1="64" x2="110" y2="108" stroke="#1765CA" stroke-width="5"/><polygon points="110.0,108.0 117.0,94.0 103.0,94.0" fill="#1765CA"/><line x1="380" y1="64" x2="380" y2="108" stroke="#238854" stroke-width="5"/><polygon points="380.0,108.0 387.0,94.0 373.0,94.0