<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">ControlNet：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">控制強度要配採樣驗證</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">保存控制模型與前處理</text><g transform="translate(8,66) scale(0.965)"><rect x="30" y="10" width="430" height="282" rx="9" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="48" y="48" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">基模與分支</text><text x="48" y="82" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">匹配的ControlNet版本</text><text x="48" y="126" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">控制圖</text><text x="48" y="160" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">輪廓前處理／解析度</text><text x="48" y="204" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">採樣</text><text x="48" y="238" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">文字／強度／起止步／種子</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">輪廓和控制模型需匹配</text><text x="15" y="397" font-size="27" 