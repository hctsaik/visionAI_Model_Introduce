<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">AnomalyGPT：會回答不代表會判對</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">共同原圖：刮痕在中部</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(105,65) scale(1.1)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/><path d="M137,50 l-12,18 18,11 -11,20" stroke="#B94C42" stroke-width="6" fill="none"/></g><text x="15" y="325" font-size="29" fill="#172B43" font-weight="500" text-anchor="start">同一支架、中部刮痕</text><text x="15" y="385" font-size="26" fill="#172B43" font-weight="500" text-anchor="start">固定原圖，不更換異常位置</text></g></g><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">位置在中部，文字卻說孔邊</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(125,20) scale(0.95)"><g transform="translate(0,0) scale(1)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/></g><rect x="115" y="44" width="38" height="62" rx="4" fill="#FFE1B5" stroke="#CE7917" stroke-width="2"/></g><rect x="20" y="250" width="455" height="91" rx="8" fill="white" stroke="#CE7917" stroke-width="2"/><text x="38" y="304" font-size="27" fill="#CE7917" font-weight="500" text-anchor="start">假設錯答：左孔邊有裂縫</text><text x="15" y="412" font-size="24" fill="#172B43" font-weight="500" text-anchor="start">定位在中部，文字沒有相同證據</text></g></g><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">帶對話是否真能減少工時</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,20) scale(0.62)"><g transform="translate(0,0) scale(1)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/></g><rect x="115" y="44" width="38" height="62" rx="4" fill="#FFE1B5" stroke="#CE7917" stroke-width="2"/></g><text x="210" y="80" font-size="29" fill="#1765CA" font-weight="500" text-anchor="start">只看位置</text><g transform="translate(15,190) scale(0.62)"><g transform="translate(0,0) scale(1)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/></g><rect x="115" y="44" width="38" height="62" rx="4" fill="#FFE1B5" stroke="#CE7917" stroke-width="2"/></g><text x="210" y="245" font-size="29" fill="#238854" font-weight="500" text-anchor="start">位置＋對話</text><text x="15" y="362" font-size="25" fill="#172B43" font-weight="500" text-anchor="start">同資料比較錯誤、延遲、工時</text><text x="15" y="416" font-size="25" fill="#172B43" font-weight="500" text-anchor="start">流暢不等於少誤判或省時間</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">同圖比較定位與文字證據，再量覆核成本。</text></svg>