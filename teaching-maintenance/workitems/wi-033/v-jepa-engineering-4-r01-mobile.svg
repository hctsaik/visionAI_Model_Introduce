<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">V-JEPA與VideoMAE：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">監督目標不同</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同一夾取影片與同一標籤</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.82)"><rect x="0" y="0" width="220" height="175" rx="5" fill="#E4EBF1" stroke="#73899E" stroke-width="2"/><rect x="72" y="117" width="76" height="44" rx="2" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><rect x="72" y="10" width="76" height="35" rx="2" fill="#172B43" stroke="#172B43" stroke-width="2"/><line x1="73" y1="34" x2="73" y2="127" stroke="#172B43" stroke-width="13"/><line x1="147" y1="34" x2="147" y2="127" stroke="#172B43" stroke-width="13"/><line x1="73" y1="127" x2="84" y2="127" stroke="#172B43" stroke-width="9"/><line x1="147" y1="127" x2="136" y2="127" stroke="#172B43" stroke-width="9"/></g><g transform="translate(270,20) scale(0.82)"><g transform="translate(0,0) scale(1)"><rect x="0" y="0" width="220" height="175" rx="5" fill="#E4EBF1" stroke="#73899E" stroke-width="2"/><rect x="72" y="117" width="76" height="44" rx="2" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><rect x="72" y="10" width="76" height="35" rx="2" fill="#172B43" stroke="#172B43" stroke-width="2"/><line x1="73" y1="34" x2="73" y2="127" stroke="#172B43" stroke-width="13"/><line x1="147" y1="34" x2="147" y2="127" stroke="#172B43" stroke-width="13"/><line x1="73" y1="127" x2="84" y2="127" stroke="#172B43" stroke-width="9"/><line x1="147" y1="127" x2="136" y2="127" stroke="#172B43" stroke-width="9"/></g><rect x="0" y="40" width="220" height="135" rx="0" fill="#E4EBF1" stroke="none" stroke-width="2"/><rect x="72" y="117" width="76" height="44" rx="2" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><line x1="84" y1="34" x2="84" y2="93" stroke="#172B43" stroke-width="13"/><line x1="136" y1="34" x2="136" y2="93" stroke="#172B43" stroke-width="13"/><line x1="84" y1="93" x2="96" y2="93" stroke="#172B43" stroke-width="9"/><line x1="136" y1="93" x2="124" y2="93" stroke="#172B43" stroke-width="9"/></g><text x="20" y="204" font-size="27" fill="#238854" font-weight="500" text-anchor="start">接觸並夾住</text><text x="270" y="204" font-size="27" fill="#CE7917" font-weight="500" text-anchor="start">閉合但未碰到</text><text x="20" y="276" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">標註整段：成功／失敗</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">兩種結果都要有標註影片</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">相鄰影格不能跨訓練與驗證</text></g></g><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">VideoMAE對像素平方差</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.72)"><rect x="0" y="0" width="220" height="175" rx="5" fill="#E4EBF1" stroke="#73899E" stroke-width="2"/><rect x="72" y="117" width="76" height="44" rx="2" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><rect x="72" y="10" width="76" height="35" rx="2" fill="#172B43" stroke="#172B43" stroke-width="2"/><line x1="71" y1="34" x2="71" y2="98" stroke="#172B43" stroke-width="13"/><line x1="149" y1="34" x2="149" y2="98" stroke="#172B43" stroke-width="13"/><line x1="71" y1="98" x2="82" y2="98" stroke="#172B43" stroke-width="9"/><line x1="149" y1="98" x2="138" y2="98" stroke="#172B43" stroke-width="9"/></g><rect x="57" y="85" width="51" height="36" rx="1" fill="none" stroke="#CE7917" stroke-width="2"/><rect x="270" y="40" width="91" height="55" rx="2" fill="white" stroke="#1765CA" stroke-width="2"/><text x="315.5" y="77" font-size="26" fill="#1765CA" font-weight="700" text-anchor="middle">20</text><rect x="365" y="40" width="91" height="55" rx="2" fill="white" stroke="#1765CA" stroke-width="2"/><text x="410.5" y="77" font-size="26" fill="#1765CA" font-weight="700" text-anchor="middle">22</text><text x="250" y="171" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">原值／重建值</text><text x="20" y="268" font-size="28" fill="#1765CA" font-weight="700" text-anchor="start">像素平方差：(20−22)² = 4</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">VideoMAE：重建像素作監督</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">作者单像素例，非模型實測</text></g></g><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">V-JEPA對目標特徵L1差</text><g transform="translate(8,66) scale(0.965)"><rect x="20" y="30" width="91" height="55" rx="2" fill="white" stroke="#1765CA" stroke-width="2"/><text x="65.5" y="67" font-size="26" fill="#1765CA" font-weight="700" text-anchor="middle">0.2</text><rect x="115" y="30" width="91" height="55" rx="2" fill="white" stroke="#1765CA" stroke-width="2"/><text x="160.5" y="67" font-size="26" fill="#1765CA" font-weight="700" text-anchor="middle">0.8</text><rect x="270" y="30" width="91" height="55" rx="2" fill="white" stroke="#238854" stroke-width="2"/><text x="315.5" y="67" font-size="26" fill="#238854" font-weight="700" text-anchor="middle">0.4</text><rect x="365" y="30" width="91" height="55" rx="2" fill="white" stroke="#238854" stroke-width="2"/><text x="410.5" y="67" font-size="26" fill="#238854" font-weight="700" text-anchor="middle">0.7</text><text x="20" y="175" font-size="32" fill="#238854" font-weight="700" text-anchor="start">特徵L1平均差 = 0.15</text><text x="20" y="273" font-size="29" fill="#172B43" font-weight="500" text-anchor="start">與像素平方差的單位不同</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">V-JEPA：同位置目標表示</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">不能用0.15與4排名模型好壞</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">同影片比較任務成果，不能比兩種損失值。</text></svg>