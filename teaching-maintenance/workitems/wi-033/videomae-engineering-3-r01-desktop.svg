<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">VideoMAE：token與取樣決定成本</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">固定片長、幀距與裁切</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(10,20) scale(0.64)"><rect x="0" y="0" width="220" height="175" rx="5" fill="#E4EBF1" stroke="#73899E" stroke-width="2"/><rect x="72" y="117" width="76" height="44" rx="2" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><rect x="72" y="10" width="76" height="35" rx="2" fill="#172B43" stroke="#172B43" stroke-width="2"/><line x1="56" y1="34" x2="56" y2="67" stroke="#172B43" stroke-width="13"/><line x1="164" y1="34" x2="164" y2="67" stroke="#172B43" stroke-width="13"/><line x1="56" y1="67" x2="67" y2="67" stroke="#172B43" stroke-width="9"/><line x1="164" y1="67" x2="153" y2="67" stroke="#172B43" stroke-width="9"/></g><text x="20" y="153" font-size="24" fill="#172B43" font-weight="500" text-anchor="start">張開 t−1</text><g transform="translate(170,20) scale(0.64)"><rect x="0" y="0" width="220" height="175" rx="5" fill="#E4EBF1" stroke="#73899E" stroke-width="2"/><rect x="72" y="117" width="76" height="44" rx="2" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><rect x="72" y="10" width="76" height="35" rx="2" fill="#172B43" stroke="#172B43" stroke-width="2"/><line x1="71" y1="34" x2="71" y2="98" stroke="#172B43" stroke-width="13"/><line x1="149" y1="34" x2="149" y2="98" stroke="#172B43" stroke-width="13"/><line x1="71" y1="98" x2="82" y2="98" stroke="#172B43" stroke-width="9"/><line x1="149" y1="98" x2="138" y2="98" stroke="#172B43" stroke-width="9"/></g><text x="180" y="153" font-size="24" fill="#172B43" font-weight="500" text-anchor="start">接近 t</text><g transform="translate(330,20) scale(0.64)"><rect x="0" y="0" width="220" height="175" rx="5" fill="#E4EBF1" stroke="#73899E" stroke-width="2"/><rect x="72" y="117" width="76" height="44" rx="2" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><rect x="72" y="10" width="76" height="35" rx="2" fill="#172B43" stroke="#172B43" stroke-width="2"/><line x1="73" y1="34" x2="73" y2="127" stroke="#172B43" stroke-width="13"/><line x1="147" y1="34" x2="147" y2="127" stroke="#172B43" stroke-width="13"/><line x1="73" y1="127" x2="84" y2="127" stroke="#172B43" stroke-width="9"/><line x1="147" y1="127" x2="136" y2="127" stroke="#172B43" stroke-width="9"/></g><text x="340" y="153" font-size="24" fill="#172B43" font-weight="500" text-anchor="start">夾住 t+1</text><line x1="30" y1="198" x2="450" y2="198" stroke="#1765CA" stroke-width="3"/><line x1="30" y1="185" x2="30" y2="212" stroke="#1765CA" stroke-width="3"/><line x1="135" y1="185" x2="135" y2="212" stroke="#1765CA" stroke-width="3"/><line x1="240" y1="185" x2="240" y2="212" stroke="#1765CA" stroke-width="3"/><line x1="345" y1="185" x2="345" y2="212" stroke="#1765CA" stroke-width="3"/><line x1="450" y1="185" x2="450" y2="212" stroke="#1765CA" stroke-width="3"/><text x="20" y="249" font-size="29" fill="#172B43" font-weight="500" text-anchor="start">0      Δt      2Δt      3Δt</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">保存片長、幀距、裁切與縮放</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">同樣幀數，不代表同樣時間長度</text></g></g><line x1="543" y1="388" x2="567" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="567.0,388.0 553.0,381.0 553.0,395.0" fill="#1765CA"/><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">時空token數影響注意力</text><g transform="translate(8,66) scale(0.965)"><rect x="20" y="30" width="200" height="65" rx="6" fill="#F5F9FF" stroke="#1765CA" stroke-width="2"/><text x="120" y="73" font-size="29" fill="#1765CA" font-weight="700" text-anchor="middle">100 tokens</text><rect x="20" y="140" width="400" height="65" rx="6" fill="#F5F9FF" stroke="#238854" stroke-width="2"/><text x="220" y="183" font-size="29" fill="#238854" font-weight="700" text-anchor="middle">200 tokens</text><text x="20" y="277" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">全注意力配對數隨N平方成長</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">N平方：1萬對4萬配對項</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">是計算量尺度，不是實測毫秒</text></g></g><line x1="1098" y1="388" x2="1122" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="1122.0,388.0 1108.0,381.0 1108.0,395.0" fill="#1765CA"/><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同硬體驗事件召回與延遲</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.75)"><rect x="0" y="0" width="220" height="175" rx="5" fill="#E4EBF1" stroke="#73899E" stroke-width="2"/><rect x="72" y="117" width="76" height="44" rx="2" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><rect x="72" y="10" width="76" height="35" rx="2" fill="#172B43" stroke="#172B43" stroke-width="2"/><line x1="73" y1="34" x2="73" y2="127" stroke="#172B43" stroke-width="13"/><line x1="147" y1="34" x2="147" y2="127" stroke="#172B43" stroke-width="13"/><line x1="73" y1="127" x2="84" y2="127" stroke="#172B43" stroke-width="9"/><line x1="147" y1="127" x2="136" y2="127" stroke="#172B43" stroke-width="9"/></g><g transform="translate(295,20) scale(0.75)"><g transform="translate(0,0) scale(1)"><rect x="0" y="0" width="220" height="175" rx="5" fill="#E4EBF1" stroke="#73899E" stroke-width="2"/><rect x="72" y="117" width="76" height="44" rx="2" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><rect x="72" y="10" width="76" height="35" rx="2" fill="#172B43" stroke="#172B43" stroke-width="2"/><line x1="73" y1="34" x2="73" y2="127" stroke="#172B43" stroke-width="13"/><line x1="147" y1="34" x2="147" y2="127" stroke="#172B43" stroke-width="13"/><line x1="73" y1="127" x2="84" y2="127" stroke="#172B43" stroke-width="9"/><line x1="147" y1="127" x2="136" y2="127" stroke="#172B43" stroke-width="9"/></g><rect x="0" y="40" width="220" height="135" rx="0" fill="#E4EBF1" stroke="none" stroke-width="2"/><rect x="72" y="117" width="76" height="44" rx="2" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><line x1="84" y1="34" x2="84" y2="93" stroke="#172B43" stroke-width="13"/><line x1="136" y1="34" x2="136" y2="93" stroke="#172B43" stroke-width="13"/><line x1="84" y1="93" x2="96" y2="93" stroke="#172B43" stroke-width="9"/><line x1="136" y1="93" x2="124" y2="93" stroke="#172B43" stroke-width="9"/></g><text x="20" y="201" font-size="28" fill="#1765CA" font-weight="500" text-anchor="start">成功誤判？</text><text x="285" y="201" font-size="28" fill="#CE7917" font-weight="500" text-anchor="start">失敗漏判？</text><text x="20" y="271" font-size="27" fill="#238854" font-weight="700" text-anchor="start">以完整片段統計＋端到端時間</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">按片段、工件或批次留出</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">不要把連續相似幀當獨立測試</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">減少取樣可省成本，也可能漏掉短事件。</text></svg>