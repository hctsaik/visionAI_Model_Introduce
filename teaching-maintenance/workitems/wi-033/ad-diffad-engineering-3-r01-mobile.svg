<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2400" viewBox="0 0 768 2400"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2400" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">DiffusionAD：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">要交付最後的位置結果</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.3)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">把恢復前後成對保存</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,40) scale(0.75)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/><path d="M137,50 l-12,18 18,11 -11,20" stroke="#B94C42" stroke-width="6" fill="none"/></g><g transform="translate(285,40) scale(0.75)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/></g><text x="15" y="235" font-size="30" fill="#172B43" font-weight="500" text-anchor="start">原圖 A</text><text x="285" y="235" font-size="30" fill="#172B43" font-weight="500" text-anchor="start">恢復 R</text><text x="15" y="340" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">同張來源、相同尺寸／座標</text><text x="15" y="406" font-size="25" fill="#172B43" font-weight="500" text-anchor="start">保留中間圖才知道錯在哪裡</text></g></g><line x1="384.0" y1="846.0" x2="384.0" y2="864.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,864.0 391.0,850.0 377.0,850.0" fill="#1765CA"/><g transform="translate(50,870.0) scale(1.3)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">位置圖映回原圖覆核</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(100,60) scale(1.1)"><g transform="translate(0,0) scale(1)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/></g><rect x="115" y="44" width="38" height="62" rx="4" fill="#FFE1B5" stroke="#CE7917" stroke-width="2"/></g><text x="15" y="330" font-size="29" fill="#172B43" font-weight="500" text-anchor="start">位置圖映回原圖尺寸</text><text x="15" y="384" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">連同原圖給人工覆核</text><text x="15" y="431" font-size="25" fill="#172B43" font-weight="500" text-anchor="start">域內門檻与允收條件另驗</text></g></g><line x1="384.0" y1="1521.0" x2="384.0" y2="1539.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1539.0 391.0,1525.0 377.0,1525.0" fill="#1765CA"/><g transform="translate(50,1545.0) scale(1.3)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">計入兩尺度與分割時間</text><g transform="translate(8,66) scale(0.965)"><text x="15" y="45" font-size="29" fill="#1765CA" font-weight="500" text-anchor="start">两尺度估計</text><rect x="15" y="63" width="310" height="32" rx="4" fill="#1765CA" stroke="none" stroke-width="2"/><text x="15" y="145" font-size="29" fill="#238854" font-weight="500" text-anchor="start">分割</text><rect x="15" y="163" width="190" height="32" rx="4" fill="#238854" stroke="none" stroke-width="2"/><text x="15" y="245" font-size="29" fill="#CE7917" font-weight="500" text-anchor="start">前後處理</text><rect x="15" y="263" width="100" height="32" rx="4" fill="#CE7917" stroke="none" stroke-width="2"/><text x="15" y="402" font-size="25" fill="#172B43" font-weight="500" text-anchor="start">相對條長僅示意：全程都要量</text></g></g><rect x="24" y="2220" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2260" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2276" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2272" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">保存 A／R／位置圖，</text><text x="45" y="2318" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">連同完整耗時一起驗收。</text></svg>