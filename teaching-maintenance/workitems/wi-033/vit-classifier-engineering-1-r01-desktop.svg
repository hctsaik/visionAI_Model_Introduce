<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">ViT：把影像區塊變成可交流的表示</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同件影像切成區塊</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,32) scale(1.2)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/><path d="M137,50 l-12,18 18,11 -11,20" stroke="#B94C42" stroke-width="6" fill="none"/></g><line x1="15" y1="32" x2="15" y2="224" stroke="#1765CA" stroke-width="2"/><line x1="75" y1="32" x2="75" y2="224" stroke="#1765CA" stroke-width="2"/><line x1="135" y1="32" x2="135" y2="224" stroke="#1765CA" stroke-width="2"/><line x1="195" y1="32" x2="195" y2="224" stroke="#1765CA" stroke-width="2"/><line x1="255" y1="32" x2="255" y2="224" stroke="#1765CA" stroke-width="2"/><line x1="315" y1="32" x2="315" y2="224" stroke="#1765CA" stroke-width="2"/><line x1="15" y1="32" x2="315" y2="32" stroke="#1765CA" stroke-width="2"/><line x1="15" y1="80" x2="315" y2="80" stroke="#1765CA" stroke-width="2"/><line x1="15" y1="128" x2="315" y2="128" stroke="#1765CA" stroke-width="2"/><line x1="15" y1="176" x2="315" y2="176" stroke="#1765CA" stroke-width="2"/><line x1="15" y1="224" x2="315" y2="224" stroke="#1765CA" stroke-width="2"/><text x="20" y="288" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">同一影像切片，內容未換件</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">每一片投影成一個token</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">格線是分片，不是缺陷分割</text></g></g><line x1="543" y1="388" x2="567" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="567.0,388.0 553.0,381.0 553.0,395.0" fill="#1765CA"/><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">各片加入位置表示</text><g transform="translate(8,66) scale(0.965)"><rect x="15" y="33" width="123" height="107" rx="7" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><text x="38" y="96" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">片1</text><text x="50" y="179" font-size="33" fill="#1765CA" font-weight="700" text-anchor="start">+</text><rect x="15" y="210" width="123" height="51" rx="7" fill="white" stroke="#1765CA" stroke-width="2"/><text x="23" y="246" font-size="27" fill="#1765CA" font-weight="700" text-anchor="start">位置1</text><rect x="175" y="33" width="123" height="107" rx="7" fill="#E3EEF9" stroke="#238854" stroke-width="2"/><text x="198" y="96" font-size="31" fill="#238854" font-weight="700" text-anchor="start">片2</text><text x="210" y="179" font-size="33" fill="#238854" font-weight="700" text-anchor="start">+</text><rect x="175" y="210" width="123" height="51" rx="7" fill="white" stroke="#238854" stroke-width="2"/><text x="183" y="246" font-size="27" fill="#238854" font-weight="700" text-anchor="start">位置2</text><rect x="335" y="33" width="123" height="107" rx="7" fill="#E3EEF9" stroke="#CE7917" stroke-width="2"/><text x="358" y="96" font-size="31" fill="#CE7917" font-weight="700" text-anchor="start">片3</text><text x="370" y="179" font-size="33" fill="#CE7917" font-weight="700" text-anchor="start">+</text><rect x="335" y="210" width="123" height="51" rx="7" fill="white" stroke="#CE7917" stroke-width="2"/><text x="343" y="246" font-size="27" fill="#CE7917" font-weight="700" text-anchor="start">位置3</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">內容表示與位置表示相加</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">位置不是替換掉原始內容</text></g></g><line x1="1098" y1="388" x2="1122" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="1122.0,388.0 1108.0,381.0 1108.0,395.0" fill="#1765CA"/><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">分類token讀出整件分數</text><g transform="translate(8,66) scale(0.965)"><rect x="12" y="28" width="136" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="80.0" y="58" font-size="26" fill="white" font-weight="700" text-anchor="middle">片1</text><line x1="78" y1="79" x2="238" y2="144" stroke="#1765CA" stroke-width="5"/><polygon points="238.0,144.0 227.7,132.2 222.4,145.2" fill="#1765CA"/><rect x="174" y="28" width="136" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="242.0" y="58" font-size="26" fill="white" font-weight="700" text-anchor="middle">片2</text><line x1="240" y1="79" x2="238" y2="144" stroke="#1765CA" stroke-width="5"/><polygon points="238.0,144.0 245.4,130.2 231.4,129.8" fill="#1765CA"/><rect x="336" y="28" width="136" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="404.0" y="58" font-size="26" fill="white" font-weight="700" text-anchor="middle">片3</text><line x1="402" y1="79" x2="238" y2="144" stroke="#1765CA" stroke-width="5"/><polygon points="238.0,144.0 253.6,145.3 248.4,132.3" fill="#1765CA"/><rect x="142" y="163" width="210" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="247.0" y="193" font-size="26" fill="white" font-weight="700" text-anchor="middle">分類token</text><line x1="247" y1="215" x2="247" y2="254" stroke="#1765CA" stroke-width="5"/><polygon points="247.0,254.0 254.0,240.0 240.0,240.0" fill="#1765CA"/><text x="58" y="297" font-size="32" fill="#1765CA" font-weight="700" text-anchor="start">完整0.18／刮傷0.82</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">交換資訊後，分類頭讀出CLS</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">給定分類例；不是位置熱圖</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">切片保留位置，分類仍需資料與任務頭。</text></svg>