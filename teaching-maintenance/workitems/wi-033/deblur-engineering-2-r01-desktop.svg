<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">Deblur：模糊邊緣反推清晰候選</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">移動曝光使邊緣展寬</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(1)"><rect x="0" y="0" width="190" height="140" rx="3" fill="#23313E" stroke="#73899E" stroke-width="2"/><rect x="0" y="0" width="95" height="140" rx="0" fill="url(#steel)" stroke="none" stroke-width="2"/></g><line x1="220" y1="89" x2="265" y2="89" stroke="#1765CA" stroke-width="5"/><polygon points="265.0,89.0 251.0,82.0 251.0,96.0" fill="#1765CA"/><g transform="translate(280,20) scale(1)"><rect x="0" y="0" width="190" height="140" rx="3" fill="#23313E" stroke="#73899E" stroke-width="2"/><rect x="0" y="0" width="95" height="140" rx="0" fill="url(#steel)" stroke="none" stroke-width="2"/><rect x="66" y="0" width="13" height="140" rx="0" fill="#B4C1CD" stroke="none" stroke-width="2"/><rect x="78" y="0" width="13" height="140" rx="0" fill="#9DAEBC" stroke="none" stroke-width="2"/><rect x="90" y="0" width="13" height="140" rx="0" fill="#7F929F" stroke="none" stroke-width="2"/><rect x="102" y="0" width="13" height="140" rx="0" fill="#657A88" stroke="none" stroke-width="2"/><rect x="114" y="0" width="13" height="140" rx="0" fill="#435966" stroke="none" stroke-width="2"/></g><line x1="25" y1="280" x2="440" y2="280" stroke="#B9D4EF" stroke-width="2"/><line x1="25" y1="180" x2="25" y2="280" stroke="#B9D4EF" stroke-width="2"/><polyline points="25.0,180 84.28571428571428,180 143.57142857142856,185.0 202.85714285714286,210.0 262.1428571428571,250.0 321.42857142857144,275.0 380.7142857142857,280 440.0,280" fill="none" stroke="#1765CA" stroke-width="4"/><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">清晰階躍經曝光平均展寬</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">示意單一直邊，不涵蓋所有模糊</text></g></g><line x1="543" y1="388" x2="567" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="567.0,388.0 553.0,381.0 553.0,395.0" fill="#1765CA"/><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">由觀測估計清晰邊緣</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(1)"><rect x="0" y="0" width="190" height="140" rx="3" fill="#23313E" stroke="#73899E" stroke-width="2"/><rect x="0" y="0" width="95" height="140" rx="0" fill="url(#steel)" stroke="none" stroke-width="2"/><rect x="66" y="0" width="13" height="140" rx="0" fill="#B4C1CD" stroke="none" stroke-width="2"/><rect x="78" y="0" width="13" height="140" rx="0" fill="#9DAEBC" stroke="none" stroke-width="2"/><rect x="90" y="0" width="13" height="140" rx="0" fill="#7F929F" stroke="none" stroke-width="2"/><rect x="102" y="0" width="13" height="140" rx="0" fill="#657A88" stroke="none" stroke-width="2"/><rect x="114" y="0" width="13" height="140" rx="0" fill="#435966" stroke="none" stroke-width="2"/></g><line x1="220" y1="89" x2="265" y2="89" stroke="#1765CA" stroke-width="5"/><polygon points="265.0,89.0 251.0,82.0 251.0,96.0" fill="#1765CA"/><g transform="translate(280,20) scale(1)"><rect x="0" y="0" width="190" height="140" rx="3" fill="#23313E" stroke="#73899E" stroke-width="2"/><rect x="0" y="0" width="95" height="140" rx="0" fill="url(#steel)" stroke="none" stroke-width="2"/></g><text x="20" y="225" font-size="30" fill="#1765CA" font-weight="700" text-anchor="start">觀測模糊 → 估計清晰</text><text x="20" y="290" font-size="29" fill="#172B43" font-weight="500" text-anchor="start">反卷積或已學復原模型</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">輸出清晰只是候選</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">運動/失焦等退化要先分辨</text></g></g><line x1="1098" y1="388" x2="1122" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="1122.0,388.0 1108.0,381.0 1108.0,395.0" fill="#1765CA"/><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">回看振鈴及獨立清晰影像</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(1)"><rect x="0" y="0" width="190" height="140" rx="3" fill="#23313E" stroke="#73899E" stroke-width="2"/><rect x="0" y="0" width="95" height="140" rx="0" fill="url(#steel)" stroke="none" stroke-width="2"/><rect x="88" y="0" width="8" height="140" rx="0" fill="white" stroke="none" stroke-width="2"/><rect x="108" y="0" width="7" height="140" rx="0" fill="#06121A" stroke="none" stroke-width="2"/><rect x="123" y="0" width="5" height="140" rx="0" fill="#657A88" stroke="none" stroke-width="2"/></g><g transform="translate(280,20) scale(1)"><rect x="0" y="0" width="190" height="140" rx="3" fill="#23313E" stroke="#73899E" stroke-width="2"/><rect x="0" y="0" width="95" height="140" rx="0" fill="url(#steel)" stroke="none" stroke-width="2"/></g><text x="20" y="204" font-size="28" fill="#CE7917" font-weight="500" text-anchor="start">候選有多重邊</text><text x="280" y="204" font-size="26" fill="#238854" font-weight="500" text-anchor="start">独立清晰取像</text><text x="20" y="276" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">同位置比邊緣，不只看銳利</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">振鈴可能造出不存在的輪廓</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">較短曝光、對焦與重新取像驗證</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">清晰候選仍要用獨立觀測檢查假邊。</text></svg>