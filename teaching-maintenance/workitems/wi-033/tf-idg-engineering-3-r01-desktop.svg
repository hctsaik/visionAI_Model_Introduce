<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">TF-IDG：免訓練仍有反向計算</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">模型權重固定且不更新</text><g transform="translate(8,66) scale(0.965)"><rect x="30" y="25" width="410" height="114" rx="7" fill="white" stroke="#238854" stroke-width="2"/><text x="235" y="89" font-size="33" fill="#238854" font-weight="700" text-anchor="middle">預訓練權重 W 固定</text><rect x="40" y="210" width="186" height="55" rx="2" fill="white" stroke="#1765CA" stroke-width="2"/><text x="133.0" y="247" font-size="26" fill="#1765CA" font-weight="700" text-anchor="middle">z(t)</text><rect x="230" y="210" width="186" height="55" rx="2" fill="white" stroke="#1765CA" stroke-width="2"/><text x="323.0" y="247" font-size="26" fill="#1765CA" font-weight="700" text-anchor="middle">z(next)</text><line x1="192" y1="175" x2="311" y2="175" stroke="#1765CA" stroke-width="5"/><polygon points="311.0,175.0 297.0,168.0 297.0,182.0" fill="#1765CA"/><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">改變的是生成中的latent</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">有梯度不代表有權重optimizer</text></g></g><line x1="543" y1="388" x2="567" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="567.0,388.0 553.0,381.0 553.0,395.0" fill="#1765CA"/><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">latent求導需中間激活</text><g transform="translate(8,66) scale(0.965)"><rect x="20" y="20" width="440" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="240.0" y="50" font-size="26" fill="white" font-weight="700" text-anchor="middle">latent → 特徵 → 差異</text><line x1="390" y1="86" x2="390" y2="139" stroke="#CE7917" stroke-width="5"/><polygon points="390.0,139.0 397.0,125.0 383.0,125.0" fill="#CE7917"/><rect x="20" y="160" width="440" height="43" rx="12" fill="#CE7917" stroke="#CE7917" stroke-width="2"/><text x="240.0" y="190" font-size="26" fill="white" font-weight="700" text-anchor="middle">差異梯度 → latent引導</text><text x="20" y="281" font-size="26" fill="#172B43" font-weight="500" text-anchor="start">保存中間激活，增加計算與記憶體</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">採樣成本含前向與求導</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">不能以免訓練推論為必定更快</text></g></g><line x1="1098" y1="388" x2="1122" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="1122.0,388.0 1108.0,381.0 1108.0,395.0" fill="#1765CA"/><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">保存參考與引導設定</text><g transform="translate(8,66) scale(0.965)"><rect x="30" y="10" width="430" height="282" rx="9" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="48" y="48" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">每次來源</text><text x="48" y="82" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">正常圖／參考傷／mask</text><text x="48" y="126" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">引導</text><text x="48" y="160" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">特徵對齊與梯度設定</text><text x="48" y="204" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">保持與採樣</text><text x="48" y="238" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">AdaIN／融合／步數種子</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">每個生成條件都可影響结果</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">端到端時間包含求導與融合</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">每步特徵梯度也要算進延遲與記憶體。</text></svg>