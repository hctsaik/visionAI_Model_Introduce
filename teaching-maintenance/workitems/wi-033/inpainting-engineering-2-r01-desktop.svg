<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">Inpainting：指定內區，保留外部上下文</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">原圖與可編修遮罩分開保存</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.58)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><line x1="143.0" y1="197.0" x2="207.0" y2="171.0" stroke="#253846" stroke-width="5"/><line x1="148.0" y1="201.0" x2="212.0" y2="173.0" stroke="white" stroke-width="2"/></g><g transform="translate(270,20) scale(0.58)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><rect x="135.0" y="164.0" width="80" height="40" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/><line x1="143.0" y1="197.0" x2="207.0" y2="171.0" stroke="#253846" stroke-width="5"/><line x1="148.0" y1="201.0" x2="212.0" y2="173.0" stroke="white" stroke-width="2"/></g><text x="20" y="217" font-size="29" fill="#1765CA" font-weight="500" text-anchor="start">原圖另存</text><text x="270" y="217" font-size="27" fill="#CE7917" font-weight="500" text-anchor="start">1 = 可編修區</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同板下方待編修區域</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">本圖遮罩約定，API需核對</text></g></g><line x1="543" y1="388" x2="567" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="567.0,388.0 553.0,381.0 553.0,395.0" fill="#1765CA"/><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">遮罩內去噪、外部提供上下文</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.9)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><rect x="135.0" y="164.0" width="80" height="40" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/></g><line x1="67" y1="170" x2="147" y2="170" stroke="#1765CA" stroke-width="4"/><polygon points="147.0,170.0 133.0,163.0 133.0,177.0" fill="#1765CA"/><line x1="343" y1="170" x2="263" y2="170" stroke="#1765CA" stroke-width="4"/><polygon points="263.0,170.0 277.0,177.0 277.0,163.0" fill="#1765CA"/><text x="20" y="282" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">外部上下文 → 內部去噪</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">指定區域內生成連續外觀</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">各實作保留外區的方式不同</text></g></g><line x1="1098" y1="388" x2="1122" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="1122.0,388.0 1108.0,381.0 1108.0,395.0" fill="#1765CA"/><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">檢查接縫與遮罩外變動</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.55)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><rect x="135.0" y="164.0" width="80" height="40" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/><line x1="143.0" y1="197.0" x2="207.0" y2="171.0" stroke="#253846" stroke-width="5"/><line x1="148.0" y1="201.0" x2="212.0" y2="173.0" stroke="white" stroke-width="2"/></g><g transform="translate(280,20) scale(0.55)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><rect x="135.0" y="164.0" width="80" height="40" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/></g><text x="20" y="207" font-size="29" fill="#1765CA" font-weight="500" text-anchor="start">原影像</text><text x="280" y="207" font-size="29" fill="#238854" font-weight="500" text-anchor="start">編修候選</text><text x="20" y="276" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">接縫、孔位、遮罩外逐一比</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">編修結果另存，不覆蓋原始圖</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">影像補平不等於實體修復</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">編修影像可以補平，實物狀態並未改變。</text></svg>