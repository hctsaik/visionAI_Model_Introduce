<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">語意與實例分割：同類是否需要分成兩件</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同一影像有兩件支架</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,20) scale(0.65)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/></g><g transform="translate(264,168) scale(0.65)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/></g><text x="22" y="165" font-size="30" fill="#1765CA" font-weight="700" text-anchor="start">甲</text><text x="421" y="218" font-size="30" fill="#238854" font-weight="700" text-anchor="start">乙</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">兩件同類支架，在同一影像</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">逐件標註輪廓與類別</text></g></g><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">語意：兩件都屬支架類</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(30,15) scale(1.8)"><rect x="0" y="0" width="210" height="140" rx="4" fill="white" stroke="#B9D4EF" stroke-width="2"/><g transform="translate(8,8) scale(0.35)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="#1765CA"/><circle cx="60" cy="102" r="24" fill="white" stroke="white" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="white" stroke="white" stroke-width="3"/></g><g transform="translate(110,75) scale(0.35)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="#1765CA"/><circle cx="60" cy="102" r="24" fill="white" stroke="white" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="white" stroke="white" stroke-width="3"/></g></g><text x="20" y="312" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">兩塊都屬「支架」類</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">孔洞仍是背景，不填滿</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">語意類別不等於逐件身份</text></g></g><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">實例：甲乙各有遮罩</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(30,15) scale(1.8)"><rect x="0" y="0" width="210" height="140" rx="4" fill="white" stroke="#B9D4EF" stroke-width="2"/><g transform="translate(8,8) scale(0.35)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="#1765CA"/><circle cx="60" cy="102" r="24" fill="white" stroke="white" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="white" stroke="white" stroke-width="3"/></g><g transform="translate(110,75) scale(0.35)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="#1765CA"/><circle cx="60" cy="102" r="24" fill="white" stroke="white" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="white" stroke="white" stroke-width="3"/></g></g><text x="211" y="76" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">甲</text><text x="225" y="220" font-size="31" fill="#238854" font-weight="700" text-anchor="start">乙</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">孔洞仍是背景，不填滿</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">甲／乙為本影像實例</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">需要逐件交付時，比較實例標註與分離品質。</text></svg>