<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">ConvNeXt：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">效率要連同解析度一起驗</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">固定影像裁切與解析度</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(25,35) scale(0.9)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/><path d="M137,50 l-12,18 18,11 -11,20" stroke="#B94C42" stroke-width="6" fill="none"/></g><rect x="31" y="38" width="223" height="148" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="286" y="83" font-size="29" fill="#CE7917" font-weight="700" text-anchor="start">裁切固定</text><text x="286" y="146" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">縮放固定</text><rect x="20" y="228" width="439" height="70" rx="6" fill="white" stroke="#B9D4EF" stroke-width="