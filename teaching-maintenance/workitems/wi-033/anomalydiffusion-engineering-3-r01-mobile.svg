<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">AnomalyDiffusion：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">外觀與位置都要版本</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">外觀與遮罩編碼配套保存</text><g transform="translate(8,66) scale(0.965)"><rect x="30" y="10" width="430" height="282" rx="9" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="48" y="48" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">外觀</text><text x="48" y="82" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">異常embedding＋基模</text><text x="48" y="126" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">位置</text><text x="48" y="160" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">mask編碼器＋原遮罩</text><text x="48" y="204" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">採樣</text><text x="48" y="238" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">AAR／背景融合／種子步數</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">條件與生成模型一起版本化</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">大小區域分別保存覆蓋證據</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">逐區看生成變化強弱</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.55)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><rect x="54.0" y="126.5" width="92" height="65" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/><line x1="62.0" y1="184.5" x2="138.0" y2="133.5" stroke="#253846" stroke-width="5"/><line x1="67.0" y1="188.5" x2="143.0" y2="135.5" stroke="white" stroke-width="2"/><rect x="253.0" y="169.0" width="54" height="34" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/></g><text x="250" y="74" font-size="29" fill="#CE7917" font-weight="700" text-anchor="start">右小區仍弱</text><line x1="370" y1="95" x2="370" y2="154" stroke="#CE7917" stroke-width="5"/><polygon points="370.0,154.0 377.0,140.0 363.0,140.0" fill="#CE7917"/><text x="250" y="192" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">更多注意</text><text x="20" y="279" font-size="29" fill="#172B43" font-weight="500" text-anchor="start">比較暫時估計與正常圖</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">遮罩內變化弱處得到補強</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">生成時自適應，不保證必成功</text></g></g><line x1="384.0" y1="1461.0" x2="384.0" y2="1478.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1478.0 391.0,1464.0 377.0,1464.0" fill="#1765CA"/><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">兩個區域分開量覆蓋</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.85)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><rect x="54.0" y="126.5" width="92" height="65" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/><line x1="62.0" y1="184.5" x2="138.0" y2="133.5" stroke="#253846" stroke-width="5"/><line x1="67.0" y1="188.5" x2="143.0" y2="135.5" stroke="white" stroke-width="2"/><rect x="253.0" y="169.0" width="54" height="34" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/><line x1="261.0" y1="196.0" x2="299.0" y2="176.0" stroke="#253846" stroke-width="5"/><line x1="266.0" y1="200.0" x2="304.0" y2="178.0" stroke="white" stroke-width="2"/></g><text x="355" y="97" font-size="27" fill="#238854" font-weight="500" text-anchor="start">大區</text><text x="355" y="168" font-size="27" fill="#238854" font-weight="500" text-anchor="start">小區</text><text x="20" y="283" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">兩區各驗：位置、範圍、孔位</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">逐區對應後才可用標註</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">整圖平均不能掩蓋小區漏生成</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">保存嵌入、遮罩編碼與採樣設定。</text></svg>