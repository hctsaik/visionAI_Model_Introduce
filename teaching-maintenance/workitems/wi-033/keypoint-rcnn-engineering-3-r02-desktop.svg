<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">Keypoint R-CNN：遮住的點也可能被猜出</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">遮擋覆住同件的C孔</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(40,50) scale(1.1)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/><circle cx="95" cy="0" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="105" y="-10" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">A</text><circle cx="60" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="70" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">B</text><circle cx="190" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="200" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">C</text></g><rect x="221" y="120" width="100" height="111" rx="5" fill="#D8E0E8" stroke="#A7B4C2" stroke-width="2"/><text x="222" y="255" font-size="29" fill="#CE7917" font-weight="700" text-anchor="start">C被遮住</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同件C孔被遮住，A/B仍可見</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">標註可見性與點身份要分開</text></g></g><line x1="543" y1="388" x2="567" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="567.0,388.0 553.0,381.0 553.0,395.0" fill="#1765CA"/><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">模型仍可能給C的估計</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(40,50) scale(1.1)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/><circle cx="95" cy="0" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="105" y="-10" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">A</text><circle cx="60" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="70" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">B</text><circle cx="190" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="200" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">C</text></g><rect x="221" y="120" width="100" height="111" rx="5" fill="#D8E0E8" stroke="#A7B4C2" stroke-width="2"/><text x="222" y="255" font-size="29" fill="#CE7917" font-weight="700" text-anchor="start">C被遮住</text><circle cx="249" cy="164" r="8" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><line x1="236" y1="149" x2="262" y2="178" stroke="#CE7917" stroke-width="3" stroke-dasharray="7 7"/><text x="17" y="301" font-size="30" fill="#CE7917" font-weight="700" text-anchor="start">C是估計，不代表已看見</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">保留每點分數與原圖</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">遮擋點另評，不以有座標放行</text></g></g><line x1="1098" y1="388" x2="1122" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="1122.0,388.0 1108.0,381.0 1108.0,395.0" fill="#1765CA"/><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">原圖核對後才接幾何求解</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(40,50) scale(1.1)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/><circle cx="95" cy="0" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="105" y="-10" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">A</text><circle cx="60" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="70" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">B</text><circle cx="190" cy="102" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="200" y="92" font-size="24" fill="#CE7917" font-weight="700" text-anchor="start">C</text></g><text x="25" y="291" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">具名2D點 + K + 已知3D</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">另接PnP，再核對重投影</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">點數、退化與校正都需檢查</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">估計位置與可見證據分開，可信度不足要覆核。</text></svg>