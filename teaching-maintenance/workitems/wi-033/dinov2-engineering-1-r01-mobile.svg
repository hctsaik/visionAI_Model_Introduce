<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">DINOv2：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">先抽表示，再定義下游任務</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同一L支架作輸入</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(65,12) scale(1.0)"><path d="M0 0 H110 V140 H260 V220 H0 Z" fill="url(#steel)" stroke="#748A9C" stroke-width="4"/><circle cx="55" cy="62" r="23" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="209" cy="180" r="23" fill="white" stroke="#748A9C" stroke-width="3"/></g><text x="25" y="292" font-size="30" fill="#1765CA" font-weight="700" text-anchor="start">同一L支架：兩孔位置固定</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">輸入影像，尚無良／不良判定</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">工件類別和缺陷規格由下游定義</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">骨幹抽整圖與局部表示</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(12,15) scale(0.46)"><path d="M0 0 H110 V140 H260 V220 H0 Z" fill="url(#steel)" stroke="#748A9C" stroke-width="4"/><circle cx="55" cy="62" r="23" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="209" cy="180" r="23" fill="white" stroke="#748A9C" stroke-width="3"/></g><line x1="140" y1="73" x2="185" y2="73" stroke="#1765CA" stroke-width="5"/><polygon points="185.0,73.0 171.0,66.0 171.0,80.0" fill="#1765CA"/><rect x="200" y="49" width="257" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="328.5" y="79" font-size="26" fill="white" font-weight="700" text-anchor="middle">預訓練骨幹</text><line x1="321" y1="112" x2="321" y2="149" stroke="#1765CA" stroke-width="5"/><polygon points="321.0,149.0 328.0,135.0 314.0,135.0" fill="#1765CA"/><text x="35" y="211" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">整圖：[.2, .8, …]</text><rect x="300.0" y="165.0" width="40.666666666666664" height="40.666666666666664" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="342.6666666666667" y="165.0" width="40.666666666666664" height="40.666666666666664" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="385.3333333333333" y="165.0" width="40.666666666666664" height="40.666666666666664" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="300.0" y="207.66666666666666" width="40.666666666666664" height="40.666666666666664" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="342.6666666666667" y="207.66666666666666" width="40.666666666666664" height="40.666666666666664" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="385.3333333333333" y="207.66666666666666" width="40.666666666666664" height="40.666666666666664" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="300.0" y="250.33333333333331" width="40.666666666666664" height="40.666666666666664" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="342.6666666666667" y="250.33333333333331" width="40.666666666666664" height="40.666666666666664" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="385.3333333333333" y="250.33333333333331" width="40.666666666666664" height="40.666666666666664" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><text x="23" y="286" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">查庫／分類</text><text x="290" y="323" font-size="25" fill="#172B43" font-weight="500" text-anchor="start">局部patch</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">部署抽特徵，再接下游任務</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">此處不需要Teacher與訓練配對</text></g></g><line x1="384.0" y1="1461.0" x2="384.0" y2="1478.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1478.0 391.0,1464.0 377.0,1464.0" fill="#1765CA"/><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">下游可分類或查庫</text><g transform="translate(8,66) scale(0.965)"><rect x="20" y="15" width="440" height="55" rx="6" fill="white" stroke="#1765CA" stroke-width="2"/><text x="32" y="52" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">表示向量 / patch表示</text><line x1="240" y1="87" x2="130" y2="139" stroke="#1765CA" stroke-width="5"/><polygon points="130.0,139.0 145.6,139.3 139.7,126.7" fill="#1765CA"/><line x1="240" y1="87" x2="362" y2="139" stroke="#238854" stroke-width="5"/><polygon points="362.0,139.0 351.9,127.1 346.4,140.0" fill="#238854"/><rect x="15" y="153" width="210" height="97" rx="6" fill="white" stroke="#1765CA" stroke-width="2"/><text x="27" y="190" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">標註任務頭</text><text x="27" y="232" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">類別分數</text><rect x="255" y="153" width="210" height="97" rx="6" fill="white" stroke="#238854" stroke-width="2"/><text x="267" y="190" font-size="27" fill="#238854" font-weight="650" text-anchor="start">正常參考庫</text><text x="267" y="232" font-size="27" fill="#238854" font-weight="650" text-anchor="start">最近距離</text><text x="20" y="305" font-size="27" fill="#CE7917" font-weight="500" text-anchor="start">兩個可選下游，不是固定串接</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">任務輸出要有資料和判定規格</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">骨幹特徵本身不是缺陷機率</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">骨幹交特徵，分類與異常判定還要另接。</text></svg>