<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">ControlNet：相同輪廓，不限定有無刮傷</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同一張雙孔輪廓條件</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.9)"><rect x="0" y="0" width="360" height="240" rx="9" fill="#13222F" stroke="white" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="#13222F" stroke="white" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="#13222F" stroke="white" stroke-width="3"/></g><text x="20" y="286" font-size="30" fill="#1765CA" font-weight="700" text-anchor="start">文字：銀色雙孔金屬板</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">輪廓含外框與兩個孔位</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">輪廓條件不是缺陷分數</text></g></g><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">無傷與有傷都可符輪廓</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.55)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/></g><g transform="translate(280,20) scale(0.55)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><line x1="143.0" y1="197.0" x2="207.0" y2="171.0" stroke="#253846" stroke-width="5"/><line x1="148.0" y1="201.0" x2="212.0" y2="173.0" stroke="white" stroke-width="2"/></g><text x="20" y="209" font-size="28" fill="#1765CA" font-weight="500" text-anchor="start">無傷候選</text><text x="280" y="209" font-size="28" fill="#CE7917" font-weight="500" text-anchor="start">有傷候選</text><text x="20" y="279" font-size="29" fill="#172B43" font-weight="500" text-anchor="start">兩者外框與孔位完全一樣</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">表面刮傷不在這張輪廓條件內</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">輪廓符合不能證明傷是真實的</text></g></g><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">若要真缺陷，回實拍核對</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.55)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><line x1="143.0" y1="197.0" x2="207.0" y2="171.0" stroke="#253846" stroke-width="5"/><line x1="148.0" y1="201.0" x2="212.0" y2="173.0" stroke="white" stroke-width="2"/></g><g transform="translate(280,20) scale(0.55)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/></g><text x="20" y="205" font-size="28" fill="#CE7917" font-weight="500" text-anchor="start">生成刮傷</text><text x="280" y="205" font-size="28" fill="#238854" font-weight="500" text-anchor="start">原始觀測</text><text x="20" y="278" font-size="26" fill="#172B43" font-weight="500" text-anchor="start">同位置回比，缺乏觀測就待確認</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">生成可用於創作或資料候選</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">現場缺陷判定須原始觀測證據</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">條件未描述的細節，不能當成觀測證據。</text></svg>