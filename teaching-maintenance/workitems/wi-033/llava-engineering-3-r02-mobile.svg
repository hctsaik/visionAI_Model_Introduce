<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">LLaVA：原圖、問題與版本一起保存</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">固定影像前處理與問題</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,12) scale(0.63)"><rect x="0" y="0" width="410" height="205" rx="15" fill="#34424B" stroke="#23333D" stroke-width="2"/><circle cx="112" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="112" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="300" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="300" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="112" cy="103" r="32" fill="#CAD3D8" stroke="#AAB6BD" stroke-width="3"/><line x1="89" y1="103" x2="135" y2="103" stroke="#596D79" stroke-width="6"/><line x1="112" y1="80" x2="112" y2="126" stroke="#596D79" stroke-width="6"/></g><rect x="20" y="188" width="448" height="97" rx="6" fill="white" stroke="#1765CA" stroke-width="2"/><text x="32" y="225" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">固定原圖＋完整問題</text><text x="32" y="267" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">模型／processor／生成設定</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">請求與回覆都要可追溯</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">不同LLaVA版本需核對處理方式</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">要求左右分開描述</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(25,12) scale(0.66)"><rect x="0" y="0" width="410" height="205" rx="15" fill="#34424B" stroke="#23333D" stroke-width="2"/><circle cx="112" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="112" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="300" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="300" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="112" cy="103" r="32" fill="#CAD3D8" stroke="#AAB6BD" stroke-width="3"/><line x1="89" y1="103" x2="135" y2="103" stroke="#596D79" stroke-width="6"/><line x1="112" y1="80" x2="112" y2="126" stroke="#596D79" stroke-width="6"/></g><text x="22" y="204" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">左側 → 可見 → 螺絲</text><text x="22" y="254" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">右側 → 未見 → 螺絲</text><text x="22" y="301" font-size="29" fill="#CE7917" font-weight="700" text-anchor="start">原因：未知</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">逐token回答仍可能犯錯</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">空座不能證明漏裝或鬆脫原因</text></g></g><line x1="384.0" y1="1461.0" x2="384.0" y2="1478.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1478.0 391.0,1464.0 377.0,1464.0" fill="#1765CA"/><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">核對證據後交人工覆核</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,10) scale(0.68)"><rect x="0" y="0" width="410" height="205" rx="15" fill="#34424B" stroke="#23333D" stroke-width="2"/><circle cx="112" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="112" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="300" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="300" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="112" cy="103" r="32" fill="#CAD3D8" stroke="#AAB6BD" stroke-width="3"/><line x1="89" y1="103" x2="135" y2="103" stroke="#596D79" stroke-width="6"/><line x1="112" y1="80" x2="112" y2="126" stroke="#596D79" stroke-width="6"/></g><text x="22" y="210" font-size="27" fill="#1765CA" font-weight="700" text-anchor="start">右側未見螺絲：圖中可核對</text><text x="22" y="262" font-size="29" fill="#CE7917" font-weight="700" text-anchor="start">原因／遮擋：保持未知</text><text x="22" y="312" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">低可信 → 原圖與回答交覆核</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">回答、位置證據與決策分開</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">流暢文字不能作自動放行依據</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">回答要可追溯，錯誤與不確定都要留存。</text></svg>