<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">Qwen2-VL：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">像素預算要與小字一起驗</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">固定銘牌與processor設定</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,10) scale(0.75)"><rect x="0" y="0" width="360" height="175" rx="8" fill="#DDE4E8" stroke="#8799A6" stroke-width="2"/><rect x="25" y="25" width="310" height="124" rx="3" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="45" y="65" font-size="25" fill="#172B43" font-weight="500" text-anchor="start">批號 / LOT</text><text x="45" y="124" font-size="48" fill="#172B43" font-weight="800" text-anchor="start">B08</text></g><rect x="20" y="191" width="436" height="97" rx="6" fill="white" stroke="#1765CA" stroke-width="2"/><text x="32" y="228" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">像素預算＋長寬比</text><text x="32" y="270" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">processor＋模型版本</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">設定變更會影響視覺token</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">應用硬體實測記憶體與完整耗時</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">保留可讀字與不確定欄位</text><g transform="translate(8,66) scale(0.965)"><rect x="20" y="20" width="433" height="55" rx="6" fill="white" stroke="#238854" stroke-width="2"/><text x="32" y="57" font-size="27" fill="#238854" font-weight="650" text-anchor="start">清楚：B08 → 核對後保存</text><rect x="20" y="128" width="433" height="55" rx="6" fill="white" stroke="#CE7917" stroke-width="2"/><text x="32" y="165" font-size="27" fill="#CE7917" font-weight="650" text-anchor="start">不清：B0? → 重拍／未知</text><text x="25" y="281" font-size="25" fill="#172B43" font-weight="500" text-anchor="start">文字是情境示意，非降採樣結果</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">別用常見批號補造看不清的字</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">原像素不足時，更多token也有限</text></g></g><line x1="384.0" y1="1461.0" x2="384.0" y2="1478.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1478.0 391.0,1464.0 377.0,1464.0" fill="#1765CA"/><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">逐欄驗文字與完整耗時</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,10) scale(0.72)"><rect x="0" y="0" width="360" height="175" rx="8" fill="#DDE4E8" stroke="#8799A6" stroke-width="2"/><rect x="25" y="25" width="310" height="124" rx="3" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="45" y="65" font-size="25" fill="#172B43" font-weight="500" text-anchor="start">批號 / LOT</text><text x="45" y="124" font-size="48" fill="#172B43" font-weight="800" text-anchor="start">B08</text></g><text x="305" y="85" font-size="27" fill="#238854" font-weight="700" text-anchor="start">真值B08</text><rect x="20" y="202" width="437" height="97" rx="6" fill="white" stroke="#1765CA" stroke-width="2"/><text x="32" y="239" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">逐字錯誤／未知率／覆核量</text><text x="32" y="281" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">加入前後處理與網路耗時</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">格式與可讀內容分別核對</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">題目、欄位與測試集都需固定</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">節省token前，先確認關鍵字仍能看清。</text></svg>