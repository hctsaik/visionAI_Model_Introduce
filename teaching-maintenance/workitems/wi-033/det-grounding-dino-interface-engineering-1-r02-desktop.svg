<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">Grounding DINO：用詞語指定想找什麼</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">影像與文字定義想找的類別</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,12) scale(0.76)"><rect x="0" y="0" width="390" height="240" rx="12" fill="#D9ECE6" stroke="#77A796" stroke-width="2"/><line x1="105" y1="0" x2="105" y2="240" stroke="#92B6A2" stroke-width="12"/><rect x="75" y="40" width="60" height="155" rx="5" fill="#9AA6AC" stroke="#6F7F88" stroke-width="2"/><rect x="75" y="65" width="60" height="105" rx="2" fill="#243B40" stroke="#243B40" stroke-width="2"/><text x="105" y="123" font-size="25" fill="white" font-weight="700" text-anchor="middle">103</text><text x="105" y="223" font-size="25" fill="#172B43" font-weight="700" text-anchor="middle">A</text><line x1="270" y1="0" x2="270" y2="240" stroke="#92B6A2" stroke-width="12"/><rect x="240" y="40" width="60" height="155" rx="5" fill="#9AA6AC" stroke="#6F7F88" stroke-width="2"/><rect x="240" y="65" width="60" height="105" rx="2" fill="#243B40" stroke="#243B40" stroke-width="2"/><text x="270" y="123" font-size="25" fill="white" font-weight="700" text-anchor="middle">272</text><text x="270" y="223" font-size="25" fill="#172B43" font-weight="700" text-anchor="middle">B</text></g><text x="20" y="238" font-size="30" fill="#238854" font-weight="700" text-anchor="start">想找的類別：resistor</text><text x="20" y="298" font-size="29" fill="#172B43" font-weight="500" text-anchor="start">不必先給每件的座標</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">文字描述目標，影像提供位置</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">工業料號能否辨識仍須另驗</text></g></g><line x1="543" y1="388" x2="567" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="567.0,388.0 553.0,381.0 553.0,395.0" fill="#1765CA"/><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">一個詞語對應兩件物件</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(25,5) scale(0.75)"><rect x="0" y="0" width="390" height="240" rx="12" fill="#D9ECE6" stroke="#77A796" stroke-width="2"/><line x1="105" y1="0" x2="105" y2="240" stroke="#92B6A2" stroke-width="12"/><rect x="75" y="40" width="60" height="155" rx="5" fill="#9AA6AC" stroke="#6F7F88" stroke-width="2"/><rect x="75" y="65" width="60" height="105" rx="2" fill="#243B40" stroke="#243B40" stroke-width="2"/><text x="105" y="123" font-size="25" fill="white" font-weight="700" text-anchor="middle">103</text><text x="105" y="223" font-size="25" fill="#172B43" font-weight="700" text-anchor="middle">A</text><rect x="63" y="28" width="84" height="180" rx="0" fill="none" stroke="#1765CA" stroke-width="2"/><line x1="270" y1="0" x2="270" y2="240" stroke="#92B6A2" stroke-width="12"/><rect x="240" y="40" width="60" height="155" rx="5" fill="#9AA6AC" stroke="#6F7F88" stroke-width="2"/><rect x="240" y="65" width="60" height="105" rx="2" fill="#243B40" stroke="#243B40" stroke-width="2"/><text x="270" y="123" font-size="25" fill="white" font-weight="700" text-anchor="middle">272</text><text x="270" y="223" font-size="25" fill="#172B43" font-weight="700" text-anchor="middle">B</text><rect x="228" y="28" width="84" height="180" rx="0" fill="none" stroke="#1765CA" stroke-width="2"/></g><rect x="55" y="247" width="320" height="43" rx="12" fill="#238854" stroke="#238854" stroke-width="2"/><text x="215.0" y="277" font-size="26" fill="white" font-weight="700" text-anchor="middle">resistor</text><line x1="155" y1="242" x2="104" y2="174" stroke="#238854" stroke-width="5"/><polygon points="104.0,174.0 106.8,189.4 118.0,181.0" fill="#238854"/><line x1="273" y1="242" x2="245" y2="174" stroke="#238854" stroke-width="5"/><polygon points="245.0,174.0 243.9,189.6 256.8,184.3" fill="#238854"/><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同一詞語可以對應兩個物件</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">框是相關位置，不是精確輪廓</text></g></g><line x1="1098" y1="388" x2="1122" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="1122.0,388.0 1108.0,381.0 1108.0,395.0" fill="#1765CA"/><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">交付詞語相關的框</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(25,15) scale(0.9)"><rect x="0" y="0" width="390" height="240" rx="12" fill="#D9ECE6" stroke="#77A796" stroke-width="2"/><line x1="105" y1="0" x2="105" y2="240" stroke="#92B6A2" stroke-width="12"/><rect x="75" y="40" width="60" height="155" rx="5" fill="#9AA6AC" stroke="#6F7F88" stroke-width="2"/><rect x="75" y="65" width="60" height="105" rx="2" fill="#243B40" stroke="#243B40" stroke-width="2"/><text x="105" y="123" font-size="25" fill="white" font-weight="700" text-anchor="middle">103</text><text x="105" y="223" font-size="25" fill="#172B43" font-weight="700" text-anchor="middle">A</text><rect x="63" y="28" width="84" height="180" rx="0" fill="none" stroke="#1765CA" stroke-width="2"/><line x1="270" y1="0" x2="270" y2="240" stroke="#92B6A2" stroke-width="12"/><rect x="240" y="40" width="60" height="155" rx="5" fill="#9AA6AC" stroke="#6F7F88" stroke-width="2"/><rect x="240" y="65" width="60" height="105" rx="2" fill="#243B40" stroke="#243B40" stroke-width="2"/><text x="270" y="123" font-size="25" fill="white" font-weight="700" text-anchor="middle">272</text><text x="270" y="223" font-size="25" fill="#172B43" font-weight="700" text-anchor="middle">B</text><rect x="228" y="28" width="84" height="180" rx="0" fill="none" stroke="#1765CA" stroke-width="2"/></g><text x="30" y="300" font-size="28" fill="#1765CA" font-weight="700" text-anchor="start">resistor → A、B框</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">回原圖查漏件與框的位置</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">詞語與框，不是像素遮罩</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">文字可以引導定位，專業料號仍需另驗。</text></svg>