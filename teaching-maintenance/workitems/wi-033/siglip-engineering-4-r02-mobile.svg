<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2400" viewBox="0 0 768 2400"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2400" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">SigLIP：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">逐對學習不會補出缺少的類別</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195) scale(1.3)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">兩種模型看同一齒輪</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(112,28) scale(1.3)"><polygon points="190.0,100.0 189.2,111.7 170.5,118.9 167.4,127.9 177.9,145.0 171.4,154.8 151.6,151.6 144.4,157.9 145.0,177.9 134.4,183.1 118.9,170.5 109.5,172.4 100.0,190.0 88.3,189.2 81.1,170.5 72.1,167.4 55.0,177.9 45.2,171.4 48.4,151.6 42.1,144.4 22.1,145.0 16.9,134.4 29.5,118.9 27.6,109.5 10.0,100.0 10.8,88.3 29.5,81.1 32.6,72.1 22.1,55.0 28.6,45.2 48.4,48.4 55.6,42.1 55.0,22.1 65.6,16.9 81.1,29.5 90.5,27.6 100.0,10.0 111.7,10.8 118.9,29.5 127.9,32.6 145.0,22.1 154.8,28.6 151.6,48.4 157.9,55.6 177.9,55.0 183.1,65.6 170.5,81.1 172.4,90.5" fill="url(#steel)" stroke="#73899E" stroke-width="3"/><circle cx="100" cy="100" r="30" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/></g><text x="15" y="345" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">同一齒輪影像</text><text x="15" y="398" font-size="