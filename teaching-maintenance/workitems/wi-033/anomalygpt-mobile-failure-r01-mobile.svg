<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">AnomalyGPT：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">回答肯定仍要查證</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同一原圖：p 細痕、q 孔邊</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(135,10) scale(1.15)"><rect x="0" y="0" width="180" height="220" rx="8" fill="#C9D5E1" stroke="#73899E" stroke-width="2"/><circle cx="53" cy="58" r="30" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="137" cy="169" r="22" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><path d="M103,127 l35,-31" stroke="#8B655D" stroke-width="4"/><text x="140" y="95" font-size="28" fill="#1765CA" font-weight="700" text-anchor="start">p</text><text x="158" y="201" font-size="28" fill="#238854" font-weight="700" text-anchor="start">q</text></g><text x="15" y="328" font-size="28" fill="#1765CA" font-weight="500" text-anchor="start">p：看得見的線狀痕跡</text><text x="15" y="377" font-size="28" fill="#238854" font-weight="500" text-anchor="start">q：正常孔邊</text><text x="15" y="424" font-size="27" fill="#172B43" font-weight="500" text-anchor="