<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">YOLOE：提示方便，料號仍要查證</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">兩顆電阻外觀相似</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(30,12) scale(0.9)"><rect x="0" y="0" width="390" height="240" rx="12" fill="#D9ECE6" stroke="#77A796" stroke-width="2"/><line x1="105" y1="0" x2="105" y2="240" stroke="#92B6A2" stroke-width="12"/><rect x="75" y="40" width="60" height="155" rx="5" fill="#9AA6AC" stroke="#6F7F88" stroke-width="2"/><rect x="75" y="65" width="60" height="105" rx="2" fill="#243B40" stroke="#243B40" stroke-width="2"/><text x="105" y="123" font-size="25" fill="white" font-weight="700" text-anchor="middle">103</text><text x="105" y="223" font-size="25" fill="#172B43" font-weight="700" text-anchor="middle">A</text><rect x="63" y="28" width="84" height="180" rx="0" fill="none" stroke="#1765CA" stroke-width="2"/><line x1="270" y1="0" x2="270" y2="240" stroke="#92B6A2" stroke-width="12"/><rect x="240" y="40" width="60" height="155" rx="5" fill="#9AA6AC" stroke="#6F7F88" stroke-width="2"/><rect x="240" y="65" width="60" height="105" rx="2" fill="#243B40" stroke="#243B40" stroke-width="2"/><text x="270" y="123" font-size="25" fill="white" font-weight="700" text-anchor="middle">272</text><text x="270" y="223" font-size="25" fill="#172B43" font-weight="700" text-anchor="middle">B</text><rect x="228" y="28" width="84" height="180" rx="0" fill="none" stroke="#1765CA" stroke-width="2"/></g><text x="22" y="286" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">A：resistor　B：resistor</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同一影像，兩件逐一標註</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">103／272是印字，類別都是電阻</text></g></g><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">範例A可找出A與B</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(25,15) scale(0.9)"><rect x="0" y="0" width="390" height="240" rx="12" fill="#D9ECE6" stroke="#77A796" stroke-width="2"/><line x1="105" y1="0" x2="105" y2="240" stroke="#92B6A2" stroke-width="12"/><rect x="75" y="40" width="60" height="155" rx="5" fill="#9AA6AC" stroke="#6F7F88" stroke-width="2"/><rect x="75" y="65" width="60" height="105" rx="2" fill="#243B40" stroke="#243B40" stroke-width="2"/><text x="105" y="123" font-size="25" fill="white" font-weight="700" text-anchor="middle">103</text><text x="105" y="223" font-size="25" fill="#172B43" font-weight="700" text-anchor="middle">A</text><rect x="63" y="28" width="84" height="180" rx="0" fill="none" stroke="#1765CA" stroke-width="2"/><line x1="270" y1="0" x2="270" y2="240" stroke="#92B6A2" stroke-width="12"/><rect x="240" y="40" width="60" height="155" rx="5" fill="#9AA6AC" stroke="#6F7F88" stroke-width="2"/><rect x="240" y="65" width="60" height="105" rx="2" fill="#243B40" stroke="#243B40" stroke-width="2"/><text x="270" y="123" font-size="25" fill="white" font-weight="700" text-anchor="middle">272</text><text x="270" y="223" font-size="25" fill="#172B43" font-weight="700" text-anchor="middle">B</text><rect x="228" y="28" width="84" height="180" rx="0" fill="none" stroke="#1765CA" stroke-width="2"/></g><g opacity=".5"><rect x="92.5" y="51" width="54" height="139.5" rx="5" fill="#72C4BD" stroke="#238854" stroke-width="2"/></g><g opacity=".5"><rect x="241" y="51" width="54" height="139.5" rx="5" fill="#72C4BD" stroke="#238854" stroke-width="2"/></g><text x="30" y="300" font-size="28" fill="#1765CA" font-weight="700" text-anchor="start">A、B：相似類別的框與遮罩</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">回原圖查漏件與框的位置</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">相似外觀不保證料號相同</text></g></g><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">讀料號並核對工作規格</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(25,10) scale(0.9)"><rect x="0" y="0" width="390" height="240" rx="12" fill="#D9ECE6" stroke="#77A796" stroke-width="2"/><line x1="105" y1="0" x2="105" y2="240" stroke="#92B6A2" stroke-width="12"/><rect x="75" y="40" width="60" height="155" rx="5" fill="#9AA6AC" stroke="#6F7F88" stroke-width="2"/><rect x="75" y="65" width="60" height="105" rx="2" fill="#243B40" stroke="#243B40" stroke-width="2"/><text x="105" y="123" font-size="25" fill="white" font-weight="700" text-anchor="middle">103</text><text x="105" y="223" font-size="25" fill="#172B43" font-weight="700" text-anchor="middle">A</text><line x1="270" y1="0" x2="270" y2="240" stroke="#92B6A2" stroke-width="12"/><rect x="240" y="40" width="60" height="155" rx="5" fill="#9AA6AC" stroke="#6F7F88" stroke-width="2"/><rect x="240" y="65" width="60" height="105" rx="2" fill="#243B40" stroke="#243B40" stroke-width="2"/><text x="270" y="123" font-size="25" fill="white" font-weight="700" text-anchor="middle">272</text><text x="270" y="223" font-size="25" fill="#172B43" font-weight="700" text-anchor="middle">B</text></g><text x="20" y="274" font-size="38" fill="#CE7917" font-weight="800" text-anchor="start">103 ≠ 272</text><text x="244" y="276" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">不能直接互換</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同屬電阻，不代表同一規格</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">OCR／標籤與物料規格另核對</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">外觀相似可以被找出，精確規格需要其他證據。</text></svg>