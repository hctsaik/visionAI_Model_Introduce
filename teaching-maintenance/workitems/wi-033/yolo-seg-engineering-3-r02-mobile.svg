<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">YOLO-Seg：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">遮罩要和同一個框一起交付</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">候選框與係數保持配對</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,20) scale(0.55)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/></g><g transform="translate(268,145) scale(0.55)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/></g><rect x="9" y="14" width="154" height="106" rx="0" fill="none" stroke="#1765CA" stroke-width="2"/><rect x="260" y="135" width="160" height="118" rx="0" fill="none" stroke="#238854" stroke-width="2"/><text x="186" y="65" font-size="32" fill="#1765CA" font-weight="700" text-anchor="start">甲：[½,½]</text><text x="8" y="216" font-size="30" fill="#238854" font-weight="700" text-anchor="start">乙：[½,−½]</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">框索引與係數索引一一對應</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">過濾候選時一併保留或移除</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">去重保留後產生對應遮罩</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,50) scale(0.55)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/></g><rect x="15" y="45" width="148" height="99" rx="0" fill="none" stroke="#1765CA" stroke-width="2"/><rect x="23" y="52" width="148" height="99" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><line x1="192" y1="96" x2="277" y2="96" stroke="#1765CA" stroke-width="5"/><polygon points="277.0,96.0 263.0,89.0 263.0,103.0" fill="#1765CA"/><g transform="translate(308,50) scale(0.55)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/></g><rect x="303" y="45" width="148" height="99" rx="0" fill="none" stroke="#1765CA" stroke-width="2"/><text x="15" y="256" font-size="30" fill="#1765CA" font-weight="700" text-anchor="start">去重保留甲 → 同索引係數</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">保留候選的幾何不因去重改變</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">相同框与係數用來產生遮罩</text></g></g><line x1="384.0" y1="1461.0" x2="384.0" y2="1478.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1478.0 391.0,1464.0 377.0,1464.0" fill="#1765CA"/><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">原圖檢查孔洞與相鄰件</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,15) scale(1.8)"><rect x="0" y="0" width="210" height="140" rx="4" fill="white" stroke="#B9D4EF" stroke-width="2"/><g transform="translate(8,8) scale(0.35)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="#1765CA"/><circle cx="60" cy="102" r="24" fill="white" stroke="white" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="white" stroke="white" stroke-width="3"/></g><g transform="translate(110,75) scale(0.35)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="#1765CA"/><circle cx="60" cy="102" r="24" fill="white" stroke="white" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="white" stroke="white" stroke-width="3"/></g></g><text x="15" y="291" font-size="30" fill="#1765CA" font-weight="700" text-anchor="start">核對空孔與相鄰件分離</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">遮罩、框、分數和原圖一起存</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">精密輪廓與尺寸另做誤差驗證</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">把框、類別與遮罩綁定，映回原圖再核對。</text></svg>