<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">ViT：一個位置也會參考其他區塊</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">缺口片與孔邊片各有表示</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.88)"><path d="M0,0 H95 L120,35 H250 V160 H0 Z" fill="url(#steel)" stroke="#73899E" stroke-width="4"/><circle cx="60" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><circle cx="190" cy="102" r="24" fill="#F5F9FF" stroke="#73899E" stroke-width="3"/><line x1="14" y1="18" x2="75" y2="18" stroke="#FFFFFF" stroke-width="6"/><path d="M137,50 l-12,18 18,11 -11,20" stroke="#B94C42" stroke-width="6" fill="none"/></g><rect x="123" y="60" width="47" height="54" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><rect x="166" y="87" width="45" height="49" rx="0" fill="none" stroke="#238854" stroke-width="2"/><line x1="146" y1="116" x2="88" y2="224" stroke="#CE7917" stroke-width="3" stroke-dasharray="7 7"/><line x1="191" y1="139" x2="302" y2="224" stroke="#238854" stroke-width="3" stroke-dasharray="7 7"/><rect x="20" y="237" width="190" height="43" rx="12" fill="#CE7917" stroke="#CE7917" stroke-width="2"/><text x="115.0" y="267" font-size="26" fill="white" font-weight="700" text-anchor="middle">刮傷片</text><rect x="257" y="237" width="190" height="43" rx="12" fill="#238854" stroke="#238854" stroke-width="2"/><text x="352.0" y="267" font-size="26" fill="white" font-weight="700" text-anchor="middle">孔邊片</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同一圖，不同位置各有表示</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">框是分片示意，不是偵測框</text></g></g><line x1="543" y1="388" x2="567" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="567.0,388.0 553.0,381.0 553.0,395.0" fill="#1765CA"/><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">依內容形成參考權重</text><g transform="translate(8,66) scale(0.965)"><rect x="15" y="126" width="119" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="74.5" y="156" font-size="26" fill="white" font-weight="700" text-anchor="middle">查詢Q</text><line x1="143" y1="143" x2="226" y2="69" stroke="#CE7917" stroke-width="7"/><polygon points="226.0,69.0 210.9,73.1 220.2,83.5" fill="#CE7917"/><line x1="143" y1="160" x2="226" y2="245" stroke="#238854" stroke-width="4"/><polygon points="226.0,245.0 221.2,230.1 211.2,239.9" fill="#238854"/><rect x="247" y="34" width="217" height="43" rx="12" fill="#CE7917" stroke="#CE7917" stroke-width="2"/><text x="355.5" y="64" font-size="26" fill="white" font-weight="700" text-anchor="middle">值A：[2,0]</text><rect x="247" y="213" width="217" height="43" rx="12" fill="#238854" stroke="#238854" stroke-width="2"/><text x="355.5" y="243" font-size="26" fill="white" font-weight="700" text-anchor="middle">值B：[0,4]</text><text x="157" y="89" font-size="28" fill="#CE7917" font-weight="700" text-anchor="start">0.75</text><text x="156" y="247" font-size="28" fill="#238854" font-weight="700" text-anchor="start">0.25</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">依相關程度，取不同份量</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">權重是教學給定，非缺陷率</text></g></g><line x1="1098" y1="388" x2="1122" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="1122.0,388.0 1108.0,381.0 1108.0,395.0" fill="#1765CA"/><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">加權更新，再由CLS分類</text><g transform="translate(8,66) scale(0.965)"><text x="15" y="50" font-size="34" fill="#CE7917" font-weight="700" text-anchor="start">0.75 × [2,0]</text><text x="15" y="102" font-size="34" fill="#238854" font-weight="700" text-anchor="start">+ 0.25 × [0,4]</text><line x1="15" y1="132" x2="433" y2="132" stroke="#B9D4EF" stroke-width="3"/><text x="15" y="185" font-size="39" fill="#1765CA" font-weight="800" text-anchor="start">= [1.5,1]</text><line x1="228" y1="209" x2="228" y2="247" stroke="#1765CA" stroke-width="5"/><polygon points="228.0,247.0 235.0,233.0 221.0,233.0" fill="#1765CA"/><rect x="90" y="263" width="283" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="231.5" y="293" font-size="26" fill="white" font-weight="700" text-anchor="middle">分類token再讀出</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">本例展示加權，不是平均貼圖</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">實際還有多頭、殘差與MLP</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">注意力加權其他表示，位置身份仍要保留。</text></svg>