fill="#172B43" font-weight="500" text-anchor="start">不能只保存挑選後的漂亮圖</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">多候選乘上多步採樣</text><g transform="translate(8,66) scale(0.965)"><rect x="30" y="30" width="85" height="100" rx="6" fill="#F5F9FF" stroke="#1765CA" stroke-width="2"/><text x="72" y="91" font-size="32" fill="#1765CA" font-weight="700" text-anchor="middle">1</text><rect x="140" y="30" width="85" height="100" rx="6" fill="#F5F9FF" stroke="#1765CA" stroke-width="2"/><text x="182" y="91" font-size="32" fill="#1765CA" font-weight="700" text-anchor="middle">2</text><rect x="250" y="30" width="85" height="100" rx="6" fill="#F5F9FF" stroke="#1765CA" stroke-width="2"/><text x="292" y="91" font-size="32" fill="#1765CA" font-weight="700" text-anchor="middle">3</text><rect x="360" y="30" width="85" height="100" rx="6" fill="#F5F9FF" stroke="#1765CA" stroke-width="2"/><text x="402" y="91" font-size="32" fill="#1765CA" font-weight="700" text-anchor="middle">4</text><text x="20" y="199" font-size="33" fill="#172B43" font-weight="500" text-anchor="start">4候選 × 每張20步</text><text x="20" y="273" font-size="35" fill="#238854" font-weight="700" text-anchor="start">= 80次去噪呼叫</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">作者算例，未含挑選與前處理</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">總時間還要實測，非80毫秒</text></g></g><line x1="384.0" y1="1461.0" x2="384.0" y2="1478.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1478.0 391.0,1464.0 377.0,1464.0" fill="#1765CA"/><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">挑選仍需真缺陷驗證</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.55)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/></g><g transform="translate(280,20) scale(0.55)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><line x1="143.0" y1="197.0" x2="207.0" y2="171.0" stroke="#253846" stroke-width="5"/><line x1="148.0" y1="201.0" x2="212.0" y2="173.0" stroke="white" stroke-width="2"/></g><text x="20" y="205" font-size="27" fill="#1765CA" font-weight="500" text-anchor="start">正常：驗誤報</text><text x="280" y="205" font-size="27" fill="#CE7917" font-weight="500" text-anchor="start">缺陷：驗漏檢</text><text x="20" y="280" font-size="28" fill="#238854" font-weight="700" text-anchor="start">真實留出，按件與批次分開</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">比較加合成前後的真實錯誤</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">不能用合成圖本身證明資料效益</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">候選越多，生成與挑選的成本都會累積。</text></svg>