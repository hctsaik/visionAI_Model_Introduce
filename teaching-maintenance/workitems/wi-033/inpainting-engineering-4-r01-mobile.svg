<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">Inpainting：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">照片填孔，實體仍有孔</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">原板左上孔指定可編修</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.9)"><g transform="translate(0,0) scale(1)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/></g><circle cx="65" cy="47" r="35" fill="none" stroke="#CE7917" stroke-width="3"/></g><text x="20" y="287" font-size="28" fill="#CE7917" font-weight="700" text-anchor="start">左上真孔被指定為可編修區</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">橘圈是要改的影像區域</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">原板同時仍有右上孔</text></g></g><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">生成版孔被紋理填平</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.9)"><g transform="translate(0,0) scale(1)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/></g><circle cx="65" cy="47" r="27" fill="#BDCBD6" stroke="#BDCBD6" stroke-width="3"/></g><text x="20" y="287" font-size="28" fill="#238854" font-weight="700" text-anchor="start">候選照片：左孔像素被填平</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">只改影像，右孔保持原位置</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">照片中不見孔，不代表補了材料</text></g></g><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">重新拍攝仍看見真孔</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.9)"><g transform="translate(0,0) scale(1)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/></g><circle cx="65" cy="47" r="35" fill="none" stroke="#CE7917" stroke-width="3"/></g><text x="20" y="287" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">重新取像：同一真孔仍存在</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">沒有物理修補，孔仍在實物上</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">編修照片不可作修復驗收證據</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">影像編修只改像素，不能當實物修復。</text></svg>