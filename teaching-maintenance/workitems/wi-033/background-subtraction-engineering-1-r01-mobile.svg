<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">背景相減：先建立场景常態</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">多時間建立背景模型</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,30) scale(0.3)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="50" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/></g><g transform="translate(160,30) scale(0.3)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="165" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/></g><g transform="translate(305,30) scale(0.3)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="290" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/></g><text x="30" y="135" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">多時間影格 → 同位置統計</text><line x1="230" y1="152" x2="230" y2="175" stroke="#1765CA" stroke-width="5"/><polygon points="230.0,175.0 237.0,161.0 223.0,161.0" fill="#1765CA"/><g transform="translate(55,182) scale(0.8)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/></g><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">常見外觀累積成背景模型</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">MOG2可保留多個常見分布</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">當前方件與背景比較</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,15) scale(0.49)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/></g><g transform="translate(255,15) scale(0.49)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="160" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/></g><text x="50" y="125" font-size="26" fill="#1765CA" font-weight="700" text-anchor="start">累積背景</text><text x="282" y="125" font-size="26" fill="#CE7917" font-weight="700" text-anchor="start">目前有方件</text><line x1="105" y1="140" x2="170" y2="172" stroke="#1765CA" stroke-width="5"/><polygon points="170.0,172.0 160.5,159.5 154.3,172.1" fill="#1765CA"/><line x1="370" y1="140" x2="290" y2="172" stroke="#1765CA" stroke-width="5"/><polygon points="290.0,172.0 305.6,173.3 300.4,160.3" fill="#1765CA"/><g transform="translate(55,182) scale(0.8)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#15222F" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="160" y="40" width="85" height="85" rx="1" fill="white" stroke="#DAE1E7" stroke-width="2"/></g><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同位置比較，方件形成前景</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">不是只和上一張影格相減</text></g></g><line x1="384.0" y1="1461.0" x2="384.0" y2="1478.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1478.0 391.0,1464.0 377.0,1464.0" fill="#1765CA"/><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">遮罩交後段定位與追蹤</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,15) scale(0.95)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#15222F" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="160" y="40" width="85" height="85" rx="1" fill="white" stroke="#DAE1E7" stroke-width="2"/></g><line x1="235" y1="190" x2="235" y2="230" stroke="#1765CA" stroke-width="5"/><polygon points="235.0,230.0 242.0,216.0 228.0,216.0" fill="#1765CA"/><rect x="20" y="255" width="440" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="240.0" y="285" font-size="26" fill="white" font-weight="700" text-anchor="middle">後段：區域處理／偵測／追蹤</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">前景mask沒有類別或永久ID</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">陰影與雜訊要按任務處理</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">前景是相對背景的變化，不是物件類別。</text></svg>