ight="500" text-anchor="start">保留</text><text x="25" y="215" font-size="29" fill="#CE7917" font-weight="700" text-anchor="start">A .87</text><text x="190" y="215" font-size="28" fill="#CE7917" font-weight="500" text-anchor="start">與A重疊 → 刪</text><text x="25" y="272" font-size="29" fill="#C6473D" font-weight="700" text-anchor="start">A .76</text><text x="190" y="272" font-size="28" fill="#C6473D" font-weight="500" text-anchor="start">與A重疊 → 刪</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同類別框：IoU &gt; 0.5才抑制</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">B與A不重疊，不會被A刪除</text></g></g><line x1="1098" y1="388" x2="1122" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="1122.0,388.0 1108.0,381.0 1108.0,395.0" fill="#1765CA"/><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">另驗定位偏移與漏框</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(25,12) scale(0.9)"><rect x="0" y="0" width="390" height="240" rx="12" fill="#D9ECE6" stroke="#77A796" stroke-width="2"/><line x1="105" y1="0" x2="105" y2="240" stroke="#92B6A2" stroke-width="12"/><rect x="75" y="40" width="60" height="155" rx="5" fill="#9AA6AC" stroke="#6F7F88" stroke-width="2"/><rect x="75" y="65" width="60" height="105" rx="2" fill="#243B40" stroke="#243B40" stroke-width="2"/><text x="105" y="123" font-size="25" fill="white" font-weight="700" text-anchor="middle">103</text><text x="105" y="223" font-size="25" fill="#172B43" font-weight="700" text-anchor="middle">A</text><line x1="270" y1="0" x2="270" y2="240" stroke="#92B6A2" stroke-width="12"/><rect x="240" y="40" width="60" height="155" rx="5" fill="#9AA6AC" stroke="#6F7F88" stroke-width="2"/><rect x="240" y="65" width="60" height="105" rx="2" fill="#243B40" stroke="#243B40" stroke-width="2"/><text x="270" y="123" font-size="25" fill="white" font-weight="700" text-anchor="middle">272</text><text x="270" y="223" font-size="25" fill="#172B43" font-weight="700" text-anchor="middle">B</text></g><rect x="110" y="48" width="76" height="162" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="20" y="278" font-size="29" fill="#C6473D" font-weight="700" text-anchor="start">A：定位偏移　B：漏框</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">示意錯誤：逐件回原圖核對</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">同時記錄定位與前後處理耗時</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">模型、前處理與門檻一起固定，再驗漏件。</text></svg>