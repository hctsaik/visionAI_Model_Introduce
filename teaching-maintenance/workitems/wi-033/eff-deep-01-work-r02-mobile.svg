<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">先找可疑位置，也要能跟上工作</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同一A-01有可見線痕</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(142,4) scale(1.05)"><rect x="0" y="0" width="210" height="230" rx="13" fill="#CAD8E4" stroke="#71899F" stroke-width="2"/><text x="38" y="37" font-size="28" fill="#172B43" font-weight="700" text-anchor="start">A-01</text><line x1="22" y1="24" x2="22" y2="52" stroke="#172B43" stroke-width="4"/><line x1="13" y1="33" x2="31" y2="33" stroke="#172B43" stroke-width="4"/><circle cx="63" cy="85" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="149" cy="85" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="63" cy="172" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="149" cy="172" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><line x1="107" y1="187" x2="125" y2="211" stroke="#B54F46" stroke-width="7"/></g><text x="15" y="315" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">A-01：四孔與下中線痕</text><text x="15" y="363" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">同一工件贯穿本章，非模型實測</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">從正常資料學候選模型</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(10,10) scale(0.55)"><rect x="0" y="0" width="210" height="230" rx="13" fill="#CAD8E4" stroke="#71899F" stroke-width="2"/><text x="38" y="37" font-size="28" fill="#172B43" font-weight="700" text-anchor="start">A-01</text><line x1="22" y1="24" x2="22" y2="52" stroke="#172B43" stroke-width="4"/><line x1="13" y1="33" x2="31" y2="33" stroke="#172B43" stroke-width="4"/><circle cx="63" cy="85" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="149" cy="85" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="63" cy="172" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="149" cy="172" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/></g><line x1="145" y1="73" x2="191" y2="73" stroke="#1765CA" stroke-width="5"/><polygon points="191.0,73.0 177.0,66.0 177.0,80.0" fill="#1765CA"/><rect x="210" y="48" width="264" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="342.0" y="78" font-size="26" fill="white" font-weight="700" text-anchor="middle">正常訓練</text><line x1="340" y1="102" x2="340" y2="158" stroke="#1765CA" stroke-width="5"/><polygon points="340.0,158.0 347.0,144.0 333.0,144.0" fill="#1765CA"/><rect x="210" y="174" width="264" height="43" rx="12" fill="#238854" stroke="#238854" stroke-width="2"/><text x="342.0" y="204" font-size="26" fill="white" font-weight="700" text-anchor="middle">候選模型</text><text x="15" y="287" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">另送待測影像，才產生位置圖</text><text x="15" y="335" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">不需預先列完所有缺陷類別</text><text x="15" y="383" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">可見線痕不保證一定檢出</text></g></g><line x1="384.0" y1="1461.0" x2="384.0" y2="1478.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1478.0 391.0,1464.0 377.0,1464.0" fill="#1765CA"/><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">位置回原圖，完整流程計時</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(145,4) scale(1.05)"><rect x="0" y="0" width="210" height="230" rx="13" fill="#CAD8E4" stroke="#71899F" stroke-width="2"/><text x="38" y="37" font-size="28" fill="#172B43" font-weight="700" text-anchor="start">A-01</text><line x1="22" y1="24" x2="22" y2="52" stroke="#172B43" stroke-width="4"/><line x1="13" y1="33" x2="31" y2="33" stroke="#172B43" stroke-width="4"/><circle cx="63" cy="85" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="149" cy="85" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="63" cy="172" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="149" cy="172" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><line x1="107" y1="187" x2="125" y2="211" stroke="#B54F46" stroke-width="7"/></g><rect x="247" y="191" width="43" height="43" rx="2" fill="none" stroke="#CE7917" stroke-width="2"/><text x="15" y="285" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">位置回原圖，依允收規格覆核</text><text x="15" y="333" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">記誤報、漏檢與人工工時</text><text x="15" y="381" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">完整時間含取像與前後處理</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">位置與耗時都要驗；熱圖只幫你開始覆核。</text></svg>