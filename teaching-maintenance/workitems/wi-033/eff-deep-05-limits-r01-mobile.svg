<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">看不清的細痕，不能只靠調門檻</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">共同原圖：可見線痕</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(142,4) scale(1.05)"><rect x="0" y="0" width="210" height="230" rx="13" fill="#CAD8E4" stroke="#71899F" stroke-width="2"/><text x="38" y="37" font-size="28" fill="#172B43" font-weight="700" text-anchor="start">A-01</text><line x1="22" y1="24" x2="22" y2="52" stroke="#172B43" stroke-width="4"/><line x1="13" y1="33" x2="31" y2="33" stroke="#172B43" stroke-width="4"/><circle cx="63" cy="85" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="149" cy="85" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="63" cy="172" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><circle cx="149" cy="172" r="23" fill="#F5F9FF" stroke="#7F98AC" stroke-width="3"/><line x1="107" y1="187" x2="125" y2="211" stroke="#B54F46" stroke-width="7"/></g><text x="15" y="315" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">A-01：四孔與下中線痕</text><text x="15" y="363" font-size="27" fill="#172B43" font-wei