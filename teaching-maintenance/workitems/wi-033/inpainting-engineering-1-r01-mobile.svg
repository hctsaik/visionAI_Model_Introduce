<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">Inpainting：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">原圖、遮罩、候選三者留存</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">原污點影像與修改範圍</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.58)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><path d="M 150,174 q 17,-15 33,0 q 20,6 10,20 q -18,8 -43,-2 Z" fill="#25313A"/></g><g transform="translate(270,20) scale(0.58)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><rect x="135.0" y="164.0" width="80" height="40" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/><path d="M 150,174 q 17,-15 33,0 q 20,6 10,20 q -18,8 -43,-2 Z" fill="#25313A"/></g><text x="20" y="217" font-size="29" fill="#1765CA" font-weight="500" text-anchor="start">原圖另存</text><text x="270" y="217" font-size="27" fill="#CE7917" font-weight="500" text-anchor="start">1 = 可編修區</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同板下方待編修污點</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">本圖遮罩約定，API需核對</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">遮罩與模型約定核對</text><g transform="translate(8,66) scale(0.965)"><rect x="30" y="10" width="430" height="282" rx="9" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="48" y="48" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">原始來源</text><text x="48" y="82" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">原圖另存＋尺寸座標</text><text x="48" y="126" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">遮罩約定</text><text x="48" y="160" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">本圖1=修改；API另核對</text><text x="48" y="204" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">生成設定</text><text x="48" y="238" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">縮放／羽化／模型／種子</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">原圖、mask與候選一起保存</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">不要讓編修版覆蓋原始觀測</text></g></g><line x1="384.0" y1="1461.0" x2="384.0" y2