<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">PatchCore：縮庫，要連正常覆蓋一起驗</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">特徵版本必須與庫一致</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(12,15) scale(0.43)"><rect x="0" y="0" width="350" height="225" rx="8" fill="url(#steel)" stroke="#748A9C" stroke-width="2"/><circle cx="13" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><line x1="266" y1="133" x2="300" y2="103" stroke="#34424B" stroke-width="6"/><line x1="260" y1="142" x2="286" y2="122" stroke="#EDF2F6" stroke-width="3"/><rect x="247" y="94" width="65" height="58" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="318" y="124" font-size="31" fill="#CE7917" font-weight="700" text-anchor="start">p</text></g><text x="193" y="58" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">同一處理版本</text><rect x="15" y="130" width="464" height="50" rx="5" fill="white" stroke="#1765CA" stroke-width="2"/><text x="28" y="164" font-size="27" fill="#1765CA" font-weight="500" text-anchor="start">固定骨幹 / 層 / 前處理</text><rect x="15" y="190" width="464" height="50" rx="5" fill="white" stroke="#1765CA" stroke-width="2"/><text x="28" y="224" font-size="27" fill="#1765CA" font-weight="500" text-anchor="start">聚合 + coreset + 庫版本</text><rect x="15" y="250" width="464" height="50" rx="5" fill="white" stroke="#1765CA" stroke-width="2"/><text x="28" y="284" font-size="27" fill="#1765CA" font-weight="500" text-anchor="start">新query與舊庫：特徵需相容</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">庫存的是同規則的局部表示</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">換設定後需重建或重驗相容性</text></g></g><line x1="543" y1="388" x2="567" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="567.0,388.0 553.0,381.0 553.0,395.0" fill="#1765CA"/><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">代表數量影響儲存成本</text><g transform="translate(8,66) scale(0.965)"><text x="15" y="40" font-size="30" fill="#1765CA" font-weight="700" text-anchor="start">給定512維 float32 特徵</text><rect x="15" y="80" width="440" height="44" rx="3" fill="#1765CA" stroke="none" stroke-width="2"/><text x="15" y="159" font-size="32" fill="#1765CA" font-weight="700" text-anchor="start">10000筆：20.48 MB</text><rect x="15" y="203" width="44" height="44" rx="3" fill="#238854" stroke="none" stroke-width="2"/><text x="15" y="288" font-size="32" fill="#238854" font-weight="700" text-anchor="start">1000筆：2.048 MB</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">僅特徵容量；不含索引/模型</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">筆數減十倍，不保證快十倍</text></g></g><line x1="1098" y1="388" x2="1122" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="1122.0,388.0 1108.0,381.0 1108.0,395.0" fill="#1765CA"/><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">漏掉正常代表可能升高距離</text><g transform="translate(8,66) scale(0.965)"><text x="15" y="44" font-size="32" fill="#238854" font-weight="700" text-anchor="start">正常局部 q = [2, 0]</text><rect x="15" y="88" width="220" height="72" rx="6" fill="white" stroke="#238854" stroke-width="2"/><text x="27" y="118" font-size="25" fill="#238854" font-weight="700" text-anchor="start">原库有[2, 0]</text><text x="27" y="148" font-size="27" fill="#238854" font-weight="500" text-anchor="start">最近距離 = 0</text><rect x="265" y="88" width="220" height="72" rx="6" fill="white" stroke="#CE7917" stroke-width="2"/><text x="277" y="118" font-size="25" fill="#CE7917" font-weight="700" text-anchor="start">若只留[0, 0]</text><text x="277" y="148" font-size="27" fill="#CE7917" font-weight="500" text-anchor="start">最近距離 = 2</text><g transform="translate(145,190) scale(0.55)"><rect x="0" y="0" width="350" height="225" rx="8" fill="url(#steel)" stroke="#748A9C" stroke-width="2"/><circle cx="13" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/></g><text x="15" y="321" font-size="28" fill="#CE7917" font-weight="700" text-anchor="start">同正常工件，距離卻升高</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">代表子集仍要涵蓋正常變化</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">給定反例，非coreset實際結果</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">庫小可以省資源，漏掉正常變化會有代價。</text></svg>