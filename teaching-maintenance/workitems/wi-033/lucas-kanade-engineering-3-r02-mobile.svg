<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2400" viewBox="0 0 768 2400"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2400" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">Lucas–Kanade：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">把可追的點與失效分開</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.3)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同名點保留前後座標</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(8,55.0) scale(1)"><rect x="0" y="0" width="190" height="175" rx="10" fill="#D6E0E9" stroke="#8399AD" stroke-width="2"/><circle cx="13" cy="13" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="177" cy="13" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="13" cy="162" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="177" cy="162" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><path d="M55,35 v75 h75" fill="none" stroke="#243548" stroke-width="20"/></g><g transform="translate(305,65.0) scale(1)"><rect x="0" y="0" width="190" height="175" rx="10" fill="#D6E0E9" stroke="#8399AD" stroke-width="2"/><circle cx="13" cy="13" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="177" cy="13" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="13" cy="162" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="177" cy="162" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><path d="M55,35 v75 h75" fill="none" stroke="#243548" stroke-width="20"/></g><text x="15" y="30" font-size="29" fill="#172B43" font-weight="500" text-anchor="start">前影格</text><text x="292" y="30" font-size="29" fill="#172B43" font-weight="500" text-anchor="start">後影格</text><line x1="210" y1="138" x2="265" y2="138" stroke="#1765CA" stroke-width="5"/><polygon points="265.0,138.0 251.0,131.0 251.0,145.0" fill="#1765CA"/><circle cx="63" cy="165" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="73" y="163" font-size="30" fill="#CE7917" font-weight="500" text-anchor="start">p</text><circle cx="360" cy="175" r="7" fill="#CE7917" stroke="#CE7917" stroke-width="3"/><text x="370" y="173" font-size="30" fill="#CE7917" font-weight="500" text-anchor="start">p′</text><text x="15" y="282" font-size="38" fill="#1765CA" font-weight="500" text-anchor="start">p → p′</text><text x="15" y="345" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">前後座標與時間一併保存</text><text x="15" y="393" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">每個點有自己的有效性</text></g></g><line x1="384.0" y1="848.0" x2="384.0" y2="867.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,867.0 391.0,853.0 377.0,853.0" fill="#1765CA"/><g transform="translate(50,870.0) scale(1.3)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">失敗位置退出追蹤</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(10,15.0) scale(1)"><rect x="0" y="0" width="190" height="175" rx="10" fill="#D6E0E9" stroke="#8399AD" stroke-width="2"/><circle cx="13" cy="13" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="177" cy="13" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="13" cy="162" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="177" cy="162" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><path d="M55,35 v75 h75" fill="none" stroke="#243548" stroke-width="20"/></g><g transform="translate(306,25.0) scale(1)"><rect x="0" y="0" width="190" height="175" rx="10" fill="#D6E0E9" stroke="#8399AD" stroke-width="2"/><circle cx="13" cy="13" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="177" cy="13" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="13" cy="162" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><circle cx="177" cy="162" r="4" fill="#F5F9FF" stroke="#8295A6" stroke-width="3"/><path d="M55,35 v75 h75" fill="none" stroke="#243548" stroke-width="20"/><rect x="45" y="75" width="100" height="70" rx="16" fill="white" stroke="none" stroke-width="2"/></g><text x="23" y="257" font-size="30" fill="#238854" font-weight="500" text-anchor="start">清楚點對</text><text x="285" y="257" font-size="30" fill="#CE7917" font-weight="500" text-anchor="start">對應不可見</text><text x="15" y="328" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">殘差／往返不符：退出追蹤</text><text x="15" y="376" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">重新找點，不延續錯誤箭頭</text></g></g><line x1="384.0" y1="1523.0" x2="384.0" y2="1542.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1542.0 391.0,1528.0 377.0,1528.0" fill="#1765CA"/><g transform="translate(50,1545.0) scale(1.3)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">像素位移另接校正與時間</text><g transform="translate(8,66) scale(0.965)"><line x1="35" y1="60" x2="180" y2="115" stroke="#1765CA" stroke-width="5"/><polygon points="180.0,115.0 169.4,103.5 164.4,116.6" fill="#1765CA"/><text x="221" y="95" font-size="33" fill="#1765CA" font-weight="500" text-anchor="start">像素位移</text><line x1="240" y1="140" x2="240" y2="196" stroke="#1765CA" stroke-width="5"/><polygon points="240.0,196.0 247.0,182.0 233.0,182.0" fill="#1765CA"/><rect x="45" y="215" width="405" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="247.5" y="245" font-size="26" fill="white" font-weight="700" text-anchor="middle">相機／尺度／平面條件</text><line x1="240" y1="263" x2="240" y2="305" stroke="#1765CA" stroke-width="5"/><polygon points="240.0,305.0 247.0,291.0 233.0,291.0" fill="#1765CA"/><text x="45" y="356" font-size="33" fill="#172B43" font-weight="500" text-anchor="start">物理位移 ÷ 真實時間差</text><text x="45" y="407" font-size="26" fill="#CE7917" font-weight="500" text-anchor="start">移動相機、深度變化另處理</text></g></g><rect x="24" y="2220" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2260" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2276" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2272" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">保存點對、時間與有效性，</text><text x="45" y="2318" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">再決定能否接量測。</text></svg>