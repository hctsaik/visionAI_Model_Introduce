<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">Deblur：銳利的多重邊可能是振鈴</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">原觀測只有一條模糊邊</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(1.55)"><rect x="0" y="0" width="190" height="140" rx="3" fill="#23313E" stroke="#73899E" stroke-width="2"/><rect x="0" y="0" width="95" height="140" rx="0" fill="url(#steel)" stroke="none" stroke-width="2"/><rect x="66" y="0" width="13" height="140" rx="0" fill="#B4C1CD" stroke="none" stroke-width="2"/><rect x="78" y="0" width="13" height="140" rx="0" fill="#9DAEBC" stroke="none" stroke-width="2"/><rect x="90" y="0" width="13" height="140" rx="0" fill="#7F929F" stroke="none" stroke-width="2"/><rect x="102" y="0" width="13" height="140" rx="0" fill="#657A88" stroke="none" stroke-width="2"/><rect x="114" y="0" width="13" height="140" rx="0" fill="#435966" stroke="none" stroke-width="2"/></g><text x="340" y="71" font-size="28" fill="#1765CA" font-weight="500" text-anchor="start">曝光</text><text x="340" y="127" font-size="28" fill="#1765CA" font-weight="500" text-anchor="start">運動</text><text x="340" y="183" font-size="28" fill="#1765CA" font-weight="500" text-anchor="start">對焦</text><text x="20" y="288" font-size="26" fill="#172B43" font-weight="500" text-anchor="start">原始模糊邊另存，取像設定同留</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">先辨識模糊來源與空間變化</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">單一直邊只是局部教學示意</text></g></g><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">候選多重邊造成錯定位</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(1.55)"><rect x="0" y="0" width="190" height="140" rx="3" fill="#23313E" stroke="#73899E" stroke-width="2"/><rect x="0" y="0" width="95" height="140" rx="0" fill="url(#steel)" stroke="none" stroke-width="2"/><rect x="88" y="0" width="8" height="140" rx="0" fill="white" stroke="none" stroke-width="2"/><rect x="108" y="0" width="7" height="140" rx="0" fill="#06121A" stroke="none" stroke-width="2"/><rect x="123" y="0" width="5" height="140" rx="0" fill="#657A88" stroke="none" stroke-width="2"/></g><text x="340" y="67" font-size="29" fill="#CE7917" font-weight="500" text-anchor="start">多峰</text><line x1="353" y1="83" x2="210" y2="83" stroke="#CE7917" stroke-width="5"/><polygon points="210.0,83.0 224.0,90.0 224.0,76.0" fill="#CE7917"/><text x="20" y="282" font-size="29" fill="#CE7917" font-weight="700" text-anchor="start">選中假峰，邊緣座標就會偏</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">增添高頻不等於恢复真實輪廓</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">振鈴可能使量測選錯邊</text></g></g><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">独立清晰取像驗單一真邊</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(1)"><rect x="0" y="0" width="190" height="140" rx="3" fill="#23313E" stroke="#73899E" stroke-width="2"/><rect x="0" y="0" width="95" height="140" rx="0" fill="url(#steel)" stroke="none" stroke-width="2"/><rect x="88" y="0" width="8" height="140" rx="0" fill="white" stroke="none" stroke-width="2"/><rect x="108" y="0" width="7" height="140" rx="0" fill="#06121A" stroke="none" stroke-width="2"/><rect x="123" y="0" width="5" height="140" rx="0" fill="#657A88" stroke="none" stroke-width="2"/></g><g transform="translate(280,20) scale(1)"><rect x="0" y="0" width="190" height="140" rx="3" fill="#23313E" stroke="#73899E" stroke-width="2"/><rect x="0" y="0" width="95" height="140" rx="0" fill="url(#steel)" stroke="none" stroke-width="2"/></g><text x="20" y="204" font-size="28" fill="#CE7917" font-weight="500" text-anchor="start">候選有多重邊</text><text x="280" y="204" font-size="26" fill="#238854" font-weight="500" text-anchor="start">独立清晰取像</text><text x="20" y="276" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">同位置比邊緣，不只看銳利</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">振鈴可能造出不存在的輪廓</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">較短曝光、對焦與重新取像驗證</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">銳利度增加，不能取代真邊位置證據。</text></svg>