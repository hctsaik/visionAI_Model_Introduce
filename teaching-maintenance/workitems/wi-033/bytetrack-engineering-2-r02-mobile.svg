<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2400" viewBox="0 0 768 2400"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2400" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">ByteTrack：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">先高分，再接剩餘低分</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.3)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">每幀框分高分與低分</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,45) scale(1)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="65" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/><text x="85" y="104" font-size="47" fill="#172B43" font-weight="700" text-anchor="start">L</text></g><rect x="284" y="85" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/><rect x="76" y="80" width="92" height="95" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><rect x="280" y="80" width="92" height="95" rx="0" fill="none" stroke="#1765CA" stroke-width="2"/><text x="72" y="28" font-size="28" fill="#CE7917" font-weight="700" text-anchor="start">低分 .3</text><text x="278" y="28" font-size="28" fill="#1765CA" font-weight="700" text-anchor="start">高分 .9</text><rect x="110" y="45" width="33" height="76" rx="0" fill="#A2ACB3" stroke="#748A9C" stroke-width="2"/><text x="25" y="263" font-size="29" fill="#CE7917" font-weight="700" text-anchor="start">ID7處短暫遮擋 → 低分框</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">偵測器先出框與分數</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">分數為給定例，不是門檻建議</text></g></g><line x1="384.0" y1="848.0" x2="384.0" y2="867.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,867.0 391.0,853.0 377.0,853.0" fill="#1765CA"/><g transform="translate(50,870.0) scale(1.3)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">先高分，再補未配對軌跡</text><g transform="translate(8,66) scale(0.965)"><text x="20" y="30" font-size="28" fill="#1765CA" font-weight="700" text-anchor="start">第一輪：高分框配現有軌跡</text><rect x="25" y="52" width="72" height="67" rx="0" fill="none" stroke="#238854" stroke-width="2"/><rect x="32" y="58" width="72" height="67" rx="0" fill="none" stroke="#1765CA" stroke-width="2"/><line x1="125" y1="83" x2="220" y2="83" stroke="#1765CA" stroke-width="5"/><polygon points="220.0,83.0 206.0,76.0 206.0,90.0" fill="#1765CA"/><text x="240" y="91" font-size="29" fill="#238854" font-weight="700" text-anchor="start">已配對</text><text x="20" y="168" font-size="28" fill="#CE7917" font-weight="700" text-anchor="start">第二輪：剩餘軌跡配低分框</text><rect x="25" y="190" width="72" height="67" rx="0" fill="none" stroke="#238854" stroke-width="2"/><rect x="32" y="196" width="72" height="67" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="47" y="240" font-size="35" fill="#172B43" font-weight="700" text-anchor="start">L</text><line x1="125" y1="223" x2="220" y2="223" stroke="#1765CA" stroke-width="5"/><polygon points="220.0,223.0 206.0,216.0 206.0,230.0" fill="#1765CA"/><text x="240" y="234" font-size="29" fill="#238854" font-weight="700" text-anchor="start">續接ID7</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">先高再低，低分仍需位置依據</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">孤立低分框不直接產生新ID</text></g></g><line x1="384.0" y1="1523.0" x2="384.0" y2="1542.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1542.0 391.0,1528.0 377.0,1528.0" fill="#1765CA"/><g transform="translate(50,1545.0) scale(1.3)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">接回ID或標成暫時丟失</text><g transform="translate(8,66) scale(0.965)"><rect x="20" y="45" width="130" height="90" rx="4" fill="white" stroke="#238854" stroke-width="2"/><text x="85" y="103" font-size="29" fill="#238854" font-weight="700" text-anchor="middle">ID7</text><rect x="180" y="45" width="130" height="90" rx="4" fill="white" stroke="#CE7917" stroke-width="2"/><text x="245" y="103" font-size="29" fill="#CE7917" font-weight="700" text-anchor="middle">lost</text><rect x="340" y="45" width="130" height="90" rx="4" fill="white" stroke="#C6473D" stroke-width="2"/><text x="405" y="103" font-size="29" fill="#C6473D" font-weight="700" text-anchor="middle">移除</text><line x1="155" y1="90" x2="175" y2="90" stroke="#1765CA" stroke-width="5"/><polygon points="175.0,90.0 161.0,83.0 161.0,97.0" fill="#1765CA"/><line x1="315" y1="90" x2="335" y2="90" stroke="#1765CA" stroke-width="5"/><polygon points="335.0,90.0 321.0,83.0 321.0,97.0" fill="#1765CA"/><text x="20" y="188" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">未匹配 → 暫留 → 超期移除</text><text x="20" y="251" font-size="27" fill="#238854" font-weight="700" text-anchor="start">保留期內匹配可重新啟用ID7</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">續接需證據；長遮擋仍會丟失</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">計數線與事件由下游另訂</text></g></g><rect x="24" y="2220" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2260" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2276" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2272" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">低分框要有軌跡依據，才可能接回原ID。</text></svg>