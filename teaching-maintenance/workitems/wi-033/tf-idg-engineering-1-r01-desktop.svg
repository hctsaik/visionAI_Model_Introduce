<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">TF-IDG：參考外觀引導局部合成</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">正常板、參考傷、局部遮罩</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,10) scale(0.65)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="115" cy="122" r="26" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="275" cy="122" r="22" fill="white" stroke="#73899E" stroke-width="3"/><rect x="58.0" y="179.0" width="100" height="34" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/><rect x="253.0" y="181.5" width="58" height="27" rx="4" fill="#CE791744" stroke="#CE7917" stroke-width="2"/></g><g transform="translate(290,10) scale(0.45)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="115" cy="122" r="26" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="275" cy="122" r="22" fill="white" stroke="#73899E" stroke-width="3"/><line x1="66.0" y1="206.0" x2="150.0" y2="186.0" stroke="#253846" stroke-width="5"/><line x1="71.0" y1="210.0" x2="155.0" y2="188.0" stroke="white" stroke-width="2"/><line x1="261.0" y1="201.5" x2="303.0" y2="188.5" stroke="#253846" stroke-width="5"/><line x1="266.0" y1="205.5" x2="308.0" y2="190.5" stroke="white" stroke-width="2"/></g><text x="20" y="208" font-size="27" fill="#1765CA" font-weight="500" text-anchor="start">正常板＋局部遮罩</text><text x="290" y="164" font-size="26" fill="#238854" font-weight="500" text-anchor="start">參考刮傷</text><text x="20" y="281" font-size="31" fill="#238854" font-weight="700" text-anchor="start">已訓練模型權重固定</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">中部兩孔、下方兩刮傷區</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">參考影像提供局部外觀線索</text></g></g><line x1="543" y1="388" x2="567" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="567.0,388.0 553.0,381.0 553.0,395.0" fill="#1765CA"/><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">固定權重下引導latent</text><g transform="translate(8,66) scale(0.965)"><rect x="25.0" y="20.0" width="34.666666666666664" height="34.666666666666664" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="61.666666666666664" y="20.0" width="34.666666666666664" height="34.666666666666664" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="98.33333333333333" y="20.0" width="34.666666666666664" height="34.666666666666664" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="25.0" y="56.666666666666664" width="34.666666666666664" height="34.666666666666664" rx="1" fill="#E3EEF9" stroke="#1765CA" stroke-width="2"/><rect x="61.666666666666664" y="56.666666666666664" width="34.666666666666664" height="34.666666666666664" rx="1" fill="#