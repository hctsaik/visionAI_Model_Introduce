<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2400" viewBox="0 0 768 2400"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2400" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">EfficientAD：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">換產品要更新哪些部分</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.3)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">新產品有不同正常外觀</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(55,4) scale(1.1)"><rect x="0" y="30" width="350" height="150" rx="12" fill="#A3B7C7" stroke="#71869A" stroke-width="2"/><rect x="12" y="50" width="98" height="110" rx="5" fill="#607A90" stroke="#71869A" stroke-width="2"/><rect x="22" y="30" width="78" height="110" rx="7" fill="#D2DFE8" stroke="#6F8598" stroke-width="2"/><ellipse cx="61" cy="30" rx="39" ry="16" fill="#E5EDF4" stroke="#6F8598" stroke-width="3"/><rect x="126" y="50" width="98" height="110" rx="5" fill="#607A90" stroke="#71869A" stroke-width="2"/><rect x="136" y="30" width="78" height="110" rx="7" fill="#D2DFE8" stroke="#6F8598" stroke-width="2"/><ellipse cx="175" cy="30" rx="39" ry="16" fill="#E5EDF4" stroke="#6F8598" stroke-width="3"/><rect x="240" y="50" width="98" height="110" rx="5" fill="#607A90" stroke="#71869A" stroke-width="2"/><rect x="250" y="30" width="78" height="110" rx="7" fill="#D2DFE8" stroke="#6F8598" stroke-width="2"/><ellipse cx="289" cy="30" rx="39" ry="16" fill="#E5EDF4" stroke="#6F8598" stroke-width="3"/></g><text x="15" y="280" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">同為正常，也有新的材質與外觀</text><text x="15" y="328" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">先確認代表性正常訓練資料</text><text x="15" y="376" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">模型名稱不會替你適配產品</text></g></g><line x1="384.0" y1="848.0" x2="384.0" y2="867.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,867.0 391.0,853.0 377.0,853.0" fill="#1765CA"/><g transform="translate(50,870.0) scale(1.3)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">適配學生／AE與分數尺度</text><g transform="translate(8,66) scale(0.965)"><rect x="15" y="15" width="455" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="242.5" y="45" font-size="26" fill="white" font-weight="700" text-anchor="middle">新正常訓練資料</text><line x1="243" y1="67" x2="243" y2="106" stroke="#1765CA" stroke-width="5"/><polygon points="243.0,106.0 250.0,92.0 236.0,92.0" fill="#1765CA"/><rect x="15" y="123" width="455" height="43" rx="12" fill="#238854" stroke="#238854" stroke-width="2"/><text x="242.5" y="153" font-size="26" fill="white" font-weight="700" text-anchor="middle">學生 / AE 按需要重訓</text><line x1="243" y1="174" x2="243" y2="217" stroke="#1765CA" stroke-width="5"/><polygon points="243.0,217.0 250.0,203.0 236.0,203.0" fill="#1765CA"/><rect x="15" y="234" width="455" height="43" rx="12" fill="#CE7917" stroke="#CE7917" stroke-width="2"/><text x="242.5" y="264" font-size="26" fill="white" font-weight="700" text-anchor="middle">新正常驗證分布校正</text><text x="15" y="351" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">權重、分位數與資料一起保存</text><text x="15" y="399" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">保留舊版供回放比較</text></g></g><line x1="384.0" y1="1523.0" x2="384.0" y2="1542.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1542.0 391.0,1528.0 377.0,1528.0" fill="#1765CA"/><g transform="translate(50,1545.0) scale(1.3)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同留出集比較更新前後</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(25,10) scale(0.6)"><rect x="0" y="30" width="350" height="150" rx="12" fill="#A3B7C7" stroke="#71869A" stroke-width="2"/><rect x="12" y="50" width="98" height="110" rx="5" fill="#607A90" stroke="#71869A" stroke-width="2"/><rect x="22" y="30" width="78" height="110" rx="7" fill="#D2DFE8" stroke="#6F8598" stroke-width="2"/><ellipse cx="61" cy="30" rx="39" ry="16" fill="#E5EDF4" stroke="#6F8598" stroke-width="3"/><rect x="126" y="50" width="98" height="110" rx="5" fill="#607A90" stroke="#71869A" stroke-width="2"/><rect x="136" y="30" width="78" height="110" rx="7" fill="#D2DFE8" stroke="#6F8598" stroke-width="2"/><ellipse cx="175" cy="30" rx="39" ry="16" fill="#E5EDF4" stroke="#6F8598" stroke-width="3"/><rect x="240" y="50" width="98" height="110" rx="5" fill="#607A90" stroke="#71869A" stroke-width="2"/><rect x="250" y="30" width="78" height="110" rx="7" fill="#D2DFE8" stroke="#6F8598" stroke-width="2"/><ellipse cx="289" cy="30" rx="39" ry="16" fill="#E5EDF4" stroke="#6F8598" stroke-width="3"/></g><g transform="translate(257,10) scale(0.6)"><rect x="0" y="30" width="350" height="150" rx="12" fill="#A3B7C7" stroke="#71869A" stroke-width="2"/><rect x="12" y="50" width="98" height="110" rx="5" fill="#607A90" stroke="#71869A" stroke-width="2"/><rect x="22" y="30" width="78" height="110" rx="7" fill="#D2DFE8" stroke="#6F8598" stroke-width="2"/><ellipse cx="61" cy="30" rx="39" ry="16" fill="#E5EDF4" stroke="#6F8598" stroke-width="3"/><rect x="126" y="50" width="98" height="110" rx="5" fill="#607A90" stroke="#71869A" stroke-width="2"/><rect x="240" y="50" width="98" height="110" rx="5" fill="#607A90" stroke="#71869A" stroke-width="2"/><rect x="250" y="30" width="78" height="110" rx="7" fill="#D2DFE8" stroke="#6F8598" stroke-width="2"/><ellipse cx="289" cy="30" rx="39" ry="16" fill="#E5EDF4" stroke="#6F8598" stroke-width="3"/><path d="M282,78 l15,-7 9,13 -6,20 -22,5 -4,-13 Z" fill="#6A514D"/></g><text x="15" y="246" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">新舊版本跑相同留出集</text><text x="15" y="294" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">量誤報、漏檢、訓練與校正成本</text><text x="15" y="342" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">每件耗時與更新工時分開</text></g></g><rect x="24" y="2220" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2260" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2276" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2272" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">模型與正常校正一起重驗，</text><text x="45" y="2318" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">不能只換產品名稱。</text></svg>