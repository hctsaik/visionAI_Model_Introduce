<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">背景相減：物件沒動，不保證一直亮</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">方件到場，先有前景</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,15) scale(0.49)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/></g><g transform="translate(255,15) scale(0.49)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="160" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/></g><text x="50" y="125" font-size="26" fill="#1765CA" font-weight="700" text-anchor="start">累積背景</text><text x="282" y="125" font-size="26" fill="#CE7917" font-weight="700" text-anchor="start">目前有方件</text><line x1="105" y1="140" x2="170" y2="172" stroke="#1765CA" stroke-width="5"/><polygon points="170.0,172.0 160.5,159.5 154.3,172.1" fill="#1765CA"/><line x1="370" y1="140" x2="290" y2="172" stroke="#1765CA" stroke-width="5"/><polygon points="290.0,172.0 305.6,173.3 300.4,160.3" fill="#1765CA"/><g transform="translate(55,182) scale(0.8)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#15222F" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="160" y="40" width="85" height="85" rx="1" fill="white" stroke="#DAE1E7" stroke-width="2"/></g><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同位置比較，方件形成前景</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">不是只和上一張影格相減</text></g></g><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">長期停留可能被吸收</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,10) scale(0.95)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="160" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/></g><text x="25" y="203" font-size="29" fill="#CE7917" font-weight="700" text-anchor="start">停留很久＋背景持續更新</text><line x1="237" y1="219" x2="237" y2="244" stroke="#1765CA" stroke-width="5"/><polygon points="237.0,244.0 244.0,230.0 230.0,230.0" fill="#1765CA"/><rect x="25" y="257" width="425" height="62" rx="3" fill="#142332" stroke="#142332" stroke-width="2"/><text x="238" y="298" font-size="29" fill="white" font-weight="700" text-anchor="middle">前景可能消失</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">物件仍在場景，模型已學作背景</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">示意不指定幾秒必然吸收</text></g></g><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">要保留物件身份，另接追蹤</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,15) scale(0.95)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="130" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/><text x="150" y="104" font-size="47" fill="#172B43" font-weight="700" text-anchor="start">L</text></g><rect x="135" y="50" width="87" height="89" rx="0" fill="none" stroke="#238854" stroke-width="2"/><text x="260" y="97" font-size="30" fill="#238854" font-weight="700" text-anchor="start">ID7</text><text x="25" y="234" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">物件身份另存於追蹤狀態</text><text x="25" y="295" font-size="28" fill="#CE7917" font-weight="700" text-anchor="start">長遮擋仍需處理丟失</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">前景變空不等於可刪除實物記錄</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">偵測與追蹤也需要驗證</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">背景模型會更新，遮罩不等於物件存在。</text></svg>