<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">ControlNet：控制強度要配採樣驗證</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">保存控制模型與前處理</text><g transform="translate(8,66) scale(0.965)"><rect x="30" y="10" width="430" height="282" rx="9" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="48" y="48" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">基模與分支</text><text x="48" y="82" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">匹配的ControlNet版本</text><text x="48" y="126" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">控制圖</text><text x="48" y="160" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">輪廓前處理／解析度</text><text x="48" y="204" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">採樣</text><text x="48" y="238" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">文字／強度／起止步／種子</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">輪廓和控制模型需匹配</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">只換文字不代表條件仍相容</text></g></g><line x1="543" y1="388" x2="567" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="567.0,388.0 553.0,381.0 553.0,395.0" fill="#1765CA"/><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">控制強弱改變殘差注入</text><g transform="translate(8,66) scale(0.965)"><rect x="20" y="20" width="440" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="240.0" y="50" font-size="26" fill="white" font-weight="700" text-anchor="middle">分支殘差 r</text><line x1="100" y1="81" x2="100" y2="143" stroke="#1765CA" stroke-width="5"/><polygon points="100.0,143.0 107.0,129.0 93.0,129.0" fill="#1765CA"/><line x1="370" y1="81" x2="370" y2="143" stroke="#238854" stroke-width="5"/><polygon points="370.0,143.0 377.0,129.0 363.0,129.0" fill="#238854"/><rect x="20" y="161" width="190" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="115.0" y="191" font-size="26" fill="white" font-weight="700" text-anchor="middle">0.5 × r</text><rect x="280" y="161" width="190" height="43" rx="12" fill="#238854" stroke="#238854" stroke-width="2"/><text x="375.0" y="191" font-size="26" fill="white" font-weight="700" text-anchor="middle">1.0 × r</text><text x="20" y="285" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">給定權重示例，不是建議參數</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">注入量不同，輸出需同條件驗</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">強度大不保證細節更真實</text></g></g><line x1="1098" y1="388" x2="1122" y2="388" stroke="#1765CA" stroke-width="5"/><polygon points="1122.0,388.0 1108.0,381.0 1108.0,395.0" fill="#1765CA"/><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" heigh