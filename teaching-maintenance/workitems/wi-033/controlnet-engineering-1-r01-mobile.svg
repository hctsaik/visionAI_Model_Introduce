<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">ControlNet：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">條件圖與文字共同交付</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">保存雙孔輪廓與文字</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.9)"><rect x="0" y="0" width="360" height="240" rx="9" fill="#13222F" stroke="white" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="#13222F" stroke="white" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="#13222F" stroke="white" stroke-width="3"/></g><text x="20" y="286" font-size="30" fill="#1765CA" font-weight="700" text-anchor="start">文字：銀色雙孔金屬板</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">輪廓含外框與兩個孔位</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">輪廓條件不是缺陷分數</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">條件版本接匹配模型</text><g transform="translate(8,66) scale(0.965)"><rect x="30" y="10" width="430" height="282" rx="9" fill="white" stroke="#B9D4EF" stroke-width="2"/><text x="48" y="48" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">基模與分支</text><text x="48" y="82" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">匹配的ControlNet版本</text><text x="48" y="126" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">控制圖</text><text x="48" y="160" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">輪廓前處理／解析度</text><text x="48" y="204" font-size="24" fill="#1765CA" font-weight="700" text-anchor="start">採樣</text><text x="48" y="238" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">文字／強度／起止步／種子</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">輪廓和控制模型需匹配</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">只換文字不代表條件仍相容</text></g></g><line x1="384.0" y1="1461.0" x2="384.0" y2="1478.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1478.0 391.0,1464.0 377.0,1464.0" fill="#1765CA"/><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">生成板回比孔位與外框</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,20) scale(0.9)"><rect x="0" y="0" width="360" height="240" rx="9" fill="url(#steel)" stroke="#73899E" stroke-width="2"/><circle cx="65" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/><circle cx="295" cy="47" r="24" fill="white" stroke="#73899E" stroke-width="3"/></g><rect x="20" y="20" width="324" height="216" rx="8" fill="none" stroke="#238854" stroke-width="2"/><circle cx="78.5" cy="62.3" r="21.6" fill="none" stroke="#238854" stroke-width="3"/><circle cx="285.5" cy="62.3" r="21.6" fill="none" stroke="#238854" stroke-width="3"/><text x="20" y="288" font-size="26" fill="#238854" font-weight="700" text-anchor="start">綠線：原條件；底圖：生成候選</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">外框與兩孔逐一疊合核對</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">輪廓相符仍不是實際尺寸證據</text></g></g><rect x="24" y="2124" width="720" height="150" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="2164" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="2180" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="2176" font-size="31" fill="#172B43" font-weight="800" text-anchor="start">先定義控制什麼，再檢查生成是否遵守。</text></svg>