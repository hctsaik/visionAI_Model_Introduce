<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="46" fill="#172B43" font-weight="800" text-anchor="start">DINOv2：外观差異不等於不良</text><text x="28" y="117" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(25,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同一支架只改背景</text><g transform="translate(8,66) scale(0.965)"><rect x="10" y="18" width="218" height="222" rx="6" fill="#DFE6ED" stroke="none" stroke-width="2"/><rect x="251" y="18" width="218" height="222" rx="6" fill="#D9ECD8" stroke="none" stroke-width="2"/><g transform="translate(30,35) scale(0.67)"><path d="M0 0 H110 V140 H260 V220 H0 Z" fill="url(#steel)" stroke="#748A9C" stroke-width="4"/><circle cx="55" cy="62" r="23" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="209" cy="180" r="23" fill="white" stroke="#748A9C" stroke-width="3"/></g><g transform="translate(271,35) scale(0.67)"><path d="M0 0 H110 V140 H260 V220 H0 Z" fill="url(#steel)" stroke="#748A9C" stroke-width="4"/><circle cx="55" cy="62" r="23" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="209" cy="180" r="23" fill="white" stroke="#748A9C" stroke-width="3"/></g><text x="20" y="300" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">同件、同孔位；只改背景</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">條件變化不等於工件缺陷</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">示意控制變因，不是新模型測試</text></g></g><g transform="translate(580,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">相似度分數仍可能改變</text><g transform="translate(8,66) scale(0.965)"><rect x="20" y="18" width="436" height="97" rx="6" fill="white" stroke="#1765CA" stroke-width="2"/><text x="32" y="55" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">原背景：距離 .14</text><text x="32" y="97" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">新背景：距離 .29</text><text x="20" y="186" font-size="30" fill="#CE7917" font-weight="700" text-anchor="start">給定反例：距離可能變</text><text x="20" y="247" font-size="30" fill="#172B43" font-weight="500" text-anchor="start">兩張圖的工件都未改變</text><text x="20" y="302" font-size="28" fill="#172B43" font-weight="500" text-anchor="start">先查正常變化是否有覆蓋</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">分數改變，不能直接判不良</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">距離與門檻都要用域內資料驗證</text></g></g><g transform="translate(1135,163) scale(1)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">比較查庫與有標註任務頭</text><g transform="translate(8,66) scale(0.965)"><rect x="20" y="15" width="440" height="55" rx="6" fill="white" stroke="#1765CA" stroke-width="2"/><text x="32" y="52" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">表示向量 / patch表示</text><line x1="240" y1="87" x2="130" y2="139" stroke="#1765CA" stroke-width="5"/><polygon points="130.0,139.0 145.6,139.3 139.7,126.7" fill="#1765CA"/><line x1="240" y1="87" x2="362" y2="139" stroke="#238854" stroke-width="5"/><polygon points="362.0,139.0 351.9,127.1 346.4,140.0" fill="#238854"/><rect x="15" y="153" width="210" height="97" rx="6" fill="white" stroke="#1765CA" stroke-width="2"/><text x="27" y="190" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">標註任務頭</text><text x="27" y="232" font-size="27" fill="#1765CA" font-weight="650" text-anchor="start">類別分數</text><rect x="255" y="153" width="210" height="97" rx="6" fill="white" stroke="#238854" stroke-width="2"/><text x="267" y="190" font-size="27" fill="#238854" font-weight="650" text-anchor="start">正常參考庫</text><text x="267" y="232" font-size="27" fill="#238854" font-weight="650" text-anchor="start">最近距離</text><text x="20" y="305" font-size="27" fill="#CE7917" font-weight="500" text-anchor="start">兩個可選下游，不是固定串接</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">任務輸出要有資料和判定規格</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">骨幹特徵本身不是缺陷機率</text></g></g><rect x="24" y="805" width="1624" height="108" rx="15" fill="#FFF4CC" stroke="#EAB24B" stroke-width="2"/><circle cx="58" cy="845" r="15" fill="#FFE5A2" stroke="#D99B23" stroke-width="3"/><rect x="50" y="861" width="16" height="10" rx="2" fill="#D99B23" stroke="none" stroke-width="2"/><text x="89" y="857" font-size="34" fill="#172B43" font-weight="800" text-anchor="start">同件特徵受條件影響，判定要回到工作規格。</text></svg>