<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">Frame Difference：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">找前後變化的位置</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">固定相機看同一方件</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(20,15) scale(0.85)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="85" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/></g><g transform="translate(20,175) scale(0.85)"><rect x="0" y="0" width="440" height="165" rx="4" fill="#606972" stroke="#73899E" stroke-width="2"/><line x1="0" y1="8" x2="440" y2="8" stroke="#ACB6BF" stroke-width="8"/><line x1="0" y1="157" x2="440" y2="157" stroke="#ACB6BF" stroke-width="8"/><rect x="113.33333333333333" y="40" width="85" height="85" rx="1" fill="url(#steel)" stroke="#DAE1E7" stroke-width="2"/></g><text x="325" y="55" font-size="27" fill="white" font-weight="700" text-anchor="start">前幀</text><text x="325" y="215" font-size="27" fill="white" font-weight="700" text-anchor="start">後幀</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同方件向右移動，相機固定</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">只改時間，不偷換工件</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">逐座標差異再過門檻</text><g transform="translate(8,66) scale(0.965)"><text x="25" y="38" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">給定絕對差</text><rect x="25" y="65" width="80" height="54" rx="1" fill="#E3EEF9" stroke="#CE7917" stroke-width="2"/><text x="65" y="101" font-size="27" fill="#CE7917" font-weight="700" text-anchor="middle">0</text><rect x="110" y="65" width="80" height="54" rx="1" fill="#E3EEF9" stroke="#CE7917" stroke-width="2"/><text x="150" y="101" font-size="27" fill="#CE7917" font-weight="700" text-anchor="middle">80</text><rect x="195" y="65" width="80" height="54" rx="1" fill="#E3EEF9" stroke="#CE7917" stroke-width="2"/><text x="235" y="101" font-size="27" fill="#CE7917" font-weight="700" text-anchor="middle">0</text><rect x="280" y="65" width="80" height="54" rx="1" fill="#E3EEF9" stroke="#CE7917" stroke-width="2"/><text x="320" y="101" font-size="27" fill="#CE7917" font-weight="700" text-anchor="middle">0</text><rect x="365" y="65" width="80" height="54" rx="1" fill="#E3EEF9" stroke="#CE7917" stroke-width="2"/><text x="405" y="101" font-size="27" fill="#CE7917" font-weight="700" text-anchor="middle">80</text><text x="25" y="171" font-size="29" fill="#1765CA" font-weight="700" text-anchor="start">給定門檻30：差 &gt; 30</text><rect x="25" y="204" width="80" height="54" rx="1" fill="#E3EEF9" stroke="#238854" stroke-width="2"/><text x="65" y="240" font-size="27" fill="#238854" font-weight="700" text-anchor="middle">0</text><rect x="110" y="204" width="80" height="54" rx="1" fill="#E3EEF9" stroke="#238854" stroke-width="2"/><text x="150" y="240" font-size="27" fill="#238854" font-weight="700" text-anchor="middle">1</text><rect x="195" y="204" width="80" height="54" rx="1" fill="#E3EEF9" stroke="#238854" stroke-width="2"/><text x="235" y="240" font-size="27" fill="#238854" font-weight="700" text-anchor="middle">0</text><rect x="280" y="204" width="80" height="54" rx="1" fill="#E3EEF9" stroke="#238854" stroke-width="2"/><text x="320" y="240" font-size="27" fill="#238854" font-weight="700" text-anchor="middle">0</text><rect x="365" y="204" width="80" height="54" rx="1" fill="#E3EEF9" stroke="#238854" stroke-width="2"/><text x="405" y="240" font-size="27" fill="#238854" font-weight="700" text-anchor="middle">1</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">80超過30，0不超過30</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">教學門檻，並非部署建議值</text></g></g><line x1="384.0" y1="1461.0" x2="384.0" y2="1478.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,1478.0 391.0,1464.0 377.0,1464.0" fill="#1765CA"/><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">兩條變化帶交後段處理</text><g transform="translate(8,66) scale(0.965)"><rect x="25" y="35" width="425" height="205" rx="4" fill="#142332" stroke=