<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">原版LLaVA：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">把影像表示接進語言模型</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同一接頭影像經視覺編碼</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(15,15) scale(0.85)"><rect x="0" y="0" width="410" height="205" rx="15" fill="#34424B" stroke="#23333D" stroke-width="2"/><circle cx="112" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="112" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="300" cy="103" r="67" fill="#1F2B33" stroke="#82939F" stroke-width="3"/><circle cx="300" cy="103" r="43" fill="#101B22" stroke="#566671" stroke-width="3"/><circle cx="112" cy="103" r="32" fill="#CAD3D8" stroke="#AAB6BD" stroke-width="3"/><line x1="89" y1="103" x2="135" y2="103" stroke="#596D79" stroke-width="6"/><line x1="112" y1="80" x2="112" y2="126" stroke="#596D79" stroke-width="6"/></g><line x1="192" y1="204" x2="192" y2="242" stroke="#1765CA" stroke-width="5"/><polygon points="192.0,242.0 199.0,228.0 185.0,228.0" fill="#1765CA"/><rect x="24" y="259" width="400" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="224.0" y="289" font-size="26" fill="white" font-weight="700" text-anchor="middle">視覺編碼器 → 影像表示</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">左座有螺絲，右座未見螺絲</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">固定同一照片，保留可見證據</text></g></g><line x1="384.0" y1="818.0" x2="384.0" y2="835.0" stroke="#1765CA" stroke-width="5"/><polygon points="384.0,835.0 391.0,821.0 377.0,821.0" fill="#1765CA"/><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">投影後與問題文字一起送入</text><g transform="translate(8,66) scale(0.965)"><text x="20" y="45" font-size="31" fill="#1765CA" font-weight="700" text-anchor="start">影像表示 [a, b, …]</text><line x1="218" y1="65" x2="218" y2="104" stroke="#1765CA" stroke-width="5"/><polygon points="218.0,104.0 225.0,90.0 211.0,90.0" fill="#1765CA"/><rect x="25" y="117" width="400" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="225.0" y="147" font-size="26" fill="white" font-weight="700" text-anchor="middle">原版：學習線性投影</text><line x1="218" y1="170" x2="218" y2="203" stroke="#1765CA" stroke-width="5"/><polygon points="218.0,203.0 225.0,189.0 211.0,189.0" fill="#1765CA"/><text x="20" y="244" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">視覺token＋「哪邊有螺絲？」</text><text x="20" y="300" font-size="31" fill="#238854" font-weight="700" text-anchor="start">→ 語言模型輸入空間</text><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">投影橋接不同表示空間</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" t