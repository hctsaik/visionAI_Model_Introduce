<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2304" viewBox="0 0 768 2304"><defs><linearGradient id="steel"><stop stop-color="#A1B2C3"/><stop offset=".43" stop-color="#E2EAF1"/><stop offset="1" stop-color="#8B9DAF"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2304" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="28" y="58" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">Dinomaly：</text><text x="28" y="110" font-size="40" fill="#172B43" font-weight="800" text-anchor="start">低重建差，不保證無刮傷</text><text x="28" y="165" font-size="26" fill="#526B81" font-weight="500" text-anchor="start">工程圖解｜教學示意，非模型實測</text><g transform="translate(50,195.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">同板刮傷p仍然存在</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(30,15) scale(1.1)"><rect x="0" y="0" width="350" height="225" rx="8" fill="url(#steel)" stroke="#748A9C" stroke-width="2"/><circle cx="68" cy="65" r="35" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="282" cy="181" r="22" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><line x1="266" y1="133" x2="300" y2="103" stroke="#34424B" stroke-width="6"/><line x1="260" y1="142" x2="286" y2="122" stroke="#EDF2F6" stroke-width="3"/><rect x="247" y="94" width="65" height="58" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="318" y="124" font-size="31" fill="#CE7917" font-weight="700" text-anchor="start">p</text></g><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">同一金屬板，大小孔與刮傷p</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">同件任務；位置不偷換</text></g></g><g transform="translate(50,838.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">若原與重建表示相同</text><g transform="translate(8,66) scale(0.965)"><rect x="15" y="30" width="220" height="72" rx="6" fill="white" stroke="#1765CA" stroke-width="2"/><text x="27" y="60" font-size="25" fill="#1765CA" font-weight="700" text-anchor="start">原特徵</text><text x="27" y="90" font-size="27" fill="#1765CA" font-weight="500" text-anchor="start">[.6, .8]</text><rect x="250" y="30" width="220" height="72" rx="6" fill="white" stroke="#238854" stroke-width="2"/><text x="262" y="60" font-size="25" fill="#238854" font-weight="700" text-anchor="start">若重建相同</text><text x="262" y="90" font-size="27" fill="#238854" font-weight="500" text-anchor="start">[.6, .8]</text><text x="50" y="182" font-size="35" fill="#CE7917" font-weight="700" text-anchor="start">餘弦差 = 0</text><g transform="translate(145,220) scale(0.42)"><rect x="0" y="0" width="350" height="225" rx="8" fill="url(#steel)" stroke="#748A9C" stroke-width="2"/><circle cx="68" cy="65" r="35" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="282" cy="181" r="22" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><line x1="266" y1="133" x2="300" y2="103" stroke="#34424B" stroke-width="6"/><line x1="260" y1="142" x2="286" y2="122" stroke="#EDF2F6" stroke-width="3"/><rect x="247" y="94" width="65" height="58" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="318" y="124" font-size="31" fill="#CE7917" font-weight="700" text-anchor="start">p</text></g><text x="15" y="350" font-size="29" fill="#172B43" font-weight="700" text-anchor="start">表示相同，原圖仍有刮傷</text><text x="15" y="397" font-size="27" fill="#172B43" font-weight="500" text-anchor="start">给定反例；非模型推論結果</text></g></g><g transform="translate(50,1481.0) scale(1.24)"><rect x="0" y="0" width="510" height="500" rx="17" fill="#F5F9FF" stroke="#B9D4EF" stroke-width="2"/><rect x="15" y="13" width="480" height="43" rx="12" fill="#1765CA" stroke="#1765CA" stroke-width="2"/><text x="255.0" y="43" font-size="26" fill="white" font-weight="700" text-anchor="middle">獨立正常與缺陷分開驗</text><g transform="translate(8,66) scale(0.965)"><g transform="translate(10,15) scale(0.54)"><rect x="0" y="0" width="350" height="225" rx="8" fill="url(#steel)" stroke="#748A9C" stroke-width="2"/><circle cx="68" cy="65" r="35" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="282" cy="181" r="22" fill="white" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="13" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="13" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><circle cx="337" cy="212" r="3" fill="#748A9C" stroke="#748A9C" stroke-width="3"/><line x1="266" y1="133" x2="300" y2="103" stroke="#34424B" stroke-width="6"/><line x1="260" y1="142" x2="286" y2="122" stroke="#EDF2F6" stroke-width="3"/><rect x="247" y="94" width="65" height="58" rx="0" fill="none" stroke="#CE7917" stroke-width="2"/><text x="318" y="124" font-size="31" fill="#CE7917"