<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2770"><defs><linearGradient id="steel"><stop offset="0" stop-color="#B4C0CC"/><stop offset=".45" stop-color="#EDF1F4"/><stop offset="1" stop-color="#8495A5"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2770" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="30" y="58" fill="#153454" font-size="40" font-weight="800" text-anchor="start">自適應計算：少算什麼，要分清楚</text><text x="30" y="150" fill="#5D7184" font-size="25" font-weight="500" text-anchor="start">工程圖解｜機制示意，非本輪模型實測</text><g transform="translate(24,180) scale(1.4)"><rect x="0" y="0" width="510" height="560" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="22" y="47" fill="#153454" font-size="29" font-weight="800" text-anchor="start">深度：可能提早停止</text><g transform="translate(10,68) scale(.94 .90)"><rect x="65" y="25" width="170" height="60" rx="16" fill="#E8F2FC" stroke="#C1D8EF" stroke-width="2"/><text x="95" y="65" fill="#153454" font-size="29" font-weight="500" text-anchor="start">Layer 1</text><rect x="65" y="110" width="170" height="60" rx="16" fill="#E8F2FC" stroke="#C1D8EF" stroke-width="2"/><text x="95" y="150" fill="#153454" font-size="29" font-weight="500" text-anchor="start">Layer 2</text><rect x="65" y="195" width="170" height="60" rx="16" fill="#E8F2FC" stroke="#C1D8EF" stroke-width="2"/><text x="95" y="235" fill="#153454" font-size="29" font-weight="500" text-anchor="start">Layer 3</text><rect x="65" y="280" width="170" height="60" rx="16" fill="#E8F2FC" stroke="#C1D8EF" stroke-width="2"/><text x="95" y="320" fill="#153454" font-size="29" font-weight="500" text-anchor="start">Layer 4</text><path d="M250,140 L350,140" fill="none" stroke="#17876B" stroke-width="5" stroke-dasharray=""/><path d="M350,140 L338.2941876694152,145.654551943446 L338.2941876694152,134.345448056554 Z" fill="#17876B"/><text x="310" y="195" fill="#17876B" font-size="27" font-weight="500" text-anchor="start">可早停</text><path d="M150,170 L150,310" fill="none" stroke="#C1D8EF" stroke-width="3" stroke-dasharray="7 7"/></g><text x="24" y="492" fill="#153454" font-size="27" font-weight="650" text-anchor="start">容易的配對可少跑層</text><text x="24" y="534" fill="#153454" font-size="27" font-weight="650" text-anchor="start">困難影像可能仍需更多層</text></g><g transform="translate(24,980) scale(1.4)"><rect x="0" y="0" width="510" height="560" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="22" y="47" fill="#153454" font-size="29" font-weight="800" text-anchor="start">寬度：修剪部分點</text><g transform="translate(10,68) scale(.94 .90)"><path d="M60,65 L325,65" fill="none" stroke="#C1D8EF" stroke-width="3" stroke-dasharray=""/><path d="M60,65 L425,155" fill="none" stroke="#C1D8EF" stroke-width="3" stroke-dasharray=""/><path d="M155,155 L425,155" fill="none" stroke="#C1D8EF" stroke-width="3" stroke-dasharray=""/><circle cx="60" cy="65" r="19" fill="#1765CA"/><text x="60" y="73" fill="white" font-size="21" font-weight="700" text-anchor="middle">A</text><circle cx="155" cy="155" r="19" fill="#1765CA"/><text x="155" y="163" fill="white" font-size="21" font-weight="700" text-anchor="middle">B</text><circle cx="60" cy="270" r="19" fill="#BAC6D3"/><text x="60" y="278" fill="white" font-size="21" font-weight="700" text-anchor="middle">C</text><circle cx="325" cy="65" r="19" fill="#1765CA"/><text x="325" y="73" fill="white" font-size="21" font-weight="700" text-anchor="middle">A</text><circle cx="425" cy="155" r="19" fill="#1765CA"/><text x="425" y="163" fill="white" font-size="21" font-weight="700" text-anchor="middle">B</text><circle cx="325" cy="270" r="19" fill="#BAC6D3"/><text x="325" y="278" fill="white" font-size="21" font-weight="700" text-anchor="middle">C</text><text x="40" y="350" fill="#153454" font-size="27" font-weight="500" text-anchor="start">灰點：停止參與後續計算</text><text x="40" y="400" fill="#153454" font-size="28" font-weight="500" text-anchor="start">原影像不會被刪除</text></g><text x="24" y="492" fill="#153454" font-size="27" font-weight="650" text-anchor="start">依判斷移除部分計算候選</text><text x="24" y="534" fill="#153454" font-size="27" font-weight="650" text-anchor="start">不是刪掉原圖的像素</text></g><g transform="translate(24,1780) scale(1.4)"><rect x="0" y="0" width="510" height="560" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="22" y="47" fill="#153454" font-size="29" font-weight="800" text-anchor="start">量完整處理鏈</text><g transform="translate(10,68) scale(.94 .90)"><rect x="50" y="85" width="120" height="90" rx="16" fill="#A9C9E9" stroke="#C1D8EF" stroke-width="2"/><rect x="170" y="85" width="180" height="90" rx="16" fill="#B9DACF" stroke="#C1D8EF" stroke-width="2"/><rect x="350" y="85" width="100" height="90" rx="16" fill="#E4D2B7" stroke="#C1D8EF" stroke-width="2"/><text x="35" y="225" fill="#153454" font-size="26" font-weight="500" text-anchor="start">前處理 → 模型 → 幾何／後處理</text><text x="55" y="305" fill="#153454" font-size="30" font-weight="500" text-anchor="start">同硬體、同輸入</text><text x="55" y="370" fill="#153454" font-size="28" font-weight="500" text-anchor="start">沒有借用跨平臺FPS</text></g><text x="24" y="492" fill="#153454" font-size="27" font-weight="650" text-anchor="start">extractor＋matcher＋幾何</text><text x="24" y="534" fill="#153454" font-size="27" font-weight="650" text-anchor="start">同硬體、同影像才可比</text></g><rect x="24" y="2600" width="720" height="140" rx="18" fill="#FFF4CC" stroke="#E9B54A" stroke-width="2"/><text x="45" y="2650" fill="#153454" font-size="31" font-weight="800" text-anchor="start">自適應不是每張圖都更快的保證。</text></svg>