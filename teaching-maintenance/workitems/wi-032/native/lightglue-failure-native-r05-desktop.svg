<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941"><defs><filter id="blur"><feGaussianBlur stdDeviation="9"/></filter></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="30" y="60" fill="#153454" font-size="48" font-weight="800" text-anchor="start">沒有可區分線索，學習配對也會含糊</text><text x="30" y="117" fill="#5D7184" font-size="27" font-weight="500" text-anchor="start">受控幾何教學示意｜非模型實測</text><g transform="translate(24,150) scale(1)"><rect x="0" y="0" width="510" height="630" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="23" y="50" fill="#153454" font-size="29" font-weight="800" text-anchor="start">同一金屬件與兩個孔</text><g transform="translate(95,120) rotate(0) scale(1)"><path d="M0,0 H200 V65 H310 V245 H0 Z" fill="#C8D1DA" stroke="#64788B" stroke-width="3"/><circle cx="80" cy="170" r="31" fill="#F8FBFF" stroke="#64788B" stroke-width="4"/><circle cx="230" cy="170" r="31" fill="#F8FBFF" stroke="#64788B" stroke-width="4"/><circle cx="200" cy="65" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="210" y="55" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">A</text><circle cx="80" cy="170" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="90" y="160" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">B</text><circle cx="230" cy="170" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="240" y="160" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">C</text></g><text x="25" y="460" fill="#153454" font-size="28" font-weight="600" text-anchor="start">A：獨特缺口</text><text x="25" y="500" fill="#153454" font-size="28" font-weight="600" text-anchor="start">B/C：外觀相似的兩孔</text></g><path d="M541,470 L573,470" fill="none" stroke="#1765CA" stroke-width="5" stroke-dasharray=""/><path d="M573,470 L561.2941876694152,475.654551943446 L561.2941876694152,464.345448056554 Z" fill="#1765CA"/><g transform="translate(581,150) scale(1)"><rect x="0" y="0" width="510" height="630" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="23" y="50" fill="#153454" font-size="29" font-weight="800" text-anchor="start">保留定位缺口與遮住缺口</text><text x="25" y="100" fill="#153454" font-size="30" font-weight="500" text-anchor="start">缺口可見</text><g transform="translate(70,130) rotate(0) scale(0.65)"><path d="M0,0 H200 V65 H310 V245 H0 Z" fill="#C8D1DA" stroke="#64788B" stroke-width="3"/><circle cx="80" cy="170" r="31" fill="#F8FBFF" stroke="#64788B" stroke-width="4"/><circle cx="230" cy="170" r="31" fill="#F8FBFF" stroke="#64788B" stroke-width="4"/><circle cx="200" cy="65" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="210" y="55" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">A</text><circle cx="80" cy="170" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="90" y="160" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">B</text><circle cx="230" cy="170" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="240" y="160" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">C</text></g><text x="25" y="350" fill="#E98B1D" font-size="29" font-weight="500" text-anchor="start">只遮住缺口；孔仍原位</text><g transform="translate(70,380) rotate(0) scale(0.65)"><path d="M0,0 H200 V65 H310 V245 H0 Z" fill="#C8D1DA" stroke="#64788B" stroke-width="3"/><circle cx="80" cy="170" r="31" fill="#F8FBFF" stroke="#64788B" stroke-width="4"/><circle cx="230" cy="170" r="31" fill="#F8FBFF" stroke="#64788B" stroke-width="4"/><circle cx="200" cy="65" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="210" y="55" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">A</text><circle cx="80" cy="170" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="90" y="160" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">B</text><circle cx="230" cy="170" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="240" y="160" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">C</text><rect x="150" y="-15" width="175" height="115" rx="3" fill="#364757" stroke="#364757" stroke-width="2"/></g></g><path d="M1098,470 L1130,470" fill="none" stroke="#1765CA" stroke-width="5" stroke-dasharray=""/><path d="M1130,470 L1118.2941876694151,475.654551943446 L1118.2941876694151,464.345448056554 Z" fill="#1765CA"/><g transform="translate(1138,150) scale(1)"><rect x="0" y="0" width="510" height="630" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="23" y="50" fill="#153454" font-size="29" font-weight="800" text-anchor="start">保留不確定再補證據</text><text x="25" y="115" fill="#E98B1D" font-size="29" font-weight="500" text-anchor="start">A無法觀測；B/C可能含糊</text><text x="85" y="205" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">A</text><text x="375" y="205" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">A</text><text x="85" y="275" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">B</text><text x="375" y="275" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">B</text><path d="M120,265 L363,265" fill="none" stroke="#E98B1D" stroke-width="3" stroke-dasharray="8 7"/><text x="85" y="345" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">C</text><text x="375" y="345" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">C</text><path d="M120,335 L363,335" fill="none" stroke="#E98B1D" stroke-width="3" stroke-dasharray="8 7"/><path d="M120,265 L363,335" fill="none" stroke="#E98B1D" stroke-width="3" stroke-dasharray="8 7"/><path d="M120,335 L363,265" fill="none" stroke="#E98B1D" stroke-width="3" stroke-dasharray="8 7"/><path d="M80,175 L410,220" fill="none" stroke="#E98B1D" stroke-width="7" stroke-dasharray=""/><text x="25" y="469" fill="#153454" font-size="27" font-weight="600" text-anchor="start">保留不確定，另拍一個視角</text><text x="25" y="509" fill="#153454" font-size="27" font-weight="600" text-anchor="start">或增加已知定位線索</text><text x="25" y="549" fill="#153454" font-size="27" font-weight="600" text-anchor="start">再做配對與幾何核對。</text></g><rect x="24" y="826" width="1624" height="90" rx="16" fill="#FFF4CC" stroke="#E9B54A" stroke-width="2"/><text x="48" y="876" fill="#153454" font-size="33" font-weight="800" text-anchor="start">學習配對不能憑空補線索；含糊時要補視角或定位特徵。</text></svg>