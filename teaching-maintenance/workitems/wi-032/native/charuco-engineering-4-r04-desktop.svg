<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941"><defs><linearGradient id="steel"><stop offset="0" stop-color="#B4C0CC"/><stop offset=".45" stop-color="#EDF1F4"/><stop offset="1" stop-color="#8495A5"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="30" y="58" fill="#153454" font-size="47" font-weight="800" text-anchor="start">相機設定變了，舊參數還能用嗎？</text><text x="30" y="117" fill="#5D7184" font-size="25" font-weight="500" text-anchor="start">工程圖解｜機制示意，非本輪模型實測</text><g transform="translate(24,150) scale(1)"><rect x="0" y="0" width="510" height="560" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="22" y="47" fill="#153454" font-size="29" font-weight="800" text-anchor="start">光學與影像條件</text><g transform="translate(10,68) scale(.94 .90)"><rect x="65" y="110" width="290" height="190" rx="15" fill="#CFD8E0" stroke="#64788B" stroke-width="2"/><rect x="115" y="65" width="150" height="45" rx="4" fill="#CFD8E0" stroke="#64788B" stroke-width="2"/><circle cx="260" cy="205" r="80" fill="#5C7185"/><circle cx="260" cy="205" r="55" fill="#294B6C"/><circle cx="250" cy="188" r="22" fill="#90B9DD"/><text x="45" y="373" fill="#153454" font-size="28" font-weight="500" text-anchor="start">取像條件也是版本的一部分</text></g><text x="24" y="492" fill="#153454" font-size="27" font-weight="650" text-anchor="start">鏡頭／對焦／解析度</text><text x="24" y="534" fill="#153454" font-size="27" font-weight="650" text-anchor="start">裁切也會改變像素座標</text></g><g transform="translate(581,150) scale(1)"><rect x="0" y="0" width="510" height="560" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="22" y="47" fill="#153454" font-size="29" font-weight="800" text-anchor="start">改條件後重查投影</text><g transform="translate(10,68) scale(.94 .90)"><rect x="35" y="50" width="190" height="250" rx="5" fill="#F6F9FC" stroke="#C1D8EF" stroke-width="2"/><path d