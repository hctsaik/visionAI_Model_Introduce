<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2770"><defs><linearGradient id="steel"><stop offset="0" stop-color="#B4C0CC"/><stop offset=".45" stop-color="#EDF1F4"/><stop offset="1" stop-color="#8495A5"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2770" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="30" y="58" fill="#153454" font-size="40" font-weight="800" text-anchor="start">少重疊或對稱物，先確認是否有線索</text><text x="30" y="150" fill="#5D7184" font-size="25" font-weight="500" text-anchor="start">工程圖解｜機制示意，非本輪模型實測</text><g transform="translate(24,180) scale(1.4)"><rect x="0" y="0" width="510" height="560" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="22" y="47" fill="#153454" font-size="29" font-weight="800" text-anchor="start">少重疊</text><g transform="translate(10,68) scale(.94 .90)"><rect x="35" y="50" width="265" height="265" rx="16" fill="#EDF5FC" stroke="#C1D8EF" stroke-width="2"/><rect x="245" y="105" width="230" height="260" rx="0" fill="none" stroke="#E98B1D" stroke-width="2"/><rect x="245" y="105" width="55" height="210" rx="0" fill="#BCD5EC" stroke="none" stroke-width="2"/><text x="35" y="405" fill="#153454" font-size="29" font-weight="500" text-anchor="start">共有可見區域才有對應</text></g><text x="24" y="492" fill="#153454" font-size="27" font-weight="650" text-anchor="start">兩圖共有可見區域有限</text><text x="24" y="534" fill="#153454" font-size="27" font-weight="650" text-anchor="start">可用點對可能不足</text></g><g transform="translate(24,980) scale(1.4)"><rect x="0" y="0" width="510" height="560" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="22" y="47" fill="#153454" font-size="29" font-weight="800" text-anchor="start">對稱與重複</text><g transform="translate(10,68) scale(.94 .90)"><rect x="35" y="55" width="420" height="250" rx="16" fill="#CFD9E2" stroke="#C1D8EF" stroke-width="2"/><circle cx="105" cy="180" r="38" fill="#F8FBFF" stroke="#647484" stroke-width="3"/><circle cx="245" cy="180" r="38" fill="#F8FBFF" stroke="#647484" stroke-width="3"/><circle cx="385" cy="180" r="38" fill="#F8FBFF" stroke="#647484" stroke-width="3"/><text x="35" y="380" fill="#153454" font-size="28" font-weight="500" text-anchor="start">很像的局部，未必同一身份</text></g><text x="24" y="492" fill="#153454" font-size="27" font-weight="650" text-anchor="start">不同孔位可能很像</text><text x="24" y="534" fill="#153454" font-size="27" font-weight="650" text-anchor="start">信心不是實體身份真值</text></g><g transform="translate(24,1780) scale(1.4)"><rect x="0" y="0" width="510" height="560" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="22" y="47" fill="#153454" font-size="29" font-weight="800" text-anchor="start">補資料再比較</text><g transform="translate(10,68) scale(.94 .90)"><rect x="65" y="110" width="290" height="190" rx="15" fill="#CFD8E0" stroke="#64788B" stroke-width="2"/><rect x="115" y="65" width="150" height="45" rx="4" fill="#CFD8E0" stroke="#64788B" stroke-width="2"/><circle cx="260" cy="205" r="80" fill="#5C7185"/><circle cx="260" cy="205" r="55" fill="#294B6C"/><circle cx="250" cy="188" r="22" fill="#90B9DD"/><text x="45" y="373" fill="#153454" font-size="28" font-weight="500" text-anchor="start">取像條件也是版本的一部分</text></g><text x="24" y="492" fill="#153454" font-size="27" font-weight="650" text-anchor="start">補視角或已知定位點</text><text x="24" y="534" fill="#153454" font-size="27" font-weight="650" text-anchor="start">固定資料比較完整成本</text></g><rect x="24" y="2600" width="720" height="140" rx="18" fill="#FFF4CC" stroke="#E9B54A" stroke-width="2"/><text x="45" y="2650" fill="#153454" font-size="31" font-weight="800" text-anchor="start">看不見或分不出的部分，不</text><text x="45" y="2698" fill="#153454" font-size="31" font-weight="800" text-anchor="start">能要求模型猜對。</text></svg>