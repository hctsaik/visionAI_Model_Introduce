<svg xmlns="http://www.w3.org/2000/svg" width="768" height="3050"><defs><filter id="blur"><feGaussianBlur stdDeviation="9"/></filter></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="3050" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="30" y="60" fill="#153454" font-size="42" font-weight="800" text-anchor="start">起點太遠，ECC可能對錯位置</text><text x="30" y="150" fill="#5D7184" font-size="27" font-weight="500" text-anchor="start">受控幾何教學示意｜非模型實測</text><g transform="translate(24,180) scale(1.4)"><rect x="0" y="0" width="510" height="630" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="23" y="50" fill="#153454" font-size="29" font-weight="800" text-anchor="start">同一模板與待對圖</text><g transform="translate(95,140) rotate(0) scale(1)"><path d="M0,0 H200 V65 H310 V245 H0 Z" fill="#C8D1DA" stroke="#64788B" stroke-width="3"/><circle cx="80" cy="170" r="31" fill="#F8FBFF" stroke="#64788B" stroke-width="4"/><circle cx="230" cy="170" r="31" fill="#F8FBFF" stroke="#64788B" stroke-width="4"/><circle cx="200" cy="65" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="210" y="55" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">A</text><circle cx="80" cy="170" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="90" y="160" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">B</text><circle cx="230" cy="170" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="240" y="160" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">C</text></g><text x="25" y="460" fill="#153454" font-size="28" font-weight="600" text-anchor="start">同一平面兩孔件</text><text x="25" y="500" fill="#153454" font-size="28" font-weight="600" text-anchor="start">藍灰：模板</text><text x="25" y="540" fill="#153454" font-size="28" font-weight="600" text-anchor="start">橘虛線：重採樣待對圖</text></g><g transform="translate(24,1070) scale(1.4)"><rect x="0" y="0" width="510" height="630" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="23" y="50" fill="#153454" font-size="29" font-weight="800" text-anchor="start">近起點與遠起點</text><text x="25" y="95" fill="#153454" font-size="29" font-weight="500" text-anchor="start">近起點：同身份孔靠近</text><g transform="translate(75,115) rotate(0) scale(0.72)"><path d="M0,0 H200 V65 H310 V245 H0 Z" fill="#F0F5FA" stroke="#64788B" stroke-width="3"/><circle cx="80" cy="170" r="31" fill="#F8FBFF" stroke="#64788B" stroke-width="4"/><circle cx="230" cy="170" r="31" fill="#F8FBFF" stroke="#64788B" stroke-width="4"/></g><g transform="translate(87,115) scale(.72)" fill="none" stroke="#E98B1D" stroke-width="4" stroke-dasharray="8 6"><path d="M0,0 H200 V65 H310 V245 H0 Z"/><circle cx="80" cy="170" r="31"/><circle cx="230" cy="170" r="31"/></g><text x="25" y="343" fill="#E98B1D" font-size="29" font-weight="500" text-anchor="start">錯解示意：移動一個孔距</text><g transform="translate(45,370) rotate(0) scale(0.72)"><path d="M0,0 H200 V65 H310 V245 H0 Z" fill="#F0F5FA" stroke="#64788B" stroke-width="3"/><circle cx="80" cy="170" r="31" fill="#F8FBFF" stroke="#64788B" stroke-width="4"/><circle cx="230" cy="170" r="31" fill="#F8FBFF" stroke="#64788B" stroke-width="4"/></g><g transform="translate(153,370) scale(.72)" fill="none" stroke="#E98B1D" stroke-width="4" stroke-dasharray="8 6"><path d="M0,0 H200 V65 H310 V245 H0 Z"/><circle cx="80" cy="170" r="31"/><circle cx="230" cy="170" r="31"/></g></g><g transform="translate(24,1960) scale(1.4)"><rect x="0" y="0" width="510" height="630" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="23" y="50" fill="#153454" font-size="29" font-weight="800" text-anchor="start">核對整件及殘差</text><text x="25" y="110" fill="#E98B1D" font-size="33" font-weight="800" text-anchor="start">左孔錯對右孔</text><g transform="translate(45,160) rotate(0) scale(0.72)"><path d="M0,0 H200 V65 H310 V245 H0 Z" fill="#F0F5FA" stroke="#64788B" stroke-width="3"/><circle cx="80" cy="170" r="31" fill="#F8FBFF" stroke="#64788B" stroke-width="4"/><circle cx="230" cy="170" r="31" fill="#F8FBFF" stroke="#64788B" stroke-width="4"/></g><g transform="translate(153,160) scale(.72)" fill="none" stroke="#E98B1D" stroke-width="4" stroke-dasharray="8 6"><path d="M0,0 H200 V65 H310 V245 H0 Z"/><circle cx="80" cy="170" r="31"/><circle cx="230" cy="170" r="31"/></g><text x="25" y="404" fill="#153454" font-size="28" font-weight="600" text-anchor="start">一個孔局部重合，</text><text x="25" y="444" fill="#153454" font-size="28" font-weight="600" text-anchor="start">整件外框卻沒有對齊。</text><text x="25" y="484" fill="#153454" font-size="28" font-weight="600" text-anchor="start">先粗定位，再微調；</text><text x="25" y="524" fill="#153454" font-size="28" font-weight="600" text-anchor="start">最後查獨立地標殘差。</text></g><rect x="24" y="2870" width="720" height="140" rx="16" fill="#FFF4CC" stroke="#E9B54A" stroke-width="2"/><text x="48" y="2920" fill="#153454" font-size="31" font-weight="800" text-anchor="start">ECC需要合理起點；對不上就先找粗定位。</text></svg>