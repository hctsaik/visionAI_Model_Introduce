<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941"><defs><filter id="blur"><feGaussianBlur stdDeviation="9"/></filter></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="30" y="60" fill="#153454" font-size="48" font-weight="800" text-anchor="start">LightGlue：借周圍關係，把含糊配對分清</text><text x="30" y="117" fill="#5D7184" font-size="27" font-weight="500" text-anchor="start">受控幾何教學示意｜非模型實測</text><g transform="translate(24,150) scale(1)"><rect x="0" y="0" width="510" height="630" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="23" y="50" fill="#153454" font-size="29" font-weight="800" text-anchor="start">上游提供點與描述</text><g transform="translate(75,100) rotate(0) scale(0.85)"><path d="M0,0 H200 V65 H310 V245 H0 Z" fill="#C8D1DA" stroke="#64788B" stroke-width="3"/><circle cx="80" cy="170" r="31" fill="#F8FBFF" stroke="#64788B" stroke-width="4"/><circle cx="230" cy="170" r="31" fill="#F8FBFF" stroke="#64788B" stroke-width="4"/><circle cx="200" cy="65" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="210" y="55" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">A</text><circle cx="80" cy="170" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="90" y="160" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">B</text><circle cx="230" cy="170" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="240" y="160" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">C</text></g><g transform="translate(155,400) rotate(-18) scale(0.55)"><path d="M0,0 H200 V65 H310 V245 H0 Z" fill="#C8D1DA" stroke="#64788B" stroke-width="3"/><circle cx="80" cy="170" r="31" fill="#F8FBFF" stroke="#64788B" stroke-width="4"/><circle cx="230" cy="170" r="31" fill="#F8FBFF" stroke="#64788B" stroke-width="4"/><circle cx="200" cy="65" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="210" y="55" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">A</text><circle cx="80" cy="170" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="90" y="160" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">B</text><circle cx="230" cy="170" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="240" y="160" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">C</text></g><text x="25" y="570" fill="#153454" font-size="27" font-weight="600" text-anchor="start">相容extractor先交出點／描述</text></g><path d="M541,470 L573,470" fill="none" stroke="#1765CA" stroke-width="5" stroke-dasharray=""/><path d="M573,470 L561.2941876694152,475.654551943446 L561.2941876694152,464.345448056554 Z" fill="#1765CA"/><g transform="translate(581,150) scale(1)"><rect x="0" y="0" width="510" height="630" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="23" y="50" fill="#153454" font-size="29" font-weight="800" text-anchor="start">上下文分辨候選</text><text x="90" y="130" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">A</text><text x="380" y="130" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">A</text><path d="M125,120 L368,120" fill="none" stroke="#17876B" stroke-width="5" stroke-dasharray=""/><text x="90" y="200" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">B</text><text x="380" y="200" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">B</text><path d="M125,190 L368,190" fill="none" stroke="#17876B" stroke-width="5" stroke-dasharray=""/><text x="90" y="270" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">C</text><text x="380" y="270" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">C</text><path d="M125,260 L368,260" fill="none" stroke="#17876B" stroke-width="5" stroke-dasharray=""/><path d="M125,190 L368,260" fill="none" stroke="#E98B1D" stroke-width="3" stroke-dasharray="8 7"/><path d="M125,260 L368,190" fill="none" stroke="#E98B1D" stroke-width="3" stroke-dasharray="8 7"/><text x="25" y="395" fill="#153454" font-size="29" font-weight="500" text-anchor="start">同圖與跨圖資訊更新表示</text><path d="M250,420 L250,455" fill="none" stroke="#1765CA" stroke-width="5" stroke-dasharray=""/><path d="M250,455 L244.345448056554,443.2941876694152 L255.654551943446,443.2941876694152 Z" fill="#1765CA"/><text x="25" y="508" fill="#153454" font-size="28" font-weight="500" text-anchor="start">A的上下文，幫助分辨B/C</text><text x="25" y="562" fill="#E98B1D" font-size="27" font-weight="500" text-anchor="start">虛線是候選，不是刪掉孔位</text></g><path d="M1098,470 L1130,470" fill="none" stroke="#1765CA" stroke-width="5" stroke-dasharray=""/><path d="M1130,470 L1118.2941876694151,475.654551943446 L1118.2941876694151,464.345448056554 Z" fill="#1765CA"/><g transform="translate(1138,150) scale(1)"><rect x="0" y="0" width="510" height="630" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="23" y="50" fill="#153454" font-size="29" font-weight="800" text-anchor="start">匹配交給幾何估計</text><text x="90" y="150" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">A</text><text x="380" y="150" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">A</text><path d="M125,140 L368,140" fill="none" stroke="#17876B" stroke-width="5" stroke-dasharray=""/><text x="90" y="220" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">B</text><text x="380" y="220" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">B</text><path d="M125,210 L368,210" fill="none" stroke="#17876B" stroke-width="5" stroke-dasharray=""/><text x="90" y="290" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">C</text><text x="380" y="290" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">C</text><path d="M125,280 L368,280" fill="none" stroke="#17876B" stroke-width="5" stroke-dasharray=""/><text x="25" y="409" fill="#153454" font-size="28" font-weight="600" text-anchor="start">交付點對與信心</text><text x="25" y="449" fill="#153454" font-size="28" font-weight="600" text-anchor="start">必要時修剪／提早停止</text><text x="25" y="489" fill="#153454" font-size="28" font-weight="600" text-anchor="start">幾何求解仍需另接</text><text x="25" y="529" fill="#153454" font-size="28" font-weight="600" text-anchor="start">不直接交付對齊影像</text></g><rect x="24" y="826" width="1624" height="90" rx="16" fill="#FFF4CC" stroke="#E9B54A" stroke-width="2"/><text x="48" y="876" fill="#153454" font-size="33" font-weight="800" text-anchor="start">LightGlue學的是配對；找點與求變換仍各有負責者。</text></svg>