<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941"><defs><linearGradient id="steel"><stop offset="0" stop-color="#B4C0CC"/><stop offset=".45" stop-color="#EDF1F4"/><stop offset="1" stop-color="#8495A5"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="30" y="58" fill="#153454" font-size="47" font-weight="800" text-anchor="start">局部相關高，整件仍可能對錯</text><text x="30" y="117" fill="#5D7184" font-size="25" font-weight="500" text-anchor="start">工程圖解｜機制示意，非本輪模型實測</text><g transform="translate(24,150) scale(1)"><rect x="0" y="0" width="510" height="560" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="22" y="47" fill="#153454" font-size="29" font-weight="800" text-anchor="start">同身份地標核對</text><g transform="translate(10,68) scale(.94 .90)"><g transform="translate(70,25) rotate(0) scale(1)"><path d="M0,0 H200 V65 H310 V245 H0 Z" fill="#C8D1DA" stroke="#64788B" stroke-width="3"/><circle cx="80" cy="170" r="31" fill="#F8FBFF" stroke="#64788B" stroke-width="4"/><circle cx="230" cy="170" r="31" fill="#F8FBFF" stroke="#64788B" stroke-width="4"/><circle cx="200" cy="65" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="210" y="55" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">A</text><circle cx="80" cy="170" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="90" y="160" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">B</text><circle cx="230" cy="170" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="240" y="160" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">C</text></g><circle cx="283" cy="82" r="10" fill="none" stroke="#1765CA" stroke-width="4"/><path d="M270,90 L283,82" fill="none" stroke="#E98B1D" stroke-width="2" stroke-dasharray=""/><circle cx="163" cy="187" r="10" fill="none" stroke="#1765CA" stroke-width="4"/><path d="M150,195 L163,187" fill="none" stroke="#E98B1D" stroke-width="2" stroke-dasharray=""/><circle cx="313" cy="187" r="10" fill="none" stroke="#1765CA" stroke-width="4"/><path d="M300,195 L313,187" fill="none" stroke="#E98B1D" stroke-width="2" stroke-dasharray=""/><text x="25" y="338" fill="#E98B1D" font-size="29" font-weight="500" text-anchor="start">● 觀測位置</text><text x="25" y="383" fill="#1765CA" font-size="29" font-weight="500" text-anchor="start">○ 預測／對齊後位置</text></g><text x="24" y="492" fill="#153454" font-size="27" font-weight="650" text-anchor="start">孔位與外框都要查</text><text x="24" y="534" fill="#153454" font-size="27" font-weight="650" text-anchor="start">不能只挑相似局部</text></g><g transform="translate(581,150) scale(1)"><rect x="0" y="0" width="510" height="560" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="22" y="47" fill="#153454" font-size="29" font-weight="800" text-anchor="start">遠起點或遮擋</text><g transform="translate(10,68) scale(.94 .90)"><g transform="translate(55,45) rotate(0) scale(0.95)"><path d="M0,0 H200 V65 H310 V245 H0 Z" fill="#C8D1DA" stroke="#64788B" stroke-width="3"/><circle cx="80" cy="170" r="31" fill="#F8FBFF" stroke="#64788B" stroke-width="4"/><circle cx="230" cy="170" r="31" fill="#F8FBFF" stroke="#64788B" stroke-width="4"/><circle cx="200" cy="65" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="210" y="55" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">A</text><circle cx="80" cy="170" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="90" y="160" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">B</text><circle cx="230" cy="170" r="7" fill="#E98B1D" stroke="white" stroke-width="2"/><text x="240" y="160" fill="#E98B1D" font-size="24" font-weight="800" text-anchor="start">C</text><rect x="150" y="-15" width="175" height="115" rx="3" fill="#364757" stroke="#364757" stroke-width="2"/></g><text x="40" y="335" fill="#153454" font-size="30" font-weight="500" text-anchor="start">可用共同區域變少</text><text x="40" y="385" fill="#153454" font-size="28" font-weight="500" text-anchor="start">先核對起點與mask</text></g><text x="24" y="492" fill="#153454" font-size="27" font-weight="650" text-anchor="start">先找粗定位／改善取像</text><text x="24" y="534" fill="#153454" font-size="27" font-weight="650" text-anchor="start">多迭代未必救得回</text></g><g transform="translate(1138,150) scale(1)"><rect x="0" y="0" width="510" height="560" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="22" y="47" fill="#153454" font-size="29" font-weight="800" text-anchor="start">保留失敗案例</text><g transform="translate(10,68) scale(.94 .90)"><rect x="55" y="25" width="350" height="365" rx="16" fill="white" stroke="#C1D8EF" stroke-width="2"/><circle cx="88" cy="80" r="6" fill="#1765CA"/><text x="112" y="90" fill="#153454" font-size="28" font-weight="500" text-anchor="start">原圖／模板</text><circle cx="88" cy="165" r="6" fill="#1765CA"/><text x="112" y="175" fill="#153454" font-size="28" font-weight="500" text-anchor="start">初始與最終warp</text><circle cx="88" cy="250" r="6" fill="#1765CA"/><text x="112" y="260" fill="#153454" font-size="28" font-weight="500" text-anchor="start">取樣與停止設定</text><circle cx="88" cy="335" r="6" fill="#1765CA"/><text x="112" y="345" fill="#153454" font-size="28" font-weight="500" text-anchor="start">獨立地標殘差</text></g><text x="24" y="492" fill="#153454" font-size="27" font-weight="650" text-anchor="start">保存起點、warp與設定</text><text x="24" y="534" fill="#153454" font-size="27" font-weight="650" text-anchor="start">既有實測另附原圖與來源</text></g><rect x="24" y="805" width="1624" height="110" rx="18" fill="#FFF4CC" stroke="#E9B54A" stroke-width="2"/><text x="45" y="855" fill="#153454" font-size="34" font-weight="800" text-anchor="start">用獨立幾何與完整失敗成本決定是否採用。</text></svg>