<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2770"><defs><linearGradient id="steel"><stop offset="0" stop-color="#B4C0CC"/><stop offset=".45" stop-color="#EDF1F4"/><stop offset="1" stop-color="#8495A5"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2770" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="30" y="58" fill="#153454" font-size="40" font-weight="800" text-anchor="start">快取與重參數化，是兩種不同準備</text><text x="30" y="150" fill="#5D7184" font-size="25" font-weight="500" text-anchor="start">工程圖解｜機制示意，非本輪模型實測</text><g transform="translate(24,180) scale(1.4)"><rect x="0" y="0" width="510" height="560" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="22" y="47" fill="#153454" font-size="29" font-weight="800" text-anchor="start">固定詞彙先編碼</text><g transform="translate(10,68) scale(.94 .90)"><text x="45" y="70" fill="#1765CA" font-size="35" font-weight="500" text-anchor="start">螺栓</text><rect x="155" y="42" width="24" height="35" rx="0" fill="#BED8EF" stroke="white" stroke-width="2"/><rect x="184" y="42" width="24" height="35" rx="0" fill="#1765CA" stroke="white" stroke-width="2"/><rect x="213" y="42" width="24" height="35" rx="0" fill="#1765CA" stroke="white" stroke-width="2"/><rect x="242" y="42" width="24" height="35" rx="0" fill="#BED8EF" stroke="white" stroke-width="2"/><rect x="271" y="42" width="24" height="35" rx="0" fill="#1765CA" stroke="white" stroke-width="2"/><rect x="300" y="42" width="24" height="35" rx="0" fill="#1765CA" stroke="white" stroke-width="2"/><rect x="329" y="42" width="24" height="35" rx="0" fill="#BED8EF" stroke="white" stroke-width="2"/><rect x="358" y="42" width="24" height="35" rx="0" fill="#1765CA" stroke="white" stroke-width="2"/><text x="45" y="160" fill="#17876B" font-size="35" font-weight="500" text-anchor="start">墊圈</text><rect x="155" y="132" width="24" height="35" rx="0" fill="#BED8EF" stroke="white" stroke-width