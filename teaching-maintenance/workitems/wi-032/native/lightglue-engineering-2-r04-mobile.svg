<svg xmlns="http://www.w3.org/2000/svg" width="768" height="2770"><defs><linearGradient id="steel"><stop offset="0" stop-color="#B4C0CC"/><stop offset=".45" stop-color="#EDF1F4"/><stop offset="1" stop-color="#8495A5"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="768" height="2770" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="30" y="58" fill="#153454" font-size="40" font-weight="800" text-anchor="start">圖內關係與跨圖關係，一起更新表示</text><text x="30" y="150" fill="#5D7184" font-size="25" font-weight="500" text-anchor="start">工程圖解｜機制示意，非本輪模型實測</text><g transform="translate(24,180) scale(1.4)"><rect x="0" y="0" width="510" height="560" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="22" y="47" fill="#153454" font-size="29" font-weight="800" text-anchor="start">圖內注意力</text><g transform="translate(10,68) scale(.94 .90)"><path d="M60,65 L155,155" fill="none" stroke="#C1D8EF" stroke-width="3" stroke-dasharray=""/><path d="M155,155 L60,270" fill="none" stroke="#C1D8EF" stroke-width="3" stroke-dasharray=""/><path d="M60,65 L60,270" fill="none" stroke="#C1D8EF" stroke-width="3" stroke-dasharray=""/><path d="M325,65 L425,155" fill="none" stroke="#C1D8EF" stroke-width="3" stroke-dasharray=""/><path d="M425,155 L325,270" fill="none" stroke="#C1D8EF" stroke-width="3" stroke-dasharray=""/><path d="M325,65 L325,270" fill="none" stroke="#C1D8EF" stroke-width="3" stroke-dasharray=""/><circle cx="60" cy="65" r="19" fill="#1765CA"/><text x="60" y="73" fill="white" font-size="21" font-weight="700" text-anchor="middle">A</text><circle cx="155" cy="155" r="19" fill="#1765CA"/><text x="155" y="163" fill="white" font-size="21" font-weight="700" text-anchor="middle">B</text><circle cx="60" cy="270" r="19" fill="#1765CA"/><text x="60" y="278" fill="white" font-size="21" font-weight="700" text-anchor="middle">C</text><circle cx="325" cy="65" r="19" fill="#1765CA"/><text x="325" y="73" fill="white" font-s