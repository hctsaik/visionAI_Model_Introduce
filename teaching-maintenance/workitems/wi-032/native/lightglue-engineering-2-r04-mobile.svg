CA"/><text x="325" y="73" fill="white" font-size="21" font-weight="700" text-anchor="middle">A</text><circle cx="425" cy="155" r="19" fill="#1765CA"/><text x="425" y="163" fill="white" font-size="21" font-weight="700" text-anchor="middle">B</text><circle cx="325" cy="270" r="19" fill="#1765CA"/><text x="325" y="278" fill="white" font-size="21" font-weight="700" text-anchor="middle">C</text><text x="30" y="350" fill="#153454" font-size="29" font-weight="500" text-anchor="start">跨圖候選關係</text></g><text x="24" y="492" fill="#153454" font-size="27" font-weight="650" text-anchor="start">另一張圖提供候選關係</text><text x="24" y="534" fill="#153454" font-size="27" font-weight="650" text-anchor="start">更新點的表示</text></g><g transform="translate(24,1780) scale(1.4)"><rect x="0" y="0" width="510" height="560" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="22" y="47" fill="#153454" font-size="29" font-weight="800" text-anchor="start">可匹配性與分配</text><g transform="translate(10,68) scale(.94 .90)"><text x="75" y="65" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">A</text><text x="365" y="65" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">A</text><text x="75" y="135" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">B</text><text x="365" y="135" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">B</text><path d="M110,125 L353,125" fill="none" stroke="#E98B1D" stroke-width="3" stroke-dasharray="8 7"/><text x="75" y="205" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">C</text><text x="365" y="205" fill="#E98B1D" font-size="32" font-weight="800" text-anchor="start">C</text><path d="M110,195 L353,195" fill="none" stroke="#E98B1D" stroke-width="3" stroke-dasharray="8 7"/><path d="M110,125 L353,195" fill="none" stroke="#E98B1D" stroke-width="3" stroke-dasharray="8 7"/><path d="M110,195 L353,125" fill="none" stroke="#E98B1D" stroke-width="3" stroke-dasharray="8 7"/><text x="35" y="330" fill="#E98B1D" font-size="31" font-weight="500" text-anchor="start">可保留未匹配點</text><text x="35" y="385" fill="#153454" font-size="28" font-weight="500" text-anchor="start">不是所有點都要硬配對</text></g><text x="24" y="492" fill="#153454" font-size="27" font-weight="650" text-anchor="start">部分點可不匹配</text><text x="24" y="534" fill="#153454" font-size="27" font-weight="650" text-anchor="start">輸出點對仍需幾何核對</text></g><rect x="24" y="2600" width="720" height="140" rx="18" fill="#FFF4CC" stroke="#E9B54A" stroke-width="2"/><text x="45" y="2650" fill="#153454" font-size="31" font-weight="800" text-anchor="start">不是每個點都必須硬配到另一張圖。</text></svg>