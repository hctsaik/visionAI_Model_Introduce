<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941"><defs><linearGradient id="steel"><stop offset="0" stop-color="#B4C0CC"/><stop offset=".45" stop-color="#EDF1F4"/><stop offset="1" stop-color="#8495A5"/></linearGradient></defs><style>text{font-family:"Microsoft JhengHei",sans-serif}</style><rect x="0" y="0" width="1672" height="941" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="30" y="58" fill="#153454" font-size="47" font-weight="800" text-anchor="start">點對夠多，仍要看幾何分布</text><text x="30" y="117" fill="#5D7184" font-size="25" font-weight="500" text-anchor="start">工程圖解｜機制示意，非本輪模型實測</text><g transform="translate(24,150) scale(1)"><rect x="0" y="0" width="510" height="560" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="22" y="47" fill="#153454" font-size="29" font-weight="800" text-anchor="start">正確且分散的點對</text><g transform="translate(10,68) scale(.94 .90)"><rect x="40" y="30" width="170" height="280" rx="16" fill="white" stroke="#C1D8EF" stroke-width="2"/><rect x="290" y="75" width="170" height="280" rx="16" fill="white" stroke="#C1D8EF" stroke-width="2"/><circle cx="65" cy="65" r="7" fill="#E98B1D"/><circle cx="315" cy="110" r="7" fill="#E98B1D"/><path d="M65,65 L315,110" fill="none" stroke="#C1D8EF" stroke-width="2" stroke-dasharray=""/><circle cx="175" cy="65" r="7" fill="#E98B1D"/><circle cx="425" cy="110" r="7" fill="#E98B1D"/><path d="M175,65 L425,110" fill="none" stroke="#C1D8EF" stroke-width="2" stroke-dasharray=""/><circle cx="65" cy="270" r="7" fill="#E98B1D"/><circle cx="315" cy="315" r="7" fill="#E98B1D"/><path d="M65,270 L315,315" fill="none" stroke="#C1D8EF" stroke-width="2" stroke-dasharray=""/><circle cx="175" cy="270" r="7" fill="#E98B1D"/><circle cx="425" cy="315" r="7" fill="#E98B1D"/><path d="M175,270 L425,315" fill="none" stroke="#C1D8EF" stroke-width="2" stroke-dasharray=""/><text x="40" y="400" fill="#153454" font-size="27" font-weight="500" text-anchor="start">四組分散且正確的對應示意</text></g><text x="24" y="492" fill="#153454" font-size="27" font-weight="650" text-anchor="start">平面單應最少4組</text><text x="24" y="534" fill="#153454" font-size="27" font-weight="650" text-anchor="start">還要非退化且對應正確</text></g><path d="M541,430 L573,430" fill="none" stroke="#1765CA" stroke-width="5" stroke-dasharray=""/><path d="M573,430 L561.2941876694152,435.654551943446 L561.2941876694152,424.345448056554 Z" fill="#1765CA"/><g transform="translate(581,150) scale(1)"><rect x="0" y="0" width="510" height="560" rx="18" fill="#F8FBFF" stroke="#C1D8EF" stroke-width="2"/><text x="22" y="47" fill="#153454" font-size="29" font-weight="800" text-anchor="start">幾何估計與內點</text><g transform="translate(10,68) scale(.94 .90)"><polygon points="45,45 185,45 185,275 45,275" fill="#EDF5FC" stroke="#1765CA" stroke-width="3"/><polygon points="280,100 440,65 425,330 285,285" fill="#EDF5FC" stroke="#1765CA" stroke-width="3"/><circle cx="45" cy="45" r="7" fill="#E98B1D"/><circle cx="280" cy="100" r="7" fill="#E98B1D"/><path d="M45,45 L280,100" fill="none" stroke="#C1D8EF" stroke-width="2" stroke-dasharray=""/><circle cx="185" cy="45" r="7" fill="#E98B1D"/><circle cx="440" cy="65" r="7" fill="#E98B1D"/><path d="M185,45 L440,65" fill="none" stroke="#C1D8EF" stroke-width="2" stroke-dasharray=""/><circle cx="185" cy="275" r="7" fill="#E98B1D"/><circle cx="425" cy="330" r="7" fill="#E98B1D"/><path d="M185,275 L425,330" fill="none" stroke="#C1D8EF" stroke-width="2" stroke-dasharray=""/><circle cx="45" cy="275" r="7" fill="#E98B1D"/><circle cx="285" cy="285" r="7" fill="#E98B1D"/><path d="M45,275 L285,285" fill="none" stroke="#C1D8EF" stroke-width="2" stroke-dasharray=""/><path d="M110,160 L360,310" fill="none" stroke="#E98B1D" stroke-width="3" stroke-dasharray="8 6"/><text x="145" y="225" fill="#E98B1D" font-size="35" font-weight="500" text-anchor="start">？</text><text x="30" y="395" fill="#153454" font-size="29" font-weight="500" text-anchor="start">估計H；另查候選外點</text></g><text x="24" y="492" fill="#153454" font-size="2